    <line id="hl-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" x1="17.00" y1="54.00" x2="170.00" y2="54.00" class="geom-line geom-overlay" />
    <line id="hl-seg-CG" data-ref="/ C G /" data-aliases="/ G C / | / C F G / | } C F G {" x1="17.00" y1="54.00" x2="191.00" y2="54.00" class="geom-line geom-overlay" />
    <line id="hl-seg-FD" data-ref="/ F D /" data-aliases="/ D F / | / F G D / | } F G D {" x1="170.00" y1="54.00" x2="260.00" y2="54.00" class="geom-line geom-overlay" />
    <line id="hl-seg-GD" data-ref="/ G D /" data-aliases="/ D G /" x1="191.00" y1="54.00" x2="260.00" y2="54.00" class="geom-line geom-overlay" />
