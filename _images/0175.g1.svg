    <circle id="el-pt-F" data-ref="F" data-type="point" cx="170.00" cy="54.00" r="2.0" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="191.00" cy="54.00" r="2.0" class="geom-point" />
