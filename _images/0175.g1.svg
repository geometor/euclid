    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F / | / F G D / | } F G D {" data-type="segment" x1="170.00" y1="54.00" x2="260.00" y2="54.00" class="geom-line geom-overlay" />
    <line id="el-seg-GD" data-ref="/ G D /" data-aliases="/ D G /" data-type="segment" x1="191.00" y1="54.00" x2="260.00" y2="54.00" class="geom-line geom-overlay" />
