    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A / | / A E B / | } A E B {" data-type="segment" x1="17.00" y1="26.00" x2="138.00" y2="26.00" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C / | / C F D / | / C G D / | } C F D { | } C G D {" data-type="segment" x1="17.00" y1="54.00" x2="260.00" y2="54.00" class="geom-line" />
