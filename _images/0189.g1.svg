<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 60" width="130" height="60" class="euclid-graphic" data-graphic-id="0189.g1" data-folio="0189" data-graphic="g1" data-proposition="V.23">
  <style>
    .euclid-graphic {
      font-family: "Times New Roman", "Georgia", serif;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
      transition: r 0.15s, fill 0.15s;
    }
    .geom-label {
      font-size: 16px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: rgba(239, 68, 68, 0.18) !important;
      stroke: #ef4444 !important;
    }
  </style>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Base Construction Elements (Table Border) -->
  <g id="elements">
    <polygon id="el-box" points="6.00,6.00 124.00,6.00 124.00,54.00 6.00,54.00" class="geom-line"/>
  </g>

  <!-- Constructed Graphics (Magnitude Symbol Entries) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="18.00" y1="28.00" x2="34.00" y2="28.00" class="geom-line geom-overlay"/>
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="44.00" y1="28.00" x2="60.00" y2="28.00" class="geom-line geom-overlay"/>
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="70.00" y1="28.00" x2="86.00" y2="28.00" class="geom-line geom-overlay"/>
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="96.00" y1="28.00" x2="112.00" y2="28.00" class="geom-line geom-overlay"/>
    <line id="el-mag-E" data-ref="E" data-aliases="/ E /" data-type="segment" x1="18.00" y1="49.00" x2="34.00" y2="49.00" class="geom-line geom-overlay"/>
    <line id="el-mag-F" data-ref="F" data-aliases="/ F /" data-type="segment" x1="44.00" y1="49.00" x2="60.00" y2="49.00" class="geom-line geom-overlay"/>
    <line id="el-mag-G" data-ref="G" data-aliases="/ G /" data-type="segment" x1="70.00" y1="49.00" x2="86.00" y2="49.00" class="geom-line geom-overlay"/>
    <line id="el-mag-H" data-ref="H" data-aliases="/ H /" data-type="segment" x1="96.00" y1="49.00" x2="112.00" y2="49.00" class="geom-line geom-overlay"/>
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /" x1="18.00" y1="28.00" x2="34.00" y2="28.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /" x1="44.00" y1="28.00" x2="60.00" y2="28.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /" x1="70.00" y1="28.00" x2="86.00" y2="28.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="96.00" y1="28.00" x2="112.00" y2="28.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-E" data-ref="E" data-aliases="/ E /" x1="18.00" y1="49.00" x2="34.00" y2="49.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-F" data-ref="F" data-aliases="/ F /" x1="44.00" y1="49.00" x2="60.00" y2="49.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-G" data-ref="G" data-aliases="/ G /" x1="70.00" y1="49.00" x2="86.00" y2="49.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-H" data-ref="H" data-aliases="/ H /" x1="96.00" y1="49.00" x2="112.00" y2="49.00" class="geom-line geom-overlay"/>
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="26.00" cy="20.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="52.00" cy="20.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="78.00" cy="20.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="104.00" cy="20.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="26.00" cy="41.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="52.00" cy="41.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="78.00" cy="41.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="104.00" cy="41.00" r="2.0" class="geom-point geom-overlay"/>
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="26.00" y="20.00" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="52.00" y="20.00" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="78.00" y="20.00" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="104.00" y="20.00" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="26.00" y="41.00" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="52.00" y="41.00" class="geom-label">F</text>
    <text id="lbl-G" data-ref="G" x="78.00" y="41.00" class="geom-label">G</text>
    <text id="lbl-H" data-ref="H" x="104.00" y="41.00" class="geom-label">H</text>
  </g>
</svg>
