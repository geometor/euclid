<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 193 178" width="193" height="178" class="euclid-graphic" data-graphic-id="0317.g2" data-folio="0317" data-graphic="g2" data-proposition="XI.22">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements"></g>

  <!-- Constructed Graphics (Triangles, Segments, Angle Wedges) -->
  <g id="graphics">
    <!-- Triangles -->
    <polygon id="el-tri-GHK" data-ref="&lt; G H K &gt;" data-aliases="&lt; H G K &gt;" data-type="polygon" points="21,151 53,30 94,147" class="geom-polygon" />
    <polygon id="el-tri-KHL" data-ref="&lt; K H L &gt;" data-aliases="&lt; H K L &gt;" data-type="polygon" points="94,147 53,30 171,66" class="geom-polygon" />
    <polygon id="el-tri-GHL" data-ref="&lt; G H L &gt;" data-aliases="&lt; H G L &gt;" data-type="polygon" points="21,151 53,30 171,66" class="geom-polygon" />
    <polygon id="el-tri-GKL" data-ref="&lt; G K L &gt;" data-aliases="&lt; K G L &gt;" data-type="polygon" points="21,151 94,147 171,66" class="geom-polygon" />

    <!-- Segments -->
    <line id="el-seg-GH" data-ref="/ G H /" data-aliases="/ H G /" data-type="segment" x1="21" y1="151" x2="53" y2="30" class="geom-line" />
    <line id="el-seg-HK" data-ref="/ H K /" data-aliases="/ K H /" data-type="segment" x1="53" y1="30" x2="94" y2="147" class="geom-line" />
    <line id="el-seg-GK" data-ref="/ G K /" data-aliases="/ K G /" data-type="segment" x1="21" y1="151" x2="94" y2="147" class="geom-line" />
    <line id="el-seg-HL" data-ref="/ H L /" data-aliases="/ L H /" data-type="segment" x1="53" y1="30" x2="171" y2="66" class="geom-line" />
    <line id="el-seg-KL" data-ref="/ K L /" data-aliases="/ L K /" data-type="segment" x1="94" y1="147" x2="171" y2="66" class="geom-line" />
    <line id="el-seg-GL" data-ref="/ G L /" data-aliases="/ L G /" data-type="segment" x1="21" y1="151" x2="171" y2="66" class="geom-line" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-GHK" data-ref="&lt; G H K )" data-aliases="&lt; K H G )" data-type="wedge" d="M 53.00 30.00 L 47.89 49.34 A 20.0 20.0 0 0 0 59.62 48.87 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-KHL" data-ref="&lt; K H L )" data-aliases="&lt; L H K )" data-type="wedge" d="M 53.00 30.00 L 59.62 48.87 A 20.0 20.0 0 0 0 72.12 35.83 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-GHL" data-ref="&lt; G H L )" data-aliases="&lt; L H G )" data-type="wedge" d="M 53.00 30.00 L 47.38 51.27 A 22.0 22.0 0 0 0 74.03 36.42 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-GHK" data-ref="&lt; G H K &gt;" data-aliases="&lt; H G K &gt;" points="21,151 53,30 94,147" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-KHL" data-ref="&lt; K H L &gt;" data-aliases="&lt; H K L &gt;" points="94,147 53,30 171,66" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-GHL" data-ref="&lt; G H L &gt;" data-aliases="&lt; H G L &gt;" points="21,151 53,30 171,66" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-GKL" data-ref="&lt; G K L &gt;" data-aliases="&lt; K G L &gt;" points="21,151 94,147 171,66" class="geom-polygon geom-overlay" />

    <line id="hl-seg-GH" data-ref="/ G H /" data-aliases="/ H G /" x1="21" y1="151" x2="53" y2="30" class="geom-line geom-overlay" />
    <line id="hl-seg-HK" data-ref="/ H K /" data-aliases="/ K H /" x1="53" y1="30" x2="94" y2="147" class="geom-line geom-overlay" />
    <line id="hl-seg-GK" data-ref="/ G K /" data-aliases="/ K G /" x1="21" y1="151" x2="94" y2="147" class="geom-line geom-overlay" />
    <line id="hl-seg-HL" data-ref="/ H L /" data-aliases="/ L H /" x1="53" y1="30" x2="171" y2="66" class="geom-line geom-overlay" />
    <line id="hl-seg-KL" data-ref="/ K L /" data-aliases="/ L K /" x1="94" y1="147" x2="171" y2="66" class="geom-line geom-overlay" />
    <line id="hl-seg-GL" data-ref="/ G L /" data-aliases="/ L G /" x1="21" y1="151" x2="171" y2="66" class="geom-line geom-overlay" />

    <path id="hl-ang-GHK" data-ref="&lt; G H K )" data-aliases="&lt; K H G )" d="M 53.00 30.00 L 47.89 49.34 A 20.0 20.0 0 0 0 59.62 48.87 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-KHL" data-ref="&lt; K H L )" data-aliases="&lt; L H K )" d="M 53.00 30.00 L 59.62 48.87 A 20.0 20.0 0 0 0 72.12 35.83 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-GHL" data-ref="&lt; G H L )" data-aliases="&lt; L H G )" d="M 53.00 30.00 L 47.38 51.27 A 22.0 22.0 0 0 0 74.03 36.42 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="53" cy="30" r="3.2" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="21" cy="151" r="3.2" class="geom-point" />
    <circle id="el-pt-K" data-ref="K" data-type="point" cx="94" cy="147" r="3.2" class="geom-point" />
    <circle id="el-pt-L" data-ref="L" data-type="point" cx="171" cy="66" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-H" data-ref="H" x="45" y="32" text-anchor="middle" class="geom-label">H</text>
    <text id="lbl-L" data-ref="L" x="179" y="70" text-anchor="middle" class="geom-label">L</text>
    <text id="lbl-G" data-ref="G" x="14" y="159" text-anchor="middle" class="geom-label">G</text>
    <text id="lbl-K" data-ref="K" x="101" y="157" text-anchor="middle" class="geom-label">K</text>
  </g>
</svg>
