<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 183 171" width="183" height="171" class="euclid-graphic" data-graphic-id="0334.g1" data-folio="0334" data-graphic="g1" data-proposition="XI.28">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements"></g>

  <!-- Constructed Graphics (Solid, Diagonal Plane, Faces, Triangles, Segments) -->
  <g id="graphics">
    <!-- Solid AB and Diagonal Plane CDEF -->
    <polygon id="el-sol-AB" data-ref="&lt; A B &gt;" data-aliases="&lt; B A &gt;" data-type="polygon" points="24,150 40,68 58,22 156,22 140,104 122,150" class="geom-polygon" />
    <polygon id="el-pl-CDEF" data-ref="&lt; C D E F &gt;" data-aliases="&lt; C E &gt; | &lt; E C &gt;" data-type="polygon" points="42,104 24,150 138,68 156,22" class="geom-polygon" />

    <!-- Parallelogram Faces -->
    <polygon id="el-pl-CA" data-ref="&lt; C G A D &gt;" data-aliases="&lt; C A &gt; | &lt; A C &gt;" data-type="polygon" points="42,104 140,104 122,150 24,150" class="geom-polygon" />
    <polygon id="el-pl-EB" data-ref="&lt; B F E H &gt;" data-aliases="&lt; E B &gt; | &lt; B E &gt;" data-type="polygon" points="58,22 156,22 138,68 40,68" class="geom-polygon" />
    <polygon id="el-pl-GE" data-ref="&lt; G F E A &gt;" data-aliases="&lt; G E &gt; | &lt; E G &gt;" data-type="polygon" points="140,104 156,22 138,68 122,150" class="geom-polygon" />
    <polygon id="el-pl-CH" data-ref="&lt; C B H D &gt;" data-aliases="&lt; C H &gt; | &lt; H C &gt;" data-type="polygon" points="42,104 58,22 40,68 24,150" class="geom-polygon" />

    <!-- Prism Triangles -->
    <polygon id="el-tri-CGF" data-ref="&lt; C G F &gt;" data-aliases="&lt; F G C &gt;" data-type="polygon" points="42,104 140,104 156,22" class="geom-polygon" />
    <polygon id="el-tri-CFB" data-ref="&lt; C F B &gt;" data-aliases="&lt; B F C &gt;" data-type="polygon" points="42,104 156,22 58,22" class="geom-polygon" />
    <polygon id="el-tri-ADE" data-ref="&lt; A D E &gt;" data-aliases="&lt; E D A &gt;" data-type="polygon" points="122,150 24,150 138,68" class="geom-polygon" />
    <polygon id="el-tri-DEH" data-ref="&lt; D E H &gt;" data-aliases="&lt; H E D &gt;" data-type="polygon" points="24,150 138,68 40,68" class="geom-polygon" />

    <!-- Edges and Diagonals -->
    <line id="el-seg-BF" data-ref="/ B F /" data-aliases="/ F B /" data-type="segment" x1="58" y1="22" x2="156" y2="22" class="geom-line" />
    <line id="el-seg-FE" data-ref="/ F E /" data-aliases="/ E F /" data-type="segment" x1="156" y1="22" x2="138" y2="68" class="geom-line" />
    <line id="el-seg-EH" data-ref="/ E H /" data-aliases="/ H E /" data-type="segment" x1="138" y1="68" x2="40" y2="68" class="geom-line" />
    <line id="el-seg-HB" data-ref="/ H B /" data-aliases="/ B H /" data-type="segment" x1="40" y1="68" x2="58" y2="22" class="geom-line" />

    <line id="el-seg-CG" data-ref="/ C G /" data-aliases="/ G C /" data-type="segment" x1="42" y1="104" x2="140" y2="104" class="geom-line" />
    <line id="el-seg-GA" data-ref="/ G A /" data-aliases="/ A G /" data-type="segment" x1="140" y1="104" x2="122" y2="150" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="122" y1="150" x2="24" y2="150" class="geom-line" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" data-type="segment" x1="24" y1="150" x2="42" y2="104" class="geom-line" />

    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="58" y1="22" x2="42" y2="104" class="geom-line" />
    <line id="el-seg-FG" data-ref="/ F G /" data-aliases="/ G F /" data-type="segment" x1="156" y1="22" x2="140" y2="104" class="geom-line" />
    <line id="el-seg-EA" data-ref="/ E A /" data-aliases="/ A E /" data-type="segment" x1="138" y1="68" x2="122" y2="150" class="geom-line" />
    <line id="el-seg-HD" data-ref="/ H D /" data-aliases="/ D H /" data-type="segment" x1="40" y1="68" x2="24" y2="150" class="geom-line" />

    <line id="el-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" data-type="segment" x1="42" y1="104" x2="156" y2="22" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="24" y1="150" x2="138" y2="68" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-sol-AB" data-ref="&lt; A B &gt;" data-aliases="&lt; B A &gt;" points="24,150 40,68 58,22 156,22 140,104 122,150" class="geom-polygon geom-overlay" />
    <polygon id="hl-pl-CDEF" data-ref="&lt; C D E F &gt;" data-aliases="&lt; C E &gt; | &lt; E C &gt;" points="42,104 24,150 138,68 156,22" class="geom-polygon geom-overlay" />

    <polygon id="hl-pl-CA" data-ref="&lt; C G A D &gt;" data-aliases="&lt; C A &gt; | &lt; A C &gt;" points="42,104 140,104 122,150 24,150" class="geom-polygon geom-overlay" />
    <polygon id="hl-pl-EB" data-ref="&lt; B F E H &gt;" data-aliases="&lt; E B &gt; | &lt; B E &gt;" points="58,22 156,22 138,68 40,68" class="geom-polygon geom-overlay" />
    <polygon id="hl-pl-GE" data-ref="&lt; G F E A &gt;" data-aliases="&lt; G E &gt; | &lt; E G &gt;" points="140,104 156,22 138,68 122,150" class="geom-polygon geom-overlay" />
    <polygon id="hl-pl-CH" data-ref="&lt; C B H D &gt;" data-aliases="&lt; C H &gt; | &lt; H C &gt;" points="42,104 58,22 40,68 24,150" class="geom-polygon geom-overlay" />

    <polygon id="hl-tri-CGF" data-ref="&lt; C G F &gt;" data-aliases="&lt; F G C &gt;" points="42,104 140,104 156,22" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-CFB" data-ref="&lt; C F B &gt;" data-aliases="&lt; B F C &gt;" points="42,104 156,22 58,22" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-ADE" data-ref="&lt; A D E &gt;" data-aliases="&lt; E D A &gt;" points="122,150 24,150 138,68" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-DEH" data-ref="&lt; D E H &gt;" data-aliases="&lt; H E D &gt;" points="24,150 138,68 40,68" class="geom-polygon geom-overlay" />

    <line id="hl-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" x1="42" y1="104" x2="156" y2="22" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="24" y1="150" x2="138" y2="68" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="58" cy="22" r="3.2" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="156" cy="22" r="3.2" class="geom-point" />
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="40" cy="68" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="138" cy="68" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="42" cy="104" r="3.2" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="140" cy="104" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="24" cy="150" r="3.2" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="122" cy="150" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-B" data-ref="B" x="58" y="15" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-F" data-ref="F" x="162" y="16" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-H" data-ref="H" x="30" y="72" text-anchor="middle" class="geom-label">H</text>
    <text id="lbl-E" data-ref="E" x="148" y="73" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-C" data-ref="C" x="49" y="117" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-G" data-ref="G" x="150" y="109" text-anchor="middle" class="geom-label">G</text>
    <text id="lbl-D" data-ref="D" x="22" y="165" text-anchor="middle" class="geom-label">D</text>
