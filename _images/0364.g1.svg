<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226 103" width="226" height="103" class="euclid-graphic" data-graphic-id="0364.g1" data-folio="0364" data-graphic="g1" data-proposition="XI.37">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #000000;
      stroke-width: 1.6;
      stroke-dasharray: 4,3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-pl-CAD-1" x1="22" y1="20" x2="148" y2="20" class="geom-line" />
    <line id="el-pl-CAD-2" x1="148" y1="20" x2="148" y2="68" class="geom-line" />
    <line id="el-pl-CAD-3" x1="22" y1="68" x2="22" y2="20" class="geom-line" />
    <line id="el-pl-AB-1" x1="22" y1="68" x2="74" y2="88" class="geom-line" />
    <line id="el-pl-AB-2" x1="74" y1="88" x2="204" y2="88" class="geom-line" />
    <line id="el-pl-AB-3" x1="204" y1="88" x2="148" y2="68" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Planes, Triangle, Segments, Angles) -->
  <g id="graphics">
    <polygon id="el-pl-CAD" data-ref="&lt; C A D &gt;" data-aliases="&lt; D A C &gt; | &lt; A D C &gt;" data-type="polygon" points="22,20 148,20 148,68 22,68" class="geom-polygon" />
    <polygon id="el-pl-AB" data-ref="&lt; A B &gt;" data-aliases="&lt; B A &gt;" data-type="polygon" points="22,68 148,68 204,88 74,88" class="geom-polygon" />
    <polygon id="el-tri-EGF" data-ref="&lt; E G F &gt;" data-aliases="&lt; G F E &gt; | &lt; F E G &gt;" data-type="polygon" points="95,38 78,68 95,82" class="geom-polygon" />

    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A / | / A G D / | / D G A /" data-type="segment" x1="22" y1="68" x2="148" y2="68" class="geom-line" />
    <line id="el-seg-AG" data-ref="/ A G /" data-aliases="/ G A /" data-type="segment" x1="22" y1="68" x2="78" y2="68" class="geom-line" />
    <line id="el-seg-GD" data-ref="/ G D /" data-aliases="/ D G /" data-type="segment" x1="78" y1="68" x2="148" y2="68" class="geom-line" />
    <line id="el-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" data-type="segment" x1="95" y1="38" x2="95" y2="82" class="geom-line" />
    <line id="el-seg-FG" data-ref="/ F G /" data-aliases="/ G F /" data-type="segment" x1="95" y1="82" x2="78" y2="68" class="geom-line" />
    <line id="el-seg-EG" data-ref="/ E G /" data-aliases="/ G E /" data-type="segment" x1="95" y1="38" x2="78" y2="68" class="geom-line" />

    <path id="el-ang-EGF" data-ref="&lt; E G F )" data-aliases="&lt; F G E )" data-type="wedge" d="M 78.00 68.00 L 83.92 57.56 A 12.0 12.0 0 0 1 87.26 75.63 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-EFG" data-ref="&lt; E F G )" data-aliases="&lt; G F E )" data-type="wedge" d="M 95.00 82.00 L 85.74 74.37 A 12.0 12.0 0 0 1 95.00 70.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-pl-CAD" data-ref="&lt; C A D &gt;" data-aliases="&lt; D A C &gt; | &lt; A D C &gt;" points="22,20 148,20 148,68 22,68" class="geom-polygon geom-overlay" />
    <polygon id="hl-pl-AB" data-ref="&lt; A B &gt;" data-aliases="&lt; B A &gt;" points="22,68 148,68 204,88 74,88" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-EGF" data-ref="&lt; E G F &gt;" data-aliases="&lt; G F E &gt; | &lt; F E G &gt;" points="95,38 78,68 95,82" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A / | / A G D / | / D G A /" x1="22" y1="68" x2="148" y2="68" class="geom-line geom-overlay" />
    <line id="hl-seg-AG" data-ref="/ A G /" data-aliases="/ G A /" x1="22" y1="68" x2="78" y2="68" class="geom-line geom-overlay" />
    <line id="hl-seg-GD" data-ref="/ G D /" data-aliases="/ D G /" x1="78" y1="68" x2="148" y2="68" class="geom-line geom-overlay" />
    <line id="hl-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" x1="95" y1="38" x2="95" y2="82" class="geom-line geom-overlay" />
    <line id="hl-seg-FG" data-ref="/ F G /" data-aliases="/ G F /" x1="95" y1="82" x2="78" y2="68" class="geom-line geom-overlay" />
    <line id="hl-seg-EG" data-ref="/ E G /" data-aliases="/ G E /" x1="95" y1="38" x2="78" y2="68" class="geom-line geom-overlay" />

    <path id="hl-ang-EGF" data-ref="&lt; E G F )" data-aliases="&lt; F G E )" d="M 78.00 68.00 L 83.92 57.56 A 12.0 12.0 0 0 1 87.26 75.63 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-EFG" data-ref="&lt; E F G )" data-aliases="&lt; G F E )" d="M 95.00 82.00 L 85.74 74.37 A 12.0 12.0 0 0 1 95.00 70.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="22" cy="20" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="95" cy="38" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="148" cy="68" r="3.2" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="22" cy="68" r="3.2" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="78" cy="68" r="3.2" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="95" cy="82" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="204" cy="88" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-C" data-ref="C" x="12" y="24" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-E" data-ref="E" x="85" y="38" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-D" data-ref="D" x="158" y="64" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-A" data-ref="A" x="12" y="72" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-G" data-ref="G" x="72" y="81" text-anchor="middle" class="geom-label">G</text>
    <text id="lbl-F" data-ref="F" x="104" y="86" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-B" data-ref="B" x="214" y="96" text-anchor="middle" class="geom-label">B</text>
  </g>
</svg>
