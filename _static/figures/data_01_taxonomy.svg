<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" width="660" height="230" class="euclid-graphic" data-graphic-id="data_01_taxonomy" data-proposition="D.def.1-6">
  <style>
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #18181b;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-bold {
      stroke: #18181b;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-circle, .geom-curve, .geom-ellipse {
      stroke: #18181b;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-arc {
      stroke: #18181b;
      stroke-width: 1.6;
      stroke-linecap: round;
      fill: none;
    }
    .geom-dashed, .geom-line-dashed, .geom-arc-dashed, .geom-aux, .geom-Auxiliary, .geom-construction {
      stroke: #18181b;
      stroke-width: 1.4;
      stroke-dasharray: 4, 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-ray {
      stroke: #18181b;
      stroke-width: 1.3;
      stroke-linecap: round;
      fill: none;
      opacity: 0.85;
    }
    .geom-tick-mark {
      stroke: #16a34a;
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .geom-ang-arc {
      fill: none;
      stroke: #16a34a;
      stroke-width: 2.1;
      stroke-linecap: round;
    }
    .grid-line {
      stroke: #18181b;
      stroke-width: 0.9;
      stroke-linecap: round;
      fill: none;
      opacity: 0.28;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.05;
      stroke: none;
    }
    .geom-polygon-bordered, .geom-polygon-stroked, .geom-space {
      fill: #000000;
      fill-opacity: 0.05;
      stroke: #18181b;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .geom-polygon-gnomon {
      fill: #c88a1e;
      fill-opacity: 0.16;
      stroke: none;
    }
    .wedge, .angle {
      fill: #c88a1e;
      fill-opacity: 0.24;
      stroke: #c88a1e;
      stroke-width: 1.9;
      stroke-linejoin: round;
    }
    .geom-point {
      fill: #18181b;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      font-style: normal;
      fill: #18181b;
    }
    .geom-label-sm {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 11.2px;
      font-weight: 700;
      font-style: normal;
      fill: #18181b;
      opacity: 0.9;
    }
    .geom-label-accent {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 11.2px;
      font-weight: 700;
      fill: #c88a1e;
    }
    .geom-overlay {
      opacity: 0;
    }
    path.geom-tick-1 {
      marker-mid: url(#geom-tick-1);
    }
    path.geom-tick-2 {
      marker-mid: url(#geom-tick-2);
    }
    path.geom-tick-3 {
      marker-mid: url(#geom-tick-3);
    }
  </style>
