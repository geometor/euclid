      stroke: #18181b;
      stroke-width: 0.9;
      stroke-linecap: round;
      fill: none;
      opacity: 0.28;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.05;
      stroke: none;
    }
