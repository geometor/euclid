    .geom-label-accent {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 11.2px;
      font-weight: 700;
      fill: #c88a1e;
    }
    .geom-overlay {
      opacity: 0;
    }
    path.geom-tick-1 {
      marker-mid: url(#geom-tick-1);
    }
    path.geom-tick-2 {
