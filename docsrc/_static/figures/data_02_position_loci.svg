      stroke-dasharray: 4, 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-ray {
      stroke: #18181b;
      stroke-width: 1.3;
      stroke-linecap: round;
      fill: none;
      opacity: 0.85;
    }
    .geom-tick-mark {
      stroke: #16a34a;
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .geom-ang-arc {
      fill: none;
      stroke: #16a34a;
      stroke-width: 2.1;
      stroke-linecap: round;
    }
