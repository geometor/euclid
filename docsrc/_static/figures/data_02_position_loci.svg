      stroke: #18181b;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-arc {
      stroke: #18181b;
      stroke-width: 1.6;
      stroke-linecap: round;
      fill: none;
    }
