      fill: #000000;
      fill-opacity: 0.05;
      stroke: #18181b;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .geom-polygon-gnomon {
      fill: #c88a1e;
      fill-opacity: 0.16;
      stroke: none;
    }
    .wedge, .angle {
      fill: #c88a1e;
      fill-opacity: 0.24;
      stroke: #c88a1e;
      stroke-width: 1.9;
      stroke-linejoin: round;
    }
    .geom-point {
      fill: #18181b;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      font-style: normal;
      fill: #18181b;
