<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -7 200 169" class="euclid-graphic" data-graphic-id="0318.g1" width="200" height="169">
  <title>Euclid's Elements, Book I, Proposition 26 (Thales's Pyramid Height)</title>
  <desc>Right-angled triangle ABC with vertical pole DE parallel to AB casting equal shadow ratios.</desc>
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
