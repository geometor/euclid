<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 220 100" class="euclid-graphic" data-graphic-id="0333.g1" width="220" height="100">
  <title>Euclid's Elements, Book I, Proposition 32 (General Triangle Inscribed in a Rectangle)</title>
  <desc>A general scalene triangle inscribed in a rectangle with a perpendicular dropped from the top vertex dividing it into two smaller rectangles.</desc>
  <style>
