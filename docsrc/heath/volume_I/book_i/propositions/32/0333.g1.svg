      stroke-width: 1.5;
      stroke-linecap: round;
      fill: none;
    }
    .geom-tick-mark {
      stroke: var(--geom-assert);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .geom-ang-arc {
      fill: none;
      stroke: var(--geom-assert);
      stroke-width: 2.2;
      stroke-linecap: round;
    }
    .grid-line {
      stroke: var(--geom-fg);
      stroke-width: 0.9;
