      stroke-linecap: round;
      stroke-linejoin: round;
      transition: fill-opacity 0.15s, stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon-gnomon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.14;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
