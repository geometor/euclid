<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 134 122" width="134" height="122" class="euclid-graphic" data-graphic-id="0421.g1" data-folio="0421" data-graphic="g1" data-proposition="II.13">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active, path.geom-polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics -->
  <g id="graphics">
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-type="polygon" points="113,25 18,93 113,93" class="geom-polygon" />
    <path id="el-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A )" data-type="angle" d="M 18,93 L 34.26,81.36 A 20,20 0 0,1 38,93 Z" class="geom-polygon" style="fill-opacity: 0;" />
    <path id="el-ang-ACB" data-ref="&lt; A C B )" data-aliases="&lt; B C A )" data-type="angle" d="M 113,93 L 98,93 L 98,78 L 113,78 Z" class="geom-polygon" style="fill-opacity: 0;" />

    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="113" y1="25" x2="18" y2="93" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="18" y1="93" x2="113" y2="93" class="geom-line" />
    <line id="el-seg-CA" data-ref="/ C A /" data-aliases="/ A C /" data-type="segment" x1="113" y1="93" x2="113" y2="25" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" points="113,25 18,93 113,93" class="geom-polygon geom-overlay" />
    <path id="hl-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A )" d="M 18,93 L 34.26,81.36 A 20,20 0 0,1 38,93 Z" class="geom-polygon geom-overlay" />
    <path id="hl-ang-ACB" data-ref="&lt; A C B )" data-aliases="&lt; B C A )" d="M 113,93 L 98,93 L 98,78 L 113,78 Z" class="geom-polygon geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="113" y1="25" x2="18" y2="93" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="18" y1="93" x2="113" y2="93" class="geom-line geom-overlay" />
    <line id="hl-seg-CA" data-ref="/ C A /" data-aliases="/ A C /" x1="113" y1="93" x2="113" y2="25" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="113" cy="25" r="3" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="18" cy="93" r="3" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="113" cy="93" r="3" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="113" y="13" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="18" y="106" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="113" y="106" class="geom-label">C</text>
  </g>
</svg>