<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 130" width="215" height="130" class="euclid-graphic" data-graphic-id="0025.g1" data-folio="0025" data-graphic="g1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s;
    }
    .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2.5;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circle K and Extended Lines) -->
  <g id="elements">
    <circle id="el-cir-K" data-ref="( K B )" data-aliases="( B H C )" data-type="circle" cx="61.5" cy="69.5" r="53.0" class="geom-circle" />
    <line id="el-line-DBF" data-ref="[ D F ]" data-aliases="/ D B F /" data-type="line" x1="22.0" y1="16.5" x2="122.0" y2="16.5" class="geom-line" />
    <line id="el-line-KCG" data-ref="[ K G ]" data-aliases="/ K C G /" data-type="line" x1="61.5" y1="69.5" x2="190.0" y2="69.5" class="geom-line" />
    <line id="el-line-KHF" data-ref="[ K F ]" data-aliases="/ K H F /" data-type="line" x1="61.5" y1="69.5" x2="114.5" y2="16.5" class="geom-line" />
    <line id="el-line-BHG" data-ref="[ B G ]" data-aliases="/ B H G /" data-type="line" x1="61.5" y1="16.5" x2="190.0" y2="69.5" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Segments and Arc BH) -->
  <g id="graphics">
    <!-- Arc / Sector BH -->
    <path id="el-arc-BH" data-ref="&lt; B K H )" data-aliases="( K B )&lt; B K H &gt; | &lt; H K B )" data-type="wedge" d="M 61.5 69.5 L 61.5 16.5 A 53 53 0 0 1 98.98 32.02 Z" class="wedge angle geom-overlay" />

    <!-- Tangent DBF and sub-segments -->
    <line id="el-seg-DF" data-ref="/ D F /" data-aliases="/ F D / | / D B F /" data-type="segment" x1="22.0" y1="16.5" x2="114.5" y2="16.5" class="geom-line" />
    <line id="el-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" data-type="segment" x1="22.0" y1="16.5" x2="61.5" y2="16.5" class="geom-line" />
    <line id="el-seg-BF" data-ref="/ B F /" data-aliases="/ F B /" data-type="segment" x1="61.5" y1="16.5" x2="114.5" y2="16.5" class="geom-line" />

    <!-- Parallel KG and sub-segments -->
    <line id="el-seg-KG" data-ref="/ K G /" data-aliases="/ G K / | / K C G /" data-type="segment" x1="61.5" y1="69.5" x2="190.0" y2="69.5" class="geom-line" />
    <line id="el-seg-KC" data-ref="/ K C /" data-aliases="/ C K /" data-type="segment" x1="61.5" y1="69.5" x2="114.5" y2="69.5" class="geom-line" />
    <line id="el-seg-CG" data-ref="/ C G /" data-aliases="/ G C /" data-type="segment" x1="114.5" y1="69.5" x2="190.0" y2="69.5" class="geom-line" />

    <!-- Secant KHF and sub-segments -->
    <line id="el-seg-KF" data-ref="/ K F /" data-aliases="/ F K / | / K H F /" data-type="segment" x1="61.5" y1="69.5" x2="114.5" y2="16.5" class="geom-line" />
    <line id="el-seg-KH" data-ref="/ K H /" data-aliases="/ H K /" data-type="segment" x1="61.5" y1="69.5" x2="98.98" y2="32.02" class="geom-line" />
    <line id="el-seg-HF" data-ref="/ H F /" data-aliases="/ F H /" data-type="segment" x1="98.98" y1="32.02" x2="114.5" y2="16.5" class="geom-line" />

    <!-- Verging line BHG and sub-segments -->
    <line id="el-seg-BG" data-ref="/ B G /" data-aliases="/ G B / | / B H G /" data-type="segment" x1="61.5" y1="16.5" x2="190.0" y2="69.5" class="geom-line" />
    <line id="el-seg-BH" data-ref="/ B H /" data-aliases="/ H B /" data-type="segment" x1="61.5" y1="16.5" x2="98.98" y2="32.02" class="geom-line" />
    <line id="el-seg-HG" data-ref="/ H G /" data-aliases="/ G H /" data-type="segment" x1="98.98" y1="32.02" x2="190.0" y2="69.5" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-cir-K" data-ref="( K B )" data-aliases="( B H C )" cx="61.5" cy="69.5" r="53.0" class="geom-circle geom-overlay" />
    <path id="hl-arc-BH" data-ref="&lt; B K H )" data-aliases="( K B )&lt; B K H &gt; | &lt; H K B )" d="M 61.5 69.5 L 61.5 16.5 A 53 53 0 0 1 98.98 32.02 Z" class="wedge angle geom-overlay" />
    <line id="hl-seg-DF" data-ref="/ D F /" data-aliases="/ F D / | / D B F /" x1="22.0" y1="16.5" x2="114.5" y2="16.5" class="geom-line geom-overlay" />
    <line id="hl-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" x1="22.0" y1="16.5" x2="61.5" y2="16.5" class="geom-line geom-overlay" />
    <line id="hl-seg-BF" data-ref="/ B F /" data-aliases="/ F B /" x1="61.5" y1="16.5" x2="114.5" y2="16.5" class="geom-line geom-overlay" />
    <line id="hl-seg-KG" data-ref="/ K G /" data-aliases="/ G K / | / K C G /" x1="61.5" y1="69.5" x2="190.0" y2="69.5" class="geom-line geom-overlay" />
    <line id="hl-seg-KC" data-ref="/ K C /" data-aliases="/ C K /" x1="61.5" y1="69.5" x2="114.5" y2="69.5" class="geom-line geom-overlay" />
    <line id="hl-seg-CG" data-ref="/ C G /" data-aliases="/ G C /" x1="114.5" y1="69.5" x2="190.0" y2="69.5" class="geom-line geom-overlay" />
    <line id="hl-seg-KF" data-ref="/ K F /" data-aliases="/ F K / | / K H F /" x1="61.5" y1="69.5" x2="114.5" y2="16.5" class="geom-line geom-overlay" />
    <line id="hl-seg-KH" data-ref="/ K H /" data-aliases="/ H K /" x1="61.5" y1="69.5" x2="98.98" y2="32.02" class="geom-line geom-overlay" />
    <line id="hl-seg-HF" data-ref="/ H F /" data-aliases="/ F H /" x1="98.98" y1="32.02" x2="114.5" y2="16.5" class="geom-line geom-overlay" />
    <line id="hl-seg-BG" data-ref="/ B G /" data-aliases="/ G B / | / B H G /" x1="61.5" y1="16.5" x2="190.0" y2="69.5" class="geom-line geom-overlay" />
    <line id="hl-seg-BH" data-ref="/ B H /" data-aliases="/ H B /" x1="61.5" y1="16.5" x2="98.98" y2="32.02" class="geom-line geom-overlay" />
    <line id="hl-seg-HG" data-ref="/ H G /" data-aliases="/ G H /" x1="98.98" y1="32.02" x2="190.0" y2="69.5" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="22.0" cy="16.5" r="3" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="61.5" cy="16.5" r="3" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="114.5" cy="16.5" r="3" class="geom-point" />
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="98.98" cy="32.02" r="3" class="geom-point" />
    <circle id="el-pt-K" data-ref="K" data-type="point" cx="61.5" cy="69.5" r="3" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="114.5" cy="69.5" r="3" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="190.0" cy="69.5" r="3" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-D" data-ref="D" x="22.0" y="11.0" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-B" data-ref="B" x="61.5" y="11.0" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-F" data-ref="F" x="114.5" y="11.0" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-H" data-ref="H" x="97.0" y="45.0" text-anchor="middle" class="geom-label">H</text>
    <text id="lbl-K" data-ref="K" x="61.5" y="83.0" text-anchor="middle" class="geom-label">K</text>
    <text id="lbl-C" data-ref="C" x="121.0" y="83.0" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-G" data-ref="G" x="190.0" y="83.0" text-anchor="middle" class="geom-label">G</text>
  </g>
</svg>
