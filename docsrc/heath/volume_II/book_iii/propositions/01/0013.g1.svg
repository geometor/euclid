    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="96" y1="162" x2="30.55" y2="60" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="96" y1="162" x2="153.6" y2="133.2" class="geom-line" />
