    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="30.55" y1="60" x2="153.6" y2="133.2" class="geom-line geom-overlay" />
    <polyline id="hl-sec-ADB" data-ref="/ A D B /" data-aliases="/ B D A / | } A D B { | } B D A {" points="96,162 63.28,111 30.55,60" fill="none" class="geom-line geom-overlay" />
    <polyline id="hl-sec-AEC" data-ref="/ A E C /" data-aliases="/ C E A / | } A E C { | } C E A {" points="96,162 124.8,147.6 153.6,133.2" fill="none" class="geom-line geom-overlay" />
    <polyline id="hl-sec-BAC" data-ref="/ B A C /" data-aliases="/ C A B / | } B A C { | } C A B {" points="30.55,60 96,162 153.6,133.2" fill="none" class="geom-line geom-overlay" />
  </g>

