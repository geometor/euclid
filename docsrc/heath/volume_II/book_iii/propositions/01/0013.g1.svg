    <line id="hl-seg-EO" data-ref="/ E O /" data-aliases="/ O E /" x1="124.8" y1="147.6" x2="96" y2="90" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="96" y1="162" x2="63.28" y2="111" class="geom-line geom-overlay" />
