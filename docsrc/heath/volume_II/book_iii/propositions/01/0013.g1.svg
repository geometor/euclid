    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="96" y1="162" x2="124.8" y2="147.6" class="geom-line geom-overlay" />
    <line id="el-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" data-type="segment" x1="124.8" y1="147.6" x2="153.6" y2="133.2" class="geom-line geom-overlay" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="30.55" y1="60" x2="153.6" y2="133.2" class="geom-line geom-overlay" />
    <polyline id="el-sec-ADB" data-ref="/ A D B /" data-aliases="/ B D A / | } A D B { | } B D A {" data-type="section" points="96,162 63.28,111 30.55,60" fill="none" class="geom-line geom-overlay" />
    <polyline id="el-sec-AEC" data-ref="/ A E C /" data-aliases="/ C E A / | } A E C { | } C E A {" data-type="section" points="96,162 124.8,147.6 153.6,133.2" fill="none" class="geom-line geom-overlay" />
    <polyline id="el-sec-BAC" data-ref="/ B A C /" data-aliases="/ C A B / | } B A C { | } C A B {" data-type="section" points="30.55,60 96,162 153.6,133.2" fill="none" class="geom-line geom-overlay" />
  </g>

