    <line id="el-seg-FH" data-ref="/ F H /" data-aliases="/ H F /" data-type="segment" x1="66.00" y1="70.00" x2="111.88" y2="45.53" class="geom-line geom-overlay" />
    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" data-type="segment" x1="66.00" y1="70.00" x2="123.00" y2="39.60" class="geom-line geom-overlay" />

    <!-- Toggleable Segments FA, GA, FX, GX, FY, GY -->
    <line id="el-seg-FA" data-ref="/ F A /" data-aliases="/ A F /" data-type="segment" x1="66.00" y1="70.00" x2="118.00" y2="70.00" class="geom-line geom-overlay" />
    <line id="el-seg-GA" data-ref="/ G A /" data-aliases="/ A G /" data-type="segment" x1="88.50" y1="58.00" x2="118.00" y2="70.00" class="geom-line geom-overlay" />
