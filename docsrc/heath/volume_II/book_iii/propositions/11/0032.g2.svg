    <path id="hl-ang-DGX" data-ref="&lt; D G X )" data-aliases="&lt; X G D )" d="M 88.50 58.00 L 99.09 52.35 A 12.0 12.0 0 0 1 100.50 57.75 Z" class="wedge angle geom-overlay" />
