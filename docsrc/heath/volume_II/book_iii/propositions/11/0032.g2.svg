    <line id="hl-seg-GA" data-ref="/ G A /" data-aliases="/ A G /" x1="88.50" y1="58.00" x2="118.00" y2="70.00" class="geom-line geom-overlay" />
    <line id="hl-seg-FX" data-ref="/ F X /" data-aliases="/ X F /" x1="66.00" y1="70.00" x2="116.46" y2="57.42" class="geom-line geom-overlay" />
    <line id="hl-seg-GX" data-ref="/ G X /" data-aliases="/ X G /" x1="88.50" y1="58.00" x2="116.46" y2="57.42" class="geom-line geom-overlay" />
