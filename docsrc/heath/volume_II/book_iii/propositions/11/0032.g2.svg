    <line id="el-seg-FG" data-ref="/ F G /" data-aliases="/ G F /" data-type="segment" x1="66.00" y1="70.00" x2="88.50" y2="58.00" class="geom-line" />
    <line id="el-seg-GH" data-ref="/ G H /" data-aliases="/ H G /" data-type="segment" x1="88.50" y1="58.00" x2="111.88" y2="45.53" class="geom-line" />
