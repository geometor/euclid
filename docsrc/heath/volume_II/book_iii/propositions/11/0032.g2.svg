    <path id="hl-arc-DXA" data-ref="( G A )" data-aliases="( G D ) | ( A X D )" d="M 123.00 39.60 C 122.00 47.00, 114.00 54.00, 116.46 57.42 C 114.50 63.00, 118.00 66.00, 118.00 70.00 C 116.00 76.00, 111.00 81.00, 105.00 84.00" class="geom-arc geom-overlay" />
