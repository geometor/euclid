    <path id="el-arc-DXA" data-ref="( G A )" data-aliases="( G D ) | ( A X D )" data-type="circle" d="M 123.00 39.60 C 122.00 47.00, 114.00 54.00, 116.46 57.42 C 114.50 63.00, 118.00 66.00, 118.00 70.00 C 116.00 76.00, 111.00 81.00, 105.00 84.00" class="geom-arc" />
    <line id="el-line-FD" data-ref="[ F G ]" data-aliases="[ G F ] | [ F D ]" data-type="line" x1="56.00" y1="75.33" x2="123.00" y2="39.60" class="geom-line geom-overlay" />
  </g>

  <!-- Constructed Graphics -->
