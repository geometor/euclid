<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 113 161" width="113" height="161" class="euclid-graphic" data-graphic-id="0061.g2" data-folio="0061" data-graphic="g2" data-proposition="III.25">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle, .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Semicircle ABC) -->
  <g id="elements">
    <path id="el-arc-ABC" data-ref="( A B C )" data-aliases="&lt; A B C ) | ( D A )" data-type="circle" d="M 85.00 22.00 A 58.0 58.0 0 0 0 85.00 138.00" class="geom-arc" />
  </g>

  <!-- Constructed Graphics (Polygon, Angles, Segments & Section) -->
  <g id="graphics">
    <polygon id="el-tri-ABD" data-ref="&lt; A B D &gt;" data-type="polygon" points="85.00,22.00 27.00,80.00 85.00,80.00" class="geom-polygon" />

    <!-- Angles -->
    <path id="el-ang-ABD" data-ref="&lt; A B D )" data-aliases="&lt; D B A )" data-type="wedge" d="M 27.00 80.00 L 39.73 67.27 A 18.0 18.0 0 0 1 45.00 80.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BAD" data-ref="&lt; B A D )" data-aliases="&lt; D A B )" data-type="wedge" d="M 85.00 22.00 L 85.00 40.00 A 18.0 18.0 0 0 1 72.27 34.73 Z" class="wedge angle geom-overlay" />

    <!-- Segments -->
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="85.00" y1="22.00" x2="85.00" y2="138.00" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="85.00" y1="22.00" x2="85.00" y2="80.00" class="geom-line geom-overlay" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" data-type="segment" x1="85.00" y1="80.00" x2="85.00" y2="138.00" class="geom-line geom-overlay" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="27.00" y1="80.00" x2="85.00" y2="80.00" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="85.00" y1="22.00" x2="27.00" y2="80.00" class="geom-line" />
    <polyline id="el-sec-ADC" data-ref="/ A D C /" data-aliases="/ C D A / | } A D C { | } C D A {" data-type="section" points="85.00,22.00 85.00,80.00 85.00,138.00" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <path id="hl-cseg-ABC" data-ref="( A B C )" data-aliases="&lt; A B C ) | ( D A )" d="M 85.00 22.00 A 58.0 58.0 0 0 0 85.00 138.00 Z" class="wedge angle geom-overlay" />
    <polygon id="hl-tri-ABD" data-ref="&lt; A B D &gt;" points="85.00,22.00 27.00,80.00 85.00,80.00" class="geom-polygon geom-overlay" />
    <path id="hl-ang-ABD" data-ref="&lt; A B D )" data-aliases="&lt; D B A )" d="M 27.00 80.00 L 39.73 67.27 A 18.0 18.0 0 0 1 45.00 80.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-BAD" data-ref="&lt; B A D )" data-aliases="&lt; D A B )" d="M 85.00 22.00 L 85.00 40.00 A 18.0 18.0 0 0 1 72.27 34.73 Z" class="wedge angle geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="85.00" y1="22.00" x2="85.00" y2="138.00" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="85.00" y1="22.00" x2="85.00" y2="80.00" class="geom-line geom-overlay" />
    <line id="hl-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" x1="85.00" y1="80.00" x2="85.00" y2="138.00" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="27.00" y1="80.00" x2="85.00" y2="80.00" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="85.00" y1="22.00" x2="27.00" y2="80.00" class="geom-line geom-overlay" />
    <polyline id="hl-sec-ADC" data-ref="/ A D C /" data-aliases="/ C D A / | } A D C { | } C D A {" points="85.00,22.00 85.00,80.00 85.00,138.00" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="85.00" cy="22.00" r="3" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="27.00" cy="80.00" r="3" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="85.00" cy="138.00" r="3" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="85.00" cy="80.00" r="3" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="94" y="21" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="17" y="85" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="94" y="147" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="95" y="85" text-anchor="middle" class="geom-label">D</text>
  </g>
</svg>
