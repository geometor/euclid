  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #ef4444;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #d6cfc5;
        --geom-bg: #1e1e20;
        --geom-point-stroke: #1e1e20;
        --geom-poly-fill: #d6cfc5;
        --geom-accent: #ef4444;
      }
    }
    .euclid-graphic {
      font-family: 'EB Garamond', 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: var(--geom-bg);
    }
    .geom-line {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-bold {
      stroke: var(--geom-fg);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve, .geom-ellipse {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: var(--geom-fg);
      stroke-width: 1.6;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed, .geom-line-dashed, .geom-arc-dashed, .geom-aux, .geom-Auxiliary, .geom-construction {
      stroke: var(--geom-fg);
      stroke-width: 1.5;
      stroke-dasharray: 4, 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc-dotted {
      stroke: var(--geom-fg);
      stroke-width: 1.5;
      stroke-dasharray: 2.5, 2.5;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-ray {
      stroke: var(--geom-fg);
      stroke-width: 1.3;
      stroke-linecap: round;
      fill: none;
      opacity: 0.85;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-tick {
      stroke: var(--geom-fg);
      stroke-width: 1.5;
      stroke-linecap: round;
      fill: none;
    }
    .grid-line {
      stroke: var(--geom-fg);
      stroke-width: 0.9;
      stroke-linecap: round;
      fill: none;
      opacity: 0.65;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-polygon-bordered, .geom-polygon-stroked, .geom-space {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.04;
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: fill-opacity 0.15s, stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon-gnomon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.14;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .wedge, .angle {
      fill: var(--geom-accent);
      fill-opacity: 0.24;
      stroke: var(--geom-accent);
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-dot {
      fill: var(--geom-fg);
      stroke: none;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-label {
      font-size: 14.5px;
      font-weight: bold;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-roman {
      font-size: 14.5px;
      font-weight: bold;
      font-style: normal;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-size: 11px;
      font-weight: bold;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sub {
      font-size: 11px;
      font-style: normal;
      font-weight: bold;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: var(--geom-accent) !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
