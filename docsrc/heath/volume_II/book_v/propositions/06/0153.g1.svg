    <line id="el-line-KD" data-ref="[ K D ]" data-aliases="[ D K ] | [ C D ]" data-type="line" x1="27.00" y1="84.00" x2="173.00" y2="84.00" class="geom-line geom-overlay"/>
    <!-- Division Tick Marks -->
    <line x1="71.00" y1="24.50" x2="71.00" y2="31.50" class="geom-tick"/>
    <line x1="115.00" y1="24.50" x2="115.00" y2="31.50" class="geom-tick"/>
    <line x1="159.00" y1="24.50" x2="159.00" y2="31.50" class="geom-tick"/>
    <line x1="56.00" y1="80.50" x2="56.00" y2="87.50" class="geom-tick"/>
    <line x1="85.00" y1="80.50" x2="85.00" y2="87.50" class="geom-tick"/>
    <line x1="115.00" y1="80.50" x2="115.00" y2="87.50" class="geom-tick"/>
    <line x1="144.00" y1="80.50" x2="144.00" y2="87.50" class="geom-tick"/>
  </g>

  <!-- Constructed Graphics -->
  <g id="graphics">
    <!-- Sub-segments along AB -->
    <line id="el-seg-AG" data-ref="/ A G /" data-aliases="/ G A /" data-type="segment" x1="27.00" y1="28.00" x2="159.00" y2="28.00" class="geom-line"/>
    <line id="el-seg-GB" data-ref="/ G B /" data-aliases="/ B G /" data-type="segment" x1="159.00" y1="28.00" x2="204.00" y2="28.00" class="geom-line"/>
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="27.00" y1="28.00" x2="204.00" y2="28.00" class="geom-line geom-overlay"/>

    <!-- Standalone Magnitude E -->
    <line id="el-mag-E" data-ref="E" data-aliases="/ E /" data-type="segment" x1="27.00" y1="52.00" x2="71.00" y2="52.00" class="geom-line"/>

