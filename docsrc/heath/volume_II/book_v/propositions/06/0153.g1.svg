    <circle id="el-pt-K" data-ref="K" data-type="point" cx="27.00" cy="84.00" r="2.5" class="geom-point"/>
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="56.00" cy="84.00" r="2.5" class="geom-point"/>
    <circle id="el-pt-C1" data-ref="C_1" data-type="point" cx="85.00" cy="84.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-C2" data-ref="C_2" data-type="point" cx="115.00" cy="84.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="144.00" cy="84.00" r="2.5" class="geom-point"/>
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="173.00" cy="84.00" r="2.5" class="geom-point"/>
