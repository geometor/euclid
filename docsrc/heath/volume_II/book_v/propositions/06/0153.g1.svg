    <line id="el-seg-CK" data-ref="/ C K /" data-aliases="/ K C /" data-type="segment" x1="27.00" y1="84.00" x2="56.00" y2="84.00" class="geom-line"/>
    <line id="el-seg-CH" data-ref="/ C H /" data-aliases="/ H C /" data-type="segment" x1="56.00" y1="84.00" x2="144.00" y2="84.00" class="geom-line"/>
