    <line id="hl-seg-GB" data-ref="/ G B /" data-aliases="/ B G /" x1="159.00" y1="28.00" x2="204.00" y2="28.00" class="geom-line geom-overlay"/>
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="27.00" y1="28.00" x2="204.00" y2="28.00" class="geom-line geom-overlay"/>
