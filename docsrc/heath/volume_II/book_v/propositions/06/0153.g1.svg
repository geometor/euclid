    <line id="el-seg-KD" data-ref="/ K D /" data-aliases="/ D K /" data-type="segment" x1="27.00" y1="84.00" x2="173.00" y2="84.00" class="geom-line geom-overlay"/>

    <!-- Standalone Magnitude F -->
    <line id="el-mag-F" data-ref="F" data-aliases="/ F /" data-type="segment" x1="27.00" y1="107.00" x2="56.00" y2="107.00" class="geom-line"/>
  </g>

