    <line id="hl-seg-CH" data-ref="/ C H /" data-aliases="/ H C /" x1="56.00" y1="84.00" x2="144.00" y2="84.00" class="geom-line geom-overlay"/>
    <line id="hl-seg-HD" data-ref="/ H D /" data-aliases="/ D H /" x1="144.00" y1="84.00" x2="173.00" y2="84.00" class="geom-line geom-overlay"/>
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="56.00" y1="84.00" x2="173.00" y2="84.00" class="geom-line geom-overlay"/>
    <line id="hl-seg-KH" data-ref="/ K H /" data-aliases="/ H K /" x1="27.00" y1="84.00" x2="144.00" y2="84.00" class="geom-line geom-overlay"/>
    <line id="hl-seg-KD" data-ref="/ K D /" data-aliases="/ D K /" x1="27.00" y1="84.00" x2="173.00" y2="84.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-F" data-ref="F" data-aliases="/ F /" x1="27.00" y1="107.00" x2="56.00" y2="107.00" class="geom-line geom-overlay"/>
  </g>

