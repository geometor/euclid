  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="27.00" y="17.00" class="geom-label">A</text>
    <text id="lbl-G" data-ref="G" x="159.00" y="17.00" class="geom-label">G</text>
