    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="131" y1="28" x2="203" y2="118" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B / | / B D C /" x1="19" y1="118" x2="203" y2="118" class="geom-line geom-overlay" />
