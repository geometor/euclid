    <path id="hl-ang-ACB" data-ref="&lt; A C B )" data-aliases="&lt; B C A ) | &lt; A C D ) | &lt; D C A )" d="M 203.00 118.00 L 190.51 102.38 A 20.0 20.0 0 0 0 183.00 118.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ADB" data-ref="&lt; A D B )" data-aliases="&lt; B D A )" d="M 131.00 118.00 L 131.00 104.00 A 14.0 14.0 0 0 0 117.00 118.00 Z" class="wedge angle geom-overlay" />
