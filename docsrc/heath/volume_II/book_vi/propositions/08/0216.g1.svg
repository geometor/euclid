    <path id="el-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A ) | &lt; A B D ) | &lt; D B A )" data-type="wedge" d="M 19.00 118.00 L 36.15 104.22 A 22.0 22.0 0 0 1 41.00 118.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ACB" data-ref="&lt; A C B )" data-aliases="&lt; B C A ) | &lt; A C D ) | &lt; D C A )" data-type="wedge" d="M 203.00 118.00 L 190.51 102.38 A 20.0 20.0 0 0 0 183.00 118.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ADB" data-ref="&lt; A D B )" data-aliases="&lt; B D A )" data-type="wedge" d="M 131.00 118.00 L 131.00 104.00 A 14.0 14.0 0 0 0 117.00 118.00 Z" class="wedge angle geom-overlay" />
