    <line id="el-seg-AG" data-ref="/ A G /" data-aliases="/ G A /" data-type="segment" x1="96.0" y1="160.0" x2="141.9" y2="141.2" class="geom-line" />
    <line id="el-seg-GC" data-ref="/ G C /" data-aliases="/ C G /" data-type="segment" x1="141.9" y1="141.2" x2="174.0" y2="128.0" class="geom-line" />

