    <polygon id="el-poly-GBC" data-ref="&lt; G B C &gt;" data-aliases="&lt; B G C &gt; | &lt; C G B &gt;" data-type="polygon" points="141.9,141.2 148.0,152.0 174.0,128.0" class="geom-polygon" />
    <polygon id="el-poly-EGC" data-ref="&lt; E G C &gt;" data-aliases="&lt; G E C &gt; | &lt; C E G &gt;" data-type="polygon" points="114.0,92.0 141.9,141.2 174.0,128.0" class="geom-polygon" />

