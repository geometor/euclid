    <polyline id="el-sec-CED" data-ref="/ C E D /" data-aliases="/ D E C / | } C E D { | } D E C {" data-type="section" points="46.0,139.5 92.0,139.5 178.0,139.5" class="geom-line geom-overlay" />
  </g>

