    <line id="el-line-AB" data-ref="[ A B ]" data-aliases="[ B A ]" data-type="line" x1="19.0" y1="111.5" x2="224.0" y2="111.5" class="geom-line" />
    <line id="el-line-AF" data-ref="[ A F ]" data-aliases="[ F A ]" data-type="line" x1="19.0" y1="111.5" x2="91.5" y2="13.5" class="geom-line" />
