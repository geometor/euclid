    <line id="el-seg-AF" data-ref="/ A F /" data-aliases="/ F A /" data-type="segment" x1="19.0" y1="111.5" x2="91.5" y2="13.5" class="geom-line" />
    <line id="el-seg-FB" data-ref="/ F B /" data-aliases="/ B F /" data-type="segment" x1="91.5" y1="13.5" x2="224.0" y2="111.5" class="geom-line" />

