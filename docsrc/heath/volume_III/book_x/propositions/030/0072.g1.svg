    <line id="el-line-CD" data-ref="[ C D ]" data-aliases="[ D C ]" data-type="line" x1="46.0" y1="139.5" x2="178.0" y2="139.5" class="geom-line" />
    <line x1="92.0" y1="136.0" x2="92.0" y2="143.0" class="geom-line" />
  </g>

