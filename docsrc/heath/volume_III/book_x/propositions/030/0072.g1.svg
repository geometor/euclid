    <polygon id="el-poly-AFB" data-ref="&lt; A F B &gt;" data-aliases="&lt; B F A &gt; | &lt; F A B &gt;" data-type="polygon" points="19.0,111.5 91.5,13.5 224.0,111.5" class="geom-polygon" />
