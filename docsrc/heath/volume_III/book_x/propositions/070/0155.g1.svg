    <polyline id="el-sec-CFD" data-ref="/ C F D /" data-aliases="/ D F C / | } C F D { | } D F C {" data-type="section" points="52.5,50.0 52.5,108.0 52.5,141.0" class="geom-line geom-overlay" />
