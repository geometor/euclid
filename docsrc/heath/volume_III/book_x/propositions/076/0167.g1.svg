<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 205 40" width="100%" height="100%" class="euclid-graphic" data-graphic-id="0167.g1" data-folio="0167" data-graphic="g1" data-proposition="X.76">
  <style>
    .euclid-graphic {
      font-family: "Times New Roman", Times, Georgia, serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s ease, stroke-width 0.15s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-AB" data-ref="[ A B ]" data-aliases="[ B A ]" data-type="line" x1="17.0" y1="18.5" x2="191.0" y2="18.5" class="geom-line" />
    <line x1="91.0" y1="15.0" x2="91.0" y2="22.0" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Segments & Sections) -->
  <g id="graphics">
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="17.0" y1="18.5" x2="191.0" y2="18.5" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="17.0" y1="18.5" x2="91.0" y2="18.5" class="geom-line geom-overlay" />
    <line id="el-seg-CB" data-ref="/ C B /" data-aliases="/ B C /" data-type="segment" x1="91.0" y1="18.5" x2="191.0" y2="18.5" class="geom-line geom-overlay" />
    <polyline id="el-sec-ACB" data-ref="/ A C B /" data-aliases="/ B C A / | } A C B { | } B C A {" data-type="section" points="17.0,18.5 91.0,18.5 191.0,18.5" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="17.0" y1="18.5" x2="191.0" y2="18.5" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="17.0" y1="18.5" x2="91.0" y2="18.5" class="geom-line geom-overlay" />
    <line id="hl-seg-CB" data-ref="/ C B /" data-aliases="/ B C /" x1="91.0" y1="18.5" x2="191.0" y2="18.5" class="geom-line geom-overlay" />
    <polyline id="hl-sec-ACB" data-ref="/ A C B /" data-aliases="/ B C A / | } A C B { | } B C A {" points="17.0,18.5 91.0,18.5 191.0,18.5" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="17.0" cy="18.5" r="2.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="91.0" cy="18.5" r="2.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="191.0" cy="18.5" r="2.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="20.0" y="30.0" class="geom-label">A</text>
    <text id="lbl-C" data-ref="C" x="91.0" y="30.0" class="geom-label">C</text>
    <text id="lbl-B" data-ref="B" x="188.0" y="30.0" class="geom-label">B</text>
  </g>
</svg>
