<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 287 143" width="287" height="143" class="euclid-graphic" data-graphic-id="0300.g1" data-folio="0300" data-graphic="g1" data-proposition="XI.14">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #000000;
      stroke-width: 1.6;
      stroke-dasharray: 4,3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Plane Boundaries) -->
  <g id="elements">
    <!-- Plane CD boundary -->
    <line id="el-plane-CD-top" x1="43" y1="17" x2="110" y2="17" class="geom-line" />
    <line id="el-plane-CD-right" x1="110" y1="17" x2="97" y2="48" class="geom-line" />
    <line id="el-plane-CD-bottom" x1="97" y1="48" x2="33" y2="48" class="geom-line" />
    <line id="el-plane-CD-left" x1="33" y1="48" x2="43" y2="17" class="geom-line" />
    <!-- Plane EF boundary -->
    <line id="el-plane-EF-top" x1="23" y1="83" x2="109" y2="83" class="geom-line" />
    <line id="el-plane-EF-right" x1="109" y1="83" x2="94" y2="119" class="geom-line" />
    <line id="el-plane-EF-bottom" x1="94" y1="119" x2="14" y2="119" class="geom-line" />
    <line id="el-plane-EF-left" x1="14" y1="119" x2="23" y2="83" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Planes, Polygons, Segments, Angle Wedges) -->
  <g id="graphics">
    <!-- Planes CD, EF and Triangle ABK -->
    <polygon id="el-plane-CD" data-ref="&lt; C D &gt;" data-aliases="&lt; D C &gt;" data-type="polygon" points="43,17 110,17 97,48 33,48" class="geom-polygon" />
    <polygon id="el-plane-EF" data-ref="&lt; E F &gt;" data-aliases="&lt; F E &gt;" data-type="polygon" points="23,83 109,83 94,119 14,119" class="geom-polygon" />
    <polygon id="el-poly-ABK" data-ref="&lt; A B K &gt;" data-aliases="&lt; B K A &gt; | &lt; K A B &gt; | &lt; A K B &gt; | &lt; B A K &gt; | &lt; K B A &gt;" data-type="polygon" points="68,33 71,102 248,56" class="geom-polygon" />

    <!-- Segments and Sections -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="68" y1="33" x2="71" y2="102" class="geom-line" />
    <line id="el-sec-GH" data-ref="/ G H /" data-aliases="/ H G / | / G K H / | / H K G /" data-type="section" x1="268" y1="10" x2="220" y2="121" class="geom-line" />
    <line id="el-seg-GK" data-ref="/ G K /" data-aliases="/ K G /" data-type="segment" x1="268" y1="10" x2="248" y2="56" class="geom-line" />
    <line id="el-seg-KH" data-ref="/ K H /" data-aliases="/ H K /" data-type="segment" x1="248" y1="56" x2="220" y2="121" class="geom-line" />
    <line id="el-seg-AK" data-ref="/ A K /" data-aliases="/ K A /" data-type="segment" x1="68" y1="33" x2="248" y2="56" class="geom-line" />
    <line id="el-seg-BK" data-ref="/ B K /" data-aliases="/ K B /" data-type="segment" x1="71" y1="102" x2="248" y2="56" class="geom-line" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-ABK" data-ref="&lt; A B K )" data-aliases="&lt; K B A )" data-type="wedge" d="M 71.00 102.00 L 70.22 84.02 A 18.0 18.0 0 0 1 88.42 97.47 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BAK" data-ref="&lt; B A K )" data-aliases="&lt; K A B )" data-type="wedge" d="M 68.00 33.00 L 85.85 35.28 A 18.0 18.0 0 0 1 68.78 50.98 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-plane-CD" data-ref="&lt; C D &gt;" data-aliases="&lt; D C &gt;" points="43,17 110,17 97,48 33,48" class="geom-polygon geom-overlay" />
    <polygon id="hl-plane-EF" data-ref="&lt; E F &gt;" data-aliases="&lt; F E &gt;" points="23,83 109,83 94,119 14,119" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-ABK" data-ref="&lt; A B K &gt;" data-aliases="&lt; B K A &gt; | &lt; K A B &gt; | &lt; A K B &gt; | &lt; B A K &gt; | &lt; K B A &gt;" points="68,33 71,102 248,56" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="68" y1="33" x2="71" y2="102" class="geom-line geom-overlay" />
    <line id="hl-sec-GH" data-ref="/ G H /" data-aliases="/ H G / | / G K H / | / H K G /" x1="268" y1="10" x2="220" y2="121" class="geom-line geom-overlay" />
    <line id="hl-seg-GK" data-ref="/ G K /" data-aliases="/ K G /" x1="268" y1="10" x2="248" y2="56" class="geom-line geom-overlay" />
    <line id="hl-seg-KH" data-ref="/ K H /" data-aliases="/ H K /" x1="248" y1="56" x2="220" y2="121" class="geom-line geom-overlay" />
    <line id="hl-seg-AK" data-ref="/ A K /" data-aliases="/ K A /" x1="68" y1="33" x2="248" y2="56" class="geom-line geom-overlay" />
    <line id="hl-seg-BK" data-ref="/ B K /" data-aliases="/ K B /" x1="71" y1="102" x2="248" y2="56" class="geom-line geom-overlay" />

    <path id="hl-ang-ABK" data-ref="&lt; A B K )" data-aliases="&lt; K B A )" d="M 71.00 102.00 L 70.22 84.02 A 18.0 18.0 0 0 1 88.42 97.47 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-BAK" data-ref="&lt; B A K )" data-aliases="&lt; K A B )" d="M 68.00 33.00 L 85.85 35.28 A 18.0 18.0 0 0 1 68.78 50.98 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="68" cy="33" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="71" cy="102" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="110" cy="17" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="33" cy="48" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="14" cy="119" r="3.2" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="109" cy="83" r="3.2" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="268" cy="10" r="3.2" class="geom-point" />
    <circle id="el-pt-K" data-ref="K" data-type="point" cx="248" cy="56" r="3.2" class="geom-point" />
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="220" cy="121" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-C" data-ref="C" x="114" y="22" text-anchor="start" class="geom-label">C</text>
    <text id="lbl-G" data-ref="G" x="267" y="25" text-anchor="start" class="geom-label">G</text>
    <text id="lbl-A" data-ref="A" x="64" y="34" text-anchor="end" class="geom-label">A</text>
    <text id="lbl-D" data-ref="D" x="34" y="62" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-K" data-ref="K" x="252" y="61" text-anchor="start" class="geom-label">K</text>
    <text id="lbl-F" data-ref="F" x="113" y="84" text-anchor="start" class="geom-label">F</text>
    <text id="lbl-B" data-ref="B" x="67" y="110" text-anchor="end" class="geom-label">B</text>
    <text id="lbl-E" data-ref="E" x="14" y="133" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-H" data-ref="H" x="225" y="126" text-anchor="start" class="geom-label">H</text>
  </g>
</svg>
