<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 135" width="220" height="135" class="euclid-graphic" data-graphic-id="0351.g1" data-folio="0351" data-graphic="g1" data-proposition="I.40">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circles & Infinite Lines) -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
    <polygon id="el-poly-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt; | &lt; B A C &gt; | &lt; B C A &gt; | &lt; C A B &gt; | &lt; C B A &gt;" data-type="polygon" points="31,34 31,105 111,105" class="geom-polygon" />
    <polygon id="el-poly-CDE" data-ref="&lt; C D E &gt;" data-aliases="&lt; C E D &gt; | &lt; D C E &gt; | &lt; D E C &gt; | &lt; E C D &gt; | &lt; E D C &gt;" data-type="polygon" points="111,105 167,34 191,105" class="geom-polygon" />
    <polygon id="el-poly-FCE" data-ref="&lt; F C E &gt;" data-aliases="&lt; F E C &gt; | &lt; C F E &gt; | &lt; C E F &gt; | &lt; E F C &gt; | &lt; E C F &gt;" data-type="polygon" points="156,48 111,105 191,105" class="geom-polygon" />
    <line id="el-seg-BE" data-ref="/ B E /" data-aliases="/ E B / | / B C E /" data-type="segment" x1="31" y1="105" x2="191" y2="105" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="31" y1="105" x2="111" y2="105" class="geom-line" />
    <line id="el-seg-CE" data-ref="/ C E /" data-aliases="/ E C /" data-type="segment" x1="111" y1="105" x2="191" y2="105" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="31" y1="34" x2="31" y2="105" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="31" y1="34" x2="111" y2="105" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="31" y1="34" x2="167" y2="34" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C / | / C F D /" data-type="segment" x1="111" y1="105" x2="167" y2="34" class="geom-line" />
    <line id="el-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" data-type="segment" x1="111" y1="105" x2="156" y2="48" class="geom-line" />
    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" data-type="segment" x1="156" y1="48" x2="167" y2="34" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="167" y1="34" x2="191" y2="105" class="geom-line" />
    <line id="el-seg-AF" data-ref="/ A F /" data-aliases="/ F A /" data-type="segment" x1="31" y1="34" x2="156" y2="48" class="geom-line" />
    <line id="el-seg-FE" data-ref="/ F E /" data-aliases="/ E F /" data-type="segment" x1="156" y1="48" x2="191" y2="105" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt; | &lt; B A C &gt; | &lt; B C A &gt; | &lt; C A B &gt; | &lt; C B A &gt;" points="31,34 31,105 111,105" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-CDE" data-ref="&lt; C D E &gt;" data-aliases="&lt; C E D &gt; | &lt; D C E &gt; | &lt; D E C &gt; | &lt; E C D &gt; | &lt; E D C &gt;" points="111,105 167,34 191,105" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-FCE" data-ref="&lt; F C E &gt;" data-aliases="&lt; F E C &gt; | &lt; C F E &gt; | &lt; C E F &gt; | &lt; E F C &gt; | &lt; E C F &gt;" points="156,48 111,105 191,105" class="geom-polygon geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" data-aliases="/ E B / | / B C E /" x1="31" y1="105" x2="191" y2="105" class="geom-line geom-overlay" />
