    <circle id="el-pt-F" data-ref="F" data-type="point" cx="156" cy="48" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="26" y="25" text-anchor="middle" class="geom-label">A</text>
