    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="31" y1="34" x2="31" y2="105" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="31" y1="34" x2="111" y2="105" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="31" y1="34" x2="167" y2="34" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C / | / C F D /" x1="111" y1="105" x2="167" y2="34" class="geom-line geom-overlay" />
    <line id="hl-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" x1="111" y1="105" x2="156" y2="48" class="geom-line geom-overlay" />
    <line id="hl-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" x1="156" y1="48" x2="167" y2="34" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="167" y1="34" x2="191" y2="105" class="geom-line geom-overlay" />
    <line id="hl-seg-AF" data-ref="/ A F /" data-aliases="/ F A /" x1="31" y1="34" x2="156" y2="48" class="geom-line geom-overlay" />
    <line id="hl-seg-FE" data-ref="/ F E /" data-aliases="/ E F /" x1="156" y1="48" x2="191" y2="105" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="31" cy="34" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="31" cy="105" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="111" cy="105" r="3.5" class="geom-point" />
