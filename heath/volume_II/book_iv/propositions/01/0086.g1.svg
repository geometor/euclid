<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 182" width="272" height="182" class="euclid-graphic" data-graphic-id="0086.g1" data-folio="0086" data-graphic="g1" data-proposition="IV.1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle, .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <circle id="el-circle-ABC" data-ref="( O B )" data-aliases="( A B C ) | ( O C ) | ( O A )" data-type="circle" cx="93.00" cy="95.00" r="68.00" class="geom-circle" />
    <circle id="el-circle-EAF" data-ref="( C E )" data-aliases="( E A F ) | ( C A ) | ( C F )" data-type="circle" cx="161.00" cy="95.00" r="56.00" class="geom-circle" />
    <line id="el-line-BC" data-ref="[ B C ]" data-aliases="[ C B ]" data-type="line" x1="25.00" y1="95.00" x2="161.00" y2="95.00" class="geom-line geom-overlay" />
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="25.00" y1="95.00" x2="161.00" y2="95.00" class="geom-line" />
    <line id="el-seg-CA" data-ref="/ C A /" data-aliases="/ A C /" data-type="segment" x1="161.00" y1="95.00" x2="137.94" y2="43.97" class="geom-line" />
    <line id="el-seg-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="202.00" y1="30.00" x2="258.00" y2="30.00" class="geom-line" />
    <line id="el-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" data-type="segment" x1="25.00" y1="95.00" x2="105.00" y2="95.00" class="geom-line geom-overlay" />
    <line id="el-seg-CE" data-ref="/ C E /" data-aliases="/ E C /" data-type="segment" x1="161.00" y1="95.00" x2="105.00" y2="95.00" class="geom-line geom-overlay" />
    <polyline id="el-sec-BEC" data-ref="/ B E C /" data-aliases="/ C E B / | } B E C { | } C E B {" data-type="section" points="25.00,95.00 105.00,95.00 161.00,95.00" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circle-ABC" data-ref="( O B )" data-aliases="( A B C ) | ( O C ) | ( O A )" cx="93.00" cy="95.00" r="68.00" class="geom-circle geom-overlay" />
    <circle id="hl-circle-EAF" data-ref="( C E )" data-aliases="( E A F ) | ( C A ) | ( C F )" cx="161.00" cy="95.00" r="56.00" class="geom-circle geom-overlay" />
    <line id="hl-line-BC" data-ref="[ B C ]" data-aliases="[ C B ]" x1="25.00" y1="95.00" x2="161.00" y2="95.00" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="25.00" y1="95.00" x2="161.00" y2="95.00" class="geom-line geom-overlay" />
    <line id="hl-seg-CA" data-ref="/ C A /" data-aliases="/ A C /" x1="161.00" y1="95.00" x2="137.94" y2="43.97" class="geom-line geom-overlay" />
    <line id="hl-seg-D" data-ref="D" data-aliases="/ D /" x1="202.00" y1="30.00" x2="258.00" y2="30.00" class="geom-line geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" x1="25.00" y1="95.00" x2="105.00" y2="95.00" class="geom-line geom-overlay" />
    <line id="hl-seg-CE" data-ref="/ C E /" data-aliases="/ E C /" x1="161.00" y1="95.00" x2="105.00" y2="95.00" class="geom-line geom-overlay" />
    <polyline id="hl-sec-BEC" data-ref="/ B E C /" data-aliases="/ C E B / | } B E C { | } C E B {" points="25.00,95.00 105.00,95.00 161.00,95.00" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="137.94" cy="43.97" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="25.00" cy="95.00" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="161.00" cy="95.00" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="105.00" cy="95.00" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="137.94" cy="146.03" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="139.94" y="34.97" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="14.00" y="100.00" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="172.00" y="100.00" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-E" data-ref="E" x="97.00" y="112.00" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="157.94" y="168.03" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-D" data-ref="D" data-aliases="/ D /" x="230.00" y="21.00" text-anchor="middle" class="geom-label">D</text>
  </g>
</svg>
