<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 130" width="180" height="130" class="euclid-graphic" data-graphic-id="0402.g1" data-folio="0402" data-graphic="g1" data-proposition="IX.11">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Number Segments) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="34.00" y1="22.50" x2="73.00" y2="22.50" class="geom-line" />
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="32.00" y1="47.50" x2="84.00" y2="47.50" class="geom-line" />
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="34.00" y1="69.50" x2="110.00" y2="69.50" class="geom-line" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="35.00" y1="89.50" x2="134.00" y2="89.50" class="geom-line" />
    <line id="el-mag-E" data-ref="E" data-aliases="/ E /" data-type="segment" x1="31.00" y1="112.00" x2="169.00" y2="112.00" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /" x1="34.00" y1="22.50" x2="73.00" y2="22.50" class="geom-line geom-overlay" />
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /" x1="32.00" y1="47.50" x2="84.00" y2="47.50" class="geom-line geom-overlay" />
    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /" x1="34.00" y1="69.50" x2="110.00" y2="69.50" class="geom-line geom-overlay" />
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="35.00" y1="89.50" x2="134.00" y2="89.50" class="geom-line geom-overlay" />
    <line id="hl-mag-E" data-ref="E" data-aliases="/ E /" x1="31.00" y1="112.00" x2="169.00" y2="112.00" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="23.00" y="22.50" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="21.00" y="47.50" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="23.00" y="69.50" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="24.00" y="89.50" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="20.00" y="112.00" class="geom-label">E</text>
  </g>
</svg>
