    <polygon id="el-poly-AFE" data-ref="&lt; A F E &gt;" data-aliases="&lt; E F A &gt; | &lt; F A E &gt;" data-type="polygon" points="46.0,184.0 96.0,184.0 96.0,200.0" class="geom-polygon" />

