    <circle id="el-pt-B" data-ref="B" data-type="point" cx="149.0" cy="25.5" r="2.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="249.0" cy="25.5" r="2.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="7.0" y="25.5" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="149.0" y="14.0" class="geom-label">B</text>
