  <g id="highlights" style="pointer-events: none;">
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="16.0" y1="25.5" x2="249.0" y2="25.5" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="16.0" y1="25.5" x2="149.0" y2="25.5" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="149.0" y1="25.5" x2="249.0" y2="25.5" class="geom-line geom-overlay" />
    <polyline id="hl-sec-ABC" data-ref="/ A B C /" data-aliases="/ C B A / | } A B C { | } C B A {" points="16.0,25.5 149.0,25.5 249.0,25.5" class="geom-line geom-overlay" />
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="19.0" y1="63.5" x2="70.0" y2="63.5" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
