  <g id="elements">
    <line id="el-line-AC" data-ref="[ A C ]" data-aliases="[ C A ]" data-type="line" x1="16.0" y1="25.5" x2="249.0" y2="25.5" class="geom-line" />
    <line x1="149.0" y1="22.0" x2="149.0" y2="29.0" class="geom-line" />
    <line id="el-line-D" data-ref="[ D_l D_r ]" data-type="line" x1="19.0" y1="63.5" x2="70.0" y2="63.5" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Segments & Sub-segments) -->
  <g id="graphics">
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="16.0" y1="25.5" x2="249.0" y2="25.5" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="16.0" y1="25.5" x2="149.0" y2="25.5" class="geom-line geom-overlay" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="149.0" y1="25.5" x2="249.0" y2="25.5" class="geom-line geom-overlay" />
    <polyline id="el-sec-ABC" data-ref="/ A B C /" data-aliases="/ C B A / | } A B C { | } C B A {" data-type="section" points="16.0,25.5 149.0,25.5 249.0,25.5" class="geom-line geom-overlay" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="19.0" y1="63.5" x2="70.0" y2="63.5" class="geom-line" />
