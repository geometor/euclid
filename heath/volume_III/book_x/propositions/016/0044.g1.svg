<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 85 210" width="100%" height="100%" class="euclid-graphic" data-graphic-id="0044.g1" data-folio="0044" data-graphic="g1" data-proposition="X.16">
  <style>
    .euclid-graphic {
      font-family: "Times New Roman", Times, Georgia, serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s ease, stroke-width 0.15s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-AC" data-ref="[ A C ]" data-aliases="[ C A ]" data-type="line" x1="24.5" y1="14.0" x2="24.5" y2="195.0" class="geom-line" />
    <line x1="21.0" y1="123.0" x2="28.0" y2="123.0" class="geom-line" />
    <line id="el-line-D" data-ref="[ D_t D_b ]" data-type="line" x1="64.5" y1="15.0" x2="64.5" y2="56.0" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Segments & Sub-segments) -->
  <g id="graphics">
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="24.5" y1="14.0" x2="24.5" y2="195.0" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="24.5" y1="14.0" x2="24.5" y2="123.0" class="geom-line geom-overlay" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="24.5" y1="123.0" x2="24.5" y2="195.0" class="geom-line geom-overlay" />
    <polyline id="el-sec-ABC" data-ref="/ A B C /" data-aliases="/ C B A / | } A B C { | } C B A {" data-type="section" points="24.5,14.0 24.5,123.0 24.5,195.0" class="geom-line geom-overlay" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="64.5" y1="15.0" x2="64.5" y2="56.0" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="24.5" y1="14.0" x2="24.5" y2="195.0" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="24.5" y1="14.0" x2="24.5" y2="123.0" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="24.5" y1="123.0" x2="24.5" y2="195.0" class="geom-line geom-overlay" />
    <polyline id="hl-sec-ABC" data-ref="/ A B C /" data-aliases="/ C B A / | } A B C { | } C B A {" points="24.5,14.0 24.5,123.0 24.5,195.0" class="geom-line geom-overlay" />
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="64.5" y1="15.0" x2="64.5" y2="56.0" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="24.5" cy="14.0" r="2.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="24.5" cy="123.0" r="2.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="24.5" cy="195.0" r="2.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="13.0" y="18.0" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="13.0" y="123.0" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="13.0" y="191.0" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" data-aliases="/ D /" x="75.0" y="36.0" class="geom-label">D</text>
  </g>
</svg>
