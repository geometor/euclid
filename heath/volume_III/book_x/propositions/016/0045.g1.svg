    <line id="el-line-EF" data-ref="[ E F ]" data-aliases="[ F E ]" data-type="line" x1="20.0" y1="20.5" x2="194.0" y2="20.5" class="geom-line" />
    <line id="el-line-AE" data-ref="[ A E ]" data-aliases="[ E A ]" data-type="line" x1="20.0" y1="20.5" x2="20.0" y2="73.5" class="geom-line" />
    <line id="el-line-CD" data-ref="[ C D ]" data-aliases="[ D C ]" data-type="line" x1="141.0" y1="20.5" x2="141.0" y2="73.5" class="geom-line" />
    <line id="el-line-BF" data-ref="[ B F ]" data-aliases="[ F B ]" data-type="line" x1="194.0" y1="20.5" x2="194.0" y2="73.5" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Polygons & Segments) -->
  <g id="graphics">
    <polygon id="el-poly-AD" data-ref="&lt; A C D E &gt;" data-aliases="&lt; A D &gt; | &lt; D A &gt;" data-type="polygon" points="20.0,73.5 141.0,73.5 141.0,20.5 20.0,20.5" class="geom-polygon" />
    <polygon id="el-poly-DB" data-ref="&lt; C B F D &gt;" data-aliases="&lt; D B &gt; | &lt; B D &gt;" data-type="polygon" points="141.0,73.5 194.0,73.5 194.0,20.5 141.0,20.5" class="geom-polygon" />
    <polygon id="el-poly-ABFE" data-ref="&lt; A B F E &gt;" data-aliases="&lt; A F &gt; | &lt; F A &gt;" data-type="polygon" points="20.0,73.5 194.0,73.5 194.0,20.5 20.0,20.5" class="geom-polygon geom-overlay" />

    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="20.0" y1="73.5" x2="194.0" y2="73.5" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="20.0" y1="73.5" x2="141.0" y2="73.5" class="geom-line geom-overlay" />
    <line id="el-seg-CB" data-ref="/ C B /" data-aliases="/ B C /" data-type="segment" x1="141.0" y1="73.5" x2="194.0" y2="73.5" class="geom-line geom-overlay" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="141.0" y1="20.5" x2="141.0" y2="73.5" class="geom-line" />
    <polyline id="el-sec-ACB" data-ref="/ A C B /" data-aliases="/ B C A / | } A C B { | } B C A {" data-type="section" points="20.0,73.5 141.0,73.5 194.0,73.5" class="geom-line geom-overlay" />
  </g>

