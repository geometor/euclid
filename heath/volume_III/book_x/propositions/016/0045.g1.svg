    <polygon id="hl-poly-DB" data-ref="&lt; C B F D &gt;" data-aliases="&lt; D B &gt; | &lt; B D &gt;" points="141.0,73.5 194.0,73.5 194.0,20.5 141.0,20.5" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-ABFE" data-ref="&lt; A B F E &gt;" data-aliases="&lt; A F &gt; | &lt; F A &gt;" points="20.0,73.5 194.0,73.5 194.0,20.5 20.0,20.5" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="20.0" y1="73.5" x2="194.0" y2="73.5" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="20.0" y1="73.5" x2="141.0" y2="73.5" class="geom-line geom-overlay" />
    <line id="hl-seg-CB" data-ref="/ C B /" data-aliases="/ B C /" x1="141.0" y1="73.5" x2="194.0" y2="73.5" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="141.0" y1="20.5" x2="141.0" y2="73.5" class="geom-line geom-overlay" />
    <polyline id="hl-sec-ACB" data-ref="/ A C B /" data-aliases="/ B C A / | } A C B { | } B C A {" points="20.0,73.5 141.0,73.5 194.0,73.5" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="20.0" cy="73.5" r="2.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="141.0" cy="73.5" r="2.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="194.0" cy="73.5" r="2.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="141.0" cy="20.5" r="2.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="20.0" y="84.0" class="geom-label">A</text>
    <text id="lbl-D" data-ref="D" x="141.0" y="10.0" class="geom-label">D</text>
