<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 207 164" width="207" height="164" class="euclid-graphic" data-graphic-id="0286.g1" data-folio="0286" data-graphic="g1" data-proposition="XI.5">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #000000;
      stroke-width: 1.6;
      stroke-dasharray: 4,3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Extended Lines through O) -->
  <g id="elements">
    <line id="el-line-AO" data-ref="[ A O ]" data-type="line" x1="112" y1="20" x2="112" y2="143" class="geom-line" />
    <line id="el-line-OB" data-ref="[ O B ]" data-type="line" x1="112" y1="76" x2="21" y2="108" class="geom-line" />
    <line id="el-line-OC" data-ref="[ O C ]" data-type="line" x1="112" y1="76" x2="185" y2="93" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Planes, Segments, Angle Wedges) -->
  <g id="graphics">
    <!-- Planes AOB, AOC, BOC, AOC' -->
    <polygon id="el-plane-AOB" data-ref="&lt; A O B &gt;" data-type="polygon" points="112,20 112,76 45,99" class="geom-polygon" />
    <polygon id="el-plane-AOC" data-ref="&lt; A O C &gt;" data-type="polygon" points="112,20 112,76 171,90" class="geom-polygon" />
    <polygon id="el-plane-BOC" data-ref="&lt; B O C &gt;" data-type="polygon" points="45,99 112,76 171,90" class="geom-polygon" />
    <polygon id="el-plane-AOCp" data-ref="&lt; A O C' &gt;" data-type="polygon" points="112,20 112,76 192,80" class="geom-polygon" />

    <!-- Segments -->
    <line id="el-seg-AO" data-ref="/ A O /" data-aliases="/ O A /" data-type="segment" x1="112" y1="20" x2="112" y2="76" class="geom-line" />
    <line id="el-seg-BO" data-ref="/ B O /" data-aliases="/ O B /" data-type="segment" x1="45" y1="99" x2="112" y2="76" class="geom-line" />
    <line id="el-seg-CO" data-ref="/ C O /" data-aliases="/ O C /" data-type="segment" x1="171" y1="90" x2="112" y2="76" class="geom-line" />
    <line id="el-seg-OCp" data-ref="/ O C' /" data-aliases="/ C' O /" data-type="segment" x1="112" y1="76" x2="192" y2="80" class="geom-dashed" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="112" y1="20" x2="45" y2="99" class="geom-dashed" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="112" y1="20" x2="171" y2="90" class="geom-dashed" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-AOC" data-ref="&lt; A O C )" data-aliases="&lt; C O A )" data-type="wedge" d="M 112.00 76.00 L 112.00 56.00 A 20.0 20.0 0 0 1 131.46 80.62 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-AOCp" data-ref="&lt; A O C' )" data-aliases="&lt; C' O A )" data-type="wedge" d="M 112.00 76.00 L 112.00 52.00 A 24.0 24.0 0 0 1 135.97 77.20 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-AOB" data-ref="&lt; A O B )" data-aliases="&lt; B O A )" data-type="wedge" d="M 112.00 76.00 L 112.00 56.00 A 20.0 20.0 0 0 0 93.08 82.49 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-plane-AOB" data-ref="&lt; A O B &gt;" points="112,20 112,76 45,99" class="geom-polygon geom-overlay" />
    <polygon id="hl-plane-AOC" data-ref="&lt; A O C &gt;" points="112,20 112,76 171,90" class="geom-polygon geom-overlay" />
    <polygon id="hl-plane-BOC" data-ref="&lt; B O C &gt;" points="45,99 112,76 171,90" class="geom-polygon geom-overlay" />
    <polygon id="hl-plane-AOCp" data-ref="&lt; A O C' &gt;" points="112,20 112,76 192,80" class="geom-polygon geom-overlay" />

    <line id="hl-line-AO" data-ref="[ A O ]" x1="112" y1="20" x2="112" y2="143" class="geom-line geom-overlay" />
    <line id="hl-line-OB" data-ref="[ O B ]" x1="112" y1="76" x2="21" y2="108" class="geom-line geom-overlay" />
    <line id="hl-line-OC" data-ref="[ O C ]" x1="112" y1="76" x2="185" y2="93" class="geom-line geom-overlay" />

    <line id="hl-seg-AO" data-ref="/ A O /" data-aliases="/ O A /" x1="112" y1="20" x2="112" y2="76" class="geom-line geom-overlay" />
    <line id="hl-seg-BO" data-ref="/ B O /" data-aliases="/ O B /" x1="45" y1="99" x2="112" y2="76" class="geom-line geom-overlay" />
    <line id="hl-seg-CO" data-ref="/ C O /" data-aliases="/ O C /" x1="171" y1="90" x2="112" y2="76" class="geom-line geom-overlay" />
    <line id="hl-seg-OCp" data-ref="/ O C' /" data-aliases="/ C' O /" x1="112" y1="76" x2="192" y2="80" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="112" y1="20" x2="45" y2="99" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="112" y1="20" x2="171" y2="90" class="geom-line geom-overlay" />

    <path id="hl-ang-AOC" data-ref="&lt; A O C )" data-aliases="&lt; C O A )" d="M 112.00 76.00 L 112.00 56.00 A 20.0 20.0 0 0 1 131.46 80.62 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-AOCp" data-ref="&lt; A O C' )" data-aliases="&lt; C' O A )" d="M 112.00 76.00 L 112.00 52.00 A 24.0 24.0 0 0 1 135.97 77.20 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-AOB" data-ref="&lt; A O B )" data-aliases="&lt; B O A )" d="M 112.00 76.00 L 112.00 56.00 A 20.0 20.0 0 0 0 93.08 82.49 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="112" cy="20" r="3.2" class="geom-point" />
    <circle id="el-pt-O" data-ref="O" data-type="point" cx="112" cy="76" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="45" cy="99" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="171" cy="90" r="3.2" class="geom-point" />
    <circle id="el-pt-Cp" data-ref="C'" data-type="point" cx="192" cy="80" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="112" y="14" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-O" data-ref="O" x="109" y="90" text-anchor="end" class="geom-label">O</text>
    <text id="lbl-B" data-ref="B" x="45" y="114" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="171" y="104" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-Cp" data-ref="C'" x="195" y="75" text-anchor="middle" class="geom-label">C'</text>
  </g>
</svg>
