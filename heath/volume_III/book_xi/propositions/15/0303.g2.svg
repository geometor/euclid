<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197 135" width="197" height="135" class="euclid-graphic" data-graphic-id="0303.g2" data-folio="0303" data-graphic="g2" data-proposition="XI.15">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #000000;
      stroke-width: 1.6;
      stroke-dasharray: 4,3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Plane Boundaries) -->
  <g id="elements">
    <!-- Upper plane boundary -->
    <line id="el-plane-ABC-top" x1="48" y1="8" x2="143" y2="8" class="geom-line" />
    <line id="el-plane-ABC-right" x1="143" y1="8" x2="103" y2="54" class="geom-line" />
    <line id="el-plane-ABC-bottom" x1="103" y1="54" x2="7" y2="54" class="geom-line" />
    <line id="el-plane-ABC-left" x1="7" y1="54" x2="48" y2="8" class="geom-line" />
    <!-- Lower plane boundary -->
    <line id="el-plane-DEF-top" x1="78" y1="86" x2="190" y2="86" class="geom-line" />
    <line id="el-plane-DEF-right" x1="190" y1="86" x2="155" y2="128" class="geom-line" />
    <line id="el-plane-DEF-bottom" x1="155" y1="128" x2="41" y2="128" class="geom-line" />
    <line id="el-plane-DEF-left" x1="41" y1="128" x2="78" y2="86" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Planes, Segments, Angle Wedges) -->
  <g id="graphics">
    <!-- Planes ABC and DEF -->
    <polygon id="el-plane-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; B A C &gt; | &lt; C B A &gt;" data-type="polygon" points="48,8 143,8 103,54 7,54" class="geom-polygon" />
    <polygon id="el-plane-DEF" data-ref="&lt; D E F &gt;" data-aliases="&lt; E D F &gt; | &lt; F E D &gt;" data-type="polygon" points="78,86 190,86 155,128 41,128" class="geom-polygon" />

    <!-- Segments -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="48" y1="38" x2="110" y2="20" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="48" y1="38" x2="80" y2="43" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="79" y1="114" x2="137" y2="98" class="geom-line" />
    <line id="el-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" data-type="segment" x1="79" y1="114" x2="150" y2="125" class="geom-line" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A )" data-type="wedge" d="M 48.00 38.00 L 65.29 32.98 A 18.0 18.0 0 0 1 65.78 40.78 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-DEF" data-ref="&lt; D E F )" data-aliases="&lt; F E D )" data-type="wedge" d="M 79.00 114.00 L 96.35 109.21 A 18.0 18.0 0 0 1 96.79 116.76 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-plane-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; B A C &gt; | &lt; C B A &gt;" points="48,8 143,8 103,54 7,54" class="geom-polygon geom-overlay" />
    <polygon id="hl-plane-DEF" data-ref="&lt; D E F &gt;" data-aliases="&lt; E D F &gt; | &lt; F E D &gt;" points="78,86 190,86 155,128 41,128" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="48" y1="38" x2="110" y2="20" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="48" y1="38" x2="80" y2="43" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="79" y1="114" x2="137" y2="98" class="geom-line geom-overlay" />
    <line id="hl-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" x1="79" y1="114" x2="150" y2="125" class="geom-line geom-overlay" />

    <path id="hl-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A )" d="M 48.00 38.00 L 65.29 32.98 A 18.0 18.0 0 0 1 65.78 40.78 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-DEF" data-ref="&lt; D E F )" data-aliases="&lt; F E D )" d="M 79.00 114.00 L 96.35 109.21 A 18.0 18.0 0 0 1 96.79 116.76 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="110" cy="20" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="48" cy="38" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="80" cy="43" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="137" cy="98" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="79" cy="114" r="3.2" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="150" cy="125" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="114" y="23" text-anchor="start" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="45" y="43" text-anchor="end" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="83" y="49" text-anchor="start" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="141" y="102" text-anchor="start" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="76" y="119" text-anchor="end" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="152" y="121" text-anchor="middle" class="geom-label">F</text>
  </g>
</svg>
