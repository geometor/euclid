[project]
name = "geometor-euclid"
dynamic = ["version"]
authors = [
  { name="geometor", email="github@geometor.com" },
]
description = "Digital critical editions of Sir Thomas L. Heath's Euclid's Elements and Euclid's Data (Δεδομένα, Menge 1896 Greek & English)."
readme = "README.rst"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "rich",
    "networkx",
    "PyYAML",
    "pillow",
    "scipy",
    "opencv-python",
    "flask>=3.1.3",
    "markdown>=3.11",
]

[project.scripts]
euclid = "geometor.euclid.__main__:main"
heath_transform = "geometor.euclid.transform:main"
graphic_tool = "geometor.euclid.scripts.graphic_tool:main"
folio_review = "geometor.euclid.folio_review.app:main"

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "geometor.euclid.__version__"}

[project.urls]
"Website" = "https://geometor.github.io/euclid"
"Repository" = "https://github.com/geometor/euclid"
"Issues" = "https://github.com/geometor/euclid/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
lint.select = ["ANN", "D"]
lint.ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

