<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 155 100" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line, .segment, .polygon { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Triangle ABC -->
<g class="interactive" id="tri_ABC">
  <polygon class="polygon" points="61.7,20.0 20.0,71.0 126.0,71.0" />
</g>

<!-- Segments AD and BE -->
<g class="interactive" id="seg_AD">
  <line class="segment" x1="61.7" y1="20.0" x2="50.0" y2="71.0" />
</g>
<g class="interactive" id="seg_BE">
  <line class="segment" x1="20.0" y1="71.0" x2="79.4" y2="34.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_A">
  <circle class="point" cx="61.7" cy="20.0" r="2.5" />
  <text class="label" x="61.7" y="11.0">A</text>
</g>
<g class="point-group" id="point_B">
  <circle class="point" cx="20.0" cy="71.0" r="2.5" />
  <text class="label" x="12.0" y="77.0">B</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="126.0" cy="71.0" r="2.5" />
  <text class="label" x="134.0" y="77.0">C</text>
</g>
<g class="point-group" id="point_D">
  <circle class="point" cx="50.0" cy="71.0" r="2.5" />
  <text class="label" x="49.0" y="81.0">D</text>
</g>
<g class="point-group" id="point_E">
  <circle class="point" cx="79.4" cy="34.0" r="2.5" />
  <text class="label" x="87.0" y="27.0">E</text>
</g>
<g class="point-group" id="point_F">
  <circle class="point" cx="57.0" cy="47.9" r="2.5" />
  <text class="label" x="66.0" y="52.0">F</text>
</g>
</svg>
