<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 120" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 13px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line, .segment { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Transversal Line X -->
<g class="interactive" id="line_X">
  <line class="line" x1="27.0" y1="39.0" x2="132.0" y2="95.0" />
</g>

<!-- Transversal Line P'Q' -->
<g class="interactive" id="line_transversal">
  <line class="line" x1="14.0" y1="96.0" x2="135.0" y2="39.0" />
</g>

<!-- Rays from O -->
<g class="interactive" id="ray_OP">
  <line class="segment" x1="92.0" y1="20.0" x2="18.0" y2="93.0" />
</g>
<g class="interactive" id="ray_OR">
  <line class="segment" x1="92.0" y1="20.0" x2="65.0" y2="73.0" />
</g>
<g class="interactive" id="ray_OQ">
  <line class="segment" x1="92.0" y1="20.0" x2="122.0" y2="48.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_O">
  <circle class="point" cx="92.0" cy="20.0" r="2.5" />
  <text class="label" x="84.0" y="16.0">O</text>
</g>
<g class="point-group" id="point_P">
  <circle class="point" cx="45.0" cy="48.0" r="2.5" />
  <text class="label" x="55.0" y="44.0">P</text>
</g>
<g class="point-group" id="point_P_prime">
  <circle class="point" cx="22.0" cy="89.0" r="2.5" />
  <text class="label" x="14.0" y="100.0">P'</text>
</g>
<g class="point-group" id="point_R">
  <circle class="point" cx="76.0" cy="65.0" r="2.5" />
  <text class="label" x="83.0" y="58.0">R</text>
</g>
<g class="point-group" id="point_R_prime">
  <circle class="point" cx="65.0" cy="73.0" r="2.5" />
  <text class="label" x="60.0" y="83.0">R'</text>
</g>
<g class="point-group" id="point_Q">
  <circle class="point" cx="107.0" cy="81.0" r="2.5" />
  <text class="label" x="104.0" y="90.0">Q</text>
</g>
<g class="point-group" id="point_Q_prime">
  <circle class="point" cx="121.0" cy="48.0" r="2.5" />
  <text class="label" x="123.0" y="38.0">Q'</text>
</g>
<text class="label" x="138.0" y="98.0">X</text>
</svg>
