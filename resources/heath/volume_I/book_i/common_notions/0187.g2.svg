<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 120" width="165" height="120" class="euclid-graphic" data-graphic-id="0187.g2" data-folio="0187" data-graphic="g2">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 13.5px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.2 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Fixed Line X, Transversal P'Q', and Rays from O) -->
  <g id="elements">
    <!-- Fixed straight line X = [ P Q ] -->
    <line id="el-line-PQ" data-ref="[ P Q ]" data-aliases="X | [ P R ] | [ R Q ]" data-type="line" x1="28.0" y1="41.0" x2="128.0" y2="91.0" class="geom-line" />
    <!-- Transversal straight line [ P' Q' ] -->
    <line id="el-line-PprimeQprime" data-ref="[ P' Q' ]" data-aliases="[ P' R' ] | [ R' Q' ]" data-type="line" x1="80.0" y1="20.8" x2="113.0" y2="60.4" class="geom-line" />
    <!-- Rays from O -->
    <line id="el-line-OPprime" data-ref="[ O P' ]" data-aliases="[ O P ] | / O P P' /" data-type="line" x1="18.0" y1="96.0" x2="96.0" y2="18.0" class="geom-line" />
    <line id="el-line-ORprime" data-ref="[ O R' ]" data-aliases="[ O R ] | / O R R' /" data-type="line" x1="18.0" y1="96.0" x2="116.0" y2="27.4" class="geom-line" />
    <line id="el-line-OQprime" data-ref="[ O Q' ]" data-aliases="[ O Q ] | / O Q Q' /" data-type="line" x1="18.0" y1="96.0" x2="134.0" y2="38.0" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Collinear Sub-Segments and Sections) -->
  <g id="graphics">
    <polygon id="el-tri-OPprimeQprime" data-ref="&lt; O P' Q' &gt;" data-type="polygon" points="18.0,96.0 86.0,28.0 106.0,52.0" class="geom-polygon" />
    <polygon id="el-tri-OPQ" data-ref="&lt; O P Q &gt;" data-type="polygon" points="18.0,96.0 58.0,56.0 78.0,66.0" class="geom-polygon" />

    <!-- Sub-segments along ray OPP' -->
    <line id="el-seg-OP" data-ref="/ O P /" data-type="segment" x1="18.0" y1="96.0" x2="58.0" y2="56.0" class="geom-line" />
    <line id="el-seg-PPprime" data-ref="/ P P' /" data-type="segment" x1="58.0" y1="56.0" x2="86.0" y2="28.0" class="geom-line" />
    <line id="el-seg-OPprime" data-ref="/ O P' /" data-aliases="/ O P P' /" data-type="segment" x1="18.0" y1="96.0" x2="86.0" y2="28.0" class="geom-line geom-overlay" />

    <!-- Sub-segments along ray ORR' -->
    <line id="el-seg-OR" data-ref="/ O R /" data-type="segment" x1="18.0" y1="96.0" x2="68.0" y2="61.0" class="geom-line" />
    <line id="el-seg-RRprime" data-ref="/ R R' /" data-type="segment" x1="68.0" y1="61.0" x2="96.7" y2="40.9" class="geom-line" />
    <line id="el-seg-ORprime" data-ref="/ O R' /" data-aliases="/ O R R' /" data-type="segment" x1="18.0" y1="96.0" x2="96.7" y2="40.9" class="geom-line geom-overlay" />

    <!-- Sub-segments along ray OQQ' -->
    <line id="el-seg-OQ" data-ref="/ O Q /" data-type="segment" x1="18.0" y1="96.0" x2="78.0" y2="66.0" class="geom-line" />
    <line id="el-seg-QQprime" data-ref="/ Q Q' /" data-type="segment" x1="78.0" y1="66.0" x2="106.0" y2="52.0" class="geom-line" />
    <line id="el-seg-OQprime" data-ref="/ O Q' /" data-aliases="/ O Q Q' /" data-type="segment" x1="18.0" y1="96.0" x2="106.0" y2="52.0" class="geom-line geom-overlay" />

    <!-- Sub-segments along line X -->
    <line id="el-seg-PR" data-ref="/ P R /" data-type="segment" x1="58.0" y1="56.0" x2="68.0" y2="61.0" class="geom-line" />
    <line id="el-seg-RQ" data-ref="/ R Q /" data-type="segment" x1="68.0" y1="61.0" x2="78.0" y2="66.0" class="geom-line" />
    <line id="el-seg-PQ" data-ref="/ P Q /" data-aliases="/ P R Q /" data-type="segment" x1="58.0" y1="56.0" x2="78.0" y2="66.0" class="geom-line geom-overlay" />

    <!-- Sub-segments along transversal P'Q' -->
    <line id="el-seg-PprimeRprime" data-ref="/ P' R' /" data-type="segment" x1="86.0" y1="28.0" x2="96.7" y2="40.9" class="geom-line" />
    <line id="el-seg-RprimeQprime" data-ref="/ R' Q' /" data-type="segment" x1="96.7" y1="40.9" x2="106.0" y2="52.0" class="geom-line" />
    <line id="el-seg-PprimeQprime" data-ref="/ P' Q' /" data-aliases="/ P' R' Q' /" data-type="segment" x1="86.0" y1="28.0" x2="106.0" y2="52.0" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-line-PQ" data-ref="[ P Q ]" data-aliases="X" x1="28.0" y1="41.0" x2="128.0" y2="91.0" class="geom-line geom-overlay" />
    <line id="hl-line-PprimeQprime" data-ref="[ P' Q' ]" x1="80.0" y1="20.8" x2="113.0" y2="60.4" class="geom-line geom-overlay" />
    <line id="hl-line-OPprime" data-ref="[ O P' ]" data-aliases="/ O P P' /" x1="18.0" y1="96.0" x2="96.0" y2="18.0" class="geom-line geom-overlay" />
    <line id="hl-line-ORprime" data-ref="[ O R' ]" data-aliases="[ O R ] | / O R R' /" x1="18.0" y1="96.0" x2="116.0" y2="27.4" class="geom-line geom-overlay" />
    <line id="hl-line-OQprime" data-ref="[ O Q' ]" data-aliases="/ O Q Q' /" x1="18.0" y1="96.0" x2="134.0" y2="38.0" class="geom-line geom-overlay" />
    <line id="hl-seg-OP" data-ref="/ O P /" x1="18.0" y1="96.0" x2="58.0" y2="56.0" class="geom-line geom-overlay" />
    <line id="hl-seg-OR" data-ref="/ O R /" x1="18.0" y1="96.0" x2="68.0" y2="61.0" class="geom-line geom-overlay" />
    <line id="hl-seg-OQ" data-ref="/ O Q /" x1="18.0" y1="96.0" x2="78.0" y2="66.0" class="geom-line geom-overlay" />
    <line id="hl-seg-OPprime" data-ref="/ O P' /" x1="18.0" y1="96.0" x2="86.0" y2="28.0" class="geom-line geom-overlay" />
    <line id="hl-seg-ORprime" data-ref="/ O R' /" x1="18.0" y1="96.0" x2="96.7" y2="40.9" class="geom-line geom-overlay" />
    <line id="hl-seg-OQprime" data-ref="/ O Q' /" x1="18.0" y1="96.0" x2="106.0" y2="52.0" class="geom-line geom-overlay" />
    <line id="hl-seg-PprimeQprime" data-ref="/ P' Q' /" x1="86.0" y1="28.0" x2="106.0" y2="52.0" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-O" data-ref="O" data-type="point" cx="18.0" cy="96.0" r="3.0" class="geom-point" />
    <circle id="el-pt-P" data-ref="P" data-type="point" cx="58.0" cy="56.0" r="3.0" class="geom-point" />
    <circle id="el-pt-R" data-ref="R" data-type="point" cx="68.0" cy="61.0" r="3.0" class="geom-point" />
    <circle id="el-pt-Q" data-ref="Q" data-type="point" cx="78.0" cy="66.0" r="3.0" class="geom-point" />
    <circle id="el-pt-Pprime" data-ref="P'" data-type="point" cx="86.0" cy="28.0" r="3.0" class="geom-point" />
    <circle id="el-pt-Rprime" data-ref="R'" data-type="point" cx="96.7" cy="40.9" r="3.0" class="geom-point" />
    <circle id="el-pt-Qprime" data-ref="Q'" data-type="point" cx="106.0" cy="52.0" r="3.0" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-O" data-ref="O" x="18.0" y="110.0" text-anchor="middle" class="geom-label">O</text>
    <text id="lbl-P" data-ref="P" x="56.0" y="49.0" text-anchor="end" class="geom-label">P</text>
    <text id="lbl-R" data-ref="R" x="68.0" y="55.0" text-anchor="middle" class="geom-label">R</text>
    <text id="lbl-Q" data-ref="Q" x="78.0" y="80.0" text-anchor="middle" class="geom-label">Q</text>
    <text id="lbl-Pprime" data-ref="P'" x="83.0" y="21.0" text-anchor="middle" class="geom-label">P′</text>
    <text id="lbl-Rprime" data-ref="R'" x="103.0" y="45.0" text-anchor="start" class="geom-label">R′</text>
    <text id="lbl-Qprime" data-ref="Q'" x="114.0" y="59.0" text-anchor="start" class="geom-label">Q′</text>
    <text id="lbl-X" data-ref="[ P Q ]" data-aliases="X" x="130.0" y="105.0" text-anchor="middle" class="geom-label">X</text>
  </g>
</svg>
