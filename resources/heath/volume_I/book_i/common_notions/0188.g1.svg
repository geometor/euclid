<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 115" width="130" height="115" class="euclid-graphic" data-graphic-id="0188.g1" data-folio="0188" data-graphic="g1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.2 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <circle id="el-cir-k" data-ref="( C A )" data-aliases="k; ( A D B )" data-type="circle" cx="60.5" cy="63.5" r="39.0" class="geom-circle" />
    <line id="el-line-AB" data-ref="[ A B ]" data-type="line" x1="21.5" y1="63.5" x2="99.5" y2="63.5" class="geom-line" />
    <line id="el-line-CD" data-ref="[ C D ]" data-type="line" x1="60.5" y1="24.5" x2="60.5" y2="102.5" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Segments, Arcs, and Right Angles) -->
  <g id="graphics">
    <!-- Collinear Sub-Segments along AB -->
    <line id="el-seg-AC" data-ref="/ A C /" data-type="segment" x1="21.5" y1="63.5" x2="60.5" y2="63.5" class="geom-line" />
    <line id="el-seg-CB" data-ref="/ C B /" data-type="segment" x1="60.5" y1="63.5" x2="99.5" y2="63.5" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ A C B /" data-type="segment" x1="21.5" y1="63.5" x2="99.5" y2="63.5" class="geom-line geom-overlay" />

    <!-- Perpendicular CD -->
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="60.5" y1="63.5" x2="60.5" y2="24.5" class="geom-line" />

    <!-- Semicircular Arc ADB -->
    <path id="el-arc-ADB" data-ref="&lt; A C B )" data-aliases="( C A )&lt; A C B &gt;" data-type="arc" d="M 21.5 63.5 A 39.0 39.0 0 0 1 99.5 63.5" class="geom-arc geom-overlay" />
    <path id="el-arc-AD" data-ref="&lt; A C D )" data-type="arc" d="M 21.5 63.5 A 39.0 39.0 0 0 1 60.5 24.5" class="geom-arc geom-overlay" />
    <path id="el-arc-DB" data-ref="&lt; D C B )" data-type="arc" d="M 60.5 24.5 A 39.0 39.0 0 0 1 99.5 63.5" class="geom-arc geom-overlay" />

    <!-- Right Angles ACD and BCD -->
    <path id="el-ang-ACD" data-ref="&lt; A C D )" data-type="wedge" d="M 60.5 63.5 L 42.5 63.5 A 18.0 18.0 0 0 1 60.5 45.5 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BCD" data-ref="&lt; B C D )" data-type="wedge" d="M 60.5 63.5 L 60.5 45.5 A 18.0 18.0 0 0 1 78.5 63.5 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-cir-k" data-ref="( C A )" data-aliases="k; ( A D B )" cx="60.5" cy="63.5" r="39.0" class="geom-circle geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" x1="21.5" y1="63.5" x2="60.5" y2="63.5" class="geom-line geom-overlay" />
    <line id="hl-seg-CB" data-ref="/ C B /" x1="60.5" y1="63.5" x2="99.5" y2="63.5" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ A C B /" x1="21.5" y1="63.5" x2="99.5" y2="63.5" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="60.5" y1="63.5" x2="60.5" y2="24.5" class="geom-line geom-overlay" />
    <path id="hl-arc-ADB" data-ref="&lt; A C B )" data-aliases="( C A )&lt; A C B &gt;" d="M 21.5 63.5 A 39.0 39.0 0 0 1 99.5 63.5" class="geom-arc geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="21.5" cy="63.5" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="99.5" cy="63.5" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="60.5" cy="63.5" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="60.5" cy="24.5" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="12.0" y="67.5" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="109.0" y="67.5" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="69.0" y="76.0" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="60.5" y="17.0" text-anchor="middle" class="geom-label">D</text>
  </g>
</svg>
