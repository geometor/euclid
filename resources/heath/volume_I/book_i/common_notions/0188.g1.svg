<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 115" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line, .circle { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Circle -->
<g class="interactive" id="circle_C">
  <circle class="circle" cx="60.5" cy="63.5" r="39.0" />
</g>

<!-- Diameters -->
<g class="interactive" id="diam_AB">
  <line class="line" x1="21.5" y1="63.5" x2="99.5" y2="63.5" />
</g>
<g class="interactive" id="perp_CD">
  <line class="line" x1="60.5" y1="24.5" x2="60.5" y2="102.5" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_D">
  <circle class="point" cx="60.5" cy="24.5" r="2.5" />
  <text class="label" x="60.5" y="14.0">D</text>
</g>
<g class="point-group" id="point_A">
  <circle class="point" cx="21.5" cy="63.5" r="2.5" />
  <text class="label" x="12.0" y="63.5">A</text>
</g>
<g class="point-group" id="point_B">
  <circle class="point" cx="99.5" cy="63.5" r="2.5" />
  <text class="label" x="109.0" y="63.5">B</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="60.5" cy="63.5" r="2.5" />
  <text class="label" x="69.0" y="72.0">C</text>
</g>
</svg>
