<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 201 199" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line, .segment { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Vertical Axis AB -->
<g class="interactive" id="axis_AB">
  <line class="segment" x1="31.0" y1="15.0" x2="31.0" y2="180.0" />
</g>

<!-- Plane generators CM, CP, CN -->
<g class="interactive" id="line_CM">
  <line class="segment" x1="31.0" y1="98.0" x2="178.0" y2="75.0" />
</g>
<g class="interactive" id="line_CP">
  <line class="segment" x1="31.0" y1="98.0" x2="158.0" y2="107.0" />
</g>
<g class="interactive" id="line_CN">
  <line class="segment" x1="31.0" y1="98.0" x2="140.0" y2="137.0" />
</g>

<!-- Line MN -->
<g class="interactive" id="line_MN">
  <line class="segment" x1="178.0" y1="75.0" x2="140.0" y2="137.0" />
</g>

<!-- Upper edges from A -->
<g class="interactive" id="edge_AM">
  <line class="segment" x1="31.0" y1="15.0" x2="178.0" y2="75.0" />
</g>
<g class="interactive" id="edge_AP">
  <line class="segment" x1="31.0" y1="15.0" x2="158.0" y2="107.0" />
</g>
<g class="interactive" id="edge_AN">
  <line class="segment" x1="31.0" y1="15.0" x2="140.0" y2="137.0" />
</g>

<!-- Lower edges from B -->
<g class="interactive" id="edge_BM">
  <line class="segment" x1="31.0" y1="180.0" x2="178.0" y2="75.0" />
</g>
<g class="interactive" id="edge_BP">
  <line class="segment" x1="31.0" y1="180.0" x2="158.0" y2="107.0" />
</g>
<g class="interactive" id="edge_BN">
  <line class="segment" x1="31.0" y1="180.0" x2="140.0" y2="137.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_A">
  <circle class="point" cx="31.0" cy="15.0" r="2.5" />
  <text class="label" x="22.0" y="15.0">A</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="31.0" cy="98.0" r="2.5" />
  <text class="label" x="22.0" y="98.0">C</text>
</g>
<g class="point-group" id="point_B">
  <circle class="point" cx="31.0" cy="180.0" r="2.5" />
  <text class="label" x="22.0" y="180.0">B</text>
</g>
<g class="point-group" id="point_M">
  <circle class="point" cx="178.0" cy="75.0" r="2.5" />
  <text class="label" x="187.0" y="73.0">M</text>
</g>
<g class="point-group" id="point_P">
  <circle class="point" cx="158.0" cy="107.0" r="2.5" />
  <text class="label" x="168.0" y="108.0">P</text>
</g>
<g class="point-group" id="point_N">
  <circle class="point" cx="140.0" cy="137.0" r="2.5" />
  <text class="label" x="149.0" y="142.0">N</text>
</g>
</svg>
