<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 287 108" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Parallel line r' through P -->
<g class="interactive" id="line_r_prime">
  <line class="line" x1="11.0" y1="19.0" x2="250.0" y2="19.0" />
</g>

<!-- Line r -->
<g class="interactive" id="line_r">
  <line class="line" x1="15.0" y1="83.0" x2="265.0" y2="83.0" />
</g>

<!-- Transversal ray through P -->
<g class="interactive" id="transversal">
  <line class="line" x1="205.0" y1="14.0" x2="65.0" y2="88.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_P">
  <circle class="point" cx="195.0" cy="19.0" r="2.5" />
  <text class="label" x="195.0" y="31.0">P</text>
</g>
<text class="label" x="258.0" y="16.0">r'</text>
<text class="label" x="273.0" y="83.0">r</text>
</svg>
