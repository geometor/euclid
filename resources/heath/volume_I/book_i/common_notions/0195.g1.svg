<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 212" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line, .polygon { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ray-fan, .ray-left { stroke-width: 1.0; stroke: #333333; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Left Sub-figure: Triangle with internal projecting rays -->
<g class="interactive" id="tri_left">
  <polygon class="polygon" points="64.0,56.0 33.0,198.0 95.0,198.0" />
</g>
<g id="rays_left">
  <line class="line ray-left" x1="64.0" y1="134.0" x2="33.0" y2="198.0" />
  <line class="line ray-left" x1="64.0" y1="134.0" x2="43.3" y2="198.0" />
  <line class="line ray-left" x1="64.0" y1="134.0" x2="53.7" y2="198.0" />
  <line class="line ray-left" x1="64.0" y1="134.0" x2="64.0" y2="198.0" />
  <line class="line ray-left" x1="64.0" y1="134.0" x2="74.3" y2="198.0" />
  <line class="line ray-left" x1="64.0" y1="134.0" x2="84.7" y2="198.0" />
  <line class="line ray-left" x1="64.0" y1="134.0" x2="95.0" y2="198.0" />
  <line class="line ray-left" x1="64.0" y1="134.0" x2="64.0" y2="56.0" />
</g>
<g class="point-group" id="point_a">
  <circle class="point" cx="64.0" cy="56.0" r="2.5" />
  <text class="label" x="55.0" y="56.0">a</text>
</g>
<g class="point-group" id="point_b">
  <circle class="point" cx="33.0" cy="198.0" r="2.5" />
  <text class="label" x="25.0" y="198.0">b</text>
</g>
<g class="point-group" id="point_c">
  <circle class="point" cx="95.0" cy="198.0" r="2.5" />
  <text class="label" x="103.0" y="198.0">c</text>
</g>
<g class="point-group" id="point_p">
  <circle class="point" cx="64.0" cy="134.0" r="2.5" />
  <text class="label" x="72.0" y="130.0">p</text>
</g>

<!-- Right Sub-figure: Flat angle with cluster of rays -->
<g class="interactive" id="baseline_right">
  <line class="line" x1="145.0" y1="106.0" x2="338.0" y2="106.0" />
</g>
<g id="fan_right">
  <line class="line ray-fan" x1="241.0" y1="106.0" x2="331.4" y2="76.6" />
  <line class="line ray-fan" x1="241.0" y1="106.0" x2="317.9" y2="50.2" />
  <line class="line ray-fan" x1="241.0" y1="106.0" x2="296.8" y2="29.1" />
  <line class="line ray-fan" x1="241.0" y1="106.0" x2="270.4" y2="15.6" />
  <line class="line ray-fan" x1="241.0" y1="106.0" x2="241.0" y2="11.0" />
  <line class="line ray-fan" x1="241.0" y1="106.0" x2="211.6" y2="15.6" />
  <line class="line ray-fan" x1="241.0" y1="106.0" x2="185.2" y2="29.1" />
  <line class="line ray-fan" x1="241.0" y1="106.0" x2="164.1" y2="50.2" />
  <line class="line ray-fan" x1="241.0" y1="106.0" x2="150.6" y2="76.6" />
</g>
<!-- Semi-circle arc representing the flat angle -->
<path class="line" d="M 281.0 106.0 A 40.0 40.0 0 0 0 201.0 106.0" stroke-dasharray="3,3" />

<g class="point-group" id="point_V">
  <circle class="point" cx="241.0" cy="106.0" r="2.5" />
  <text class="label" x="241.0" y="120.0">V</text>
</g>
<g class="point-group" id="point_A_right">
  <circle class="point" cx="145.0" cy="106.0" r="2.5" />
  <text class="label" x="145.0" y="120.0">A</text>
</g>
<g class="point-group" id="point_B_right">
  <circle class="point" cx="338.0" cy="106.0" r="2.5" />
  <text class="label" x="338.0" y="120.0">B</text>
</g>
<text class="label" x="292.0" y="16.0">C</text>
</svg>
