<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 203 183" width="203" height="183" class="euclid-graphic" data-graphic-id="0200.g1" data-folio="0200" data-graphic="g1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.2 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circle MDHNKM and Diameter MAN) -->
  <g id="elements">
    <circle id="el-cir-A" data-ref="( A M )" data-aliases="( M D H N K M )" data-type="circle" cx="103.0" cy="94.0" r="73.0" class="geom-circle" />
    <line id="el-line-MN" data-ref="[ M N ]" data-type="line" x1="30.0" y1="94.0" x2="176.0" y2="94.0" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Semicircles, Arcs, Radii, and Diameter Sections) -->
  <g id="graphics">
    <!-- Upper Semicircle MNHDM and Lower Semicircle MNKM -->
    <path id="el-semi-MNHDM" data-ref="( A M )&lt; N A M &gt;" data-aliases="MNHDM" data-type="wedge" d="M 30.0 94.0 A 73.0 73.0 0 0 1 176.0 94.0 Z" class="wedge angle geom-overlay" />
    <path id="el-semi-MNKM" data-ref="( A M )&lt; M A N &gt;" data-aliases="MNKM" data-type="wedge" d="M 30.0 94.0 A 73.0 73.0 0 0 0 176.0 94.0 Z" class="wedge angle geom-overlay" />

    <!-- Upper Circumference NHDM and Lower Circumference NKM -->
    <path id="el-arc-NHDM" data-ref="&lt; N A M )" data-aliases="NHDM" data-type="arc" d="M 176.0 94.0 A 73.0 73.0 0 0 0 30.0 94.0" class="geom-arc geom-overlay" />
    <path id="el-arc-NKM" data-ref="&lt; M A N )" data-aliases="NKM" data-type="arc" d="M 176.0 94.0 A 73.0 73.0 0 0 1 30.0 94.0" class="geom-arc geom-overlay" />

    <!-- Collinear Sub-Segments along Diameter MAN -->
    <line id="el-seg-MA" data-ref="/ M A /" data-aliases="/ A M /" data-type="segment" x1="30.0" y1="94.0" x2="103.0" y2="94.0" class="geom-line" />
    <line id="el-seg-AN" data-ref="/ A N /" data-aliases="/ N A /" data-type="segment" x1="103.0" y1="94.0" x2="176.0" y2="94.0" class="geom-line" />
    <line id="el-seg-MN" data-ref="/ M N /" data-aliases="/ M A N /" data-type="segment" x1="30.0" y1="94.0" x2="176.0" y2="94.0" class="geom-line geom-overlay" />

    <!-- Radii AD, AH, AK and Bent Line MAH -->
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="103.0" y1="94.0" x2="70.5" y2="28.6" class="geom-line" />
    <line id="el-seg-AH" data-ref="/ A H /" data-aliases="/ H A /" data-type="segment" x1="103.0" y1="94.0" x2="157.3" y2="45.1" class="geom-line" />
    <line id="el-seg-AK" data-ref="/ A K /" data-aliases="/ K A /" data-type="segment" x1="103.0" y1="94.0" x2="157.3" y2="142.9" class="geom-line" />
    <path id="el-sec-MAH" data-ref="/ M A H /" data-type="section" d="M 30.0 94.0 L 103.0 94.0 L 157.3 45.1" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-cir-A" data-ref="( A M )" data-aliases="( M D H N K M )" cx="103.0" cy="94.0" r="73.0" class="geom-circle geom-overlay" />
    <path id="hl-semi-MNHDM" data-ref="( A M )&lt; N A M &gt;" data-aliases="MNHDM" d="M 30.0 94.0 A 73.0 73.0 0 0 1 176.0 94.0 Z" class="wedge angle geom-overlay" />
    <path id="hl-semi-MNKM" data-ref="( A M )&lt; M A N &gt;" data-aliases="MNKM" d="M 30.0 94.0 A 73.0 73.0 0 0 0 176.0 94.0 Z" class="wedge angle geom-overlay" />
    <path id="hl-arc-NHDM" data-ref="&lt; N A M )" data-aliases="NHDM" d="M 176.0 94.0 A 73.0 73.0 0 0 0 30.0 94.0" class="geom-arc geom-overlay" />
    <path id="hl-arc-NKM" data-ref="&lt; M A N )" data-aliases="NKM" d="M 176.0 94.0 A 73.0 73.0 0 0 1 30.0 94.0" class="geom-arc geom-overlay" />
    <line id="hl-seg-MA" data-ref="/ M A /" data-aliases="/ A M /" x1="30.0" y1="94.0" x2="103.0" y2="94.0" class="geom-line geom-overlay" />
    <line id="hl-seg-AN" data-ref="/ A N /" data-aliases="/ N A /" x1="103.0" y1="94.0" x2="176.0" y2="94.0" class="geom-line geom-overlay" />
    <line id="hl-seg-MN" data-ref="/ M N /" data-aliases="/ M A N /" x1="30.0" y1="94.0" x2="176.0" y2="94.0" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="103.0" y1="94.0" x2="70.5" y2="28.6" class="geom-line geom-overlay" />
    <line id="hl-seg-AH" data-ref="/ A H /" data-aliases="/ H A /" x1="103.0" y1="94.0" x2="157.3" y2="45.1" class="geom-line geom-overlay" />
    <line id="hl-seg-AK" data-ref="/ A K /" data-aliases="/ K A /" x1="103.0" y1="94.0" x2="157.3" y2="142.9" class="geom-line geom-overlay" />
    <path id="hl-sec-MAH" data-ref="/ M A H /" d="M 30.0 94.0 L 103.0 94.0 L 157.3 45.1" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="103.0" cy="94.0" r="3.2" class="geom-point" />
    <circle id="el-pt-M" data-ref="M" data-type="point" cx="30.0" cy="94.0" r="3.2" class="geom-point" />
    <circle id="el-pt-N" data-ref="N" data-type="point" cx="176.0" cy="94.0" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="70.5" cy="28.6" r="3.2" class="geom-point" />
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="157.3" cy="45.1" r="3.2" class="geom-point" />
    <circle id="el-pt-K" data-ref="K" data-type="point" cx="157.3" cy="142.9" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="98.0" y="109.0" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-M" data-ref="M" x="19.0" y="98.0" text-anchor="middle" class="geom-label">M</text>
    <text id="lbl-N" data-ref="N" x="187.0" y="98.0" text-anchor="middle" class="geom-label">N</text>
    <text id="lbl-D" data-ref="D" x="66.0" y="21.0" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-H" data-ref="H" x="167.0" y="42.0" text-anchor="middle" class="geom-label">H</text>
    <text id="lbl-K" data-ref="K" x="167.0" y="153.0" text-anchor="middle" class="geom-label">K</text>
  </g>
</svg>
