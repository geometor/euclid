<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 203 183" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line, .circle { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Circle -->
<g class="interactive" id="circle_A">
  <circle class="circle" cx="103.0" cy="94.0" r="73.0" />
</g>

<!-- Diameter MAN -->
<g class="interactive" id="diam_MAN">
  <line class="line" x1="30.0" y1="94.0" x2="176.0" y2="94.0" />
</g>

<!-- Radii AK, AH, AD -->
<g class="interactive" id="radius_AK">
  <line class="line" x1="103.0" y1="94.0" x2="63.0" y2="22.0" />
</g>
<g class="interactive" id="radius_AH">
  <line class="line" x1="103.0" y1="94.0" x2="160.0" y2="42.0" />
</g>
<g class="interactive" id="radius_AD">
  <line class="line" x1="103.0" y1="94.0" x2="155.0" y2="145.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_M">
  <circle class="point" cx="30.0" cy="94.0" r="2.5" />
  <text class="label" x="20.0" y="94.0">M</text>
</g>
<g class="point-group" id="point_N">
  <circle class="point" cx="176.0" cy="94.0" r="2.5" />
  <text class="label" x="186.0" y="94.0">N</text>
</g>
<g class="point-group" id="point_A">
  <circle class="point" cx="103.0" cy="94.0" r="2.5" />
  <text class="label" x="98.0" y="105.0">A</text>
</g>
<g class="point-group" id="point_K">
  <circle class="point" cx="63.0" cy="22.0" r="2.5" />
  <text class="label" x="63.0" y="12.0">K</text>
</g>
<g class="point-group" id="point_H">
  <circle class="point" cx="160.0" cy="42.0" r="2.5" />
  <text class="label" x="168.0" y="34.0">H</text>
</g>
<g class="point-group" id="point_D">
  <circle class="point" cx="155.0" cy="145.0" r="2.5" />
  <text class="label" x="165.0" y="152.0">D</text>
</g>
</svg>
