<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 86 92" width="100%" height="auto">
<style>
  .point { fill: #000000; }
  .polygon { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s, fill 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; fill: rgba(2, 132, 199, 0.05); }
  .point:hover { fill: #0284c7; r: 3.5; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Barb-like / hollow-angled quadrilateral -->
<g class="interactive" id="quadrilateral">
  <polygon class="polygon" points="40.0,13.0 7.0,75.0 36.0,49.0 70.0,78.0" />
</g>

<!-- Vertices -->
<circle class="point" cx="40.0" cy="13.0" r="2.5" />
<circle class="point" cx="7.0" cy="75.0" r="2.5" />
<circle class="point" cx="36.0" cy="49.0" r="2.5" />
<circle class="point" cx="70.0" cy="78.0" r="2.5" />
</svg>
