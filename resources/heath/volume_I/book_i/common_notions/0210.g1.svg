<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 162 176" width="162" height="176" class="euclid-graphic" data-graphic-id="0210.g1" data-folio="0210" data-graphic="g1" data-proposition="Post.1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-aux {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-dasharray: 4,3;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve, .geom-ellipse {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <circle id="el-circle-BA" data-ref="( B A )" data-aliases="( A E F )" data-type="circle" cx="86.5" cy="85.0" r="59.0" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Polygons, Segments, Arcs, Angle Wedges) -->
  <g id="graphics">
    <polygon id="el-poly-ACBD" data-ref="&lt; A C B D &gt;" data-type="polygon" points="27.5,85.0 57.0,77.0 86.5,85.0 57.0,93.0" class="geom-polygon" />
    <path id="el-sec-ACB" data-ref="/ A C B /" data-type="section" d="M 27.50 85.00 Q 57.00 69.00 86.50 85.00" class="geom-curve" />
    <path id="el-sec-ADB" data-ref="/ A D B /" data-type="section" d="M 27.50 85.00 Q 57.00 101.00 86.50 85.00" class="geom-curve" />
    <path id="el-seg-BF" data-ref="/ B F /" data-type="segment" d="M 86.50 85.00 Q 112.00 99.00 134.83 118.84" class="geom-curve" />
    <path id="el-seg-BE" data-ref="/ B E /" data-type="segment" d="M 86.50 85.00 Q 112.00 71.00 134.83 51.16" class="geom-curve" />
    <path id="el-sec-ACBF" data-ref="/ A C B F /" data-type="section" d="M 27.50 85.00 Q 57.00 69.00 86.50 85.00 Q 112.00 99.00 134.83 118.84" class="geom-curve geom-overlay" />
    <path id="el-sec-ADBE" data-ref="/ A D B E /" data-type="section" d="M 27.50 85.00 Q 57.00 101.00 86.50 85.00 Q 112.00 71.00 134.83 51.16" class="geom-curve geom-overlay" />
    <line id="el-seg-AB" data-ref="/ A B /" data-type="segment" x1="27.5" y1="85.0" x2="86.5" y2="85.0" class="geom-line geom-overlay" />
    <path id="el-arc-AE" data-ref="( A E )" data-type="arc" d="M 27.50 85.00 A 59.0 59.0 0 0 1 134.83 51.16" class="geom-arc geom-overlay" />
    <path id="el-arc-AEF" data-ref="( A E F )" data-type="arc" d="M 27.50 85.00 A 59.0 59.0 0 1 1 134.83 118.84" class="geom-arc geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circle-BA" data-ref="( B A )" cx="86.5" cy="85.0" r="59.0" class="geom-circle geom-overlay" />
    <polygon id="hl-poly-ACBD" data-ref="&lt; A C B D &gt;" points="27.5,85.0 57.0,77.0 86.5,85.0 57.0,93.0" class="geom-polygon geom-overlay" />
    <path id="hl-sec-ACB" data-ref="/ A C B /" d="M 27.50 85.00 Q 57.00 69.00 86.50 85.00" class="geom-curve geom-overlay" />
    <path id="hl-sec-ADB" data-ref="/ A D B /" d="M 27.50 85.00 Q 57.00 101.00 86.50 85.00" class="geom-curve geom-overlay" />
    <path id="hl-seg-BF" data-ref="/ B F /" d="M 86.50 85.00 Q 112.00 99.00 134.83 118.84" class="geom-curve geom-overlay" />
    <path id="hl-seg-BE" data-ref="/ B E /" d="M 86.50 85.00 Q 112.00 71.00 134.83 51.16" class="geom-curve geom-overlay" />
    <path id="hl-sec-ACBF" data-ref="/ A C B F /" d="M 27.50 85.00 Q 57.00 69.00 86.50 85.00 Q 112.00 99.00 134.83 118.84" class="geom-curve geom-overlay" />
    <path id="hl-sec-ADBE" data-ref="/ A D B E /" d="M 27.50 85.00 Q 57.00 101.00 86.50 85.00 Q 112.00 71.00 134.83 51.16" class="geom-curve geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" x1="27.5" y1="85.0" x2="86.5" y2="85.0" class="geom-line geom-overlay" />
    <path id="hl-arc-AE" data-ref="( A E )" d="M 27.50 85.00 A 59.0 59.0 0 0 1 134.83 51.16" class="geom-arc geom-overlay" />
    <path id="hl-arc-AEF" data-ref="( A E F )" d="M 27.50 85.00 A 59.0 59.0 0 1 1 134.83 118.84" class="geom-arc geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="27.5" cy="85.0" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="86.5" cy="85.0" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="57.0" cy="77.0" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="57.0" cy="93.0" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="134.83" cy="51.16" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="134.83" cy="118.84" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="16.0" y="89.0" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="86.5" y="75.0" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="57.0" y="67.0" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="57.0" y="109.0" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="145.0" y="48.0" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="145.0" y="128.0" text-anchor="middle" class="geom-label">F</text>
  </g>
</svg>
