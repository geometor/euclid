<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 162 176" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line, .circle { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Circle -->
<g class="interactive" id="circle">
  <circle class="circle" cx="86.5" cy="85.0" r="59.0" />
</g>

<!-- Diameters ACBF and ADBE -->
<g class="interactive" id="diam_AB_1">
  <line class="line" x1="27.5" y1="85.0" x2="145.5" y2="85.0" />
</g>
<g class="interactive" id="diam_AB_2">
  <line class="line" x1="44.8" y1="43.3" x2="128.2" y2="126.7" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_A">
  <circle class="point" cx="27.5" cy="85.0" r="2.5" />
  <text class="label" x="18.0" y="85.0">A</text>
</g>
<g class="point-group" id="point_B">
  <circle class="point" cx="145.5" cy="85.0" r="2.5" />
  <text class="label" x="154.0" y="85.0">B</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="86.5" cy="85.0" r="2.5" />
  <text class="label" x="86.5" y="75.0">C</text>
</g>
<g class="point-group" id="point_D">
  <circle class="point" cx="86.5" cy="85.0" r="2.5" />
  <text class="label" x="96.0" y="93.0">D</text>
</g>
<g class="point-group" id="point_E">
  <circle class="point" cx="128.2" cy="126.7" r="2.5" />
  <text class="label" x="136.0" y="134.0">E</text>
</g>
<g class="point-group" id="point_F">
  <circle class="point" cx="44.8" cy="43.3" r="2.5" />
  <text class="label" x="38.0" y="35.0">F</text>
</g>
</svg>
