<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 73 145" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line, .curve { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Straight line AX -->
<g class="interactive" id="line_AX">
  <line class="line" x1="36.5" y1="20.0" x2="36.5" y2="125.0" />
</g>

<!-- Curved line enclosing space -->
<g class="interactive" id="curve_AX">
  <path class="curve" d="M 36.5 20.0 Q 56.0 72.5 36.5 125.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_A">
  <circle class="point" cx="36.5" cy="20.0" r="2.5" />
  <text class="label" x="36.5" y="10.0">A</text>
</g>
<g class="point-group" id="point_X">
  <circle class="point" cx="36.5" cy="125.0" r="2.5" />
  <text class="label" x="36.5" y="135.0">X</text>
</g>
</svg>
