<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 165" width="90" height="165" class="euclid-graphic" data-graphic-id="0210.g2" data-folio="0210" data-graphic="g2" data-proposition="Post.1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-aux {
      stroke: #000000;
      stroke-width: 1.6;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve, .geom-ellipse {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-label-sm {
      font-size: 11px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics -->
  <g id="graphics">
    <polygon id="el-poly-ABXC" data-ref="&lt; A B X C &gt;" data-type="polygon" points="45.0,140.0 35.5,82.0 45.0,24.0 54.5,82.0" class="geom-polygon" />
    <line id="el-seg-AX" data-ref="/ A X /" data-type="segment" x1="45.0" y1="140.0" x2="45.0" y2="24.0" class="geom-line" />
    <path id="el-sec-ABX" data-ref="/ A B X /" data-type="section" d="M 45.0 140.0 Q 26.0 82.0 45.0 24.0" class="geom-curve" />
    <path id="el-sec-ACX" data-ref="/ A C X /" data-type="section" d="M 45.0 140.0 Q 64.0 82.0 45.0 24.0" class="geom-curve" />
    <line id="el-seg-BC-1" data-ref="/ B C /" data-type="segment" x1="33.0" y1="62.0" x2="57.0" y2="62.0" class="geom-aux" />
    <line id="el-seg-BC-2" data-ref="/ B D C /" data-type="section" x1="33.0" y1="102.0" x2="57.0" y2="102.0" class="geom-aux" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-ABXC" data-ref="&lt; A B X C &gt;" points="45.0,140.0 35.5,82.0 45.0,24.0 54.5,82.0" class="geom-polygon geom-overlay" />
    <line id="hl-seg-AX" data-ref="/ A X /" x1="45.0" y1="140.0" x2="45.0" y2="24.0" class="geom-line geom-overlay" />
    <path id="hl-sec-ABX" data-ref="/ A B X /" d="M 45.0 140.0 Q 26.0 82.0 45.0 24.0" class="geom-curve geom-overlay" />
    <path id="hl-sec-ACX" data-ref="/ A C X /" d="M 45.0 140.0 Q 64.0 82.0 45.0 24.0" class="geom-curve geom-overlay" />
    <line id="hl-seg-BC-1" data-ref="/ B C /" x1="33.0" y1="62.0" x2="57.0" y2="62.0" class="geom-aux geom-overlay" />
    <line id="hl-seg-BC-2" data-ref="/ B D C /" x1="33.0" y1="102.0" x2="57.0" y2="102.0" class="geom-aux geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="45.0" cy="140.0" r="3.5" class="geom-point" />
    <circle id="el-pt-X" data-ref="X" data-type="point" cx="45.0" cy="24.0" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="36.2" cy="62.0" r="2.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="45.0" cy="62.0" r="2.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="53.8" cy="62.0" r="2.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-X" data-ref="X" x="45.0" y="16.0" text-anchor="middle" class="geom-label">X</text>
    <text id="lbl-A" data-ref="A" x="45.0" y="155.0" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B1" data-ref="B" x="24.0" y="66.0" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-D1" data-ref="D" x="41.0" y="60.0" text-anchor="middle" class="geom-label-sm">D</text>
    <text id="lbl-C1" data-ref="C" x="66.0" y="66.0" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-B2" data-ref="B" x="24.0" y="106.0" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-D2" data-ref="D" x="41.0" y="100.0" text-anchor="middle" class="geom-label-sm">D</text>
    <text id="lbl-C2" data-ref="C" x="66.0" y="106.0" text-anchor="middle" class="geom-label">C</text>
  </g>
</svg>
