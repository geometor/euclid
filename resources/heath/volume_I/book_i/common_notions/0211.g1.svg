<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226 248" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line, .circle { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Circle with centre B and radius BA -->
<g class="interactive" id="circle_B">
  <circle class="circle" cx="116.5" cy="122.5" r="76.0" />
</g>

<!-- Common segment AB produced to C -->
<g class="interactive" id="line_AC">
  <line class="line" x1="40.5" y1="122.5" x2="192.5" y2="122.5" />
</g>

<!-- Line AD through centre B -->
<g class="interactive" id="line_AD">
  <line class="line" x1="116.5" y1="122.5" x2="170.0" y2="176.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_A">
  <circle class="point" cx="40.5" cy="122.5" r="2.5" />
  <text class="label" x="30.0" y="122.5">A</text>
</g>
<g class="point-group" id="point_B">
  <circle class="point" cx="116.5" cy="122.5" r="2.5" />
  <text class="label" x="116.5" y="134.0">B</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="192.5" cy="122.5" r="2.5" />
  <text class="label" x="202.0" y="122.5">C</text>
</g>
<g class="point-group" id="point_D">
  <circle class="point" cx="170.0" cy="176.0" r="2.5" />
  <text class="label" x="178.0" y="184.0">D</text>
</g>
<g class="point-group" id="point_E">
  <circle class="point" cx="116.5" cy="46.5" r="2.5" />
  <text class="label" x="116.5" y="36.0">E</text>
</g>
</svg>
