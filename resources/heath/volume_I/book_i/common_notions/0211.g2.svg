<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 249" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line, .arc { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Arc BMC centered at X(110, 122) -->
<g class="interactive" id="arc_BMC">
  <path class="arc" d="M 32.0 69.0 A 93.0 93.0 0 0 1 188.0 69.0" />
</g>

<!-- Common segment AX and vertical line XM -->
<g class="interactive" id="line_AM">
  <line class="line" x1="110.0" y1="225.0" x2="110.0" y2="29.0" />
</g>

<!-- Produced lines XB and XC -->
<g class="interactive" id="line_XB">
  <line class="line" x1="110.0" y1="122.0" x2="32.0" y2="69.0" />
</g>
<g class="interactive" id="line_XC">
  <line class="line" x1="110.0" y1="122.0" x2="188.0" y2="69.0" />
</g>

<!-- Curved hypothetical line from A to M -->
<g class="interactive" id="secant_AKM">
  <path class="line" d="M 110.0 225.0 Q 60.0 130.0 110.0 29.0" stroke-dasharray="4,3" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_A">
  <circle class="point" cx="110.0" cy="225.0" r="2.5" />
  <text class="label" x="110.0" y="238.0">A</text>
</g>
<g class="point-group" id="point_X">
  <circle class="point" cx="110.0" cy="122.0" r="2.5" />
  <text class="label" x="120.0" y="125.0">X</text>
</g>
<g class="point-group" id="point_M">
  <circle class="point" cx="110.0" cy="29.0" r="2.5" />
  <text class="label" x="110.0" y="18.0">M</text>
</g>
<g class="point-group" id="point_B">
  <circle class="point" cx="32.0" cy="69.0" r="2.5" />
  <text class="label" x="22.0" y="69.0">B</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="188.0" cy="69.0" r="2.5" />
  <text class="label" x="198.0" y="69.0">C</text>
</g>
<g class="point-group" id="point_K">
  <circle class="point" cx="88.0" cy="167.0" r="2.5" />
  <text class="label" x="78.0" y="167.0">K</text>
</g>
</svg>
