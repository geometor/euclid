<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 129" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Baseline AB produced to C and D -->
<g class="interactive" id="line_AC">
  <line class="line" x1="25.0" y1="102.0" x2="160.0" y2="102.0" />
</g>
<g class="interactive" id="line_BD">
  <line class="line" x1="92.0" y1="102.0" x2="168.0" y2="72.0" />
</g>

<!-- Perpendiculars EB and FB -->
<g class="interactive" id="perp_EB">
  <line class="line" x1="92.0" y1="102.0" x2="92.0" y2="23.0" />
</g>
<g class="interactive" id="perp_FB">
  <line class="line" x1="92.0" y1="102.0" x2="62.0" y2="28.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_A">
  <circle class="point" cx="25.0" cy="102.0" r="2.5" />
  <text class="label" x="18.0" y="110.0">A</text>
</g>
<g class="point-group" id="point_B">
  <circle class="point" cx="92.0" cy="102.0" r="2.5" />
  <text class="label" x="92.0" y="114.0">B</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="160.0" cy="102.0" r="2.5" />
  <text class="label" x="168.0" y="110.0">C</text>
</g>
<g class="point-group" id="point_D">
  <circle class="point" cx="168.0" cy="72.0" r="2.5" />
  <text class="label" x="176.0" y="70.0">D</text>
</g>
<g class="point-group" id="point_E">
  <circle class="point" cx="92.0" cy="23.0" r="2.5" />
  <text class="label" x="98.0" y="16.0">E</text>
</g>
<g class="point-group" id="point_F">
  <circle class="point" cx="62.0" cy="28.0" r="2.5" />
  <text class="label" x="55.0" y="24.0">F</text>
</g>
</svg>
