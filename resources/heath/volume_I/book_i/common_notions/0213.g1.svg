<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 129" width="190" height="129" class="euclid-graphic" data-graphic-id="0213.g1" data-folio="0213" data-graphic="g1" data-proposition="Post.2">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Segments, Sections, Angle Wedges) -->
  <g id="graphics">
    <line id="el-seg-AB" data-ref="/ A B /" data-type="segment" x1="25.0" y1="102.0" x2="92.0" y2="102.0" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-type="segment" x1="92.0" y1="102.0" x2="165.0" y2="102.0" class="geom-line" />
    <line id="el-seg-BD" data-ref="/ B D /" data-type="segment" x1="92.0" y1="102.0" x2="167.55" y2="78.90" class="geom-line" />
    <line id="el-seg-BE" data-ref="/ B E /" data-type="segment" x1="92.0" y1="102.0" x2="92.0" y2="23.0" class="geom-line" />
    <line id="el-seg-BF" data-ref="/ B F /" data-type="segment" x1="92.0" y1="102.0" x2="68.90" y2="26.45" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ A B C /" data-type="segment" x1="25.0" y1="102.0" x2="165.0" y2="102.0" class="geom-line geom-overlay" />
    <polyline id="el-sec-ABD" data-ref="/ A D /" data-aliases="/ A B D /" data-type="section" points="25.0,102.0 92.0,102.0 167.55,78.90" class="geom-line geom-overlay" />
    <path id="el-ang-EBC" data-ref="&lt; E B C )" data-type="wedge" d="M 92.00 102.00 L 92.00 80.00 A 22.0 22.0 0 0 1 114.00 102.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-EBD" data-ref="&lt; E B D )" data-type="wedge" d="M 92.00 102.00 L 92.00 76.00 A 26.0 26.0 0 0 1 116.86 94.40 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-EBA" data-ref="&lt; E B A )" data-type="wedge" d="M 92.00 102.00 L 70.00 102.00 A 22.0 22.0 0 0 1 92.00 80.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-FBA" data-ref="&lt; F B A )" data-type="wedge" d="M 92.00 102.00 L 66.00 102.00 A 26.0 26.0 0 0 1 84.40 77.14 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-seg-AB" data-ref="/ A B /" x1="25.0" y1="102.0" x2="92.0" y2="102.0" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" x1="92.0" y1="102.0" x2="165.0" y2="102.0" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" x1="92.0" y1="102.0" x2="167.55" y2="78.90" class="geom-line geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" x1="92.0" y1="102.0" x2="92.0" y2="23.0" class="geom-line geom-overlay" />
    <line id="hl-seg-BF" data-ref="/ B F /" x1="92.0" y1="102.0" x2="68.90" y2="26.45" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ A B C /" x1="25.0" y1="102.0" x2="165.0" y2="102.0" class="geom-line geom-overlay" />
    <polyline id="hl-sec-ABD" data-ref="/ A D /" data-aliases="/ A B D /" points="25.0,102.0 92.0,102.0 167.55,78.90" class="geom-line geom-overlay" />
    <path id="hl-ang-EBC" data-ref="&lt; E B C )" d="M 92.00 102.00 L 92.00 80.00 A 22.0 22.0 0 0 1 114.00 102.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-EBD" data-ref="&lt; E B D )" d="M 92.00 102.00 L 92.00 76.00 A 26.0 26.0 0 0 1 116.86 94.40 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-EBA" data-ref="&lt; E B A )" d="M 92.00 102.00 L 70.00 102.00 A 22.0 22.0 0 0 1 92.00 80.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-FBA" data-ref="&lt; F B A )" d="M 92.00 102.00 L 66.00 102.00 A 26.0 26.0 0 0 1 84.40 77.14 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="25.0" cy="102.0" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="92.0" cy="102.0" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="165.0" cy="102.0" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="167.55" cy="78.90" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="92.0" cy="23.0" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="68.90" cy="26.45" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="22.0" y="118.0" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="92.0" y="118.0" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="166.0" y="118.0" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="168.0" y="70.0" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="99.0" y="23.0" text-anchor="start" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="62.0" y="29.0" text-anchor="end" class="geom-label">F</text>
  </g>
</svg>
