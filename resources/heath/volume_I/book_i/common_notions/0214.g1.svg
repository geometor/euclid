<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 116" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Left figure: angle ABC with CB produced to H and BG within ABC -->
<g class="interactive" id="line_CH">
  <line class="line" x1="15.0" y1="80.0" x2="145.0" y2="80.0" />
</g>
<g class="interactive" id="line_AB">
  <line class="line" x1="74.0" y1="80.0" x2="74.0" y2="15.0" />
</g>
<g class="interactive" id="line_GK">
  <line class="line" x1="20.0" y1="108.0" x2="135.0" y2="48.0" />
</g>

<!-- Right figure: angle DEF with ED perpendicular to EF -->
<g class="interactive" id="line_EF">
  <line class="line" x1="195.0" y1="80.0" x2="270.0" y2="80.0" />
</g>
<g class="interactive" id="line_DE">
  <line class="line" x1="195.0" y1="80.0" x2="195.0" y2="15.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_C">
  <circle class="point" cx="15.0" cy="80.0" r="2.5" />
  <text class="label" x="8.0" y="80.0">C</text>
</g>
<g class="point-group" id="point_B">
  <circle class="point" cx="74.0" cy="80.0" r="2.5" />
  <text class="label" x="74.0" y="90.0">B</text>
</g>
<g class="point-group" id="point_H">
  <circle class="point" cx="145.0" cy="80.0" r="2.5" />
  <text class="label" x="153.0" y="80.0">H</text>
</g>
<g class="point-group" id="point_A">
  <circle class="point" cx="74.0" cy="15.0" r="2.5" />
  <text class="label" x="66.0" y="12.0">A</text>
</g>
<g class="point-group" id="point_G">
  <circle class="point" cx="135.0" cy="48.0" r="2.5" />
  <text class="label" x="142.0" y="44.0">G</text>
</g>
<g class="point-group" id="point_K">
  <circle class="point" cx="20.0" cy="108.0" r="2.5" />
  <text class="label" x="14.0" y="112.0">K</text>
</g>
<g class="point-group" id="point_D">
  <circle class="point" cx="195.0" cy="15.0" r="2.5" />
  <text class="label" x="187.0" y="12.0">D</text>
</g>
<g class="point-group" id="point_E">
  <circle class="point" cx="195.0" cy="80.0" r="2.5" />
  <text class="label" x="195.0" y="90.0">E</text>
</g>
<g class="point-group" id="point_F">
  <circle class="point" cx="270.0" cy="80.0" r="2.5" />
  <text class="label" x="278.0" y="80.0">F</text>
</g>
</svg>
