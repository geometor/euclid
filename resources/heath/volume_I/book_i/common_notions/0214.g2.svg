<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 106" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Line AB -->
<g class="interactive" id="line_AB">
  <line class="line" x1="18.0" y1="32.0" x2="151.0" y2="32.0" />
</g>

<!-- Line CXD -->
<g class="interactive" id="line_CD">
  <line class="line" x1="27.0" y1="63.0" x2="71.0" y2="32.0" />
  <line class="line" x1="71.0" y1="32.0" x2="125.0" y2="82.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_A">
  <circle class="point" cx="18.0" cy="32.0" r="2.5" />
  <text class="label" x="18.0" y="20.0">A</text>
</g>
<g class="point-group" id="point_B">
  <circle class="point" cx="151.0" cy="32.0" r="2.5" />
  <text class="label" x="151.0" y="20.0">B</text>
</g>
<g class="point-group" id="point_X">
  <circle class="point" cx="71.0" cy="32.0" r="2.5" />
  <text class="label" x="75.0" y="20.0">X</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="27.0" cy="63.0" r="2.5" />
  <text class="label" x="27.0" y="75.0">C</text>
</g>
<g class="point-group" id="point_D">
  <circle class="point" cx="125.0" cy="82.0" r="2.5" />
  <text class="label" x="125.0" y="94.0">D</text>
</g>
</svg>
