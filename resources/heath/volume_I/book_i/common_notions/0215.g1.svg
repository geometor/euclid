<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 294 148" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Baseline BC -->
<g class="interactive" id="line_BC">
  <line class="line" x1="11.0" y1="110.0" x2="272.0" y2="110.0" />
</g>

<!-- Perpendicular AD -->
<g class="interactive" id="line_AD">
  <line class="line" x1="216.0" y1="110.0" x2="216.0" y2="20.0" />
</g>

<!-- Transversal at H -->
<g class="interactive" id="line_FM">
  <line class="line" x1="57.0" y1="22.0" x2="80.0" y2="138.0" />
</g>
<g class="interactive" id="line_LH">
  <line class="line" x1="67.0" y1="110.0" x2="22.0" y2="82.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_B">
  <circle class="point" cx="11.0" cy="110.0" r="2.5" />
  <text class="label" x="11.0" y="122.0">B</text>
</g>
<g class="point-group" id="point_H">
  <circle class="point" cx="67.0" cy="110.0" r="2.5" />
  <text class="label" x="67.0" y="122.0">H</text>
</g>
<g class="point-group" id="point_A">
  <circle class="point" cx="216.0" cy="110.0" r="2.5" />
  <text class="label" x="216.0" y="122.0">A</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="272.0" cy="110.0" r="2.5" />
  <text class="label" x="272.0" y="122.0">C</text>
</g>
<g class="point-group" id="point_D">
  <circle class="point" cx="216.0" cy="20.0" r="2.5" />
  <text class="label" x="206.0" y="20.0">D</text>
</g>
<g class="point-group" id="point_F">
  <circle class="point" cx="57.0" cy="22.0" r="2.5" />
  <text class="label" x="57.0" y="12.0">F</text>
</g>
<g class="point-group" id="point_L">
  <circle class="point" cx="22.0" cy="82.0" r="2.5" />
  <text class="label" x="16.0" y="78.0">L</text>
</g>
<g class="point-group" id="point_M">
  <circle class="point" cx="80.0" cy="138.0" r="2.5" />
  <text class="label" x="90.0" y="140.0">M</text>
</g>
</svg>
