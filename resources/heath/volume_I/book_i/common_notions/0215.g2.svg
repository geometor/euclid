<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 168" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line, .arc { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Segments BA and BC at right angles -->
<g class="interactive" id="seg_BA">
  <line class="line" x1="81.0" y1="140.0" x2="81.0" y2="25.0" />
</g>
<g class="interactive" id="seg_BC">
  <line class="line" x1="81.0" y1="140.0" x2="195.0" y2="140.0" />
</g>

<!-- Semi-circle AEB on BA (center (81, 82.5), radius 57.5) -->
<g class="interactive" id="arc_AEB">
  <path class="arc" d="M 81.0 25.0 A 57.5 57.5 0 0 0 81.0 140.0" />
</g>

<!-- Semi-circle BDC on BC (center (138, 140), radius 57.0) -->
<g class="interactive" id="arc_BDC">
  <path class="arc" d="M 81.0 140.0 A 57.0 57.0 0 0 1 195.0 140.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_A">
  <circle class="point" cx="81.0" cy="25.0" r="2.5" />
  <text class="label" x="81.0" y="15.0">A</text>
</g>
<g class="point-group" id="point_B">
  <circle class="point" cx="81.0" cy="140.0" r="2.5" />
  <text class="label" x="72.0" y="148.0">B</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="195.0" cy="140.0" r="2.5" />
  <text class="label" x="195.0" y="152.0">C</text>
</g>
<g class="point-group" id="point_E">
  <circle class="point" cx="23.5" cy="82.5" r="2.5" />
  <text class="label" x="14.0" y="82.5">E</text>
</g>
<g class="point-group" id="point_D">
  <circle class="point" cx="138.0" cy="83.0" r="2.5" />
  <text class="label" x="138.0" y="72.0">D</text>
</g>
</svg>
