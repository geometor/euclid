<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 168" width="212" height="168" class="euclid-graphic" data-graphic-id="0215.g2" data-folio="0215" data-graphic="g2" data-proposition="Post.4">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve, .geom-ellipse {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <path id="el-arc-AEB" data-ref="( A E B )" data-type="arc" d="M 81.0 25.0 A 57.5 57.5 0 0 0 81.0 140.0" class="geom-arc" />
    <path id="el-arc-BDC" data-ref="( B D C )" data-type="arc" d="M 81.0 140.0 A 57.5 57.5 0 0 1 196.0 140.0" class="geom-arc" />
  </g>

  <!-- Constructed Graphics (Segments, Angle Wedges) -->
  <g id="graphics">
    <line id="el-seg-BA" data-ref="/ B A /" data-aliases="/ A B /" data-type="segment" x1="81.0" y1="140.0" x2="81.0" y2="25.0" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="81.0" y1="140.0" x2="196.0" y2="140.0" class="geom-line" />
    <path id="el-ang-ABC" data-ref="&lt; A B C )" data-type="wedge" d="M 81.00 140.00 L 81.00 116.00 A 24.0 24.0 0 0 1 105.00 140.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-EBA" data-ref="&lt; E B A )" data-type="wedge" d="M 81.00 140.00 A 57.5 57.5 0 0 1 56.00 125.00 A 29.0 29.0 0 0 1 81.00 111.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-DBC" data-ref="&lt; D B C )" data-type="wedge" d="M 81.00 140.00 A 57.5 57.5 0 0 1 96.00 115.00 A 29.0 29.0 0 0 1 110.00 140.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ABD" data-ref="&lt; A B D )" data-type="wedge" d="M 81.00 140.00 L 81.00 111.00 A 29.0 29.0 0 0 1 96.00 115.00 A 57.5 57.5 0 0 0 81.00 140.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-EBD" data-ref="&lt; E B D )" data-type="wedge" d="M 81.00 140.00 A 57.5 57.5 0 0 1 56.00 125.00 A 29.0 29.0 0 0 1 96.00 115.00 A 57.5 57.5 0 0 0 81.00 140.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <path id="hl-arc-AEB" data-ref="( A E B )" d="M 81.0 25.0 A 57.5 57.5 0 0 0 81.0 140.0" class="geom-arc geom-overlay" />
    <path id="hl-arc-BDC" data-ref="( B D C )" d="M 81.0 140.0 A 57.5 57.5 0 0 1 196.0 140.0" class="geom-arc geom-overlay" />
    <line id="hl-seg-BA" data-ref="/ B A /" data-aliases="/ A B /" x1="81.0" y1="140.0" x2="81.0" y2="25.0" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="81.0" y1="140.0" x2="196.0" y2="140.0" class="geom-line geom-overlay" />
    <path id="hl-ang-ABC" data-ref="&lt; A B C )" d="M 81.00 140.00 L 81.00 116.00 A 24.0 24.0 0 0 1 105.00 140.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-EBA" data-ref="&lt; E B A )" d="M 81.00 140.00 A 57.5 57.5 0 0 1 56.00 125.00 A 29.0 29.0 0 0 1 81.00 111.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-DBC" data-ref="&lt; D B C )" d="M 81.00 140.00 A 57.5 57.5 0 0 1 96.00 115.00 A 29.0 29.0 0 0 1 110.00 140.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ABD" data-ref="&lt; A B D )" d="M 81.00 140.00 L 81.00 111.00 A 29.0 29.0 0 0 1 96.00 115.00 A 57.5 57.5 0 0 0 81.00 140.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-EBD" data-ref="&lt; E B D )" d="M 81.00 140.00 A 57.5 57.5 0 0 1 56.00 125.00 A 29.0 29.0 0 0 1 96.00 115.00 A 57.5 57.5 0 0 0 81.00 140.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="81.0" cy="25.0" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="81.0" cy="140.0" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="196.0" cy="140.0" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="23.5" cy="82.5" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="138.5" cy="82.5" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="81.0" y="18.0" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="81.0" y="156.0" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="196.0" y="156.0" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-E" data-ref="E" x="14.0" y="86.0" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-D" data-ref="D" x="138.5" y="73.0" text-anchor="middle" class="geom-label">D</text>
  </g>
</svg>
