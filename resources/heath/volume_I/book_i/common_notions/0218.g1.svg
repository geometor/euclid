<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 148" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Lines meeting at L on left and K on right -->
<g class="interactive" id="line_AK">
  <line class="line" x1="17.0" y1="73.0" x2="218.0" y2="71.0" />
</g>
<g class="interactive" id="line_AB">
  <line class="line" x1="17.0" y1="73.0" x2="118.0" y2="49.0" />
  <line class="line" x1="118.0" y1="49.0" x2="218.0" y2="71.0" />
</g>
<g class="interactive" id="line_CD">
  <line class="line" x1="17.0" y1="73.0" x2="85.0" y2="95.0" />
  <line class="line" x1="85.0" y1="95.0" x2="218.0" y2="71.0" />
</g>

<!-- Transversal FG -->
<g class="interactive" id="line_FG">
  <line class="line" x1="126.0" y1="28.0" x2="77.0" y2="116.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_L">
  <circle class="point" cx="17.0" cy="73.0" r="2.5" />
  <text class="label" x="10.0" y="73.0">L</text>
</g>
<g class="point-group" id="point_K">
  <circle class="point" cx="218.0" cy="71.0" r="2.5" />
  <text class="label" x="226.0" y="71.0">K</text>
</g>
<g class="point-group" id="point_F">
  <circle class="point" cx="118.0" cy="49.0" r="2.5" />
  <text class="label" x="126.0" y="44.0">F</text>
</g>
<g class="point-group" id="point_G">
  <circle class="point" cx="85.0" cy="95.0" r="2.5" />
  <text class="label" x="78.0" y="103.0">G</text>
</g>
<g class="point-group" id="point_A">
  <text class="label" x="54.0" y="42.0">A</text>
</g>
<g class="point-group" id="point_B">
  <text class="label" x="187.0" y="42.0">B</text>
</g>
<g class="point-group" id="point_C">
  <text class="label" x="54.0" y="103.0">C</text>
</g>
<g class="point-group" id="point_D">
  <text class="label" x="187.0" y="103.0">D</text>
</g>
</svg>
