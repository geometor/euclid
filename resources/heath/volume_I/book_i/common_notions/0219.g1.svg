    <path id="el-ang-BFG" data-ref="&lt; B F G )" data-aliases="&lt; G F B ) | ( F B )&lt; B F G &gt;" data-type="wedge" d="M 136.0 30.0 L 154.00 30.00 A 18.0 18.0 0 0 1 127.69 45.96 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-CGF" data-ref="&lt; C G F )" data-aliases="&lt; F G C ) | ( G C )&lt; C G F &gt;" data-type="wedge" d="M 111.0 78.0 L 93.00 78.00 A 18.0 18.0 0 0 1 119.31 62.04 Z" class="wedge angle geom-overlay" />
