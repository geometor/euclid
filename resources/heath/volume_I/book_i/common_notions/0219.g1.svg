<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 141" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Parallels AB and CD -->
<g class="interactive" id="line_AB">
  <line class="line" x1="25.0" y1="30.0" x2="200.0" y2="30.0" />
</g>
<g class="interactive" id="line_CD">
  <line class="line" x1="25.0" y1="78.0" x2="200.0" y2="78.0" />
</g>

<!-- Transversal FG -->
<g class="interactive" id="line_FG">
  <line class="line" x1="145.0" y1="12.0" x2="100.0" y2="98.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_A">
  <circle class="point" cx="25.0" cy="30.0" r="2.5" />
  <text class="label" x="15.0" y="30.0">A</text>
</g>
<g class="point-group" id="point_B">
  <circle class="point" cx="200.0" cy="30.0" r="2.5" />
  <text class="label" x="210.0" y="30.0">B</text>
</g>
<g class="point-group" id="point_F">
  <circle class="point" cx="136.0" cy="30.0" r="2.5" />
  <text class="label" x="142.0" y="20.0">F</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="25.0" cy="78.0" r="2.5" />
  <text class="label" x="15.0" y="78.0">C</text>
</g>
<g class="point-group" id="point_D">
  <circle class="point" cx="200.0" cy="78.0" r="2.5" />
  <text class="label" x="210.0" y="78.0">D</text>
</g>
<g class="point-group" id="point_G">
  <circle class="point" cx="111.0" cy="78.0" r="2.5" />
  <text class="label" x="111.0" y="90.0">G</text>
</g>
</svg>
