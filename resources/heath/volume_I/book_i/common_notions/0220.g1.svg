<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 199 188" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line, .polygon { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Line ABK -->
<g class="interactive" id="line_AK">
  <line class="line" x1="25.0" y1="75.0" x2="175.0" y2="35.0" />
</g>

<!-- Line CGK -->
<g class="interactive" id="line_CK">
  <line class="line" x1="20.0" y1="165.0" x2="175.0" y2="35.0" />
</g>

<!-- Transversal FG -->
<g class="interactive" id="line_FG">
  <line class="line" x1="90.0" y1="20.0" x2="62.0" y2="170.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_A">
  <circle class="point" cx="25.0" cy="75.0" r="2.5" />
  <text class="label" x="16.0" y="75.0">A</text>
</g>
<g class="point-group" id="point_F">
  <circle class="point" cx="85.0" cy="59.0" r="2.5" />
  <text class="label" x="80.0" y="50.0">F</text>
</g>
<g class="point-group" id="point_B">
  <circle class="point" cx="140.0" cy="44.0" r="2.5" />
  <text class="label" x="140.0" y="34.0">B</text>
</g>
<g class="point-group" id="point_K">
  <circle class="point" cx="175.0" cy="35.0" r="2.5" />
  <text class="label" x="185.0" y="35.0">K</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="20.0" cy="165.0" r="2.5" />
  <text class="label" x="12.0" y="165.0">C</text>
</g>
<g class="point-group" id="point_G">
  <circle class="point" cx="69.0" cy="124.0" r="2.5" />
  <text class="label" x="78.0" y="132.0">G</text>
</g>
<g class="point-group" id="point_D">
  <circle class="point" cx="150.0" cy="56.0" r="2.5" />
  <text class="label" x="158.0" y="66.0">D</text>
</g>
</svg>
