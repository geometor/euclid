<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 271 151" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Line AF -->
<g class="interactive" id="line_AF">
  <line class="line" x1="25.0" y1="30.0" x2="245.0" y2="30.0" />
</g>

<!-- Line CG -->
<g class="interactive" id="line_CG">
  <line class="line" x1="25.0" y1="85.0" x2="245.0" y2="85.0" />
</g>

<!-- Transversal FG with points F, K, H, L, G -->
<g class="interactive" id="line_FG">
  <line class="line" x1="25.0" y1="130.0" x2="245.0" y2="130.0" />
  <line class="line" x1="25.0" y1="30.0" x2="25.0" y2="130.0" />
</g>

<!-- Tick marks on transversal -->
<line class="line" x1="80.0" y1="126.0" x2="80.0" y2="134.0" />
<line class="line" x1="135.0" y1="126.0" x2="135.0" y2="134.0" />
<line class="line" x1="190.0" y1="126.0" x2="190.0" y2="134.0" />

<!-- Points and Labels -->
<g class="point-group" id="point_A">
  <circle class="point" cx="25.0" cy="30.0" r="2.5" />
  <text class="label" x="15.0" y="30.0">A</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="25.0" cy="85.0" r="2.5" />
  <text class="label" x="15.0" y="85.0">C</text>
</g>
<g class="point-group" id="point_F">
  <circle class="point" cx="25.0" cy="130.0" r="2.5" />
  <text class="label" x="15.0" y="138.0">F</text>
</g>
<g class="point-group" id="point_K">
  <circle class="point" cx="80.0" cy="130.0" r="2.5" />
  <text class="label" x="80.0" y="142.0">K</text>
</g>
<g class="point-group" id="point_H">
  <circle class="point" cx="135.0" cy="130.0" r="2.5" />
  <text class="label" x="135.0" y="142.0">H</text>
</g>
<g class="point-group" id="point_L">
  <circle class="point" cx="190.0" cy="130.0" r="2.5" />
  <text class="label" x="190.0" y="142.0">L</text>
</g>
<g class="point-group" id="point_G">
  <circle class="point" cx="245.0" cy="130.0" r="2.5" />
  <text class="label" x="255.0" y="138.0">G</text>
</g>
</svg>
