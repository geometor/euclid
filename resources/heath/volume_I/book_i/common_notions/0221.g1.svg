<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 119" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Parallels AB and CD -->
<g class="interactive" id="line_AB">
  <line class="line" x1="20.0" y1="46.0" x2="170.0" y2="46.0" />
</g>
<g class="interactive" id="line_CD">
  <line class="line" x1="20.0" y1="90.0" x2="170.0" y2="90.0" />
</g>

<!-- Line EFG -->
<g class="interactive" id="line_EFG">
  <line class="line" x1="75.0" y1="15.0" x2="140.0" y2="105.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_E">
  <circle class="point" cx="75.0" cy="15.0" r="2.5" />
  <text class="label" x="83.0" y="15.0">E</text>
</g>
<g class="point-group" id="point_F">
  <circle class="point" cx="97.5" cy="46.0" r="2.5" />
  <text class="label" x="105.0" y="38.0">F</text>
</g>
<g class="point-group" id="point_G">
  <circle class="point" cx="129.5" cy="90.0" r="2.5" />
  <text class="label" x="138.0" y="82.0">G</text>
</g>
<g class="point-group" id="point_A">
  <text class="label" x="20.0" y="38.0">A</text>
</g>
<g class="point-group" id="point_B">
  <text class="label" x="170.0" y="38.0">B</text>
</g>
<g class="point-group" id="point_C">
  <text class="label" x="20.0" y="100.0">C</text>
</g>
<g class="point-group" id="point_D">
  <text class="label" x="170.0" y="100.0">D</text>
</g>
</svg>
