    <line id="el-seg-EG" data-ref="/ E G /" data-aliases="/ G E /;/ E F G /;EG;EFG" data-type="segment" x1="75.0" y1="25.0" x2="121.0" y2="71.0" class="geom-line" />
    <line id="el-seg-EF" data-ref="/ E F /" data-aliases="/ F E /;EF;FE" data-type="segment" x1="75.0" y1="25.0" x2="96.0" y2="46.0" class="geom-line" />
