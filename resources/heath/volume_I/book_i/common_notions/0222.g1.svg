<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 219 107" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Line CD -->
<g class="interactive" id="line_CD">
  <line class="line" x1="20.0" y1="78.0" x2="185.0" y2="78.0" />
</g>

<!-- Parallel KH through E -->
<g class="interactive" id="line_KH">
  <line class="line" x1="20.0" y1="35.0" x2="200.0" y2="35.0" />
</g>

<!-- Line AB through E -->
<g class="interactive" id="line_AB">
  <line class="line" x1="20.0" y1="20.0" x2="200.0" y2="49.0" />
</g>

<!-- Transversal EF -->
<g class="interactive" id="line_EF">
  <line class="line" x1="115.0" y1="35.0" x2="60.0" y2="78.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_A">
  <text class="label" x="20.0" y="12.0">A</text>
</g>
<g class="point-group" id="point_K">
  <text class="label" x="12.0" y="35.0">K</text>
</g>
<g class="point-group" id="point_C">
  <text class="label" x="12.0" y="78.0">C</text>
</g>
<g class="point-group" id="point_E">
  <circle class="point" cx="115.0" cy="35.0" r="2.5" />
  <text class="label" x="115.0" y="24.0">E</text>
</g>
<g class="point-group" id="point_F">
  <circle class="point" cx="60.0" cy="78.0" r="2.5" />
  <text class="label" x="60.0" y="90.0">F</text>
</g>
<g class="point-group" id="point_H">
  <text class="label" x="208.0" y="35.0">H</text>
</g>
<g class="point-group" id="point_B">
  <text class="label" x="208.0" y="52.0">B</text>
</g>
<g class="point-group" id="point_D">
  <text class="label" x="195.0" y="85.0">D</text>
</g>
</svg>
