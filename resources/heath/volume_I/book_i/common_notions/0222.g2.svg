<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 147" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 13px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Line CD -->
<g class="interactive" id="line_CD">
  <line class="line" x1="19.0" y1="96.0" x2="164.0" y2="96.0" />
</g>

<!-- Line AB -->
<g class="interactive" id="line_AB">
  <line class="line" x1="19.0" y1="52.0" x2="164.0" y2="23.0" />
</g>

<!-- Perpendiculars EF, GH, KL -->
<g class="interactive" id="perp_EF">
  <line class="line" x1="54.0" y1="45.0" x2="54.0" y2="96.0" />
</g>
<g class="interactive" id="perp_GH">
  <line class="line" x1="77.0" y1="40.0" x2="77.0" y2="96.0" />
</g>
<g class="interactive" id="perp_KL">
  <line class="line" x1="101.0" y1="35.5" x2="101.0" y2="96.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_A">
  <circle class="point" cx="19.0" cy="52.0" r="2.5" />
  <text class="label" x="12.0" y="52.0">A</text>
</g>
<g class="point-group" id="point_B">
  <circle class="point" cx="164.0" cy="23.0" r="2.5" />
  <text class="label" x="172.0" y="23.0">B</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="19.0" cy="96.0" r="2.5" />
  <text class="label" x="12.0" y="96.0">C</text>
</g>
<g class="point-group" id="point_D">
  <circle class="point" cx="164.0" cy="96.0" r="2.5" />
  <text class="label" x="172.0" y="96.0">D</text>
</g>
<g class="point-group" id="point_E">
  <circle class="point" cx="54.0" cy="45.0" r="2.5" />
  <text class="label" x="54.0" y="34.0">E</text>
</g>
<g class="point-group" id="point_F">
  <circle class="point" cx="54.0" cy="96.0" r="2.5" />
  <text class="label" x="54.0" y="106.0">F</text>
</g>
<g class="point-group" id="point_G">
  <circle class="point" cx="77.0" cy="40.0" r="2.5" />
  <text class="label" x="77.0" y="29.0">G</text>
</g>
<g class="point-group" id="point_H">
  <circle class="point" cx="77.0" cy="96.0" r="2.5" />
  <text class="label" x="77.0" y="106.0">H</text>
</g>
<g class="point-group" id="point_K">
  <circle class="point" cx="101.0" cy="35.5" r="2.5" />
  <text class="label" x="101.0" y="24.0">K</text>
</g>
<g class="point-group" id="point_L">
  <circle class="point" cx="101.0" cy="96.0" r="2.5" />
  <text class="label" x="101.0" y="106.0">L</text>
</g>
</svg>
