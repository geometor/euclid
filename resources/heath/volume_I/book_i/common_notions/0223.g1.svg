<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 151 111" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line, .polygon { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Quadrilateral ABCD -->
<g class="interactive" id="quad_ABCD">
  <polygon class="polygon" points="20.0,30.0 125.0,30.0 125.0,80.0 20.0,80.0" />
</g>

<!-- Diagonal BC -->
<g class="interactive" id="diag_BC">
  <line class="line" x1="125.0" y1="30.0" x2="20.0" y2="80.0" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_A">
  <circle class="point" cx="20.0" cy="30.0" r="2.5" />
  <text class="label" x="18.0" y="19.0">A</text>
</g>
<g class="point-group" id="point_B">
  <circle class="point" cx="125.0" cy="30.0" r="2.5" />
  <text class="label" x="130.0" y="19.0">B</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="20.0" cy="80.0" r="2.5" />
  <text class="label" x="18.0" y="91.0">C</text>
</g>
<g class="point-group" id="point_D">
  <circle class="point" cx="125.0" cy="80.0" r="2.5" />
  <text class="label" x="130.0" y="91.0">D</text>
</g>
</svg>
