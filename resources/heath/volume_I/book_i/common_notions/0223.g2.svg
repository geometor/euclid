<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 274 197" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Base line CD -->
<g class="interactive" id="line_CD">
  <line class="line" x1="22.0" y1="125.0" x2="250.0" y2="125.0" />
</g>

<!-- Line CE -->
<g class="interactive" id="line_CE">
  <line class="line" x1="22.0" y1="125.0" x2="105.0" y2="46.0" />
</g>

<!-- Line EB -->
<g class="interactive" id="line_EB">
  <line class="line" x1="105.0" y1="46.0" x2="225.0" y2="92.0" />
</g>

<!-- Perpendicular GH -->
<g class="interactive" id="perp_GH">
  <line class="line" x1="144.0" y1="61.0" x2="144.0" y2="125.0" />
</g>

<!-- Line from E perpendicular to CD -->
<g class="interactive" id="perp_E">
  <line class="line" x1="105.0" y1="46.0" x2="105.0" y2="125.0" stroke-dasharray="4,3" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_C">
  <circle class="point" cx="22.0" cy="125.0" r="2.5" />
  <text class="label" x="12.0" y="125.0">C</text>
</g>
<g class="point-group" id="point_E">
  <circle class="point" cx="105.0" cy="46.0" r="2.5" />
  <text class="label" x="105.0" y="36.0">E</text>
</g>
<g class="point-group" id="point_G">
  <circle class="point" cx="144.0" cy="61.0" r="2.5" />
  <text class="label" x="152.0" y="55.0">G</text>
</g>
<g class="point-group" id="point_H">
  <circle class="point" cx="144.0" cy="125.0" r="2.5" />
  <text class="label" x="144.0" y="137.0">H</text>
</g>
<g class="point-group" id="point_D">
  <circle class="point" cx="250.0" cy="125.0" r="2.5" />
  <text class="label" x="258.0" y="125.0">D</text>
</g>
<g class="point-group" id="point_B">
  <circle class="point" cx="225.0" cy="92.0" r="2.5" />
  <text class="label" x="233.0" y="92.0">B</text>
</g>
</svg>
