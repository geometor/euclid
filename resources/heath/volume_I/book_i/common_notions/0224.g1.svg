<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 171" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Baseline ACF -->
<g class="interactive" id="line_AF">
  <line class="line" x1="25.0" y1="110.0" x2="225.0" y2="110.0" />
</g>

<!-- Line AB -->
<g class="interactive" id="line_AB">
  <line class="line" x1="35.0" y1="110.0" x2="100.0" y2="57.0" />
</g>

<!-- Line CD -->
<g class="interactive" id="line_CD">
  <line class="line" x1="125.0" y1="110.0" x2="167.0" y2="52.0" />
</g>

<!-- Translated line αβ at C -->
<g class="interactive" id="line_alpha_beta">
  <line class="line" x1="125.0" y1="110.0" x2="190.0" y2="57.0" stroke-dasharray="4,3" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_A">
  <circle class="point" cx="35.0" cy="110.0" r="2.5" />
  <text class="label" x="35.0" y="122.0">A</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="125.0" cy="110.0" r="2.5" />
  <text class="label" x="125.0" y="122.0">C (α)</text>
</g>
<g class="point-group" id="point_F">
  <circle class="point" cx="220.0" cy="110.0" r="2.5" />
  <text class="label" x="220.0" y="122.0">F</text>
</g>
<g class="point-group" id="point_B">
  <circle class="point" cx="100.0" cy="57.0" r="2.5" />
  <text class="label" x="100.0" y="47.0">B</text>
</g>
<g class="point-group" id="point_D">
  <circle class="point" cx="167.0" cy="52.0" r="2.5" />
  <text class="label" x="167.0" y="42.0">D</text>
</g>
<g class="point-group" id="point_beta">
  <circle class="point" cx="190.0" cy="57.0" r="2.5" />
  <text class="label" x="198.0" y="52.0">β</text>
</g>
</svg>
