<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 266 145" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line, .polygon { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Baseline ACF -->
<g class="interactive" id="line_ACF">
  <line class="line" x1="30.0" y1="105.0" x2="250.0" y2="105.0" />
</g>

<!-- Line CD -->
<g class="interactive" id="line_CD">
  <line class="line" x1="138.0" y1="105.0" x2="178.0" y2="35.0" />
</g>

<!-- Line alpha-beta cutting CD at pi -->
<g class="interactive" id="line_alpha_beta">
  <line class="line" x1="187.0" y1="105.0" x2="150.0" y2="25.0" />
</g>

<!-- Similar triangle ACP with vertex P -->
<g class="interactive" id="tri_ACP">
  <line class="line" x1="45.0" y1="105.0" x2="165.0" y2="8.0" stroke-dasharray="4,3" />
  <line class="line" x1="138.0" y1="105.0" x2="165.0" y2="8.0" stroke-dasharray="4,3" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_A">
  <circle class="point" cx="45.0" cy="105.0" r="2.5" />
  <text class="label" x="45.0" y="117.0">A</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="138.0" cy="105.0" r="2.5" />
  <text class="label" x="138.0" y="117.0">C</text>
</g>
<g class="point-group" id="point_alpha">
  <circle class="point" cx="187.0" cy="105.0" r="2.5" />
  <text class="label" x="187.0" y="117.0">α</text>
</g>
<g class="point-group" id="point_pi">
  <circle class="point" cx="165.0" cy="58.0" r="2.5" />
  <text class="label" x="175.0" y="58.0">π</text>
</g>
<g class="point-group" id="point_P">
  <circle class="point" cx="165.0" cy="8.0" r="2.5" />
  <text class="label" x="165.0" y="18.0">P</text>
</g>
<g class="point-group" id="point_D">
  <text class="label" x="185.0" y="35.0">D</text>
</g>
<g class="point-group" id="point_beta">
  <text class="label" x="142.0" y="25.0">β</text>
</g>
</svg>
