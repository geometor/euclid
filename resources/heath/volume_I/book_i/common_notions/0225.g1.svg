<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 127" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="160" height="127" fill="#ffffff"/>

<g id="quadrilateral-ABDC" class="interactive">
    <line x1="25" y1="97" x2="135" y2="97" class="geometry"/>
    <line x1="25" y1="97" x2="25" y2="28" class="geometry"/>
    <line x1="135" y1="97" x2="135" y2="28" class="geometry"/>
    <line x1="25" y1="28" x2="135" y2="28" class="geometry"/>
</g>
<g id="diagonals" class="interactive">
    <line x1="25" y1="97" x2="135" y2="28" class="geometry"/>
    <line x1="135" y1="97" x2="25" y2="28" class="geometry"/>
</g>
<g id="right-angles">
    <polyline points="25,89 33,89 33,97" class="geometry" style="stroke-width: 1;"/>
    <polyline points="135,89 127,89 127,97" class="geometry" style="stroke-width: 1;"/>
</g>
<g id="points">
    <circle cx="25" cy="97" r="2.5" class="point"/>
    <circle cx="135" cy="97" r="2.5" class="point"/>
    <circle cx="25" cy="28" r="2.5" class="point"/>
    <circle cx="135" cy="28" r="2.5" class="point"/>
    <circle cx="80" cy="62.5" r="2" class="point"/>
</g>
<g id="labels">
    <text x="14" y="105" class="label">A</text>
    <text x="146" y="105" class="label">B</text>
    <text x="14" y="21" class="label">C</text>
    <text x="146" y="21" class="label">D</text>
</g>

</svg>
