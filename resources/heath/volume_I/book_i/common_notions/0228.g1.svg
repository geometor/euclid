<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 223 145" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="223" height="145" fill="#ffffff"/>

<g id="triangle-ABC" class="interactive">
    <line x1="85" y1="25" x2="53" y2="69" class="geometry"/>
    <line x1="85" y1="25" x2="141" y2="69" class="geometry"/>
    <line x1="53" y1="69" x2="141" y2="69" class="geometry"/>
</g>
<g id="triangle-DBC" class="interactive">
    <line x1="53" y1="69" x2="118" y2="116" class="geometry"/>
    <line x1="141" y1="69" x2="118" y2="116" class="geometry"/>
</g>
<g id="produced-sides" class="interactive">
    <line x1="53" y1="69" x2="18" y2="116" class="geometry"/>
    <line x1="141" y1="69" x2="203" y2="116" class="geometry"/>
</g>
<g id="transversal-EDF" class="interactive">
    <line x1="18" y1="116" x2="203" y2="116" class="geometry"/>
</g>
<g id="points">
    <circle cx="85" cy="25" r="2.5" class="point"/>
    <circle cx="53" cy="69" r="2.5" class="point"/>
    <circle cx="141" cy="69" r="2.5" class="point"/>
    <circle cx="118" cy="116" r="2.5" class="point"/>
    <circle cx="18" cy="116" r="2.5" class="point"/>
    <circle cx="203" cy="116" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="85" y="14" class="label">A</text>
    <text x="41" y="63" class="label">B</text>
    <text x="153" y="63" class="label">C</text>
    <text x="118" y="130" class="label">D</text>
    <text x="14" y="130" class="label">E</text>
    <text x="207" y="130" class="label">F</text>
</g>

</svg>
