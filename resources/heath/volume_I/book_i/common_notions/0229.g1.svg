<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 465 136" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="465" height="136" fill="#ffffff"/>

<g id="baseline" class="interactive">
    <line x1="25" y1="110" x2="425" y2="110" class="geometry"/>
</g>
<g id="triangle-ABC" class="interactive">
    <line x1="25" y1="110" x2="95" y2="23" class="geometry"/>
    <line x1="95" y1="23" x2="136" y2="110" class="geometry"/>
    <line x1="25" y1="110" x2="115.5" y2="66.5" class="geometry"/>
</g>
<g id="triangle-ABprimeCprime" class="interactive">
    <line x1="25" y1="110" x2="216" y2="29" class="geometry"/>
    <line x1="216" y1="29" x2="120" y2="110" class="geometry"/>
    <line x1="216" y1="29" x2="228" y2="110" class="geometry"/>
</g>
<g id="triangle-ABsecondCsecond" class="interactive">
    <line x1="25" y1="110" x2="220" y2="69" class="geometry"/>
    <line x1="220" y1="69" x2="177" y2="110" class="geometry"/>
    <line x1="220" y1="69" x2="345" y2="110" class="geometry"/>
</g>
<g id="points">
    <circle cx="25" cy="110" r="2.5" class="point"/>
    <circle cx="95" cy="23" r="2.5" class="point"/>
    <circle cx="115.5" cy="66.5" r="2" class="point"/>
    <circle cx="120" cy="110" r="2.5" class="point"/>
    <circle cx="136" cy="110" r="2.5" class="point"/>
    <circle cx="216" cy="29" r="2.5" class="point"/>
    <circle cx="177" cy="110" r="2.5" class="point"/>
    <circle cx="220" cy="69" r="2.5" class="point"/>
    <circle cx="228" cy="110" r="2.5" class="point"/>
    <circle cx="345" cy="110" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="15" y="122" class="label">A</text>
    <text x="95" y="14" class="label">C</text>
    <text x="100" y="60" class="label">D</text>
    <text x="117" y="122" class="label">K</text>
    <text x="140" y="122" class="label">B</text>
    <text x="216" y="18" class="label">C&#x2032;</text>
    <text x="175" y="75" class="label">D&#x2032;</text>
    <text x="177" y="122" class="label">K&#x2032;</text>
    <text x="232" y="122" class="label">B&#x2032;</text>
    <text x="232" y="68" class="label">C&#x2033;</text>
    <text x="345" y="122" class="label">B&#x2033;</text>
</g>

</svg>
