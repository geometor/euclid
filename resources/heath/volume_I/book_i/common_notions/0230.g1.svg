<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 577 141" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="577" height="141" fill="#ffffff"/>

<g id="top-line" class="interactive">
    <line x1="22" y1="23" x2="280" y2="23" class="geometry"/>
    <line x1="280" y1="23" x2="350" y2="23" class="construction"/>
    <line x1="350" y1="23" x2="550" y2="23" class="geometry"/>
</g>
<g id="bottom-line" class="interactive">
    <line x1="22" y1="112" x2="290" y2="112" class="geometry"/>
    <line x1="290" y1="112" x2="330" y2="112" class="construction"/>
    <line x1="330" y1="112" x2="560" y2="112" class="geometry"/>
</g>
<g id="triangles" class="interactive">
    <line x1="68" y1="112" x2="115" y2="23" class="geometry"/>
    <line x1="115" y1="23" x2="135" y2="112" class="geometry"/>
    <line x1="135" y1="112" x2="182" y2="23" class="geometry"/>
    <line x1="182" y1="23" x2="202" y2="112" class="geometry"/>
    <line x1="202" y1="112" x2="249" y2="23" class="geometry"/>
    <line x1="249" y1="23" x2="269" y2="112" class="geometry"/>
    <line x1="340" y1="112" x2="385" y2="23" class="geometry"/>
    <line x1="385" y1="23" x2="405" y2="112" class="geometry"/>
</g>
<g id="points">
    <circle cx="68" cy="112" r="2.5" class="point"/>
    <circle cx="115" cy="23" r="2.5" class="point"/>
    <circle cx="135" cy="112" r="2.5" class="point"/>
    <circle cx="182" cy="23" r="2.5" class="point"/>
    <circle cx="202" cy="112" r="2.5" class="point"/>
    <circle cx="249" cy="23" r="2.5" class="point"/>
    <circle cx="269" cy="112" r="2.5" class="point"/>
    <circle cx="340" cy="112" r="2.5" class="point"/>
    <circle cx="385" cy="23" r="2.5" class="point"/>
    <circle cx="405" cy="112" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="115" y="12" class="label">B</text>
    <text x="182" y="12" class="label">D</text>
    <text x="249" y="12" class="label">F</text>
    <text x="385" y="12" class="label">K</text>
    <text x="63" y="125" class="label">A</text>
    <text x="135" y="125" class="label">C</text>
    <text x="202" y="125" class="label">E</text>
    <text x="269" y="125" class="label">G</text>
    <text x="340" y="125" class="label">L</text>
</g>

</svg>
