<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 128" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="220" height="128" fill="#ffffff"/>

<g id="triangle-ABC" class="interactive">
    <line x1="21" y1="98" x2="123" y2="98" class="geometry"/>
    <line x1="21" y1="98" x2="88" y2="23" class="geometry"/>
    <line x1="88" y1="23" x2="123" y2="98" class="geometry"/>
</g>
<g id="construction" class="interactive">
    <line x1="21" y1="98" x2="193" y2="23" class="geometry"/>
    <line x1="123" y1="98" x2="193" y2="23" class="geometry"/>
</g>
<g id="points">
    <circle cx="21" cy="98" r="2.5" class="point"/>
    <circle cx="123" cy="98" r="2.5" class="point"/>
    <circle cx="88" cy="23" r="2.5" class="point"/>
    <circle cx="106" cy="60.5" r="2" class="point"/>
    <circle cx="193" cy="23" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="10" y="102" class="label">A</text>
    <text x="127" y="109" class="label">B</text>
    <text x="88" y="14" class="label">C</text>
    <text x="113" y="52" class="label">H</text>
    <text x="203" y="21" class="label">D</text>
</g>

</svg>
