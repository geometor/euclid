    <path id="el-ang-ACD" data-ref="&lt; A C D )" data-aliases="&lt; D C A ); &lt; A C B ); &lt; B C A )" data-type="wedge" d="M 155.00 100.00 L 146.47 84.16 A 18.0 18.0 0 0 0 137.00 100.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ADB" data-ref="&lt; A D B )" data-aliases="&lt; B D A )" data-type="wedge" d="M 88.00 100.00 L 92.88 84.76 A 16.0 16.0 0 0 0 72.00 100.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ADC" data-ref="&lt; A D C )" data-aliases="&lt; C D A )" data-type="wedge" d="M 88.00 100.00 L 104.00 100.00 A 16.0 16.0 0 0 0 92.88 84.76 Z" class="wedge angle geom-overlay" />

