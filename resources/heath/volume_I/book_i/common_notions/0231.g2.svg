    <path id="hl-ang-BAD" data-ref="&lt; B A D )" data-aliases="&lt; D A B )" d="M 113.00 22.00 L 98.03 35.26 A 20.0 20.0 0 0 0 106.90 41.05 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-DAC" data-ref="&lt; D A C )" data-aliases="&lt; C A D )" d="M 113.00 22.00 L 106.90 41.05 A 20.0 20.0 0 0 0 122.48 39.60 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ABD" data-ref="&lt; A B D )" data-aliases="&lt; D B A ); &lt; A B C ); &lt; C B A )" d="M 25.00 100.00 L 43.00 100.00 A 18.0 18.0 0 0 0 38.47 88.06 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ACD" data-ref="&lt; A C D )" data-aliases="&lt; D C A ); &lt; A C B ); &lt; B C A )" d="M 155.00 100.00 L 146.47 84.16 A 18.0 18.0 0 0 0 137.00 100.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ADB" data-ref="&lt; A D B )" data-aliases="&lt; B D A )" d="M 88.00 100.00 L 92.88 84.76 A 16.0 16.0 0 0 0 72.00 100.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ADC" data-ref="&lt; A D C )" data-aliases="&lt; C D A )" d="M 88.00 100.00 L 104.00 100.00 A 16.0 16.0 0 0 0 92.88 84.76 Z" class="wedge angle geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="113" y1="22" x2="25" y2="100" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="113" y1="22" x2="155" y2="100" class="geom-line geom-overlay" />
