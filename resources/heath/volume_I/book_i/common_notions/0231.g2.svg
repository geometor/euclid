  <g id="graphics">
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt;; &lt; B A C &gt;; &lt; B C A &gt;; &lt; C A B &gt;; &lt; C B A &gt;" data-type="polygon" points="113,22 25,100 155,100" class="geom-polygon" />
