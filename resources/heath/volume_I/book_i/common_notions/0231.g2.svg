    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="113" y1="22" x2="155" y2="100" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="113" y1="22" x2="88" y2="100" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="25" y1="100" x2="155" y2="100" class="geom-line" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="25" y1="100" x2="88" y2="100" class="geom-line geom-overlay" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" data-type="segment" x1="88" y1="100" x2="155" y2="100" class="geom-line geom-overlay" />

    <polyline id="el-sec-BDC" data-ref="/ B D C /" data-aliases="/ C D B /; } B D C {; } C D B {" data-type="section" points="25,100 88,100 155,100" fill="none" class="geom-line geom-overlay" />
  </g>

