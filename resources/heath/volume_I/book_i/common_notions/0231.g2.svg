<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 120" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="178" height="120" fill="#ffffff"/>

<g id="triangle-ABC" class="interactive">
    <line x1="25" y1="100" x2="155" y2="100" class="geometry"/>
    <line x1="113" y1="22" x2="25" y2="100" class="geometry"/>
    <line x1="113" y1="22" x2="155" y2="100" class="geometry"/>
</g>
<g id="transversal-AD" class="interactive">
    <line x1="113" y1="22" x2="88" y2="100" class="geometry"/>
</g>
<g id="points">
    <circle cx="113" cy="22" r="2.5" class="point"/>
    <circle cx="25" cy="100" r="2.5" class="point"/>
    <circle cx="88" cy="100" r="2.5" class="point"/>
    <circle cx="155" cy="100" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="113" y="12" class="label">A</text>
    <text x="16" y="103" class="label">B</text>
    <text x="88" y="112" class="label">D</text>
    <text x="164" y="103" class="label">C</text>
</g>

</svg>
