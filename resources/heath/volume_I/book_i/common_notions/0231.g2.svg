    <polygon id="hl-tri-ADC" data-ref="&lt; A D C &gt;" data-aliases="&lt; A C D &gt;; &lt; D A C &gt;; &lt; D C A &gt;; &lt; C A D &gt;; &lt; C D A &gt;" points="113,22 88,100 155,100" class="geom-polygon geom-overlay" />

