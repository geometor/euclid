    <path id="el-ang-BAD" data-ref="&lt; B A D )" data-aliases="&lt; D A B )" data-type="wedge" d="M 113.00 22.00 L 98.03 35.26 A 20.0 20.0 0 0 0 106.90 41.05 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-DAC" data-ref="&lt; D A C )" data-aliases="&lt; C A D )" data-type="wedge" d="M 113.00 22.00 L 106.90 41.05 A 20.0 20.0 0 0 0 122.48 39.60 Z" class="wedge angle geom-overlay" />
