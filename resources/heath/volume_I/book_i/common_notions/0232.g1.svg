<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 224" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="210" height="224" fill="#ffffff"/>

<g id="triangle-ABC" class="interactive">
    <line x1="63" y1="192" x2="175" y2="192" class="geometry"/>
    <line x1="175" y1="192" x2="175" y2="115" class="geometry"/>
    <line x1="63" y1="192" x2="175" y2="115" class="geometry"/>
</g>
<g id="triangle-AprimeBCprime" class="interactive">
    <line x1="10" y1="192" x2="63" y2="192" class="geometry"/>
    <line x1="175" y1="115" x2="175" y2="23" class="geometry"/>
    <line x1="10" y1="192" x2="175" y2="23" class="geometry"/>
</g>
<g id="line-ACprime" class="interactive">
    <line x1="63" y1="192" x2="175" y2="23" class="geometry"/>
</g>
<g id="right-angle">
    <polyline points="175,182 165,182 165,192" class="geometry" style="stroke-width: 1;"/>
</g>
<g id="points">
    <circle cx="10" cy="192" r="2.5" class="point"/>
    <circle cx="63" cy="192" r="2.5" class="point"/>
    <circle cx="175" cy="192" r="2.5" class="point"/>
    <circle cx="175" cy="115" r="2.5" class="point"/>
    <circle cx="175" cy="23" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="10" y="204" class="label">A&#x2032;</text>
    <text x="63" y="204" class="label">A</text>
    <text x="185" y="204" class="label">B</text>
    <text x="187" y="115" class="label">C</text>
    <text x="187" y="23" class="label">C&#x2032;</text>
</g>

</svg>
