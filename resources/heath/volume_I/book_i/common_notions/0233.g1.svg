<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 129" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="292" height="129" fill="#ffffff"/>

<g id="line-r" class="interactive">
    <line x1="15" y1="101" x2="275" y2="101" class="geometry"/>
</g>
<g id="line-top" class="interactive">
    <line x1="20" y1="29" x2="270" y2="29" class="geometry"/>
</g>
<g id="perpendicular-PQ" class="interactive">
    <line x1="67" y1="29" x2="67" y2="101" class="geometry"/>
</g>
<g id="obliques" class="interactive">
    <line x1="67" y1="29" x2="139" y2="101" class="geometry"/>
    <line x1="67" y1="29" x2="241" y2="101" class="geometry"/>
</g>
<g id="right-angle">
    <polyline points="67,93 75,93 75,101" class="geometry" style="stroke-width: 1;"/>
</g>
<g id="points">
    <circle cx="67" cy="29" r="2.5" class="point"/>
    <circle cx="67" cy="101" r="2.5" class="point"/>
    <circle cx="139" cy="101" r="2.5" class="point"/>
    <circle cx="241" cy="101" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="67" y="18" class="label">P</text>
    <text x="67" y="114" class="label">Q</text>
    <text x="139" y="114" class="label">R</text>
    <text x="241" y="114" class="label">R&#x2032;</text>
    <text x="278" y="93" class="label">r</text>
    <text x="114" y="90" class="label">&#x3c9;</text>
</g>

</svg>
