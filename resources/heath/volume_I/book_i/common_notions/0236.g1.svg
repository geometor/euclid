<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 91" width="96" height="91" class="euclid-graphic" data-graphic-id="0236.g1" data-folio="0236" data-graphic="g1" data-proposition="C.N.1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-A" data-ref="[ A1 A ]" data-type="line" x1="26" y1="20" x2="26" y2="70" class="geom-line geom-overlay" />
    <line id="el-line-B" data-ref="[ B1 B ]" data-type="line" x1="52" y1="20" x2="52" y2="70" class="geom-line geom-overlay" />
    <line id="el-line-C" data-ref="[ C1 C ]" data-type="line" x1="78" y1="20" x2="78" y2="70" class="geom-line geom-overlay" />
  </g>

  <!-- Constructed Graphics (Segments A, B, C) -->
  <g id="graphics">
    <line id="el-seg-A" data-ref="A" data-aliases="/ A / | / A1 A /" data-type="segment" x1="26" y1="20" x2="26" y2="70" class="geom-line" />
    <line id="el-seg-B" data-ref="B" data-aliases="/ B / | / B1 B /" data-type="segment" x1="52" y1="20" x2="52" y2="70" class="geom-line" />
    <line id="el-seg-C" data-ref="C" data-aliases="/ C / | / C1 C /" data-type="segment" x1="78" y1="20" x2="78" y2="70" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-seg-A" data-ref="A" data-aliases="/ A / | / A1 A /" x1="26" y1="20" x2="26" y2="70" class="geom-line geom-overlay" />
    <line id="hl-seg-B" data-ref="B" data-aliases="/ B / | / B1 B /" x1="52" y1="20" x2="52" y2="70" class="geom-line geom-overlay" />
    <line id="hl-seg-C" data-ref="C" data-aliases="/ C / | / C1 C /" x1="78" y1="20" x2="78" y2="70" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A1" data-ref="A1" data-type="point" cx="26" cy="20" r="2.5" class="geom-point geom-overlay" />
    <circle id="el-pt-A2" data-ref="A2" data-type="point" cx="26" cy="70" r="2.5" class="geom-point geom-overlay" />
    <circle id="el-pt-B1" data-ref="B1" data-type="point" cx="52" cy="20" r="2.5" class="geom-point geom-overlay" />
    <circle id="el-pt-B2" data-ref="B2" data-type="point" cx="52" cy="70" r="2.5" class="geom-point geom-overlay" />
    <circle id="el-pt-C1" data-ref="C1" data-type="point" cx="78" cy="20" r="2.5" class="geom-point geom-overlay" />
    <circle id="el-pt-C2" data-ref="C2" data-type="point" cx="78" cy="70" r="2.5" class="geom-point geom-overlay" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" data-aliases="/ A /" x="16" y="49" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" data-aliases="/ B /" x="42" y="49" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" data-aliases="/ C /" x="68" y="49" text-anchor="middle" class="geom-label">C</text>
  </g>
</svg>
