<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 91" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="96" height="91" fill="#ffffff"/>

<g id="segment-A" class="interactive">
    <line x1="26" y1="20" x2="26" y2="70" class="geometry"/>
</g>
<g id="segment-B" class="interactive">
    <line x1="52" y1="20" x2="52" y2="70" class="geometry"/>
</g>
<g id="segment-C" class="interactive">
    <line x1="78" y1="20" x2="78" y2="70" class="geometry"/>
</g>
<g id="labels">
    <text x="16" y="45" class="label">A</text>
    <text x="42" y="45" class="label">B</text>
    <text x="68" y="45" class="label">C</text>
</g>

</svg>
