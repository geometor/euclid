<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 77 150" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="77" height="150" fill="#ffffff"/>

<g id="line-left" class="interactive">
    <line x1="27" y1="20" x2="27" y2="130" class="geometry"/>
    <line x1="24" y1="20" x2="30" y2="20" class="geometry" style="stroke-width: 1;"/>
    <line x1="24" y1="40" x2="30" y2="40" class="geometry" style="stroke-width: 1;"/>
    <line x1="24" y1="75" x2="30" y2="75" class="geometry" style="stroke-width: 1;"/>
    <line x1="24" y1="130" x2="30" y2="130" class="geometry" style="stroke-width: 1;"/>
</g>
<g id="line-right" class="interactive">
    <line x1="60" y1="40" x2="60" y2="130" class="geometry"/>
    <line x1="57" y1="40" x2="63" y2="40" class="geometry" style="stroke-width: 1;"/>
    <line x1="57" y1="75" x2="63" y2="75" class="geometry" style="stroke-width: 1;"/>
    <line x1="57" y1="130" x2="63" y2="130" class="geometry" style="stroke-width: 1;"/>
</g>
<g id="labels">
    <text x="16" y="20" class="label">E</text>
    <text x="16" y="40" class="label">G</text>
    <text x="16" y="75" class="label">B</text>
    <text x="16" y="130" class="label">A</text>
    <text x="49" y="40" class="label">F</text>
    <text x="49" y="75" class="label">D</text>
    <text x="49" y="130" class="label">C</text>
</g>

</svg>
