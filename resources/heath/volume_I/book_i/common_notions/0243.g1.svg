<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 301 120" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="301" height="120" fill="#ffffff"/>

<g id="triangle-ABC" class="interactive">
    <line x1="20" y1="100" x2="110" y2="100" class="geometry"/>
    <line x1="65" y1="25" x2="20" y2="100" class="geometry"/>
    <line x1="65" y1="25" x2="110" y2="100" class="geometry"/>
</g>
<g id="triangle-AprimeBprimeCprime" class="interactive">
    <line x1="170" y1="100" x2="260" y2="100" class="geometry"/>
    <line x1="215" y1="25" x2="170" y2="100" class="geometry"/>
    <line x1="215" y1="25" x2="260" y2="100" class="geometry"/>
    <line x1="215" y1="25" x2="235" y2="100" class="geometry"/>
</g>
<g id="points">
    <circle cx="65" cy="25" r="2.5" class="point"/>
    <circle cx="20" cy="100" r="2.5" class="point"/>
    <circle cx="110" cy="100" r="2.5" class="point"/>
    <circle cx="215" cy="25" r="2.5" class="point"/>
    <circle cx="170" cy="100" r="2.5" class="point"/>
    <circle cx="235" cy="100" r="2.5" class="point"/>
    <circle cx="260" cy="100" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="65" y="14" class="label">A</text>
    <text x="12" y="105" class="label">B</text>
    <text x="118" y="105" class="label">C</text>
    <text x="215" y="14" class="label">A&#x2032;</text>
    <text x="162" y="105" class="label">B&#x2032;</text>
    <text x="235" y="112" class="label">D</text>
    <text x="268" y="105" class="label">C&#x2032;</text>
</g>

</svg>
