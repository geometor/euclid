<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 358 96" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="358" height="96" fill="#ffffff"/>

<g id="left-figure" class="interactive">
    <line x1="20" y1="80" x2="160" y2="80" class="geometry"/>
    <line x1="90" y1="80" x2="90" y2="20" class="geometry"/>
    <line x1="20" y1="80" x2="90" y2="20" class="geometry"/>
    <line x1="160" y1="80" x2="90" y2="20" class="geometry"/>
</g>
<g id="right-figure" class="interactive">
    <line x1="200" y1="80" x2="340" y2="80" class="geometry"/>
    <line x1="270" y1="80" x2="270" y2="20" class="geometry"/>
    <line x1="200" y1="80" x2="270" y2="20" class="geometry"/>
    <line x1="340" y1="80" x2="270" y2="20" class="geometry"/>
</g>
<g id="points">
    <circle cx="20" cy="80" r="2.5" class="point"/>
    <circle cx="90" cy="80" r="2.5" class="point"/>
    <circle cx="160" cy="80" r="2.5" class="point"/>
    <circle cx="90" cy="20" r="2.5" class="point"/>
    <circle cx="200" cy="80" r="2.5" class="point"/>
    <circle cx="270" cy="80" r="2.5" class="point"/>
    <circle cx="340" cy="80" r="2.5" class="point"/>
    <circle cx="270" cy="20" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="14" y="88" class="label">A</text>
    <text x="90" y="92" class="label">B</text>
    <text x="166" y="88" class="label">D</text>
    <text x="90" y="11" class="label">C</text>
    <text x="194" y="88" class="label">A&#x2032;</text>
    <text x="270" y="92" class="label">B&#x2032;</text>
    <text x="346" y="88" class="label">D&#x2032;</text>
    <text x="270" y="11" class="label">C&#x2032;</text>
</g>

</svg>
