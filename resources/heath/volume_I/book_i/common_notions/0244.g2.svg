<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 128" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="460" height="128" fill="#ffffff"/>

<g id="left-angle" class="interactive">
    <line x1="38" y1="98" x2="200" y2="98" class="geometry"/>
    <line x1="38" y1="98" x2="140" y2="20" class="geometry"/>
    <line x1="170" y1="98" x2="120" y2="35" class="geometry"/>
    <line x1="38" y1="98" x2="180" y2="56" class="geometry"/>
</g>
<g id="right-angle" class="interactive">
    <line x1="260" y1="98" x2="422" y2="98" class="geometry"/>
    <line x1="260" y1="98" x2="362" y2="20" class="geometry"/>
    <line x1="392" y1="98" x2="342" y2="35" class="geometry"/>
    <line x1="260" y1="98" x2="402" y2="56" class="geometry"/>
</g>
<g id="points">
    <circle cx="38" cy="98" r="2.5" class="point"/>
    <circle cx="170" cy="98" r="2.5" class="point"/>
    <circle cx="120" cy="35" r="2.5" class="point"/>
    <circle cx="145" cy="66.5" r="2" class="point"/>
    <circle cx="260" cy="98" r="2.5" class="point"/>
    <circle cx="392" cy="98" r="2.5" class="point"/>
    <circle cx="342" cy="35" r="2.5" class="point"/>
    <circle cx="367" cy="66.5" r="2" class="point"/>
</g>
<g id="labels">
    <text x="25" y="105" class="label">O</text>
    <text x="175" y="108" class="label">A</text>
    <text x="118" y="24" class="label">B</text>
    <text x="156" y="65" class="label">C</text>
    <text x="206" y="98" class="label">h</text>
    <text x="145" y="16" class="label">k</text>
    <text x="187" y="54" class="label">l</text>
    <text x="247" y="105" class="label">O&#x2032;</text>
    <text x="397" y="108" class="label">A&#x2032;</text>
    <text x="340" y="24" class="label">B&#x2032;</text>
    <text x="378" y="65" class="label">C&#x2032;</text>
    <text x="428" y="98" class="label">h&#x2032;</text>
    <text x="367" y="16" class="label">k&#x2032;</text>
    <text x="409" y="54" class="label">l&#x2032;</text>
</g>

</svg>
