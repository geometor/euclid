<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 120" width="430" height="120" class="euclid-graphic" data-graphic-id="0244.g2" data-folio="0244" data-graphic="g2" data-proposition="C.N.4">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Extended Rays h, k, l and h', k', l') -->
  <g id="elements">
    <line id="el-line-OA" data-ref="[ O A ]" data-aliases="h" data-type="line" x1="95" y1="98" x2="225" y2="98" class="geom-line" />
    <line id="el-line-OB" data-ref="[ O B ]" data-aliases="k" data-type="line" x1="95" y1="98" x2="38" y2="8" class="geom-line" />
    <line id="el-line-OC" data-ref="[ O C ]" data-aliases="l" data-type="line" x1="95" y1="98" x2="132" y2="37" class="geom-line" />

    <line id="el-line-OpAp" data-ref="[ O' A' ]" data-aliases="h'" data-type="line" x1="275" y1="98" x2="405" y2="98" class="geom-line" />
    <line id="el-line-OpBp" data-ref="[ O' B' ]" data-aliases="k'" data-type="line" x1="275" y1="98" x2="218" y2="8" class="geom-line" />
    <line id="el-line-OpCp" data-ref="[ O' C' ]" data-aliases="l'" data-type="line" x1="275" y1="98" x2="312" y2="37" class="geom-line" />
  </g>

