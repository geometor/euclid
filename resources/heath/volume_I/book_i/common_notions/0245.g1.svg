    <path id="el-ang-CpApDp" data-ref="&lt; C' A' D' )" data-aliases="&lt; D' A' C' )" data-type="wedge" d="M 290.00 134.00 L 290.00 110.00 A 24.0 24.0 0 0 1 314.00 134.00 Z" class="wedge angle geom-overlay" />
