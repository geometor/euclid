<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 152" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="380" height="152" fill="#ffffff"/>

<g id="left-angles" class="interactive">
    <line x1="20" y1="134" x2="160" y2="134" class="geometry"/>
    <line x1="90" y1="134" x2="90" y2="30" class="geometry"/>
    <line x1="90" y1="134" x2="125" y2="33" class="geometry"/>
    <polyline points="90,124 80,124 80,134" class="geometry" style="stroke-width: 1;"/>
    <polyline points="90,124 100,124 100,134" class="geometry" style="stroke-width: 1;"/>
</g>
<g id="right-angles" class="interactive">
    <line x1="220" y1="134" x2="360" y2="134" class="geometry"/>
    <line x1="290" y1="134" x2="290" y2="30" class="geometry"/>
    <polyline points="290,124 280,124 280,134" class="geometry" style="stroke-width: 1;"/>
    <polyline points="290,124 300,124 300,134" class="geometry" style="stroke-width: 1;"/>
</g>
<g id="points">
    <circle cx="20" cy="134" r="2.5" class="point"/>
    <circle cx="90" cy="134" r="2.5" class="point"/>
    <circle cx="160" cy="134" r="2.5" class="point"/>
    <circle cx="90" cy="30" r="2.5" class="point"/>
    <circle cx="125" cy="33" r="2.5" class="point"/>
    <circle cx="220" cy="134" r="2.5" class="point"/>
    <circle cx="290" cy="134" r="2.5" class="point"/>
    <circle cx="360" cy="134" r="2.5" class="point"/>
    <circle cx="290" cy="30" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="14" y="144" class="label">B</text>
    <text x="90" y="146" class="label">A</text>
    <text x="166" y="144" class="label">C</text>
    <text x="90" y="19" class="label">D</text>
    <text x="134" y="25" class="label">D&#x2033;</text>
    <text x="214" y="144" class="label">B&#x2032;</text>
    <text x="290" y="146" class="label">A&#x2032;</text>
    <text x="366" y="144" class="label">C&#x2032;</text>
    <text x="290" y="19" class="label">D&#x2032;</text>
</g>

</svg>
