<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 180" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="276" height="180" fill="#ffffff"/>

<g id="quadrilateral-ABCAsecond" class="interactive">
    <line x1="20" y1="95" x2="120" y2="95" class="geometry"/>
    <line x1="20" y1="95" x2="70" y2="35" class="geometry"/>
    <line x1="120" y1="95" x2="70" y2="35" class="geometry"/>
    <line x1="20" y1="95" x2="70" y2="155" class="geometry"/>
    <line x1="120" y1="95" x2="70" y2="155" class="geometry"/>
    <line x1="70" y1="35" x2="70" y2="155" class="geometry"/>
</g>
<g id="triangle-AprimeBprimeCprime" class="interactive">
    <line x1="160" y1="95" x2="250" y2="95" class="geometry"/>
    <line x1="160" y1="95" x2="205" y2="35" class="geometry"/>
    <line x1="250" y1="95" x2="205" y2="35" class="geometry"/>
</g>
<g id="points">
    <circle cx="70" cy="35" r="2.5" class="point"/>
    <circle cx="20" cy="95" r="2.5" class="point"/>
    <circle cx="120" cy="95" r="2.5" class="point"/>
    <circle cx="70" cy="155" r="2.5" class="point"/>
    <circle cx="205" cy="35" r="2.5" class="point"/>
    <circle cx="160" cy="95" r="2.5" class="point"/>
    <circle cx="250" cy="95" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="70" y="23" class="label">A</text>
    <text x="12" y="95" class="label">B</text>
    <text x="128" y="95" class="label">C</text>
    <text x="70" y="168" class="label">A&#x2033;</text>
    <text x="205" y="23" class="label">A&#x2032;</text>
    <text x="152" y="95" class="label">B&#x2032;</text>
    <text x="258" y="95" class="label">C&#x2032;</text>
</g>

</svg>
