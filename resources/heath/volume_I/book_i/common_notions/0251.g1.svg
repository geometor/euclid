<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 257 165" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="257" height="165" fill="#ffffff"/>

<g id="circle-C" class="interactive">
    <circle cx="109" cy="80" r="55" class="geometry"/>
</g>
<g id="line-r" class="interactive">
    <line x1="15" y1="39" x2="235" y2="39" class="geometry"/>
</g>
<g id="perpendicular-OP" class="interactive">
    <line x1="109" y1="80" x2="109" y2="39" class="geometry"/>
    <polyline points="109,47 101,47 101,39" class="geometry" style="stroke-width: 1;"/>
</g>
<g id="obliques" class="interactive">
    <line x1="109" y1="80" x2="130" y2="39" class="geometry"/>
    <line x1="109" y1="80" x2="205" y2="39" class="geometry"/>
</g>
<g id="points">
    <circle cx="109" cy="80" r="2.5" class="point"/>
    <circle cx="109" cy="39" r="2.5" class="point"/>
    <circle cx="130" cy="39" r="2.5" class="point"/>
    <circle cx="205" cy="39" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="109" y="93" class="label">O</text>
    <text x="109" y="27" class="label">P</text>
    <text x="130" y="27" class="label">A</text>
    <text x="205" y="27" class="label">B</text>
    <text x="242" y="39" class="label">r</text>
    <text x="45" y="115" class="label">C</text>
</g>

</svg>
