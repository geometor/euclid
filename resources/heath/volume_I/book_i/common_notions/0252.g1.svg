<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 227 183" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="227" height="183" fill="#ffffff"/>

<g id="circles" class="interactive">
    <circle cx="70" cy="90" r="50" class="geometry"/>
    <circle cx="140" cy="90" r="60" class="geometry"/>
</g>
<g id="line-centers" class="interactive">
    <line x1="15" y1="90" x2="205" y2="90" class="geometry"/>
</g>
<g id="triangle-OOprimeY" class="interactive">
    <line x1="70" y1="90" x2="40" y2="48" class="geometry"/>
    <line x1="140" y1="90" x2="40" y2="48" class="geometry"/>
</g>
<g id="points">
    <circle cx="20" cy="90" r="2.5" class="point"/>
    <circle cx="70" cy="90" r="2.5" class="point"/>
    <circle cx="120" cy="90" r="2.5" class="point"/>
    <circle cx="140" cy="90" r="2.5" class="point"/>
    <circle cx="40" cy="48" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="12" y="90" class="label">A</text>
    <text x="70" y="103" class="label">O</text>
    <text x="115" y="103" class="label">B</text>
    <text x="142" y="103" class="label">O&#x2032;</text>
    <text x="35" y="38" class="label">Y</text>
    <text x="22" y="65" class="label">C</text>
    <text x="205" y="65" class="label">C&#x2032;</text>
</g>

</svg>
