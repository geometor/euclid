<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 298 210" width="298" height="210" class="euclid-graphic" data-graphic-id="0252.g2" data-folio="0252" data-graphic="g2" data-proposition="Dedekind">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke-dasharray: 4, 3;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <circle id="el-circ-C" data-ref="( O A )" data-aliases="C | ( C ) | ( O B ) | ( O X ) | ( O Y )" data-type="circle" cx="100" cy="118" r="55" class="geom-circle" />
    <circle id="el-circ-Cp" data-ref="( O' C' )" data-aliases="C' | ( C' ) | R'" data-type="circle" cx="202" cy="118" r="75" class="geom-circle" />
    <line id="el-line-OO" data-ref="[ O O' ]" data-aliases="[ O' O ] | [ B A ]" data-type="line" x1="45" y1="118" x2="202" y2="118" class="geom-line geom-overlay" />
  </g>

  <!-- Constructed Graphics (Polygon OO'X, Radii, and Collinear Sub-Segments) -->
  <g id="graphics">
    <polygon id="el-tri-OOpX" data-ref="&lt; O O' X &gt;" data-type="polygon" points="100,118 202,118 146,88" class="geom-polygon" />

    <line id="el-seg-BO" data-ref="/ B O /" data-aliases="/ O B /" data-type="segment" x1="45" y1="118" x2="100" y2="118" class="geom-line geom-dashed" />
    <line id="el-seg-OA" data-ref="/ O A /" data-aliases="/ A O / | R" data-type="segment" x1="100" y1="118" x2="155" y2="118" class="geom-line geom-dashed" />
    <line id="el-seg-AOp" data-ref="/ A O' /" data-aliases="/ O' A /" data-type="segment" x1="155" y1="118" x2="202" y2="118" class="geom-line geom-dashed" />
    <line id="el-seg-OOp" data-ref="/ O O' /" data-aliases="/ O' O / | / O A O' /" data-type="segment" x1="100" y1="118" x2="202" y2="118" class="geom-line geom-overlay" />
    <line id="el-seg-BA" data-ref="/ B A /" data-aliases="/ A B / | / B O A /" data-type="segment" x1="45" y1="118" x2="155" y2="118" class="geom-line geom-overlay" />
    <line id="el-seg-BOp" data-ref="/ B O' /" data-aliases="/ O' B /" data-type="segment" x1="45" y1="118" x2="202" y2="118" class="geom-line geom-overlay" />

    <line id="el-seg-OX" data-ref="/ O X /" data-aliases="/ X O /" data-type="segment" x1="100" y1="118" x2="146" y2="88" class="geom-line geom-dashed" />
    <line id="el-seg-OpX" data-ref="/ O' X /" data-aliases="/ X O' /" data-type="segment" x1="202" y1="118" x2="146" y2="88" class="geom-line geom-dashed" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circ-C" data-ref="( O A )" data-aliases="C | ( C ) | ( O B ) | ( O X ) | ( O Y )" cx="100" cy="118" r="55" class="geom-circle geom-overlay" />
    <circle id="hl-circ-Cp" data-ref="( O' C' )" data-aliases="C' | ( C' ) | R'" cx="202" cy="118" r="75" class="geom-circle geom-overlay" />
    <line id="hl-line-OO" data-ref="[ O O' ]" data-aliases="[ O' O ] | [ B A ]" x1="45" y1="118" x2="202" y2="118" class="geom-line geom-overlay" />
    <polygon id="hl-tri-OOpX" data-ref="&lt; O O' X &gt;" points="100,118 202,118 146,88" class="geom-polygon geom-overlay" />
    <line id="hl-seg-BO" data-ref="/ B O /" data-aliases="/ O B /" x1="45" y1="118" x2="100" y2="118" class="geom-line geom-overlay" />
    <line id="hl-seg-OA" data-ref="/ O A /" data-aliases="/ A O / | R" x1="100" y1="118" x2="155" y2="118" class="geom-line geom-overlay" />
    <line id="hl-seg-AOp" data-ref="/ A O' /" data-aliases="/ O' A /" x1="155" y1="118" x2="202" y2="118" class="geom-line geom-overlay" />
    <line id="hl-seg-OOp" data-ref="/ O O' /" data-aliases="/ O' O / | / O A O' /" x1="100" y1="118" x2="202" y2="118" class="geom-line geom-overlay" />
    <line id="hl-seg-BA" data-ref="/ B A /" data-aliases="/ A B / | / B O A /" x1="45" y1="118" x2="155" y2="118" class="geom-line geom-overlay" />
    <line id="hl-seg-OX" data-ref="/ O X /" data-aliases="/ X O /" x1="100" y1="118" x2="146" y2="88" class="geom-line geom-overlay" />
    <line id="hl-seg-OpX" data-ref="/ O' X /" data-aliases="/ X O' /" x1="202" y1="118" x2="146" y2="88" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="45" cy="118" r="3" class="geom-point" />
    <circle id="el-pt-O" data-ref="O" data-type="point" cx="100" cy="118" r="3" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="155" cy="118" r="3" class="geom-point" />
    <circle id="el-pt-Op" data-ref="O'" data-type="point" cx="202" cy="118" r="3" class="geom-point" />
    <circle id="el-pt-X" data-ref="X" data-type="point" cx="146" cy="88" r="3" class="geom-point" />
    <circle id="el-pt-Y" data-ref="Y" data-type="point" cx="76" cy="68.5" r="3" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-B" data-ref="B" x="34" y="122" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-O" data-ref="O" x="98" y="133" text-anchor="middle" class="geom-label">O</text>
    <text id="lbl-A" data-ref="A" x="163" y="133" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-Op" data-ref="O'" x="202" y="133" text-anchor="middle" class="geom-label">O&#x2032;</text>
    <text id="lbl-X" data-ref="X" x="155" y="83" text-anchor="middle" class="geom-label">X</text>
    <text id="lbl-Y" data-ref="Y" x="72" y="61" text-anchor="middle" class="geom-label">Y</text>
    <text id="lbl-C" data-ref="( O A )" data-aliases="C | ( C )" x="42" y="92" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-Cp" data-ref="( O' C' )" data-aliases="C' | ( C' )" x="278" y="84" text-anchor="middle" class="geom-label">C&#x2032;</text>
  </g>
</svg>
