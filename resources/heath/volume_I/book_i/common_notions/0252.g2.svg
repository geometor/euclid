<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 298 238" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="298" height="238" fill="#ffffff"/>

<g id="circles" class="interactive">
    <circle cx="100" cy="118" r="65" class="geometry"/>
    <circle cx="195" cy="118" r="85" class="geometry"/>
</g>
<g id="line-centers" class="interactive">
    <line x1="30" y1="118" x2="285" y2="118" class="geometry"/>
</g>
<g id="triangle-OOprimeX" class="interactive">
    <line x1="100" y1="118" x2="75" y2="60" class="geometry"/>
    <line x1="195" y1="118" x2="75" y2="60" class="geometry"/>
</g>
<g id="points">
    <circle cx="100" cy="118" r="2.5" class="point"/>
    <circle cx="165" cy="118" r="2.5" class="point"/>
    <circle cx="195" cy="118" r="2.5" class="point"/>
    <circle cx="75" cy="60" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="96" y="132" class="label">O</text>
    <text x="162" y="132" class="label">A</text>
    <text x="198" y="132" class="label">O&#x2032;</text>
    <text x="72" y="50" class="label">X</text>
    <text x="35" y="118" class="label">C</text>
    <text x="275" y="80" class="label">C&#x2032;</text>
</g>

</svg>
