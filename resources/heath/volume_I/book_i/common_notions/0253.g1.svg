<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 229 237" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="229" height="237" fill="#ffffff"/>

<g id="circles" class="interactive">
    <circle cx="60" cy="125" r="85" class="geometry"/>
    <circle cx="120" cy="125" r="45" class="geometry"/>
</g>
<g id="line-centers" class="interactive">
    <line x1="15" y1="125" x2="215" y2="125" class="geometry"/>
</g>
<g id="triangle-OOprimeX" class="interactive">
    <line x1="60" y1="125" x2="118" y2="40" class="geometry"/>
    <line x1="120" y1="125" x2="118" y2="40" class="geometry"/>
</g>
<g id="points">
    <circle cx="60" cy="125" r="2.5" class="point"/>
    <circle cx="120" cy="125" r="2.5" class="point"/>
    <circle cx="145" cy="125" r="2.5" class="point"/>
    <circle cx="118" cy="40" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="55" y="138" class="label">O</text>
    <text x="120" y="138" class="label">O&#x2032;</text>
    <text x="148" y="138" class="label">A</text>
    <text x="118" y="30" class="label">X</text>
    <text x="22" y="125" class="label">C</text>
    <text x="170" y="125" class="label">C&#x2032;</text>
</g>

</svg>
