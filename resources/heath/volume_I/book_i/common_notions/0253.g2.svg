<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 314 201" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="314" height="201" fill="#ffffff"/>

<g id="circle-C" class="interactive">
    <circle cx="105" cy="106" r="85" class="geometry"/>
</g>
<g id="circle-Cprime" class="interactive">
    <circle cx="228" cy="106" r="75" class="geometry"/>
</g>
<g id="line-centers" class="interactive">
    <line x1="15" y1="106" x2="295" y2="106" class="geometry"/>
</g>
<g id="rays-O" class="interactive">
    <line x1="105" y1="106" x2="135" y2="25" class="geometry"/>
    <line x1="105" y1="106" x2="165" y2="33" class="geometry"/>
</g>
<g id="rays-Oprime" class="interactive">
    <line x1="228" y1="106" x2="135" y2="25" class="geometry"/>
    <line x1="228" y1="106" x2="165" y2="33" class="geometry"/>
</g>
<g id="points">
    <circle cx="20" cy="106" r="2.5" class="point"/>
    <circle cx="105" cy="106" r="2.5" class="point"/>
    <circle cx="228" cy="106" r="2.5" class="point"/>
    <circle cx="290" cy="106" r="2.5" class="point"/>
    <circle cx="135" cy="25" r="2.5" class="point"/>
    <circle cx="165" cy="33" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="14" y="116" class="label">A</text>
    <text x="105" y="120" class="label">O</text>
    <text x="228" y="120" class="label">O&#x2032;</text>
    <text x="296" y="116" class="label">B</text>
    <text x="135" y="15" class="label">P</text>
    <text x="168" y="24" class="label">Q</text>
    <text x="28" y="146" class="label">C</text>
    <text x="288" y="146" class="label">C&#x2032;</text>
</g>

</svg>
