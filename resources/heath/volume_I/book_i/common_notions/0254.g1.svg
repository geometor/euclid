<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 274 209" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="274" height="209" fill="#ffffff"/>

<g id="circle" class="interactive">
    <circle cx="135" cy="115" r="80" class="geometry"/>
</g>
<g id="radii-and-chords" class="interactive">
    <line x1="135" y1="115" x2="190" y2="55" class="geometry"/>
    <line x1="135" y1="115" x2="215" y2="75" class="geometry"/>
    <line x1="135" y1="115" x2="210" y2="85" class="geometry"/>
    <line x1="190" y1="55" x2="215" y2="75" class="geometry"/>
    <line x1="190" y1="55" x2="210" y2="85" class="geometry"/>
</g>
<g id="points">
    <circle cx="135" cy="115" r="2.5" class="point"/>
    <circle cx="190" cy="55" r="2.5" class="point"/>
    <circle cx="215" cy="75" r="2.5" class="point"/>
    <circle cx="210" cy="85" r="2.5" class="point"/>
    <circle cx="200" cy="70" r="2" class="point"/>
</g>
<g id="labels">
    <text x="125" y="122" class="label">O</text>
    <text x="190" y="44" class="label">M</text>
    <text x="225" y="73" class="label">P</text>
    <text x="224" y="90" class="label">M&#x2032;</text>
    <text x="198" y="77" class="label">S</text>
</g>

</svg>
