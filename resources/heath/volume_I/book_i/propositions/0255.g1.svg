<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 287 189" width="287" height="189" class="euclid-graphic" data-graphic-id="0255.g1" data-folio="0255" data-graphic="g1" data-proposition="I.1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circles & Infinite Lines) -->
  <g id="elements">
    <circle id="el-circle-BCD" data-ref="( A B )" data-aliases="( B C D )" data-type="circle" cx="102" cy="96" r="81" class="geom-circle" />
    <circle id="el-circle-ACE" data-ref="( B A )" data-aliases="( A C E )" data-type="circle" cx="183" cy="96" r="81" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Polygons & Segments) -->
  <g id="graphics">
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-type="polygon" points="102,96 183,96 142.5,25.85" class="geom-polygon" />
    <line id="el-seg-AB" data-ref="/ A B /" data-type="segment" x1="102" y1="96" x2="183" y2="96" class="geom-line" />
    <line id="el-seg-CA" data-ref="/ C A /" data-type="segment" x1="142.5" y1="25.85" x2="102" y2="96" class="geom-line" />
    <line id="el-seg-CB" data-ref="/ C B /" data-type="segment" x1="142.5" y1="25.85" x2="183" y2="96" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" points="102,96 183,96 142.5,25.85" class="geom-polygon geom-overlay" />
    <circle id="hl-circle-BCD" data-ref="( A B )" data-aliases="( B C D )" cx="102" cy="96" r="81" class="geom-circle geom-overlay" />
    <circle id="hl-circle-ACE" data-ref="( B A )" data-aliases="( A C E )" cx="183" cy="96" r="81" class="geom-circle geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" x1="102" y1="96" x2="183" y2="96" class="geom-line geom-overlay" />
    <line id="hl-seg-CA" data-ref="/ C A /" x1="142.5" y1="25.85" x2="102" y2="96" class="geom-line geom-overlay" />
    <line id="hl-seg-CB" data-ref="/ C B /" x1="142.5" y1="25.85" x2="183" y2="96" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="102" cy="96" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="183" cy="96" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="142.5" cy="25.85" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="21" cy="96" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="264" cy="96" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-C" data-ref="C" x="141.4" y="15" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="13.2" y="99" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-A" data-ref="A" x="94.1" y="99" text-anchor="end" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="190.2" y="99" text-anchor="start" class="geom-label">B</text>
    <text id="lbl-E" data-ref="E" x="271.2" y="99" text-anchor="start" class="geom-label">E</text>
  </g>
</svg>
