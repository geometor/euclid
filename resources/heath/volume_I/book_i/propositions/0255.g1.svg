<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 287 189" width="287" height="189" class="euclid-graphic" data-folio="0255" data-graphic="g1" data-proposition="I.1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      color-scheme: light dark;
    }
    .geom-line {
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.2s, stroke-width 0.2s;
    }
    .geom-circle {
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.2s, stroke-width 0.2s;
    }
    .geom-polygon {
      fill: currentColor;
      fill-opacity: 0.05;
      stroke: none;
      transition: fill-opacity 0.2s;
    }
    .geom-point {
      fill: currentColor;
      stroke: #090d16;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: currentColor;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #38bdf8 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.25 !important;
      stroke: #38bdf8 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #38bdf8 !important;
    }
  </style>

  <!-- Polygons -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="102,96 183,96 142.5,25.85" class="geom-polygon" />

  <!-- Circles -->
  <circle id="el-circle-BCD" data-ref="BCD" data-type="circle" cx="102" cy="96" r="81" class="geom-circle" />
  <circle id="el-circle-ACE" data-ref="ACE" data-type="circle" cx="183" cy="96" r="81" class="geom-circle" />

  <!-- Segments -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="102" y1="96" x2="183" y2="96" class="geom-line" />
  <line id="el-seg-CA" data-ref="CA" data-type="segment" x1="142.5" y1="25.85" x2="102" y2="96" class="geom-line" />
  <line id="el-seg-CB" data-ref="CB" data-type="segment" x1="142.5" y1="25.85" x2="183" y2="96" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="102" cy="96" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="183" cy="96" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="142.5" cy="25.85" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="21" cy="96" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="264" cy="96" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-C" data-ref="C" x="141.4" y="15" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="13.2" y="99" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-A" data-ref="A" x="94.1" y="99" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="190.2" y="99" text-anchor="start" class="geom-label">B</text>
  <text id="lbl-E" data-ref="E" x="271.2" y="99" text-anchor="start" class="geom-label">E</text>
</svg>
