<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 214" width="342" height="214" class="euclid-graphic" data-folio="0257" data-graphic="g1" data-proposition="I.1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangle CAB (Isosceles triangle with AC = BC = 2*AB) -->
  <polygon id="el-tri-CAB" data-ref="CAB" data-type="polygon" points="133.5,16.2 108.5,113 158.5,113" class="geom-polygon" />

  <!-- Circles -->
  <!-- Inner Circle A: center A(108.5, 113), radius AB=50 -->
  <circle id="el-circle-A-in" data-ref="circleA_in" data-type="circle" cx="108.5" cy="113" r="50" class="geom-circle" />
  <!-- Inner Circle B: center B(158.5, 113), radius BA=50 -->
  <circle id="el-circle-B-in" data-ref="circleB_in" data-type="circle" cx="158.5" cy="113" r="50" class="geom-circle" />
  <!-- Outer Circle A: center A(108.5, 113), radius AE=100 -->
  <circle id="el-circle-A-out" data-ref="circleA_out" data-type="circle" cx="108.5" cy="113" r="100" class="geom-circle" />
  <!-- Outer Circle B: center B(158.5, 113), radius BD=100 -->
  <circle id="el-circle-B-out" data-ref="circleB_out" data-type="circle" cx="158.5" cy="113" r="100" class="geom-circle" />

  <!-- Segments & Base Line -->
  <!-- Line DE: produced base line from D to E -->
  <line id="el-line-DE" data-ref="DE" data-type="line" x1="58.5" y1="113" x2="208.5" y2="113" class="geom-line" />
  <!-- Side CA -->
  <line id="el-seg-CA" data-ref="CA" data-type="segment" x1="133.5" y1="16.2" x2="108.5" y2="113" class="geom-line" />
  <!-- Side CB -->
  <line id="el-seg-CB" data-ref="CB" data-type="segment" x1="133.5" y1="16.2" x2="158.5" y2="113" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="108.5" cy="113" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="158.5" cy="113" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="133.5" cy="16.2" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="58.5" cy="113" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="208.5" cy="113" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-C" data-ref="C" x="133.5" y="10" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="52.5" y="117" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-A" data-ref="A" x="103" y="125" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="165.5" y="125" text-anchor="start" class="geom-label">B</text>
  <text id="lbl-E" data-ref="E" x="216" y="117" text-anchor="start" class="geom-label">E</text>
</svg>