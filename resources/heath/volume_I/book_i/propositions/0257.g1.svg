<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 214" width="342" height="214" class="euclid-graphic" data-graphic-id="0257.g1" data-folio="0257" data-graphic="g1" data-proposition="I.1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circles & Produced Line DE) -->
  <g id="elements">
    <!-- Inner Circle A: center A(108.5, 113), radius AB=50 -->
    <circle id="el-circle-A-in" data-ref="( A B )" data-aliases="( B C D )" data-type="circle" cx="108.5" cy="113" r="50" class="geom-circle" />
    <!-- Inner Circle B: center B(158.5, 113), radius BA=50 -->
    <circle id="el-circle-B-in" data-ref="( B A )" data-aliases="( A C E )" data-type="circle" cx="158.5" cy="113" r="50" class="geom-circle" />
    <!-- Outer Circle A: center A(108.5, 113), radius AE=100 -->
    <circle id="el-circle-A-out" data-ref="( A E )" data-aliases="( E F )" data-type="circle" cx="108.5" cy="113" r="100" class="geom-circle" />
    <!-- Outer Circle B: center B(158.5, 113), radius BD=100 -->
    <circle id="el-circle-B-out" data-ref="( B D )" data-aliases="( D F )" data-type="circle" cx="158.5" cy="113" r="100" class="geom-circle" />
    <!-- Produced Line [ D E ] -->
    <line id="el-line-DE" data-ref="[ D E ]" data-aliases="/ D E /; [ A B ]" data-type="line" x1="58.5" y1="113" x2="208.5" y2="113" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Isosceles Triangle FAB & Sub-segments) -->
  <g id="graphics">
    <polygon id="el-tri-FAB" data-ref="&lt; F A B &gt;" data-aliases="&lt; C A B &gt;" data-type="polygon" points="133.5,16.2 108.5,113 158.5,113" class="geom-polygon" />
    <!-- Radius BD (exposed on left D-A, full highlight on hover) -->
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D A /" data-type="segment" x1="158.5" y1="113" x2="58.5" y2="113" class="geom-line" />
    <!-- Radius AE (exposed on right B-E, full highlight on hover) -->
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ B E /" data-type="segment" x1="108.5" y1="113" x2="208.5" y2="113" class="geom-line" />
    <!-- Base AB -->
    <line id="el-seg-AB" data-ref="/ A B /" data-type="segment" x1="108.5" y1="113" x2="158.5" y2="113" class="geom-line" />
    <!-- Side FA -->
    <line id="el-seg-FA" data-ref="/ F A /" data-aliases="/ C A /" data-type="segment" x1="133.5" y1="16.2" x2="108.5" y2="113" class="geom-line" />
    <!-- Side FB -->
    <line id="el-seg-FB" data-ref="/ F B /" data-aliases="/ C B /" data-type="segment" x1="133.5" y1="16.2" x2="158.5" y2="113" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-FAB" data-ref="&lt; F A B &gt;" data-aliases="&lt; C A B &gt;" points="133.5,16.2 108.5,113 158.5,113" class="geom-polygon geom-overlay" />
    <circle id="hl-circle-A-in" data-ref="( A B )" data-aliases="( B C D )" cx="108.5" cy="113" r="50" class="geom-circle geom-overlay" />
    <circle id="hl-circle-B-in" data-ref="( B A )" data-aliases="( A C E )" cx="158.5" cy="113" r="50" class="geom-circle geom-overlay" />
    <circle id="hl-circle-A-out" data-ref="( A E )" data-aliases="( E F )" cx="108.5" cy="113" r="100" class="geom-circle geom-overlay" />
    <circle id="hl-circle-B-out" data-ref="( B D )" data-aliases="( D F )" cx="158.5" cy="113" r="100" class="geom-circle geom-overlay" />
    <line id="hl-line-DE" data-ref="[ D E ]" data-aliases="/ D E /; [ A B ]" x1="58.5" y1="113" x2="208.5" y2="113" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" x1="108.5" y1="113" x2="158.5" y2="113" class="geom-line geom-overlay" />
    <line id="hl-seg-AE" data-ref="/ A E /" x1="108.5" y1="113" x2="208.5" y2="113" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" x1="158.5" y1="113" x2="58.5" y2="113" class="geom-line geom-overlay" />
    <line id="hl-seg-FA" data-ref="/ F A /" data-aliases="/ C A /" x1="133.5" y1="16.2" x2="108.5" y2="113" class="geom-line geom-overlay" />
    <line id="hl-seg-FB" data-ref="/ F B /" data-aliases="/ C B /" x1="133.5" y1="16.2" x2="158.5" y2="113" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="108.5" cy="113" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="158.5" cy="113" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="133.5" cy="69.7" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="58.5" cy="113" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="208.5" cy="113" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="133.5" cy="16.2" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-F" data-ref="F" x="133.5" y="11" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-C" data-ref="C" x="133.5" y="64" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="52.5" y="117" text-anchor="end" class="geom-label">D</text>
    <text id="lbl-A" data-ref="A" x="103" y="125" text-anchor="end" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="165.5" y="125" text-anchor="start" class="geom-label">B</text>
    <text id="lbl-E" data-ref="E" x="216" y="117" text-anchor="start" class="geom-label">E</text>
  </g>
</svg>