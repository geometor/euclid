<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 335 185" width="335" height="185" class="euclid-graphic" data-folio="0257" data-graphic="g2" data-proposition="I.1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Scalene Triangle ABD -->
  <polygon id="el-tri-ABD" data-ref="ABD" data-type="polygon" points="97,101 175,101 77.5,56.5" class="geom-polygon" />

  <!-- Circles -->
  <!-- Circle with centre A, radius AB=78 -->
  <circle id="el-circle-A" data-ref="circleA" data-type="circle" cx="97" cy="101" r="78" class="geom-circle" />
  <!-- Circle with centre B, radius BA=78 -->
  <circle id="el-circle-B" data-ref="circleB" data-type="circle" cx="175" cy="101" r="78" class="geom-circle" />

  <!-- Segments -->
  <!-- Base AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="97" y1="101" x2="175" y2="101" class="geom-line" />
  <!-- Ray AC (Radius of Circle A) -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="97" y1="101" x2="66" y2="30" class="geom-line" />
  <!-- Segment BD joining B to D on AC -->
  <line id="el-seg-BD" data-ref="BD" data-type="segment" x1="175" y1="101" x2="77.5" y2="56.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="97" cy="101" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="175" cy="101" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="66" cy="30" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="77.5" cy="56.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-C" data-ref="C" x="62" y="24" text-anchor="end" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="69" y="55" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="102" y="60" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-A" data-ref="A" x="90" y="105" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="183" y="105" text-anchor="start" class="geom-label">B</text>
</svg>