<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 335 185" width="335" height="185" class="euclid-graphic" data-graphic-id="0257.g2" data-folio="0257" data-graphic="g2" data-proposition="I.1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circles) -->
  <g id="elements">
    <!-- Circle with centre A, radius AB=78 -->
    <circle id="el-circle-A" data-ref="( A B )" data-aliases="( A C ) | ( B C )" data-type="circle" cx="97" cy="101" r="78" class="geom-circle" />
    <!-- Circle with centre B, radius BA=78 -->
    <circle id="el-circle-B" data-ref="( B A )" data-aliases="( B E ) | ( A E )" data-type="circle" cx="175" cy="101" r="78" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Scalene Triangle ABD & Segments) -->
  <g id="graphics">
    <polygon id="el-tri-ABD" data-ref="&lt; A B D &gt;" data-type="polygon" points="97,101 175,101 77.5,56.0" class="geom-polygon" />
    <!-- Base AB -->
    <line id="el-seg-AB" data-ref="/ A B /" data-type="segment" x1="97" y1="101" x2="175" y2="101" class="geom-line" />
    <!-- Radius AC (with section ADC) -->
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ A D C /" data-type="segment" x1="97" y1="101" x2="66" y2="29.4" class="geom-line" />
    <!-- Segment BD (with section BED) -->
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ B E D /" data-type="segment" x1="175" y1="101" x2="77.5" y2="56.0" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-ABD" data-ref="&lt; A B D &gt;" points="97,101 175,101 77.5,56.0" class="geom-polygon geom-overlay" />
    <circle id="hl-circle-A" data-ref="( A B )" data-aliases="( A C ) | ( B C )" cx="97" cy="101" r="78" class="geom-circle geom-overlay" />
    <circle id="hl-circle-B" data-ref="( B A )" data-aliases="( B E ) | ( A E )" cx="175" cy="101" r="78" class="geom-circle geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" x1="97" y1="101" x2="175" y2="101" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ A D C /" x1="97" y1="101" x2="66" y2="29.4" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" x1="97" y1="101" x2="77.5" y2="56.0" class="geom-line geom-overlay" />
    <line id="hl-seg-DC" data-ref="/ D C /" x1="77.5" y1="56.0" x2="66" y2="29.4" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ B E D /" x1="175" y1="101" x2="77.5" y2="56.0" class="geom-line geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" x1="175" y1="101" x2="104.2" y2="68.3" class="geom-line geom-overlay" />
    <line id="hl-seg-ED" data-ref="/ E D /" x1="104.2" y1="68.3" x2="77.5" y2="56.0" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="97" cy="101" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="175" cy="101" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="66" cy="29.4" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="77.5" cy="56.0" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="104.2" cy="68.3" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-C" data-ref="C" x="62" y="24" text-anchor="end" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="69" y="55" text-anchor="end" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="102" y="60" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-A" data-ref="A" x="90" y="105" text-anchor="end" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="183" y="105" text-anchor="start" class="geom-label">B</text>
  </g>
</svg>