<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 225" width="270" height="225" class="euclid-graphic" data-folio="0258" data-graphic="g1" data-proposition="I.2">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      color-scheme: light dark;
    }
    .geom-line {
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.2s, stroke-width 0.2s;
    }
    .geom-circle {
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.2s, stroke-width 0.2s;
    }
    .geom-polygon {
      fill: currentColor;
      fill-opacity: 0.05;
      stroke: none;
      transition: fill-opacity 0.2s;
    }
    .geom-point {
      fill: currentColor;
      stroke: #090d16;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: currentColor;
      user-select: none;
    }
    .geom-tick {
      stroke: currentColor;
      stroke-width: 1.8;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #38bdf8 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.25 !important;
      stroke: #38bdf8 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #38bdf8 !important;
    }
  </style>

  <!-- Triangle DAB (Equilateral constructed on AB) -->
  <polygon id="el-tri-DAB" data-ref="DAB" data-type="polygon" points="101,101 102,126 123,113" class="geom-polygon" />

  <!-- Circles -->
  <!-- Circle CGH: Center B(123, 113), Radius BC=62 -->
  <circle id="el-circle-CGH" data-ref="CGH" data-type="circle" cx="123" cy="113" r="62" class="geom-circle" />

  <!-- Circle GKL: Center D(101, 101), Radius DG=87 -->
  <circle id="el-circle-GKL" data-ref="GKL" data-type="circle" cx="101" cy="101" r="87" class="geom-circle" />

  <!-- Segments & Produced Lines -->
  <!-- Segment BC (Given straight line) -->
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="123" y1="113" x2="123" y2="51" class="geom-line" />
  <!-- Tick mark on BC indicating given length -->
  <line x1="119" y1="84" x2="127" y2="80" class="geom-tick" />

  <!-- Segment AB (Joined) -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="102" y1="126" x2="123" y2="113" class="geom-line" />

  <!-- Segment DA -->
  <line id="el-seg-DA" data-ref="DA" data-type="segment" x1="101" y1="101" x2="102" y2="126" class="geom-line" />

  <!-- Segment DB -->
  <line id="el-seg-DB" data-ref="DB" data-type="segment" x1="101" y1="101" x2="123" y2="113" class="geom-line" />

  <!-- Line BF (DB produced through B to F) -->
  <line id="el-line-BF" data-ref="BF" data-type="line" x1="123" y1="113" x2="200" y2="155" class="geom-line" />

  <!-- Line AE (DA produced through A to E) -->
  <line id="el-line-AE" data-ref="AE" data-type="line" x1="102" y1="126" x2="105.5" y2="206" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="102" cy="126" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="123" cy="113" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="123" cy="51" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="101" cy="101" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="177.5" cy="142.7" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="200" cy="155" r="3.5" class="geom-point" />
  <circle id="el-pt-L" data-ref="L" data-type="point" cx="104.5" cy="188" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="105.5" cy="206" r="3.5" class="geom-point" />

  <!-- Labels matching Heath's typography -->
  <text id="lbl-C" data-ref="C" x="123" y="42" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-H" data-ref="H" x="69" y="73" text-anchor="middle" class="geom-label">H</text>
  <text id="lbl-K" data-ref="K" x="25" y="68" text-anchor="middle" class="geom-label">K</text>
  <text id="lbl-D" data-ref="D" x="91" y="99" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-B" data-ref="B" x="129" y="110" text-anchor="start" class="geom-label">B</text>
  <text id="lbl-A" data-ref="A" x="93" y="129" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-G" data-ref="G" x="187" y="139" text-anchor="start" class="geom-label">G</text>
  <text id="lbl-F" data-ref="F" x="205" y="161" text-anchor="start" class="geom-label">F</text>
  <text id="lbl-L" data-ref="L" x="95" y="193" text-anchor="end" class="geom-label">L</text>
  <text id="lbl-E" data-ref="E" x="106" y="220" text-anchor="middle" class="geom-label">E</text>
</svg>
