<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 280" width="610" height="280" class="euclid-graphic" data-folio="0259" data-graphic="g1" data-proposition="I.2">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- ==================== LEFT FIGURE: Case 3 (AB < BC) ==================== -->
  <g id="figure-case-3">
    <!-- Triangle DAB (Equilateral constructed on AB) -->
    <polygon id="el-tri-DAB-L" data-ref="DAB" data-type="polygon" points="102,196 71,142 133,142" class="geom-polygon" />

    <!-- Circle CGH: Center B(133, 142), Radius BC=118 -->
    <circle id="el-circle-CGH-L" data-ref="CGH" data-type="circle" cx="133" cy="142" r="118" class="geom-circle" />

    <!-- Circle GKL: Center D(102, 196), Radius DG=56 -->
    <circle id="el-circle-GKL-L" data-ref="GKL" data-type="circle" cx="102" cy="196" r="56" class="geom-circle" />

    <!-- Segment BC (Given straight line) -->
    <line id="el-seg-BC-L" data-ref="BC" data-type="segment" x1="133" y1="142" x2="85" y2="34" class="geom-line" />

    <!-- Segment AB -->
    <line id="el-seg-AB-L" data-ref="AB" data-type="segment" x1="71" y1="142" x2="133" y2="142" class="geom-line" />

    <!-- Segment DA and DA produced to L -->
    <line id="el-seg-DA-L" data-ref="DA" data-type="segment" x1="71" y1="142" x2="102" y2="196" class="geom-line" />
    <line id="el-line-DL-L" data-ref="DL" data-type="line" x1="102" y1="196" x2="130" y2="245" class="geom-line" />

    <!-- Segment DB and DB produced to G -->
    <line id="el-seg-DB-L" data-ref="DB" data-type="segment" x1="133" y1="142" x2="102" y2="196" class="geom-line" />
    <line id="el-line-DG-L" data-ref="DG" data-type="line" x1="102" y1="196" x2="74" y2="244" class="geom-line" />

    <!-- Points -->
    <circle id="el-pt-A-L" data-ref="A" data-type="point" cx="71" cy="142" r="3.5" class="geom-point" />
    <circle id="el-pt-B-L" data-ref="B" data-type="point" cx="133" cy="142" r="3.5" class="geom-point" />
    <circle id="el-pt-C-L" data-ref="C" data-type="point" cx="85" cy="34" r="3.5" class="geom-point" />
    <circle id="el-pt-D-L" data-ref="D" data-type="point" cx="102" cy="196" r="3.5" class="geom-point" />
    <circle id="el-pt-G-L" data-ref="G" data-type="point" cx="74" cy="244" r="3.5" class="geom-point" />
    <circle id="el-pt-L-L" data-ref="L" data-type="point" cx="130" cy="245" r="3.5" class="geom-point" />

    <!-- Labels -->
    <text id="lbl-C-L" data-ref="C" x="83" y="28" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-H-L" data-ref="H" x="237" y="83" text-anchor="start" class="geom-label">H</text>
    <text id="lbl-A-L" data-ref="A" x="63" y="142" text-anchor="end" class="geom-label">A</text>
    <text id="lbl-B-L" data-ref="B" x="140" y="140" text-anchor="start" class="geom-label">B</text>
    <text id="lbl-D-L" data-ref="D" x="95" y="198" text-anchor="end" class="geom-label">D</text>
    <text id="lbl-K-L" data-ref="K" x="153" y="200" text-anchor="start" class="geom-label">K</text>
    <text id="lbl-G-L" data-ref="G" x="68" y="248" text-anchor="end" class="geom-label">G</text>
    <text id="lbl-L-L" data-ref="L" x="134" y="240" text-anchor="start" class="geom-label">L</text>
  </g>

  <!-- ==================== RIGHT FIGURE: Case 2 (AB > BC) ==================== -->
  <g id="figure-case-2">
    <!-- Triangle DAB (Equilateral constructed on AB) -->
    <polygon id="el-tri-DAB-R" data-ref="DAB" data-type="polygon" points="379,208.5 310,89 448,89" class="geom-polygon" />

    <!-- Circle CGH: Center B(448, 89), Radius BC=69 -->
    <circle id="el-circle-CGH-R" data-ref="CGH" data-type="circle" cx="448" cy="89" r="69" class="geom-circle" />

    <!-- Circle GKL: Center D(379, 208.5), Radius DG=69 -->
    <circle id="el-circle-GKL-R" data-ref="GKL" data-type="circle" cx="379" cy="208.5" r="69" class="geom-circle" />

    <!-- Segment BC (Given straight line) -->
    <line id="el-seg-BC-R" data-ref="BC" data-type="segment" x1="448" y1="89" x2="410" y2="32" class="geom-line" />

    <!-- Segment AB -->
    <line id="el-seg-AB-R" data-ref="AB" data-type="segment" x1="310" y1="89" x2="448" y2="89" class="geom-line" />

    <!-- Segment DA with Point L on DA -->
    <line id="el-seg-DA-R" data-ref="DA" data-type="segment" x1="310" y1="89" x2="379" y2="208.5" class="geom-line" />

    <!-- Segment DB with Point G on DB -->
    <line id="el-seg-DB-R" data-ref="DB" data-type="segment" x1="448" y1="89" x2="379" y2="208.5" class="geom-line" />

    <!-- Points -->
    <circle id="el-pt-A-R" data-ref="A" data-type="point" cx="310" cy="89" r="3.5" class="geom-point" />
    <circle id="el-pt-B-R" data-ref="B" data-type="point" cx="448" cy="89" r="3.5" class="geom-point" />
    <circle id="el-pt-C-R" data-ref="C" data-type="point" cx="410" cy="32" r="3.5" class="geom-point" />
    <circle id="el-pt-D-R" data-ref="D" data-type="point" cx="379" cy="208.5" r="3.5" class="geom-point" />
    <circle id="el-pt-G-R" data-ref="G" data-type="point" cx="413.5" cy="148.8" r="3.5" class="geom-point" />
    <circle id="el-pt-L-R" data-ref="L" data-type="point" cx="344.5" cy="148.7" r="3.5" class="geom-point" />

    <!-- Labels -->
    <text id="lbl-C-R" data-ref="C" x="398" y="20" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-H-R" data-ref="H" x="533" y="49" text-anchor="start" class="geom-label">H</text>
    <text id="lbl-A-R" data-ref="A" x="304" y="89" text-anchor="end" class="geom-label">A</text>
    <text id="lbl-B-R" data-ref="B" x="460" y="89" text-anchor="start" class="geom-label">B</text>
    <text id="lbl-L-R" data-ref="L" x="355" y="146" text-anchor="start" class="geom-label">L</text>
    <text id="lbl-G-R" data-ref="G" x="408" y="147" text-anchor="end" class="geom-label">G</text>
    <text id="lbl-K-R" data-ref="K" x="445" y="220" text-anchor="start" class="geom-label">K</text>
    <text id="lbl-D-R" data-ref="D" x="380" y="222" text-anchor="middle" class="geom-label">D</text>
  </g>
</svg>