<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 220" width="290" height="220" class="euclid-graphic" data-folio="0260" data-graphic="g1" data-proposition="I.3">
    <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-tick {
      stroke: #000000;
      stroke-width: 1.8;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
<!-- Segment C (The lesser given straight line) -->
  <line id="el-seg-C" data-ref="C" data-type="segment" x1="48" y1="30" x2="124" y2="30" class="geom-line" />

  <!-- Circle DEF (Center A=86, 123, Radius=79) -->
  <circle id="el-circle-DEF" data-ref="DEF" data-type="circle" cx="86" cy="123" r="79" class="geom-circle" />

  <!-- Segment AD (Placed equal to C) -->
  <line id="el-seg-AD" data-ref="AD" data-type="segment" x1="86" y1="123" x2="25" y2="73" class="geom-line" />

  <!-- Segment AE (Cut off from AB equal to C) -->
  <line id="el-seg-AE" data-ref="AE" data-type="segment" x1="86" y1="123" x2="165" y2="123" class="geom-line" />

  <!-- Segment EB (Remaining part of greater line AB) -->
  <line id="el-seg-EB" data-ref="EB" data-type="segment" x1="165" y1="123" x2="204" y2="123" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="86" cy="123" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="204" cy="123" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="25" cy="73" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="165" cy="123" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-C" data-ref="C" x="86" y="21" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="17" y="70" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-A" data-ref="A" x="86" y="141" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-E" data-ref="E" x="174" y="117" text-anchor="start" class="geom-label">E</text>
  <text id="lbl-B" data-ref="B" x="204" y="141" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-F" data-ref="F" x="150" y="187" text-anchor="start" class="geom-label">F</text>
</svg>
