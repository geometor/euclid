<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 140" width="340" height="140" class="euclid-graphic" data-graphic-id="0261.g1" data-folio="0261" data-graphic="g1" data-proposition="I.4">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circles & Infinite Lines) -->
  <g id="elements">
    <!-- Arc under EF illustrating superposition / non-coincidence contradiction -->
    <path id="el-arc-EF" data-ref="( E F )" data-type="arc" d="M 174 111 Q 224 120 274 111" class="geom-arc" />
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
    <!-- Triangle ABC -->
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-type="polygon" points="91,23 7,111 110,111" class="geom-polygon" />
    <!-- Triangle DEF -->
    <polygon id="el-tri-DEF" data-ref="&lt; D E F &gt;" data-type="polygon" points="256,23 174,111 274,111" class="geom-polygon" />

    <!-- Angles (Wedges) of ABC -->
    <path id="el-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; C A B )" data-type="wedge" d="M 91 23 L 75.81 38.91 A 22 22 0 0 0 95.64 44.50 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A )" data-type="wedge" d="M 7 111 L 22.19 95.09 A 22 22 0 0 1 29 111 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ACB" data-ref="&lt; A C B )" data-aliases="&lt; B C A )" data-type="wedge" d="M 110 111 L 105.36 89.50 A 22 22 0 0 0 88 111 Z" class="wedge angle geom-overlay" />

    <!-- Angles (Wedges) of DEF -->
    <path id="el-ang-EDF" data-ref="&lt; E D F )" data-aliases="&lt; F D E )" data-type="wedge" d="M 256 23 L 241.00 39.10 A 22 22 0 0 0 260.41 44.55 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-DEF" data-ref="&lt; D E F )" data-aliases="&lt; F E D )" data-type="wedge" d="M 174 111 L 189.00 94.90 A 22 22 0 0 1 196 111 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-DFE" data-ref="&lt; D F E )" data-aliases="&lt; E F D )" data-type="wedge" d="M 274 111 L 269.59 89.45 A 22 22 0 0 0 252 111 Z" class="wedge angle geom-overlay" />

    <!-- Segments of ABC -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /;[ A B ]" data-type="segment" x1="91" y1="23" x2="7" y2="111" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="7" y1="111" x2="110" y2="111" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="91" y1="23" x2="110" y2="111" class="geom-line" />

    <!-- Segments of DEF -->
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /;[ D E ]" data-type="segment" x1="256" y1="23" x2="174" y2="111" class="geom-line" />
    <line id="el-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" data-type="segment" x1="174" y1="111" x2="274" y2="111" class="geom-line" />
    <line id="el-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" data-type="segment" x1="256" y1="23" x2="274" y2="111" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" points="91,23 7,111 110,111" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-DEF" data-ref="&lt; D E F &gt;" points="256,23 174,111 274,111" class="geom-polygon geom-overlay" />

    <path id="hl-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; C A B )" d="M 91 23 L 75.81 38.91 A 22 22 0 0 0 95.64 44.50 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A )" d="M 7 111 L 22.19 95.09 A 22 22 0 0 1 29 111 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ACB" data-ref="&lt; A C B )" data-aliases="&lt; B C A )" d="M 110 111 L 105.36 89.50 A 22 22 0 0 0 88 111 Z" class="wedge angle geom-overlay" />

    <path id="hl-ang-EDF" data-ref="&lt; E D F )" data-aliases="&lt; F D E )" d="M 256 23 L 241.00 39.10 A 22 22 0 0 0 260.41 44.55 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-DEF" data-ref="&lt; D E F )" data-aliases="&lt; F E D )" d="M 174 111 L 189.00 94.90 A 22 22 0 0 1 196 111 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-DFE" data-ref="&lt; D F E )" data-aliases="&lt; E F D )" d="M 274 111 L 269.59 89.45 A 22 22 0 0 0 252 111 Z" class="wedge angle geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /;[ A B ]" x1="91" y1="23" x2="7" y2="111" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="7" y1="111" x2="110" y2="111" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="91" y1="23" x2="110" y2="111" class="geom-line geom-overlay" />

    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /;[ D E ]" x1="256" y1="23" x2="174" y2="111" class="geom-line geom-overlay" />
    <line id="hl-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" x1="174" y1="111" x2="274" y2="111" class="geom-line geom-overlay" />
    <line id="hl-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" x1="256" y1="23" x2="274" y2="111" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="91" cy="23" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="7" cy="111" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="110" cy="111" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="256" cy="23" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="174" cy="111" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="274" cy="111" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="94" y="15" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="7" y="128" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="110" y="128" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="260" y="15" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="171" y="128" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="275" y="128" text-anchor="middle" class="geom-label">F</text>
  </g>
</svg>
