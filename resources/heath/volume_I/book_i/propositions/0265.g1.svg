<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 173 200" width="173" height="200" class="euclid-graphic" data-folio="0265" data-graphic="g1" data-proposition="I.5">
    <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-tick {
      stroke: #000000;
      stroke-width: 1.8;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
<!-- Isosceles Triangle ABC -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="84,21 46,107 122,107" class="geom-polygon" />
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="84" y1="21" x2="46" y2="107" class="geom-line" />
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="84" y1="21" x2="122" y2="107" class="geom-line" />
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="46" y1="107" x2="122" y2="107" class="geom-line" />

  <!-- Produced lines BD and CE -->
  <line id="el-seg-BD" data-ref="BD" data-type="segment" x1="46" y1="107" x2="16" y2="174" class="geom-line" />
  <line id="el-seg-CE" data-ref="CE" data-type="segment" x1="122" y1="107" x2="152" y2="174" class="geom-line" />

  <!-- Cross lines FC and GB -->
  <line id="el-seg-FC" data-ref="FC" data-type="segment" x1="29" y1="146" x2="122" y2="107" class="geom-line" />
  <line id="el-seg-GB" data-ref="GB" data-type="segment" x1="139" y1="146" x2="46" y2="107" class="geom-line" />

  <!-- Triangles FBC and GCB -->
  <polygon id="el-tri-FBC" data-ref="FBC" data-type="polygon" points="29,146 46,107 122,107" class="geom-polygon" />
  <polygon id="el-tri-GCB" data-ref="GCB" data-type="polygon" points="139,146 122,107 46,107" class="geom-polygon" />

  <!-- Triangles AFC and AGB -->
  <polygon id="el-tri-AFC" data-ref="AFC" data-type="polygon" points="84,21 29,146 122,107" class="geom-polygon" />
  <polygon id="el-tri-AGB" data-ref="AGB" data-type="polygon" points="84,21 139,146 46,107" class="geom-polygon" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="84" cy="21" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="46" cy="107" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="122" cy="107" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="29" cy="146" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="139" cy="146" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="16" cy="174" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="152" cy="174" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="84" y="14" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="38" y="108" text-anchor="end" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="130" y="108" text-anchor="start" class="geom-label">C</text>
  <text id="lbl-F" data-ref="F" x="22" y="148" text-anchor="end" class="geom-label">F</text>
  <text id="lbl-G" data-ref="G" x="146" y="148" text-anchor="start" class="geom-label">G</text>
  <text id="lbl-D" data-ref="D" x="15" y="187" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="153" y="187" text-anchor="middle" class="geom-label">E</text>
</svg>
