<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 205 180" width="205" height="180" class="euclid-graphic" data-graphic-id="0267.g1" data-folio="0267" data-graphic="g1" data-proposition="I.5">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-aux {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-dasharray: 4,3;
      transition: stroke 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      stroke-dasharray: 3,2.5;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circle & Diameter Extensions) -->
  <g id="elements">
    <circle id="el-circ-OA" data-ref="( O A )" data-aliases="( O B ) | ( A B )" data-type="circle" cx="91" cy="94" r="78.29" class="geom-circle" />
    <line id="el-line-OA" data-ref="[ O A ]" data-type="line" x1="20" y1="127" x2="162" y2="61" class="geom-aux" />
    <line id="el-line-OB" data-ref="[ O B ]" data-type="line" x1="162" y1="127" x2="20" y2="61" class="geom-aux" />
  </g>

  <!-- Constructed Graphics (Isosceles Triangle OAB, Radii & Chord, Angle Arcs & Wedges) -->
  <g id="graphics">
    <polygon id="el-tri-OAB" data-ref="&lt; O A B &gt;" data-type="polygon" points="91,94 20,127 162,127" class="geom-polygon" />
    <line id="el-seg-OA" data-ref="/ O A /" data-type="segment" x1="91" y1="94" x2="20" y2="127" class="geom-line" />
    <line id="el-seg-OB" data-ref="/ O B /" data-type="segment" x1="91" y1="94" x2="162" y2="127" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-type="segment" x1="20" y1="127" x2="162" y2="127" class="geom-line" />

    <!-- Dashed Angle Arcs Shown in Heath's Diagram -->
    <path id="el-arc-E" data-ref="&lt; O A B )" data-aliases="&lt; E ) | E | &lt; A )" d="M 57 127 A 37 37 0 0 0 53.55 111.4" class="geom-arc" />
    <path id="el-arc-C" data-ref="&lt; C )" data-aliases="C" d="M 44 127 A 25 25 0 0 1 35 147" class="geom-arc" />
    <path id="el-arc-F" data-ref="&lt; O B A )" data-aliases="&lt; F ) | F | &lt; B )" d="M 125 127 A 37 37 0 0 1 128.45 111.4" class="geom-arc" />
    <path id="el-arc-D" data-ref="&lt; D )" data-aliases="D" d="M 138 127 A 25 25 0 0 0 147 147" class="geom-arc" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-E" data-ref="&lt; O A B )" data-aliases="&lt; E ) | E | &lt; A )" data-type="wedge" d="M 20.00 127.00 L 53.55 111.40 A 37.0 37.0 0 0 1 57.00 127.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-F" data-ref="&lt; O B A )" data-aliases="&lt; F ) | F | &lt; B )" data-type="wedge" d="M 162.00 127.00 L 128.45 111.40 A 37.0 37.0 0 0 0 125.00 127.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-C" data-ref="&lt; C )" data-aliases="C" data-type="wedge" d="M 20.00 127.00 L 44.00 127.00 A 25.0 25.0 0 0 1 35.00 147.00 A 78.29 78.29 0 0 1 20.00 127.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-D" data-ref="&lt; D )" data-aliases="D" data-type="wedge" d="M 162.00 127.00 L 138.00 127.00 A 25.0 25.0 0 0 0 147.00 147.00 A 78.29 78.29 0 0 0 162.00 127.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-AC" data-ref="&lt; A C )" data-aliases="&lt; O A C )" data-type="wedge" d="M 20.00 127.00 L 53.55 111.40 A 37.0 37.0 0 0 1 57.00 127.00 L 44.00 127.00 A 25.0 25.0 0 0 1 35.00 147.00 A 78.29 78.29 0 0 1 20.00 127.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BD" data-ref="&lt; B D )" data-aliases="&lt; O B D )" data-type="wedge" d="M 162.00 127.00 L 128.45 111.40 A 37.0 37.0 0 0 0 125.00 127.00 L 138.00 127.00 A 25.0 25.0 0 0 0 147.00 147.00 A 78.29 78.29 0 0 0 162.00 127.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circ-OA" data-ref="( O A )" data-aliases="( O B ) | ( A B )" cx="91" cy="94" r="78.29" class="geom-circle geom-overlay" />
    <line id="hl-line-OA" data-ref="[ O A ]" x1="20" y1="127" x2="162" y2="61" class="geom-line geom-overlay" />
    <line id="hl-line-OB" data-ref="[ O B ]" x1="162" y1="127" x2="20" y2="61" class="geom-line geom-overlay" />
    <polygon id="hl-tri-OAB" data-ref="&lt; O A B &gt;" points="91,94 20,127 162,127" class="geom-polygon geom-overlay" />
    <line id="hl-seg-OA" data-ref="/ O A /" x1="91" y1="94" x2="20" y2="127" class="geom-line geom-overlay" />
    <line id="hl-seg-OB" data-ref="/ O B /" x1="91" y1="94" x2="162" y2="127" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" x1="20" y1="127" x2="162" y2="127" class="geom-line geom-overlay" />
    <path id="hl-ang-E" data-ref="&lt; O A B )" data-aliases="&lt; E ) | E | &lt; A )" d="M 20.00 127.00 L 53.55 111.40 A 37.0 37.0 0 0 1 57.00 127.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-F" data-ref="&lt; O B A )" data-aliases="&lt; F ) | F | &lt; B )" d="M 162.00 127.00 L 128.45 111.40 A 37.0 37.0 0 0 0 125.00 127.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-C" data-ref="&lt; C )" data-aliases="C" d="M 20.00 127.00 L 44.00 127.00 A 25.0 25.0 0 0 1 35.00 147.00 A 78.29 78.29 0 0 1 20.00 127.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-D" data-ref="&lt; D )" data-aliases="D" d="M 162.00 127.00 L 138.00 127.00 A 25.0 25.0 0 0 0 147.00 147.00 A 78.29 78.29 0 0 0 162.00 127.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-AC" data-ref="&lt; A C )" data-aliases="&lt; O A C )" d="M 20.00 127.00 L 53.55 111.40 A 37.0 37.0 0 0 1 57.00 127.00 L 44.00 127.00 A 25.0 25.0 0 0 1 35.00 147.00 A 78.29 78.29 0 0 1 20.00 127.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-BD" data-ref="&lt; B D )" data-aliases="&lt; O B D )" d="M 162.00 127.00 L 128.45 111.40 A 37.0 37.0 0 0 0 125.00 127.00 L 138.00 127.00 A 25.0 25.0 0 0 0 147.00 147.00 A 78.29 78.29 0 0 0 162.00 127.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-O" data-ref="O" data-type="point" cx="91" cy="94" r="3.5" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="20" cy="127" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="162" cy="127" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-O" data-ref="O" x="91" y="86" text-anchor="middle" class="geom-label">O</text>
    <text id="lbl-A" data-ref="A" x="9" y="131" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="174" y="131" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-E" data-ref="&lt; O A B )" data-aliases="&lt; E ) | E" x="58" y="120" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-C" data-ref="&lt; C )" data-aliases="C" x="33" y="142" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-F" data-ref="&lt; O B A )" data-aliases="&lt; F ) | F" x="124" y="120" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-D" data-ref="&lt; D )" data-aliases="D" x="149" y="142" text-anchor="middle" class="geom-label">D</text>
  </g>
</svg>
