<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 205 180" width="205" height="180" class="euclid-graphic" data-folio="0267" data-graphic="g1" data-proposition="I.5">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-aux {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-dasharray: 4,3;
      transition: stroke 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      stroke-dasharray: 3,2.5;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Circle -->
  <circle id="el-circ-O" data-ref="circle-O" cx="91" cy="94" r="78" class="geom-circle" />

  <!-- Isosceles Triangle OAB -->
  <polygon id="el-tri-OAB" data-ref="OAB" data-type="polygon" points="91,94 20,127 162,127" class="geom-polygon" />

  <!-- Diameters (Dashed Extensions) -->
  <line id="el-seg-OA-ext" data-ref="OA" data-type="segment" x1="91" y1="94" x2="162" y2="61" class="geom-aux" />
  <line id="el-seg-OB-ext" data-ref="OB" data-type="segment" x1="91" y1="94" x2="20" y2="61" class="geom-aux" />

  <!-- Radii OA, OB and Base AB -->
  <line id="el-seg-OA" data-ref="OA" data-type="segment" x1="91" y1="94" x2="20" y2="127" class="geom-line" />
  <line id="el-seg-OB" data-ref="OB" data-type="segment" x1="91" y1="94" x2="162" y2="127" class="geom-line" />
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="20" y1="127" x2="162" y2="127" class="geom-line" />

  <!-- Angle Arcs -->
  <!-- Arc E at A (between AB and OA) -->
  <path id="el-arc-E" data-ref="angle-E" d="M 55 127 A 37 37 0 0 0 53 112" class="geom-arc" />
  <!-- Arc C at A (between AB and lower circumference) -->
  <path id="el-arc-C" data-ref="angle-C" d="M 44 127 A 25 25 0 0 1 35 147" class="geom-arc" />
  <!-- Arc F at B (between AB and OB) -->
  <path id="el-arc-F" data-ref="angle-F" d="M 127 127 A 37 37 0 0 1 129 112" class="geom-arc" />
  <!-- Arc D at B (between AB and lower circumference) -->
  <path id="el-arc-D" data-ref="angle-D" d="M 138 127 A 25 25 0 0 0 147 147" class="geom-arc" />

  <!-- Points -->
  <circle id="el-pt-O" data-ref="O" data-type="point" cx="91" cy="94" r="3.5" class="geom-point" />
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="20" cy="127" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="162" cy="127" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-O" data-ref="O" x="91" y="86" text-anchor="middle" class="geom-label">O</text>
  <text id="lbl-A" data-ref="A" x="9" y="131" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="174" y="131" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-E" data-ref="angle-E" x="58" y="120" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-C" data-ref="angle-C" x="33" y="142" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-F" data-ref="angle-F" x="124" y="120" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-D" data-ref="angle-D" x="149" y="142" text-anchor="middle" class="geom-label">D</text>
</svg>
