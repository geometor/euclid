<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 155" width="140" height="155" class="euclid-graphic" data-graphic-id="0268.g1" data-folio="0268" data-graphic="g1" data-proposition="I.5">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Isosceles Triangle ABC, Sides, and Angle Wedges) -->
  <g id="graphics">
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-type="polygon" points="57,35 15,133 99,133" class="geom-polygon" />
    <line id="el-seg-AB" data-ref="/ A B /" data-type="segment" x1="57" y1="35" x2="15" y2="133" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-type="segment" x1="57" y1="35" x2="99" y2="133" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-type="segment" x1="15" y1="133" x2="99" y2="133" class="geom-line" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-BAC" data-ref="&lt; B A C )" data-type="wedge" d="M 57.00 35.00 L 47.55 57.06 A 24.0 24.0 0 0 0 66.45 57.06 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ABC" data-ref="&lt; A B C )" data-type="wedge" d="M 15.00 133.00 L 23.67 112.78 A 22.0 22.0 0 0 1 37.00 133.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ACB" data-ref="&lt; A C B )" data-type="wedge" d="M 99.00 133.00 L 90.33 112.78 A 22.0 22.0 0 0 0 77.00 133.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" points="57,35 15,133 99,133" class="geom-polygon geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" x1="57" y1="35" x2="15" y2="133" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" x1="57" y1="35" x2="99" y2="133" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" x1="15" y1="133" x2="99" y2="133" class="geom-line geom-overlay" />
    <path id="hl-ang-BAC" data-ref="&lt; B A C )" d="M 57.00 35.00 L 47.55 57.06 A 24.0 24.0 0 0 0 66.45 57.06 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ABC" data-ref="&lt; A B C )" d="M 15.00 133.00 L 23.67 112.78 A 22.0 22.0 0 0 1 37.00 133.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ACB" data-ref="&lt; A C B )" d="M 99.00 133.00 L 90.33 112.78 A 22.0 22.0 0 0 0 77.00 133.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="57" cy="35" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="15" cy="133" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="99" cy="133" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="57" y="22" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="15" y="148" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="99" y="148" text-anchor="middle" class="geom-label">C</text>
  </g>
</svg>
