<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 142" width="118" height="142" class="euclid-graphic" data-folio="0269" data-graphic="g1" data-proposition="I.6">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles ABC and DBC -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="58,24 14,117 98,117" class="geom-polygon" />
  <polygon id="el-tri-DBC" data-ref="DBC" data-type="polygon" points="46,50 14,117 98,117" class="geom-polygon" />

  <!-- Segments AB, AC, BC, CD -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="58" y1="24" x2="14" y2="117" class="geom-line" />
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="58" y1="24" x2="98" y2="117" class="geom-line" />
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="14" y1="117" x2="98" y2="117" class="geom-line" />
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="98" y1="117" x2="46" y2="50" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="58" cy="24" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="14" cy="117" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="98" cy="117" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="46" cy="50" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="58" y="14" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-D" data-ref="D" x="38" y="48" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-B" data-ref="B" x="14" y="132" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="98" y="132" text-anchor="middle" class="geom-label">C</text>
</svg>
