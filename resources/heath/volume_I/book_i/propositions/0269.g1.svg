<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 142" width="118" height="142" class="euclid-graphic" data-graphic-id="0269.g1" data-folio="0269" data-graphic="g1" data-proposition="I.6">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-aux {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-dasharray: 4,3;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve, .geom-ellipse {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-AB" data-ref="[ A B ]" data-type="line" x1="58" y1="24" x2="14" y2="117" class="geom-line geom-overlay" />
  </g>

  <!-- Constructed Graphics (Polygons, Segments, Angle Wedges) -->
  <g id="graphics">
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-type="polygon" points="58,24 14,117 98,117" class="geom-polygon" />
    <polygon id="el-tri-DBC" data-ref="&lt; D B C &gt;" data-type="polygon" points="46,50 14,117 98,117" class="geom-polygon" />
    <polygon id="el-tri-ADC" data-ref="&lt; A D C &gt;" data-type="polygon" points="58,24 46,50 98,117" class="geom-polygon" />
    <line id="el-seg-AD" data-ref="/ A D /" data-type="segment" x1="58" y1="24" x2="46" y2="50" class="geom-line" />
    <line id="el-seg-DB" data-ref="/ D B /" data-type="segment" x1="46" y1="50" x2="14" y2="117" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ A D B /" data-type="segment" x1="58" y1="24" x2="14" y2="117" class="geom-line geom-overlay" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="[ C A ]" data-type="segment" x1="58" y1="24" x2="98" y2="117" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="[ C B ]" data-type="segment" x1="14" y1="117" x2="98" y2="117" class="geom-line" />
    <line id="el-seg-DC" data-ref="/ D C /" data-type="segment" x1="46" y1="50" x2="98" y2="117" class="geom-line" />
    <path id="el-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; D B C )" data-type="wedge" d="M 14.00 117.00 L 23.41 97.11 A 22.0 22.0 0 0 1 36.00 117.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ACB" data-ref="&lt; A C B )" data-type="wedge" d="M 98.00 117.00 L 89.31 96.79 A 22.0 22.0 0 0 0 76.00 117.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-DCB" data-ref="&lt; D C B )" data-type="wedge" d="M 98.00 117.00 L 82.06 96.46 A 26.0 26.0 0 0 0 72.00 117.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BAC" data-ref="&lt; B A C )" data-type="wedge" d="M 58.00 24.00 L 49.45 42.08 A 20.0 20.0 0 0 0 65.90 42.37 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BDC" data-ref="&lt; B D C )" data-type="wedge" d="M 46.00 50.00 L 38.24 66.24 A 18.0 18.0 0 0 0 57.04 64.22 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-line-AB" data-ref="[ A B ]" x1="58" y1="24" x2="14" y2="117" class="geom-line geom-overlay" />
    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" points="58,24 14,117 98,117" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-DBC" data-ref="&lt; D B C &gt;" points="46,50 14,117 98,117" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-ADC" data-ref="&lt; A D C &gt;" points="58,24 46,50 98,117" class="geom-polygon geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" x1="58" y1="24" x2="46" y2="50" class="geom-line geom-overlay" />
    <line id="hl-seg-DB" data-ref="/ D B /" x1="46" y1="50" x2="14" y2="117" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ A D B /" x1="58" y1="24" x2="14" y2="117" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="[ C A ]" x1="58" y1="24" x2="98" y2="117" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="[ C B ]" x1="14" y1="117" x2="98" y2="117" class="geom-line geom-overlay" />
    <line id="hl-seg-DC" data-ref="/ D C /" x1="46" y1="50" x2="98" y2="117" class="geom-line geom-overlay" />
    <path id="hl-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; D B C )" d="M 14.00 117.00 L 23.41 97.11 A 22.0 22.0 0 0 1 36.00 117.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ACB" data-ref="&lt; A C B )" d="M 98.00 117.00 L 89.31 96.79 A 22.0 22.0 0 0 0 76.00 117.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-DCB" data-ref="&lt; D C B )" d="M 98.00 117.00 L 82.06 96.46 A 26.0 26.0 0 0 0 72.00 117.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-BAC" data-ref="&lt; B A C )" d="M 58.00 24.00 L 49.45 42.08 A 20.0 20.0 0 0 0 65.90 42.37 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-BDC" data-ref="&lt; B D C )" d="M 46.00 50.00 L 38.24 66.24 A 18.0 18.0 0 0 0 57.04 64.22 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="58" cy="24" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="14" cy="117" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="98" cy="117" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="46" cy="50" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="58" y="14" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-D" data-ref="D" x="38" y="48" text-anchor="end" class="geom-label">D</text>
    <text id="lbl-B" data-ref="B" x="14" y="132" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="98" y="132" text-anchor="middle" class="geom-label">C</text>
  </g>
</svg>
