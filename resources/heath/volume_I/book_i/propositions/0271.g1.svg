<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 139 178" width="139" height="178" class="euclid-graphic" data-folio="0271" data-graphic="g1" data-proposition="I.6">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-aux {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-dasharray: 4,3;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="63,23 36,100 97,100" class="geom-polygon" />
  <polygon id="el-tri-BFC" data-ref="BFC" data-type="polygon" points="36,100 26,136 97,100" class="geom-polygon" />
  <polygon id="el-tri-CGB" data-ref="CGB" data-type="polygon" points="97,100 111,136 36,100" class="geom-polygon" />
  <polygon id="el-tri-HBC" data-ref="HBC" data-type="polygon" points="55,46 36,100 97,100" class="geom-polygon" />

  <!-- Segments AB, AC, BC -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="63" y1="23" x2="36" y2="100" class="geom-line" />
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="63" y1="23" x2="97" y2="100" class="geom-line" />
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="36" y1="100" x2="97" y2="100" class="geom-line" />

  <!-- Produced rays BD and CE -->
  <line id="el-seg-BD" data-ref="BD" data-type="segment" x1="36" y1="100" x2="18" y2="160" class="geom-line" />
  <line id="el-seg-CE" data-ref="CE" data-type="segment" x1="97" y1="100" x2="122" y2="160" class="geom-line" />

  <!-- Cross lines BG and CF -->
  <line id="el-seg-BG" data-ref="BG" data-type="segment" x1="36" y1="100" x2="111" y2="136" class="geom-line" />
  <line id="el-seg-CF" data-ref="CF" data-type="segment" x1="97" y1="100" x2="26" y2="136" class="geom-line" />

  <!-- Line HC -->
  <line id="el-seg-HC" data-ref="HC" data-type="segment" x1="55" y1="46" x2="97" y2="100" class="geom-line" />

  <!-- Dashed Line FG -->
  <line id="el-seg-FG" data-ref="FG" data-type="segment" x1="26" y1="136" x2="111" y2="136" class="geom-aux" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="63" cy="23" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="36" cy="100" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="97" cy="100" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="18" cy="160" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="122" cy="160" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="26" cy="136" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="111" cy="136" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="55" cy="46" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="63" y="14" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-H" data-ref="H" x="46" y="44" text-anchor="end" class="geom-label">H</text>
  <text id="lbl-B" data-ref="B" x="26" y="103" text-anchor="end" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="106" y="103" text-anchor="start" class="geom-label">C</text>
  <text id="lbl-F" data-ref="F" x="16" y="140" text-anchor="end" class="geom-label">F</text>
  <text id="lbl-G" data-ref="G" x="120" y="140" text-anchor="start" class="geom-label">G</text>
  <text id="lbl-D" data-ref="D" x="14" y="174" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="124" y="174" text-anchor="middle" class="geom-label">E</text>
</svg>
