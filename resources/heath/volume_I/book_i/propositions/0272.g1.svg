<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 145 130" width="145" height="130" class="euclid-graphic" data-folio="0272" data-graphic="g1" data-proposition="I.6">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles ABC, DBC, ECB -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="67,24 24,117 109,117" class="geom-polygon" />
  <polygon id="el-tri-DBC" data-ref="DBC" data-type="polygon" points="43,77 24,117 109,117" class="geom-polygon" />
  <polygon id="el-tri-ECB" data-ref="ECB" data-type="polygon" points="91,77 109,117 24,117" class="geom-polygon" />

  <!-- Segments AB, AC, BC, BE, CD -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="67" y1="24" x2="24" y2="117" class="geom-line" />
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="67" y1="24" x2="109" y2="117" class="geom-line" />
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="24" y1="117" x2="109" y2="117" class="geom-line" />
  <line id="el-seg-BE" data-ref="BE" data-type="segment" x1="24" y1="117" x2="91" y2="77" class="geom-line" />
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="109" y1="117" x2="43" y2="77" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="67" cy="24" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="24" cy="117" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="109" cy="117" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="43" cy="77" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="91" cy="77" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="67" y="14" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-D" data-ref="D" x="33" y="77" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="101" y="77" text-anchor="start" class="geom-label">E</text>
  <text id="lbl-B" data-ref="B" x="20" y="128" text-anchor="end" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="113" y="128" text-anchor="start" class="geom-label">C</text>
</svg>
