<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 130" width="160" height="130" class="euclid-graphic" data-graphic-id="0272.g2" data-folio="0272" data-graphic="g2" data-proposition="I.7">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-aux {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-dasharray: 4,3;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve, .geom-ellipse {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Polygons, Segments, Angle Wedges) -->
  <g id="graphics">
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-type="polygon" points="13,112 134,112 100,26" class="geom-polygon" />
    <polygon id="el-tri-ABD" data-ref="&lt; A B D &gt;" data-type="polygon" points="13,112 134,112 126,38" class="geom-polygon" />
    <polygon id="el-tri-ACD" data-ref="&lt; A C D &gt;" data-type="polygon" points="13,112 100,26 126,38" class="geom-polygon" />
    <polygon id="el-tri-BCD" data-ref="&lt; B C D &gt;" data-type="polygon" points="134,112 100,26 126,38" class="geom-polygon" />
    <line id="el-seg-AB" data-ref="/ A B /" data-type="segment" x1="13" y1="112" x2="134" y2="112" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-type="segment" x1="13" y1="112" x2="100" y2="26" class="geom-line" />
    <line id="el-seg-CB" data-ref="/ C B /" data-type="segment" x1="100" y1="26" x2="134" y2="112" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-type="segment" x1="13" y1="112" x2="126" y2="38" class="geom-line" />
    <line id="el-seg-DB" data-ref="/ D B /" data-type="segment" x1="126" y1="38" x2="134" y2="112" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-type="segment" x1="100" y1="26" x2="126" y2="38" class="geom-line" />
    <path id="el-ang-ACD" data-ref="&lt; A C D )" data-type="wedge" d="M 100.00 26.00 L 85.78 40.06 A 20.0 20.0 0 0 0 118.16 34.38 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ADC" data-ref="&lt; A D C )" data-type="wedge" d="M 126.00 38.00 L 110.94 47.86 A 18.0 18.0 0 0 1 109.66 30.46 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-DCB" data-ref="&lt; D C B )" data-type="wedge" d="M 100.00 26.00 L 116.34 33.54 A 18.0 18.0 0 0 1 106.62 42.74 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-CDB" data-ref="&lt; C D B )" data-type="wedge" d="M 126.00 38.00 L 106.02 28.78 A 22.0 22.0 0 0 0 128.36 59.87 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ACB" data-ref="&lt; A C B )" data-type="wedge" d="M 100.00 26.00 L 82.93 42.87 A 24.0 24.0 0 0 0 108.82 48.32 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" points="13,112 134,112 100,26" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-ABD" data-ref="&lt; A B D &gt;" points="13,112 134,112 126,38" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-ACD" data-ref="&lt; A C D &gt;" points="13,112 100,26 126,38" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-BCD" data-ref="&lt; B C D &gt;" points="134,112 100,26 126,38" class="geom-polygon geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" x1="13" y1="112" x2="134" y2="112" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" x1="13" y1="112" x2="100" y2="26" class="geom-line geom-overlay" />
    <line id="hl-seg-CB" data-ref="/ C B /" x1="100" y1="26" x2="134" y2="112" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" x1="13" y1="112" x2="126" y2="38" class="geom-line geom-overlay" />
    <line id="hl-seg-DB" data-ref="/ D B /" x1="126" y1="38" x2="134" y2="112" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" x1="100" y1="26" x2="126" y2="38" class="geom-line geom-overlay" />
    <path id="hl-ang-ACD" data-ref="&lt; A C D )" d="M 100.00 26.00 L 85.78 40.06 A 20.0 20.0 0 0 0 118.16 34.38 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ADC" data-ref="&lt; A D C )" d="M 126.00 38.00 L 110.94 47.86 A 18.0 18.0 0 0 1 109.66 30.46 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-DCB" data-ref="&lt; D C B )" d="M 100.00 26.00 L 116.34 33.54 A 18.0 18.0 0 0 1 106.62 42.74 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-CDB" data-ref="&lt; C D B )" d="M 126.00 38.00 L 106.02 28.78 A 22.0 22.0 0 0 0 128.36 59.87 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ACB" data-ref="&lt; A C B )" d="M 100.00 26.00 L 82.93 42.87 A 24.0 24.0 0 0 0 108.82 48.32 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="13" cy="112" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="134" cy="112" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="100" cy="26" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="126" cy="38" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="8" y="126" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="134" y="126" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="100" y="16" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="134" y="28" text-anchor="start" class="geom-label">D</text>
  </g>
</svg>
