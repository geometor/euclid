<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 130" width="160" height="130" class="euclid-graphic" data-folio="0272" data-graphic="g2" data-proposition="I.7">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles ABC, ABD, ACD, BCD -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="13,112 100,26 134,112" class="geom-polygon" />
  <polygon id="el-tri-ABD" data-ref="ABD" data-type="polygon" points="13,112 126,38 134,112" class="geom-polygon" />
  <polygon id="el-tri-ACD" data-ref="ACD" data-type="polygon" points="13,112 100,26 126,38" class="geom-polygon" />
  <polygon id="el-tri-BCD" data-ref="BCD" data-type="polygon" points="100,26 126,38 134,112" class="geom-polygon" />

  <!-- Segments AB, AC, CB, AD, DB, CD -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="13" y1="112" x2="134" y2="112" class="geom-line" />
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="13" y1="112" x2="100" y2="26" class="geom-line" />
  <line id="el-seg-CB" data-ref="CB" data-type="segment" x1="100" y1="26" x2="134" y2="112" class="geom-line" />
  <line id="el-seg-AD" data-ref="AD" data-type="segment" x1="13" y1="112" x2="126" y2="38" class="geom-line" />
  <line id="el-seg-DB" data-ref="DB" data-type="segment" x1="126" y1="38" x2="134" y2="112" class="geom-line" />
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="100" y1="26" x2="126" y2="38" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="13" cy="112" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="134" cy="112" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="100" cy="26" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="126" cy="38" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="8" y="126" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="134" y="126" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="100" y="16" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="134" y="28" text-anchor="start" class="geom-label">D</text>
</svg>
