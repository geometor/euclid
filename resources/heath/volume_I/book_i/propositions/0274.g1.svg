<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 145 173" width="145" height="173" class="euclid-graphic" data-folio="0274" data-graphic="g1" data-proposition="I.7">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles ABC, ABD, BCD, ACD -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="18,149 39,58 126,149" class="geom-polygon" />
  <polygon id="el-tri-ABD" data-ref="ABD" data-type="polygon" points="18,149 58,98 126,149" class="geom-polygon" />
  <polygon id="el-tri-BCD" data-ref="BCD" data-type="polygon" points="126,149 39,58 58,98" class="geom-polygon" />
  <polygon id="el-tri-ACD" data-ref="ACD" data-type="polygon" points="18,149 39,58 58,98" class="geom-polygon" />

  <!-- Produced rays AE and AF -->
  <line id="el-seg-AE" data-ref="AE" data-type="segment" x1="18" y1="149" x2="48" y2="17" class="geom-line" />
  <line id="el-seg-AF" data-ref="AF" data-type="segment" x1="18" y1="149" x2="92" y2="53" class="geom-line" />

  <!-- Base and other lines -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="18" y1="149" x2="126" y2="149" class="geom-line" />
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="126" y1="149" x2="39" y2="58" class="geom-line" />
  <line id="el-seg-BD" data-ref="BD" data-type="segment" x1="126" y1="149" x2="58" y2="98" class="geom-line" />
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="39" y1="58" x2="58" y2="98" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="18" cy="149" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="126" cy="149" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="39" cy="58" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="58" cy="98" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-E" data-ref="E" x="42" y="14" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-F" data-ref="F" x="92" y="44" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-C" data-ref="C" x="28" y="58" text-anchor="end" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="54" y="112" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-A" data-ref="A" x="14" y="163" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="126" y="163" text-anchor="middle" class="geom-label">B</text>
</svg>
