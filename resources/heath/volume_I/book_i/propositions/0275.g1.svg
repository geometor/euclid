<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 282 150" width="282" height="150" class="euclid-graphic" data-folio="0275" data-graphic="g1" data-proposition="I.8">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles ABC, DEF, GEF -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="45,36 19,130 96,104" class="geom-polygon" />
  <polygon id="el-tri-DEF" data-ref="DEF" data-type="polygon" points="194,34 170,130 247,104" class="geom-polygon" />
  <polygon id="el-tri-GEF" data-ref="GEF" data-type="polygon" points="223,36 170,130 247,104" class="geom-polygon" />

  <!-- Segments for Triangle ABC -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="45" y1="36" x2="19" y2="130" class="geom-line" />
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="45" y1="36" x2="96" y2="104" class="geom-line" />
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="19" y1="130" x2="96" y2="104" class="geom-line" />

  <!-- Segments for Triangle DEF and GEF -->
  <line id="el-seg-DE" data-ref="DE" data-type="segment" x1="194" y1="34" x2="170" y2="130" class="geom-line" />
  <line id="el-seg-DF" data-ref="DF" data-type="segment" x1="194" y1="34" x2="247" y2="104" class="geom-line" />
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="170" y1="130" x2="247" y2="104" class="geom-line" />
  <line id="el-seg-GE" data-ref="GE" data-type="segment" x1="223" y1="36" x2="170" y2="130" class="geom-line" />
  <line id="el-seg-GF" data-ref="GF" data-type="segment" x1="223" y1="36" x2="247" y2="104" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="45" cy="36" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="19" cy="130" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="96" cy="104" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="194" cy="34" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="170" cy="130" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="247" cy="104" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="223" cy="36" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="45" y="24" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="12" y="142" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="104" y="114" text-anchor="start" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="194" y="22" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-G" data-ref="G" x="227" y="24" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-E" data-ref="E" x="163" y="142" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-F" data-ref="F" x="255" y="114" text-anchor="start" class="geom-label">F</text>
</svg>
