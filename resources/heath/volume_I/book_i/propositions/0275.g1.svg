<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 282 150" width="282" height="150" class="euclid-graphic" data-graphic-id="0275.g1" data-folio="0275" data-graphic="g1" data-proposition="I.8">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-aux {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-dasharray: 4,3;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve, .geom-ellipse {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Polygons, Segments, Angle Wedges) -->
  <g id="graphics">
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-type="polygon" points="45,36 19,130 96,104" class="geom-polygon" />
    <polygon id="el-tri-DEF" data-ref="&lt; D E F &gt;" data-type="polygon" points="194,34 170,130 247,104" class="geom-polygon" />
    <polygon id="el-tri-GEF" data-ref="&lt; G E F &gt;" data-type="polygon" points="223,36 170,130 247,104" class="geom-polygon" />
    <line id="el-seg-AB" data-ref="/ A B /" data-type="segment" x1="45" y1="36" x2="19" y2="130" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-type="segment" x1="45" y1="36" x2="96" y2="104" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-type="segment" x1="19" y1="130" x2="96" y2="104" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-type="segment" x1="194" y1="34" x2="170" y2="130" class="geom-line" />
    <line id="el-seg-DF" data-ref="/ D F /" data-type="segment" x1="194" y1="34" x2="247" y2="104" class="geom-line" />
    <line id="el-seg-EF" data-ref="/ E F /" data-type="segment" x1="170" y1="130" x2="247" y2="104" class="geom-line" />
    <line id="el-seg-EG" data-ref="/ E G /" data-type="segment" x1="170" y1="130" x2="223" y2="36" class="geom-line" />
    <line id="el-seg-GF" data-ref="/ G F /" data-type="segment" x1="223" y1="36" x2="247" y2="104" class="geom-line" />
    <path id="el-ang-BAC" data-ref="&lt; B A C )" data-type="wedge" d="M 45.00 36.00 L 39.14 57.20 A 22.0 22.0 0 0 0 58.20 53.60 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-EDF" data-ref="&lt; E D F )" data-type="wedge" d="M 194.00 34.00 L 188.66 55.34 A 22.0 22.0 0 0 0 207.28 51.54 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-EGF" data-ref="&lt; E G F )" data-type="wedge" d="M 223.00 36.00 L 212.19 55.16 A 22.0 22.0 0 0 0 230.32 56.75 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" points="45,36 19,130 96,104" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-DEF" data-ref="&lt; D E F &gt;" points="194,34 170,130 247,104" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-GEF" data-ref="&lt; G E F &gt;" points="223,36 170,130 247,104" class="geom-polygon geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" x1="45" y1="36" x2="19" y2="130" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" x1="45" y1="36" x2="96" y2="104" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" x1="19" y1="130" x2="96" y2="104" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" x1="194" y1="34" x2="170" y2="130" class="geom-line geom-overlay" />
    <line id="hl-seg-DF" data-ref="/ D F /" x1="194" y1="34" x2="247" y2="104" class="geom-line geom-overlay" />
    <line id="hl-seg-EF" data-ref="/ E F /" x1="170" y1="130" x2="247" y2="104" class="geom-line geom-overlay" />
    <line id="hl-seg-EG" data-ref="/ E G /" x1="170" y1="130" x2="223" y2="36" class="geom-line geom-overlay" />
    <line id="hl-seg-GF" data-ref="/ G F /" x1="223" y1="36" x2="247" y2="104" class="geom-line geom-overlay" />
    <path id="hl-ang-BAC" data-ref="&lt; B A C )" d="M 45.00 36.00 L 39.14 57.20 A 22.0 22.0 0 0 0 58.20 53.60 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-EDF" data-ref="&lt; E D F )" d="M 194.00 34.00 L 188.66 55.34 A 22.0 22.0 0 0 0 207.28 51.54 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-EGF" data-ref="&lt; E G F )" d="M 223.00 36.00 L 212.19 55.16 A 22.0 22.0 0 0 0 230.32 56.75 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="45" cy="36" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="19" cy="130" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="96" cy="104" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="194" cy="34" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="170" cy="130" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="247" cy="104" r="3.5" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="223" cy="36" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="45" y="24" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="12" y="142" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="104" y="114" text-anchor="start" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="194" y="22" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-G" data-ref="G" x="227" y="24" text-anchor="middle" class="geom-label">G</text>
    <text id="lbl-E" data-ref="E" x="163" y="142" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="255" y="114" text-anchor="start" class="geom-label">F</text>
  </g>
</svg>
