    <polygon id="el-tri-AFB" data-ref="&lt; A F B &gt;" data-type="polygon" points="28,69 152,73 182,69" class="geom-polygon" />
    <polygon id="el-tri-ADB" data-ref="&lt; A D B &gt;" data-type="polygon" points="28,69 138,107 182,69" class="geom-polygon" />
    <line id="el-seg-AE" data-ref="/ A E /" data-type="segment" x1="28" y1="69" x2="138" y2="69" class="geom-line" />
    <line id="el-seg-EB" data-ref="/ E B /" data-type="segment" x1="138" y1="69" x2="182" y2="69" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ A E B /" data-type="segment" x1="28" y1="69" x2="182" y2="69" class="geom-line geom-overlay" />
    <line id="el-seg-AC" data-ref="/ A C /" data-type="segment" x1="28" y1="69" x2="138" y2="25" class="geom-line" />
