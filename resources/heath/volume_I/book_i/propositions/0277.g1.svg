    <line id="hl-seg-DE" data-ref="/ D E /" x1="138" y1="107" x2="138" y2="69" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ C E D /" x1="138" y1="25" x2="138" y2="107" class="geom-line geom-overlay" />
    <line id="hl-seg-AF" data-ref="/ A F /" x1="28" y1="69" x2="152" y2="73" class="geom-line geom-overlay" />
    <line id="hl-seg-FB" data-ref="/ F B /" x1="152" y1="73" x2="182" y2="69" class="geom-line geom-overlay" />
    <line id="hl-seg-FE" data-ref="/ F E /" x1="152" y1="73" x2="138" y2="69" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
