    <line id="hl-seg-EB" data-ref="/ E B /" x1="138" y1="69" x2="182" y2="69" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ A E B /" x1="28" y1="69" x2="182" y2="69" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" x1="28" y1="69" x2="138" y2="25" class="geom-line geom-overlay" />
    <line id="hl-seg-CB" data-ref="/ C B /" x1="138" y1="25" x2="182" y2="69" class="geom-line geom-overlay" />
