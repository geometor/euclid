    <line id="el-seg-AD" data-ref="/ A D /" data-type="segment" x1="28" y1="69" x2="138" y2="107" class="geom-line" />
    <line id="el-seg-DB" data-ref="/ D B /" data-type="segment" x1="138" y1="107" x2="182" y2="69" class="geom-line" />
    <line id="el-seg-CE" data-ref="/ C E /" data-type="segment" x1="138" y1="25" x2="138" y2="69" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-type="segment" x1="138" y1="107" x2="138" y2="69" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ C E D /" data-type="segment" x1="138" y1="25" x2="138" y2="107" class="geom-line geom-overlay" />
    <line id="el-seg-AF" data-ref="/ A F /" data-type="segment" x1="28" y1="69" x2="152" y2="73" class="geom-line" />
    <line id="el-seg-FB" data-ref="/ F B /" data-type="segment" x1="152" y1="73" x2="182" y2="69" class="geom-line" />
    <line id="el-seg-FE" data-ref="/ F E /" data-type="segment" x1="152" y1="73" x2="138" y2="69" class="geom-line" />
  </g>

