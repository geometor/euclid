<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 116" width="210" height="116" class="euclid-graphic" data-folio="0277" data-graphic="g1" data-proposition="I.8">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-ellipse {
      stroke: #000000;
      stroke-width: 2.2;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Circle in perspective (vertical ellipse) -->
  <ellipse id="el-circ-base" data-ref="base-circle" cx="138" cy="69" rx="14" ry="42" class="geom-ellipse" />

  <!-- Axis AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="28" y1="69" x2="182" y2="69" class="geom-line" />

  <!-- Lines to C (top) -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="28" y1="69" x2="138" y2="25" class="geom-line" />
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="182" y1="69" x2="138" y2="25" class="geom-line" />

  <!-- Lines to D (bottom) -->
  <line id="el-seg-AD" data-ref="AD" data-type="segment" x1="28" y1="69" x2="138" y2="107" class="geom-line" />
  <line id="el-seg-BD" data-ref="BD" data-type="segment" x1="182" y1="69" x2="138" y2="107" class="geom-line" />

  <!-- Vertical line CD through center E -->
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="138" y1="25" x2="138" y2="107" class="geom-line" />

  <!-- Lines to point F on ellipse -->
  <line id="el-seg-AF" data-ref="AF" data-type="segment" x1="28" y1="69" x2="152" y2="73" class="geom-line" />
  <line id="el-seg-BF" data-ref="BF" data-type="segment" x1="182" y1="69" x2="152" y2="73" class="geom-line" />
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="138" y1="69" x2="152" y2="73" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="28" cy="69" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="182" cy="69" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="138" cy="25" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="138" cy="107" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="138" cy="69" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="152" cy="73" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="22" y="82" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="190" y="73" text-anchor="start" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="130" y="21" text-anchor="end" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="130" y="115" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="144" y="65" text-anchor="start" class="geom-label">E</text>
  <text id="lbl-F" data-ref="F" x="157" y="78" text-anchor="start" class="geom-label">F</text>
</svg>
