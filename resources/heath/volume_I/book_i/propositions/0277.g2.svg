    <line id="el-seg-DE" data-ref="/ D E /" data-type="segment" x1="210" y1="30" x2="124" y2="92" class="geom-line" />
    <line id="el-seg-EG" data-ref="/ E G /" data-type="segment" x1="124" y1="92" x2="210" y2="154" class="geom-line" />
    <line id="el-seg-DF" data-ref="/ D F /" data-type="segment" x1="210" y1="30" x2="210" y2="92" class="geom-line" />
