    <line id="hl-seg-BC" data-ref="/ B C /" x1="20" y1="92" x2="104" y2="92" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" x1="104" y1="30" x2="104" y2="92" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" x1="104" y1="30" x2="20" y2="92" class="geom-line geom-overlay" />
    <line id="hl-seg-EF" data-ref="/ E F /" x1="124" y1="92" x2="210" y2="92" class="geom-line geom-overlay" />
