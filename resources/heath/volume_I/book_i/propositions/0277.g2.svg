    <line id="el-seg-DG" data-ref="/ D G /" data-aliases="/ D F G /" data-type="segment" x1="210" y1="30" x2="210" y2="154" class="geom-line geom-overlay" />
    <path id="el-ang-BAC" data-ref="&lt; B A C )" data-type="wedge" d="M 104.00 30.00 L 86.30 43.06 A 22.0 22.0 0 0 0 104.00 52.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-EDF" data-ref="&lt; E D F )" data-aliases="&lt; E D G )" data-type="wedge" d="M 210.00 30.00 L 192.15 42.87 A 22.0 22.0 0 0 0 210.00 52.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-EGF" data-ref="&lt; E G F )" data-aliases="&lt; E G D )" data-type="wedge" d="M 210.00 154.00 L 192.15 141.13 A 22.0 22.0 0 0 1 210.00 132.00 Z" class="wedge angle geom-overlay" />
  </g>

