    <path id="hl-ang-EDF" data-ref="&lt; E D F )" data-aliases="&lt; E D G )" d="M 210.00 30.00 L 192.15 42.87 A 22.0 22.0 0 0 0 210.00 52.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-EGF" data-ref="&lt; E G F )" data-aliases="&lt; E G D )" d="M 210.00 154.00 L 192.15 141.13 A 22.0 22.0 0 0 1 210.00 132.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
