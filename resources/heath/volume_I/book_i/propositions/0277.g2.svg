<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" width="260" height="160" class="euclid-graphic" data-folio="0277" data-graphic="g2" data-proposition="I.8">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles ABC, DEF, GEF -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="20,92 104,92 104,30" class="geom-polygon" />
  <polygon id="el-tri-DEF" data-ref="DEF" data-type="polygon" points="124,92 210,92 210,30" class="geom-polygon" />
  <polygon id="el-tri-GEF" data-ref="GEF" data-type="polygon" points="124,92 210,92 210,154" class="geom-polygon" />

  <!-- Segments for Triangle ABC -->
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="20" y1="92" x2="104" y2="92" class="geom-line" />
  <line id="el-seg-CA" data-ref="CA" data-type="segment" x1="104" y1="92" x2="104" y2="30" class="geom-line" />
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="20" y1="92" x2="104" y2="30" class="geom-line" />

  <!-- Segments for Figures DEF and GEF -->
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="124" y1="92" x2="210" y2="92" class="geom-line" />
  <line id="el-seg-ED" data-ref="ED" data-type="segment" x1="124" y1="92" x2="210" y2="30" class="geom-line" />
  <line id="el-seg-EG" data-ref="EG" data-type="segment" x1="124" y1="92" x2="210" y2="154" class="geom-line" />
  <line id="el-seg-DG" data-ref="DG" data-type="segment" x1="210" y1="30" x2="210" y2="154" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="104" cy="30" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="20" cy="92" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="104" cy="92" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="210" cy="30" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="124" cy="92" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="210" cy="92" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="210" cy="154" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="104" y="20" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="14" y="104" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="104" y="104" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="210" y="20" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="116" y="96" text-anchor="end" class="geom-label">E</text>
  <text id="lbl-F" data-ref="F" x="218" y="96" text-anchor="start" class="geom-label">F</text>
  <text id="lbl-G" data-ref="G" x="210" y="168" text-anchor="middle" class="geom-label">G</text>
</svg>
