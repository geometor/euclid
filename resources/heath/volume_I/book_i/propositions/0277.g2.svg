    <line id="hl-seg-FG" data-ref="/ F G /" x1="210" y1="92" x2="210" y2="154" class="geom-line geom-overlay" />
    <line id="hl-seg-DG" data-ref="/ D G /" data-aliases="/ D F G /" x1="210" y1="30" x2="210" y2="154" class="geom-line geom-overlay" />
