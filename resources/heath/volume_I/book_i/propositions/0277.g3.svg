<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 155" width="270" height="155" class="euclid-graphic" data-folio="0277" data-graphic="g3" data-proposition="I.8">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles ABC, DEF, GEF -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="84,28 18,86 106,86" class="geom-polygon" />
  <polygon id="el-tri-DEF" data-ref="DEF" data-type="polygon" points="226,28 150,86 248,86" class="geom-polygon" />
  <polygon id="el-tri-GEF" data-ref="GEF" data-type="polygon" points="226,144 150,86 248,86" class="geom-polygon" />

  <!-- Segments for Triangle ABC -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="84" y1="28" x2="18" y2="86" class="geom-line" />
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="84" y1="28" x2="106" y2="86" class="geom-line" />
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="18" y1="86" x2="106" y2="86" class="geom-line" />

  <!-- Segments for Figures DEF and GEF -->
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="150" y1="86" x2="248" y2="86" class="geom-line" />
  <line id="el-seg-ED" data-ref="ED" data-type="segment" x1="150" y1="86" x2="226" y2="28" class="geom-line" />
  <line id="el-seg-EG" data-ref="EG" data-type="segment" x1="150" y1="86" x2="226" y2="144" class="geom-line" />
  <line id="el-seg-DF" data-ref="DF" data-type="segment" x1="226" y1="28" x2="248" y2="86" class="geom-line" />
  <line id="el-seg-FG" data-ref="FG" data-type="segment" x1="248" y1="86" x2="226" y2="144" class="geom-line" />
  <line id="el-seg-DG" data-ref="DG" data-type="segment" x1="226" y1="28" x2="226" y2="144" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="84" cy="28" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="18" cy="86" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="106" cy="86" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="226" cy="28" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="150" cy="86" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="248" cy="86" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="226" cy="144" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="84" y="18" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="12" y="98" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="106" y="98" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="226" y="18" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="140" y="90" text-anchor="end" class="geom-label">E</text>
  <text id="lbl-F" data-ref="F" x="256" y="90" text-anchor="start" class="geom-label">F</text>
  <text id="lbl-G" data-ref="G" x="226" y="156" text-anchor="middle" class="geom-label">G</text>
</svg>
