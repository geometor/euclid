  <g id="highlights" style="pointer-events: none;">
    <line id="hl-line-AB" data-ref="[ A B ]" x1="52" y1="12" x2="19" y2="114" class="geom-line geom-overlay" />
    <line id="hl-line-AC" data-ref="[ A C ]" x1="52" y1="12" x2="85" y2="114" class="geom-line geom-overlay" />
    <polygon id="hl-tri-ADE" data-ref="&lt; A D E &gt;" points="52,12 33,72 71,72" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-DEF" data-ref="&lt; D E F &gt;" points="33,72 71,72 52,105" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-ADF" data-ref="&lt; A D F &gt;" points="52,12 33,72 52,105" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-AEF" data-ref="&lt; A E F &gt;" points="52,12 71,72 52,105" class="geom-polygon geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" x1="52" y1="12" x2="33" y2="72" class="geom-line geom-overlay" />
    <line id="hl-seg-DB" data-ref="/ D B /" x1="33" y1="72" x2="19" y2="114" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ A D B /" x1="52" y1="12" x2="19" y2="114" class="geom-line geom-overlay" />
    <line id="hl-seg-AE" data-ref="/ A E /" x1="52" y1="12" x2="71" y2="72" class="geom-line geom-overlay" />
    <line id="hl-seg-EC" data-ref="/ E C /" x1="71" y1="72" x2="85" y2="114" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ A E C /" x1="52" y1="12" x2="85" y2="114" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" x1="33" y1="72" x2="71" y2="72" class="geom-line geom-overlay" />
    <line id="hl-seg-DF" data-ref="/ D F /" x1="33" y1="72" x2="52" y2="105" class="geom-line geom-overlay" />
    <line id="hl-seg-EF" data-ref="/ E F /" x1="71" y1="72" x2="52" y2="105" class="geom-line geom-overlay" />
    <line id="hl-seg-AF" data-ref="/ A F /" x1="52" y1="12" x2="52" y2="105" class="geom-line geom-overlay" />
    <path id="hl-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; D A E )" d="M 52.00 12.00 L 44.61 34.83 A 24.0 24.0 0 0 0 59.39 34.83 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-DAF" data-ref="&lt; D A F )" data-aliases="&lt; B A F )" d="M 52.00 12.00 L 43.55 38.69 A 28.0 28.0 0 0 0 52.00 40.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-EAF" data-ref="&lt; E A F )" data-aliases="&lt; C A F )" d="M 52.00 12.00 L 60.45 38.69 A 28.0 28.0 0 0 1 52.00 40.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="52" cy="12" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="33" cy="72" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="71" cy="72" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="52" cy="105" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="52" y="10" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-D" data-ref="D" x="24" y="74" text-anchor="end" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="80" y="74" text-anchor="start" class="geom-label">E</text>
