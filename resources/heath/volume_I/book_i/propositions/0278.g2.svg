<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 140" width="135" height="140" class="euclid-graphic" data-graphic-id="0278.g2" data-folio="0278" data-graphic="g2" data-proposition="I.9">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-aux {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-dasharray: 4,3;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve, .geom-ellipse {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-AB" data-ref="[ A B ]" data-type="line" x1="52" y1="12" x2="19" y2="114" class="geom-line geom-overlay" />
    <line id="el-line-AC" data-ref="[ A C ]" data-type="line" x1="52" y1="12" x2="85" y2="114" class="geom-line geom-overlay" />
  </g>

  <!-- Constructed Graphics (Polygons, Segments, Angle Wedges) -->
  <g id="graphics">
    <polygon id="el-tri-ADE" data-ref="&lt; A D E &gt;" data-type="polygon" points="52,12 33,72 71,72" class="geom-polygon" />
    <polygon id="el-tri-DEF" data-ref="&lt; D E F &gt;" data-type="polygon" points="33,72 71,72 52,105" class="geom-polygon" />
    <polygon id="el-tri-ADF" data-ref="&lt; A D F &gt;" data-type="polygon" points="52,12 33,72 52,105" class="geom-polygon" />
    <polygon id="el-tri-AEF" data-ref="&lt; A E F &gt;" data-type="polygon" points="52,12 71,72 52,105" class="geom-polygon" />
    <line id="el-seg-AD" data-ref="/ A D /" data-type="segment" x1="52" y1="12" x2="33" y2="72" class="geom-line" />
    <line id="el-seg-DB" data-ref="/ D B /" data-type="segment" x1="33" y1="72" x2="19" y2="114" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ A D B /" data-type="segment" x1="52" y1="12" x2="19" y2="114" class="geom-line geom-overlay" />
    <line id="el-seg-AE" data-ref="/ A E /" data-type="segment" x1="52" y1="12" x2="71" y2="72" class="geom-line" />
    <line id="el-seg-EC" data-ref="/ E C /" data-type="segment" x1="71" y1="72" x2="85" y2="114" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ A E C /" data-type="segment" x1="52" y1="12" x2="85" y2="114" class="geom-line geom-overlay" />
    <line id="el-seg-DE" data-ref="/ D E /" data-type="segment" x1="33" y1="72" x2="71" y2="72" class="geom-line" />
    <line id="el-seg-DF" data-ref="/ D F /" data-type="segment" x1="33" y1="72" x2="52" y2="105" class="geom-line" />
    <line id="el-seg-EF" data-ref="/ E F /" data-type="segment" x1="71" y1="72" x2="52" y2="105" class="geom-line" />
    <line id="el-seg-AF" data-ref="/ A F /" data-type="segment" x1="52" y1="12" x2="52" y2="105" class="geom-line" />
    <path id="el-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; D A E )" data-type="wedge" d="M 52.00 12.00 L 44.61 34.83 A 24.0 24.0 0 0 0 59.39 34.83 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-DAF" data-ref="&lt; D A F )" data-aliases="&lt; B A F )" data-type="wedge" d="M 52.00 12.00 L 43.55 38.69 A 28.0 28.0 0 0 0 52.00 40.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-EAF" data-ref="&lt; E A F )" data-aliases="&lt; C A F )" data-type="wedge" d="M 52.00 12.00 L 60.45 38.69 A 28.0 28.0 0 0 1 52.00 40.00 Z" class="wedge angle geom-overlay" />
  </g>

