<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 140" width="135" height="140" class="euclid-graphic" data-folio="0278" data-graphic="g2" data-proposition="I.9">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles ADE, DEF, ADF, AEF -->
  <polygon id="el-tri-ADE" data-ref="ADE" data-type="polygon" points="52,12 33,72 71,72" class="geom-polygon" />
  <polygon id="el-tri-DEF" data-ref="DEF" data-type="polygon" points="33,72 71,72 52,105" class="geom-polygon" />
  <polygon id="el-tri-ADF" data-ref="ADF" data-type="polygon" points="52,12 33,72 52,105" class="geom-polygon" />
  <polygon id="el-tri-AEF" data-ref="AEF" data-type="polygon" points="52,12 71,72 52,105" class="geom-polygon" />

  <!-- Rays AB and AC -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="52" y1="12" x2="19" y2="114" class="geom-line" />
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="52" y1="12" x2="85" y2="114" class="geom-line" />

  <!-- Base DE of equilateral triangle -->
  <line id="el-seg-DE" data-ref="DE" data-type="segment" x1="33" y1="72" x2="71" y2="72" class="geom-line" />

  <!-- Equilateral sides DF and EF -->
  <line id="el-seg-DF" data-ref="DF" data-type="segment" x1="33" y1="72" x2="52" y2="105" class="geom-line" />
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="71" y1="72" x2="52" y2="105" class="geom-line" />

  <!-- Bisector line AF -->
  <line id="el-seg-AF" data-ref="AF" data-type="segment" x1="52" y1="12" x2="52" y2="105" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="52" cy="12" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="33" cy="72" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="71" cy="72" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="52" cy="105" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="52" y="8" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-D" data-ref="D" x="24" y="74" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="80" y="74" text-anchor="start" class="geom-label">E</text>
  <text id="lbl-B" data-ref="B" x="13" y="126" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="91" y="126" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-F" data-ref="F" x="52" y="122" text-anchor="middle" class="geom-label">F</text>
</svg>
