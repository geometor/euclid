<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 205 180" width="205" height="180" class="euclid-graphic" data-folio="0279" data-graphic="g1" data-proposition="I.9">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles AFG, FGH, DEH, ADE -->
  <polygon id="el-tri-AFG" data-ref="AFG" data-type="polygon" points="82,20 53,67 111,67" class="geom-polygon" />
  <polygon id="el-tri-FGH" data-ref="FGH" data-type="polygon" points="53,67 111,67 82,85" class="geom-polygon" />
  <polygon id="el-tri-DEH" data-ref="DEH" data-type="polygon" points="24,128 140,128 82,85" class="geom-polygon" />
  <polygon id="el-tri-ADE" data-ref="ADE" data-type="polygon" points="82,20 24,128 140,128" class="geom-polygon" />

  <!-- Rays AB and AC -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="82" y1="20" x2="4" y2="164" class="geom-line" />
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="82" y1="20" x2="160" y2="164" class="geom-line" />

  <!-- Horizontal segments FG and DE -->
  <line id="el-seg-FG" data-ref="FG" data-type="segment" x1="53" y1="67" x2="111" y2="67" class="geom-line" />
  <line id="el-seg-DE" data-ref="DE" data-type="segment" x1="24" y1="128" x2="140" y2="128" class="geom-line" />

  <!-- Bisector line AH -->
  <line id="el-seg-AH" data-ref="AH" data-type="segment" x1="82" y1="20" x2="82" y2="128" class="geom-line" />

  <!-- Lines from H -->
  <line id="el-seg-FH" data-ref="FH" data-type="segment" x1="53" y1="67" x2="82" y2="85" class="geom-line" />
  <line id="el-seg-GH" data-ref="GH" data-type="segment" x1="111" y1="67" x2="82" y2="85" class="geom-line" />
  <line id="el-seg-DH" data-ref="DH" data-type="segment" x1="24" y1="128" x2="82" y2="85" class="geom-line" />
  <line id="el-seg-EH" data-ref="EH" data-type="segment" x1="140" y1="128" x2="82" y2="85" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="82" cy="20" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="53" cy="67" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="111" cy="67" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="82" cy="85" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="24" cy="128" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="140" cy="128" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="82" y="10" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-F" data-ref="F" x="43" y="68" text-anchor="end" class="geom-label">F</text>
  <text id="lbl-G" data-ref="G" x="121" y="68" text-anchor="start" class="geom-label">G</text>
  <text id="lbl-H" data-ref="H" x="82" y="99" text-anchor="middle" class="geom-label">H</text>
  <text id="lbl-D" data-ref="D" x="14" y="128" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="150" y="128" text-anchor="start" class="geom-label">E</text>
  <text id="lbl-B" data-ref="B" x="8" y="174" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="156" y="174" text-anchor="middle" class="geom-label">C</text>
</svg>
