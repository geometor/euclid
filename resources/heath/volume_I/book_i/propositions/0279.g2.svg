<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 175" width="430" height="175" class="euclid-graphic" data-folio="0279" data-graphic="g2" data-proposition="I.9">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- LEFT FIGURE -->
  <!-- Polygons -->
  <polygon id="el-tri-L-ADE" data-ref="L-ADE" data-type="polygon" points="91,28 56,80 126,80" class="geom-polygon" />
  <polygon id="el-tri-L-DEF" data-ref="L-DEF" data-type="polygon" points="56,80 126,80 34,118" class="geom-polygon" />

  <!-- Rays AB and AC -->
  <line id="el-seg-L-AB" data-ref="L-AB" data-type="segment" x1="91" y1="28" x2="18" y2="146" class="geom-line" />
  <line id="el-seg-L-AC" data-ref="L-AC" data-type="segment" x1="91" y1="28" x2="155" y2="134" class="geom-line" />
  <line id="el-seg-L-DE" data-ref="L-DE" data-type="segment" x1="56" y1="80" x2="126" y2="80" class="geom-line" />
  <line id="el-seg-L-EF" data-ref="L-EF" data-type="segment" x1="126" y1="80" x2="34" y2="118" class="geom-line" />

  <!-- Points Left -->
  <circle id="el-pt-L-A" data-ref="L-A" data-type="point" cx="91" cy="28" r="3.5" class="geom-point" />
  <circle id="el-pt-L-D" data-ref="L-D" data-type="point" cx="56" cy="80" r="3.5" class="geom-point" />
  <circle id="el-pt-L-E" data-ref="L-E" data-type="point" cx="126" cy="80" r="3.5" class="geom-point" />
  <circle id="el-pt-L-F" data-ref="L-F" data-type="point" cx="34" cy="118" r="3.5" class="geom-point" />

  <!-- Labels Left -->
  <text id="lbl-L-A" data-ref="L-A" x="91" y="18" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-L-D" data-ref="L-D" x="48" y="80" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-L-E" data-ref="L-E" x="134" y="80" text-anchor="start" class="geom-label">E</text>
  <text id="lbl-L-F" data-ref="L-F" x="26" y="120" text-anchor="end" class="geom-label">F</text>
  <text id="lbl-L-B" data-ref="L-B" x="14" y="158" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-L-C" data-ref="L-C" x="155" y="146" text-anchor="middle" class="geom-label">C</text>


  <!-- RIGHT FIGURE -->
  <!-- Polygons -->
  <polygon id="el-tri-R-ADE" data-ref="R-ADE" data-type="polygon" points="261,28 226,80 296,80" class="geom-polygon" />
  <polygon id="el-tri-R-DEF" data-ref="R-DEF" data-type="polygon" points="226,80 296,80 182,118" class="geom-polygon" />

  <!-- Rays AB and AC -->
  <line id="el-seg-R-AB" data-ref="R-AB" data-type="segment" x1="261" y1="28" x2="196" y2="134" class="geom-line" />
  <line id="el-seg-R-AC" data-ref="R-AC" data-type="segment" x1="261" y1="28" x2="328" y2="134" class="geom-line" />
  <line id="el-seg-R-DE" data-ref="R-DE" data-type="segment" x1="226" y1="80" x2="296" y2="80" class="geom-line" />
  <line id="el-seg-R-DF" data-ref="R-DF" data-type="segment" x1="226" y1="80" x2="182" y2="118" class="geom-line" />
  <line id="el-seg-R-EF" data-ref="R-EF" data-type="segment" x1="296" y1="80" x2="182" y2="118" class="geom-line" />

  <!-- Points Right -->
  <circle id="el-pt-R-A" data-ref="R-A" data-type="point" cx="261" cy="28" r="3.5" class="geom-point" />
  <circle id="el-pt-R-D" data-ref="R-D" data-type="point" cx="226" cy="80" r="3.5" class="geom-point" />
  <circle id="el-pt-R-E" data-ref="R-E" data-type="point" cx="296" cy="80" r="3.5" class="geom-point" />
  <circle id="el-pt-R-F" data-ref="R-F" data-type="point" cx="182" cy="118" r="3.5" class="geom-point" />

  <!-- Labels Right -->
  <text id="lbl-R-A" data-ref="R-A" x="261" y="18" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-R-D" data-ref="R-D" x="218" y="80" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-R-E" data-ref="R-E" x="304" y="80" text-anchor="start" class="geom-label">E</text>
  <text id="lbl-R-F" data-ref="R-F" x="174" y="120" text-anchor="end" class="geom-label">F</text>
  <text id="lbl-R-B" data-ref="R-B" x="194" y="146" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-R-C" data-ref="R-C" x="330" y="146" text-anchor="middle" class="geom-label">C</text>
</svg>
