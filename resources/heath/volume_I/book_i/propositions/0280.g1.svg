<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 475 145" width="475" height="145" class="euclid-graphic" data-folio="0280" data-graphic="g1" data-proposition="I.9">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles / Polygons -->
  <polygon id="el-tri-FBA" data-ref="FBA" data-type="polygon" points="135,22 135,123 191,22" class="geom-polygon" />
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="191,22 135,123 191,123" class="geom-polygon" />
  <polygon id="el-tri-AQE" data-ref="AQE" data-type="polygon" points="191,22 304,62 414,22" class="geom-polygon" />

  <!-- Frame Lines -->
  <line id="el-seg-FE" data-ref="FE" data-type="segment" x1="135" y1="22" x2="414" y2="22" class="geom-line" />
  <line id="el-seg-FB" data-ref="FB" data-type="segment" x1="135" y1="22" x2="135" y2="123" class="geom-line" />
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="191" y1="22" x2="191" y2="123" class="geom-line" />
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="135" y1="123" x2="221" y2="123" class="geom-line" />

  <!-- Diagonals and transversals -->
  <line id="el-seg-BA" data-ref="BA" data-type="segment" x1="135" y1="123" x2="191" y2="22" class="geom-line" />
  <line id="el-seg-BE" data-ref="BE" data-type="segment" x1="135" y1="123" x2="414" y2="22" class="geom-line" />
  <line id="el-seg-AQ" data-ref="AQ" data-type="segment" x1="191" y1="22" x2="304" y2="62" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="135" cy="22" r="3.5" class="geom-point" />
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="191" cy="22" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="414" cy="22" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="135" cy="123" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="191" cy="123" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="191" cy="103" r="3.5" class="geom-point" />
  <circle id="el-pt-Q" data-ref="Q" data-type="point" cx="304" cy="62" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-F" data-ref="F" x="135" y="12" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-A" data-ref="A" x="191" y="12" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-E" data-ref="E" x="414" y="12" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-B" data-ref="B" x="127" y="137" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="191" y="137" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="200" y="103" text-anchor="start" class="geom-label">D</text>
  <text id="lbl-Q" data-ref="Q" x="312" y="74" text-anchor="start" class="geom-label">Q</text>
</svg>
