<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 190" width="225" height="190" class="euclid-graphic" data-folio="0280" data-graphic="g2" data-proposition="I.9">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-curve {
      stroke: #000000;
      stroke-width: 2.2;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Square ABCD boundary -->
  <rect id="el-rect-ABCD" data-ref="ABCD" x="33" y="17" width="145" height="147" class="geom-curve" />

  <!-- Circular Arc BD centered at A(33, 164) with radius 146 -->
  <path id="el-arc-BD" data-ref="arc-BD" d="M 33 18 A 146 146 0 0 1 178 164" class="geom-curve" />

  <!-- Quadratrix curve B-F-L-G -->
  <path id="el-curve-quadratrix" data-ref="quadratrix" d="M 33 18 C 55 24 80 36 96 52 C 112 68 118 86 122 105 C 124 122 125 145 126 164" class="geom-curve" />

  <!-- Radial rays AE and AN -->
  <line id="el-seg-AE" data-ref="AE" data-type="segment" x1="33" y1="164" x2="112" y2="38" class="geom-line" />
  <line id="el-seg-AN" data-ref="AN" data-type="segment" x1="33" y1="164" x2="154" y2="98" class="geom-line" />

  <!-- Vertical lines FH, LM -->
  <line id="el-seg-FH" data-ref="FH" data-type="segment" x1="96" y1="52" x2="96" y2="164" class="geom-line" />
  <line id="el-seg-LM" data-ref="LM" data-type="segment" x1="122" y1="105" x2="122" y2="164" class="geom-line" />

  <!-- Horizontal line KL -->
  <line id="el-seg-KL" data-ref="KL" data-type="segment" x1="96" y1="105" x2="122" y2="105" class="geom-line" />

  <!-- Transversal FL -->
  <line id="el-seg-FL" data-ref="FL" data-type="segment" x1="96" y1="52" x2="122" y2="105" class="geom-line" />

  <!-- Angle arc phi at A -->
  <path id="el-arc-phi" data-ref="angle-phi" d="M 52 164 A 19 19 0 0 0 45 146" class="geom-curve" stroke-width="1.6" />

  <!-- Points -->
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="33" cy="17" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="178" cy="17" r="3.5" class="geom-point" />
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="33" cy="164" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="178" cy="164" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="112" cy="38" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="96" cy="52" r="3.5" class="geom-point" />
  <circle id="el-pt-N" data-ref="N" data-type="point" cx="154" cy="98" r="3.5" class="geom-point" />
  <circle id="el-pt-L" data-ref="L" data-type="point" cx="122" cy="105" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="96" cy="105" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="96" cy="164" r="3.5" class="geom-point" />
  <circle id="el-pt-M" data-ref="M" data-type="point" cx="122" cy="164" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="126" cy="164" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-B" data-ref="B" x="25" y="13" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="185" y="13" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-A" data-ref="A" x="25" y="178" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-D" data-ref="D" x="185" y="178" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="112" y="28" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-F" data-ref="F" x="86" y="52" text-anchor="end" class="geom-label">F</text>
  <text id="lbl-N" data-ref="N" x="162" y="94" text-anchor="start" class="geom-label">N</text>
  <text id="lbl-L" data-ref="L" x="127" y="98" text-anchor="start" class="geom-label">L</text>
  <text id="lbl-K" data-ref="K" x="87" y="107" text-anchor="end" class="geom-label">K</text>
  <text id="lbl-H" data-ref="H" x="96" y="178" text-anchor="middle" class="geom-label">H</text>
  <text id="lbl-M" data-ref="M" x="122" y="178" text-anchor="middle" class="geom-label">M</text>
  <text id="lbl-G" data-ref="G" x="138" y="178" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-rho" data-ref="AE" x="62" y="108" text-anchor="middle" class="geom-label">&#x03C1;</text>
  <text id="lbl-phi" data-ref="angle-phi" x="48" y="156" text-anchor="middle" class="geom-label">&#x03D5;</text>
</svg>
