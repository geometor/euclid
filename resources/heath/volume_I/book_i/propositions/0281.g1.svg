<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 150" width="175" height="150" class="euclid-graphic" data-folio="0281" data-graphic="g1" data-proposition="I.10">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles ABC, ACD, BCD -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="75,23 13,129 137,129" class="geom-polygon" />
  <polygon id="el-tri-ACD" data-ref="ACD" data-type="polygon" points="75,23 13,129 75,129" class="geom-polygon" />
  <polygon id="el-tri-BCD" data-ref="BCD" data-type="polygon" points="75,23 75,129 137,129" class="geom-polygon" />

  <!-- Segments AB, AC, BC, CD -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="13" y1="129" x2="137" y2="129" class="geom-line" />
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="75" y1="23" x2="13" y2="129" class="geom-line" />
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="75" y1="23" x2="137" y2="129" class="geom-line" />
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="75" y1="23" x2="75" y2="129" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="75" cy="23" r="3.5" class="geom-point" />
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="13" cy="129" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="137" cy="129" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="75" cy="129" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-C" data-ref="C" x="75" y="12" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-A" data-ref="A" x="8" y="143" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-D" data-ref="D" x="75" y="143" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-B" data-ref="B" x="142" y="143" text-anchor="middle" class="geom-label">B</text>
</svg>
