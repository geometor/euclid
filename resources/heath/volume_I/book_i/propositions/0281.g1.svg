<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 150" width="175" height="150" class="euclid-graphic" data-graphic-id="0281.g1" data-folio="0281" data-graphic="g1" data-proposition="I.10">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-aux {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-dasharray: 4,3;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve, .geom-ellipse {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Polygons, Segments, Angle Wedges) -->
  <g id="graphics">
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-type="polygon" points="13,129 137,129 75,23" class="geom-polygon" />
    <polygon id="el-tri-ACD" data-ref="&lt; A C D &gt;" data-type="polygon" points="13,129 75,23 75,129" class="geom-polygon" />
    <polygon id="el-tri-BCD" data-ref="&lt; B C D &gt;" data-type="polygon" points="137,129 75,23 75,129" class="geom-polygon" />
    <line id="el-seg-AD" data-ref="/ A D /" data-type="segment" x1="13" y1="129" x2="75" y2="129" class="geom-line" />
    <line id="el-seg-DB" data-ref="/ B D /" data-type="segment" x1="137" y1="129" x2="75" y2="129" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ A D B /" data-type="segment" x1="13" y1="129" x2="137" y2="129" class="geom-line geom-overlay" />
    <line id="el-seg-AC" data-ref="/ A C /" data-type="segment" x1="13" y1="129" x2="75" y2="23" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-type="segment" x1="137" y1="129" x2="75" y2="23" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-type="segment" x1="75" y1="23" x2="75" y2="129" class="geom-line" />
    <path id="el-ang-ACB" data-ref="&lt; A C B )" data-type="wedge" d="M 75.00 23.00 L 63.89 41.99 A 22.0 22.0 0 0 0 86.11 41.99 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ACD" data-ref="&lt; A C D )" data-type="wedge" d="M 75.00 23.00 L 61.87 45.44 A 26.0 26.0 0 0 0 75.00 49.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BCD" data-ref="&lt; B C D )" data-type="wedge" d="M 75.00 23.00 L 88.13 45.44 A 26.0 26.0 0 0 1 75.00 49.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" points="13,129 137,129 75,23" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-ACD" data-ref="&lt; A C D &gt;" points="13,129 75,23 75,129" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-BCD" data-ref="&lt; B C D &gt;" points="137,129 75,23 75,129" class="geom-polygon geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" x1="13" y1="129" x2="75" y2="129" class="geom-line geom-overlay" />
    <line id="hl-seg-DB" data-ref="/ B D /" x1="137" y1="129" x2="75" y2="129" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ A D B /" x1="13" y1="129" x2="137" y2="129" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" x1="13" y1="129" x2="75" y2="23" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" x1="137" y1="129" x2="75" y2="23" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" x1="75" y1="23" x2="75" y2="129" class="geom-line geom-overlay" />
    <path id="hl-ang-ACB" data-ref="&lt; A C B )" d="M 75.00 23.00 L 63.89 41.99 A 22.0 22.0 0 0 0 86.11 41.99 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ACD" data-ref="&lt; A C D )" d="M 75.00 23.00 L 61.87 45.44 A 26.0 26.0 0 0 0 75.00 49.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-BCD" data-ref="&lt; B C D )" d="M 75.00 23.00 L 88.13 45.44 A 26.0 26.0 0 0 1 75.00 49.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="75" cy="23" r="3.5" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="13" cy="129" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="137" cy="129" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="75" cy="129" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-C" data-ref="C" x="75" y="13" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-A" data-ref="A" x="8" y="143" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-D" data-ref="D" x="75" y="143" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-B" data-ref="B" x="142" y="143" text-anchor="middle" class="geom-label">B</text>
  </g>
</svg>
