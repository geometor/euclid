    <path id="el-ang-ACB" data-ref="&lt; A C B )" data-type="wedge" d="M 102.00 23.00 L 92.11 40.38 A 20.0 20.0 0 0 0 111.89 40.38 Z" class="wedge angle geom-overlay" />
