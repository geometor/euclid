<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 180" width="245" height="180" class="euclid-graphic" data-folio="0282" data-graphic="g1" data-proposition="I.11">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Circles A and B -->
  <circle id="el-circ-A" data-ref="circle-A" cx="65" cy="88" r="75" class="geom-circle" />
  <circle id="el-circ-B" data-ref="circle-B" cx="139" cy="88" r="75" class="geom-circle" />

  <!-- Rhombus ACBD -->
  <polygon id="el-poly-ACBD" data-ref="ACBD" data-type="polygon" points="65,88 102,23 139,88 102,153" class="geom-polygon" />

  <!-- Segments AB, CD, AC, CB, BD, DA -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="65" y1="88" x2="139" y2="88" class="geom-line" />
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="102" y1="23" x2="102" y2="153" class="geom-line" />
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="65" y1="88" x2="102" y2="23" class="geom-line" />
  <line id="el-seg-CB" data-ref="CB" data-type="segment" x1="102" y1="23" x2="139" y2="88" class="geom-line" />
  <line id="el-seg-BD" data-ref="BD" data-type="segment" x1="139" y1="88" x2="102" y2="153" class="geom-line" />
  <line id="el-seg-DA" data-ref="DA" data-type="segment" x1="102" y1="153" x2="65" y2="88" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="65" cy="88" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="139" cy="88" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="102" cy="23" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="102" cy="153" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="102" cy="88" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-C" data-ref="C" x="102" y="14" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="102" y="168" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-A" data-ref="A" x="54" y="92" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="150" y="92" text-anchor="start" class="geom-label">B</text>
  <text id="lbl-E" data-ref="E" x="110" y="100" text-anchor="start" class="geom-label">E</text>
</svg>
