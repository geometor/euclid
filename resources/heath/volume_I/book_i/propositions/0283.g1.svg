    <line id="el-seg-CB" data-ref="/ C B /" data-aliases="/ C E B /" data-type="segment" x1="131" y1="148" x2="236" y2="148" class="geom-line geom-overlay" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ D C E /" data-type="segment" x1="61" y1="148" x2="201" y2="148" class="geom-line geom-overlay" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ A C B /" data-type="segment" x1="24" y1="148" x2="236" y2="148" class="geom-line geom-overlay" />
    <line id="el-seg-DF" data-ref="/ D F /" data-type="segment" x1="61" y1="148" x2="131" y2="26" class="geom-line" />
    <line id="el-seg-EF" data-ref="/ F E /" data-type="segment" x1="131" y1="26" x2="201" y2="148" class="geom-line" />
    <line id="el-seg-FC" data-ref="/ F C /" data-type="segment" x1="131" y1="26" x2="131" y2="148" class="geom-line" />
    <path id="el-ang-DCF" data-ref="&lt; D C F )" data-aliases="&lt; A C F )" data-type="wedge" d="M 131.00 148.00 L 109.00 148.00 A 22.0 22.0 0 0 1 131.00 126.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ECF" data-ref="&lt; E C F )" data-aliases="&lt; F C E ) | &lt; B C F )" data-type="wedge" d="M 131.00 148.00 L 153.00 148.00 A 22.0 22.0 0 0 0 131.00 126.00 Z" class="wedge angle geom-overlay" />
  </g>

