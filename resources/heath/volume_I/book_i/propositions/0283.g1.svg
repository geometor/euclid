    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ D C E /" x1="61" y1="148" x2="201" y2="148" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ A C B /" x1="24" y1="148" x2="236" y2="148" class="geom-line geom-overlay" />
    <line id="hl-seg-DF" data-ref="/ D F /" x1="61" y1="148" x2="131" y2="26" class="geom-line geom-overlay" />
