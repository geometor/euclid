    <line id="hl-seg-FC" data-ref="/ F C /" x1="131" y1="26" x2="131" y2="148" class="geom-line geom-overlay" />
    <path id="hl-ang-DCF" data-ref="&lt; D C F )" data-aliases="&lt; A C F )" d="M 131.00 148.00 L 109.00 148.00 A 22.0 22.0 0 0 1 131.00 126.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ECF" data-ref="&lt; E C F )" data-aliases="&lt; F C E ) | &lt; B C F )" d="M 131.00 148.00 L 153.00 148.00 A 22.0 22.0 0 0 0 131.00 126.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
