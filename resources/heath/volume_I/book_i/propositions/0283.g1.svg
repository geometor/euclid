<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295 180" width="295" height="180" class="euclid-graphic" data-folio="0283" data-graphic="g1" data-proposition="I.11">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles DEF, DFC, EFC -->
  <polygon id="el-tri-DEF" data-ref="DEF" data-type="polygon" points="61,148 201,148 131,26" class="geom-polygon" />
  <polygon id="el-tri-DFC" data-ref="DFC" data-type="polygon" points="61,148 131,148 131,26" class="geom-polygon" />
  <polygon id="el-tri-EFC" data-ref="EFC" data-type="polygon" points="201,148 131,148 131,26" class="geom-polygon" />

  <!-- Baseline AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="24" y1="148" x2="236" y2="148" class="geom-line" />

  <!-- Equilateral sides DF and EF -->
  <line id="el-seg-DF" data-ref="DF" data-type="segment" x1="61" y1="148" x2="131" y2="26" class="geom-line" />
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="201" y1="148" x2="131" y2="26" class="geom-line" />

  <!-- Perpendicular FC -->
  <line id="el-seg-FC" data-ref="FC" data-type="segment" x1="131" y1="26" x2="131" y2="148" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="24" cy="148" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="61" cy="148" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="131" cy="148" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="201" cy="148" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="236" cy="148" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="131" cy="26" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-F" data-ref="F" x="131" y="15" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-A" data-ref="A" x="20" y="164" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-D" data-ref="D" x="61" y="164" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-C" data-ref="C" x="131" y="164" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-E" data-ref="E" x="201" y="164" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-B" data-ref="B" x="244" y="164" text-anchor="middle" class="geom-label">B</text>
</svg>
