    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ A D C /" x1="24" y1="148" x2="131" y2="148" class="geom-line geom-overlay" />
    <line id="hl-seg-CE" data-ref="/ C E /" x1="131" y1="148" x2="201" y2="148" class="geom-line geom-overlay" />
