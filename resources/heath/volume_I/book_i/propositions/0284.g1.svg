<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 85" width="440" height="85" class="euclid-graphic" data-folio="0284" data-graphic="g1" data-proposition="I.11">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangle DEF -->
  <polygon id="el-tri-DEF" data-ref="DEF" data-type="polygon" points="111,65 171,65 141,13" class="geom-polygon" />

  <!-- Baseline AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="10" y1="65" x2="296" y2="65" class="geom-line" />

  <!-- Semicircular arcs centered at D(111,65) and E(171,65) with radius 60 -->
  <path id="el-arc-D" data-ref="arc-D" d="M 51 65 A 60 60 0 0 1 171 65" class="geom-circle" />
  <path id="el-arc-E" data-ref="arc-E" d="M 111 65 A 60 60 0 0 1 231 65" class="geom-circle" />

  <!-- Equilateral sides DF and EF -->
  <line id="el-seg-DF" data-ref="DF" data-type="segment" x1="111" y1="65" x2="141" y2="13" class="geom-line" />
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="171" y1="65" x2="141" y2="13" class="geom-line" />

  <!-- Perpendicular FC -->
  <line id="el-seg-FC" data-ref="FC" data-type="segment" x1="141" y1="13" x2="141" y2="65" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="10" cy="65" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="111" cy="65" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="141" cy="65" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="171" cy="65" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="296" cy="65" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="141" cy="13" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-F" data-ref="F" x="141" y="8" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-A" data-ref="A" x="10" y="78" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-D" data-ref="D" x="111" y="78" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-C" data-ref="C" x="141" y="78" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-E" data-ref="E" x="171" y="78" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-B" data-ref="B" x="296" y="78" text-anchor="middle" class="geom-label">B</text>
</svg>
