<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 210" width="310" height="210" class="euclid-graphic" data-folio="0285" data-graphic="g1" data-proposition="I.12">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles CGH and CEH -->
  <polygon id="el-tri-CGH" data-ref="CGH" data-type="polygon" points="130,110 59,150 130,150" class="geom-polygon" />
  <polygon id="el-tri-CEH" data-ref="CEH" data-type="polygon" points="130,110 201,150 130,150" class="geom-polygon" />

  <!-- Circle EFG described with centre C(130,110) and radius CD (81.5) -->
  <circle id="el-circ-EFG" data-ref="circ-EFG" data-type="circle" cx="130" cy="110" r="81.5" class="geom-circle" />

  <!-- Baseline AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="10" y1="150" x2="260" y2="150" class="geom-line" />

  <!-- Perpendicular CH -->
  <line id="el-seg-CH" data-ref="CH" data-type="segment" x1="130" y1="110" x2="130" y2="150" class="geom-line" />

  <!-- Radii CG and CE -->
  <line id="el-seg-CG" data-ref="CG" data-type="segment" x1="130" y1="110" x2="59" y2="150" class="geom-line" />
  <line id="el-seg-CE" data-ref="CE" data-type="segment" x1="130" y1="110" x2="201" y2="150" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="10" cy="150" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="59" cy="150" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="130" cy="150" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="201" cy="150" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="260" cy="150" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="130" cy="110" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="130" cy="28.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="175" cy="177" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-F" data-ref="F" x="130" y="20" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-C" data-ref="C" x="130" y="102" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-A" data-ref="A" x="10" y="165" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-G" data-ref="G" x="53" y="165" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-H" data-ref="H" x="131" y="165" text-anchor="middle" class="geom-label">H</text>
  <text id="lbl-E" data-ref="E" x="205" y="165" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-B" data-ref="B" x="260" y="165" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-D" data-ref="D" x="186" y="181" text-anchor="start" class="geom-label">D</text>
</svg>
