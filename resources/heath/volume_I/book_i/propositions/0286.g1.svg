<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285 170" width="285" height="170" class="euclid-graphic" data-folio="0286" data-graphic="g1" data-proposition="I.12">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles CGH, CKH, CEH -->
  <polygon id="el-tri-CGH" data-ref="CGH" data-type="polygon" points="104,70 52,119 104,119" class="geom-polygon" />
  <polygon id="el-tri-CKH" data-ref="CKH" data-type="polygon" points="104,70 125,119 104,119" class="geom-polygon" />
  <polygon id="el-tri-CEH" data-ref="CEH" data-type="polygon" points="104,70 156,119 104,119" class="geom-polygon" />

  <!-- The hypothesized distorted "circle" cutting AB at G, K, E -->
  <path id="el-curve-circle" data-ref="curve-circle" data-type="curve"
        d="M 52 119 C 62 129, 82 135, 104 135 C 114 135, 122 128, 125 119 C 129 124, 134 125.5, 140.5 125.5 C 147 125.5, 152 124, 156 119 A 66.5 66.5 0 1 0 52 119 Z"
        class="geom-circle" />

  <!-- Baseline AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="2" y1="119" x2="215" y2="119" class="geom-line" />

  <!-- Straight line CH produced to L -->
  <line id="el-seg-CL" data-ref="CL" data-type="segment" x1="104" y1="70" x2="104" y2="135" class="geom-line" />

  <!-- Lines CG, CK, CE -->
  <line id="el-seg-CG" data-ref="CG" data-type="segment" x1="104" y1="70" x2="52" y2="119" class="geom-line" />
  <line id="el-seg-CK" data-ref="CK" data-type="segment" x1="104" y1="70" x2="125" y2="119" class="geom-line" />
  <line id="el-seg-CE" data-ref="CE" data-type="segment" x1="104" y1="70" x2="156" y2="119" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="2" cy="119" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="52" cy="119" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="104" cy="119" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="125" cy="119" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="156" cy="119" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="215" cy="119" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="104" cy="70" r="3.5" class="geom-point" />
  <circle id="el-pt-L" data-ref="L" data-type="point" cx="104" cy="135" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="58" cy="27" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-F" data-ref="F" x="56" y="22" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-C" data-ref="C" x="104" y="62" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-H" data-ref="H" x="96" y="114" text-anchor="end" class="geom-label">H</text>
  <text id="lbl-K" data-ref="K" x="131" y="114" text-anchor="start" class="geom-label">K</text>
  <text id="lbl-A" data-ref="A" x="2" y="133" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-G" data-ref="G" x="48" y="133" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-E" data-ref="E" x="161" y="133" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-B" data-ref="B" x="215" y="133" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-L" data-ref="L" x="105" y="150" text-anchor="middle" class="geom-label">L</text>
</svg>
