<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" width="300" height="160" class="euclid-graphic" data-folio="0287" data-graphic="g1" data-proposition="I.12">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles CGH, CHK, CKE -->
  <polygon id="el-tri-CGH" data-ref="CGH" data-type="polygon" points="123,95 69,138 123,138" class="geom-polygon" />
  <polygon id="el-tri-CHK" data-ref="CHK" data-type="polygon" points="123,95 123,138 150,138" class="geom-polygon" />
  <polygon id="el-tri-CKE" data-ref="CKE" data-type="polygon" points="123,95 150,138 177,138" class="geom-polygon" />

  <!-- Hypothesized curve meeting AB at G, H, E -->
  <path id="el-curve-circle" data-ref="curve-circle" data-type="curve"
        d="M 69 138 C 75 147, 90 149, 96 149 C 102 149, 117 147, 123 138 C 129 147, 144 149, 150 149 C 156 149, 171 147, 177 138 A 69 69 0 1 0 69 138 Z"
        class="geom-circle" />

  <!-- Baseline AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="7" y1="138" x2="238" y2="138" class="geom-line" />

  <!-- Line CG -->
  <line id="el-seg-CG" data-ref="CG" data-type="segment" x1="123" y1="95" x2="69" y2="138" class="geom-line" />

  <!-- Perpendicular CH -->
  <line id="el-seg-CH" data-ref="CH" data-type="segment" x1="123" y1="95" x2="123" y2="138" class="geom-line" />

  <!-- Line CK produced to L -->
  <line id="el-seg-CL" data-ref="CL" data-type="segment" x1="123" y1="95" x2="156.5" y2="148.5" class="geom-line" />

  <!-- Line CE -->
  <line id="el-seg-CE" data-ref="CE" data-type="segment" x1="123" y1="95" x2="177" y2="138" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="7" cy="138" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="69" cy="138" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="123" cy="138" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="150" cy="138" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="177" cy="138" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="238" cy="138" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="123" cy="95" r="3.5" class="geom-point" />
  <circle id="el-pt-L" data-ref="L" data-type="point" cx="156.5" cy="148.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-C" data-ref="C" x="123" y="88" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-A" data-ref="A" x="7" y="152" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-G" data-ref="G" x="66" y="152" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-H" data-ref="H" x="117" y="132" text-anchor="end" class="geom-label">H</text>
  <text id="lbl-K" data-ref="K" x="155" y="132" text-anchor="start" class="geom-label">K</text>
  <text id="lbl-E" data-ref="E" x="180" y="152" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-B" data-ref="B" x="238" y="152" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-L" data-ref="L" x="165" y="157" text-anchor="start" class="geom-label">L</text>
</svg>
