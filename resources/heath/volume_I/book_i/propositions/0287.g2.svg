<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295 145" width="295" height="145" class="euclid-graphic" data-folio="0287" data-graphic="g2" data-proposition="I.12">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles CGK, CKH, CLH, CLE -->
  <polygon id="el-tri-CGK" data-ref="CGK" data-type="polygon" points="114.5,80 56.5,120.5 89,120.5" class="geom-polygon" />
  <polygon id="el-tri-CKH" data-ref="CKH" data-type="polygon" points="114.5,80 89,120.5 114.5,120.5" class="geom-polygon" />
  <polygon id="el-tri-CLH" data-ref="CLH" data-type="polygon" points="114.5,80 140,120.5 114.5,120.5" class="geom-polygon" />
  <polygon id="el-tri-CLE" data-ref="CLE" data-type="polygon" points="114.5,80 140,120.5 172.5,120.5" class="geom-polygon" />

  <!-- Hypothesized curve meeting AB at G, K, L, E and passing between K and L through M towards C -->
  <path id="el-curve-circle" data-ref="curve-circle" data-type="curve"
        d="M 56.5 120.5 C 62 126, 83 126, 89 120.5 C 95 113, 105 110, 114.5 110 C 124 110, 134 113, 140 120.5 C 146 126, 167 126, 172.5 120.5 A 71 71 0 1 0 56.5 120.5 Z"
        class="geom-circle" />

  <!-- Baseline AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="7" y1="120.5" x2="239" y2="120.5" class="geom-line" />

  <!-- Line CG -->
  <line id="el-seg-CG" data-ref="CG" data-type="segment" x1="114.5" y1="80" x2="56.5" y2="120.5" class="geom-line" />

  <!-- Line CK -->
  <line id="el-seg-CK" data-ref="CK" data-type="segment" x1="114.5" y1="80" x2="89" y2="120.5" class="geom-line" />

  <!-- Perpendicular CH (passing through M) -->
  <line id="el-seg-CH" data-ref="CH" data-type="segment" x1="114.5" y1="80" x2="114.5" y2="120.5" class="geom-line" />

  <!-- Line CL -->
  <line id="el-seg-CL" data-ref="CL" data-type="segment" x1="114.5" y1="80" x2="140" y2="120.5" class="geom-line" />

  <!-- Line CE -->
  <line id="el-seg-CE" data-ref="CE" data-type="segment" x1="114.5" y1="80" x2="172.5" y2="120.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="7" cy="120.5" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="56.5" cy="120.5" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="89" cy="120.5" r="3.5" class="geom-point" />
  <circle id="el-pt-M" data-ref="M" data-type="point" cx="114.5" cy="110" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="114.5" cy="120.5" r="3.5" class="geom-point" />
  <circle id="el-pt-L" data-ref="L" data-type="point" cx="140" cy="120.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="172.5" cy="120.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="239" cy="120.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="114.5" cy="80" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="65" cy="31" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-F" data-ref="F" x="65" y="27" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-C" data-ref="C" x="114.5" y="73" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-M" data-ref="M" x="124" y="106" text-anchor="start" class="geom-label">M</text>
  <text id="lbl-A" data-ref="A" x="7" y="135" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-G" data-ref="G" x="54" y="135" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-K" data-ref="K" x="89" y="135" text-anchor="middle" class="geom-label">K</text>
  <text id="lbl-H" data-ref="H" x="114.5" y="135" text-anchor="middle" class="geom-label">H</text>
  <text id="lbl-L" data-ref="L" x="140" y="135" text-anchor="middle" class="geom-label">L</text>
  <text id="lbl-E" data-ref="E" x="172.5" y="135" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-B" data-ref="B" x="239" y="135" text-anchor="middle" class="geom-label">B</text>
</svg>
