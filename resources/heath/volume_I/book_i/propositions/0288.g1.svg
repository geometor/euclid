<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 168" width="260" height="168" class="euclid-graphic" data-folio="0288" data-graphic="g1" data-proposition="I.12">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles CGL, CKL, CHE -->
  <polygon id="el-tri-CGL" data-ref="CGL" data-type="polygon" points="117,25 50.5,83.5 117,142" class="geom-polygon" />
  <polygon id="el-tri-CKL" data-ref="CKL" data-type="polygon" points="117,25 70.5,83.5 117,142" class="geom-polygon" />
  <polygon id="el-tri-CHE" data-ref="CHE" data-type="polygon" points="117,25 117,83.5 183.5,83.5" class="geom-polygon" />

  <!-- Baseline AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="12" y1="83.5" x2="231" y2="83.5" class="geom-line" />

  <!-- Axis CL -->
  <line id="el-seg-CL" data-ref="CL" data-type="segment" x1="117" y1="25" x2="117" y2="142" class="geom-line" />

  <!-- Upper Lines CG, CK, CE -->
  <line id="el-seg-CG" data-ref="CG" data-type="segment" x1="117" y1="25" x2="50.5" y2="83.5" class="geom-line" />
  <line id="el-seg-CK" data-ref="CK" data-type="segment" x1="117" y1="25" x2="70.5" y2="83.5" class="geom-line" />
  <line id="el-seg-CE" data-ref="CE" data-type="segment" x1="117" y1="25" x2="183.5" y2="83.5" class="geom-line" />

  <!-- Lower Lines LG, LK -->
  <line id="el-seg-LG" data-ref="LG" data-type="segment" x1="117" y1="142" x2="50.5" y2="83.5" class="geom-line" />
  <line id="el-seg-LK" data-ref="LK" data-type="segment" x1="117" y1="142" x2="70.5" y2="83.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="12" cy="83.5" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="50.5" cy="83.5" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="70.5" cy="83.5" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="117" cy="83.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="183.5" cy="83.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="231" cy="83.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="117" cy="25" r="3.5" class="geom-point" />
  <circle id="el-pt-L" data-ref="L" data-type="point" cx="117" cy="142" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-C" data-ref="C" x="117" y="18" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-K" data-ref="K" x="70.5" y="76" text-anchor="middle" class="geom-label">K</text>
  <text id="lbl-H" data-ref="H" x="125" y="78" text-anchor="start" class="geom-label">H</text>
  <text id="lbl-A" data-ref="A" x="14" y="97" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-G" data-ref="G" x="46" y="97" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-E" data-ref="E" x="183.5" y="97" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-B" data-ref="B" x="230" y="97" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-L" data-ref="L" x="117" y="157" text-anchor="middle" class="geom-label">L</text>
</svg>
