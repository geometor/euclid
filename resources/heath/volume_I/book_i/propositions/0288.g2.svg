<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 158 128" width="158" height="128" class="euclid-graphic" data-folio="0288" data-graphic="g2" data-proposition="I.12">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles CGM and CML -->
  <polygon id="el-tri-CGM" data-ref="CGM" data-type="polygon" points="83,35 18,96 62,96" class="geom-polygon" />
  <polygon id="el-tri-CML" data-ref="CML" data-type="polygon" points="83,35 62,96 125,96" class="geom-polygon" />

  <!-- Baseline GL (through M) -->
  <line id="el-seg-GL" data-ref="GL" data-type="segment" x1="18" y1="96" x2="125" y2="96" class="geom-line" />

  <!-- Line GN (through C to N) -->
  <line id="el-seg-GN" data-ref="GN" data-type="segment" x1="18" y1="96" x2="103" y2="16" class="geom-line" />

  <!-- Line CM -->
  <line id="el-seg-CM" data-ref="CM" data-type="segment" x1="83" y1="35" x2="62" y2="96" class="geom-line" />

  <!-- Line CL -->
  <line id="el-seg-CL" data-ref="CL" data-type="segment" x1="83" y1="35" x2="125" y2="96" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-N" data-ref="N" data-type="point" cx="103" cy="16" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="83" cy="35" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="18" cy="96" r="3.5" class="geom-point" />
  <circle id="el-pt-M" data-ref="M" data-type="point" cx="62" cy="96" r="3.5" class="geom-point" />
  <circle id="el-pt-L" data-ref="L" data-type="point" cx="125" cy="96" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-N" data-ref="N" x="110" y="21" text-anchor="start" class="geom-label">N</text>
  <text id="lbl-C" data-ref="C" x="76" y="32" text-anchor="end" class="geom-label">C</text>
  <text id="lbl-G" data-ref="G" x="17" y="110" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-M" data-ref="M" x="62" y="110" text-anchor="middle" class="geom-label">M</text>
  <text id="lbl-L" data-ref="L" x="125" y="110" text-anchor="middle" class="geom-label">L</text>
</svg>
