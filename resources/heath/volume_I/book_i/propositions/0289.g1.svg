<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 115" width="225" height="115" class="euclid-graphic" data-folio="0289" data-graphic="g1" data-proposition="I.13">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Angles / sectors represented as subtle polygonal fills -->
  <polygon id="el-tri-CBE" data-ref="CBE" data-type="polygon" points="28,96.5 114,96.5 114,30" class="geom-polygon" />
  <polygon id="el-tri-EBA" data-ref="EBA" data-type="polygon" points="114,96.5 114,30 147.5,30" class="geom-polygon" />
  <polygon id="el-tri-ABD" data-ref="ABD" data-type="polygon" points="114,96.5 147.5,30 196,96.5" class="geom-polygon" />

  <!-- Baseline CD -->
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="28" y1="96.5" x2="196" y2="96.5" class="geom-line" />

  <!-- Perpendicular BE -->
  <line id="el-seg-BE" data-ref="BE" data-type="segment" x1="114" y1="96.5" x2="114" y2="30" class="geom-line" />

  <!-- Oblique line BA -->
  <line id="el-seg-BA" data-ref="BA" data-type="segment" x1="114" y1="96.5" x2="147.5" y2="30" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="28" cy="96.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="114" cy="96.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="196" cy="96.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="114" cy="30" r="3.5" class="geom-point" />
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="147.5" cy="30" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-E" data-ref="E" x="106" y="25" text-anchor="end" class="geom-label">E</text>
  <text id="lbl-A" data-ref="A" x="155" y="27" text-anchor="start" class="geom-label">A</text>
  <text id="lbl-C" data-ref="C" x="30" y="110" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-B" data-ref="B" x="114" y="110" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-D" data-ref="D" x="195" y="110" text-anchor="middle" class="geom-label">D</text>
</svg>
