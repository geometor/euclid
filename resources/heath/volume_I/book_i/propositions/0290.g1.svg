<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110" width="200" height="110" class="euclid-graphic" data-folio="0290" data-graphic="g1" data-proposition="I.14">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Angle sectors represented as subtle polygons -->
  <polygon id="el-tri-CBA" data-ref="CBA" data-type="polygon" points="5,79.5 87,79.5 58,22" class="geom-polygon" />
  <polygon id="el-tri-ABE" data-ref="ABE" data-type="polygon" points="58,22 87,79.5 150,18" class="geom-polygon" />
  <polygon id="el-tri-EBD" data-ref="EBD" data-type="polygon" points="150,18 87,79.5 168,79.5" class="geom-polygon" />

  <!-- Baseline CD (CB and BD in a straight line) -->
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="5" y1="79.5" x2="168" y2="79.5" class="geom-line" />

  <!-- Oblique line AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="58" y1="22" x2="87" y2="79.5" class="geom-line" />

  <!-- Supposed straight line continuation BE -->
  <line id="el-seg-BE" data-ref="BE" data-type="segment" x1="87" y1="79.5" x2="150" y2="18" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="5" cy="79.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="87" cy="79.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="168" cy="79.5" r="3.5" class="geom-point" />
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="58" cy="22" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="150" cy="18" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="48" y="24" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-E" data-ref="E" x="156" y="16" text-anchor="start" class="geom-label">E</text>
  <text id="lbl-C" data-ref="C" x="6" y="94" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-B" data-ref="B" x="87" y="94" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-D" data-ref="D" x="168" y="94" text-anchor="middle" class="geom-label">D</text>
</svg>
