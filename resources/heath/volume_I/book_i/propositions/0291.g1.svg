<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 195" width="220" height="195" class="euclid-graphic" data-folio="0291" data-graphic="g1" data-proposition="I.14">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles CBE and CBF -->
  <polygon id="el-tri-CBE" data-ref="CBE" data-type="polygon" points="108,94 180,94 180,25" class="geom-polygon" />
  <polygon id="el-tri-CBF" data-ref="CBF" data-type="polygon" points="108,94 180,94 180,164" class="geom-polygon" />

  <!-- Baseline AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="20" y1="94" x2="180" y2="94" class="geom-line" />

  <!-- Perpendicular CD -->
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="108" y1="94" x2="108" y2="25" class="geom-line" />

  <!-- Vertical line EF (through B) -->
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="180" y1="25" x2="180" y2="164" class="geom-line" />

  <!-- Diagonal CE (inclination 45° to CD / CB) -->
  <line id="el-seg-CE" data-ref="CE" data-type="segment" x1="108" y1="94" x2="180" y2="25" class="geom-line" />

  <!-- Diagonal CF (inclination 135° to CD) -->
  <line id="el-seg-CF" data-ref="CF" data-type="segment" x1="108" y1="94" x2="180" y2="164" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="20" cy="94" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="108" cy="94" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="180" cy="94" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="108" cy="25" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="180" cy="25" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="180" cy="164" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-D" data-ref="D" x="100" y="26" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="188" y="27" text-anchor="start" class="geom-label">E</text>
  <text id="lbl-A" data-ref="A" x="38" y="108" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-C" data-ref="C" x="104" y="108" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-B" data-ref="B" x="188" y="98" text-anchor="start" class="geom-label">B</text>
  <text id="lbl-F" data-ref="F" x="188" y="172" text-anchor="start" class="geom-label">F</text>
</svg>
