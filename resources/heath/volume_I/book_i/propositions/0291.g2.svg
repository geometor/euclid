<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 145" width="215" height="145" class="euclid-graphic" data-folio="0291" data-graphic="g2" data-proposition="I.15">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Vertically opposite angle sectors as subtle polygons -->
  <polygon id="el-tri-AEC" data-ref="AEC" data-type="polygon" points="95,72.5 21,36 25,72.5" class="geom-polygon" />
  <polygon id="el-tri-DEB" data-ref="DEB" data-type="polygon" points="95,72.5 170,72.5 169,109" class="geom-polygon" />
  <polygon id="el-tri-CEB" data-ref="CEB" data-type="polygon" points="95,72.5 25,72.5 169,109" class="geom-polygon" />
  <polygon id="el-tri-AED" data-ref="AED" data-type="polygon" points="95,72.5 21,36 170,72.5" class="geom-polygon" />

  <!-- Straight line CD -->
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="25" y1="72.5" x2="170" y2="72.5" class="geom-line" />

  <!-- Straight line AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="21" y1="36" x2="169" y2="109" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="21" cy="36" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="25" cy="72.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="95" cy="72.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="170" cy="72.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="169" cy="109" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="26.5" y="27" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-C" data-ref="C" x="23" y="86" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-E" data-ref="E" x="100" y="63" text-anchor="start" class="geom-label">E</text>
  <text id="lbl-D" data-ref="D" x="171.5" y="86" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-B" data-ref="B" x="160" y="112" text-anchor="end" class="geom-label">B</text>
</svg>
