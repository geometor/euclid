<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 215" width="245" height="215" class="euclid-graphic" data-folio="0293" data-graphic="g1" data-proposition="I.16">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Congruent Triangles ABE and CFE -->
  <polygon id="el-tri-ABE" data-ref="ABE" data-type="polygon" points="94,20 26,121.5 118.75,70.75" class="geom-polygon" />
  <polygon id="el-tri-CFE" data-ref="CFE" data-type="polygon" points="143.5,121.5 211.5,20 118.75,70.75" class="geom-polygon" />
  <!-- Triangle ABC -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="94,20 26,121.5 143.5,121.5" class="geom-polygon" />

  <!-- Base BC produced to D -->
  <line id="el-seg-BD" data-ref="BD" data-type="segment" x1="26" y1="121.5" x2="196" y2="121.5" class="geom-line" />

  <!-- Side AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="94" y1="20" x2="26" y2="121.5" class="geom-line" />

  <!-- Side AC produced to G -->
  <line id="el-seg-AG" data-ref="AG" data-type="segment" x1="94" y1="20" x2="175" y2="185" class="geom-line" />

  <!-- Line BF (BE produced to F) -->
  <line id="el-seg-BF" data-ref="BF" data-type="segment" x1="26" y1="121.5" x2="211.5" y2="20" class="geom-line" />

  <!-- Line FC -->
  <line id="el-seg-FC" data-ref="FC" data-type="segment" x1="211.5" y1="20" x2="143.5" y2="121.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="94" cy="20" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="26" cy="121.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="143.5" cy="121.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="196" cy="121.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="118.75" cy="70.75" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="211.5" cy="20" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="175" cy="185" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="91" y="14" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-F" data-ref="F" x="224" y="21" text-anchor="start" class="geom-label">F</text>
  <text id="lbl-E" data-ref="E" x="122" y="60" text-anchor="start" class="geom-label">E</text>
  <text id="lbl-B" data-ref="B" x="17" y="133" text-anchor="end" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="142" y="135" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="196" y="135" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-G" data-ref="G" x="163" y="190" text-anchor="end" class="geom-label">G</text>
</svg>
