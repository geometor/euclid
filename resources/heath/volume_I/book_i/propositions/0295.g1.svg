<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 120" width="210" height="120" class="euclid-graphic" data-folio="0295" data-graphic="g1" data-proposition="I.16">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles ABC, ACD -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="94,32 20,96 118,96" class="geom-polygon" />
  <polygon id="el-tri-ACD" data-ref="ACD" data-type="polygon" points="94,32 118,96 169,96" class="geom-polygon" />

  <!-- Baseline BD -->
  <line id="el-seg-BD" data-ref="BD" data-type="segment" x1="20" y1="96" x2="169" y2="96" class="geom-line" />

  <!-- Side AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="94" y1="32" x2="20" y2="96" class="geom-line" />

  <!-- Oblique line AC -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="94" y1="32" x2="118" y2="96" class="geom-line" />

  <!-- Side AD -->
  <line id="el-seg-AD" data-ref="AD" data-type="segment" x1="94" y1="32" x2="169" y2="96" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="94" cy="32" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="20" cy="96" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="118" cy="96" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="169" cy="96" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="94" y="24" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="20" y="110" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="118" y="110" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="169" y="110" text-anchor="middle" class="geom-label">D</text>
</svg>
