<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 145" width="195" height="145" class="euclid-graphic" data-folio="0295" data-graphic="g2" data-proposition="I.16">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Quadrilateral ABDC as subtle polygon -->
  <polygon id="el-poly-ABDC" data-ref="ABDC" data-type="polygon" points="24,30 24,122.5 65,122.5 65,30" class="geom-polygon" />

  <!-- Transversal / Baseline BE -->
  <line id="el-seg-BE" data-ref="BE" data-type="segment" x1="24" y1="122.5" x2="161" y2="122.5" class="geom-line" />

  <!-- Line AB (perpendicular to BE) -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="24" y1="30" x2="24" y2="122.5" class="geom-line" />

  <!-- Line CD (perpendicular to BE) -->
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="65" y1="30" x2="65" y2="122.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="24" cy="30" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="24" cy="122.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="65" cy="30" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="65" cy="122.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="161" cy="122.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="16" y="32" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-C" data-ref="C" x="57" y="30" text-anchor="end" class="geom-label">C</text>
  <text id="lbl-B" data-ref="B" x="24" y="136" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-D" data-ref="D" x="65" y="136" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="161" y="136" text-anchor="middle" class="geom-label">E</text>
</svg>
