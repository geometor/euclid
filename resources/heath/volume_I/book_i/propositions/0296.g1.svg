    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /; [ B D ]; [ D B ]" data-type="segment" x1="88" y1="116.5" x2="305" y2="116.5" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /; [ A B ]; [ B A ]" data-type="segment" x1="44" y1="35" x2="88" y2="116.5" class="geom-line" />
