<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 135" width="420" height="135" class="euclid-graphic" data-folio="0296" data-graphic="g1" data-proposition="I.17">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangle ABC -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="44,35 88,116.5 191,116.5" class="geom-polygon" />

  <!-- Base BC produced to D -->
  <line id="el-seg-BD" data-ref="BD" data-type="segment" x1="88" y1="116.5" x2="305" y2="116.5" class="geom-line" />

  <!-- Side AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="44" y1="35" x2="88" y2="116.5" class="geom-line" />

  <!-- Side AC -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="44" y1="35" x2="191" y2="116.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="44" cy="35" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="88" cy="116.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="191" cy="116.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="305" cy="116.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="35" y="33" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="88" y="128" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="191" y="128" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="305" y="128" text-anchor="middle" class="geom-label">D</text>
</svg>
