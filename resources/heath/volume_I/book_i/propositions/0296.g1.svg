    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /; [ A B ]; [ B A ]" x1="44" y1="35" x2="88" y2="116.5" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /; [ A C ]; [ C A ]" x1="44" y1="35" x2="191" y2="116.5" class="geom-line geom-overlay" />
