    <path id="el-ang-ACD" data-ref="&lt; A C D )" data-aliases="&lt; D C A )" data-type="wedge" d="M 191.00 116.50 L 170.01 104.86 A 24.0 24.0 0 0 1 215.00 116.50 Z" class="wedge angle geom-overlay" />
