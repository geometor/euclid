    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /; [ C D ]; [ D C ]" data-type="segment" x1="191" y1="116.5" x2="305" y2="116.5" class="geom-line geom-overlay" />
    <polyline id="el-sec-BCD" data-ref="/ B C D /" data-aliases="/ D C B /; } B C D {; } D C B {" data-type="section" points="88,116.5 191,116.5 305,116.5" fill="none" class="geom-line geom-overlay" />
