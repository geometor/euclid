<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 110" width="170" height="110" class="euclid-graphic" data-folio="0296" data-graphic="g2" data-proposition="I.17">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles ABD, ADC -->
  <polygon id="el-tri-ABD" data-ref="ABD" data-type="polygon" points="53.5,23.5 7,73 87,73" class="geom-polygon" />
  <polygon id="el-tri-ADC" data-ref="ADC" data-type="polygon" points="53.5,23.5 87,73 141,73" class="geom-polygon" />

  <!-- Base BC (through D) -->
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="7" y1="73" x2="141" y2="73" class="geom-line" />

  <!-- Side AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="53.5" y1="23.5" x2="7" y2="73" class="geom-line" />

  <!-- Line AD (point D on BC) -->
  <line id="el-seg-AD" data-ref="AD" data-type="segment" x1="53.5" y1="23.5" x2="87" y2="73" class="geom-line" />

  <!-- Side AC -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="53.5" y1="23.5" x2="141" y2="73" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="53.5" cy="23.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="7" cy="73" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="87" cy="73" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="141" cy="73" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="53.5" y="16" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="7" y="86" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-D" data-ref="D" x="87" y="86" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-C" data-ref="C" x="141" y="86" text-anchor="middle" class="geom-label">C</text>
</svg>
