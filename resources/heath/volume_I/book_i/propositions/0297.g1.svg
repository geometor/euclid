<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285 140" width="285" height="140" class="euclid-graphic" data-folio="0297" data-graphic="g1" data-proposition="I.18">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles ABD and BCD -->
  <polygon id="el-tri-ABD" data-ref="ABD" data-type="polygon" points="18,26 70,113.5 113,62.5" class="geom-polygon" />
  <polygon id="el-tri-BCD" data-ref="BCD" data-type="polygon" points="70,113.5 246,113.5 113,62.5" class="geom-polygon" />

  <!-- Base BC -->
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="70" y1="113.5" x2="246" y2="113.5" class="geom-line" />

  <!-- Side AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="18" y1="26" x2="70" y2="113.5" class="geom-line" />

  <!-- Side AC (through D) -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="18" y1="26" x2="246" y2="113.5" class="geom-line" />

  <!-- Transversal BD -->
  <line id="el-seg-BD" data-ref="BD" data-type="segment" x1="70" y1="113.5" x2="113" y2="62.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="18" cy="26" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="70" cy="113.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="246" cy="113.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="113" cy="62.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="11" y="23" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="68" y="127" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="246" y="127" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="122" y="55" text-anchor="start" class="geom-label">D</text>
</svg>
