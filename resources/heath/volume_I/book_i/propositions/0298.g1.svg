<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 125 140" width="125" height="140" class="euclid-graphic" data-graphic-id="0298.g1" data-folio="0298" data-graphic="g1" data-proposition="I.19">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circles, Arcs & Infinite Lines) -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt;;&lt; B A C &gt;;&lt; B C A &gt;;&lt; C A B &gt;;&lt; C B A &gt;;ABC" data-type="polygon" points="75,18.5 22,54 75,115" class="geom-polygon" />
    <path id="el-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; C A B );( A B )&lt; B A C &gt;;( A C )&lt; C A B &gt;" data-type="wedge" d="M 75 18.5 L 58.38 29.63 A 20.0 20.0 0 0 0 75.00 38.50 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A );( B A )&lt; A B C &gt;;( B C )&lt; C B A &gt;" data-type="wedge" d="M 22 54 L 38.62 42.87 A 20.0 20.0 0 0 1 35.12 69.10 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ACB" data-ref="&lt; A C B )" data-aliases="&lt; B C A );( C A )&lt; A C B &gt;;( C B )&lt; B C A &gt;" data-type="wedge" d="M 75 115 L 75.00 95.00 A 20.0 20.0 0 0 0 61.88 99.90 Z" class="wedge angle geom-overlay" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /;AC;CA;b;/ b /" data-type="segment" x1="75" y1="18.5" x2="75" y2="115" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /;AB;BA;c;/ c /" data-type="segment" x1="75" y1="18.5" x2="22" y2="54" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /;BC;CB;a;/ a /" data-type="segment" x1="22" y1="54" x2="75" y2="115" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt;;&lt; B A C &gt;;&lt; B C A &gt;;&lt; C A B &gt;;&lt; C B A &gt;;ABC" points="75,18.5 22,54 75,115" class="geom-polygon geom-overlay" />
    <path id="hl-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; C A B );( A B )&lt; B A C &gt;;( A C )&lt; C A B &gt;" d="M 75 18.5 L 58.38 29.63 A 20.0 20.0 0 0 0 75.00 38.50 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A );( B A )&lt; A B C &gt;;( B C )&lt; C B A &gt;" d="M 22 54 L 38.62 42.87 A 20.0 20.0 0 0 1 35.12 69.10 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ACB" data-ref="&lt; A C B )" data-aliases="&lt; B C A );( C A )&lt; A C B &gt;;( C B )&lt; B C A &gt;" d="M 75 115 L 75.00 95.00 A 20.0 20.0 0 0 0 61.88 99.90 Z" class="wedge angle geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /;AC;CA;b;/ b /" x1="75" y1="18.5" x2="75" y2="115" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /;AB;BA;c;/ c /" x1="75" y1="18.5" x2="22" y2="54" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /;BC;CB;a;/ a /" x1="22" y1="54" x2="75" y2="115" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="75" cy="18.5" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="22" cy="54" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="75" cy="115" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="83" y="18" text-anchor="start" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="12" y="58" text-anchor="end" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="83" y="122" text-anchor="start" class="geom-label">C</text>
  </g>
</svg>
