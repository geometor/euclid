<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 195" width="245" height="195" class="euclid-graphic" data-folio="0299" data-graphic="g1" data-proposition="I.19">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Congruent Triangles ABD and EFD -->
  <polygon id="el-tri-ABD" data-ref="ABD" data-type="polygon" points="69,23.5 15,98 79,98" class="geom-polygon" />
  <polygon id="el-tri-EFD" data-ref="EFD" data-type="polygon" points="90,167 137,98 79,98" class="geom-polygon" />
  <!-- Isosceles Triangle AEG -->
  <polygon id="el-tri-AEG" data-ref="AEG" data-type="polygon" points="69,23.5 90,167 152,72" class="geom-polygon" />

  <!-- Baseline BC (through D and F) -->
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="15" y1="98" x2="200" y2="98" class="geom-line" />

  <!-- Side AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="69" y1="23.5" x2="15" y2="98" class="geom-line" />

  <!-- Side AC (through G) -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="69" y1="23.5" x2="200" y2="98" class="geom-line" />

  <!-- Line AE (bisector AD produced to E) -->
  <line id="el-seg-AE" data-ref="AE" data-type="segment" x1="69" y1="23.5" x2="90" y2="167" class="geom-line" />

  <!-- Line EG (EF produced to G) -->
  <line id="el-seg-EG" data-ref="EG" data-type="segment" x1="90" y1="167" x2="152" y2="72" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="69" cy="23.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="15" cy="98" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="79" cy="98" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="137" cy="98" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="200" cy="98" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="152" cy="72" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="90" cy="167" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="69" y="16" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="13" y="112" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-D" data-ref="D" x="78" y="112" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-F" data-ref="F" x="137" y="112" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-C" data-ref="C" x="201" y="112" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-G" data-ref="G" x="160" y="70" text-anchor="start" class="geom-label">G</text>
  <text id="lbl-E" data-ref="E" x="90" y="182" text-anchor="middle" class="geom-label">E</text>
</svg>
