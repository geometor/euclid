<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 205" width="190" height="205" class="euclid-graphic" data-folio="0300" data-graphic="g1" data-proposition="I.19">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Congruent Triangles ABD and ECD -->
  <polygon id="el-tri-ABD" data-ref="ABD" data-type="polygon" points="64.5,28.5 24.5,100.5 93,100.5" class="geom-polygon" />
  <polygon id="el-tri-ECD" data-ref="ECD" data-type="polygon" points="123.5,170.5 159.5,100.5 93,100.5" class="geom-polygon" />
  <!-- Triangles ABF, BFE -->
  <polygon id="el-tri-ABF" data-ref="ABF" data-type="polygon" points="64.5,28.5 24.5,100.5 89,80.5" class="geom-polygon" />
  <polygon id="el-tri-BFE" data-ref="BFE" data-type="polygon" points="24.5,100.5 89,80.5 123.5,170.5" class="geom-polygon" />

  <!-- Base BC (through D) -->
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="24.5" y1="100.5" x2="159.5" y2="100.5" class="geom-line" />

  <!-- Side AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="64.5" y1="28.5" x2="24.5" y2="100.5" class="geom-line" />

  <!-- Side AC -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="64.5" y1="28.5" x2="159.5" y2="100.5" class="geom-line" />

  <!-- Line AE (median AD produced to E) -->
  <line id="el-seg-AE" data-ref="AE" data-type="segment" x1="64.5" y1="28.5" x2="123.5" y2="170.5" class="geom-line" />

  <!-- Line BE -->
  <line id="el-seg-BE" data-ref="BE" data-type="segment" x1="24.5" y1="100.5" x2="123.5" y2="170.5" class="geom-line" />

  <!-- Bisector line BF -->
  <line id="el-seg-BF" data-ref="BF" data-type="segment" x1="24.5" y1="100.5" x2="89" y2="80.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="64.5" cy="28.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="24.5" cy="100.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="93" cy="100.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="159.5" cy="100.5" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="89" cy="80.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="123.5" cy="170.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="64" y="20" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-F" data-ref="F" x="98" y="78" text-anchor="start" class="geom-label">F</text>
  <text id="lbl-B" data-ref="B" x="18" y="112" text-anchor="end" class="geom-label">B</text>
  <text id="lbl-D" data-ref="D" x="94" y="114" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-C" data-ref="C" x="164" y="114" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-E" data-ref="E" x="135" y="186" text-anchor="start" class="geom-label">E</text>
</svg>
