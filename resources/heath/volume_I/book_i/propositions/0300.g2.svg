<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 155" width="175" height="155" class="euclid-graphic" data-folio="0300" data-graphic="g2" data-proposition="I.20">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="20,133 56.5,92.5 125,133" class="geom-polygon" />
  <polygon id="el-tri-ADC" data-ref="ADC" data-type="polygon" points="56.5,92.5 109,31 125,133" class="geom-polygon" />
  <polygon id="el-tri-DBC" data-ref="DBC" data-type="polygon" points="109,31 20,133 125,133" class="geom-polygon" />

  <!-- Lines -->
  <!-- Base BC -->
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="20" y1="133" x2="125" y2="133" class="geom-line" />

  <!-- Line BD (BA produced to D) -->
  <line id="el-seg-BD" data-ref="BD" data-type="segment" x1="20" y1="133" x2="109" y2="31" class="geom-line" />

  <!-- Side AC -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="56.5" y1="92.5" x2="125" y2="133" class="geom-line" />

  <!-- Line DC -->
  <line id="el-seg-DC" data-ref="DC" data-type="segment" x1="109" y1="31" x2="125" y2="133" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="20" cy="133" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="125" cy="133" r="3.5" class="geom-point" />
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="56.5" cy="92.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="109" cy="31" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-D" data-ref="D" x="101" y="24" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-A" data-ref="A" x="46" y="88" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="16" y="148" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="126" y="148" text-anchor="middle" class="geom-label">C</text>
</svg>
