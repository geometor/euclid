<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 98" width="215" height="98" class="euclid-graphic" data-folio="0301" data-graphic="g2" data-proposition="I.20">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles -->
  <polygon id="el-tri-ABD" data-ref="ABD" data-type="polygon" points="94.5,17.5 15,74.5 113,74.5" class="geom-polygon" />
  <polygon id="el-tri-ADC" data-ref="ADC" data-type="polygon" points="94.5,17.5 113,74.5 171,74.5" class="geom-polygon" />
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="94.5,17.5 15,74.5 171,74.5" class="geom-polygon" />

  <!-- Lines -->
  <!-- Base BC -->
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="15" y1="74.5" x2="171" y2="74.5" class="geom-line" />

  <!-- Side AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="94.5" y1="17.5" x2="15" y2="74.5" class="geom-line" />

  <!-- Side AC -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="94.5" y1="17.5" x2="171" y2="74.5" class="geom-line" />

  <!-- Join line AD (BD = AB) -->
  <line id="el-seg-AD" data-ref="AD" data-type="segment" x1="94.5" y1="17.5" x2="113" y2="74.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="94.5" cy="17.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="15" cy="74.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="113" cy="74.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="171" cy="74.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="89" y="12" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="12" y="86" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-D" data-ref="D" x="113" y="86" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-C" data-ref="C" x="171" y="86" text-anchor="middle" class="geom-label">C</text>
</svg>
