<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 102" width="230" height="102" class="euclid-graphic" data-folio="0302" data-graphic="g2" data-proposition="I.20">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles -->
  <polygon id="el-tri-ABD" data-ref="ABD" data-type="polygon" points="65,23.5 8.5,78.5 63.5,78.5" class="geom-polygon" />
  <polygon id="el-tri-ADE" data-ref="ADE" data-type="polygon" points="65,23.5 63.5,78.5 93.5,78.5" class="geom-polygon" />
  <polygon id="el-tri-AEC" data-ref="AEC" data-type="polygon" points="65,23.5 93.5,78.5 180,78.5" class="geom-polygon" />
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="65,23.5 8.5,78.5 180,78.5" class="geom-polygon" />

  <!-- Lines -->
  <!-- Base BC -->
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="8.5" y1="78.5" x2="180" y2="78.5" class="geom-line" />

  <!-- Side AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="65" y1="23.5" x2="8.5" y2="78.5" class="geom-line" />

  <!-- Side AC -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="65" y1="23.5" x2="180" y2="78.5" class="geom-line" />

  <!-- Line AD (BD cut off equal to BA) -->
  <line id="el-seg-AD" data-ref="AD" data-type="segment" x1="65" y1="23.5" x2="63.5" y2="78.5" class="geom-line" />

  <!-- Line AE (CE cut off equal to CA) -->
  <line id="el-seg-AE" data-ref="AE" data-type="segment" x1="65" y1="23.5" x2="93.5" y2="78.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="65" cy="23.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="8.5" cy="78.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="63.5" cy="78.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="93.5" cy="78.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="180" cy="78.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="65" y="16" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="10" y="90" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-D" data-ref="D" x="64" y="90" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="95" y="90" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-C" data-ref="C" x="181" y="90" text-anchor="middle" class="geom-label">C</text>
</svg>
