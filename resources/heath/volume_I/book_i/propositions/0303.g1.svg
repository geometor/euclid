<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 202 148" width="202" height="148" class="euclid-graphic" data-folio="0303" data-graphic="g1" data-proposition="I.21">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="63.5,21.5 14.5,118.5 188,118.5" class="geom-polygon" />
  <polygon id="el-tri-ABE" data-ref="ABE" data-type="polygon" points="63.5,21.5 14.5,118.5 96,46.5" class="geom-polygon" />
  <polygon id="el-tri-BDC" data-ref="BDC" data-type="polygon" points="14.5,118.5 76.5,64 188,118.5" class="geom-polygon" />
  <polygon id="el-tri-CDE" data-ref="CDE" data-type="polygon" points="188,118.5 76.5,64 96,46.5" class="geom-polygon" />

  <!-- Lines -->
  <!-- Base BC -->
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="14.5" y1="118.5" x2="188" y2="118.5" class="geom-line" />

  <!-- Side AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="63.5" y1="21.5" x2="14.5" y2="118.5" class="geom-line" />

  <!-- Side AC (through E) -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="63.5" y1="21.5" x2="188" y2="118.5" class="geom-line" />

  <!-- Line BE (BD produced to E) -->
  <line id="el-seg-BE" data-ref="BE" data-type="segment" x1="14.5" y1="118.5" x2="96" y2="46.5" class="geom-line" />

  <!-- Line CD -->
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="188" y1="118.5" x2="76.5" y2="64" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="63.5" cy="21.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="14.5" cy="118.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="188" cy="118.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="76.5" cy="64" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="96" cy="46.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="54" y="16" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="12" y="130" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="187" y="130" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="69" y="58" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="105" y="47" text-anchor="start" class="geom-label">E</text>
</svg>
