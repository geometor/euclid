<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 258 158" width="258" height="158" class="euclid-graphic" data-folio="0304" data-graphic="g1" data-proposition="I.21">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="14.5,11 14.5,126 221,126" class="geom-polygon" />
  <polygon id="el-tri-ABD" data-ref="ABD" data-type="polygon" points="14.5,11 14.5,126 128,126" class="geom-polygon" />
  <polygon id="el-tri-AFC" data-ref="AFC" data-type="polygon" points="14.5,11 31,28 221,126" class="geom-polygon" />
  <polygon id="el-tri-FDC" data-ref="FDC" data-type="polygon" points="31,28 128,126 221,126" class="geom-polygon" />

  <!-- Lines -->
  <!-- Base BC -->
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="14.5" y1="126" x2="221" y2="126" class="geom-line" />

  <!-- Leg AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="14.5" y1="11" x2="14.5" y2="126" class="geom-line" />

  <!-- Hypotenuse AC -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="14.5" y1="11" x2="221" y2="126" class="geom-line" />

  <!-- Line AD -->
  <line id="el-seg-AD" data-ref="AD" data-type="segment" x1="14.5" y1="11" x2="128" y2="126" class="geom-line" />

  <!-- Line FC -->
  <line id="el-seg-FC" data-ref="FC" data-type="segment" x1="31" y1="28" x2="221" y2="126" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="14.5" cy="11" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="14.5" cy="126" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="221" cy="126" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="128" cy="126" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="48" cy="45" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="31" cy="28" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="14" y="8" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="16" y="138" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-D" data-ref="D" x="128" y="138" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-C" data-ref="C" x="223" y="138" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-F" data-ref="F" x="26" y="32" text-anchor="end" class="geom-label">F</text>
  <text id="lbl-E" data-ref="E" x="43" y="55" text-anchor="end" class="geom-label">E</text>
</svg>
