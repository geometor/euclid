<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 265" width="520" height="265" class="euclid-graphic" data-folio="0304" data-graphic="g2" data-proposition="I.21">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="49,134.5 200.5,12 352,134.5" class="geom-polygon" />

  <!-- Arcs -->
  <!-- Arc BD (Circle centre A, radius AB) -->
  <path id="el-arc-BD" data-ref="BD" data-type="arc" d="M 200.5,12 A 194.8,194.8 0 0,1 243.8,134.5" class="geom-arc" />

  <!-- Arc MO (Circle centre K, radius KM) -->
  <path id="el-arc-MO" data-ref="MO" data-type="arc" d="M 436,178 A 181.2,181.2 0 0,1 101,134.5" class="geom-arc" />

  <!-- Lines -->
  <!-- Base AC (through L, O, D) -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="49" y1="134.5" x2="352" y2="134.5" class="geom-line" />

  <!-- Side AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="49" y1="134.5" x2="200.5" y2="12" class="geom-line" />

  <!-- Side BC (through N, F, H) -->
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="200.5" y1="12" x2="352" y2="134.5" class="geom-line" />

  <!-- Line AF (Radius through E, G to F) -->
  <line id="el-seg-AF" data-ref="AF" data-type="segment" x1="49" y1="134.5" x2="286" y2="72" class="geom-line" />

  <!-- Line GH (parallel to AC, through K) -->
  <line id="el-seg-GH" data-ref="GH" data-type="segment" x1="253" y1="83" x2="307" y2="83" class="geom-line" />

  <!-- Line KL (parallel to AF) -->
  <line id="el-seg-KL" data-ref="KL" data-type="segment" x1="278" y1="83" x2="104" y2="134.5" class="geom-line" />

  <!-- Line KM (KC produced to M) -->
  <line id="el-seg-KM" data-ref="KM" data-type="segment" x1="278" y1="83" x2="436" y2="178" class="geom-line" />

  <!-- Line KO -->
  <line id="el-seg-KO" data-ref="KO" data-type="segment" x1="278" y1="83" x2="101" y2="134.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="49" cy="134.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="200.5" cy="12" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="352" cy="134.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="243.8" cy="134.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="236" cy="85" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="286" cy="72" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="253" cy="83" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="307" cy="83" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="278" cy="83" r="3.5" class="geom-point" />
  <circle id="el-pt-L" data-ref="L" data-type="point" cx="104" cy="134.5" r="3.5" class="geom-point" />
  <circle id="el-pt-N" data-ref="N" data-type="point" cx="227" cy="31" r="3.5" class="geom-point" />
  <circle id="el-pt-O" data-ref="O" data-type="point" cx="101" cy="134.5" r="3.5" class="geom-point" />
  <circle id="el-pt-M" data-ref="M" data-type="point" cx="436" cy="178" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-B" data-ref="B" x="200.5" y="8" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-A" data-ref="A" x="42" y="142" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-C" data-ref="C" x="366" y="135" text-anchor="start" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="244" y="147" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-N" data-ref="N" x="228" y="24" text-anchor="end" class="geom-label">N</text>
  <text id="lbl-F" data-ref="F" x="290" y="68" text-anchor="start" class="geom-label">F</text>
  <text id="lbl-G" data-ref="G" x="253" y="75" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-H" data-ref="H" x="306" y="80" text-anchor="start" class="geom-label">H</text>
  <text id="lbl-K" data-ref="K" x="276" y="96" text-anchor="middle" class="geom-label">K</text>
  <text id="lbl-E" data-ref="E" x="226" y="82" text-anchor="end" class="geom-label">E</text>
  <text id="lbl-L" data-ref="L" x="114" y="145" text-anchor="start" class="geom-label">L</text>
  <text id="lbl-O" data-ref="O" x="92" y="145" text-anchor="end" class="geom-label">O</text>
  <text id="lbl-M" data-ref="M" x="440" y="174" text-anchor="start" class="geom-label">M</text>
</svg>
