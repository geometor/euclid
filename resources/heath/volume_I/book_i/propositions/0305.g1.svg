<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 325 155" width="325" height="155" class="euclid-graphic" data-folio="0305" data-graphic="g1" data-proposition="I.21">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles -->
  <polygon id="el-tri-AGD" data-ref="AGD" data-type="polygon" points="131.5,21.5 38.8,82.5 131.5,82.5" class="geom-polygon" />
  <polygon id="el-tri-ADE" data-ref="ADE" data-type="polygon" points="131.5,21.5 131.5,82.5 172.5,82.5" class="geom-polygon" />
  <polygon id="el-tri-ADF" data-ref="ADF" data-type="polygon" points="131.5,21.5 131.5,82.5 224.2,82.5" class="geom-polygon" />
  <polygon id="el-tri-AprimeDE" data-ref="AprimeDE" data-type="polygon" points="131.5,143.5 131.5,82.5 172.5,82.5" class="geom-polygon" />
  <polygon id="el-tri-AprimeDF" data-ref="AprimeDF" data-type="polygon" points="131.5,143.5 131.5,82.5 224.2,82.5" class="geom-polygon" />
  <polygon id="el-tri-AEAprime" data-ref="AEAprime" data-type="polygon" points="131.5,21.5 172.5,82.5 131.5,143.5" class="geom-polygon" />
  <polygon id="el-tri-AFAprime" data-ref="AFAprime" data-type="polygon" points="131.5,21.5 224.2,82.5 131.5,143.5" class="geom-polygon" />

  <!-- Lines -->
  <!-- Line BC of unlimited length -->
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="12" y1="82.5" x2="286" y2="82.5" class="geom-line" />

  <!-- Perpendicular AA' (AD produced to A') -->
  <line id="el-seg-AAprime" data-ref="AAprime" data-type="segment" x1="131.5" y1="21.5" x2="131.5" y2="143.5" class="geom-line" />

  <!-- Oblique AG -->
  <line id="el-seg-AG" data-ref="AG" data-type="segment" x1="131.5" y1="21.5" x2="38.8" y2="82.5" class="geom-line" />

  <!-- Oblique AE -->
  <line id="el-seg-AE" data-ref="AE" data-type="segment" x1="131.5" y1="21.5" x2="172.5" y2="82.5" class="geom-line" />

  <!-- Oblique AF -->
  <line id="el-seg-AF" data-ref="AF" data-type="segment" x1="131.5" y1="21.5" x2="224.2" y2="82.5" class="geom-line" />

  <!-- Reflected oblique A'E -->
  <line id="el-seg-AprimeE" data-ref="AprimeE" data-type="segment" x1="131.5" y1="143.5" x2="172.5" y2="82.5" class="geom-line" />

  <!-- Reflected oblique A'F -->
  <line id="el-seg-AprimeF" data-ref="AprimeF" data-type="segment" x1="131.5" y1="143.5" x2="224.2" y2="82.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="131.5" cy="21.5" r="3.5" class="geom-point" />
  <circle id="el-pt-Aprime" data-ref="Aprime" data-type="point" cx="131.5" cy="143.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="131.5" cy="82.5" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="38.8" cy="82.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="172.5" cy="82.5" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="224.2" cy="82.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="131.5" y="14" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-Aprime" data-ref="Aprime" x="131.5" y="153" text-anchor="middle" class="geom-label">A'</text>
  <text id="lbl-D" data-ref="D" x="124" y="76" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="177" y="74" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-F" data-ref="F" x="226" y="74" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-G" data-ref="G" x="40" y="94" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-B" data-ref="B" x="11" y="94" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="264" y="94" text-anchor="middle" class="geom-label">C</text>
</svg>
