<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 505 220" width="505" height="220" class="euclid-graphic" data-folio="0306" data-graphic="g1" data-proposition="I.22">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 2;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-circle:hover, .geom-circle.highlight {
      stroke: #0284c7 !important;
      stroke-width: 3 !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Constructed Triangle KFG -->
  <polygon id="el-tri-KFG" data-ref="KFG" data-type="polygon" points="224.3,50.1 147,107 221,107" class="geom-polygon" />

  <!-- Circles -->
  <!-- Circle DKL with centre F and radius FD -->
  <circle id="el-circ-DKL" data-ref="DKL" data-type="circle" cx="147" cy="107" r="96" class="geom-circle" />

  <!-- Circle KLH with centre G and radius GH -->
  <circle id="el-circ-KLH" data-ref="KLH" data-type="circle" cx="221" cy="107" r="57" class="geom-circle" />

  <!-- Lines -->
  <!-- Line DE of infinite length -->
  <line id="el-seg-DE" data-ref="DE" data-type="segment" x1="51" y1="107" x2="343" y2="107" class="geom-line" />

  <!-- Side KF -->
  <line id="el-seg-KF" data-ref="KF" data-type="segment" x1="224.3" y1="50.1" x2="147" y2="107" class="geom-line" />

  <!-- Side KG -->
  <line id="el-seg-KG" data-ref="KG" data-type="segment" x1="224.3" y1="50.1" x2="221" y2="107" class="geom-line" />

  <!-- Given Straight Lines A, B, C -->
  <line id="el-seg-givenA" data-ref="givenA" data-type="segment" x1="391" y1="88.5" x2="487" y2="88.5" class="geom-line" />
  <line id="el-seg-givenB" data-ref="givenB" data-type="segment" x1="391" y1="107" x2="465" y2="107" class="geom-line" />
  <line id="el-seg-givenC" data-ref="givenC" data-type="segment" x1="391" y1="124.5" x2="449" y2="124.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="51" cy="107" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="147" cy="107" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="221" cy="107" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="278" cy="107" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="224.3" cy="50.1" r="3.5" class="geom-point" />
  <circle id="el-pt-L" data-ref="L" data-type="point" cx="224.3" cy="163.9" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-D" data-ref="D" x="35" y="112" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-F" data-ref="F" x="145" y="117" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-G" data-ref="G" x="218" y="117" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-H" data-ref="H" x="286" y="117" text-anchor="middle" class="geom-label">H</text>
  <text id="lbl-E" data-ref="E" x="336" y="117" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-K" data-ref="K" x="234" y="42" text-anchor="start" class="geom-label">K</text>
  <text id="lbl-L" data-ref="L" x="234" y="176" text-anchor="start" class="geom-label">L</text>
  <text id="lbl-givenA" data-ref="givenA" x="384" y="93" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-givenB" data-ref="givenB" x="383" y="111" text-anchor="end" class="geom-label">B</text>
  <text id="lbl-givenC" data-ref="givenC" x="383" y="129" text-anchor="end" class="geom-label">C</text>
</svg>
