<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" class="euclid-graphic" data-folio="0308" data-graphic="g1" data-proposition="I.23">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles -->
  <!-- Constructed Triangle AFG -->
  <polygon id="el-tri-AFG" data-ref="AFG" data-type="polygon" points="24,128.5 109,35 143,128.5" class="geom-polygon" />

  <!-- Given Angle Triangle CDE -->
  <polygon id="el-tri-CDE" data-ref="CDE" data-type="polygon" points="258,52 379,23 357,118" class="geom-polygon" />

  <!-- Left Figure Lines -->
  <!-- Given line AB (through G) -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="24" y1="128.5" x2="201" y2="128.5" class="geom-line" />

  <!-- Side AF -->
  <line id="el-seg-AF" data-ref="AF" data-type="segment" x1="24" y1="128.5" x2="109" y2="35" class="geom-line" />

  <!-- Side FG -->
  <line id="el-seg-FG" data-ref="FG" data-type="segment" x1="109" y1="35" x2="143" y2="128.5" class="geom-line" />

  <!-- Right Figure Lines -->
  <!-- Ray CD produced -->
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="258" y1="52" x2="430" y2="7" class="geom-line" />

  <!-- Ray CE produced -->
  <line id="el-seg-CE" data-ref="CE" data-type="segment" x1="258" y1="52" x2="397" y2="139" class="geom-line" />

  <!-- Base DE -->
  <line id="el-seg-DE" data-ref="DE" data-type="segment" x1="379" y1="23" x2="357" y2="118" class="geom-line" />

  <!-- Points -->
  <!-- Left Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="24" cy="128.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="201" cy="128.5" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="109" cy="35" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="143" cy="128.5" r="3.5" class="geom-point" />

  <!-- Right Points -->
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="258" cy="52" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="379" cy="23" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="357" cy="118" r="3.5" class="geom-point" />

  <!-- Labels -->
  <!-- Left Labels -->
  <text id="lbl-A" data-ref="A" x="18" y="134" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="207" y="134" text-anchor="start" class="geom-label">B</text>
  <text id="lbl-F" data-ref="F" x="111" y="24" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-G" data-ref="G" x="141" y="142" text-anchor="middle" class="geom-label">G</text>

  <!-- Right Labels -->
  <text id="lbl-C" data-ref="C" x="246" y="55" text-anchor="end" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="382" y="14" text-anchor="start" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="350" y="130" text-anchor="end" class="geom-label">E</text>
</svg>
