<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="520" height="130" class="euclid-graphic" data-folio="0309" data-graphic="g1" data-proposition="I.23">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 2;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-circle:hover, .geom-circle.highlight {
      stroke: #0284c7 !important;
      stroke-width: 3 !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles -->
  <!-- Constructed Triangle KAG -->
  <polygon id="el-tri-KAG" data-ref="KAG" data-type="polygon" points="101.7,29 76,63.5 152,63.5" class="geom-polygon" />

  <!-- Given Triangle CDE -->
  <polygon id="el-tri-CDE" data-ref="CDE" data-type="polygon" points="281,62.5 307,28 357,62.5" class="geom-polygon" />

  <!-- Circles -->
  <!-- Circle with centre A and radius AF -->
  <circle id="el-circ-A" data-ref="circA" data-type="circle" cx="76" cy="63.5" r="43" class="geom-circle" />

  <!-- Circle with centre G and radius GH -->
  <circle id="el-circ-G" data-ref="circG" data-type="circle" cx="152" cy="63.5" r="61" class="geom-circle" />

  <!-- Lines -->
  <!-- Left Baseline FB (through A, G, H) -->
  <line id="el-seg-FB" data-ref="FB" data-type="segment" x1="33" y1="63.5" x2="236" y2="63.5" class="geom-line" />

  <!-- Side KA -->
  <line id="el-seg-KA" data-ref="KA" data-type="segment" x1="101.7" y1="29" x2="76" y2="63.5" class="geom-line" />

  <!-- Side KG -->
  <line id="el-seg-KG" data-ref="KG" data-type="segment" x1="101.7" y1="29" x2="152" y2="63.5" class="geom-line" />

  <!-- Right Figure Lines -->
  <!-- Ray CD produced -->
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="281" y1="62.5" x2="329" y2="4" class="geom-line" />

  <!-- Ray CE produced -->
  <line id="el-seg-CE" data-ref="CE" data-type="segment" x1="281" y1="62.5" x2="387" y2="62.5" class="geom-line" />

  <!-- Line DE -->
  <line id="el-seg-DE" data-ref="DE" data-type="segment" x1="307" y1="28" x2="357" y2="62.5" class="geom-line" />

  <!-- Points -->
  <!-- Left Points -->
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="33" cy="63.5" r="3.5" class="geom-point" />
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="76" cy="63.5" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="152" cy="63.5" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="213" cy="63.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="236" cy="63.5" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="101.7" cy="29" r="3.5" class="geom-point" />

  <!-- Right Points -->
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="281" cy="62.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="307" cy="28" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="357" cy="62.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <!-- Left Labels -->
  <text id="lbl-F" data-ref="F" x="25" y="72" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-A" data-ref="A" x="76" y="73" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-G" data-ref="G" x="154" y="73" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-H" data-ref="H" x="215" y="73" text-anchor="middle" class="geom-label">H</text>
  <text id="lbl-B" data-ref="B" x="237" y="73" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-K" data-ref="K" x="101.7" y="20" text-anchor="middle" class="geom-label">K</text>

  <!-- Right Labels -->
  <text id="lbl-C" data-ref="C" x="281" y="73" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="301" y="26" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="358" y="73" text-anchor="middle" class="geom-label">E</text>
</svg>
