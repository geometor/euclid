    <line id="el-seg-AF" data-ref="/ A F /" data-aliases="/ F A /;AF;FA" data-type="segment" x1="33" y1="168.5" x2="159.8" y2="130" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /;AB;BA" data-type="segment" x1="33" y1="168.5" x2="160.9" y2="203" class="geom-line" />
    <line id="el-seg-BF" data-ref="/ B F /" data-aliases="/ F B /;BF;FB" data-type="segment" x1="160.9" y1="203" x2="159.8" y2="130" class="geom-line geom-overlay" />
