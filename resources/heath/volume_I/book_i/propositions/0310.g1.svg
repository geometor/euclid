    <path id="el-ang-FAB" data-ref="&lt; F A B )" data-aliases="&lt; B A F );( A F )&lt; F A B &gt;;( A B )&lt; B A F &gt;" data-type="wedge" d="M 33 168.5 L 52.14 162.69 A 20.0 20.0 0 0 1 52.31 173.71 Z" class="wedge angle geom-overlay" />
