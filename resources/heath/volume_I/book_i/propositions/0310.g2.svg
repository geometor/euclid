<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 162" width="300" height="162" class="euclid-graphic" data-folio="0310" data-graphic="g2" data-proposition="I.24">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles -->
  <!-- Left Triangle ABC -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="46.5,39.5 10.5,140 101,114" class="geom-polygon" />

  <!-- Right Triangles -->
  <!-- Given Triangle DEF -->
  <polygon id="el-tri-DEF" data-ref="DEF" data-type="polygon" points="207.5,34.5 172.5,135 208,138" class="geom-polygon" />

  <!-- Constructed Triangle DEG -->
  <polygon id="el-tri-DEG" data-ref="DEG" data-type="polygon" points="207.5,34.5 172.5,135 260,110" class="geom-polygon" />

  <!-- Triangle DFG -->
  <polygon id="el-tri-DFG" data-ref="DFG" data-type="polygon" points="207.5,34.5 208,138 260,110" class="geom-polygon" />

  <!-- Triangle EFG -->
  <polygon id="el-tri-EFG" data-ref="EFG" data-type="polygon" points="172.5,135 208,138 260,110" class="geom-polygon" />

  <!-- Left Figure Lines -->
  <!-- Side AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="46.5" y1="39.5" x2="10.5" y2="140" class="geom-line" />

  <!-- Side AC -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="46.5" y1="39.5" x2="101" y2="114" class="geom-line" />

  <!-- Base BC -->
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="10.5" y1="140" x2="101" y2="114" class="geom-line" />

  <!-- Right Figure Lines -->
  <!-- Side DE -->
  <line id="el-seg-DE" data-ref="DE" data-type="segment" x1="207.5" y1="34.5" x2="172.5" y2="135" class="geom-line" />

  <!-- Side DF -->
  <line id="el-seg-DF" data-ref="DF" data-type="segment" x1="207.5" y1="34.5" x2="208" y2="138" class="geom-line" />

  <!-- Base EF -->
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="172.5" y1="135" x2="208" y2="138" class="geom-line" />

  <!-- Constructed Side DG -->
  <line id="el-seg-DG" data-ref="DG" data-type="segment" x1="207.5" y1="34.5" x2="260" y2="110" class="geom-line" />

  <!-- Base EG -->
  <line id="el-seg-EG" data-ref="EG" data-type="segment" x1="172.5" y1="135" x2="260" y2="110" class="geom-line" />

  <!-- Join line FG -->
  <line id="el-seg-FG" data-ref="FG" data-type="segment" x1="208" y1="138" x2="260" y2="110" class="geom-line" />

  <!-- Points -->
  <!-- Left Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="46.5" cy="39.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="10.5" cy="140" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="101" cy="114" r="3.5" class="geom-point" />

  <!-- Right Points -->
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="207.5" cy="34.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="172.5" cy="135" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="208" cy="138" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="260" cy="110" r="3.5" class="geom-point" />

  <!-- Labels -->
  <!-- Left Labels -->
  <text id="lbl-A" data-ref="A" x="47" y="32" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="10" y="153" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="108" y="117" text-anchor="start" class="geom-label">C</text>

  <!-- Right Labels -->
  <text id="lbl-D" data-ref="D" x="208" y="27" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="166" y="142" text-anchor="end" class="geom-label">E</text>
  <text id="lbl-F" data-ref="F" x="208" y="154" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-G" data-ref="G" x="266" y="112" text-anchor="start" class="geom-label">G</text>
</svg>
