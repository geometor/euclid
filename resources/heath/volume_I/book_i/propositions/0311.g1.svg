<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" width="320" height="130" class="euclid-graphic" data-folio="0311" data-graphic="g1" data-proposition="I.24">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles -->
  <!-- Left Triangle ABC -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="97.5,31.5 10,111 127.5,111" class="geom-polygon" />

  <!-- Right Triangles -->
  <!-- Given Triangle DEF -->
  <polygon id="el-tri-DEF" data-ref="DEF" data-type="polygon" points="251.5,31.5 161,111 224.5,111" class="geom-polygon" />

  <!-- Constructed Triangle DEG -->
  <polygon id="el-tri-DEG" data-ref="DEG" data-type="polygon" points="251.5,31.5 161,111 280,111" class="geom-polygon" />

  <!-- Triangle DFG -->
  <polygon id="el-tri-DFG" data-ref="DFG" data-type="polygon" points="251.5,31.5 224.5,111 280,111" class="geom-polygon" />

  <!-- Left Figure Lines -->
  <!-- Side AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="97.5" y1="31.5" x2="10" y2="111" class="geom-line" />

  <!-- Side AC -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="97.5" y1="31.5" x2="127.5" y2="111" class="geom-line" />

  <!-- Base BC -->
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="10" y1="111" x2="127.5" y2="111" class="geom-line" />

  <!-- Right Figure Lines -->
  <!-- Side DE -->
  <line id="el-seg-DE" data-ref="DE" data-type="segment" x1="251.5" y1="31.5" x2="161" y2="111" class="geom-line" />

  <!-- Side DF -->
  <line id="el-seg-DF" data-ref="DF" data-type="segment" x1="251.5" y1="31.5" x2="224.5" y2="111" class="geom-line" />

  <!-- Side DG -->
  <line id="el-seg-DG" data-ref="DG" data-type="segment" x1="251.5" y1="31.5" x2="280" y2="111" class="geom-line" />

  <!-- Base EG (through F) -->
  <line id="el-seg-EG" data-ref="EG" data-type="segment" x1="161" y1="111" x2="280" y2="111" class="geom-line" />

  <!-- Points -->
  <!-- Left Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="97.5" cy="31.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="10" cy="111" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="127.5" cy="111" r="3.5" class="geom-point" />

  <!-- Right Points -->
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="251.5" cy="31.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="161" cy="111" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="224.5" cy="111" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="280" cy="111" r="3.5" class="geom-point" />

  <!-- Labels -->
  <!-- Left Labels -->
  <text id="lbl-A" data-ref="A" x="98" y="24" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="8" y="121" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="126" y="121" text-anchor="middle" class="geom-label">C</text>

  <!-- Right Labels -->
  <text id="lbl-D" data-ref="D" x="253" y="24" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="161" y="121" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-F" data-ref="F" x="222" y="121" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-G" data-ref="G" x="281" y="121" text-anchor="middle" class="geom-label">G</text>
</svg>
