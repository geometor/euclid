<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 170" width="150" height="170" class="euclid-graphic" data-folio="0312" data-graphic="g1" data-proposition="I.24">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles -->
  <polygon id="el-tri-DEG" data-ref="DEG" data-type="polygon" points="50.5,33.5 18,147 98,90" class="geom-polygon" />
  <polygon id="el-tri-DEH" data-ref="DEH" data-type="polygon" points="50.5,33.5 18,147 51,123.5" class="geom-polygon" />
  <polygon id="el-tri-DGH" data-ref="DGH" data-type="polygon" points="50.5,33.5 98,90 51,123.5" class="geom-polygon" />

  <!-- Lines -->
  <!-- Side DE -->
  <line id="el-seg-DE" data-ref="DE" data-type="segment" x1="50.5" y1="33.5" x2="18" y2="147" class="geom-line" />

  <!-- Side DG -->
  <line id="el-seg-DG" data-ref="DG" data-type="segment" x1="50.5" y1="33.5" x2="98" y2="90" class="geom-line" />

  <!-- Base EG -->
  <line id="el-seg-EG" data-ref="EG" data-type="segment" x1="18" y1="147" x2="98" y2="90" class="geom-line" />

  <!-- Line DF (meeting EG in H and produced to F) -->
  <line id="el-seg-DF" data-ref="DF" data-type="segment" x1="50.5" y1="33.5" x2="51.5" y2="148" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="50.5" cy="33.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="18" cy="147" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="98" cy="90" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="51" cy="123.5" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="51.5" cy="148" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-D" data-ref="D" x="43" y="28" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="15" y="153" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-G" data-ref="G" x="105" y="92" text-anchor="start" class="geom-label">G</text>
  <text id="lbl-H" data-ref="H" x="44" y="118" text-anchor="end" class="geom-label">H</text>
  <text id="lbl-F" data-ref="F" x="58" y="156" text-anchor="start" class="geom-label">F</text>
</svg>
