<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 328 139" width="328" height="139" class="euclid-graphic" data-folio="0313" data-graphic="g1" data-proposition="I.25">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="60.5,24 12,114.5 144,114.5" class="geom-polygon" />
  <polygon id="el-tri-DEF" data-ref="DEF" data-type="polygon" points="236,23 220.5,114.5 313,114.5" class="geom-polygon" />

  <!-- Lines -->
  <!-- Triangle ABC -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="60.5" y1="24" x2="12" y2="114.5" class="geom-line" />
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="60.5" y1="24" x2="144" y2="114.5" class="geom-line" />
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="12" y1="114.5" x2="144" y2="114.5" class="geom-line" />

  <!-- Triangle DEF -->
  <line id="el-seg-DE" data-ref="DE" data-type="segment" x1="236" y1="23" x2="220.5" y2="114.5" class="geom-line" />
  <line id="el-seg-DF" data-ref="DF" data-type="segment" x1="236" y1="23" x2="313" y2="114.5" class="geom-line" />
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="220.5" y1="114.5" x2="313" y2="114.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="60.5" cy="24" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="12" cy="114.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="144" cy="114.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="236" cy="23" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="220.5" cy="114.5" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="313" cy="114.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="61" y="17" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="13" y="127" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="144" y="127" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="236" y="16" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="220.5" y="127" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-F" data-ref="F" x="313" y="127" text-anchor="middle" class="geom-label">F</text>
</svg>
