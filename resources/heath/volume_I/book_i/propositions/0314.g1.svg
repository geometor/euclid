<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 183" width="390" height="183" class="euclid-graphic" data-folio="0314" data-graphic="g1" data-proposition="I.25">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Polygons -->
  <!-- Left Figure: Triangles -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="103,19 79.5,89.5 223.5,89.5" class="geom-polygon" />
  <polygon id="el-tri-ABH" data-ref="ABH" data-type="polygon" points="103,19 79.5,89.5 53.5,166" class="geom-polygon" />
  <polygon id="el-tri-BHG" data-ref="BHG" data-type="polygon" points="79.5,89.5 53.5,166 168,89.5" class="geom-polygon" />
  <polygon id="el-tri-AHK" data-ref="AHK" data-type="polygon" points="103,19 53.5,166 193,71.5" class="geom-polygon" />
  <polygon id="el-tri-KGC" data-ref="KGC" data-type="polygon" points="193,71.5 168,89.5 223.5,89.5" class="geom-polygon" />

  <!-- Right Figure: Triangle DEF -->
  <polygon id="el-tri-DEF" data-ref="DEF" data-type="polygon" points="268.5,15 284.5,89.5 383.5,89.5" class="geom-polygon" />

  <!-- Lines -->
  <!-- Left Figure Lines -->
  <!-- Line AH -->
  <line id="el-seg-AH" data-ref="AH" data-type="segment" x1="103" y1="19" x2="53.5" y2="166" class="geom-line" />

  <!-- Side AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="103" y1="19" x2="79.5" y2="89.5" class="geom-line" />

  <!-- Side AC (passes through K) -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="103" y1="19" x2="223.5" y2="89.5" class="geom-line" />

  <!-- Base BC (and extension to AH) -->
  <line id="el-seg-base-ext" x1="66.5" y1="89.5" x2="79.5" y2="89.5" class="geom-line" />
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="79.5" y1="89.5" x2="223.5" y2="89.5" class="geom-line" />

  <!-- Line BH -->
  <line id="el-seg-BH" data-ref="BH" data-type="segment" x1="79.5" y1="89.5" x2="53.5" y2="166" class="geom-line" />

  <!-- Line HK (passes through G to AC at K) -->
  <line id="el-seg-HK" data-ref="HK" data-type="segment" x1="53.5" y1="166" x2="193" y2="71.5" class="geom-line" />

  <!-- Right Figure Lines (Triangle DEF) -->
  <line id="el-seg-DE" data-ref="DE" data-type="segment" x1="268.5" y1="15" x2="284.5" y2="89.5" class="geom-line" />
  <line id="el-seg-DF" data-ref="DF" data-type="segment" x1="268.5" y1="15" x2="383.5" y2="89.5" class="geom-line" />
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="284.5" y1="89.5" x2="383.5" y2="89.5" class="geom-line" />

  <!-- Points -->
  <!-- Left Figure Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="103" cy="19" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="79.5" cy="89.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="223.5" cy="89.5" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="168" cy="89.5" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="53.5" cy="166" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="193" cy="71.5" r="3.5" class="geom-point" />

  <!-- Right Figure Points -->
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="268.5" cy="15" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="284.5" cy="89.5" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="383.5" cy="89.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <!-- Left Figure Labels -->
  <text id="lbl-A" data-ref="A" x="103" y="12" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="58" y="96" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="225" y="103" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-G" data-ref="G" x="173" y="103" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-H" data-ref="H" x="52" y="178" text-anchor="middle" class="geom-label">H</text>
  <text id="lbl-K" data-ref="K" x="202" y="68" text-anchor="start" class="geom-label">K</text>

  <!-- Right Figure Labels -->
  <text id="lbl-D" data-ref="D" x="268.5" y="8" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="284.5" y="103" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-F" data-ref="F" x="383.5" y="103" text-anchor="middle" class="geom-label">F</text>
</svg>
