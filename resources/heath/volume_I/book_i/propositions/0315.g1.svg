<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260" class="euclid-graphic" data-folio="0315" data-graphic="g1" data-proposition="I.25">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Polygons -->
  <!-- Left Figure: Triangle ABC -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="74,141 35,211.5 164.5,211.5" class="geom-polygon" />

  <!-- Right Figure: Triangles -->
  <polygon id="el-tri-DEF" data-ref="DEF" data-type="polygon" points="219,131 206.5,211.5 299,211.5" class="geom-polygon" />
  <polygon id="el-tri-DEK" data-ref="DEK" data-type="polygon" points="219,131 206.5,211.5 327.3,163.4" class="geom-polygon" />
  <polygon id="el-tri-DFK" data-ref="DFK" data-type="polygon" points="219,131 299,211.5 327.3,163.4" class="geom-polygon" />

  <!-- Arcs -->
  <!-- Circle FKH with centre D and radius DF (= 113) passing through H, K, F -->
  <path id="el-arc-FKH" data-ref="FKH" data-type="arc" d="M 236.3 19.5 A 113 113 0 1 1 183.5 238.3" class="geom-line" style="fill:none;" />

  <!-- Circle arc KG with centre E and radius EG (= 130) passing through G and K -->
  <path id="el-arc-KG" data-ref="KG" data-type="arc" d="M 336.5 211.5 A 130 130 0 0 0 324.3 156.6" class="geom-line" style="fill:none;" />

  <!-- Lines -->
  <!-- Left Figure Lines -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="74" y1="141" x2="35" y2="211.5" class="geom-line" />
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="74" y1="141" x2="164.5" y2="211.5" class="geom-line" />
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="35" y1="211.5" x2="164.5" y2="211.5" class="geom-line" />

  <!-- Right Figure Lines -->
  <!-- Line EH (ED produced to H) -->
  <line id="el-seg-EH" data-ref="EH" data-type="segment" x1="206.5" y1="211.5" x2="236.3" y2="19.5" class="geom-line" />

  <!-- Line EG (EF produced to G) -->
  <line id="el-seg-EG" data-ref="EG" data-type="segment" x1="206.5" y1="211.5" x2="336.5" y2="211.5" class="geom-line" />

  <!-- Side DF -->
  <line id="el-seg-DF" data-ref="DF" data-type="segment" x1="219" y1="131" x2="299" y2="211.5" class="geom-line" />

  <!-- Radius DK -->
  <line id="el-seg-DK" data-ref="DK" data-type="segment" x1="219" y1="131" x2="327.3" y2="163.4" class="geom-line" />

  <!-- Radius EK -->
  <line id="el-seg-EK" data-ref="EK" data-type="segment" x1="206.5" y1="211.5" x2="327.3" y2="163.4" class="geom-line" />

  <!-- Points -->
  <!-- Left Figure Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="74" cy="141" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="35" cy="211.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="164.5" cy="211.5" r="3.5" class="geom-point" />

  <!-- Right Figure Points -->
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="219" cy="131" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="206.5" cy="211.5" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="299" cy="211.5" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="336.5" cy="211.5" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="236.3" cy="19.5" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="327.3" cy="163.4" r="3.5" class="geom-point" />

  <!-- Labels -->
  <!-- Left Figure Labels -->
  <text id="lbl-A" data-ref="A" x="75.5" y="134" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="33.4" y="226" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="162.3" y="226" text-anchor="middle" class="geom-label">C</text>

  <!-- Right Figure Labels -->
  <text id="lbl-D" data-ref="D" x="211.5" y="133" text-anchor="end" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="204" y="226" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-F" data-ref="F" x="298" y="226" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-G" data-ref="G" x="338" y="226" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-H" data-ref="H" x="238" y="14" text-anchor="middle" class="geom-label">H</text>
  <text id="lbl-K" data-ref="K" x="337" y="163" text-anchor="start" class="geom-label">K</text>
</svg>
