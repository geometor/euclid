    .geom-label-roman {
      font-size: 14.5px;
      font-weight: bold;
      font-style: normal;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-size: 11px;
      font-weight: bold;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sub {
      font-size: 11px;
      font-style: normal;
      font-weight: bold;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: var(--geom-accent) !important;
      cursor: pointer;
