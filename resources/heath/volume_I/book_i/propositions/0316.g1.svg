<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 333 135" width="333" height="135" class="euclid-graphic" data-folio="0316" data-graphic="g1" data-proposition="I.26">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Polygons -->
  <!-- Left Figure: Triangles -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="32.5,19 13,117 127,117" class="geom-polygon" />
  <polygon id="el-tri-GBC" data-ref="GBC" data-type="polygon" points="26.5,47 13,117 127,117" class="geom-polygon" />
  <polygon id="el-tri-AGC" data-ref="AGC" data-type="polygon" points="32.5,19 26.5,47 127,117" class="geom-polygon" />

  <!-- Right Figure: Triangle DEF -->
  <polygon id="el-tri-DEF" data-ref="DEF" data-type="polygon" points="224.5,18.5 207.5,117 317.5,117" class="geom-polygon" />

  <!-- Lines -->
  <!-- Left Figure Lines -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="32.5" y1="19" x2="13" y2="117" class="geom-line" />
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="32.5" y1="19" x2="127" y2="117" class="geom-line" />
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="13" y1="117" x2="127" y2="117" class="geom-line" />
  <line id="el-seg-GC" data-ref="GC" data-type="segment" x1="26.5" y1="47" x2="127" y2="117" class="geom-line" />

  <!-- Right Figure Lines -->
  <line id="el-seg-DE" data-ref="DE" data-type="segment" x1="224.5" y1="18.5" x2="207.5" y2="117" class="geom-line" />
  <line id="el-seg-DF" data-ref="DF" data-type="segment" x1="224.5" y1="18.5" x2="317.5" y2="117" class="geom-line" />
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="207.5" y1="117" x2="317.5" y2="117" class="geom-line" />

  <!-- Points -->
  <!-- Left Figure Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="32.5" cy="19" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="13" cy="117" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="127" cy="117" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="26.5" cy="47" r="3.5" class="geom-point" />

  <!-- Right Figure Points -->
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="224.5" cy="18.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="207.5" cy="117" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="317.5" cy="117" r="3.5" class="geom-point" />

  <!-- Labels -->
  <!-- Left Figure Labels -->
  <text id="lbl-A" data-ref="A" x="25" y="15" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="14.5" y="127" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="127.5" y="127" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-G" data-ref="G" x="19.5" y="47" text-anchor="end" class="geom-label">G</text>

  <!-- Right Figure Labels -->
  <text id="lbl-D" data-ref="D" x="224.5" y="13" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="208" y="127" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-F" data-ref="F" x="317" y="127" text-anchor="middle" class="geom-label">F</text>
</svg>
