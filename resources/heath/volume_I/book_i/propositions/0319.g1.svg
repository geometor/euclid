    <path id="wedge-D-C-E" data-ref="&lt; D C E )" data-aliases="( C D )&lt; D C E &gt; | ( C E )&lt; D C E &gt;" class="wedge angle geom-overlay" d="M 111.5 128.5 L 95.39 128.5 A 16.1 16.1 0 0 0 111.5 144.61 Z" />
