<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240" width="160" height="240" class="euclid-graphic" data-folio="0319" data-graphic="g1" data-proposition="I.26">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Polygons -->
  <polygon id="el-tri-BAD" data-ref="BAD" data-type="polygon" points="22,128.5 22,22 66.75,128.5" class="geom-polygon" />
  <polygon id="el-tri-ECD" data-ref="ECD" data-type="polygon" points="111.5,128.5 111.5,235 66.75,128.5" class="geom-polygon" />

  <!-- Lines -->
  <!-- Distance to inaccessible point AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="22" y1="128.5" x2="22" y2="22" class="geom-line" />

  <!-- Measured line AC (bisected at D) -->
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="22" y1="128.5" x2="111.5" y2="128.5" class="geom-line" />

  <!-- Perpendicular CE equal to AB -->
  <line id="el-seg-CE" data-ref="CE" data-type="segment" x1="111.5" y1="128.5" x2="111.5" y2="235" class="geom-line" />

  <!-- Line of sight BDE (straight line through D) -->
  <line id="el-seg-BE" data-ref="BE" data-type="segment" x1="22" y1="22" x2="111.5" y2="235" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="22" cy="128.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="22" cy="22" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="111.5" cy="128.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="66.75" cy="128.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="111.5" cy="235" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="22" y="146" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="14" y="26" text-anchor="end" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="116" y="122" text-anchor="start" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="72" y="119" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="123" y="236" text-anchor="start" class="geom-label">E</text>
</svg>
