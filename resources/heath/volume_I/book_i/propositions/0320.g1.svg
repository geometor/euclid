<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 116" width="510" height="116" class="euclid-graphic" data-folio="0320" data-graphic="g1" data-proposition="I.26">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Polygons -->
  <!-- Fig 1: Triangle ABC -->
  <polygon id="el-tri-ABC" data-ref="ABC" data-type="polygon" points="111,23 18,98 151,98" class="geom-polygon" />

  <!-- Fig 2: Triangle DEF (original triangle) -->
  <polygon id="el-tri-DEF1" data-ref="DEF1" data-type="polygon" points="281,23 190,98 248,98" class="geom-polygon" />

  <!-- Fig 3: Triangles DEF, DFG, DEG -->
  <polygon id="el-tri-DEF2" data-ref="DEF2" data-type="polygon" points="414,22 322,98 380,98" class="geom-polygon" />
  <polygon id="el-tri-DFG" data-ref="DFG" data-type="polygon" points="414,22 380,98 457,98" class="geom-polygon" />
  <polygon id="el-tri-DEG" data-ref="DEG" data-type="polygon" points="414,22 322,98 457,98" class="geom-polygon" />

  <!-- Lines -->
  <!-- Fig 1 Lines -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="111" y1="23" x2="18" y2="98" class="geom-line" />
  <line id="el-seg-AC" data-ref="AC" data-type="segment" x1="111" y1="23" x2="151" y2="98" class="geom-line" />
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="18" y1="98" x2="151" y2="98" class="geom-line" />

  <!-- Fig 2 Lines -->
  <line id="el-seg-DE1" data-ref="DE1" data-type="segment" x1="281" y1="23" x2="190" y2="98" class="geom-line" />
  <line id="el-seg-DF1" data-ref="DF1" data-type="segment" x1="281" y1="23" x2="248" y2="98" class="geom-line" />
  <line id="el-seg-EF1" data-ref="EF1" data-type="segment" x1="190" y1="98" x2="248" y2="98" class="geom-line" />

  <!-- Fig 3 Lines -->
  <line id="el-seg-DE2" data-ref="DE2" data-type="segment" x1="414" y1="22" x2="322" y2="98" class="geom-line" />
  <line id="el-seg-DF2" data-ref="DF2" data-type="segment" x1="414" y1="22" x2="380" y2="98" class="geom-line" />
  <line id="el-seg-DG" data-ref="DG" data-type="segment" x1="414" y1="22" x2="457" y2="98" class="geom-line" />
  <line id="el-seg-EG" data-ref="EG" data-type="segment" x1="322" y1="98" x2="457" y2="98" class="geom-line" />

  <!-- Points -->
  <!-- Fig 1 Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="111" cy="23" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="18" cy="98" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="151" cy="98" r="3.5" class="geom-point" />

  <!-- Fig 2 Points -->
  <circle id="el-pt-D1" data-ref="D1" data-type="point" cx="281" cy="23" r="3.5" class="geom-point" />
  <circle id="el-pt-E1" data-ref="E1" data-type="point" cx="190" cy="98" r="3.5" class="geom-point" />
  <circle id="el-pt-F1" data-ref="F1" data-type="point" cx="248" cy="98" r="3.5" class="geom-point" />

  <!-- Fig 3 Points -->
  <circle id="el-pt-D2" data-ref="D2" data-type="point" cx="414" cy="22" r="3.5" class="geom-point" />
  <circle id="el-pt-E2" data-ref="E2" data-type="point" cx="322" cy="98" r="3.5" class="geom-point" />
  <circle id="el-pt-F2" data-ref="F2" data-type="point" cx="380" cy="98" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="457" cy="98" r="3.5" class="geom-point" />

  <!-- Labels -->
  <!-- Fig 1 Labels -->
  <text id="lbl-A" data-ref="A" x="113" y="17" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="18" y="108" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="151" y="108" text-anchor="middle" class="geom-label">C</text>

  <!-- Fig 2 Labels -->
  <text id="lbl-D1" data-ref="D1" x="283" y="17" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E1" data-ref="E1" x="190" y="108" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-F1" data-ref="F1" x="248" y="108" text-anchor="middle" class="geom-label">F</text>

  <!-- Fig 3 Labels -->
  <text id="lbl-D2" data-ref="D2" x="414" y="15" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E2" data-ref="E2" x="322" y="108" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-F2" data-ref="F2" x="380" y="108" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-G" data-ref="G" x="457" y="108" text-anchor="middle" class="geom-label">G</text>
</svg>
