    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-dot {
      fill: var(--geom-fg);
      stroke: none;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-label {
      font-size: 14.5px;
      font-weight: bold;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-roman {
      font-size: 14.5px;
      font-weight: bold;
      font-style: normal;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-size: 11px;
      font-weight: bold;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sub {
      font-size: 11px;
      font-style: normal;
      font-weight: bold;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
