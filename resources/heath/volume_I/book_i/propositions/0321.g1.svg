<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 125" width="230" height="125" class="euclid-graphic" data-folio="0321" data-graphic="g1" data-proposition="I.27">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Hypothetical Triangle GEF in Reductio Proof -->
  <polygon id="el-tri-GEF" data-ref="GEF" data-type="polygon" points="95,29 150,29 207,51 150,77 70,77" class="geom-polygon" />

  <!-- Lines -->
  <!-- Line AB (with E on it) -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="20" y1="29" x2="150" y2="29" class="geom-line" />

  <!-- Line CD (with F on it) -->
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="20" y1="77" x2="150" y2="77" class="geom-line" />

  <!-- Produced line BG meeting at G -->
  <line id="el-seg-BG" data-ref="BG" data-type="segment" x1="150" y1="29" x2="207" y2="51" class="geom-line" />

  <!-- Produced line DG meeting at G -->
  <line id="el-seg-DG" data-ref="DG" data-type="segment" x1="150" y1="77" x2="207" y2="51" class="geom-line" />

  <!-- Transversal EF falling on AB and CD, extended at both ends -->
  <line id="el-seg-transversal" data-ref="EF" data-type="segment" x1="105" y1="10" x2="50" y2="115" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="20" cy="29" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="150" cy="29" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="20" cy="77" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="150" cy="77" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="95" cy="29" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="70" cy="77" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="207" cy="51" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="16" y="21" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="156" y="21" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="15" y="87" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="156" y="87" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="90" y="21" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-F" data-ref="F" x="75" y="87" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-G" data-ref="G" x="215" y="55" text-anchor="start" class="geom-label">G</text>
</svg>
