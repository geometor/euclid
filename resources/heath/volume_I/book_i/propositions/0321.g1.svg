<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 125" class="euclid-graphic" data-graphic-id="0321.g1">
  <title>Euclid's Elements, Book I, Proposition 27</title>
  <desc>Straight line EF falling on straight lines AB and CD making alternate angles AEF and EFD equal, with hypothetical meeting at G.</desc>

  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-line-dashed {
      stroke: #000000;
      stroke-width: 2;
      stroke-dasharray: 5,4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge:hover, path.wedge.highlight, path.wedge.geom-highlight-active,
    path.angle:hover, path.angle.highlight, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <g id="elements">
    <line id="line-A-B" data-ref="[ A B ]" class="geom-line" x1="20" y1="29" x2="150" y2="29" />
    <line id="line-C-D" data-ref="[ C D ]" class="geom-line" x1="20" y1="77" x2="150" y2="77" />
    <line id="line-B-G" data-ref="[ B G ]" data-aliases="[ A G ] | / B G /" class="geom-line" x1="150" y1="29" x2="207" y2="51" />
    <line id="line-D-G" data-ref="[ D G ]" data-aliases="[ C G ] | / D G /" class="geom-line" x1="150" y1="77" x2="207" y2="51" />
    <line id="line-E-F" data-ref="[ E F ]" class="geom-line" x1="95" y1="29" x2="70" y2="77" />
  </g>

  <g id="graphics">
    <polygon id="polygon-G-E-F" data-ref="&lt; G E F &gt;" class="geom-polygon" points="207,51 95,29 70,77" />
    <line id="segment-A-B" data-ref="/ A B /" class="geom-line" x1="20" y1="29" x2="150" y2="29" />
    <line id="segment-C-D" data-ref="/ C D /" class="geom-line" x1="20" y1="77" x2="150" y2="77" />
    <line id="segment-B-G" data-ref="/ B G /" class="geom-line" x1="150" y1="29" x2="207" y2="51" />
    <line id="segment-D-G" data-ref="/ D G /" class="geom-line" x1="150" y1="77" x2="207" y2="51" />
    <line id="segment-E-F" data-ref="/ E F /" class="geom-line" x1="95" y1="29" x2="70" y2="77" />
    <line id="section-A-E-B" data-ref="/ A E B /" data-aliases="} A E B { | / A B /" class="geom-line geom-overlay" x1="20" y1="29" x2="150" y2="29" />
    <line id="section-C-F-D" data-ref="/ C F D /" data-aliases="} C F D { | / C D /" class="geom-line geom-overlay" x1="20" y1="77" x2="150" y2="77" />
  </g>

  <g id="highlights">
    <line id="highlight-segment-A-E" data-ref="/ A E /" class="geom-line geom-overlay" x1="20" y1="29" x2="95" y2="29" />
    <line id="highlight-segment-E-B" data-ref="/ E B /" class="geom-line geom-overlay" x1="95" y1="29" x2="150" y2="29" />
    <line id="highlight-segment-C-F" data-ref="/ C F /" class="geom-line geom-overlay" x1="20" y1="77" x2="70" y2="77" />
    <line id="highlight-segment-F-D" data-ref="/ F D /" class="geom-line geom-overlay" x1="70" y1="77" x2="150" y2="77" />
    <line id="highlight-segment-E-G" data-ref="/ E G /" class="geom-line geom-overlay" x1="95" y1="29" x2="207" y2="51" />
    <line id="highlight-segment-F-G" data-ref="/ F G /" class="geom-line geom-overlay" x1="70" y1="77" x2="207" y2="51" />
    <polygon id="highlight-polygon-G-E-F" data-ref="&lt; G E F &gt;" class="geom-polygon geom-overlay" points="207,51 95,29 70,77" />
    <path id="wedge-A-E-F" data-ref="&lt; A E F )" data-aliases="( E A )&lt; A E F &gt; | ( E F )&lt; A E F &gt;" class="wedge angle geom-overlay" d="M 95 29 L 75.52 29 A 19.5 19.5 0 0 0 86 46.28 Z" />
    <path id="wedge-E-F-D" data-ref="&lt; E F D )" data-aliases="( F E )&lt; E F D &gt; | ( F D )&lt; E F D &gt;" class="wedge angle geom-overlay" d="M 70 77 L 79 59.72 A 19.5 19.5 0 0 1 89.48 77 Z" />
    <path id="wedge-B-E-F" data-ref="&lt; B E F )" data-aliases="( E B )&lt; B E F &gt; | ( E F )&lt; B E F &gt;" class="wedge angle geom-overlay" d="M 95 29 L 114.48 29 A 19.5 19.5 0 0 1 86 46.28 Z" />
    <path id="wedge-G-E-F" data-ref="&lt; G E F )" data-aliases="( E G )&lt; G E F &gt; | ( E F )&lt; G E F &gt;" class="wedge angle geom-overlay" d="M 95 29 L 114.12 32.76 A 19.5 19.5 0 0 1 86 46.28 Z" />
    <path id="wedge-E-F-G" data-ref="&lt; E F G )" data-aliases="( F E )&lt; E F G &gt; | ( F G )&lt; E F G &gt;" class="wedge angle geom-overlay" d="M 70 77 L 79 59.72 A 19.5 19.5 0 0 1 89.14 73.37 Z" />
  </g>

  <g id="points">
    <circle id="A" data-ref="A" class="geom-point" cx="20" cy="29" r="3.5" />
    <circle id="B" data-ref="B" class="geom-point" cx="150" cy="29" r="3.5" />
    <circle id="C" data-ref="C" class="geom-point" cx="20" cy="77" r="3.5" />
    <circle id="D" data-ref="D" class="geom-point" cx="150" cy="77" r="3.5" />
    <circle id="E" data-ref="E" class="geom-point" cx="95" cy="29" r="3.5" />
    <circle id="F" data-ref="F" class="geom-point" cx="70" cy="77" r="3.5" />
    <circle id="G" data-ref="G" class="geom-point" cx="207" cy="51" r="3.5" />
  </g>

  <g id="labels">
    <text id="label-A" data-ref="A" class="geom-label" x="16" y="21">A</text>
    <text id="label-B" data-ref="B" class="geom-label" x="156" y="21">B</text>
    <text id="label-C" data-ref="C" class="geom-label" x="15" y="87">C</text>
    <text id="label-D" data-ref="D" class="geom-label" x="156" y="87">D</text>
    <text id="label-E" data-ref="E" class="geom-label" x="90" y="21">E</text>
    <text id="label-F" data-ref="F" class="geom-label" x="75" y="87">F</text>
    <text id="label-G" data-ref="G" class="geom-label" x="215" y="55">G</text>
  </g>
</svg>
