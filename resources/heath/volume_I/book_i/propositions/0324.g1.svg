<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 235 165" width="235" height="165" class="euclid-graphic" data-folio="0324" data-graphic="g1" data-proposition="I.28">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Regions / Polygons -->
  <polygon id="el-poly-AGHC" data-ref="AGHC" data-type="polygon" points="26,64 112,64 151.5,116 26,116" class="geom-polygon" />
  <polygon id="el-poly-BGHD" data-ref="BGHD" data-type="polygon" points="112,64 215,64 215,116 151.5,116" class="geom-polygon" />

  <!-- Lines -->
  <!-- Line AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="26" y1="64" x2="215" y2="64" class="geom-line" />

  <!-- Line CD -->
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="26" y1="116" x2="215" y2="116" class="geom-line" />

  <!-- Transversal EF -->
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="94" y1="41" x2="174" y2="145" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="26" cy="64" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="215" cy="64" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="26" cy="116" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="215" cy="116" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="94" cy="41" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="174" cy="145" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="112" cy="64" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="151.5" cy="116" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-E" data-ref="E" x="93" y="32" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-A" data-ref="A" x="21" y="68" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-G" data-ref="G" x="114" y="55" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-B" data-ref="B" x="220" y="68" text-anchor="start" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="21" y="120" text-anchor="end" class="geom-label">C</text>
  <text id="lbl-H" data-ref="H" x="155" y="108" text-anchor="middle" class="geom-label">H</text>
  <text id="lbl-D" data-ref="D" x="220" y="120" text-anchor="start" class="geom-label">D</text>
  <text id="lbl-F" data-ref="F" x="178" y="156" text-anchor="start" class="geom-label">F</text>
</svg>
