    <path id="wedge-C-H-F" data-ref="&lt; C H F )" data-aliases="( H C )&lt; C H F &gt; | ( H F )&lt; C H F &gt;" class="wedge angle geom-overlay" d="M 70 102 L 57.59 102 A 12.4 12.4 0 0 0 66.4 113.88 Z" />
  </g>

