<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 165" width="230" height="165" class="euclid-graphic" data-folio="0325" data-graphic="g1" data-proposition="I.29">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Regions / Polygons -->
  <polygon id="el-poly-AGHC" data-ref="AGHC" data-type="polygon" points="20,69.5 85,69.5 114.5,116.5 20,116.5" class="geom-polygon" />
  <polygon id="el-poly-BGHD" data-ref="BGHD" data-type="polygon" points="85,69.5 180,69.5 180,116.5 114.5,116.5" class="geom-polygon" />

  <!-- Lines -->
  <!-- Line AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="20" y1="69.5" x2="180" y2="69.5" class="geom-line" />

  <!-- Line CD -->
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="20" y1="116.5" x2="180" y2="116.5" class="geom-line" />

  <!-- Transversal EF -->
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="64" y1="36" x2="134.5" y2="148" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="20" cy="69.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="180" cy="69.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="20" cy="116.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="180" cy="116.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="64" cy="36" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="134.5" cy="148" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="85" cy="69.5" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="114.5" cy="116.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-E" data-ref="E" x="69" y="31" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-A" data-ref="A" x="16" y="74" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-G" data-ref="G" x="89" y="63" text-anchor="start" class="geom-label">G</text>
  <text id="lbl-B" data-ref="B" x="186" y="66" text-anchor="start" class="geom-label">B</text>
  <text id="lbl-C" data-ref="C" x="14" y="121" text-anchor="end" class="geom-label">C</text>
  <text id="lbl-H" data-ref="H" x="120" y="110" text-anchor="start" class="geom-label">H</text>
  <text id="lbl-D" data-ref="D" x="186" y="121" text-anchor="start" class="geom-label">D</text>
  <text id="lbl-F" data-ref="F" x="140" y="156" text-anchor="start" class="geom-label">F</text>
</svg>
