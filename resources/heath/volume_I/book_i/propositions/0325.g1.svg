<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 165" class="euclid-graphic" data-graphic-id="0325.g1">
  <title>Euclid's Elements, Book I, Proposition 29</title>
  <desc>Straight line EF falling on parallel straight lines AB and CD at G and H.</desc>

  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-line-dashed {
      stroke: #000000;
      stroke-width: 2;
      stroke-dasharray: 5,4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge:hover, path.wedge.highlight, path.wedge.geom-highlight-active,
    path.angle:hover, path.angle.highlight, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <g id="elements">
    <line id="line-A-B" data-ref="[ A B ]" class="geom-line" x1="20" y1="69.5" x2="180" y2="69.5" />
    <line id="line-C-D" data-ref="[ C D ]" class="geom-line" x1="20" y1="116.5" x2="180" y2="116.5" />
    <line id="line-E-F" data-ref="[ E F ]" class="geom-line" x1="64" y1="36" x2="134.5" y2="148" />
  </g>

  <g id="graphics">
    <line id="segment-A-B" data-ref="/ A B /" class="geom-line" x1="20" y1="69.5" x2="180" y2="69.5" />
    <line id="segment-C-D" data-ref="/ C D /" class="geom-line" x1="20" y1="116.5" x2="180" y2="116.5" />
    <line id="segment-E-F" data-ref="/ E F /" class="geom-line" x1="64" y1="36" x2="134.5" y2="148" />
    <line id="section-A-G-B" data-ref="/ A G B /" data-aliases="} A G B { | / A B /" class="geom-line geom-overlay" x1="20" y1="69.5" x2="180" y2="69.5" />
    <line id="section-C-H-D" data-ref="/ C H D /" data-aliases="} C H D { | / C D /" class="geom-line geom-overlay" x1="20" y1="116.5" x2="180" y2="116.5" />
    <line id="section-E-G-H" data-ref="/ E G H /" data-aliases="} E G H { | / E H /" class="geom-line geom-overlay" x1="64" y1="36" x2="114.5" y2="116.5" />
    <line id="section-G-H-F" data-ref="/ G H F /" data-aliases="} G H F { | / G F /" class="geom-line geom-overlay" x1="85" y1="69.5" x2="134.5" y2="148" />
  </g>

  <g id="highlights">
    <line id="highlight-segment-A-G" data-ref="/ A G /" class="geom-line geom-overlay" x1="20" y1="69.5" x2="85" y2="69.5" />
    <line id="highlight-segment-G-B" data-ref="/ G B /" class="geom-line geom-overlay" x1="85" y1="69.5" x2="180" y2="69.5" />
    <line id="highlight-segment-C-H" data-ref="/ C H /" class="geom-line geom-overlay" x1="20" y1="116.5" x2="114.5" y2="116.5" />
    <line id="highlight-segment-H-D" data-ref="/ H D /" class="geom-line geom-overlay" x1="114.5" y1="116.5" x2="180" y2="116.5" />
    <line id="highlight-segment-E-G" data-ref="/ E G /" class="geom-line geom-overlay" x1="64" y1="36" x2="85" y2="69.5" />
    <line id="highlight-segment-G-H" data-ref="/ G H /" class="geom-line geom-overlay" x1="85" y1="69.5" x2="114.5" y2="116.5" />
    <line id="highlight-segment-H-F" data-ref="/ H F /" class="geom-line geom-overlay" x1="114.5" y1="116.5" x2="134.5" y2="148" />
    <path id="wedge-A-G-H" data-ref="&lt; A G H )" data-aliases="( G A )&lt; A G H &gt; | ( G H )&lt; A G H &gt;" class="wedge angle geom-overlay" d="M 85 69.5 L 65.02 69.5 A 20.0 20.0 0 0 0 95.62 86.42 Z" />
    <path id="wedge-G-H-D" data-ref="&lt; G H D )" data-aliases="( H G )&lt; G H D &gt; | ( H D )&lt; G H D &gt;" class="wedge angle geom-overlay" d="M 114.5 116.5 L 103.88 99.58 A 20.0 20.0 0 0 1 134.48 116.5 Z" />
    <path id="wedge-E-G-B" data-ref="&lt; E G B )" data-aliases="( G E )&lt; E G B &gt; | ( G B )&lt; E G B &gt;" class="wedge angle geom-overlay" d="M 85 69.5 L 77.44 57.44 A 14.2 14.2 0 0 1 99.23 69.5 Z" />
    <path id="wedge-B-G-H" data-ref="&lt; B G H )" data-aliases="( G B )&lt; B G H &gt; | ( G H )&lt; B G H &gt;" class="wedge angle geom-overlay" d="M 85 69.5 L 104.98 69.5 A 20.0 20.0 0 0 1 95.62 86.42 Z" />
    <path id="wedge-C-H-G" data-ref="&lt; C H G )" data-aliases="( H C )&lt; C H G &gt; | ( H G )&lt; C H G &gt;" class="wedge angle geom-overlay" d="M 114.5 116.5 L 94.52 116.5 A 20.0 20.0 0 0 1 103.88 99.58 Z" />
  </g>

  <g id="points">
    <circle id="A" data-ref="A" class="geom-point" cx="20" cy="69.5" r="3.5" />
    <circle id="B" data-ref="B" class="geom-point" cx="180" cy="69.5" r="3.5" />
    <circle id="C" data-ref="C" class="geom-point" cx="20" cy="116.5" r="3.5" />
    <circle id="D" data-ref="D" class="geom-point" cx="180" cy="116.5" r="3.5" />
    <circle id="E" data-ref="E" class="geom-point" cx="64" cy="36" r="3.5" />
    <circle id="F" data-ref="F" class="geom-point" cx="134.5" cy="148" r="3.5" />
    <circle id="G" data-ref="G" class="geom-point" cx="85" cy="69.5" r="3.5" />
    <circle id="H" data-ref="H" class="geom-point" cx="114.5" cy="116.5" r="3.5" />
  </g>

  <g id="labels">
    <text id="label-E" data-ref="E" class="geom-label" x="69" y="31">E</text>
    <text id="label-A" data-ref="A" class="geom-label" x="16" y="74">A</text>
    <text id="label-G" data-ref="G" class="geom-label" x="89" y="63">G</text>
    <text id="label-B" data-ref="B" class="geom-label" x="186" y="66">B</text>
    <text id="label-C" data-ref="C" class="geom-label" x="14" y="121">C</text>
    <text id="label-H" data-ref="H" class="geom-label" x="120" y="110">H</text>
    <text id="label-D" data-ref="D" class="geom-label" x="186" y="121">D</text>
    <text id="label-F" data-ref="F" class="geom-label" x="140" y="156">F</text>
  </g>
</svg>
