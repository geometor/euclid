<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 100" width="192" height="100" class="euclid-graphic" data-folio="0327" data-graphic="g1" data-proposition="I.29">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-line-dashed {
      stroke: #000000;
      stroke-width: 2;
      stroke-dasharray: 5,4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Regions / Polygons -->
  <polygon id="el-poly-AEFC" data-ref="AEFC" data-type="polygon" points="24,38 95.5,27.5 112.5,76.5 24,76.5" class="geom-polygon" />
  <polygon id="el-poly-BEFD" data-ref="BEFD" data-type="polygon" points="95.5,27.5 168,17 168,76.5 112.5,76.5" class="geom-polygon" />

  <!-- Lines -->
  <!-- Line AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="24" y1="38" x2="168" y2="17" class="geom-line" />

  <!-- Line CD -->
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="24" y1="76.5" x2="168" y2="76.5" class="geom-line" />

  <!-- Dashed Line GH through E parallel to CD -->
  <line id="el-seg-GH" data-ref="GH" data-type="segment" x1="24" y1="27.5" x2="168" y2="27.5" class="geom-line-dashed" />

  <!-- Transversal EF -->
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="95.5" y1="27.5" x2="112.5" y2="76.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="24" cy="38" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="168" cy="17" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="24" cy="76.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="168" cy="76.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="95.5" cy="27.5" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="112.5" cy="76.5" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="24" cy="27.5" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="168" cy="27.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-G" data-ref="G" x="20" y="31" text-anchor="end" class="geom-label">G</text>
  <text id="lbl-A" data-ref="A" x="20" y="44" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-E" data-ref="E" x="95.5" y="19" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-B" data-ref="B" x="172" y="18" text-anchor="start" class="geom-label">B</text>
  <text id="lbl-H" data-ref="H" x="172" y="32" text-anchor="start" class="geom-label">H</text>
  <text id="lbl-C" data-ref="C" x="20" y="81" text-anchor="end" class="geom-label">C</text>
  <text id="lbl-F" data-ref="F" x="112.5" y="90" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-D" data-ref="D" x="172" y="81" text-anchor="start" class="geom-label">D</text>
</svg>
