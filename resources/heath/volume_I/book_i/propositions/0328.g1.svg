<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 135" width="200" height="135" class="euclid-graphic" data-folio="0328" data-graphic="g1" data-proposition="I.30">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Regions / Polygons -->
  <polygon id="el-poly-AGHE" data-ref="AGHE" data-type="polygon" points="24,53.5 117.5,53.5 105.5,84 24,84" class="geom-polygon" />
  <polygon id="el-poly-GBFH" data-ref="GBFH" data-type="polygon" points="117.5,53.5 175,53.5 175,84 105.5,84" class="geom-polygon" />
  <polygon id="el-poly-EHKC" data-ref="EHKC" data-type="polygon" points="24,84 105.5,84 89.5,123.5 24,123.5" class="geom-polygon" />
  <polygon id="el-poly-HFDK" data-ref="HFDK" data-type="polygon" points="105.5,84 175,84 175,123.5 89.5,123.5" class="geom-polygon" />

  <!-- Lines -->
  <!-- Line AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="24" y1="53.5" x2="175" y2="53.5" class="geom-line" />

  <!-- Line EF -->
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="24" y1="84" x2="175" y2="84" class="geom-line" />

  <!-- Line CD -->
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="24" y1="123.5" x2="175" y2="123.5" class="geom-line" />

  <!-- Transversal GK -->
  <line id="el-seg-GK" data-ref="GK" data-type="segment" x1="124" y1="38" x2="85.5" y2="133" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="24" cy="53.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="175" cy="53.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="24" cy="123.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="175" cy="123.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="24" cy="84" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="175" cy="84" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="117.5" cy="53.5" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="105.5" cy="84" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="89.5" cy="123.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="32" y="47" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-G" data-ref="G" x="117" y="46" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-B" data-ref="B" x="180" y="47" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-E" data-ref="E" x="29" y="78" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-H" data-ref="H" x="102" y="77" text-anchor="middle" class="geom-label">H</text>
  <text id="lbl-F" data-ref="F" x="179" y="78" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-C" data-ref="C" x="27.5" y="118" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-K" data-ref="K" x="83" y="117" text-anchor="middle" class="geom-label">K</text>
  <text id="lbl-D" data-ref="D" x="177" y="116" text-anchor="middle" class="geom-label">D</text>
</svg>
