<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 135" class="euclid-graphic" data-graphic-id="0328.g1">
  <title>Euclid's Elements, Book I, Proposition 30</title>
  <desc>Three parallel straight lines AB, EF, and CD intersected by a transversal GK at points G, H, and K.</desc>

  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-line-dashed {
      stroke: #000000;
      stroke-width: 2;
      stroke-dasharray: 5,4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge:hover, path.wedge.highlight, path.wedge.geom-highlight-active,
    path.angle:hover, path.angle.highlight, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <g id="elements">
    <line id="line-A-B" data-ref="[ A B ]" class="geom-line" x1="24" y1="53.5" x2="175" y2="53.5" />
    <line id="line-E-F" data-ref="[ E F ]" class="geom-line" x1="24" y1="84" x2="175" y2="84" />
    <line id="line-C-D" data-ref="[ C D ]" class="geom-line" x1="24" y1="123.5" x2="175" y2="123.5" />
    <line id="line-L-M" data-ref="[ L M ]" data-aliases="[ G K ]" class="geom-line" x1="124" y1="38" x2="85.5" y2="133" />
  </g>

  <g id="graphics">
    <line id="segment-A-B" data-ref="/ A B /" class="geom-line" x1="24" y1="53.5" x2="175" y2="53.5" />
    <line id="segment-E-F" data-ref="/ E F /" class="geom-line" x1="24" y1="84" x2="175" y2="84" />
    <line id="segment-C-D" data-ref="/ C D /" class="geom-line" x1="24" y1="123.5" x2="175" y2="123.5" />
    <line id="segment-G-K" data-ref="/ G K /" class="geom-line" x1="117.5" y1="53.5" x2="89.5" y2="123.5" />
    <line id="section-A-G-B" data-ref="/ A G B /" data-aliases="} A G B { | / A B /" class="geom-line geom-overlay" x1="24" y1="53.5" x2="175" y2="53.5" />
    <line id="section-E-H-F" data-ref="/ E H F /" data-aliases="} E H F { | / E F /" class="geom-line geom-overlay" x1="24" y1="84" x2="175" y2="84" />
    <line id="section-C-K-D" data-ref="/ C K D /" data-aliases="} C K D { | / C D /" class="geom-line geom-overlay" x1="24" y1="123.5" x2="175" y2="123.5" />
    <line id="section-G-H-K" data-ref="/ G H K /" data-aliases="} G H K { | / G K /" class="geom-line geom-overlay" x1="117.5" y1="53.5" x2="89.5" y2="123.5" />
  </g>

  <g id="highlights">
    <line id="highlight-segment-A-G" data-ref="/ A G /" class="geom-line geom-overlay" x1="24" y1="53.5" x2="117.5" y2="53.5" />
    <line id="highlight-segment-G-B" data-ref="/ G B /" class="geom-line geom-overlay" x1="117.5" y1="53.5" x2="175" y2="53.5" />
    <line id="highlight-segment-E-H" data-ref="/ E H /" class="geom-line geom-overlay" x1="24" y1="84" x2="105.5" y2="84" />
    <line id="highlight-segment-H-F" data-ref="/ H F /" class="geom-line geom-overlay" x1="105.5" y1="84" x2="175" y2="84" />
    <line id="highlight-segment-C-K" data-ref="/ C K /" class="geom-line geom-overlay" x1="24" y1="123.5" x2="89.5" y2="123.5" />
    <line id="highlight-segment-K-D" data-ref="/ K D /" class="geom-line geom-overlay" x1="89.5" y1="123.5" x2="175" y2="123.5" />
    <line id="highlight-segment-G-H" data-ref="/ G H /" class="geom-line geom-overlay" x1="117.5" y1="53.5" x2="105.5" y2="84" />
    <line id="highlight-segment-H-K" data-ref="/ H K /" class="geom-line geom-overlay" x1="105.5" y1="84" x2="89.5" y2="123.5" />
    <path id="wedge-A-G-K" data-ref="&lt; A G K )" data-aliases="( G A )&lt; A G K &gt; | ( G K )&lt; A G K &gt;" class="wedge angle geom-overlay" d="M 117.5 53.5 L 97.5 53.5 A 20.0 20.0 0 0 0 110.07 72.07 Z" />
    <path id="wedge-A-G-H" data-ref="&lt; A G H )" data-aliases="( G A )&lt; A G H &gt; | ( G H )&lt; A G H &gt;" class="wedge angle geom-overlay" d="M 117.5 53.5 L 105.7 53.5 A 11.8 11.8 0 0 0 113.18 64.48 Z" />
    <path id="wedge-G-H-F" data-ref="&lt; G H F )" data-aliases="( H G )&lt; G H F &gt; | ( H F )&lt; G H F &gt;" class="wedge angle geom-overlay" d="M 105.5 84 L 109.82 73.02 A 11.8 11.8 0 0 1 117.3 84 Z" />
    <path id="wedge-G-K-D" data-ref="&lt; G K D )" data-aliases="( K G )&lt; G K D &gt; | ( K D )&lt; G K D &gt;" class="wedge angle geom-overlay" d="M 89.5 123.5 L 96.93 104.93 A 20.0 20.0 0 0 1 109.5 123.5 Z" />
    <path id="wedge-H-K-D" data-ref="&lt; H K D )" data-aliases="( K H )&lt; H K D &gt; | ( K D )&lt; H K D &gt;" class="wedge angle geom-overlay" d="M 89.5 123.5 L 95.26 109.28 A 15.3 15.3 0 0 1 104.84 123.5 Z" />
  </g>

  <g id="points">
    <circle id="A" data-ref="A" class="geom-point" cx="24" cy="53.5" r="3.5" />
    <circle id="B" data-ref="B" class="geom-point" cx="175" cy="53.5" r="3.5" />
    <circle id="C" data-ref="C" class="geom-point" cx="24" cy="123.5" r="3.5" />
    <circle id="D" data-ref="D" class="geom-point" cx="175" cy="123.5" r="3.5" />
    <circle id="E" data-ref="E" class="geom-point" cx="24" cy="84" r="3.5" />
    <circle id="F" data-ref="F" class="geom-point" cx="175" cy="84" r="3.5" />
    <circle id="G" data-ref="G" class="geom-point" cx="117.5" cy="53.5" r="3.5" />
    <circle id="H" data-ref="H" class="geom-point" cx="105.5" cy="84" r="3.5" />
    <circle id="K" data-ref="K" class="geom-point" cx="89.5" cy="123.5" r="3.5" />
    <circle id="L" data-ref="L" class="geom-point geom-overlay" cx="124" cy="38" r="3.5" />
    <circle id="M" data-ref="M" class="geom-point geom-overlay" cx="85.5" cy="133" r="3.5" />
  </g>

  <g id="labels">
    <text id="label-A" data-ref="A" class="geom-label" x="32" y="47">A</text>
    <text id="label-G" data-ref="G" class="geom-label" x="117" y="46">G</text>
    <text id="label-B" data-ref="B" class="geom-label" x="180" y="47">B</text>
    <text id="label-E" data-ref="E" class="geom-label" x="29" y="78">E</text>
    <text id="label-H" data-ref="H" class="geom-label" x="102" y="77">H</text>
    <text id="label-F" data-ref="F" class="geom-label" x="179" y="78">F</text>
    <text id="label-C" data-ref="C" class="geom-label" x="27.5" y="118">C</text>
    <text id="label-K" data-ref="K" class="geom-label" x="83" y="117">K</text>
    <text id="label-D" data-ref="D" class="geom-label" x="177" y="116">D</text>
  </g>
</svg>
