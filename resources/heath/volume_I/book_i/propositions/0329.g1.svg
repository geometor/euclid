<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 155" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .geo-line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-dashed { stroke: #000000; stroke-width: 2.0; stroke-dasharray: 4,4; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-point { fill: #000000; stroke: #ffffff; stroke-width: 1.5; transition: fill 0.15s ease, r 0.15s ease; }
      .geo-label { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #000000; dominant-baseline: middle; user-select: none; }
      .hover-group { pointer-events: all; }
      .hover-group:hover .geo-line { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .hover-group:hover .geo-dashed { stroke: #0284c7 !important; stroke-width: 3.0 !important; }
      .hover-group:hover .geo-point { fill: #0284c7 !important; r: 5 !important; }
      .hover-group:hover .geo-label { fill: #0284c7 !important; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Base geometry -->
  <g id="geometry">
    <!-- Lines -->
    <g id="line-AB" class="hover-group">
      <line class="geo-line" x1="66.5" y1="25.0" x2="15.0" y2="128.5" />
    </g>
    <g id="line-BC" class="hover-group">
      <line class="geo-line" x1="15.0" y1="128.5" x2="145.0" y2="128.5" />
    </g>
    <g id="line-DE" class="hover-group">
      <line class="geo-line" x1="106.5" y1="20.0" x2="83.25" y2="66.5" />
    </g>
    <g id="line-EH" class="hover-group">
      <line class="geo-dashed" x1="83.25" y1="66.5" x2="52.25" y2="128.5" />
    </g>
    <g id="line-GF" class="hover-group">
      <line class="geo-line" x1="65.0" y1="66.5" x2="131.0" y2="66.5" />
    </g>

    <!-- Points -->
    <g id="point-A" class="hover-group">
      <circle class="geo-point" cx="66.5" cy="25.0" r="3.5" />
      <text class="geo-label" x="58.0" y="19.0" text-anchor="end">A</text>
    </g>
    <g id="point-B" class="hover-group">
      <circle class="geo-point" cx="15.0" cy="128.5" r="3.5" />
      <text class="geo-label" x="12.0" y="140.0" text-anchor="end">B</text>
    </g>
    <g id="point-C" class="hover-group">
      <circle class="geo-point" cx="145.0" cy="128.5" r="3.5" />
      <text class="geo-label" x="148.0" y="140.0" text-anchor="start">C</text>
    </g>
    <g id="point-D" class="hover-group">
      <circle class="geo-point" cx="106.5" cy="20.0" r="3.5" />
      <text class="geo-label" x="114.0" y="22.0" text-anchor="start">D</text>
    </g>
    <g id="point-E" class="hover-group">
      <circle class="geo-point" cx="83.25" cy="66.5" r="3.5" />
      <text class="geo-label" x="88.0" y="78.0" text-anchor="start">E</text>
    </g>
    <g id="point-F" class="hover-group">
      <circle class="geo-point" cx="131.0" cy="66.5" r="3.5" />
      <text class="geo-label" x="134.0" y="78.0" text-anchor="start">F</text>
    </g>
    <g id="point-G" class="hover-group">
      <circle class="geo-point" cx="65.0" cy="66.5" r="3.5" />
      <text class="geo-label" x="60.0" y="78.0" text-anchor="end">G</text>
    </g>
    <g id="point-H" class="hover-group">
      <circle class="geo-point" cx="52.25" cy="128.5" r="3.5" />
      <text class="geo-label" x="52.0" y="140.0" text-anchor="middle">H</text>
    </g>
  </g>
</svg>
