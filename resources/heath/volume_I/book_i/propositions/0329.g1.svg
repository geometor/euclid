    <path id="wedge-D-H-C" data-ref="&lt; D H C )" data-aliases="( H D )&lt; D H C &gt;; ( H C )&lt; D H C &gt;" class="wedge angle geom-overlay" d="M 52.25 128.5 L 61.19 110.61 A 20.0 20.0 0 0 1 72.25 128.5 Z" />
  </g>

