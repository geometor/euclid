    <path id="wedge-D-E-G" data-ref="&lt; D E G )" data-aliases="( E D )&lt; D E G &gt;; ( E G )&lt; D E G &gt;" class="wedge angle geom-overlay" d="M 83.25 66.5 L 86.83 59.34 A 8.0 8.0 0 0 0 75.25 66.5 Z" />
