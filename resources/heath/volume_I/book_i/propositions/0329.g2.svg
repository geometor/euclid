<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 145" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .geo-line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-dashed { stroke: #000000; stroke-width: 2.0; stroke-dasharray: 4,4; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-point { fill: #000000; stroke: #ffffff; stroke-width: 1.5; transition: fill 0.15s ease, r 0.15s ease; }
      .geo-label { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #000000; dominant-baseline: middle; user-select: none; }
      .hover-group { pointer-events: all; }
      .hover-group:hover .geo-line { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .hover-group:hover .geo-dashed { stroke: #0284c7 !important; stroke-width: 3.0 !important; }
      .hover-group:hover .geo-point { fill: #0284c7 !important; r: 5 !important; }
      .hover-group:hover .geo-label { fill: #0284c7 !important; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Base geometry -->
  <g id="geometry">
    <!-- Lines -->
    <g id="line-AB" class="hover-group">
      <line class="geo-line" x1="60.0" y1="28.0" x2="20.0" y2="125.0" />
    </g>
    <g id="line-BC" class="hover-group">
      <line class="geo-line" x1="20.0" y1="125.0" x2="182.0" y2="125.0" />
    </g>
    <g id="line-ED" class="hover-group">
      <line class="geo-line" x1="107.5" y1="88.5" x2="45.6" y2="63.0" />
    </g>
    <g id="line-GEF" class="hover-group">
      <line class="geo-line" x1="107.5" y1="47.0" x2="107.5" y2="125.0" />
    </g>
    <g id="line-EDprime" class="hover-group">
      <line class="geo-dashed" x1="107.5" y1="88.5" x2="130.0" y2="34.0" />
    </g>
    <g id="line-EGprime" class="hover-group">
      <line class="geo-dashed" x1="107.5" y1="88.5" x2="162.0" y2="88.5" />
    </g>

    <!-- Points -->
    <g id="point-A" class="hover-group">
      <circle class="geo-point" cx="60.0" cy="28.0" r="3.5" />
      <text class="geo-label" x="52.0" y="25.0" text-anchor="end">A</text>
    </g>
    <g id="point-B" class="hover-group">
      <circle class="geo-point" cx="20.0" cy="125.0" r="3.5" />
      <text class="geo-label" x="16.0" y="136.0" text-anchor="end">B</text>
    </g>
    <g id="point-C" class="hover-group">
      <circle class="geo-point" cx="182.0" cy="125.0" r="3.5" />
      <text class="geo-label" x="188.0" y="136.0" text-anchor="start">C</text>
    </g>
    <g id="point-D" class="hover-group">
      <circle class="geo-point" cx="45.6" cy="63.0" r="3.5" />
      <text class="geo-label" x="38.0" y="58.0" text-anchor="end">D</text>
    </g>
    <g id="point-E" class="hover-group">
      <circle class="geo-point" cx="107.5" cy="88.5" r="3.5" />
      <text class="geo-label" x="98.0" y="98.0" text-anchor="end">E</text>
    </g>
    <g id="point-F" class="hover-group">
      <circle class="geo-point" cx="107.5" cy="125.0" r="3.5" />
      <text class="geo-label" x="107.5" y="138.0" text-anchor="middle">F</text>
    </g>
    <g id="point-G" class="hover-group">
      <circle class="geo-point" cx="107.5" cy="47.0" r="3.5" />
      <text class="geo-label" x="98.0" y="49.0" text-anchor="end">G</text>
    </g>
    <g id="point-Dprime" class="hover-group">
      <circle class="geo-point" cx="130.0" cy="34.0" r="3.5" />
      <text class="geo-label" x="134.0" y="30.0" text-anchor="start">D′</text>
    </g>
    <g id="point-Gprime" class="hover-group">
      <circle class="geo-point" cx="162.0" cy="88.5" r="3.5" />
      <text class="geo-label" x="166.0" y="92.0" text-anchor="start">G′</text>
    </g>
  </g>
</svg>
