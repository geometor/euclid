<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 95" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .geo-line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-point { fill: #000000; stroke: #ffffff; stroke-width: 1.5; transition: fill 0.15s ease, r 0.15s ease; }
      .geo-label { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #000000; dominant-baseline: middle; user-select: none; }
      .hover-group { pointer-events: all; }
      .hover-group:hover .geo-line { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .hover-group:hover .geo-point { fill: #0284c7 !important; r: 5 !important; }
      .hover-group:hover .geo-label { fill: #0284c7 !important; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Base geometry -->
  <g id="geometry">
    <!-- Lines -->
    <g id="line-EF" class="hover-group">
      <line class="geo-line" x1="36.0" y1="16.5" x2="209.0" y2="16.5" />
    </g>
    <g id="line-BC" class="hover-group">
      <line class="geo-line" x1="24.0" y1="74.5" x2="222.0" y2="74.5" />
    </g>
    <g id="line-AD" class="hover-group">
      <line class="geo-line" x1="129.5" y1="16.5" x2="102.5" y2="74.5" />
    </g>

    <!-- Points -->
    <g id="point-E" class="hover-group">
      <circle class="geo-point" cx="36.0" cy="16.5" r="3.5" />
      <text class="geo-label" x="38.0" y="28.0" text-anchor="middle">E</text>
    </g>
    <g id="point-A" class="hover-group">
      <circle class="geo-point" cx="129.5" cy="16.5" r="3.5" />
      <text class="geo-label" x="129.5" y="8.0" text-anchor="middle">A</text>
    </g>
    <g id="point-F" class="hover-group">
      <circle class="geo-point" cx="209.0" cy="16.5" r="3.5" />
      <text class="geo-label" x="209.0" y="28.0" text-anchor="middle">F</text>
    </g>
    <g id="point-B" class="hover-group">
      <circle class="geo-point" cx="24.0" cy="74.5" r="3.5" />
      <text class="geo-label" x="24.0" y="86.0" text-anchor="middle">B</text>
    </g>
    <g id="point-D" class="hover-group">
      <circle class="geo-point" cx="102.5" cy="74.5" r="3.5" />
      <text class="geo-label" x="102.5" y="86.0" text-anchor="middle">D</text>
    </g>
    <g id="point-C" class="hover-group">
      <circle class="geo-point" cx="222.0" cy="74.5" r="3.5" />
      <text class="geo-label" x="222.0" y="86.0" text-anchor="middle">C</text>
    </g>
  </g>
</svg>
