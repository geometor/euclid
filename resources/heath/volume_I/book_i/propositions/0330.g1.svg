<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 95" class="euclid-graphic" data-graphic-id="0330.g1">
  <title>Euclid's Elements, Book I, Proposition 31</title>
  <desc>Drawing a straight line EAF through a given point A parallel to a given straight line BC by joining AD and making angle EAD equal to angle ADC.</desc>

  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-line-dashed {
      stroke: #000000;
      stroke-width: 2;
      stroke-dasharray: 5,4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge:hover, path.wedge.highlight, path.wedge.geom-highlight-active,
    path.angle:hover, path.angle.highlight, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <g id="elements">
    <line id="line-E-F" data-ref="[ E F ]" class="geom-line" x1="36" y1="16.5" x2="209" y2="16.5" />
    <line id="line-B-C" data-ref="[ B C ]" class="geom-line" x1="24" y1="74.5" x2="222" y2="74.5" />
    <line id="line-A-D" data-ref="[ A D ]" class="geom-line" x1="129.5" y1="16.5" x2="102.5" y2="74.5" />
  </g>

  <g id="graphics">
    <line id="segment-E-F" data-ref="/ E F /" class="geom-line" x1="36" y1="16.5" x2="209" y2="16.5" />
    <line id="segment-B-C" data-ref="/ B C /" class="geom-line" x1="24" y1="74.5" x2="222" y2="74.5" />
    <line id="segment-A-D" data-ref="/ A D /" class="geom-line" x1="129.5" y1="16.5" x2="102.5" y2="74.5" />
    <line id="section-E-A-F" data-ref="/ E A F /" data-aliases="} E A F { | / E F / | [ E F ]" class="geom-line geom-overlay" x1="36" y1="16.5" x2="209" y2="16.5" />
    <line id="section-B-D-C" data-ref="/ B D C /" data-aliases="} B D C { | / B C / | [ B C ]" class="geom-line geom-overlay" x1="24" y1="74.5" x2="222" y2="74.5" />
  </g>

  <g id="highlights">
    <line id="highlight-segment-E-A" data-ref="/ E A /" class="geom-line geom-overlay" x1="36" y1="16.5" x2="129.5" y2="16.5" />
    <line id="highlight-segment-A-F" data-ref="/ A F /" class="geom-line geom-overlay" x1="129.5" y1="16.5" x2="209" y2="16.5" />
    <line id="highlight-segment-B-D" data-ref="/ B D /" class="geom-line geom-overlay" x1="24" y1="74.5" x2="102.5" y2="74.5" />
    <line id="highlight-segment-D-C" data-ref="/ D C /" class="geom-line geom-overlay" x1="102.5" y1="74.5" x2="222" y2="74.5" />
    <path id="wedge-D-A-E" data-ref="&lt; D A E )" data-aliases="( A D )&lt; D A E &gt; | ( A E )&lt; D A E &gt;" class="wedge angle geom-overlay" d="M 129.5 16.5 L 121.06 34.63 A 20.0 20.0 0 0 1 109.5 16.5 Z" />
    <path id="wedge-A-D-C" data-ref="&lt; A D C )" data-aliases="( D A )&lt; A D C &gt; | ( D C )&lt; A D C &gt;" class="wedge angle geom-overlay" d="M 102.5 74.5 L 110.94 56.37 A 20.0 20.0 0 0 1 122.5 74.5 Z" />
  </g>

  <g id="points">
    <circle id="E" data-ref="E" class="geom-point" cx="36" cy="16.5" r="3.5" />
    <circle id="A" data-ref="A" class="geom-point" cx="129.5" cy="16.5" r="3.5" />
    <circle id="F" data-ref="F" class="geom-point" cx="209" cy="16.5" r="3.5" />
    <circle id="B" data-ref="B" class="geom-point" cx="24" cy="74.5" r="3.5" />
    <circle id="D" data-ref="D" class="geom-point" cx="102.5" cy="74.5" r="3.5" />
    <circle id="C" data-ref="C" class="geom-point" cx="222" cy="74.5" r="3.5" />
  </g>

  <g id="labels">
    <text id="label-E" data-ref="E" class="geom-label" x="23" y="21">E</text>
    <text id="label-A" data-ref="A" class="geom-label" x="125" y="12">A</text>
    <text id="label-F" data-ref="F" class="geom-label" x="213" y="21">F</text>
    <text id="label-B" data-ref="B" class="geom-label" x="11" y="79">B</text>
    <text id="label-D" data-ref="D" class="geom-label" x="98" y="89">D</text>
    <text id="label-C" data-ref="C" class="geom-label" x="218" y="89">C</text>
  </g>
</svg>
