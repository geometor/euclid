<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 135" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .geo-poly { fill: #000000; fill-opacity: 0.04; stroke: none; }
      .geo-line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-point { fill: #000000; stroke: #ffffff; stroke-width: 1.5; transition: fill 0.15s ease, r 0.15s ease; }
      .geo-label { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #000000; dominant-baseline: middle; user-select: none; }
      .hover-group { pointer-events: all; }
      .hover-group:hover .geo-poly { fill-opacity: 0.15; fill: #0284c7; }
      .hover-group:hover .geo-line { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .hover-group:hover .geo-point { fill: #0284c7 !important; r: 5 !important; }
      .hover-group:hover .geo-label { fill: #0284c7 !important; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Base geometry -->
  <g id="geometry">
    <!-- Polygon -->
    <g id="poly-ABC" class="hover-group">
      <polygon class="geo-poly" points="83.5,16.0 25.5,112.0 123.5,112.0" />
    </g>

    <!-- Lines -->
    <g id="line-AB" class="hover-group">
      <line class="geo-line" x1="83.5" y1="16.0" x2="25.5" y2="112.0" />
    </g>
    <g id="line-AC" class="hover-group">
      <line class="geo-line" x1="83.5" y1="16.0" x2="123.5" y2="112.0" />
    </g>
    <g id="line-BD" class="hover-group">
      <line class="geo-line" x1="25.5" y1="112.0" x2="212.0" y2="112.0" />
    </g>
    <g id="line-CE" class="hover-group">
      <line class="geo-line" x1="123.5" y1="112.0" x2="180.0" y2="16.0" />
    </g>

    <!-- Points -->
    <g id="point-A" class="hover-group">
      <circle class="geo-point" cx="83.5" cy="16.0" r="3.5" />
      <text class="geo-label" x="80.0" y="9.0" text-anchor="end">A</text>
    </g>
    <g id="point-B" class="hover-group">
      <circle class="geo-point" cx="25.5" cy="112.0" r="3.5" />
      <text class="geo-label" x="24.5" y="123.0" text-anchor="middle">B</text>
    </g>
    <g id="point-C" class="hover-group">
      <circle class="geo-point" cx="123.5" cy="112.0" r="3.5" />
      <text class="geo-label" x="123.5" y="123.0" text-anchor="middle">C</text>
    </g>
    <g id="point-D" class="hover-group">
      <circle class="geo-point" cx="212.0" cy="112.0" r="3.5" />
      <text class="geo-label" x="212.0" y="123.0" text-anchor="middle">D</text>
    </g>
    <g id="point-E" class="hover-group">
      <circle class="geo-point" cx="180.0" cy="16.0" r="3.5" />
      <text class="geo-label" x="185.0" y="14.0" text-anchor="start">E</text>
    </g>
  </g>
</svg>
