    <path id="wedge-B-C-A" data-ref="&lt; B C A )" data-aliases="( C B )&lt; B C A &gt;; ( C A )&lt; B C A &gt;" class="wedge angle geom-overlay" d="M 122 115.5 L 102 115.5 A 20.0 20.0 0 0 1 112.46 97.92 Z" />
    <path id="wedge-B-A-C" data-ref="&lt; B A C )" data-aliases="( A B )&lt; B A C &gt;; ( A C )&lt; B A C &gt;" class="wedge angle geom-overlay" d="M 68 16 L 58.46 33.58 A 20.0 20.0 0 0 0 77.54 33.58 Z" />
    <path id="wedge-A-D-C" data-ref="&lt; A D C )" data-aliases="( D A )&lt; A D C &gt;; ( D C )&lt; A D C &gt;" class="wedge angle geom-overlay" d="M 68 115.5 L 68 96.06 A 19.4 19.4 0 0 1 87.44 115.5 Z" />
    <path id="wedge-A-D-B" data-ref="&lt; A D B )" data-aliases="( D A )&lt; A D B &gt;; ( D B )&lt; A D B &gt;" class="wedge angle geom-overlay" d="M 68 115.5 L 68 96.06 A 19.4 19.4 0 0 0 48.56 115.5 Z" />
