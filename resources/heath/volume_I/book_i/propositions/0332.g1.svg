<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 146 139" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .geo-poly { fill: #000000; fill-opacity: 0.04; stroke: none; }
      .geo-rect { fill: #000000; fill-opacity: 0.03; stroke: none; }
      .geo-line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-dashed { stroke: #000000; stroke-width: 2.0; stroke-dasharray: 4,4; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-point { fill: #000000; stroke: #ffffff; stroke-width: 1.5; transition: fill 0.15s ease, r 0.15s ease; }
      .geo-label { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #000000; dominant-baseline: middle; user-select: none; }
      .hover-group { pointer-events: all; }
      .hover-group:hover .geo-poly { fill-opacity: 0.15; fill: #0284c7; }
      .hover-group:hover .geo-rect { fill-opacity: 0.12; fill: #0284c7; }
      .hover-group:hover .geo-line { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .hover-group:hover .geo-dashed { stroke: #0284c7 !important; stroke-width: 3.0 !important; }
      .hover-group:hover .geo-point { fill: #0284c7 !important; r: 5 !important; }
      .hover-group:hover .geo-label { fill: #0284c7 !important; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Base geometry -->
  <g id="geometry">
    <!-- Polygons -->
    <g id="rect-ADCE" class="hover-group">
      <polygon class="geo-rect" points="68.0,16.0 68.0,115.5 122.0,115.5 122.0,16.0" />
    </g>
    <g id="poly-ABC" class="hover-group">
      <polygon class="geo-poly" points="68.0,16.0 14.0,115.5 122.0,115.5" />
    </g>

    <!-- Lines -->
    <g id="line-AB" class="hover-group">
      <line class="geo-line" x1="68.0" y1="16.0" x2="14.0" y2="115.5" />
    </g>
    <g id="line-AC" class="hover-group">
      <line class="geo-line" x1="68.0" y1="16.0" x2="122.0" y2="115.5" />
    </g>
    <g id="line-BC" class="hover-group">
      <line class="geo-line" x1="14.0" y1="115.5" x2="122.0" y2="115.5" />
    </g>
    <g id="line-AD" class="hover-group">
      <line class="geo-line" x1="68.0" y1="16.0" x2="68.0" y2="115.5" />
    </g>
    <g id="line-AE" class="hover-group">
      <line class="geo-dashed" x1="68.0" y1="16.0" x2="122.0" y2="16.0" />
    </g>
    <g id="line-CE" class="hover-group">
      <line class="geo-dashed" x1="122.0" y1="115.5" x2="122.0" y2="16.0" />
    </g>

    <!-- Points -->
    <g id="point-A" class="hover-group">
      <circle class="geo-point" cx="68.0" cy="16.0" r="3.5" />
      <text class="geo-label" x="58.0" y="14.0" text-anchor="end">A</text>
    </g>
    <g id="point-B" class="hover-group">
      <circle class="geo-point" cx="14.0" cy="115.5" r="3.5" />
      <text class="geo-label" x="14.0" y="127.0" text-anchor="middle">B</text>
    </g>
    <g id="point-C" class="hover-group">
      <circle class="geo-point" cx="122.0" cy="115.5" r="3.5" />
      <text class="geo-label" x="126.0" y="127.0" text-anchor="middle">C</text>
    </g>
    <g id="point-D" class="hover-group">
      <circle class="geo-point" cx="68.0" cy="115.5" r="3.5" />
      <text class="geo-label" x="68.0" y="127.0" text-anchor="middle">D</text>
    </g>
    <g id="point-E" class="hover-group">
      <circle class="geo-point" cx="122.0" cy="16.0" r="3.5" />
      <text class="geo-label" x="132.0" y="16.0" text-anchor="start">E</text>
    </g>
  </g>
</svg>
