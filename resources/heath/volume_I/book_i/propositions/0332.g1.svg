  <title>Euclid's Elements, Book I, Proposition 32 (Equilateral Triangle and Rectangle ADCE)</title>
  <desc>Equilateral triangle ABC with perpendicular AD to base BC, and completed rectangle ADCE.</desc>
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
