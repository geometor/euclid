    <line id="segment-B-C" data-ref="/ B C /" class="geom-line" x1="16" y1="85" x2="204" y2="85" />
    <line id="segment-E-B" data-ref="/ E B /" class="geom-line" x1="16" y1="16.5" x2="16" y2="85" />
    <line id="segment-F-C" data-ref="/ F C /" class="geom-line" x1="204" y1="16.5" x2="204" y2="85" />
    <line id="segment-A-D" data-ref="/ A D /" class="geom-line" x1="99" y1="16.5" x2="99" y2="85" />
    <line id="segment-A-B" data-ref="/ A B /" class="geom-line" x1="99" y1="16.5" x2="16" y2="85" />
    <line id="segment-A-C" data-ref="/ A C /" class="geom-line" x1="99" y1="16.5" x2="204" y2="85" />
    <line id="section-E-A-F" data-ref="/ E A F /" data-aliases="} E A F {; / E F /" class="geom-line geom-overlay" x1="16" y1="16.5" x2="204" y2="16.5" />
    <line id="section-B-D-C" data-ref="/ B D C /" data-aliases="} B D C {; / B C /" class="geom-line geom-overlay" x1="16" y1="85" x2="204" y2="85" />
  </g>

  <g id="highlights">
    <line id="highlight-segment-E-A" data-ref="/ E A /" class="geom-line geom-overlay" x1="16" y1="16.5" x2="99" y2="16.5" />
    <line id="highlight-segment-A-F" data-ref="/ A F /" class="geom-line geom-overlay" x1="99" y1="16.5" x2="204" y2="16.5" />
    <line id="highlight-segment-B-D" data-ref="/ B D /" class="geom-line geom-overlay" x1="16" y1="85" x2="99" y2="85" />
