<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 110" class="euclid-graphic" data-graphic-id="0333.g1">
  <title>Euclid's Elements, Book I, Proposition 32 (General Triangle Inscribed in a Rectangle)</title>
  <desc>A general scalene triangle inscribed in a rectangle with a perpendicular dropped from the top vertex dividing it into two smaller rectangles.</desc>

  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-line-dashed {
      stroke: #000000;
      stroke-width: 2;
      stroke-dasharray: 5,4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge:hover, path.wedge.highlight, path.wedge.geom-highlight-active,
    path.angle:hover, path.angle.highlight, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <g id="elements">
    <line id="line-E-F" data-ref="[ E F ]" class="geom-line" x1="16" y1="16.5" x2="204" y2="16.5" />
    <line id="line-B-C" data-ref="[ B C ]" class="geom-line" x1="16" y1="85" x2="204" y2="85" />
    <line id="line-E-B" data-ref="[ E B ]" class="geom-line" x1="16" y1="16.5" x2="16" y2="85" />
    <line id="line-F-C" data-ref="[ F C ]" class="geom-line" x1="204" y1="16.5" x2="204" y2="85" />
    <line id="line-A-D" data-ref="[ A D ]" class="geom-line" x1="99" y1="16.5" x2="99" y2="85" />
    <line id="line-A-B" data-ref="[ A B ]" class="geom-line" x1="99" y1="16.5" x2="16" y2="85" />
    <line id="line-A-C" data-ref="[ A C ]" class="geom-line" x1="99" y1="16.5" x2="204" y2="85" />
  </g>

  <g id="graphics">
