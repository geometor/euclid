    <polygon id="polygon-A-B-D" data-ref="&lt; A B D &gt;" class="geom-polygon" points="99,16.5 16,85 99,85" />
    <polygon id="polygon-A-D-C" data-ref="&lt; A D C &gt;" class="geom-polygon" points="99,16.5 99,85 204,85" />
