<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 110" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .geo-poly { fill: #000000; fill-opacity: 0.04; stroke: none; }
      .geo-rect { fill: #000000; fill-opacity: 0.02; stroke: none; }
      .geo-line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-dashed { stroke: #000000; stroke-width: 2.0; stroke-dasharray: 4,4; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-point { fill: #000000; stroke: #ffffff; stroke-width: 1.5; transition: fill 0.15s ease, r 0.15s ease; }
      .hover-group { pointer-events: all; }
      .hover-group:hover .geo-poly { fill-opacity: 0.15; fill: #0284c7; }
      .hover-group:hover .geo-rect { fill-opacity: 0.08; fill: #0284c7; }
      .hover-group:hover .geo-line { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .hover-group:hover .geo-dashed { stroke: #0284c7 !important; stroke-width: 3.0 !important; }
      .hover-group:hover .geo-point { fill: #0284c7 !important; r: 5 !important; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Base geometry -->
  <g id="geometry">
    <!-- Enclosing Rectangle -->
    <g id="rect-enclosing" class="hover-group">
      <polygon class="geo-rect" points="16.0,16.5 204.0,16.5 204.0,85.0 16.0,85.0" />
    </g>

    <!-- Triangle Polygon -->
    <g id="poly-triangle" class="hover-group">
      <polygon class="geo-poly" points="99.0,16.5 16.0,85.0 204.0,85.0" />
    </g>

    <!-- Dashed rectangle boundaries & altitude -->
    <g id="line-top" class="hover-group">
      <line class="geo-dashed" x1="16.0" y1="16.5" x2="204.0" y2="16.5" />
    </g>
    <g id="line-left" class="hover-group">
      <line class="geo-dashed" x1="16.0" y1="85.0" x2="16.0" y2="16.5" />
    </g>
    <g id="line-right" class="hover-group">
      <line class="geo-dashed" x1="204.0" y1="85.0" x2="204.0" y2="16.5" />
    </g>
    <g id="line-altitude" class="hover-group">
      <line class="geo-dashed" x1="99.0" y1="16.5" x2="99.0" y2="85.0" />
    </g>

    <!-- Solid triangle lines -->
    <g id="line-base" class="hover-group">
      <line class="geo-line" x1="16.0" y1="85.0" x2="204.0" y2="85.0" />
    </g>
    <g id="line-side-left" class="hover-group">
      <line class="geo-line" x1="16.0" y1="85.0" x2="99.0" y2="16.5" />
    </g>
    <g id="line-side-right" class="hover-group">
      <line class="geo-line" x1="204.0" y1="85.0" x2="99.0" y2="16.5" />
    </g>

    <!-- Points -->
    <g id="point-top-left" class="hover-group">
      <circle class="geo-point" cx="16.0" cy="16.5" r="3.0" />
    </g>
    <g id="point-top-right" class="hover-group">
      <circle class="geo-point" cx="204.0" cy="16.5" r="3.0" />
    </g>
    <g id="point-apex" class="hover-group">
      <circle class="geo-point" cx="99.0" cy="16.5" r="3.5" />
    </g>
    <g id="point-bottom-left" class="hover-group">
      <circle class="geo-point" cx="16.0" cy="85.0" r="3.5" />
    </g>
    <g id="point-bottom-right" class="hover-group">
      <circle class="geo-point" cx="204.0" cy="85.0" r="3.5" />
    </g>
    <g id="point-foot" class="hover-group">
      <circle class="geo-point" cx="99.0" cy="85.0" r="3.5" />
    </g>
  </g>
</svg>
