    <polygon id="highlight-polygon-A-B-C" data-ref="&lt; A B C &gt;" class="geom-polygon geom-overlay" points="99,16.5 16,85 204,85" />
    <polygon id="highlight-polygon-A-B-D" data-ref="&lt; A B D &gt;" class="geom-polygon geom-overlay" points="99,16.5 16,85 99,85" />
    <polygon id="highlight-polygon-A-D-C" data-ref="&lt; A D C &gt;" class="geom-polygon geom-overlay" points="99,16.5 99,85 204,85" />
    <polygon id="highlight-polygon-E-B-C-F" data-ref="&lt; E B C F &gt;" class="geom-polygon geom-overlay" points="16,16.5 16,85 204,85 204,16.5" />
    <path id="wedge-A-B-C" data-ref="&lt; A B C )" data-aliases="( B A )&lt; A B C &gt;; ( B C )&lt; A B C &gt;" class="wedge angle geom-overlay" d="M 16 85 L 31.43 72.27 A 20.0 20.0 0 0 1 36 85 Z" />
    <path id="wedge-B-C-A" data-ref="&lt; B C A )" data-aliases="( C B )&lt; B C A &gt;; ( C A )&lt; B C A &gt;" class="wedge angle geom-overlay" d="M 204 85 L 184 85 A 20.0 20.0 0 0 1 187.25 74.07 Z" />
    <path id="wedge-B-A-C" data-ref="&lt; B A C )" data-aliases="( A B )&lt; B A C &gt;; ( A C )&lt; B A C &gt;" class="wedge angle geom-overlay" d="M 99 16.5 L 83.57 29.23 A 20.0 20.0 0 0 0 115.75 27.43 Z" />
  </g>

  <g id="points">
    <circle id="A" data-ref="A" class="geom-point" cx="99" cy="16.5" r="3.5" />
    <circle id="B" data-ref="B" class="geom-point" cx="16" cy="85" r="3.5" />
