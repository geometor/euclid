    <path id="wedge-A-B-C" data-ref="&lt; A B C )" data-aliases="( B A )&lt; A B C &gt; | ( B C )&lt; A B C &gt;" class="wedge angle geom-overlay" d="M 22 106.5 L 37.46 93.82 A 20.0 20.0 0 0 1 42 106.5 Z" />
    <path id="wedge-E-A-C" data-ref="&lt; E A C )" data-aliases="( A E )&lt; E A C &gt; | ( A C )&lt; E A C &gt;" class="wedge angle geom-overlay" d="M 111 33.5 L 131 33.5 A 20.0 20.0 0 0 1 123.17 49.37 Z" />
    <path id="wedge-A-C-B" data-ref="&lt; A C B )" data-aliases="( C A )&lt; A C B &gt; | ( C B )&lt; A C B &gt;" class="wedge angle geom-overlay" d="M 167 106.5 L 154.83 90.63 A 20.0 20.0 0 0 0 147 106.5 Z" />
