<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .geo-poly { fill: #000000; fill-opacity: 0.04; stroke: none; }
      .geo-line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-point { fill: #000000; stroke: #ffffff; stroke-width: 1.5; transition: fill 0.15s ease, r 0.15s ease; }
      .geo-label { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #000000; dominant-baseline: middle; user-select: none; }
      .hover-group { pointer-events: all; }
      .hover-group:hover .geo-poly { fill-opacity: 0.15; fill: #0284c7; }
      .hover-group:hover .geo-line { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .hover-group:hover .geo-point { fill: #0284c7 !important; r: 5 !important; }
      .hover-group:hover .geo-label { fill: #0284c7 !important; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Base geometry -->
  <g id="geometry">
    <!-- Triangle Polygon -->
    <g id="poly-ABC" class="hover-group">
      <polygon class="geo-poly" points="138.3,25.8 58.0,90.0 202.5,90.0" />
    </g>

    <!-- Extended Lines -->
    <g id="line-baseline" class="hover-group">
      <line class="geo-line" x1="7.0" y1="90.0" x2="225.0" y2="90.0" />
    </g>
    <g id="line-AB-extended" class="hover-group">
      <line class="geo-line" x1="21.0" y1="120.0" x2="163.0" y2="6.0" />
    </g>
    <g id="line-AC-extended" class="hover-group">
      <line class="geo-line" x1="120.0" y1="7.0" x2="234.5" y2="122.0" />
    </g>

    <!-- Points -->
    <g id="point-A" class="hover-group">
      <circle class="geo-point" cx="138.3" cy="25.8" r="3.5" />
      <text class="geo-label" x="138.3" y="14.0" text-anchor="middle">A</text>
    </g>
    <g id="point-B" class="hover-group">
      <circle class="geo-point" cx="58.0" cy="90.0" r="3.5" />
      <text class="geo-label" x="54.0" y="100.0" text-anchor="end">B</text>
    </g>
    <g id="point-C" class="hover-group">
      <circle class="geo-point" cx="202.5" cy="90.0" r="3.5" />
      <text class="geo-label" x="198.0" y="100.0" text-anchor="end">C</text>
    </g>
    <g id="point-D" class="hover-group">
      <circle class="geo-point" cx="7.0" cy="90.0" r="3.5" />
      <text class="geo-label" x="11.0" y="80.0" text-anchor="middle">D</text>
    </g>
  </g>
</svg>
