<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 155" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .geo-poly { fill: #000000; fill-opacity: 0.04; stroke: none; transition: fill-opacity 0.15s ease, fill 0.15s ease; }
      .geo-line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-point { fill: #000000; stroke: #ffffff; stroke-width: 1.5; transition: fill 0.15s ease, r 0.15s ease; }
      .geo-label { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #000000; dominant-baseline: middle; user-select: none; }
      .hover-group { pointer-events: all; }
      .hover-group:hover .geo-poly { fill-opacity: 0.15; fill: #0284c7; }
      .hover-group:hover .geo-line { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .hover-group:hover .geo-point { fill: #0284c7 !important; r: 5 !important; }
      .hover-group:hover .geo-label { fill: #0284c7 !important; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Base geometry -->
  <g id="geometry">
    <!-- Component Triangles -->
    <g id="poly-ABC" class="hover-group">
      <polygon class="geo-poly" points="77.0,131.0 37.0,103.0 33.0,44.0" />
    </g>
    <g id="poly-ACD" class="hover-group">
      <polygon class="geo-poly" points="77.0,131.0 33.0,44.0 104.0,20.0" />
    </g>
    <g id="poly-ADE" class="hover-group">
      <polygon class="geo-poly" points="77.0,131.0 104.0,20.0 144.0,48.0" />
    </g>
    <g id="poly-AEF" class="hover-group">
      <polygon class="geo-poly" points="77.0,131.0 144.0,48.0 184.0,120.0" />
    </g>
    <g id="poly-AFG" class="hover-group">
      <polygon class="geo-poly" points="77.0,131.0 184.0,120.0 156.0,131.0" />
    </g>

    <!-- Boundary Lines -->
    <g id="line-AB" class="hover-group">
      <line class="geo-line" x1="77.0" y1="131.0" x2="37.0" y2="103.0" />
    </g>
    <g id="line-BC" class="hover-group">
      <line class="geo-line" x1="37.0" y1="103.0" x2="33.0" y2="44.0" />
    </g>
    <g id="line-CD" class="hover-group">
      <line class="geo-line" x1="33.0" y1="44.0" x2="104.0" y2="20.0" />
    </g>
    <g id="line-DE" class="hover-group">
      <line class="geo-line" x1="104.0" y1="20.0" x2="144.0" y2="48.0" />
    </g>
    <g id="line-EF" class="hover-group">
      <line class="geo-line" x1="144.0" y1="48.0" x2="184.0" y2="120.0" />
    </g>
    <g id="line-FG" class="hover-group">
      <line class="geo-line" x1="184.0" y1="120.0" x2="156.0" y2="131.0" />
    </g>
    <g id="line-GA" class="hover-group">
      <line class="geo-line" x1="156.0" y1="131.0" x2="77.0" y2="131.0" />
    </g>

    <!-- Diagonals from A -->
    <g id="line-AC" class="hover-group">
      <line class="geo-line" x1="77.0" y1="131.0" x2="33.0" y2="44.0" />
    </g>
    <g id="line-AD" class="hover-group">
      <line class="geo-line" x1="77.0" y1="131.0" x2="104.0" y2="20.0" />
    </g>
    <g id="line-AE" class="hover-group">
      <line class="geo-line" x1="77.0" y1="131.0" x2="144.0" y2="48.0" />
    </g>
    <g id="line-AF" class="hover-group">
      <line class="geo-line" x1="77.0" y1="131.0" x2="184.0" y2="120.0" />
    </g>

    <!-- Points -->
    <g id="point-A" class="hover-group">
      <circle class="geo-point" cx="77.0" cy="131.0" r="3.5" />
      <text class="geo-label" x="77.0" y="144.0" text-anchor="middle">A</text>
    </g>
    <g id="point-B" class="hover-group">
      <circle class="geo-point" cx="37.0" cy="103.0" r="3.5" />
      <text class="geo-label" x="29.0" y="103.0" text-anchor="end">B</text>
    </g>
    <g id="point-C" class="hover-group">
      <circle class="geo-point" cx="33.0" cy="44.0" r="3.5" />
      <text class="geo-label" x="25.0" y="44.0" text-anchor="end">C</text>
    </g>
    <g id="point-D" class="hover-group">
      <circle class="geo-point" cx="104.0" cy="20.0" r="3.5" />
      <text class="geo-label" x="104.0" y="11.0" text-anchor="middle">D</text>
    </g>
    <g id="point-E" class="hover-group">
      <circle class="geo-point" cx="144.0" cy="48.0" r="3.5" />
      <text class="geo-label" x="152.0" y="44.0" text-anchor="start">E</text>
    </g>
    <g id="point-F" class="hover-group">
      <circle class="geo-point" cx="184.0" cy="120.0" r="3.5" />
      <text class="geo-label" x="190.0" y="120.0" text-anchor="start">F</text>
    </g>
    <g id="point-G" class="hover-group">
      <circle class="geo-point" cx="156.0" cy="131.0" r="3.5" />
      <text class="geo-label" x="156.0" y="144.0" text-anchor="middle">G</text>
    </g>
  </g>
</svg>
