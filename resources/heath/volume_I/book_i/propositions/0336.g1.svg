<svg xmlns="http://www.w3.org/2000/svg" viewBox="17 4 183 159" class="euclid-graphic" data-graphic-id="0336.g1" width="183" height="159">
  <title>Euclid's Elements, Book I, Proposition 32 (Extension to Convex Polygons)</title>
  <desc>A convex 7-sided polygon divided into 5 triangles by diagonals drawn from vertex A to all other non-adjacent vertices.</desc>
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #ef4444;
    }
