<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 135" width="220" height="135" class="euclid-graphic" data-graphic-id="0337.g1" data-folio="0337" data-graphic="g1" data-proposition="I.33">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circles & Infinite Lines) -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
    <polygon id="el-poly-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt;;&lt; B A C &gt;;&lt; B C A &gt;;&lt; C A B &gt;;&lt; C B A &gt;" data-type="polygon" points="34,15.5 199,15.5 13,113.5" class="geom-polygon" />
    <polygon id="el-poly-DCB" data-ref="&lt; D C B &gt;" data-aliases="&lt; D B C &gt;;&lt; C D B &gt;;&lt; C B D &gt;;&lt; B D C &gt;;&lt; B C D &gt;" data-type="polygon" points="178,113.5 13,113.5 199,15.5" class="geom-polygon" />
    <polygon id="el-poly-ACDB" data-ref="&lt; A C D B &gt;" data-aliases="&lt; B D C A &gt;;&lt; C D B A &gt;;&lt; A B D C &gt;;&lt; D B A C &gt;;&lt; C A B D &gt;;&lt; B A C D &gt;;&lt; D C A B &gt;" data-type="polygon" points="34,15.5 13,113.5 178,113.5 199,15.5" class="geom-polygon" />
    <path id="el-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A )" data-type="wedge" d="M 199 15.5 L 179.00 15.50 A 20 20 0 0 0 181.31 24.82 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BCD" data-ref="&lt; B C D )" data-aliases="&lt; D C B )" data-type="wedge" d="M 13 113.5 L 30.69 104.18 A 20 20 0 0 1 33.00 113.50 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ACB" data-ref="&lt; A C B )" data-aliases="&lt; B C A )" data-type="wedge" d="M 13 113.5 L 17.19 93.94 A 20 20 0 0 1 30.69 104.18 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-CBD" data-ref="&lt; C B D )" data-aliases="&lt; D B C )" data-type="wedge" d="M 199 15.5 L 181.31 24.82 A 20 20 0 0 0 194.81 35.06 Z" class="wedge angle geom-overlay" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="34" y1="15.5" x2="199" y2="15.5" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="13" y1="113.5" x2="178" y2="113.5" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="34" y1="15.5" x2="13" y2="113.5" class="geom-line" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="199" y1="15.5" x2="178" y2="113.5" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="199" y1="15.5" x2="13" y2="113.5" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt;;&lt; B A C &gt;;&lt; B C A &gt;;&lt; C A B &gt;;&lt; C B A &gt;" points="34,15.5 199,15.5 13,113.5" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-DCB" data-ref="&lt; D C B &gt;" data-aliases="&lt; D B C &gt;;&lt; C D B &gt;;&lt; C B D &gt;;&lt; B D C &gt;;&lt; B C D &gt;" points="178,113.5 13,113.5 199,15.5" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-ACDB" data-ref="&lt; A C D B &gt;" data-aliases="&lt; B D C A &gt;;&lt; C D B A &gt;;&lt; A B D C &gt;;&lt; D B A C &gt;;&lt; C A B D &gt;;&lt; B A C D &gt;;&lt; D C A B &gt;" points="34,15.5 13,113.5 178,113.5 199,15.5" class="geom-polygon geom-overlay" />
    <path id="hl-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A )" d="M 199 15.5 L 179.00 15.50 A 20 20 0 0 0 181.31 24.82 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-BCD" data-ref="&lt; B C D )" data-aliases="&lt; D C B )" d="M 13 113.5 L 30.69 104.18 A 20 20 0 0 1 33.00 113.50 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ACB" data-ref="&lt; A C B )" data-aliases="&lt; B C A )" d="M 13 113.5 L 17.19 93.94 A 20 20 0 0 1 30.69 104.18 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-CBD" data-ref="&lt; C B D )" data-aliases="&lt; D B C )" d="M 199 15.5 L 181.31 24.82 A 20 20 0 0 0 194.81 35.06 Z" class="wedge angle geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="34" y1="15.5" x2="199" y2="15.5" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="13" y1="113.5" x2="178" y2="113.5" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="34" y1="15.5" x2="13" y2="113.5" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="199" y1="15.5" x2="178" y2="113.5" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="199" y1="15.5" x2="13" y2="113.5" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="34" cy="15.5" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="199" cy="15.5" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="13" cy="113.5" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="178" cy="113.5" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="34" y="11" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="199" y="11" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="13" y="128" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="178" y="128" text-anchor="middle" class="geom-label">D</text>
  </g>
</svg>
