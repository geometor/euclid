<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 235 135" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .geo-poly { fill: #000000; fill-opacity: 0.04; stroke: none; transition: fill-opacity 0.15s ease, fill 0.15s ease; }
      .geo-line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-point { fill: #000000; stroke: #ffffff; stroke-width: 1.5; transition: fill 0.15s ease, r 0.15s ease; }
      .geo-label { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #000000; dominant-baseline: middle; user-select: none; }
      .hover-group { pointer-events: all; }
      .hover-group:hover .geo-poly { fill-opacity: 0.15; fill: #0284c7; }
      .hover-group:hover .geo-line { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .hover-group:hover .geo-point { fill: #0284c7 !important; r: 5 !important; }
      .hover-group:hover .geo-label { fill: #0284c7 !important; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Base geometry -->
  <g id="geometry">
    <!-- Component Triangles -->
    <g id="poly-ABC" class="hover-group">
      <polygon class="geo-poly" points="37.0,37.0 202.0,37.0 16.0,117.5" />
    </g>
    <g id="poly-DCB" class="hover-group">
      <polygon class="geo-poly" points="181.0,117.5 16.0,117.5 202.0,37.0" />
    </g>

    <!-- Parallelogram Lines -->
    <g id="line-AB" class="hover-group">
      <line class="geo-line" x1="37.0" y1="37.0" x2="202.0" y2="37.0" />
    </g>
    <g id="line-CD" class="hover-group">
      <line class="geo-line" x1="16.0" y1="117.5" x2="181.0" y2="117.5" />
    </g>
    <g id="line-AC" class="hover-group">
      <line class="geo-line" x1="37.0" y1="37.0" x2="16.0" y2="117.5" />
    </g>
    <g id="line-BD" class="hover-group">
      <line class="geo-line" x1="202.0" y1="37.0" x2="181.0" y2="117.5" />
    </g>

    <!-- Diagonal BC -->
    <g id="line-BC" class="hover-group">
      <line class="geo-line" x1="202.0" y1="37.0" x2="16.0" y2="117.5" />
    </g>

    <!-- Points -->
    <g id="point-A" class="hover-group">
      <circle class="geo-point" cx="37.0" cy="37.0" r="3.5" />
      <text class="geo-label" x="37.0" y="26.0" text-anchor="middle">A</text>
    </g>
    <g id="point-B" class="hover-group">
      <circle class="geo-point" cx="202.0" cy="37.0" r="3.5" />
      <text class="geo-label" x="202.0" y="26.0" text-anchor="middle">B</text>
    </g>
    <g id="point-C" class="hover-group">
      <circle class="geo-point" cx="16.0" cy="117.5" r="3.5" />
      <text class="geo-label" x="16.0" y="127.0" text-anchor="middle">C</text>
    </g>
    <g id="point-D" class="hover-group">
      <circle class="geo-point" cx="181.0" cy="117.5" r="3.5" />
      <text class="geo-label" x="181.0" y="127.0" text-anchor="middle">D</text>
    </g>
  </g>
</svg>
