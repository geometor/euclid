<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 240" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .geo-poly { fill: #000000; fill-opacity: 0.04; stroke: none; transition: fill-opacity 0.15s ease, fill 0.15s ease; }
      .geo-line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-point { fill: #000000; stroke: #ffffff; stroke-width: 1.5; transition: fill 0.15s ease, r 0.15s ease; }
      .geo-label { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #000000; dominant-baseline: middle; user-select: none; }
      .hover-group { pointer-events: all; }
      .hover-group:hover .geo-poly { fill-opacity: 0.15; fill: #0284c7; }
      .hover-group:hover .geo-line { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .hover-group:hover .geo-point { fill: #0284c7 !important; r: 5 !important; }
      .hover-group:hover .geo-label { fill: #0284c7 !important; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Base geometry -->
  <g id="geometry">
    <!-- Congruent Triangles -->
    <g id="poly-EAG" class="hover-group">
      <polygon class="geo-poly" points="23.0,180.0 23.0,134.0 81.0,134.0" />
    </g>
    <g id="poly-KHG" class="hover-group">
      <polygon class="geo-poly" points="139.0,88.0 139.0,134.0 81.0,134.0" />
    </g>
    <g id="poly-FBH" class="hover-group">
      <polygon class="geo-poly" points="197.0,88.0 197.0,134.0 139.0,134.0" />
    </g>

    <!-- Lines -->
    <g id="line-AB" class="hover-group">
      <line class="geo-line" x1="23.0" y1="134.0" x2="197.0" y2="134.0" />
    </g>
    <g id="line-AC" class="hover-group">
      <line class="geo-line" x1="23.0" y1="134.0" x2="23.0" y2="226.0" />
    </g>
    <g id="line-BD" class="hover-group">
      <line class="geo-line" x1="197.0" y1="134.0" x2="197.0" y2="42.0" />
    </g>
    <g id="line-ED" class="hover-group">
      <line class="geo-line" x1="23.0" y1="180.0" x2="197.0" y2="42.0" />
    </g>
    <g id="line-CF" class="hover-group">
      <line class="geo-line" x1="23.0" y1="226.0" x2="197.0" y2="88.0" />
    </g>
    <g id="line-HK" class="hover-group">
      <line class="geo-line" x1="139.0" y1="134.0" x2="139.0" y2="88.0" />
    </g>

    <!-- Points -->
    <g id="point-A" class="hover-group">
      <circle class="geo-point" cx="23.0" cy="134.0" r="3.5" />
      <text class="geo-label" x="9.0" y="134.0" text-anchor="end">A</text>
    </g>
    <g id="point-B" class="hover-group">
      <circle class="geo-point" cx="197.0" cy="134.0" r="3.5" />
      <text class="geo-label" x="211.0" y="134.0" text-anchor="start">B</text>
    </g>
    <g id="point-C" class="hover-group">
      <circle class="geo-point" cx="23.0" cy="226.0" r="3.5" />
      <text class="geo-label" x="10.0" y="226.0" text-anchor="end">C</text>
    </g>
    <g id="point-D" class="hover-group">
      <circle class="geo-point" cx="197.0" cy="42.0" r="3.5" />
      <text class="geo-label" x="211.0" y="42.0" text-anchor="start">D</text>
    </g>
    <g id="point-E" class="hover-group">
      <circle class="geo-point" cx="23.0" cy="180.0" r="3.5" />
      <text class="geo-label" x="9.0" y="180.0" text-anchor="end">E</text>
    </g>
    <g id="point-F" class="hover-group">
      <circle class="geo-point" cx="197.0" cy="88.0" r="3.5" />
      <text class="geo-label" x="211.0" y="88.0" text-anchor="start">F</text>
    </g>
    <g id="point-G" class="hover-group">
      <circle class="geo-point" cx="81.0" cy="134.0" r="3.5" />
      <text class="geo-label" x="77.0" y="125.0" text-anchor="end">G</text>
    </g>
    <g id="point-H" class="hover-group">
      <circle class="geo-point" cx="139.0" cy="134.0" r="3.5" />
      <text class="geo-label" x="133.0" y="146.0" text-anchor="end">H</text>
    </g>
    <g id="point-K" class="hover-group">
      <circle class="geo-point" cx="139.0" cy="88.0" r="3.5" />
      <text class="geo-label" x="144.0" y="82.0" text-anchor="start">K</text>
    </g>
  </g>
</svg>
