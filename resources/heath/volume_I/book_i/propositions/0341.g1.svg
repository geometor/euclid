<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 265 140" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .geo-poly { fill: #000000; fill-opacity: 0.04; stroke: none; transition: fill-opacity 0.15s ease, fill 0.15s ease; }
      .geo-line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-point { fill: #000000; stroke: #ffffff; stroke-width: 1.5; transition: fill 0.15s ease, r 0.15s ease; }
      .geo-label { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #000000; dominant-baseline: middle; user-select: none; }
      .hover-group { pointer-events: all; }
      .hover-group:hover .geo-poly { fill-opacity: 0.15; fill: #0284c7; }
      .hover-group:hover .geo-line { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .hover-group:hover .geo-point { fill: #0284c7 !important; r: 5 !important; }
      .hover-group:hover .geo-label { fill: #0284c7 !important; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Base geometry -->
  <g id="geometry">
    <!-- Component Polygons -->
    <g id="poly-ABCD" class="hover-group">
      <polygon class="geo-poly" points="30.0,24.5 123.0,24.5 145.0,106.5 52.0,106.5" />
    </g>
    <g id="poly-EBCF" class="hover-group">
      <polygon class="geo-poly" points="145.0,24.5 238.0,24.5 145.0,106.5 52.0,106.5" />
    </g>
    <g id="poly-DGE" class="hover-group">
      <polygon class="geo-poly" points="123.0,24.5 145.0,24.5 127.2,40.2" />
    </g>

    <!-- Lines -->
    <g id="line-AF" class="hover-group">
      <line class="geo-line" x1="30.0" y1="24.5" x2="238.0" y2="24.5" />
    </g>
    <g id="line-BC" class="hover-group">
      <line class="geo-line" x1="52.0" y1="106.5" x2="145.0" y2="106.5" />
    </g>
    <g id="line-AB" class="hover-group">
      <line class="geo-line" x1="30.0" y1="24.5" x2="52.0" y2="106.5" />
    </g>
    <g id="line-DC" class="hover-group">
      <line class="geo-line" x1="123.0" y1="24.5" x2="145.0" y2="106.5" />
    </g>
    <g id="line-EB" class="hover-group">
      <line class="geo-line" x1="145.0" y1="24.5" x2="52.0" y2="106.5" />
    </g>
    <g id="line-FC" class="hover-group">
      <line class="geo-line" x1="238.0" y1="24.5" x2="145.0" y2="106.5" />
    </g>

    <!-- Points -->
    <g id="point-A" class="hover-group">
      <circle class="geo-point" cx="30.0" cy="24.5" r="3.5" />
      <text class="geo-label" x="30.0" y="14.0" text-anchor="middle">A</text>
    </g>
    <g id="point-D" class="hover-group">
      <circle class="geo-point" cx="123.0" cy="24.5" r="3.5" />
      <text class="geo-label" x="123.0" y="14.0" text-anchor="middle">D</text>
    </g>
    <g id="point-E" class="hover-group">
      <circle class="geo-point" cx="145.0" cy="24.5" r="3.5" />
      <text class="geo-label" x="145.0" y="14.0" text-anchor="middle">E</text>
    </g>
    <g id="point-F" class="hover-group">
      <circle class="geo-point" cx="238.0" cy="24.5" r="3.5" />
      <text class="geo-label" x="238.0" y="14.0" text-anchor="middle">F</text>
    </g>
    <g id="point-G" class="hover-group">
      <circle class="geo-point" cx="127.2" cy="40.2" r="3.5" />
      <text class="geo-label" x="134.0" y="44.0" text-anchor="start">G</text>
    </g>
    <g id="point-B" class="hover-group">
      <circle class="geo-point" cx="52.0" cy="106.5" r="3.5" />
      <text class="geo-label" x="52.0" y="120.0" text-anchor="middle">B</text>
    </g>
    <g id="point-C" class="hover-group">
      <circle class="geo-point" cx="145.0" cy="106.5" r="3.5" />
      <text class="geo-label" x="145.0" y="120.0" text-anchor="middle">C</text>
    </g>
  </g>
</svg>
