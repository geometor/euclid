<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 138" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .geo-poly { fill: #000000; fill-opacity: 0.04; stroke: none; transition: fill-opacity 0.15s ease, fill 0.15s ease; }
      .geo-line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-aux { stroke: #000000; stroke-width: 2.0; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-point { fill: #000000; stroke: #ffffff; stroke-width: 1.5; transition: fill 0.15s ease, r 0.15s ease; }
      .geo-label { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #000000; dominant-baseline: middle; user-select: none; }
      .hover-group { pointer-events: all; }
      .hover-group:hover .geo-poly { fill-opacity: 0.15; fill: #0284c7; }
      .hover-group:hover .geo-line { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .hover-group:hover .geo-aux { stroke: #0284c7 !important; stroke-width: 3.0 !important; }
      .hover-group:hover .geo-point { fill: #0284c7 !important; r: 5 !important; }
      .hover-group:hover .geo-label { fill: #0284c7 !important; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Base geometry -->
  <g id="geometry">
    <!-- Component Parallelograms -->
    <g id="poly-ABCD" class="hover-group">
      <polygon class="geo-poly" points="60.0,29.0 141.0,29.0 135.0,121.0 54.0,121.0" />
    </g>
    <g id="poly-EFGH" class="hover-group">
      <polygon class="geo-poly" points="212.0,29.0 293.0,29.0 327.0,121.0 246.0,121.0" />
    </g>
    <g id="poly-EBCH" class="hover-group">
      <polygon class="geo-poly" points="212.0,29.0 293.0,29.0 135.0,121.0 54.0,121.0" />
    </g>

    <!-- Parallels -->
    <g id="line-AH" class="hover-group">
      <line class="geo-line" x1="60.0" y1="29.0" x2="293.0" y2="29.0" />
    </g>
    <g id="line-BG" class="hover-group">
      <line class="geo-line" x1="54.0" y1="121.0" x2="327.0" y2="121.0" />
    </g>

    <!-- Parallelogram ABCD sides -->
    <g id="line-AB" class="hover-group">
      <line class="geo-line" x1="60.0" y1="29.0" x2="54.0" y2="121.0" />
    </g>
    <g id="line-DC" class="hover-group">
      <line class="geo-line" x1="141.0" y1="29.0" x2="135.0" y2="121.0" />
    </g>

    <!-- Parallelogram EFGH sides -->
    <g id="line-EF" class="hover-group">
      <line class="geo-line" x1="212.0" y1="29.0" x2="246.0" y2="121.0" />
    </g>
    <g id="line-HG" class="hover-group">
      <line class="geo-line" x1="293.0" y1="29.0" x2="327.0" y2="121.0" />
    </g>

    <!-- Auxiliary Lines BE and CH -->
    <g id="line-BE" class="hover-group">
      <line class="geo-aux" x1="54.0" y1="121.0" x2="212.0" y2="29.0" />
    </g>
    <g id="line-CH" class="hover-group">
      <line class="geo-aux" x1="135.0" y1="121.0" x2="293.0" y2="29.0" />
    </g>

    <!-- Points -->
    <g id="point-A" class="hover-group">
      <circle class="geo-point" cx="60.0" cy="29.0" r="3.5" />
      <text class="geo-label" x="60.0" y="17.0" text-anchor="middle">A</text>
    </g>
    <g id="point-D" class="hover-group">
      <circle class="geo-point" cx="141.0" cy="29.0" r="3.5" />
      <text class="geo-label" x="141.0" y="17.0" text-anchor="middle">D</text>
    </g>
    <g id="point-E" class="hover-group">
      <circle class="geo-point" cx="212.0" cy="29.0" r="3.5" />
      <text class="geo-label" x="212.0" y="17.0" text-anchor="middle">E</text>
    </g>
    <g id="point-H" class="hover-group">
      <circle class="geo-point" cx="293.0" cy="29.0" r="3.5" />
      <text class="geo-label" x="293.0" y="17.0" text-anchor="middle">H</text>
    </g>
    <g id="point-B" class="hover-group">
      <circle class="geo-point" cx="54.0" cy="121.0" r="3.5" />
      <text class="geo-label" x="54.0" y="133.0" text-anchor="middle">B</text>
    </g>
    <g id="point-C" class="hover-group">
      <circle class="geo-point" cx="135.0" cy="121.0" r="3.5" />
      <text class="geo-label" x="135.0" y="133.0" text-anchor="middle">C</text>
    </g>
    <g id="point-F" class="hover-group">
      <circle class="geo-point" cx="246.0" cy="121.0" r="3.5" />
      <text class="geo-label" x="246.0" y="133.0" text-anchor="middle">F</text>
    </g>
    <g id="point-G" class="hover-group">
      <circle class="geo-point" cx="327.0" cy="121.0" r="3.5" />
      <text class="geo-label" x="327.0" y="133.0" text-anchor="middle">G</text>
    </g>
  </g>
</svg>
