<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255 136" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .geo-poly { fill: #000000; fill-opacity: 0.04; stroke: none; transition: fill-opacity 0.15s ease, fill 0.15s ease; }
      .geo-line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-point { fill: #000000; stroke: #ffffff; stroke-width: 1.5; transition: fill 0.15s ease, r 0.15s ease; }
      .geo-label { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #000000; dominant-baseline: middle; user-select: none; }
      .hover-group { pointer-events: all; }
      .hover-group:hover .geo-poly { fill-opacity: 0.15; fill: #0284c7; }
      .hover-group:hover .geo-line { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .hover-group:hover .geo-point { fill: #0284c7 !important; r: 5 !important; }
      .hover-group:hover .geo-label { fill: #0284c7 !important; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Base geometry -->
  <g id="geometry">
    <!-- Component Triangles -->
    <g id="poly-ABC" class="hover-group">
      <polygon class="geo-poly" points="120.0,29.0 64.0,109.5 153.0,109.5" />
    </g>
    <g id="poly-DBC" class="hover-group">
      <polygon class="geo-poly" points="140.0,29.0 64.0,109.5 153.0,109.5" />
    </g>
    <g id="poly-EAB" class="hover-group">
      <polygon class="geo-poly" points="31.0,29.0 120.0,29.0 64.0,109.5" />
    </g>
    <g id="poly-FDC" class="hover-group">
      <polygon class="geo-poly" points="229.0,29.0 140.0,29.0 153.0,109.5" />
    </g>

    <!-- Parallels -->
    <g id="line-EF" class="hover-group">
      <line class="geo-line" x1="20.0" y1="29.0" x2="235.0" y2="29.0" />
    </g>
    <g id="line-BC" class="hover-group">
      <line class="geo-line" x1="64.0" y1="109.5" x2="153.0" y2="109.5" />
    </g>

    <!-- Parallelogram sides & triangle sides -->
    <g id="line-EB" class="hover-group">
      <line class="geo-line" x1="31.0" y1="29.0" x2="64.0" y2="109.5" />
    </g>
    <g id="line-AB" class="hover-group">
      <line class="geo-line" x1="120.0" y1="29.0" x2="64.0" y2="109.5" />
    </g>
    <g id="line-AC" class="hover-group">
      <line class="geo-line" x1="120.0" y1="29.0" x2="153.0" y2="109.5" />
    </g>
    <g id="line-DB" class="hover-group">
      <line class="geo-line" x1="140.0" y1="29.0" x2="64.0" y2="109.5" />
    </g>
    <g id="line-DC" class="hover-group">
      <line class="geo-line" x1="140.0" y1="29.0" x2="153.0" y2="109.5" />
    </g>
    <g id="line-FC" class="hover-group">
      <line class="geo-line" x1="229.0" y1="29.0" x2="153.0" y2="109.5" />
    </g>

    <!-- Points -->
    <g id="point-E" class="hover-group">
      <circle class="geo-point" cx="31.0" cy="29.0" r="3.5" />
      <text class="geo-label" x="23.0" y="22.0" text-anchor="end">E</text>
    </g>
    <g id="point-A" class="hover-group">
      <circle class="geo-point" cx="120.0" cy="29.0" r="3.5" />
      <text class="geo-label" x="119.0" y="17.0" text-anchor="middle">A</text>
    </g>
    <g id="point-D" class="hover-group">
      <circle class="geo-point" cx="140.0" cy="29.0" r="3.5" />
      <text class="geo-label" x="140.0" y="17.0" text-anchor="middle">D</text>
    </g>
    <g id="point-F" class="hover-group">
      <circle class="geo-point" cx="229.0" cy="29.0" r="3.5" />
      <text class="geo-label" x="235.0" y="22.0" text-anchor="start">F</text>
    </g>
    <g id="point-B" class="hover-group">
      <circle class="geo-point" cx="64.0" cy="109.5" r="3.5" />
      <text class="geo-label" x="63.0" y="121.0" text-anchor="middle">B</text>
    </g>
    <g id="point-C" class="hover-group">
      <circle class="geo-point" cx="153.0" cy="109.5" r="3.5" />
      <text class="geo-label" x="153.0" y="121.0" text-anchor="middle">C</text>
    </g>
  </g>
</svg>
