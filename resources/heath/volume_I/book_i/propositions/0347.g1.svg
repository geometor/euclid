<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 335 140" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .geo-poly { fill: #000000; fill-opacity: 0.04; stroke: none; transition: fill-opacity 0.15s ease, fill 0.15s ease; }
      .geo-line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-point { fill: #000000; stroke: #ffffff; stroke-width: 1.5; transition: fill 0.15s ease, r 0.15s ease; }
      .geo-label { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #000000; dominant-baseline: middle; user-select: none; }
      .hover-group { pointer-events: all; }
      .hover-group:hover .geo-poly { fill-opacity: 0.15; fill: #0284c7; }
      .hover-group:hover .geo-line { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .hover-group:hover .geo-point { fill: #0284c7 !important; r: 5 !important; }
      .hover-group:hover .geo-label { fill: #0284c7 !important; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Base geometry -->
  <g id="geometry">
    <!-- Component Triangles -->
    <g id="poly-ABC" class="hover-group">
      <polygon class="geo-poly" points="128.0,31.0 28.0,101.0 112.0,101.0" />
    </g>
    <g id="poly-DEF" class="hover-group">
      <polygon class="geo-poly" points="150.5,31.0 189.0,101.0 273.0,101.0" />
    </g>
    <g id="poly-GAB" class="hover-group">
      <polygon class="geo-poly" points="43.5,31.0 128.0,31.0 28.0,101.0" />
    </g>
    <g id="poly-DHF" class="hover-group">
      <polygon class="geo-poly" points="150.5,31.0 234.5,31.0 273.0,101.0" />
    </g>

    <!-- Parallels -->
    <g id="line-GH" class="hover-group">
      <line class="geo-line" x1="40.0" y1="31.0" x2="240.0" y2="31.0" />
    </g>
    <g id="line-BF" class="hover-group">
      <line class="geo-line" x1="25.0" y1="101.0" x2="278.0" y2="101.0" />
    </g>

    <!-- Triangle and Parallelogram sides -->
    <g id="line-GB" class="hover-group">
      <line class="geo-line" x1="43.5" y1="31.0" x2="28.0" y2="101.0" />
    </g>
    <g id="line-AB" class="hover-group">
      <line class="geo-line" x1="128.0" y1="31.0" x2="28.0" y2="101.0" />
    </g>
    <g id="line-AC" class="hover-group">
      <line class="geo-line" x1="128.0" y1="31.0" x2="112.0" y2="101.0" />
    </g>
    <g id="line-DE" class="hover-group">
      <line class="geo-line" x1="150.5" y1="31.0" x2="189.0" y2="101.0" />
    </g>
    <g id="line-DF" class="hover-group">
      <line class="geo-line" x1="150.5" y1="31.0" x2="273.0" y2="101.0" />
    </g>
    <g id="line-HF" class="hover-group">
      <line class="geo-line" x1="234.5" y1="31.0" x2="273.0" y2="101.0" />
    </g>

    <!-- Points -->
    <g id="point-G" class="hover-group">
      <circle class="geo-point" cx="43.5" cy="31.0" r="3.5" />
      <text class="geo-label" x="44.0" y="21.0" text-anchor="middle">G</text>
    </g>
    <g id="point-A" class="hover-group">
      <circle class="geo-point" cx="128.0" cy="31.0" r="3.5" />
      <text class="geo-label" x="127.0" y="21.0" text-anchor="middle">A</text>
    </g>
    <g id="point-D" class="hover-group">
      <circle class="geo-point" cx="150.5" cy="31.0" r="3.5" />
      <text class="geo-label" x="153.0" y="21.0" text-anchor="middle">D</text>
    </g>
    <g id="point-H" class="hover-group">
      <circle class="geo-point" cx="234.5" cy="31.0" r="3.5" />
      <text class="geo-label" x="236.0" y="21.0" text-anchor="middle">H</text>
    </g>
    <g id="point-B" class="hover-group">
      <circle class="geo-point" cx="28.0" cy="101.0" r="3.5" />
      <text class="geo-label" x="28.0" y="113.0" text-anchor="middle">B</text>
    </g>
    <g id="point-C" class="hover-group">
      <circle class="geo-point" cx="112.0" cy="101.0" r="3.5" />
      <text class="geo-label" x="112.0" y="113.0" text-anchor="middle">C</text>
    </g>
    <g id="point-E" class="hover-group">
      <circle class="geo-point" cx="189.0" cy="101.0" r="3.5" />
      <text class="geo-label" x="189.0" y="113.0" text-anchor="middle">E</text>
    </g>
    <g id="point-F" class="hover-group">
      <circle class="geo-point" cx="273.0" cy="101.0" r="3.5" />
      <text class="geo-label" x="273.0" y="113.0" text-anchor="middle">F</text>
    </g>
  </g>
</svg>
