<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 132" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .geo-poly { fill: #000000; fill-opacity: 0.04; stroke: none; transition: fill-opacity 0.15s ease, fill 0.15s ease; }
      .geo-line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-point { fill: #000000; stroke: #ffffff; stroke-width: 1.5; transition: fill 0.15s ease, r 0.15s ease; }
      .geo-label { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #000000; dominant-baseline: middle; user-select: none; }
      .hover-group { pointer-events: all; }
      .hover-group:hover .geo-poly { fill-opacity: 0.15; fill: #0284c7; }
      .hover-group:hover .geo-line { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .hover-group:hover .geo-point { fill: #0284c7 !important; r: 5 !important; }
      .hover-group:hover .geo-label { fill: #0284c7 !important; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Base geometry -->
  <g id="geometry">
    <!-- Component Triangles -->
    <g id="poly-ABC" class="hover-group">
      <polygon class="geo-poly" points="132.5,17.0 75.0,82.0 223.0,82.0" />
    </g>
    <g id="poly-DEF" class="hover-group">
      <polygon class="geo-poly" points="313.0,17.0 256.0,82.0 353.0,115.0" />
    </g>
    <g id="poly-DEH" class="hover-group">
      <polygon class="geo-poly" points="313.0,17.0 256.0,82.0 392.0,70.0" />
    </g>
    <g id="poly-DEG" class="hover-group">
      <polygon class="geo-poly" points="313.0,17.0 256.0,82.0 404.0,82.0" />
    </g>

    <!-- Left Figure Lines (Triangle ABC) -->
    <g id="line-AB" class="hover-group">
      <line class="geo-line" x1="132.5" y1="17.0" x2="75.0" y2="82.0" />
    </g>
    <g id="line-AC" class="hover-group">
      <line class="geo-line" x1="132.5" y1="17.0" x2="223.0" y2="82.0" />
    </g>
    <g id="line-BC" class="hover-group">
      <line class="geo-line" x1="75.0" y1="82.0" x2="223.0" y2="82.0" />
    </g>

    <!-- Right Figure Lines (Heron Case 2) -->
    <g id="line-DE" class="hover-group">
      <line class="geo-line" x1="313.0" y1="17.0" x2="256.0" y2="82.0" />
    </g>
    <g id="line-DF" class="hover-group">
      <line class="geo-line" x1="313.0" y1="17.0" x2="353.0" y2="115.0" />
    </g>
    <g id="line-EF" class="hover-group">
      <line class="geo-line" x1="256.0" y1="82.0" x2="353.0" y2="115.0" />
    </g>
    <g id="line-DG" class="hover-group">
      <line class="geo-line" x1="313.0" y1="17.0" x2="404.0" y2="82.0" />
    </g>
    <g id="line-FH" class="hover-group">
      <line class="geo-line" x1="353.0" y1="115.0" x2="392.0" y2="70.0" />
    </g>
    <g id="line-EH" class="hover-group">
      <line class="geo-line" x1="256.0" y1="82.0" x2="392.0" y2="70.0" />
    </g>
    <g id="line-EG" class="hover-group">
      <line class="geo-line" x1="256.0" y1="82.0" x2="404.0" y2="82.0" />
    </g>

    <!-- Left Points -->
    <g id="point-A" class="hover-group">
      <circle class="geo-point" cx="132.5" cy="17.0" r="3.5" />
      <text class="geo-label" x="132.5" y="7.0" text-anchor="middle">A</text>
    </g>
    <g id="point-B" class="hover-group">
      <circle class="geo-point" cx="75.0" cy="82.0" r="3.5" />
      <text class="geo-label" x="75.0" y="94.0" text-anchor="middle">B</text>
    </g>
    <g id="point-C" class="hover-group">
      <circle class="geo-point" cx="223.0" cy="82.0" r="3.5" />
      <text class="geo-label" x="223.0" y="94.0" text-anchor="middle">C</text>
    </g>

    <!-- Right Points -->
    <g id="point-D" class="hover-group">
      <circle class="geo-point" cx="313.0" cy="17.0" r="3.5" />
      <text class="geo-label" x="313.0" y="7.0" text-anchor="middle">D</text>
    </g>
    <g id="point-E" class="hover-group">
      <circle class="geo-point" cx="256.0" cy="82.0" r="3.5" />
      <text class="geo-label" x="248.0" y="94.0" text-anchor="middle">E</text>
    </g>
    <g id="point-F" class="hover-group">
      <circle class="geo-point" cx="353.0" cy="115.0" r="3.5" />
      <text class="geo-label" x="353.0" y="127.0" text-anchor="middle">F</text>
    </g>
    <g id="point-H" class="hover-group">
      <circle class="geo-point" cx="392.0" cy="70.0" r="3.5" />
      <text class="geo-label" x="402.0" y="68.0" text-anchor="start">H</text>
    </g>
    <g id="point-G" class="hover-group">
      <circle class="geo-point" cx="404.0" cy="82.0" r="3.5" />
      <text class="geo-label" x="414.0" y="86.0" text-anchor="start">G</text>
    </g>
  </g>
</svg>
