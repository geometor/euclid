<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 135" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .geo-poly { fill: #000000; fill-opacity: 0.04; stroke: none; transition: fill-opacity 0.15s ease, fill 0.15s ease; }
      .geo-line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
      .geo-point { fill: #000000; stroke: #ffffff; stroke-width: 1.5; transition: fill 0.15s ease, r 0.15s ease; }
      .geo-label { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #000000; dominant-baseline: middle; user-select: none; }
      .hover-group { pointer-events: all; }
      .hover-group:hover .geo-poly { fill-opacity: 0.15; fill: #0284c7; }
      .hover-group:hover .geo-line { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .hover-group:hover .geo-point { fill: #0284c7 !important; r: 5 !important; }
      .hover-group:hover .geo-label { fill: #0284c7 !important; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Base geometry -->
  <g id="geometry">
    <!-- Component Triangles -->
    <g id="poly-ABC" class="hover-group">
      <polygon class="geo-poly" points="151.0,36.0 43.0,78.5 209.0,78.5" />
    </g>
    <g id="poly-DEF" class="hover-group">
      <polygon class="geo-poly" points="357.0,36.0 246.0,78.5 366.0,105.0" />
    </g>
    <g id="poly-DEH" class="hover-group">
      <polygon class="geo-poly" points="357.0,36.0 246.0,78.5 421.0,78.5" />
    </g>
    <g id="poly-DEG" class="hover-group">
      <polygon class="geo-poly" points="357.0,36.0 246.0,78.5 400.0,65.0" />
    </g>

    <!-- Left Figure Lines (Triangle ABC) -->
    <g id="line-AB" class="hover-group">
      <line class="geo-line" x1="151.0" y1="36.0" x2="43.0" y2="78.5" />
    </g>
    <g id="line-AC" class="hover-group">
      <line class="geo-line" x1="151.0" y1="36.0" x2="209.0" y2="78.5" />
    </g>
    <g id="line-BC" class="hover-group">
      <line class="geo-line" x1="43.0" y1="78.5" x2="209.0" y2="78.5" />
    </g>

    <!-- Right Figure Lines (Heron Case 3) -->
    <g id="line-DE" class="hover-group">
      <line class="geo-line" x1="357.0" y1="36.0" x2="246.0" y2="78.5" />
    </g>
    <g id="line-DF" class="hover-group">
      <line class="geo-line" x1="357.0" y1="36.0" x2="366.0" y2="105.0" />
    </g>
    <g id="line-EF" class="hover-group">
      <line class="geo-line" x1="246.0" y1="78.5" x2="366.0" y2="105.0" />
    </g>
    <g id="line-DH" class="hover-group">
      <line class="geo-line" x1="357.0" y1="36.0" x2="421.0" y2="78.5" />
    </g>
    <g id="line-FH" class="hover-group">
      <line class="geo-line" x1="366.0" y1="105.0" x2="421.0" y2="78.5" />
    </g>
    <g id="line-EH" class="hover-group">
      <line class="geo-line" x1="246.0" y1="78.5" x2="421.0" y2="78.5" />
    </g>
    <g id="line-EG" class="hover-group">
      <line class="geo-line" x1="246.0" y1="78.5" x2="400.0" y2="65.0" />
    </g>

    <!-- Left Points -->
    <g id="point-A" class="hover-group">
      <circle class="geo-point" cx="151.0" cy="36.0" r="3.5" />
      <text class="geo-label" x="151.0" y="26.0" text-anchor="middle">A</text>
    </g>
    <g id="point-B" class="hover-group">
      <circle class="geo-point" cx="43.0" cy="78.5" r="3.5" />
      <text class="geo-label" x="43.0" y="90.0" text-anchor="middle">B</text>
    </g>
    <g id="point-C" class="hover-group">
      <circle class="geo-point" cx="209.0" cy="78.5" r="3.5" />
      <text class="geo-label" x="209.0" y="90.0" text-anchor="middle">C</text>
    </g>

    <!-- Right Points -->
    <g id="point-D" class="hover-group">
      <circle class="geo-point" cx="357.0" cy="36.0" r="3.5" />
      <text class="geo-label" x="357.0" y="26.0" text-anchor="middle">D</text>
    </g>
    <g id="point-E" class="hover-group">
      <circle class="geo-point" cx="246.0" cy="78.5" r="3.5" />
      <text class="geo-label" x="238.0" y="90.0" text-anchor="middle">E</text>
    </g>
    <g id="point-F" class="hover-group">
      <circle class="geo-point" cx="366.0" cy="105.0" r="3.5" />
      <text class="geo-label" x="366.0" y="117.0" text-anchor="middle">F</text>
    </g>
    <g id="point-G" class="hover-group">
      <circle class="geo-point" cx="400.0" cy="65.0" r="3.5" />
      <text class="geo-label" x="406.0" y="57.0" text-anchor="start">G</text>
    </g>
    <g id="point-H" class="hover-group">
      <circle class="geo-point" cx="421.0" cy="78.5" r="3.5" />
      <text class="geo-label" x="428.0" y="78.5" text-anchor="start">H</text>
    </g>
  </g>
</svg>
