<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 135" width="220" height="135">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.2s, stroke-width 0.2s; }
      .line-dashed { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4, 4; fill: none; transition: stroke 0.2s, stroke-width 0.2s; }
      .polygon { fill: #000000; fill-opacity: 0.04; stroke: none; transition: fill 0.2s, fill-opacity 0.2s; }
      .polygon:hover { fill: #0284c7 !important; fill-opacity: 0.15 !important; }
      .line:hover, .line-dashed:hover { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .point { fill: #000000; stroke: #000000; stroke-width: 1; transition: r 0.2s, fill 0.2s; }
      .point:hover { fill: #0284c7 !important; stroke: #0284c7 !important; r: 5 !important; }
      .label { font-family: "Times New Roman", Times, serif; font-size: 19px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Polygons for hover/fill -->
  <g id="polygons">
    <polygon id="poly-abc" class="polygon" points="31,34 31,105 111,105" />
    <polygon id="poly-cde" class="polygon" points="111,105 167,34 191,105" />
    <polygon id="poly-fce" class="polygon" points="156,48 111,105 191,105" />
  </g>

  <!-- Geometry Lines -->
  <g id="lines">
    <!-- Base line BE -->
    <line id="line-be" class="line" x1="31" y1="105" x2="191" y2="105" />
    <!-- Triangle ABC -->
    <line id="line-ab" class="line" x1="31" y1="34" x2="31" y2="105" />
    <line id="line-ac" class="line" x1="31" y1="34" x2="111" y2="105" />
    <!-- Line AD (parallel to BE) -->
    <line id="line-ad" class="line" x1="31" y1="34" x2="167" y2="34" />
    <!-- Triangle CDE -->
    <line id="line-cd" class="line" x1="111" y1="105" x2="167" y2="34" />
    <line id="line-de" class="line" x1="167" y1="34" x2="191" y2="105" />
    <!-- Construction: AF parallel to BE, and FE joined -->
    <line id="line-af" class="line" x1="31" y1="34" x2="156" y2="48" />
    <line id="line-fe" class="line" x1="156" y1="48" x2="191" y2="105" />
  </g>

  <!-- Vertices -->
  <g id="points">
    <circle id="point-a" class="point" cx="31" cy="34" r="3" />
    <circle id="point-b" class="point" cx="31" cy="105" r="3" />
    <circle id="point-c" class="point" cx="111" cy="105" r="3" />
    <circle id="point-d" class="point" cx="167" cy="34" r="3" />
    <circle id="point-e" class="point" cx="191" cy="105" r="3" />
    <circle id="point-f" class="point" cx="156" cy="48" r="3" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text class="label" x="26" y="25">A</text>
    <text class="label" x="28" y="117">B</text>
    <text class="label" x="111" y="117">C</text>
    <text class="label" x="170" y="24">D</text>
    <text class="label" x="193" y="117">E</text>
    <text class="label" x="146" y="55">F</text>
  </g>
</svg>
