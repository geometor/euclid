<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 145" width="215" height="145">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.2s, stroke-width 0.2s; }
      .line-dashed { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4, 4; fill: none; transition: stroke 0.2s, stroke-width 0.2s; }
      .polygon { fill: #000000; fill-opacity: 0.04; stroke: none; transition: fill 0.2s, fill-opacity 0.2s; }
      .polygon:hover { fill: #0284c7 !important; fill-opacity: 0.15 !important; }
      .line:hover, .line-dashed:hover { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .point { fill: #000000; stroke: #000000; stroke-width: 1; transition: r 0.2s, fill 0.2s; }
      .point:hover { fill: #0284c7 !important; stroke: #0284c7 !important; r: 5 !important; }
      .label { font-family: "Times New Roman", Times, serif; font-size: 19px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Polygons for hover/fill -->
  <g id="polygons">
    <polygon id="poly-abcd" class="polygon" points="24,36 48,112 142,112 118,36" />
    <polygon id="poly-ebc" class="polygon" points="184,36 48,112 142,112" />
    <polygon id="poly-abc" class="polygon" points="24,36 48,112 142,112" />
  </g>

  <!-- Geometry Lines -->
  <g id="lines">
    <!-- Top parallel line AE -->
    <line id="line-ae" class="line" x1="24" y1="36" x2="184" y2="36" />
    <!-- Base BC -->
    <line id="line-bc" class="line" x1="48" y1="112" x2="142" y2="112" />
    <!-- Parallelogram sides -->
    <line id="line-ab" class="line" x1="24" y1="36" x2="48" y2="112" />
    <line id="line-cd" class="line" x1="142" y1="112" x2="118" y2="36" />
    <!-- Diagonal AC -->
    <line id="line-ac" class="line" x1="24" y1="36" x2="142" y2="112" />
    <!-- Triangle sides EB, EC -->
    <line id="line-eb" class="line" x1="184" y1="36" x2="48" y2="112" />
    <line id="line-ec" class="line" x1="184" y1="36" x2="142" y2="112" />
  </g>

  <!-- Vertices -->
  <g id="points">
    <circle id="point-a" class="point" cx="24" cy="36" r="3" />
    <circle id="point-b" class="point" cx="48" cy="112" r="3" />
    <circle id="point-c" class="point" cx="142" cy="112" r="3" />
    <circle id="point-d" class="point" cx="118" cy="36" r="3" />
    <circle id="point-e" class="point" cx="184" cy="36" r="3" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text class="label" x="25" y="26">A</text>
    <text class="label" x="48" y="123">B</text>
    <text class="label" x="142" y="123">C</text>
    <text class="label" x="118" y="26">D</text>
    <text class="label" x="184" y="26">E</text>
  </g>
</svg>
