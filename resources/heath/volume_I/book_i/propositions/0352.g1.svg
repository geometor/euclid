    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="142" y1="112" x2="118" y2="36" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="24" y1="36" x2="142" y2="112" class="geom-line geom-overlay" />
    <line id="hl-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" x1="184" y1="36" x2="48" y2="112" class="geom-line geom-overlay" />
