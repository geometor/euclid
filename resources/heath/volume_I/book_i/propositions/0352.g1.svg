    <line id="el-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" data-type="segment" x1="184" y1="36" x2="48" y2="112" class="geom-line" />
    <line id="el-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" data-type="segment" x1="184" y1="36" x2="142" y2="112" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-ABCD" data-ref="&lt; A B C D &gt;" data-aliases="&lt; D C B A &gt; | &lt; B C D A &gt; | &lt; A D C B &gt; | &lt; C D A B &gt; | &lt; B A D C &gt; | &lt; D A B C &gt; | &lt; C B A D &gt;" points="24,36 48,112 142,112 118,36" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-EBC" data-ref="&lt; E B C &gt;" data-aliases="&lt; E C B &gt; | &lt; B E C &gt; | &lt; B C E &gt; | &lt; C E B &gt; | &lt; C B E &gt;" points="184,36 48,112 142,112" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt; | &lt; B A C &gt; | &lt; B C A &gt; | &lt; C A B &gt; | &lt; C B A &gt;" points="24,36 48,112 142,112" class="geom-polygon geom-overlay" />
    <line id="hl-seg-AE" data-ref="/ A E /" data-aliases="/ E A / | / A D E /" x1="24" y1="36" x2="184" y2="36" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="24" y1="36" x2="118" y2="36" class="geom-line geom-overlay" />
