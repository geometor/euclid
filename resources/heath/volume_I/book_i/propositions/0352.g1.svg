    <polygon id="el-poly-EBC" data-ref="&lt; E B C &gt;" data-aliases="&lt; E C B &gt; | &lt; B E C &gt; | &lt; B C E &gt; | &lt; C E B &gt; | &lt; C B E &gt;" data-type="polygon" points="184,36 48,112 142,112" class="geom-polygon" />
    <polygon id="el-poly-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt; | &lt; B A C &gt; | &lt; B C A &gt; | &lt; C A B &gt; | &lt; C B A &gt;" data-type="polygon" points="24,36 48,112 142,112" class="geom-polygon" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A / | / A D E /" data-type="segment" x1="24" y1="36" x2="184" y2="36" class="geom-line" />
