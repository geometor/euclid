<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 126" width="200" height="126">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.2s, stroke-width 0.2s; }
      .line-dashed { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4, 4; fill: none; transition: stroke 0.2s, stroke-width 0.2s; }
      .polygon { fill: #000000; fill-opacity: 0.04; stroke: none; transition: fill 0.2s, fill-opacity 0.2s; }
      .polygon:hover { fill: #0284c7 !important; fill-opacity: 0.15 !important; }
      .line:hover, .line-dashed:hover { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .point { fill: #000000; stroke: #000000; stroke-width: 1; transition: r 0.2s, fill 0.2s; }
      .point:hover { fill: #0284c7 !important; stroke: #0284c7 !important; r: 5 !important; }
      .label { font-family: "Times New Roman", Times, serif; font-size: 19px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Polygons for hover/fill -->
  <g id="polygons">
    <polygon id="poly-abcd" class="polygon" points="22,37 14,96 133,96 44,37" />
    <polygon id="poly-abf" class="polygon" points="22,37 14,96 169,37" />
    <polygon id="poly-aeb" class="polygon" points="22,37 89,66.5 14,96" />
    <polygon id="poly-bec" class="polygon" points="14,96 89,66.5 133,96" />
    <polygon id="poly-fed" class="polygon" points="169,37 89,66.5 44,37" />
  </g>

  <!-- Geometry Lines -->
  <g id="lines">
    <!-- Top parallel line AF (passes through D) -->
    <line id="line-af" class="line" x1="22" y1="37" x2="169" y2="37" />
    <!-- Bottom parallel line BC -->
    <line id="line-bc" class="line" x1="14" y1="96" x2="133" y2="96" />
    <!-- Left side AB -->
    <line id="line-ab" class="line" x1="22" y1="37" x2="14" y2="96" />
    <!-- Right side DC (passes through midpoint E) -->
    <line id="line-dc" class="line" x1="44" y1="37" x2="133" y2="96" />
    <!-- Line BF (passes through E) -->
    <line id="line-bf" class="line" x1="14" y1="96" x2="169" y2="37" />
    <!-- Line EA -->
    <line id="line-ea" class="line" x1="89" y1="66.5" x2="22" y2="37" />
  </g>

  <!-- Vertices -->
  <g id="points">
    <circle id="point-a" class="point" cx="22" cy="37" r="3" />
    <circle id="point-b" class="point" cx="14" cy="96" r="3" />
    <circle id="point-c" class="point" cx="133" cy="96" r="3" />
    <circle id="point-d" class="point" cx="44" cy="37" r="3" />
    <circle id="point-e" class="point" cx="89" cy="66.5" r="3" />
    <circle id="point-f" class="point" cx="169" cy="37" r="3" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text class="label" x="22" y="26">A</text>
    <text class="label" x="14" y="108">B</text>
    <text class="label" x="135" y="108">C</text>
    <text class="label" x="44" y="26">D</text>
    <text class="label" x="92" y="78">E</text>
    <text class="label" x="170" y="26">F</text>
  </g>
</svg>
