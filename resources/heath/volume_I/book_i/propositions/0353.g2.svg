<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312 152" width="312" height="152">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.2s, stroke-width 0.2s; }
      .line-dashed { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4, 4; fill: none; transition: stroke 0.2s, stroke-width 0.2s; }
      .polygon { fill: #000000; fill-opacity: 0.04; stroke: none; transition: fill 0.2s, fill-opacity 0.2s; }
      .polygon:hover { fill: #0284c7 !important; fill-opacity: 0.15 !important; }
      .line:hover, .line-dashed:hover { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .point { fill: #000000; stroke: #000000; stroke-width: 1; transition: r 0.2s, fill 0.2s; }
      .point:hover { fill: #0284c7 !important; stroke: #0284c7 !important; r: 5 !important; }
      .label { font-family: "Times New Roman", Times, serif; font-size: 19px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Polygons for hover/fill -->
  <g id="polygons">
    <polygon id="poly-abc" class="polygon" points="88,37 67,123 195,123" />
    <polygon id="poly-abe" class="polygon" points="88,37 67,123 131,123" />
    <polygon id="poly-aec" class="polygon" points="88,37 131,123 195,123" />
    <polygon id="poly-fecg" class="polygon" points="220,37 131,123 195,123 284,37" />
  </g>

  <!-- Geometry Lines -->
  <g id="lines">
    <!-- Given Angle D -->
    <line id="line-angle-d1" class="line" x1="49.5" y1="37" x2="49.5" y2="90" />
    <line id="line-angle-d2" class="line" x1="14" y1="54" x2="49.5" y2="90" />

    <!-- Top parallel line AG (passes through F) -->
    <line id="line-ag" class="line" x1="88" y1="37" x2="284" y2="37" />
    <!-- Bottom line BC (bisected at E) -->
    <line id="line-bc" class="line" x1="67" y1="123" x2="195" y2="123" />
    <!-- Triangle sides AB, AC, and median AE -->
    <line id="line-ab" class="line" x1="88" y1="37" x2="67" y2="123" />
    <line id="line-ac" class="line" x1="88" y1="37" x2="195" y2="123" />
    <line id="line-ae" class="line" x1="88" y1="37" x2="131" y2="123" />
    <!-- Parallelogram sides EF, CG -->
    <line id="line-ef" class="line" x1="131" y1="123" x2="220" y2="37" />
    <line id="line-cg" class="line" x1="195" y1="123" x2="284" y2="37" />
  </g>

  <!-- Vertices -->
  <g id="points">
    <circle id="point-a" class="point" cx="88" cy="37" r="3" />
    <circle id="point-b" class="point" cx="67" cy="123" r="3" />
    <circle id="point-c" class="point" cx="195" cy="123" r="3" />
    <circle id="point-e" class="point" cx="131" cy="123" r="3" />
    <circle id="point-f" class="point" cx="220" cy="37" r="3" />
    <circle id="point-g" class="point" cx="284" cy="37" r="3" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text class="label" x="38" y="59">D</text>
    <text class="label" x="90" y="26">A</text>
    <text class="label" x="67" y="135">B</text>
    <text class="label" x="195" y="135">C</text>
    <text class="label" x="131" y="135">E</text>
    <text class="label" x="220" y="26">F</text>
    <text class="label" x="287" y="26">G</text>
  </g>
</svg>
