<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 125" width="215" height="125">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.2s, stroke-width 0.2s; }
      .line-dashed { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4, 4; fill: none; transition: stroke 0.2s, stroke-width 0.2s; }
      .polygon { fill: #000000; fill-opacity: 0.04; stroke: none; transition: fill 0.2s, fill-opacity 0.2s; }
      .polygon:hover { fill: #0284c7 !important; fill-opacity: 0.15 !important; }
      .line:hover, .line-dashed:hover { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .point { fill: #000000; stroke: #000000; stroke-width: 1; transition: r 0.2s, fill 0.2s; }
      .point:hover { fill: #0284c7 !important; stroke: #0284c7 !important; r: 5 !important; }
      .label { font-family: "Times New Roman", Times, serif; font-size: 19px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Polygons for hover/fill -->
  <g id="polygons">
    <!-- Non-overlapping parallelograms about diameter -->
    <polygon id="poly-p1" class="polygon" points="17,107 53,107 61.5,85 25.4,85" />
    <polygon id="poly-p2" class="polygon" points="122.2,55 180,55 193,20 135.5,20" />
    <!-- 5-sided complements -->
    <polygon id="poly-comp1" class="polygon" points="50,20 135.5,20 122.2,55 61.5,85 25.4,85" />
    <polygon id="poly-comp2" class="polygon" points="180,55 122.2,55 61.5,85 53,107 160,107" />
  </g>

  <!-- Geometry Lines -->
  <g id="lines">
    <!-- Outer parallelogram -->
    <line id="line-top" class="line" x1="50" y1="20" x2="193" y2="20" />
    <line id="line-bot" class="line" x1="17" y1="107" x2="160" y2="107" />
    <line id="line-left" class="line" x1="50" y1="20" x2="17" y2="107" />
    <line id="line-right" class="line" x1="193" y1="20" x2="160" y2="107" />

    <!-- Diameter -->
    <line id="line-diag" class="line" x1="17" y1="107" x2="193" y2="20" />

    <!-- Parallelogram 1 (bottom-left) inner lines -->
    <line id="line-inner-h1" class="line" x1="25.4" y1="85" x2="61.5" y2="85" />
    <line id="line-inner-v1" class="line" x1="61.5" y1="85" x2="53" y2="107" />

    <!-- Parallelogram 2 (top-right) inner lines -->
    <line id="line-inner-v2" class="line" x1="135.5" y1="20" x2="122.2" y2="55" />
    <line id="line-inner-h2" class="line" x1="122.2" y1="55" x2="180" y2="55" />
  </g>

  <!-- Vertices -->
  <g id="points">
    <circle id="point-1" class="point" cx="50" cy="20" r="3" />
    <circle id="point-2" class="point" cx="135.5" cy="20" r="3" />
    <circle id="point-3" class="point" cx="193" cy="20" r="3" />
    <circle id="point-4" class="point" cx="180" cy="55" r="3" />
    <circle id="point-5" class="point" cx="122.2" cy="55" r="3" />
    <circle id="point-6" class="point" cx="61.5" cy="85" r="3" />
    <circle id="point-7" class="point" cx="25.4" cy="85" r="3" />
    <circle id="point-8" class="point" cx="17" cy="107" r="3" />
    <circle id="point-9" class="point" cx="53" cy="107" r="3" />
    <circle id="point-10" class="point" cx="160" cy="107" r="3" />
  </g>
</svg>
