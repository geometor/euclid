<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 125" width="200" height="125">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.2s, stroke-width 0.2s; }
      .line-dashed { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4, 4; fill: none; transition: stroke 0.2s, stroke-width 0.2s; }
      .polygon { fill: #000000; fill-opacity: 0.04; stroke: none; transition: fill 0.2s, fill-opacity 0.2s; }
      .polygon:hover { fill: #0284c7 !important; fill-opacity: 0.15 !important; }
      .line:hover, .line-dashed:hover { stroke: #0284c7 !important; stroke-width: 3.5 !important; }
      .point { fill: #000000; stroke: #000000; stroke-width: 1; transition: r 0.2s, fill 0.2s; }
      .point:hover { fill: #0284c7 !important; stroke: #0284c7 !important; r: 5 !important; }
      .label { font-family: "Times New Roman", Times, serif; font-size: 19px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Polygons for hover/fill -->
  <g id="polygons">
    <!-- Whole parallelogram ABCD -->
    <polygon id="poly-abcd" class="polygon" points="45,26 17,101 157,101 185,26" />
    <!-- Small parallelograms FG and EH -->
    <polygon id="poly-fg" class="polygon" points="131,26 185,26 178.3,44 124.3,44" />
    <polygon id="poly-eh" class="polygon" points="27.5,73 56.5,73 46,101 17,101" />
    <!-- Overlapping parallelograms about diameter -->
    <polygon id="poly-p1" class="polygon" points="45,26 131,26 113.5,73 27.5,73" />
    <polygon id="poly-p2" class="polygon" points="67.3,44 178.3,44 157,101 46,101" />
  </g>

  <!-- Geometry Lines -->
  <g id="lines">
    <!-- 4 Horizontal lines -->
    <line id="line-ad" class="line" x1="45" y1="26" x2="185" y2="26" />
    <line id="line-h2" class="line" x1="67.3" y1="44" x2="178.3" y2="44" />
    <line id="line-h3" class="line" x1="27.5" y1="73" x2="113.5" y2="73" />
    <line id="line-bc" class="line" x1="17" y1="101" x2="157" y2="101" />

    <!-- 4 Slanted lines -->
    <line id="line-ab" class="line" x1="45" y1="26" x2="17" y2="101" />
    <line id="line-s2" class="line" x1="74" y1="26" x2="46" y2="101" />
    <line id="line-s3" class="line" x1="131" y1="26" x2="103" y2="101" />
    <line id="line-dc" class="line" x1="185" y1="26" x2="157" y2="101" />

    <!-- Diameter AC -->
    <line id="line-ac" class="line" x1="45" y1="26" x2="157" y2="101" />
  </g>

  <!-- Vertices -->
  <g id="points">
    <circle id="point-a" class="point" cx="45" cy="26" r="3" />
    <circle id="point-b" class="point" cx="17" cy="101" r="3" />
    <circle id="point-c" class="point" cx="157" cy="101" r="3" />
    <circle id="point-d" class="point" cx="185" cy="26" r="3" />
    <circle id="point-e" class="point" cx="27.5" cy="73" r="3" />
    <circle id="point-f" class="point" cx="131" cy="26" r="3" />
    <circle id="point-g" class="point" cx="178.3" cy="44" r="3" />
    <circle id="point-h" class="point" cx="46" cy="101" r="3" />
    <circle id="point-k" class="point" cx="67.3" cy="44" r="3" />
    <circle id="point-l" class="point" cx="56.5" cy="73" r="3" />
    <circle id="point-m" class="point" cx="113.5" cy="73" r="3" />
    <circle id="point-n" class="point" cx="124.3" cy="44" r="3" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text class="label" x="46" y="16">A</text>
    <text class="label" x="187" y="16">D</text>
    <text class="label" x="132" y="16">F</text>
    <text class="label" x="187" y="44">G</text>
    <text class="label" x="17" y="73">E</text>
    <text class="label" x="67" y="36">K</text>
    <text class="label" x="62" y="81">L</text>
    <text class="label" x="106" y="81">M</text>
    <text class="label" x="125" y="52">N</text>
    <text class="label" x="20" y="110">B</text>
    <text class="label" x="49" y="110">H</text>
    <text class="label" x="156" y="110">C</text>
  </g>
</svg>
