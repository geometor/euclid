    <path id="el-ang-ABE" data-ref="&lt; A B E )" data-aliases="&lt; E B A )" data-type="wedge" d="M 134 196 L 114.00 196.00 A 20 20 0 0 1 134.00 176.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BED" data-ref="&lt; B E D )" data-aliases="&lt; D E B )" data-type="wedge" d="M 134 92 L 134.00 112.00 A 20 20 0 0 1 114.00 92.00 Z" class="wedge angle geom-overlay" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A / | / A D C /" data-type="segment" x1="30" y1="196" x2="30" y2="21" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="30" y1="196" x2="30" y2="92" class="geom-line" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" data-type="segment" x1="30" y1="92" x2="30" y2="21" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="30" y1="196" x2="134" y2="196" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="30" y1="92" x2="134" y2="92" class="geom-line" />
    <line id="el-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" data-type="segment" x1="134" y1="196" x2="134" y2="92" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-ADEB" data-ref="&lt; A D E B &gt;" data-aliases="&lt; B E D A &gt; | &lt; D E B A &gt; | &lt; A B E D &gt; | &lt; E B A D &gt; | &lt; D A B E &gt; | &lt; B A D E &gt; | &lt; E D A B &gt;" points="30,196 30,92 134,92 134,196" class="geom-polygon geom-overlay" />
    <path id="hl-ang-BAD" data-ref="&lt; B A D )" data-aliases="&lt; D A B )" d="M 30 196 L 50.00 196.00 A 20 20 0 0 0 30.00 176.00 Z" class="wedge angle geom-overlay" />
