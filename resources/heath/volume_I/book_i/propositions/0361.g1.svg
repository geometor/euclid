    <path id="hl-ang-ABE" data-ref="&lt; A B E )" data-aliases="&lt; E B A )" d="M 134 196 L 114.00 196.00 A 20 20 0 0 1 134.00 176.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-BED" data-ref="&lt; B E D )" data-aliases="&lt; D E B )" d="M 134 92 L 134.00 112.00 A 20 20 0 0 1 114.00 92.00 Z" class="wedge angle geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A / | / A D C /" x1="30" y1="196" x2="30" y2="21" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="30" y1="196" x2="30" y2="92" class="geom-line geom-overlay" />
    <line id="hl-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" x1="30" y1="92" x2="30" y2="21" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="30" y1="196" x2="134" y2="196" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="30" y1="92" x2="134" y2="92" class="geom-line geom-overlay" />
