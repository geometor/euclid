    <path id="el-ang-BAD" data-ref="&lt; B A D )" data-aliases="&lt; D A B )" data-type="wedge" d="M 30 196 L 50.00 196.00 A 20 20 0 0 0 30.00 176.00 Z" class="wedge angle geom-overlay" />
