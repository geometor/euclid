<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 158 210" width="158" height="210" class="euclid-graphic" data-folio="0361" data-graphic="g1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Polygons -->
  <polygon class="geom-polygon" points="30,196 134,196 134,92 30,92" data-ref="ADEB" />

  <!-- Lines -->
  <!-- Perpendicular AC extended -->
  <line class="geom-line" x1="30" y1="196" x2="30" y2="21" data-ref="AC" />
  <!-- Base AB -->
  <line class="geom-line" x1="30" y1="196" x2="134" y2="196" data-ref="AB" />
  <!-- Side BE -->
  <line class="geom-line" x1="134" y1="196" x2="134" y2="92" data-ref="BE" />
  <!-- Top DE -->
  <line class="geom-line" x1="30" y1="92" x2="134" y2="92" data-ref="DE" />

  <!-- Points -->
  <circle class="geom-point" cx="30" cy="196" r="3" data-ref="A" />
  <circle class="geom-point" cx="134" cy="196" r="3" data-ref="B" />
  <circle class="geom-point" cx="30" cy="92" r="3" data-ref="D" />
  <circle class="geom-point" cx="134" cy="92" r="3" data-ref="E" />
  <circle class="geom-point" cx="30" cy="21" r="3" data-ref="C" />

  <!-- Labels -->
  <text class="geom-label" x="19" y="25" text-anchor="middle" data-ref="C">C</text>
  <text class="geom-label" x="19" y="96" text-anchor="middle" data-ref="D">D</text>
  <text class="geom-label" x="145" y="96" text-anchor="middle" data-ref="E">E</text>
  <text class="geom-label" x="28" y="208" text-anchor="middle" data-ref="A">A</text>
  <text class="geom-label" x="134" y="208" text-anchor="middle" data-ref="B">B</text>
</svg>
