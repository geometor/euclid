<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 242 227" width="242" height="227" class="euclid-graphic" data-folio="0362" data-graphic="g1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Polygons -->
  <polygon class="geom-polygon" points="24,114 24,24 114,24 114,114" data-ref="ADFB" />
  <polygon class="geom-polygon" points="114,114 204,114 204,204 114,204" data-ref="BCGE" />
  <polygon class="geom-polygon" points="24,114 114,24 204,114 114,204" data-ref="AFCG" />

  <!-- Lines -->
  <!-- Square 1 sides -->
  <line class="geom-line" x1="24" y1="24" x2="114" y2="24" data-ref="DF" />
  <line class="geom-line" x1="24" y1="24" x2="24" y2="114" data-ref="DA" />
  <line class="geom-line" x1="24" y1="114" x2="114" y2="114" data-ref="AB" />
  <line class="geom-line" x1="114" y1="24" x2="114" y2="114" data-ref="FB" />
  <!-- Square 2 sides -->
  <line class="geom-line" x1="114" y1="114" x2="204" y2="114" data-ref="BC" />
  <line class="geom-line" x1="114" y1="114" x2="114" y2="204" data-ref="BG" />
  <line class="geom-line" x1="204" y1="114" x2="204" y2="204" data-ref="CE" />
  <line class="geom-line" x1="114" y1="204" x2="204" y2="204" data-ref="GE" />

  <!-- Diagonals & Parallelogram Sides -->
  <line class="geom-line" x1="24" y1="114" x2="114" y2="24" data-ref="AF" />
  <line class="geom-line" x1="114" y1="24" x2="204" y2="114" data-ref="FC" />
  <line class="geom-line" x1="204" y1="114" x2="114" y2="204" data-ref="CG" />
  <line class="geom-line" x1="114" y1="204" x2="24" y2="114" data-ref="GA" />

  <!-- Points -->
  <circle class="geom-point" cx="24" cy="24" r="3" data-ref="D" />
  <circle class="geom-point" cx="114" cy="24" r="3" data-ref="F" />
  <circle class="geom-point" cx="24" cy="114" r="3" data-ref="A" />
  <circle class="geom-point" cx="114" cy="114" r="3" data-ref="B" />
  <circle class="geom-point" cx="204" cy="114" r="3" data-ref="C" />
  <circle class="geom-point" cx="114" cy="204" r="3" data-ref="G" />
  <circle class="geom-point" cx="204" cy="204" r="3" data-ref="E" />

  <!-- Labels -->
  <text class="geom-label" x="25" y="16" text-anchor="middle" data-ref="D">D</text>
  <text class="geom-label" x="117" y="16" text-anchor="middle" data-ref="F">F</text>
  <text class="geom-label" x="14" y="118" text-anchor="middle" data-ref="A">A</text>
  <text class="geom-label" x="105" y="126" text-anchor="middle" data-ref="B">B</text>
  <text class="geom-label" x="214" y="118" text-anchor="middle" data-ref="C">C</text>
  <text class="geom-label" x="112" y="218" text-anchor="middle" data-ref="G">G</text>
  <text class="geom-label" x="204" y="218" text-anchor="middle" data-ref="E">E</text>
</svg>
