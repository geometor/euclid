<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 365" width="310" height="365" class="euclid-graphic" data-folio="0363" data-graphic="g1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Polygons -->
  <polygon class="geom-polygon" points="91,186 222,186 222,319 91,319" data-ref="BDEC" />
  <polygon class="geom-polygon" points="91,186 118,133 65,106 38,159" data-ref="ABFG" />
  <polygon class="geom-polygon" points="118,133 222,186 275,82 171,29" data-ref="ACKH" />
  <polygon class="geom-polygon" points="91,186 222,186 118,133" data-ref="ABC" />

  <!-- Lines -->
  <!-- Triangle ABC -->
  <line class="geom-line" x1="91" y1="186" x2="222" y2="186" data-ref="BC" />
  <line class="geom-line" x1="91" y1="186" x2="118" y2="133" data-ref="AB" />
  <line class="geom-line" x1="118" y1="133" x2="222" y2="186" data-ref="AC" />

  <!-- Square on BC (BDEC) -->
  <line class="geom-line" x1="91" y1="186" x2="91" y2="319" data-ref="BD" />
  <line class="geom-line" x1="91" y1="319" x2="222" y2="319" data-ref="DE" />
  <line class="geom-line" x1="222" y1="186" x2="222" y2="319" data-ref="CE" />

  <!-- Square on AB (ABFG) -->
  <line class="geom-line" x1="91" y1="186" x2="38" y2="159" data-ref="BF" />
  <line class="geom-line" x1="38" y1="159" x2="65" y2="106" data-ref="FG" />
  <line class="geom-line" x1="65" y1="106" x2="118" y2="133" data-ref="GA" />

  <!-- Square on AC (ACKH) -->
  <line class="geom-line" x1="118" y1="133" x2="171" y2="29" data-ref="AH" />
  <line class="geom-line" x1="171" y1="29" x2="275" y2="82" data-ref="HK" />
  <line class="geom-line" x1="222" y1="186" x2="275" y2="82" data-ref="CK" />

  <!-- Parallel AL through A to DE -->
  <line class="geom-line" x1="118" y1="133" x2="118" y2="319" data-ref="AL" />

  <!-- Transversals AD, FC, AE, BK -->
  <line class="geom-line" x1="118" y1="133" x2="91" y2="319" data-ref="AD" />
  <line class="geom-line" x1="38" y1="159" x2="222" y2="186" data-ref="FC" />
  <line class="geom-line" x1="118" y1="133" x2="222" y2="319" data-ref="AE" />
  <line class="geom-line" x1="91" y1="186" x2="275" y2="82" data-ref="BK" />

  <!-- Points -->
  <circle class="geom-point" cx="118" cy="133" r="3" data-ref="A" />
  <circle class="geom-point" cx="91" cy="186" r="3" data-ref="B" />
  <circle class="geom-point" cx="222" cy="186" r="3" data-ref="C" />
  <circle class="geom-point" cx="91" cy="319" r="3" data-ref="D" />
  <circle class="geom-point" cx="222" cy="319" r="3" data-ref="E" />
  <circle class="geom-point" cx="118" cy="319" r="3" data-ref="L" />
  <circle class="geom-point" cx="38" cy="159" r="3" data-ref="F" />
  <circle class="geom-point" cx="65" cy="106" r="3" data-ref="G" />
  <circle class="geom-point" cx="171" cy="29" r="3" data-ref="H" />
  <circle class="geom-point" cx="275" cy="82" r="3" data-ref="K" />

  <!-- Labels -->
  <text class="geom-label" x="113" y="122" text-anchor="middle" data-ref="A">A</text>
  <text class="geom-label" x="81" y="192" text-anchor="middle" data-ref="B">B</text>
  <text class="geom-label" x="233" y="186" text-anchor="middle" data-ref="C">C</text>
  <text class="geom-label" x="91" y="335" text-anchor="middle" data-ref="D">D</text>
  <text class="geom-label" x="224" y="335" text-anchor="middle" data-ref="E">E</text>
  <text class="geom-label" x="118" y="335" text-anchor="middle" data-ref="L">L</text>
  <text class="geom-label" x="24" y="160" text-anchor="middle" data-ref="F">F</text>
  <text class="geom-label" x="59" y="93" text-anchor="middle" data-ref="G">G</text>
  <text class="geom-label" x="162" y="22" text-anchor="middle" data-ref="H">H</text>
  <text class="geom-label" x="285" y="78" text-anchor="middle" data-ref="K">K</text>
</svg>
