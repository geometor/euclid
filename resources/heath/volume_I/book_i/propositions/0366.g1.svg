<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 171" width="340" height="171" class="euclid-graphic" data-folio="0366" data-graphic="g1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- LEFT FIGURE: Cantor and Allman outward squares -->
  <!-- Polygons -->
  <!-- Central triangle -->
  <polygon class="geom-polygon" points="88,48 50,85 126,85" data-ref="central_triangle" />
  <!-- Bottom square on hypotenuse -->
  <polygon class="geom-polygon" points="50,85 126,85 126,159 50,159" data-ref="hypotenuse_square" />
  <!-- Left square -->
  <polygon class="geom-polygon" points="88,48 50,85 13,48 51,10" data-ref="left_square" />
  <!-- Right square -->
  <polygon class="geom-polygon" points="88,48 126,85 163,48 125,10" data-ref="right_square" />

  <!-- Lines of Left Figure -->
  <!-- Continuous horizontal line across top squares -->
  <line class="geom-line" x1="13" y1="48" x2="163" y2="48" data-ref="top_horizontal" />
  <!-- Long diagonal 1: through left outer corner, central hypotenuse left, center of bottom square, bottom right -->
  <line class="geom-line" x1="13" y1="48" x2="126" y2="159" data-ref="diagonal_descending" />
  <!-- Long diagonal 2: from bottom left, through central hypotenuse right, to right outer corner -->
  <line class="geom-line" x1="50" y1="159" x2="163" y2="48" data-ref="diagonal_ascending" />
  <!-- Diagonal through apex to top left -->
  <line class="geom-line" x1="126" y1="85" x2="51" y2="10" data-ref="diagonal_to_tl" />
  <!-- Diagonal through apex to top right -->
  <line class="geom-line" x1="50" y1="85" x2="125" y2="10" data-ref="diagonal_to_tr" />
  <!-- Outer roof slopes -->
  <line class="geom-line" x1="13" y1="48" x2="51" y2="10" data-ref="roof_left" />
  <line class="geom-line" x1="125" y1="10" x2="163" y2="48" data-ref="roof_right" />
  <!-- Hypotenuse line -->
  <line class="geom-line" x1="50" y1="85" x2="126" y2="85" data-ref="hypotenuse_base" />
  <!-- Bottom square outer vertical sides -->
  <line class="geom-line" x1="50" y1="85" x2="50" y2="159" data-ref="bottom_left_side" />
  <line class="geom-line" x1="126" y1="85" x2="126" y2="159" data-ref="bottom_right_side" />
  <!-- Bottom square bottom horizontal -->
  <line class="geom-line" x1="50" y1="159" x2="126" y2="159" data-ref="bottom_side" />

  <!-- Points of Left Figure -->
  <circle class="geom-point" cx="88" cy="48" r="3" data-ref="L_apex" />
  <circle class="geom-point" cx="50" cy="85" r="3" data-ref="L_hyp_L" />
  <circle class="geom-point" cx="126" cy="85" r="3" data-ref="L_hyp_R" />
  <circle class="geom-point" cx="50" cy="159" r="3" data-ref="L_bot_L" />
  <circle class="geom-point" cx="126" cy="159" r="3" data-ref="L_bot_R" />
  <circle class="geom-point" cx="13" cy="48" r="3" data-ref="L_TL_outer" />
  <circle class="geom-point" cx="51" cy="10" r="3" data-ref="L_TL_top" />
  <circle class="geom-point" cx="125" cy="10" r="3" data-ref="L_TR_top" />
  <circle class="geom-point" cx="163" cy="48" r="3" data-ref="L_TR_outer" />
  <circle class="geom-point" cx="88" cy="122" r="3" data-ref="L_center" />

  <!-- RIGHT FIGURE: Bürk / Āpastamba-Śulba-Sūtra inscribed square -->
  <!-- Polygons -->
  <!-- Outer square -->
  <polygon class="geom-polygon" points="220,24 329,24 329,130 220,130" data-ref="burk_outer_square" />
  <!-- Inscribed tilted square -->
  <polygon class="geom-polygon" points="275,24 329,77 275,130 220,77" data-ref="burk_inscribed_square" />

  <!-- Lines of Right Figure -->
  <!-- Outer square perimeter -->
  <line class="geom-line" x1="220" y1="24" x2="329" y2="24" data-ref="R_top" />
  <line class="geom-line" x1="329" y1="24" x2="329" y2="130" data-ref="R_right" />
  <line class="geom-line" x1="329" y1="130" x2="220" y2="130" data-ref="R_bottom" />
  <line class="geom-line" x1="220" y1="130" x2="220" y2="24" data-ref="R_left" />
  <!-- Midlines -->
  <line class="geom-line" x1="275" y1="24" x2="275" y2="130" data-ref="R_mid_vert" />
  <line class="geom-line" x1="220" y1="77" x2="329" y2="77" data-ref="R_mid_horiz" />
  <!-- Inscribed square edges -->
  <line class="geom-line" x1="275" y1="24" x2="329" y2="77" data-ref="R_tilted_TR" />
  <line class="geom-line" x1="329" y1="77" x2="275" y2="130" data-ref="R_tilted_BR" />
  <line class="geom-line" x1="275" y1="130" x2="220" y2="77" data-ref="R_tilted_BL" />
  <line class="geom-line" x1="220" y1="77" x2="275" y2="24" data-ref="R_tilted_TL" />

  <!-- Points of Right Figure -->
  <circle class="geom-point" cx="220" cy="24" r="3" data-ref="R_TL" />
  <circle class="geom-point" cx="329" cy="24" r="3" data-ref="R_TR" />
  <circle class="geom-point" cx="329" cy="130" r="3" data-ref="R_BR" />
  <circle class="geom-point" cx="220" cy="130" r="3" data-ref="R_BL" />
  <circle class="geom-point" cx="275" cy="24" r="3" data-ref="R_T_mid" />
  <circle class="geom-point" cx="329" cy="77" r="3" data-ref="R_R_mid" />
  <circle class="geom-point" cx="275" cy="130" r="3" data-ref="R_B_mid" />
  <circle class="geom-point" cx="220" cy="77" r="3" data-ref="R_L_mid" />
  <circle class="geom-point" cx="275" cy="77" r="3" data-ref="R_center" />
</svg>
