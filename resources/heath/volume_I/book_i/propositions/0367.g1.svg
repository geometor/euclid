<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 235 130" width="235" height="130" class="euclid-graphic" data-graphic-id="0367.g1" data-folio="0367" data-graphic="g1" data-proposition="I.47">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-BC" data-ref="[ B C ]" data-aliases="/ B D C /" data-type="line" x1="26" y1="98" x2="184" y2="98" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; B A C &gt;;&lt; C B A &gt;" data-type="polygon" points="65,36 26,98 184,98" class="geom-polygon" />
    <polygon id="el-tri-DBA" data-ref="&lt; D B A &gt;" data-aliases="&lt; A B D &gt;;&lt; B D A &gt;" data-type="polygon" points="65,98 26,98 65,36" class="geom-polygon" />
    <polygon id="el-tri-DAC" data-ref="&lt; D A C &gt;" data-aliases="&lt; A D C &gt;;&lt; C D A &gt;" data-type="polygon" points="65,98 65,36 184,98" class="geom-polygon" />

    <!-- Angles -->
    <path id="el-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; C A B )" data-type="wedge" d="M 65 36 L 55.41 51.24 A 18 18 0 0 0 80.96 44.31 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ADB" data-ref="&lt; A D B )" data-aliases="&lt; B D A )" data-type="wedge" d="M 65 98 L 65 80 A 18 18 0 0 0 47 98 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ADC" data-ref="&lt; A D C )" data-aliases="&lt; C D A )" data-type="wedge" d="M 65 98 L 65 80 A 18 18 0 0 1 83 98 Z" class="wedge angle geom-overlay" />

    <!-- Segments -->
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="26" y1="98" x2="184" y2="98" class="geom-line" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="26" y1="98" x2="65" y2="98" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="184" y1="98" x2="65" y2="98" class="geom-line" />
    <line id="el-seg-BA" data-ref="/ B A /" data-aliases="/ A B /" data-type="segment" x1="26" y1="98" x2="65" y2="36" class="geom-line" />
    <line id="el-seg-CA" data-ref="/ C A /" data-aliases="/ A C /" data-type="segment" x1="184" y1="98" x2="65" y2="36" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="65" y1="36" x2="65" y2="98" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; B A C &gt;;&lt; C B A &gt;" points="65,36 26,98 184,98" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-DBA" data-ref="&lt; D B A &gt;" data-aliases="&lt; A B D &gt;;&lt; B D A &gt;" points="65,98 26,98 65,36" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-DAC" data-ref="&lt; D A C &gt;" data-aliases="&lt; A D C &gt;;&lt; C D A &gt;" points="65,98 65,36 184,98" class="geom-polygon geom-overlay" />
    <path id="hl-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; C A B )" d="M 65 36 L 55.41 51.24 A 18 18 0 0 0 80.96 44.31 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ADB" data-ref="&lt; A D B )" data-aliases="&lt; B D A )" d="M 65 98 L 65 80 A 18 18 0 0 0 47 98 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ADC" data-ref="&lt; A D C )" data-aliases="&lt; C D A )" d="M 65 98 L 65 80 A 18 18 0 0 1 83 98 Z" class="wedge angle geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="26" y1="98" x2="184" y2="98" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="26" y1="98" x2="65" y2="98" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="184" y1="98" x2="65" y2="98" class="geom-line geom-overlay" />
    <line id="hl-seg-BA" data-ref="/ B A /" data-aliases="/ A B /" x1="26" y1="98" x2="65" y2="36" class="geom-line geom-overlay" />
    <line id="hl-seg-CA" data-ref="/ C A /" data-aliases="/ A C /" x1="184" y1="98" x2="65" y2="36" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="65" y1="36" x2="65" y2="98" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="65" cy="36" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="26" cy="98" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="184" cy="98" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="65" cy="98" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="68" y="25" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="24" y="113" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-D" data-ref="D" x="65" y="113" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-C" data-ref="C" x="184" y="113" text-anchor="middle" class="geom-label">C</text>
  </g>
</svg>
