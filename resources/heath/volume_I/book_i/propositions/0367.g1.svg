<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 235 130" width="235" height="130" class="euclid-graphic" data-folio="0367" data-graphic="g1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Polygons -->
  <polygon class="geom-polygon" points="65,36 26,98 184,98" data-ref="ABC" />
  <polygon class="geom-polygon" points="65,36 26,98 65,98" data-ref="ABD" />
  <polygon class="geom-polygon" points="65,36 65,98 184,98" data-ref="ADC" />

  <!-- Lines -->
  <line class="geom-line" x1="26" y1="98" x2="184" y2="98" data-ref="BC" />
  <line class="geom-line" x1="26" y1="98" x2="65" y2="36" data-ref="AB" />
  <line class="geom-line" x1="65" y1="36" x2="184" y2="98" data-ref="AC" />
  <line class="geom-line" x1="65" y1="36" x2="65" y2="98" data-ref="AD" />

  <!-- Points -->
  <circle class="geom-point" cx="65" cy="36" r="3" data-ref="A" />
  <circle class="geom-point" cx="26" cy="98" r="3" data-ref="B" />
  <circle class="geom-point" cx="184" cy="98" r="3" data-ref="C" />
  <circle class="geom-point" cx="65" cy="98" r="3" data-ref="D" />

  <!-- Labels -->
  <text class="geom-label" x="68" y="25" text-anchor="middle" data-ref="A">A</text>
  <text class="geom-label" x="24" y="113" text-anchor="middle" data-ref="B">B</text>
  <text class="geom-label" x="65" y="113" text-anchor="middle" data-ref="D">D</text>
  <text class="geom-label" x="184" y="113" text-anchor="middle" data-ref="C">C</text>
</svg>
