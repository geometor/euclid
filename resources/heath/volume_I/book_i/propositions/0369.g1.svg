<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 146" width="148" height="146" class="euclid-graphic" data-graphic-id="0369.g1" data-folio="0369" data-graphic="g1" data-proposition="I.47">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements" />

  <!-- Constructed Graphics (Polygons & Segments) -->
  <g id="graphics">
    <polygon id="el-sq-ABCD" data-ref="&lt; A B C D &gt;" data-type="polygon" points="17,7 133,7 133,122 17,122" class="geom-polygon" />
    <polygon id="el-sq-EFGH" data-ref="&lt; E F G H &gt;" data-type="polygon" points="68,42 101,60 83,88 51,68" class="geom-polygon" />
    <polygon id="el-tri-ABF" data-ref="&lt; A B F &gt;" data-type="polygon" points="17,7 133,7 101,60" class="geom-polygon" />
    <polygon id="el-tri-BCG" data-ref="&lt; B C G &gt;" data-type="polygon" points="133,7 133,122 83,88" class="geom-polygon" />
    <polygon id="el-tri-CDH" data-ref="&lt; C D H &gt;" data-type="polygon" points="133,122 17,122 51,68" class="geom-polygon" />
    <polygon id="el-tri-DAE" data-ref="&lt; D A E &gt;" data-type="polygon" points="17,122 17,7 68,42" class="geom-polygon" />

    <!-- Outer Square Perimeter -->
    <line id="el-seg-AB" data-ref="/ A B /" data-type="segment" x1="17" y1="7" x2="133" y2="7" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-type="segment" x1="133" y1="7" x2="133" y2="122" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-type="segment" x1="133" y1="122" x2="17" y2="122" class="geom-line" />
    <line id="el-seg-DA" data-ref="/ D A /" data-type="segment" x1="17" y1="122" x2="17" y2="7" class="geom-line" />

    <!-- 4 Dissection Lines and Inner Square Sides -->
    <line id="el-seg-AF" data-ref="/ A F /" data-type="segment" x1="17" y1="7" x2="101" y2="60" class="geom-line" />
    <line id="el-seg-BG" data-ref="/ B G /" data-type="segment" x1="133" y1="7" x2="83" y2="88" class="geom-line" />
    <line id="el-seg-CH" data-ref="/ C H /" data-type="segment" x1="133" y1="122" x2="51" y2="68" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-type="segment" x1="17" y1="122" x2="68" y2="42" class="geom-line" />
    <line id="el-seg-EF" data-ref="/ E F /" data-type="segment" x1="68" y1="42" x2="101" y2="60" class="geom-line" />
    <line id="el-seg-FG" data-ref="/ F G /" data-type="segment" x1="101" y1="60" x2="83" y2="88" class="geom-line" />
    <line id="el-seg-GH" data-ref="/ G H /" data-type="segment" x1="83" y1="88" x2="51" y2="68" class="geom-line" />
    <line id="el-seg-HE" data-ref="/ H E /" data-type="segment" x1="51" y1="68" x2="68" y2="42" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-sq-ABCD" data-ref="&lt; A B C D &gt;" points="17,7 133,7 133,122 17,122" class="geom-polygon geom-overlay" />
    <polygon id="hl-sq-EFGH" data-ref="&lt; E F G H &gt;" points="68,42 101,60 83,88 51,68" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-ABF" data-ref="&lt; A B F &gt;" points="17,7 133,7 101,60" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-BCG" data-ref="&lt; B C G &gt;" points="133,7 133,122 83,88" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-CDH" data-ref="&lt; C D H &gt;" points="133,122 17,122 51,68" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-DAE" data-ref="&lt; D A E &gt;" points="17,122 17,7 68,42" class="geom-polygon geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="17" cy="7" r="3" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="133" cy="7" r="3" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="133" cy="122" r="3" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="17" cy="122" r="3" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="68" cy="42" r="3" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="101" cy="60" r="3" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="83" cy="88" r="3" class="geom-point" />
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="51" cy="68" r="3" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels" />
</svg>
