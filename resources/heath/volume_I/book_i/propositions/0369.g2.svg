<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 214 204" width="214" height="204" class="euclid-graphic" data-folio="0369" data-graphic="g2">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .grid-line {
      stroke: #000000;
      stroke-width: 0.9;
      stroke-linecap: round;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Polygons -->
  <polygon class="geom-polygon" points="39,34 179,34 179,174 39,174" data-ref="ABCD" />
  <polygon class="geom-polygon" points="119,34 179,114 99,174 39,94" data-ref="EFGH" />
  <polygon class="geom-polygon" points="99,74 119,74 119,94 99,94" data-ref="central_unit_square" />

  <!-- 7x7 Grid Lines -->
  <!-- Vertical grid lines -->
  <line class="grid-line" x1="59" y1="34" x2="59" y2="174" />
  <line class="grid-line" x1="79" y1="34" x2="79" y2="174" />
  <line class="grid-line" x1="99" y1="34" x2="99" y2="174" />
  <line class="grid-line" x1="119" y1="34" x2="119" y2="174" />
  <line class="grid-line" x1="139" y1="34" x2="139" y2="174" />
  <line class="grid-line" x1="159" y1="34" x2="159" y2="174" />

  <!-- Horizontal grid lines -->
  <line class="grid-line" x1="39" y1="54" x2="179" y2="54" />
  <line class="grid-line" x1="39" y1="74" x2="179" y2="74" />
  <line class="grid-line" x1="39" y1="94" x2="179" y2="94" />
  <line class="grid-line" x1="39" y1="114" x2="179" y2="114" />
  <line class="grid-line" x1="39" y1="134" x2="179" y2="134" />
  <line class="grid-line" x1="39" y1="154" x2="179" y2="154" />

  <!-- Outer Square ABCD -->
  <line class="geom-line" x1="39" y1="34" x2="179" y2="34" data-ref="AB" />
  <line class="geom-line" x1="179" y1="34" x2="179" y2="174" data-ref="BC" />
  <line class="geom-line" x1="179" y1="174" x2="39" y2="174" data-ref="CD" />
  <line class="geom-line" x1="39" y1="174" x2="39" y2="34" data-ref="DA" />

  <!-- Inner Square EFGH (hypotenuses) -->
  <line class="geom-line" x1="119" y1="34" x2="179" y2="114" data-ref="EF" />
  <line class="geom-line" x1="179" y1="114" x2="99" y2="174" data-ref="FG" />
  <line class="geom-line" x1="99" y1="174" x2="39" y2="94" data-ref="GH" />
  <line class="geom-line" x1="39" y1="94" x2="119" y2="34" data-ref="HE" />

  <!-- Points -->
  <circle class="geom-point" cx="39" cy="34" r="3" data-ref="A" />
  <circle class="geom-point" cx="179" cy="34" r="3" data-ref="B" />
  <circle class="geom-point" cx="179" cy="174" r="3" data-ref="C" />
  <circle class="geom-point" cx="39" cy="174" r="3" data-ref="D" />
  <circle class="geom-point" cx="119" cy="34" r="3" data-ref="E" />
  <circle class="geom-point" cx="179" cy="114" r="3" data-ref="F" />
  <circle class="geom-point" cx="99" cy="174" r="3" data-ref="G" />
  <circle class="geom-point" cx="39" cy="94" r="3" data-ref="H" />

  <!-- Labels -->
  <text class="geom-label" x="28" y="34" text-anchor="middle" data-ref="A">A</text>
  <text class="geom-label" x="191" y="32" text-anchor="middle" data-ref="B">B</text>
  <text class="geom-label" x="192" y="181" text-anchor="middle" data-ref="C">C</text>
  <text class="geom-label" x="28" y="181" text-anchor="middle" data-ref="D">D</text>
  <text class="geom-label" x="119" y="24" text-anchor="middle" data-ref="E">E</text>
  <text class="geom-label" x="192" y="118" text-anchor="middle" data-ref="F">F</text>
  <text class="geom-label" x="99" y="193" text-anchor="middle" data-ref="G">G</text>
  <text class="geom-label" x="27" y="98" text-anchor="middle" data-ref="H">H</text>
</svg>
