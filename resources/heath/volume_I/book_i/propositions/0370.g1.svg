    <polygon id="el-tri-ABD" data-ref="&lt; A B D &gt;" data-type="polygon" points="108,34 26,100 108,100" class="geom-polygon" />
    <polygon id="el-tri-ADC" data-ref="&lt; A D C &gt;" data-type="polygon" points="108,34 108,100 154,100" class="geom-polygon" />
    <polygon id="el-tri-BGC" data-ref="&lt; B G C &gt;" data-type="polygon" points="26,100 72,166 154,100" class="geom-polygon" />
    <polygon id="el-rect-BCFE" data-ref="&lt; B C F E &gt;" data-type="polygon" points="26,100 154,100 154,34 26,34" class="geom-polygon" />
    <polygon id="el-rect-BDAE" data-ref="&lt; B D A E &gt;" data-type="polygon" points="26,100 108,100 108,34 26,34" class="geom-polygon" />
    <polygon id="el-rect-DCFA" data-ref="&lt; D C F A &gt;" data-type="polygon" points="108,100 154,100 154,34 108,34" class="geom-polygon" />
    <polygon id="el-rect-BGCA" data-ref="&lt; B G C A &gt;" data-type="polygon" points="26,100 72,166 154,100 108,34" class="geom-polygon" />

