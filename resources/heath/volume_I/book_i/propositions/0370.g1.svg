    <path id="el-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; C A B )" data-type="wedge" d="M 108 34 L 93.98 45.28 A 18 18 0 0 0 118.29 48.76 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ADB" data-ref="&lt; A D B )" data-aliases="&lt; B D A )" data-type="wedge" d="M 108 100 L 108 82 A 18 18 0 0 0 90 100 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ADC" data-ref="&lt; A D C )" data-aliases="&lt; C D A )" data-type="wedge" d="M 108 100 L 108 82 A 18 18 0 0 1 126 100 Z" class="wedge angle geom-overlay" />

