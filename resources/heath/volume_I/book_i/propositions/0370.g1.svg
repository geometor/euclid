<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 178" width="188" height="178" class="euclid-graphic" data-graphic-id="0370.g1" data-folio="0370" data-graphic="g1" data-proposition="I.47">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .grid-line {
      stroke: #000000;
      stroke-width: 0.9;
      stroke-linecap: round;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Subdivided Unit Rectangle Grid Lines) -->
  <g id="elements">
    <line class="grid-line" x1="46.5" y1="34" x2="46.5" y2="100" />
    <line class="grid-line" x1="67" y1="34" x2="67" y2="100" />
    <line class="grid-line" x1="87.5" y1="34" x2="87.5" y2="100" />
    <line class="grid-line" x1="26" y1="50.5" x2="108" y2="50.5" />
    <line class="grid-line" x1="26" y1="67" x2="108" y2="67" />
    <line class="grid-line" x1="26" y1="83.5" x2="108" y2="83.5" />
    <line class="grid-line" x1="123.3" y1="34" x2="123.3" y2="100" />
    <line class="grid-line" x1="138.7" y1="34" x2="138.7" y2="100" />
    <line class="grid-line" x1="108" y1="56" x2="154" y2="56" />
    <line class="grid-line" x1="108" y1="78" x2="154" y2="78" />
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
