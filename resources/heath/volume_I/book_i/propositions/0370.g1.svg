<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 178" width="188" height="178" class="euclid-graphic" data-folio="0370" data-graphic="g1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .grid-line {
      stroke: #000000;
      stroke-width: 0.9;
      stroke-linecap: round;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Polygons -->
  <polygon class="geom-polygon" points="108,34 26,100 154,100" data-ref="ABC" />
  <polygon class="geom-polygon" points="26,100 72,166 154,100 108,34" data-ref="rect_diag_BC" />
  <polygon class="geom-polygon" points="26,34 108,34 108,100 26,100" data-ref="rect_BD_AD" />
  <polygon class="geom-polygon" points="108,34 154,34 154,100 108,100" data-ref="rect_DC_AD" />

  <!-- Subdivided Rectangles Grid Lines (Fine lines) -->
  <!-- Left 4x4 Grid -->
  <line class="grid-line" x1="46.5" y1="34" x2="46.5" y2="100" />
  <line class="grid-line" x1="67" y1="34" x2="67" y2="100" />
  <line class="grid-line" x1="87.5" y1="34" x2="87.5" y2="100" />
  <line class="grid-line" x1="26" y1="50.5" x2="108" y2="50.5" />
  <line class="grid-line" x1="26" y1="67" x2="108" y2="67" />
  <line class="grid-line" x1="26" y1="83.5" x2="108" y2="83.5" />

  <!-- Right 3x3 Grid -->
  <line class="grid-line" x1="123.3" y1="34" x2="123.3" y2="100" />
  <line class="grid-line" x1="138.7" y1="34" x2="138.7" y2="100" />
  <line class="grid-line" x1="108" y1="56" x2="154" y2="56" />
  <line class="grid-line" x1="108" y1="78" x2="154" y2="78" />

  <!-- Bounding Rectangle on BC with altitude AD -->
  <line class="geom-line" x1="26" y1="34" x2="154" y2="34" data-ref="top_bound" />
  <line class="geom-line" x1="26" y1="34" x2="26" y2="100" data-ref="left_bound" />
  <line class="geom-line" x1="154" y1="34" x2="154" y2="100" data-ref="right_bound" />
  <line class="geom-line" x1="26" y1="100" x2="154" y2="100" data-ref="BC" />

  <!-- Altitude AD -->
  <line class="geom-line" x1="108" y1="34" x2="108" y2="100" data-ref="AD" />

  <!-- Triangle ABC sides (diagonals of 4x4 and 3x3 grids) -->
  <line class="geom-line" x1="26" y1="100" x2="108" y2="34" data-ref="AB" />
  <line class="geom-line" x1="108" y1="34" x2="154" y2="100" data-ref="AC" />

  <!-- Lower Triangle A'CB (completing rectangle with BC as diagonal) -->
  <line class="geom-line" x1="26" y1="100" x2="72" y2="166" data-ref="BA_prime" />
  <line class="geom-line" x1="154" y1="100" x2="72" y2="166" data-ref="CA_prime" />

  <!-- Points -->
  <circle class="geom-point" cx="108" cy="34" r="3" data-ref="A" />
  <circle class="geom-point" cx="26" cy="100" r="3" data-ref="B" />
  <circle class="geom-point" cx="154" cy="100" r="3" data-ref="C" />
  <circle class="geom-point" cx="108" cy="100" r="3" data-ref="D" />
  <circle class="geom-point" cx="72" cy="166" r="3" data-ref="A_prime" />

  <!-- Labels -->
  <text class="geom-label" x="113" y="25" text-anchor="middle" data-ref="A">A</text>
  <text class="geom-label" x="16" y="103" text-anchor="middle" data-ref="B">B</text>
  <text class="geom-label" x="170" y="103" text-anchor="middle" data-ref="C">C</text>
  <text class="geom-label" x="113" y="114" text-anchor="middle" data-ref="D">D</text>
</svg>
