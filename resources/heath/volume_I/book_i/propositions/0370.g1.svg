    <line id="el-seg-EF" data-ref="/ E F /" data-type="segment" x1="26" y1="34" x2="154" y2="34" class="geom-line" />
    <line id="el-seg-EA" data-ref="/ E A /" data-type="segment" x1="26" y1="34" x2="108" y2="34" class="geom-line" />
    <line id="el-seg-AF" data-ref="/ A F /" data-type="segment" x1="108" y1="34" x2="154" y2="34" class="geom-line" />
    <line id="el-seg-EB" data-ref="/ E B /" data-type="segment" x1="26" y1="34" x2="26" y2="100" class="geom-line" />
    <line id="el-seg-FC" data-ref="/ F C /" data-type="segment" x1="154" y1="34" x2="154" y2="100" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="26" y1="100" x2="154" y2="100" class="geom-line" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="26" y1="100" x2="108" y2="100" class="geom-line" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" data-type="segment" x1="108" y1="100" x2="154" y2="100" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="108" y1="34" x2="108" y2="100" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="108" y1="34" x2="26" y2="100" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="108" y1="34" x2="154" y2="100" class="geom-line" />
    <line id="el-seg-BG" data-ref="/ B G /" data-type="segment" x1="26" y1="100" x2="72" y2="166" class="geom-line" />
    <line id="el-seg-CG" data-ref="/ C G /" data-type="segment" x1="154" y1="100" x2="72" y2="166" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
