    <polygon id="hl-rect-BGCA" data-ref="&lt; B G C A &gt;" points="26,100 72,166 154,100 108,34" class="geom-polygon geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="26" y1="100" x2="154" y2="100" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="108" y1="34" x2="26" y2="100" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="108" y1="34" x2="154" y2="100" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="108" y1="34" x2="108" y2="100" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
