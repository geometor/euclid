<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100" class="euclid-graphic" data-folio="0373" data-graphic="g2">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dot {
      fill: #000000;
      stroke: none;
      transition: fill 0.15s, r 0.15s;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 2.5 !important;
      cursor: pointer;
    }
    .geom-dot:hover, .geom-dot.highlight {
      fill: #0284c7 !important;
      r: 4 !important;
      cursor: pointer;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Partition lines -->
  <line class="geom-line" x1="20" y1="42.5" x2="91" y2="42.5" data-ref="div_h" />
  <line class="geom-line" x1="48.5" y1="12" x2="48.5" y2="88" data-ref="div_v" />

