<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 193" width="170" height="193" class="euclid-graphic" data-folio="0376" data-graphic="g1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #000000;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 4 3;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-label {
      font-size: 13px;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 2.5 !important;
      cursor: pointer;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill: #0284c7 !important;
      fill-opacity: 0.25 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Shaded Polygons (Polygons for Interactive Selection) -->
  <polygon class="geom-polygon" points="47.5,75.5 141.5,75.5 141.5,172.5 47.5,172.5" data-ref="poly_ABEF" />
  <polygon class="geom-polygon" points="47.5,29.5 141.5,29.5 141.5,52.5 47.5,52.5" data-ref="poly_DG" />
  <polygon class="geom-polygon" points="22,75.5 47.5,75.5 47.5,172.5 22,172.5" data-ref="poly_AK" />

  <!-- Dashed Lines (Completing Square LF) -->
  <line class="geom-dashed" x1="22" y1="52.5" x2="47.5" y2="52.5" data-ref="line_LH" />
  <line class="geom-dashed" x1="22" y1="52.5" x2="22" y2="75.5" data-ref="line_LK" />

  <!-- Solid Geometric Lines -->
  <!-- Horizontal Lines -->
  <line class="geom-line" x1="47.5" y1="29.5" x2="141.5" y2="29.5" data-ref="line_DC" />
  <line class="geom-line" x1="47.5" y1="52.5" x2="141.5" y2="52.5" data-ref="line_HG" />
  <line class="geom-line" x1="22" y1="75.5" x2="141.5" y2="75.5" data-ref="line_KE" />
  <line class="geom-line" x1="22" y1="172.5" x2="141.5" y2="172.5" data-ref="line_bottom" />

  <!-- Vertical Lines -->
  <line class="geom-line" x1="22" y1="75.5" x2="22" y2="172.5" data-ref="line_K_bottom" />
  <line class="geom-line" x1="47.5" y1="29.5" x2="47.5" y2="172.5" data-ref="line_DA" />
  <line class="geom-line" x1="141.5" y1="29.5" x2="141.5" y2="172.5" data-ref="line_CB" />

  <!-- Vertex Labels -->
  <text class="geom-label" x="47.5" y="21" text-anchor="middle" data-ref="label_D">D</text>
  <text class="geom-label" x="141.5" y="21" text-anchor="middle" data-ref="label_C">C</text>
  <text class="geom-label" x="54" y="47" text-anchor="start" data-ref="label_H">H</text>
  <text class="geom-label" x="148" y="56" text-anchor="start" data-ref="label_G">G</text>
  <text class="geom-label" x="54" y="86" text-anchor="start" data-ref="label_F">F</text>
  <text class="geom-label" x="148" y="78" text-anchor="start" data-ref="label_E">E</text>
  <text class="geom-label" x="47.5" y="186" text-anchor="middle" data-ref="label_A">A</text>
  <text class="geom-label" x="141.5" y="186" text-anchor="middle" data-ref="label_B">B</text>
  <text class="geom-label" x="14" y="56" text-anchor="end" data-ref="label_L">L</text>
  <text class="geom-label" x="14" y="78" text-anchor="end" data-ref="label_K">K</text>
</svg>
