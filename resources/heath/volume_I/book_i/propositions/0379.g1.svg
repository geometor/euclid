<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 263" width="245" height="263" class="euclid-graphic" data-folio="0379" data-graphic="g1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-label {
      font-size: 13px;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 2.5 !important;
      cursor: pointer;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill: #0284c7 !important;
      fill-opacity: 0.25 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Shaded Polygons for Proof Identification -->
  <!-- Tilted Square BCGK -->
  <polygon class="geom-polygon" points="211,182.5 73,238.5 16.5,96.5 154.5,41" data-ref="poly_BCGK" />
  <!-- Congruent Triangles BAC, CFG, KHG, BDK -->
  <polygon class="geom-polygon" points="211,238.5 211,182.5 73,238.5" data-ref="poly_BAC" />
  <polygon class="geom-polygon" points="16.5,238.5 73,238.5 16.5,96.5" data-ref="poly_CFG" />
  <polygon class="geom-polygon" points="154.5,96.5 16.5,96.5 154.5,41" data-ref="poly_KHG" />
  <polygon class="geom-polygon" points="154.5,182.5 154.5,41 211,182.5" data-ref="poly_BDK" />
  <!-- Dissection Regions GCLH and LDB -->
  <polygon class="geom-polygon" points="16.5,96.5 73,238.5 154.5,205.4 154.5,96.5" data-ref="poly_GCLH" />
  <polygon class="geom-polygon" points="154.5,205.4 154.5,182.5 211,182.5" data-ref="poly_LDB" />

  <!-- Structural Lines -->
  <!-- Base Line: F - C - E - A -->
  <line class="geom-line" x1="16.5" y1="238.5" x2="211" y2="238.5" data-ref="line_base" />
  <!-- Left Vertical Line: F to G -->
  <line class="geom-line" x1="16.5" y1="238.5" x2="16.5" y2="96.5" data-ref="line_FG" />
  <!-- Top Horizontal Line: G to H -->
  <line class="geom-line" x1="16.5" y1="96.5" x2="154.5" y2="96.5" data-ref="line_GH" />
  <!-- Center Vertical Line: K to E (passes through K, H, D, L, E) -->
  <line class="geom-line" x1="154.5" y1="41" x2="154.5" y2="238.5" data-ref="line_KE" />
  <!-- Middle Horizontal Segment: D to B -->
  <line class="geom-line" x1="154.5" y1="182.5" x2="211" y2="182.5" data-ref="line_DB" />
  <!-- Right Vertical Segment: B to A -->
  <line class="geom-line" x1="211" y1="182.5" x2="211" y2="238.5" data-ref="line_BA" />

  <!-- Tilted Square BCGK Lines -->
  <line class="geom-line" x1="211" y1="182.5" x2="73" y2="238.5" data-ref="line_BC" />
  <line class="geom-line" x1="73" y1="238.5" x2="16.5" y2="96.5" data-ref="line_CG" />
  <line class="geom-line" x1="16.5" y1="96.5" x2="154.5" y2="41" data-ref="line_GK" />
  <line class="geom-line" x1="154.5" y1="41" x2="211" y2="182.5" data-ref="line_KB" />

  <!-- Vertex Labels -->
  <text class="geom-label" x="154.5" y="32" text-anchor="middle" data-ref="label_K">K</text>
  <text class="geom-label" x="8" y="97" text-anchor="end" data-ref="label_G">G</text>
  <text class="geom-label" x="163" y="96" text-anchor="start" data-ref="label_H">H</text>
  <text class="geom-label" x="146" y="181" text-anchor="end" data-ref="label_D">D</text>
  <text class="geom-label" x="218" y="182" text-anchor="start" data-ref="label_B">B</text>
  <text class="geom-label" x="162" y="212" text-anchor="start" data-ref="label_L">L</text>
  <text class="geom-label" x="8" y="246" text-anchor="end" data-ref="label_F">F</text>
  <text class="geom-label" x="73" y="253" text-anchor="middle" data-ref="label_C">C</text>
  <text class="geom-label" x="150" y="253" text-anchor="middle" data-ref="label_E">E</text>
  <text class="geom-label" x="218" y="253" text-anchor="start" data-ref="label_A">A</text>
</svg>
