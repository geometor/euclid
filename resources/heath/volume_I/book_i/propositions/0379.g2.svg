    <path id="el-ang-CBF" data-ref="&lt; C B F )" data-aliases="&lt; F B C )" data-type="wedge" d="M 124 185 L 142 185 A 18 18 0 0 1 124 203 Z" class="wedge angle geom-overlay" />

