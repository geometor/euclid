<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 305 262" width="305" height="262" class="euclid-graphic" data-graphic-id="0379.g2" data-folio="0379" data-graphic="g2" data-proposition="I.47">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 13px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-DBG" data-ref="[ D G ]" data-aliases="/ D B G /" data-type="line" x1="25" y1="85" x2="176" y2="239" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
    <!-- Three Squares ABED (AE), BCGF (CF), ACHK (CK) -->
    <polygon id="el-sq-ABED" data-ref="&lt; A B E D &gt;" data-aliases="&lt; A E &gt;;&lt; E A &gt;;&lt; D B &gt;" data-type="polygon" points="124,85 124,185 25,185 25,85" class="geom-polygon" />
    <polygon id="el-sq-BCGF" data-ref="&lt; B C G F &gt;" data-aliases="&lt; C F &gt;;&lt; F C &gt;;&lt; B G &gt;" data-type="polygon" points="124,185 176,185 176,239 124,239" class="geom-polygon" />
    <polygon id="el-sq-ACHK" data-ref="&lt; A C H K &gt;" data-aliases="&lt; C K &gt;;&lt; K C &gt;;&lt; A H &gt;" data-type="polygon" points="124,85 176,185 275,128 224,30" class="geom-polygon" />

    <!-- Two Equal Hexagons ADEFGC and ABCHLK -->
    <polygon id="el-hex-ADEFGC" data-ref="&lt; A D E F G C &gt;" data-type="polygon" points="124,85 25,85 25,185 124,239 176,239 176,185" class="geom-polygon" />
    <polygon id="el-hex-ABCHLK" data-ref="&lt; A B C H L K &gt;" data-type="polygon" points="124,85 124,185 176,185 275,128 275,30 224,30" class="geom-polygon" />

