    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="124" y1="85" x2="25" y2="85" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="25" y1="85" x2="25" y2="185" class="geom-line" />
    <line id="el-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" data-type="segment" x1="25" y1="185" x2="124" y2="185" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="124" y1="85" x2="124" y2="185" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="124" y1="185" x2="176" y2="185" class="geom-line" />
    <line id="el-seg-CG" data-ref="/ C G /" data-aliases="/ G C /" data-type="segment" x1="176" y1="185" x2="176" y2="239" class="geom-line" />
    <line id="el-seg-GF" data-ref="/ G F /" data-aliases="/ F G /" data-type="segment" x1="176" y1="239" x2="124" y2="239" class="geom-line" />
    <line id="el-seg-FB" data-ref="/ F B /" data-aliases="/ B F /" data-type="segment" x1="124" y1="239" x2="124" y2="185" class="geom-line" />
