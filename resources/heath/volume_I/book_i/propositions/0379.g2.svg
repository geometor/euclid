<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 305 262" width="305" height="262" class="euclid-graphic" data-folio="0379" data-graphic="g2">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-label {
      font-size: 13px;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 2.5 !important;
      cursor: pointer;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill: #0284c7 !important;
      fill-opacity: 0.25 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Four Equal Quadrilaterals of Leonardo da Vinci -->
  <polygon class="geom-polygon" points="124,85 25,85 176,239 176,185" data-ref="poly_ADGC" />
  <polygon class="geom-polygon" points="25,185 25,85 176,239 124,239" data-ref="poly_EDGF" />
  <polygon class="geom-polygon" points="124,85 124,185 275,30 224,30" data-ref="poly_ABLK" />
  <polygon class="geom-polygon" points="275,128 275,30 124,185 176,185" data-ref="poly_HLBC" />

  <!-- Triangles ABC, EBF, HKL -->
  <polygon class="geom-polygon" points="124,85 124,185 176,185" data-ref="poly_ABC" />
  <polygon class="geom-polygon" points="25,185 124,185 124,239" data-ref="poly_EBF" />
  <polygon class="geom-polygon" points="275,128 224,30 275,30" data-ref="poly_HKL" />

  <!-- Geometric Solid Lines -->
  <!-- Square ABED on leg AB -->
  <line class="geom-line" x1="124" y1="85" x2="25" y2="85" data-ref="line_AD" />
  <line class="geom-line" x1="25" y1="85" x2="25" y2="185" data-ref="line_DE" />
  <line class="geom-line" x1="25" y1="185" x2="124" y2="185" data-ref="line_EB" />
  <line class="geom-line" x1="124" y1="85" x2="124" y2="185" data-ref="line_AB" />

  <!-- Square BCGF on leg BC -->
  <line class="geom-line" x1="124" y1="185" x2="176" y2="185" data-ref="line_BC" />
  <line class="geom-line" x1="176" y1="185" x2="176" y2="239" data-ref="line_CG" />
  <line class="geom-line" x1="176" y1="239" x2="124" y2="239" data-ref="line_GF" />
  <line class="geom-line" x1="124" y1="239" x2="124" y2="185" data-ref="line_FB" />

  <!-- Square ACHK on hypotenuse AC -->
  <line class="geom-line" x1="124" y1="85" x2="176" y2="185" data-ref="line_AC" />
  <line class="geom-line" x1="176" y1="185" x2="275" y2="128" data-ref="line_CH" />
  <line class="geom-line" x1="275" y1="128" x2="224" y2="30" data-ref="line_HK" />
  <line class="geom-line" x1="224" y1="30" x2="124" y2="85" data-ref="line_KA" />

  <!-- Triangle HKL Outer Sides -->
  <line class="geom-line" x1="224" y1="30" x2="275" y2="30" data-ref="line_KL" />
  <line class="geom-line" x1="275" y1="30" x2="275" y2="128" data-ref="line_LH" />

  <!-- Triangle EBF Hypotenuse Line EF -->
  <line class="geom-line" x1="25" y1="185" x2="124" y2="239" data-ref="line_EF" />

  <!-- Symmetry Lines DBG and BL -->
  <line class="geom-line" x1="25" y1="85" x2="176" y2="239" data-ref="line_DBG" />
  <line class="geom-line" x1="124" y1="185" x2="275" y2="30" data-ref="line_BL" />

  <!-- Vertex Labels -->
  <text class="geom-label" x="25" y="75" text-anchor="middle" data-ref="label_D">D</text>
  <text class="geom-label" x="124" y="75" text-anchor="middle" data-ref="label_A">A</text>
  <text class="geom-label" x="220" y="23" text-anchor="end" data-ref="label_K">K</text>
  <text class="geom-label" x="285" y="25" text-anchor="start" data-ref="label_L">L</text>
  <text class="geom-label" x="285" y="134" text-anchor="start" data-ref="label_H">H</text>
  <text class="geom-label" x="15" y="190" text-anchor="end" data-ref="label_E">E</text>
  <text class="geom-label" x="114" y="195" text-anchor="end" data-ref="label_B">B</text>
  <text class="geom-label" x="186" y="190" text-anchor="start" data-ref="label_C">C</text>
  <text class="geom-label" x="115" y="249" text-anchor="end" data-ref="label_F">F</text>
  <text class="geom-label" x="186" y="249" text-anchor="start" data-ref="label_G">G</text>
</svg>
