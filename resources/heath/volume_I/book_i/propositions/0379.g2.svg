    <line id="el-seg-BG" data-ref="/ B G /" data-aliases="/ G B /" data-type="segment" x1="124" y1="185" x2="176" y2="239" class="geom-line" />
    <line id="el-seg-DG" data-ref="/ D G /" data-aliases="/ G D /" data-type="segment" x1="25" y1="85" x2="176" y2="239" class="geom-line" />
    <line id="el-seg-BL" data-ref="/ B L /" data-aliases="/ L B /" data-type="segment" x1="124" y1="185" x2="275" y2="30" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-sq-ABED" data-ref="&lt; A B E D &gt;" data-aliases="&lt; A E &gt;;&lt; E A &gt;;&lt; D B &gt;" points="124,85 124,185 25,185 25,85" class="geom-polygon geom-overlay" />
