    <line id="el-seg-KA" data-ref="/ K A /" data-aliases="/ A K /" data-type="segment" x1="224" y1="30" x2="124" y2="85" class="geom-line" />
    <line id="el-seg-KL" data-ref="/ K L /" data-aliases="/ L K /" data-type="segment" x1="224" y1="30" x2="275" y2="30" class="geom-line" />
