    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" points="124,85 124,185 176,185" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-EBF" data-ref="&lt; E B F &gt;" points="25,185 124,185 124,239" class="geom-polygon geom-overlay" />
