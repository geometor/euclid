    <polygon id="el-quad-ADGC" data-ref="&lt; A D G C &gt;" data-type="polygon" points="124,85 25,85 176,239 176,185" class="geom-polygon" />
    <polygon id="el-quad-EDGF" data-ref="&lt; E D G F &gt;" data-type="polygon" points="25,185 25,85 176,239 124,239" class="geom-polygon" />
    <polygon id="el-quad-ABLK" data-ref="&lt; A B L K &gt;" data-type="polygon" points="124,85 124,185 275,30 224,30" class="geom-polygon" />
    <polygon id="el-quad-HLBC" data-ref="&lt; H L B C &gt;" data-type="polygon" points="275,128 275,30 124,185 176,185" class="geom-polygon" />

    <!-- Triangles ABC, EBF, HKL (HLK) -->
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-type="polygon" points="124,85 124,185 176,185" class="geom-polygon" />
