<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 160" width="190" height="160" class="euclid-graphic" data-folio="0381" data-graphic="g1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #000000;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 4 3;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-label {
      font-size: 13px;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 2.5 !important;
      cursor: pointer;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill: #0284c7 !important;
      fill-opacity: 0.25 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Shaded Polygons for Proof -->
  <polygon class="geom-polygon" points="106,24.5 40,117 138,117" data-ref="poly_ABC" />
  <polygon class="geom-polygon" points="106,24.5 47,69.5 144,69.5" data-ref="poly_ADE" />
  <polygon class="geom-polygon" points="47,69.5 88,138 106,24.5" data-ref="poly_ADF" />
  <polygon class="geom-polygon" points="144,69.5 88,138 106,24.5" data-ref="poly_AEF" />

  <!-- Auxiliary Dashed Lines -->
  <!-- Top Parallel HK through A -->
  <line class="geom-dashed" x1="53" y1="24.5" x2="158" y2="24.5" data-ref="line_HK" />
  <!-- Line HDL (parallel to AF) -->
  <line class="geom-dashed" x1="53" y1="24.5" x2="20" y2="138" data-ref="line_HDL" />
  <!-- Line KEM (parallel to AF) -->
  <line class="geom-dashed" x1="158" y1="24.5" x2="155" y2="138" data-ref="line_KEM" />
  <!-- Joining DF and EF -->
  <line class="geom-dashed" x1="47" y1="69.5" x2="88" y2="138" data-ref="line_DF" />
  <line class="geom-dashed" x1="144" y1="69.5" x2="88" y2="138" data-ref="line_EF" />

  <!-- Solid Geometric Lines -->
  <!-- Triangle Sides AB and AC -->
  <line class="geom-line" x1="106" y1="24.5" x2="40" y2="117" data-ref="line_AB" />
  <line class="geom-line" x1="106" y1="24.5" x2="138" y2="117" data-ref="line_AC" />
  <!-- Parallel DE -->
  <line class="geom-line" x1="47" y1="69.5" x2="144" y2="69.5" data-ref="line_DE" />
  <!-- Base BC -->
  <line class="geom-line" x1="40" y1="117" x2="138" y2="117" data-ref="line_BC" />
  <!-- Median AGF (from A to F) -->
  <line class="geom-line" x1="106" y1="24.5" x2="88" y2="138" data-ref="line_AF" />
  <!-- Bottom parallel LM -->
  <line class="geom-line" x1="20" y1="138" x2="155" y2="138" data-ref="line_LM" />

  <!-- Vertex Labels -->
  <text class="geom-label" x="53" y="18" text-anchor="middle" data-ref="label_H">H</text>
  <text class="geom-label" x="106" y="16" text-anchor="middle" data-ref="label_A">A</text>
  <text class="geom-label" x="158" y="18" text-anchor="middle" data-ref="label_K">K</text>
  <text class="geom-label" x="39" y="69.5" text-anchor="end" data-ref="label_D">D</text>
  <text class="geom-label" x="102" y="66" text-anchor="start" data-ref="label_G">G</text>
  <text class="geom-label" x="151" y="69.5" text-anchor="start" data-ref="label_E">E</text>
  <text class="geom-label" x="33" y="117" text-anchor="end" data-ref="label_B">B</text>
  <text class="geom-label" x="145" y="117" text-anchor="start" data-ref="label_C">C</text>
  <text class="geom-label" x="15" y="145" text-anchor="end" data-ref="label_L">L</text>
  <text class="geom-label" x="88" y="151" text-anchor="middle" data-ref="label_F">F</text>
  <text class="geom-label" x="161" y="145" text-anchor="start" data-ref="label_M">M</text>
</svg>
