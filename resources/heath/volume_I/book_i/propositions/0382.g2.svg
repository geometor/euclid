<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 143 190" width="143" height="190" class="euclid-graphic" data-folio="0382" data-graphic="g2">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-label {
      font-size: 13px;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 2.5 !important;
      cursor: pointer;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill: #0284c7 !important;
      fill-opacity: 0.25 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Shaded Triangles ABC and ADC -->
  <polygon class="geom-polygon" points="71.5,147 120,147 71.5,23" data-ref="poly_ABC" />
  <polygon class="geom-polygon" points="71.5,147 20,147 71.5,23" data-ref="poly_ADC" />

  <!-- Geometric Lines -->
  <!-- Base Line: D to B (passes through A) -->
  <line class="geom-line" x1="20" y1="147" x2="120" y2="147" data-ref="line_DB" />
  <!-- Vertical Leg AC (perpendicular to DA) -->
  <line class="geom-line" x1="71.5" y1="147" x2="71.5" y2="23" data-ref="line_AC" />
  <!-- Hypotenuse BC -->
  <line class="geom-line" x1="120" y1="147" x2="71.5" y2="23" data-ref="line_BC" />
  <!-- Hypotenuse DC -->
  <line class="geom-line" x1="20" y1="147" x2="71.5" y2="23" data-ref="line_DC" />

  <!-- Vertex Labels -->
  <text class="geom-label" x="71.5" y="16" text-anchor="middle" data-ref="label_C">C</text>
  <text class="geom-label" x="71.5" y="163" text-anchor="middle" data-ref="label_A">A</text>
  <text class="geom-label" x="14" y="163" text-anchor="end" data-ref="label_D">D</text>
  <text class="geom-label" x="127" y="163" text-anchor="start" data-ref="label_B">B</text>
</svg>
