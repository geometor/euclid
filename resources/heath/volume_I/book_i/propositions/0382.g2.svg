<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 143 190" width="143" height="190" class="euclid-graphic" data-graphic-id="0382.g2" data-folio="0382" data-graphic="g2" data-proposition="I.48">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 13px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-DB" data-ref="[ D B ]" data-aliases="/ D A B /" data-type="line" x1="20" y1="147" x2="123" y2="147" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-type="polygon" points="71.5,147 123,147 71.5,23" class="geom-polygon" />
    <polygon id="el-tri-ADC" data-ref="&lt; A D C &gt;" data-type="polygon" points="71.5,147 20,147 71.5,23" class="geom-polygon" />

    <!-- Angles -->
    <path id="el-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; C A B )" data-type="wedge" d="M 71.5 147 L 71.5 129 A 18 18 0 0 1 89.5 147 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-DAC" data-ref="&lt; D A C )" data-aliases="&lt; C A D )" data-type="wedge" d="M 71.5 147 L 53.5 147 A 18 18 0 0 1 71.5 129 Z" class="wedge angle geom-overlay" />

    <!-- Segments -->
    <line id="el-seg-AB" data-ref="/ B A /" data-aliases="/ A B /" data-type="segment" x1="123" y1="147" x2="71.5" y2="147" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="71.5" y1="147" x2="20" y2="147" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="71.5" y1="147" x2="71.5" y2="23" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="123" y1="147" x2="71.5" y2="23" class="geom-line" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" data-type="segment" x1="20" y1="147" x2="71.5" y2="23" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" points="71.5,147 123,147 71.5,23" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-ADC" data-ref="&lt; A D C &gt;" points="71.5,147 20,147 71.5,23" class="geom-polygon geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="71.5" cy="23" r="3" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="20" cy="147" r="3" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="71.5" cy="147" r="3" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="123" cy="147" r="3" class="geom-point" />
  </g>

  <!-- Vertex Labels -->
  <g id="labels">
    <text id="lbl-C" data-ref="C" x="71.5" y="16" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="14" y="163" text-anchor="end" class="geom-label">D</text>
    <text id="lbl-A" data-ref="A" x="71.5" y="163" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="129" y="163" text-anchor="start" class="geom-label">B</text>
  </g>
</svg>
