<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 112" width="195" height="112" class="euclid-graphic" data-folio="0383" data-graphic="g1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-label {
      font-size: 13px;
      fill: #000000;
      user-select: none;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 2.5 !important;
      cursor: pointer;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill: #0284c7 !important;
      fill-opacity: 0.25 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Shaded Polygons for the Three Cases -->
  <polygon class="geom-polygon" points="108,28 26,86 150,86" data-ref="poly_ABC" />
  <polygon class="geom-polygon" points="108,28 26,86 125,86" data-ref="poly_ADC" />
  <polygon class="geom-polygon" points="108,28 26,86 175,52" data-ref="poly_AEC" />

  <!-- Base Line: C through D to B -->
  <line class="geom-line" x1="26" y1="86" x2="150" y2="86" data-ref="line_CB" />

  <!-- Original Triangle Side AC -->
  <line class="geom-line" x1="108" y1="28" x2="26" y2="86" data-ref="line_AC" />
  <!-- Original Triangle Side AB -->
  <line class="geom-line" x1="108" y1="28" x2="150" y2="86" data-ref="line_AB" />

  <!-- Case 1: Perpendicular AD inside angle CAB -->
  <line class="geom-line" x1="108" y1="28" x2="125" y2="86" data-ref="line_AD" />

  <!-- Case 2: Perpendicular AE outside angle CAB -->
  <line class="geom-line" x1="108" y1="28" x2="175" y2="52" data-ref="line_AE" />
  <line class="geom-line" x1="26" y1="86" x2="175" y2="52" data-ref="line_CE" />

  <!-- Vertex Labels -->
  <text class="geom-label" x="108" y="20" text-anchor="middle" data-ref="label_A">A</text>
  <text class="geom-label" x="18" y="89" text-anchor="end" data-ref="label_C">C</text>
  <text class="geom-label" x="133" y="100" text-anchor="start" data-ref="label_D">D</text>
  <text class="geom-label" x="158" y="89" text-anchor="start" data-ref="label_B">B</text>
  <text class="geom-label" x="183" y="55" text-anchor="start" data-ref="label_E">E</text>
</svg>
