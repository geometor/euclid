<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 115" width="195" height="115" class="euclid-graphic" data-graphic-id="0383.g1" data-folio="0383" data-graphic="g1" data-proposition="I.48">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 13px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-type="polygon" points="108,28 150,86 26,86" class="geom-polygon" />
    <polygon id="el-tri-ADC" data-ref="&lt; A D C &gt;" data-type="polygon" points="108,28 131,96 26,86" class="geom-polygon" />
    <polygon id="el-tri-AEC" data-ref="&lt; A E C &gt;" data-type="polygon" points="108,28 175,52 26,86" class="geom-polygon" />

    <!-- Angles -->
    <path id="el-ang-CAB" data-ref="&lt; C A B )" data-aliases="&lt; B A C )" data-type="wedge" d="M 108 28 L 118.56 42.59 A 18 18 0 0 1 93.35 38.36 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-CAD" data-ref="&lt; C A D )" data-aliases="&lt; D A C )" data-type="wedge" d="M 108 28 L 113.13 43.17 A 16 16 0 0 1 94.98 37.21 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-CAE" data-ref="&lt; C A E )" data-aliases="&lt; E A C )" data-type="wedge" d="M 108 28 L 126.82 34.74 A 20 20 0 0 1 91.72 39.51 Z" class="wedge angle geom-overlay" />

    <!-- Segments -->
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="108" y1="28" x2="26" y2="86" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="108" y1="28" x2="150" y2="86" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="150" y1="86" x2="26" y2="86" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="108" y1="28" x2="131" y2="96" class="geom-line" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" data-type="segment" x1="131" y1="96" x2="26" y2="86" class="geom-line" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="108" y1="28" x2="175" y2="52" class="geom-line" />
    <line id="el-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" data-type="segment" x1="175" y1="52" x2="26" y2="86" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" points="108,28 150,86 26,86" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-ADC" data-ref="&lt; A D C &gt;" points="108,28 131,96 26,86" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-AEC" data-ref="&lt; A E C &gt;" points="108,28 175,52 26,86" class="geom-polygon geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="108" cy="28" r="3" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="26" cy="86" r="3" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="131" cy="96" r="3" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="150" cy="86" r="3" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="175" cy="52" r="3" class="geom-point" />
  </g>

  <!-- Vertex Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="108" y="20" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-C" data-ref="C" x="18" y="89" text-anchor="end" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="138" y="103" text-anchor="start" class="geom-label">D</text>
    <text id="lbl-B" data-ref="B" x="157" y="90" text-anchor="start" class="geom-label">B</text>
    <text id="lbl-E" data-ref="E" x="182" y="55" text-anchor="start" class="geom-label">E</text>
  </g>
</svg>
