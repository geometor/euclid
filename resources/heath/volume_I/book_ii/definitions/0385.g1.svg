<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 172" width="176" height="172" class="euclid-graphic" data-graphic-id="0385.g1" data-folio="0385" data-graphic="g1" data-section="definitions">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2.0;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
      opacity: 0;
    }
    .geom-label {
      font-size: 13px;
      font-weight: bold;
      fill: #000000;
      opacity: 0;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      opacity: 1 !important;
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Gnomon Instrument Polygon, Right Angle Wedges, and Boundary Segments) -->
  <g id="graphics">
    <polygon id="el-poly-gnomon" data-ref="&lt; A B C D E F &gt;" data-aliases="&lt; M N O &gt;;gnomon;instrument" data-type="polygon" points="39,124 39,16 71,16 71,90 148,90 148,124" class="geom-polygon" />

    <path id="el-ang-BAF" data-ref="&lt; B A F )" data-aliases="&lt; F A B )" data-type="wedge" d="M 39 124 L 39 106 A 18 18 0 0 1 57 124 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-CDE" data-ref="&lt; C D E )" data-aliases="&lt; E D C )" data-type="wedge" d="M 71 90 L 71 72 A 18 18 0 0 1 89 90 Z" class="wedge angle geom-overlay" />

    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="39" y1="124" x2="39" y2="16" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="39" y1="16" x2="71" y2="16" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="71" y1="16" x2="71" y2="90" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="71" y1="90" x2="148" y2="90" class="geom-line" />
    <line id="el-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" data-type="segment" x1="148" y1="90" x2="148" y2="124" class="geom-line" />
    <line id="el-seg-FA" data-ref="/ F A /" data-aliases="/ A F /" data-type="segment" x1="148" y1="124" x2="39" y2="124" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-gnomon" data-ref="&lt; A B C D E F &gt;" data-aliases="&lt; M N O &gt;;gnomon;instrument" points="39,124 39,16 71,16 71,90 148,90 148,124" class="geom-polygon geom-overlay" />
    <path id="hl-ang-BAF" data-ref="&lt; B A F )" data-aliases="&lt; F A B )" d="M 39 124 L 39 106 A 18 18 0 0 1 57 124 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-CDE" data-ref="&lt; C D E )" data-aliases="&lt; E D C )" d="M 71 90 L 71 72 A 18 18 0 0 1 89 90 Z" class="wedge angle geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="39" y1="124" x2="39" y2="16" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="39" y1="16" x2="71" y2="16" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="71" y1="16" x2="71" y2="90" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="71" y1="90" x2="148" y2="90" class="geom-line geom-overlay" />
    <line id="hl-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" x1="148" y1="90" x2="148" y2="124" class="geom-line geom-overlay" />
    <line id="hl-seg-FA" data-ref="/ F A /" data-aliases="/ A F /" x1="148" y1="124" x2="39" y2="124" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="39" cy="124" r="3" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="39" cy="16" r="3" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="71" cy="16" r="3" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="71" cy="90" r="3" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="148" cy="90" r="3" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="148" cy="124" r="3" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="29" y="134" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="29" y="14" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="81" y="14" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="81" y="84" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="158" y="88" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="158" y="134" text-anchor="middle" class="geom-label">F</text>
  </g>
</svg>