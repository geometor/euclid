<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 172" width="176" height="172" class="euclid-graphic" data-folio="0385" data-graphic="g1" data-section="definitions">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.06;
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linejoin: round;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Gnomon Carpenter's Square Instrument -->
  <polygon id="el-gnomon-instrument" data-ref="instrument" data-type="polygon" points="39,16 71,16 71,90 148,90 148,124 39,124" class="geom-polygon" />

  <!-- Outer corner vertex -->
  <circle id="el-pt-corner" data-ref="corner" data-type="point" cx="39" cy="124" r="3.5" class="geom-point" />
</svg>