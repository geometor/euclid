<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 214 162" width="214" height="162" class="euclid-graphic" data-folio="0385" data-graphic="g2" data-section="definitions">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon-gnomon {
      fill: #000000;
      fill-opacity: 0.14;
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linejoin: round;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-polygon-inner {
      fill: #ffffff;
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linejoin: round;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    .geom-polygon-gnomon:hover, .geom-polygon-gnomon.highlight {
      fill-opacity: 0.28 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
    }
    .geom-polygon-inner:hover, .geom-polygon-inner.highlight {
      fill: #0284c7 !important;
      fill-opacity: 0.18 !important;
      stroke: #0284c7 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- The Shaded Gnomon: L-shaped area wrapping around the inner parallelogram -->
  <polygon id="el-gnomon" data-ref="gnomon" data-type="polygon" points="124,16 153,16 186,114 72,114 63.6,89 148.5,89" class="geom-polygon-gnomon" />

  <!-- Inner Parallelogram about the diameter (unshaded original area) -->
  <polygon id="el-inner-parallelogram" data-ref="inner_parallelogram" data-type="polygon" points="39,16 124,16 148.5,89 63.6,89" class="geom-polygon-inner" />

  <!-- Full Diagonal AC -->
  <line id="el-line-diag-1" data-ref="diagonal_1" data-type="line" x1="39" y1="16" x2="148.5" y2="89" class="geom-line" />
  <line id="el-line-diag-2" data-ref="diagonal_2" data-type="line" x1="148.5" y1="89" x2="186" y2="114" class="geom-line" />

  <!-- Internal dividing lines between gnomon components -->
  <!-- Horizontal divider extending through gnomon to right edge -->
  <line id="el-div-horiz" data-ref="div_horiz" data-type="line" x1="148.5" y1="89" x2="177.6" y2="89" class="geom-line" />
  <!-- Oblique divider extending through gnomon to bottom edge -->
  <line id="el-div-oblique" data-ref="div_oblique" data-type="line" x1="148.5" y1="89" x2="157" y2="114" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="39" cy="16" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="153" cy="16" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="186" cy="114" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="72" cy="114" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="148.5" cy="89" r="3.5" class="geom-point" />
</svg>