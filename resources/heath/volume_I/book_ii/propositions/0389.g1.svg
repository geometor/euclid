<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 190" width="264" height="190" class="euclid-graphic" data-folio="0389" data-graphic="g1" data-proposition="II.1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Sub-rectangles -->
  <polygon id="el-rect-BK" data-ref="BK" data-type="polygon" points="27.5,38.5 136.5,38.5 136.5,127.5 27.5,127.5" class="geom-polygon" />
  <polygon id="el-rect-DL" data-ref="DL" data-type="polygon" points="136.5,38.5 195.5,38.5 195.5,127.5 136.5,127.5" class="geom-polygon" />
  <polygon id="el-rect-EH" data-ref="EH" data-type="polygon" points="195.5,38.5 242.5,38.5 242.5,127.5 195.5,127.5" class="geom-polygon" />

  <!-- Separate Given Line A -->
  <line id="el-line-A" data-ref="A" data-type="segment" x1="105" y1="20" x2="191" y2="20" class="geom-line" />
  <circle id="el-pt-A1" data-ref="A" data-type="point" cx="105" cy="20" r="3" class="geom-point" />
  <circle id="el-pt-A2" data-ref="A" data-type="point" cx="191" cy="20" r="3" class="geom-point" />

  <!-- Main Construction Lines -->
  <!-- Line BC (Divided into BD, DE, EC) -->
  <line id="el-seg-BC" data-ref="BC" data-type="segment" x1="27.5" y1="38.5" x2="242.5" y2="38.5" class="geom-line" />
  <!-- Line BF (Perpendicular at B, produced through G to F) -->
  <line id="el-line-BF" data-ref="BF" data-type="line" x1="27.5" y1="38.5" x2="27.5" y2="172" class="geom-line" />
  <!-- Line GH (Parallel to BC) -->
  <line id="el-line-GH" data-ref="GH" data-type="line" x1="27.5" y1="127.5" x2="242.5" y2="127.5" class="geom-line" />
  <!-- Divider DK -->
  <line id="el-seg-DK" data-ref="DK" data-type="segment" x1="136.5" y1="38.5" x2="136.5" y2="127.5" class="geom-line" />
  <!-- Divider EL -->
  <line id="el-seg-EL" data-ref="EL" data-type="segment" x1="195.5" y1="38.5" x2="195.5" y2="127.5" class="geom-line" />
  <!-- Line CH -->
  <line id="el-seg-CH" data-ref="CH" data-type="segment" x1="242.5" y1="38.5" x2="242.5" y2="127.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="27.5" cy="38.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="136.5" cy="38.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="195.5" cy="38.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="242.5" cy="38.5" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="27.5" cy="127.5" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="27.5" cy="172" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="136.5" cy="127.5" r="3.5" class="geom-point" />
  <circle id="el-pt-L" data-ref="L" data-type="point" cx="195.5" cy="127.5" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="242.5" cy="127.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="98" y="24" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-B" data-ref="B" x="21" y="38" text-anchor="end" class="geom-label">B</text>
  <text id="lbl-D" data-ref="D" x="136.5" y="30" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="195.5" y="30" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-C" data-ref="C" x="245" y="30" text-anchor="start" class="geom-label">C</text>
  <text id="lbl-G" data-ref="G" x="20" y="130" text-anchor="end" class="geom-label">G</text>
  <text id="lbl-F" data-ref="F" x="20" y="172" text-anchor="end" class="geom-label">F</text>
  <text id="lbl-K" data-ref="K" x="136.5" y="142" text-anchor="middle" class="geom-label">K</text>
  <text id="lbl-L" data-ref="L" x="195.5" y="142" text-anchor="middle" class="geom-label">L</text>
  <text id="lbl-H" data-ref="H" x="245" y="142" text-anchor="start" class="geom-label">H</text>
</svg>