<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 158 179" width="158" height="179" class="euclid-graphic" data-graphic-id="0390.g1" data-folio="0390" data-graphic="g1" data-proposition="II.2">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Extended Lines) -->
  <g id="elements">
    <line id="el-line-AB" data-ref="[ A B ]" data-aliases="/ A C B /" data-type="line" x1="20.5" y1="29.5" x2="137.5" y2="29.5" class="geom-line" />
    <line id="el-line-DE" data-ref="[ D E ]" data-aliases="/ D F E /" data-type="line" x1="20.5" y1="146.5" x2="137.5" y2="146.5" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Square, Sub-rectangles, and Segments) -->
  <g id="graphics">
    <!-- Square ADEB (AE) and Sub-rectangles ACFD (AF) and CBEF (CE) -->
    <polygon id="el-sq-ADEB" data-ref="&lt; A D E B &gt;" data-aliases="&lt; A E &gt;;&lt; E A &gt;;&lt; B D &gt;;&lt; D B &gt;;&lt; A B E D &gt;" data-type="polygon" points="20.5,29.5 20.5,146.5 137.5,146.5 137.5,29.5" class="geom-polygon" />
    <polygon id="el-rect-ACFD" data-ref="&lt; A C F D &gt;" data-aliases="&lt; A F &gt;;&lt; F A &gt;;&lt; D C &gt;;&lt; C D &gt;;&lt; A D F C &gt;" data-type="polygon" points="20.5,29.5 60.5,29.5 60.5,146.5 20.5,146.5" class="geom-polygon" />
    <polygon id="el-rect-CBEF" data-ref="&lt; C B E F &gt;" data-aliases="&lt; C E &gt;;&lt; E C &gt;;&lt; F B &gt;;&lt; B F &gt;;&lt; C F E B &gt;" data-type="polygon" points="60.5,29.5 137.5,29.5 137.5,146.5 60.5,146.5" class="geom-polygon" />

    <!-- Top side AB and sub-segments AC, CB -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /;/ A C B /" data-type="segment" x1="20.5" y1="29.5" x2="137.5" y2="29.5" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="20.5" y1="29.5" x2="60.5" y2="29.5" class="geom-line" />
    <line id="el-seg-CB" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="60.5" y1="29.5" x2="137.5" y2="29.5" class="geom-line" />

    <!-- Bottom side DE and sub-segments DF, FE -->
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /;/ D F E /" data-type="segment" x1="20.5" y1="146.5" x2="137.5" y2="146.5" class="geom-line" />
    <line id="el-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" data-type="segment" x1="20.5" y1="146.5" x2="60.5" y2="146.5" class="geom-line" />
    <line id="el-seg-FE" data-ref="/ F E /" data-aliases="/ E F /" data-type="segment" x1="60.5" y1="146.5" x2="137.5" y2="146.5" class="geom-line" />

    <!-- Vertical sides AD, CF, BE -->
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="20.5" y1="29.5" x2="20.5" y2="146.5" class="geom-line" />
    <line id="el-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" data-type="segment" x1="60.5" y1="29.5" x2="60.5" y2="146.5" class="geom-line" />
    <line id="el-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" data-type="segment" x1="137.5" y1="29.5" x2="137.5" y2="146.5" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-sq-ADEB" data-ref="&lt; A D E B &gt;" data-aliases="&lt; A E &gt;;&lt; E A &gt;;&lt; B D &gt;;&lt; D B &gt;;&lt; A B E D &gt;" points="20.5,29.5 20.5,146.5 137.5,146.5 137.5,29.5" class="geom-polygon geom-overlay" />
    <polygon id="hl-rect-ACFD" data-ref="&lt; A C F D &gt;" data-aliases="&lt; A F &gt;;&lt; F A &gt;;&lt; D C &gt;;&lt; C D &gt;;&lt; A D F C &gt;" points="20.5,29.5 60.5,29.5 60.5,146.5 20.5,146.5" class="geom-polygon geom-overlay" />
    <polygon id="hl-rect-CBEF" data-ref="&lt; C B E F &gt;" data-aliases="&lt; C E &gt;;&lt; E C &gt;;&lt; F B &gt;;&lt; B F &gt;;&lt; C F E B &gt;" points="60.5,29.5 137.5,29.5 137.5,146.5 60.5,146.5" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /;/ A C B /" x1="20.5" y1="29.5" x2="137.5" y2="29.5" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="20.5" y1="29.5" x2="60.5" y2="29.5" class="geom-line geom-overlay" />
    <line id="hl-seg-CB" data-ref="/ B C /" data-aliases="/ C B /" x1="60.5" y1="29.5" x2="137.5" y2="29.5" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /;/ D F E /" x1="20.5" y1="146.5" x2="137.5" y2="146.5" class="geom-line geom-overlay" />
    <line id="hl-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" x1="20.5" y1="146.5" x2="60.5" y2="146.5" class="geom-line geom-overlay" />
    <line id="hl-seg-FE" data-ref="/ F E /" data-aliases="/ E F /" x1="60.5" y1="146.5" x2="137.5" y2="146.5" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="20.5" y1="29.5" x2="20.5" y2="146.5" class="geom-line geom-overlay" />
    <line id="hl-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" x1="60.5" y1="29.5" x2="60.5" y2="146.5" class="geom-line geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" x1="137.5" y1="29.5" x2="137.5" y2="146.5" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="20.5" cy="29.5" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="60.5" cy="29.5" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="137.5" cy="29.5" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="20.5" cy="146.5" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="60.5" cy="146.5" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="137.5" cy="146.5" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="20.5" y="21.0" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-C" data-ref="C" x="60.5" y="21.0" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-B" data-ref="B" x="137.5" y="21.0" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-D" data-ref="D" x="20.5" y="161.0" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-F" data-ref="F" x="60.5" y="161.0" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-E" data-ref="E" x="137.5" y="161.0" text-anchor="middle" class="geom-label">E</text>
