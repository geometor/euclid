<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 158 179" width="158" height="179" class="euclid-graphic" data-folio="0390" data-graphic="g1" data-proposition="II.2">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Sub-rectangles -->
  <polygon id="el-rect-AF" data-ref="AF" data-type="polygon" points="20.5,29.5 60.5,29.5 60.5,146.5 20.5,146.5" class="geom-polygon" />
  <polygon id="el-rect-CE" data-ref="CE" data-type="polygon" points="60.5,29.5 137.5,29.5 137.5,146.5 60.5,146.5" class="geom-polygon" />

  <!-- Square ADEB Outer Boundary -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="20.5" y1="29.5" x2="137.5" y2="29.5" class="geom-line" />
  <line id="el-seg-AD" data-ref="AD" data-type="segment" x1="20.5" y1="29.5" x2="20.5" y2="146.5" class="geom-line" />
  <line id="el-seg-BE" data-ref="BE" data-type="segment" x1="137.5" y1="29.5" x2="137.5" y2="146.5" class="geom-line" />
  <line id="el-seg-DE" data-ref="DE" data-type="segment" x1="20.5" y1="146.5" x2="137.5" y2="146.5" class="geom-line" />

  <!-- Divider CF (Through point C parallel to AD) -->
  <line id="el-seg-CF" data-ref="CF" data-type="segment" x1="60.5" y1="29.5" x2="60.5" y2="146.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="20.5" cy="29.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="60.5" cy="29.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="137.5" cy="29.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="20.5" cy="146.5" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="60.5" cy="146.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="137.5" cy="146.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="20.5" y="21" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-C" data-ref="C" x="60.5" y="21" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-B" data-ref="B" x="137.5" y="21" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-D" data-ref="D" x="20.5" y="161" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-F" data-ref="F" x="60.5" y="161" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-E" data-ref="E" x="137.5" y="161" text-anchor="middle" class="geom-label">E</text>
</svg>