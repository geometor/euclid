    <circle id="el-pt-C" data-ref="C" data-type="point" cx="71.5" cy="29.5" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="173.5" cy="29.5" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="18.5" cy="129.5" r="3.5" class="geom-point" />
