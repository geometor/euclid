<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 193 159" width="193" height="159" class="euclid-graphic" data-folio="0392" data-graphic="g1" data-proposition="II.3">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Sub-figures -->
  <polygon id="el-rect-AD" data-ref="AD" data-type="polygon" points="18.5,29.5 71.5,29.5 71.5,129.5 18.5,129.5" class="geom-polygon" />
  <polygon id="el-square-DB" data-ref="DB" data-type="polygon" points="71.5,29.5 173.5,29.5 173.5,129.5 71.5,129.5" class="geom-polygon" />

  <!-- Outer Rectangle Boundary AE -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="18.5" y1="29.5" x2="173.5" y2="29.5" class="geom-line" />
  <line id="el-seg-AF" data-ref="AF" data-type="segment" x1="18.5" y1="29.5" x2="18.5" y2="129.5" class="geom-line" />
  <line id="el-seg-BE" data-ref="BE" data-type="segment" x1="173.5" y1="29.5" x2="173.5" y2="129.5" class="geom-line" />
  <line id="el-line-FE" data-ref="FE" data-type="line" x1="18.5" y1="129.5" x2="173.5" y2="129.5" class="geom-line" />

  <!-- Divider CD (Square side) -->
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="71.5" y1="29.5" x2="71.5" y2="129.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="18.5" cy="29.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="71.5" cy="29.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="173.5" cy="29.5" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="18.5" cy="129.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="71.5" cy="129.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="173.5" cy="129.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="18.5" y="21" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-C" data-ref="C" x="71.5" y="21" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-B" data-ref="B" x="173.5" y="21" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-F" data-ref="F" x="18.5" y="144" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-D" data-ref="D" x="71.5" y="144" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-E" data-ref="E" x="173.5" y="144" text-anchor="middle" class="geom-label">E</text>
</svg>