    <polygon id="el-rect-ACDF" data-ref="&lt; A C D F &gt;" data-aliases="&lt; A D &gt; | &lt; D A &gt; | &lt; C F &gt; | &lt; F C &gt; | &lt; A F D C &gt;" data-type="polygon" points="18.5,29.5 71.5,29.5 71.5,129.5 18.5,129.5" class="geom-polygon" />
    <polygon id="el-sq-CDEB" data-ref="&lt; C D E B &gt;" data-aliases="&lt; C E &gt; | &lt; E C &gt; | &lt; D B &gt; | &lt; B D &gt; | &lt; C B E D &gt;" data-type="polygon" points="71.5,29.5 71.5,129.5 173.5,129.5 173.5,29.5" class="geom-polygon" />

