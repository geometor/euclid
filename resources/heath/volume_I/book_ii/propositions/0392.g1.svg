    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A / | / A C B /" data-type="segment" x1="18.5" y1="29.5" x2="173.5" y2="29.5" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="18.5" y1="29.5" x2="71.5" y2="29.5" class="geom-line" />
