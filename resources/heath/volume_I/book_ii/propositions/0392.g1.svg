    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="71.5" y1="29.5" x2="71.5" y2="129.5" class="geom-line geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" x1="173.5" y1="29.5" x2="173.5" y2="129.5" class="geom-line geom-overlay" />
  </g>

