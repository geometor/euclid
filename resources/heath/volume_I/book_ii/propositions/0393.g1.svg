<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 199 198" width="199" height="198" class="euclid-graphic" data-folio="0393" data-graphic="g1" data-proposition="II.4">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Sub-figures: Two squares and two complement rectangles -->
  <!-- Square on AC: HF (top-left) -->
  <polygon id="el-square-HF" data-ref="HF" data-type="polygon" points="28.5,75.5 124.5,75.5 124.5,171.5 28.5,171.5" class="geom-polygon" />
  <!-- Square on CB: BK (top-right) -->
  <polygon id="el-square-BK" data-ref="BK" data-type="polygon" points="124.5,29.5 170.5,29.5 170.5,75.5 124.5,75.5" class="geom-polygon" />
  <!-- Rectangle AG (top-left complement) -->
  <polygon id="el-rect-AG" data-ref="AG" data-type="polygon" points="28.5,29.5 124.5,29.5 124.5,75.5 28.5,75.5" class="geom-polygon" />
  <!-- Rectangle GE (bottom-right complement) -->
  <polygon id="el-rect-GE" data-ref="GE" data-type="polygon" points="124.5,75.5 170.5,75.5 170.5,171.5 124.5,171.5" class="geom-polygon" />

  <!-- Outer Square ADEB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="28.5" y1="29.5" x2="170.5" y2="29.5" class="geom-line" />
  <line id="el-seg-BE" data-ref="BE" data-type="segment" x1="170.5" y1="29.5" x2="170.5" y2="171.5" class="geom-line" />
  <line id="el-seg-ED" data-ref="ED" data-type="segment" x1="170.5" y1="171.5" x2="28.5" y2="171.5" class="geom-line" />
  <line id="el-seg-DA" data-ref="DA" data-type="segment" x1="28.5" y1="171.5" x2="28.5" y2="29.5" class="geom-line" />

  <!-- Diagonal BD -->
  <line id="el-seg-BD" data-ref="BD" data-type="segment" x1="170.5" y1="29.5" x2="28.5" y2="171.5" class="geom-line" />

  <!-- Parallel Divider CF -->
  <line id="el-seg-CF" data-ref="CF" data-type="segment" x1="124.5" y1="29.5" x2="124.5" y2="171.5" class="geom-line" />

  <!-- Parallel Divider HK through G -->
  <line id="el-seg-HK" data-ref="HK" data-type="segment" x1="28.5" y1="75.5" x2="170.5" y2="75.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="28.5" cy="29.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="124.5" cy="29.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="170.5" cy="29.5" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="28.5" cy="75.5" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="124.5" cy="75.5" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="170.5" cy="75.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="28.5" cy="171.5" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="124.5" cy="171.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="170.5" cy="171.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="28.5" y="21" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-C" data-ref="C" x="124.5" y="21" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-B" data-ref="B" x="170.5" y="21" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-H" data-ref="H" x="20" y="80" text-anchor="end" class="geom-label">H</text>
  <text id="lbl-G" data-ref="G" x="133" y="88" text-anchor="start" class="geom-label">G</text>
  <text id="lbl-K" data-ref="K" x="179" y="80" text-anchor="start" class="geom-label">K</text>
  <text id="lbl-D" data-ref="D" x="28.5" y="185" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-F" data-ref="F" x="124.5" y="185" text-anchor="middle" class="geom-label">F</text>
  <text id="lbl-E" data-ref="E" x="170.5" y="185" text-anchor="middle" class="geom-label">E</text>
</svg>