<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 45" width="165" height="45" class="euclid-graphic" data-folio="0393" data-graphic="g2" data-proposition="II.4">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Segment AB with internal point C -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="27" y1="24.5" x2="151" y2="24.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="27" cy="24.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="77" cy="24.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="151" cy="24.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="27" y="16" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-C" data-ref="C" x="77" y="16" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-B" data-ref="B" x="151" y="16" text-anchor="middle" class="geom-label">B</text>
</svg>