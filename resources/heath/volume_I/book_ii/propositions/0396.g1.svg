<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 323 192" width="323" height="192" class="euclid-graphic" data-folio="0396" data-graphic="g1" data-proposition="II.5">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-arc-dotted {
      stroke: #000000;
      stroke-width: 1.5;
      stroke-dasharray: 3 3;
      fill: none;
    }
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Sub-figures -->
  <!-- Square on CD: LH -->
  <polygon id="el-square-LH" data-ref="LH" data-type="polygon" points="157.5,126.5 196.5,126.5 196.5,166.5 157.5,166.5" class="geom-polygon" />
  <!-- Gnomon NOP (wrapping around LH in square CEFB) -->
  <polygon id="el-gnomon-NOP" data-ref="NOP" data-type="polygon" points="157.5,28.5 294.5,28.5 294.5,166.5 196.5,166.5 196.5,126.5 157.5,126.5" class="geom-polygon" />
  <!-- Rectangle AL -->
  <polygon id="el-rect-AL" data-ref="AL" data-type="polygon" points="20.5,28.5 157.5,28.5 157.5,126.5 20.5,126.5" class="geom-polygon" />

  <!-- Main Construction Lines -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="20.5" y1="28.5" x2="294.5" y2="28.5" class="geom-line" />
  <line id="el-seg-KM" data-ref="KM" data-type="segment" x1="20.5" y1="126.5" x2="294.5" y2="126.5" class="geom-line" />
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="157.5" y1="166.5" x2="294.5" y2="166.5" class="geom-line" />

  <line id="el-seg-AK" data-ref="AK" data-type="segment" x1="20.5" y1="28.5" x2="20.5" y2="126.5" class="geom-line" />
  <line id="el-seg-CE" data-ref="CE" data-type="segment" x1="157.5" y1="28.5" x2="157.5" y2="166.5" class="geom-line" />
  <line id="el-seg-DG" data-ref="DG" data-type="segment" x1="196.5" y1="28.5" x2="196.5" y2="166.5" class="geom-line" />
  <line id="el-seg-BF" data-ref="BF" data-type="segment" x1="294.5" y1="28.5" x2="294.5" y2="166.5" class="geom-line" />

  <!-- Diagonal BE -->
  <line id="el-seg-BE" data-ref="BE" data-type="segment" x1="294.5" y1="28.5" x2="157.5" y2="166.5" class="geom-line" />

  <!-- Gnomon Dotted Arc connecting N, O, P -->
  <path id="el-arc-NOP" data-ref="NOP_arc" d="M 177,75 Q 175,145 245,145" class="geom-arc-dotted" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="20.5" cy="28.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="157.5" cy="28.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="196.5" cy="28.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="294.5" cy="28.5" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="20.5" cy="126.5" r="3.5" class="geom-point" />
  <circle id="el-pt-L" data-ref="L" data-type="point" cx="157.5" cy="126.5" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="196.5" cy="126.5" r="3.5" class="geom-point" />
  <circle id="el-pt-M" data-ref="M" data-type="point" cx="294.5" cy="126.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="157.5" cy="166.5" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="196.5" cy="166.5" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="294.5" cy="166.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="20.5" y="20" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-C" data-ref="C" x="157.5" y="20" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="196.5" y="20" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-B" data-ref="B" x="294.5" y="20" text-anchor="middle" class="geom-label">B</text>

  <text id="lbl-K" data-ref="K" x="12" y="131" text-anchor="end" class="geom-label">K</text>
  <text id="lbl-L" data-ref="L" x="152" y="122" text-anchor="end" class="geom-label">L</text>
  <text id="lbl-H" data-ref="H" x="190" y="122" text-anchor="end" class="geom-label">H</text>
  <text id="lbl-M" data-ref="M" x="303" y="131" text-anchor="start" class="geom-label">M</text>

  <text id="lbl-E" data-ref="E" x="157.5" y="180" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-G" data-ref="G" x="196.5" y="180" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-F" data-ref="F" x="294.5" y="180" text-anchor="middle" class="geom-label">F</text>

  <!-- Gnomon Letter Labels N, O, P -->
  <text id="lbl-N" data-ref="NOP" x="177" y="70" text-anchor="middle" class="geom-label">N</text>
  <text id="lbl-O" data-ref="NOP" x="175" y="152" text-anchor="middle" class="geom-label">O</text>
  <text id="lbl-P" data-ref="NOP" x="245" y="152" text-anchor="middle" class="geom-label">P</text>
</svg>