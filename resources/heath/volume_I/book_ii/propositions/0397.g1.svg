    <text id="lbl-C" data-ref="C" x="157.0" y="25.0" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="233.0" y="25.0" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-B" data-ref="B" x="276.0" y="25.0" text-anchor="middle" class="geom-label">B</text>
