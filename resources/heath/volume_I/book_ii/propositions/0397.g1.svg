    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /;/ A C D B /" data-type="segment" x1="38.0" y1="35.5" x2="276.0" y2="35.5" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="38.0" y1="35.5" x2="157.0" y2="35.5" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="157.0" y1="35.5" x2="233.0" y2="35.5" class="geom-line" />
    <line id="el-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" data-type="segment" x1="233.0" y1="35.5" x2="276.0" y2="35.5" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /;/ A C D /" data-type="segment" x1="38.0" y1="35.5" x2="233.0" y2="35.5" class="geom-line" />
    <line id="el-seg-CB" data-ref="/ C B /" data-aliases="/ B C /;/ C D B /" data-type="segment" x1="157.0" y1="35.5" x2="276.0" y2="35.5" class="geom-line" />

