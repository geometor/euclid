<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 305 95" width="305" height="95" class="euclid-graphic" data-folio="0397" data-graphic="g1" data-proposition="II.5">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Top Line: Proposition 5 line AB bisected at C, cut at D -->
  <line id="el-line-top" data-ref="top_line" data-type="segment" x1="38" y1="35.5" x2="276" y2="35.5" class="geom-line" />
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="38" cy="35.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="157" cy="35.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="233" cy="35.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="276" cy="35.5" r="3.5" class="geom-point" />

  <!-- Top Line Labels -->
  <text id="lbl-A" data-ref="A" x="38" y="25" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-C" data-ref="C" x="157" y="25" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="233" y="25" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-B" data-ref="B" x="276" y="25" text-anchor="middle" class="geom-label">B</text>

  <!-- Bottom Line: Proposition 6 line A'B' bisected at C', produced to D' -->
  <line id="el-line-bot" data-ref="bot_line" data-type="segment" x1="81" y1="65.5" x2="276" y2="65.5" class="geom-line" />
  <circle id="el-pt-Ap" data-ref="Ap" data-type="point" cx="81" cy="65.5" r="3.5" class="geom-point" />
  <circle id="el-pt-Cp" data-ref="Cp" data-type="point" cx="157" cy="65.5" r="3.5" class="geom-point" />
  <circle id="el-pt-Bp" data-ref="Bp" data-type="point" cx="233" cy="65.5" r="3.5" class="geom-point" />
  <circle id="el-pt-Dp" data-ref="Dp" data-type="point" cx="276" cy="65.5" r="3.5" class="geom-point" />

  <!-- Bottom Line Labels -->
  <text id="lbl-Ap" data-ref="Ap" x="81" y="56" text-anchor="middle" class="geom-label">A′</text>
  <text id="lbl-Cp" data-ref="Cp" x="157" y="56" text-anchor="middle" class="geom-label">C′</text>
  <text id="lbl-Bp" data-ref="Bp" x="233" y="56" text-anchor="middle" class="geom-label">B′</text>
  <text id="lbl-Dp" data-ref="Dp" x="276" y="56" text-anchor="middle" class="geom-label">D′</text>
</svg>