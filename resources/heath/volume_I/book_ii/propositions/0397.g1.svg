    <line id="el-seg-ApCp" data-ref="/ A' C' /" data-aliases="/ C' A' /" data-type="segment" x1="81.0" y1="65.5" x2="157.0" y2="65.5" class="geom-line" />
    <line id="el-seg-CpBp" data-ref="/ C' B' /" data-aliases="/ B' C' /" data-type="segment" x1="157.0" y1="65.5" x2="233.0" y2="65.5" class="geom-line" />
