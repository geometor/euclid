    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="157.0" y1="35.5" x2="233.0" y2="35.5" class="geom-line geom-overlay" />
    <line id="hl-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" x1="233.0" y1="35.5" x2="276.0" y2="35.5" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /;/ A C D /" x1="38.0" y1="35.5" x2="233.0" y2="35.5" class="geom-line geom-overlay" />
    <line id="hl-seg-CB" data-ref="/ C B /" data-aliases="/ B C /;/ C D B /" x1="157.0" y1="35.5" x2="276.0" y2="35.5" class="geom-line geom-overlay" />
