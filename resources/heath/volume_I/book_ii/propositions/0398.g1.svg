<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 152" width="232" height="152" class="euclid-graphic" data-graphic-id="0398.g1" data-folio="0398" data-graphic="g1" data-proposition="II.5">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circular Arc E-N-D and Extended Lines) -->
  <g id="elements">
    <!-- Circular arc with centre O (115.5, 125.0) and radius ON = 97 passing through E (70.5, 39.5), N (115.5, 28.0), D (160.5, 39.5) -->
    <path id="el-cir-OND" data-ref="( O N )" data-aliases="( E N D )" data-type="circle" d="M 70.5 39.5 A 97 97 0 0 1 160.5 39.5" class="geom-arc" />
    <!-- Tick mark at centre O on vertical line CP -->
    <line id="el-tick-O" data-ref="O" x1="112.0" y1="125.0" x2="119.0" y2="125.0" class="geom-line" />

    <line id="el-line-AB" data-ref="[ A B ]" data-aliases="/ A E C D B /" data-type="line" x1="18.5" y1="39.5" x2="212.5" y2="39.5" class="geom-line" />
    <line id="el-line-KM" data-ref="[ K M ]" data-aliases="/ K L H M /" data-type="line" x1="18.5" y1="91.5" x2="212.5" y2="91.5" class="geom-line" />
    <line id="el-line-PQ" data-ref="[ P Q ]" data-aliases="/ P G Q /" data-type="line" x1="115.5" y1="136.5" x2="212.5" y2="136.5" class="geom-line" />
    <line id="el-line-NP" data-ref="[ N P ]" data-aliases="/ N C O P /" data-type="line" x1="115.5" y1="28.0" x2="115.5" y2="136.5" class="geom-line" />
    <line id="el-line-DG" data-ref="[ D G ]" data-aliases="/ D H G /" data-type="line" x1="160.5" y1="39.5" x2="160.5" y2="136.5" class="geom-line" />
    <line id="el-line-BP" data-ref="[ B P ]" data-aliases="/ B H P /" data-type="line" x1="212.5" y1="39.5" x2="115.5" y2="136.5" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Polygons and Segments) -->
  <g id="graphics">
    <!-- Rectangle AH (ADHK) and Right Triangle OCD -->
    <polygon id="el-rect-ADHK" data-ref="&lt; A D H K &gt;" data-aliases="&lt; A H &gt;;&lt; H A &gt;" data-type="polygon" points="18.5,39.5 160.5,39.5 160.5,91.5 18.5,91.5" class="geom-polygon" />
    <polygon id="el-tri-OCD" data-ref="&lt; O C D &gt;" data-aliases="&lt; C O D &gt;;&lt; D C O &gt;" data-type="polygon" points="115.5,125.0 115.5,39.5 160.5,39.5" class="geom-polygon" />
    <polygon id="el-sq-CPQB" data-ref="&lt; C P Q B &gt;" data-aliases="&lt; C Q &gt;;&lt; B P &gt;" data-type="polygon" points="115.5,39.5 115.5,136.5 212.5,136.5 212.5,39.5" class="geom-polygon" />

    <!-- Top Line AB and sub-segments AC, CB, AD, DB, CD, AE, EB, EC, ED -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /;/ A E C D B /" data-type="segment" x1="18.5" y1="39.5" x2="212.5" y2="39.5" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /;/ A E C /" data-type="segment" x1="18.5" y1="39.5" x2="115.5" y2="39.5" class="geom-line" />
    <line id="el-seg-CB" data-ref="/ C B /" data-aliases="/ B C /;/ C D B /" data-type="segment" x1="115.5" y1="39.5" x2="212.5" y2="39.5" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /;/ A C D /" data-type="segment" x1="18.5" y1="39.5" x2="160.5" y2="39.5" class="geom-line" />
    <line id="el-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" data-type="segment" x1="160.5" y1="39.5" x2="212.5" y2="39.5" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="115.5" y1="39.5" x2="160.5" y2="39.5" class="geom-line" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="18.5" y1="39.5" x2="70.5" y2="39.5" class="geom-line" />
    <line id="el-seg-EB" data-ref="/ B E /" data-aliases="/ E B /;/ E C D B /" data-type="segment" x1="70.5" y1="39.5" x2="212.5" y2="39.5" class="geom-line" />
    <line id="el-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" data-type="segment" x1="70.5" y1="39.5" x2="115.5" y2="39.5" class="geom-line" />
