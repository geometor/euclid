  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="18.5" cy="39.5" r="3" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="70.5" cy="39.5" r="3" class="geom-point" />
