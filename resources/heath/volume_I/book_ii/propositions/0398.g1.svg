    <circle id="el-pt-N" data-ref="N" data-type="point" cx="115.5" cy="28.0" r="3" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="160.5" cy="39.5" r="3" class="geom-point" />
