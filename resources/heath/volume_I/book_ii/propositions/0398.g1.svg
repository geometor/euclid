  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="18.5" y="34.0" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-E" data-ref="E" x="68.0" y="32.0" text-anchor="middle" class="geom-label">(E)</text>
    <text id="lbl-N" data-ref="N" x="115.5" y="23.0" text-anchor="middle" class="geom-label">N</text>
    <text id="lbl-C" data-ref="C" x="107.0" y="53.0" text-anchor="middle" class="geom-label">C</text>
