    <line id="el-seg-ON" data-ref="/ O N /" data-aliases="/ N O /;/ O C N /" data-type="segment" x1="115.5" y1="125.0" x2="115.5" y2="28.0" class="geom-line" />
    <line id="el-seg-NC" data-ref="/ N C /" data-aliases="/ C N /" data-type="segment" x1="115.5" y1="28.0" x2="115.5" y2="39.5" class="geom-line" />
    <line id="el-seg-CP" data-ref="/ C P /" data-aliases="/ P C /" data-type="segment" x1="115.5" y1="39.5" x2="115.5" y2="136.5" class="geom-line" />

    <!-- Radius OD -->
    <line id="el-seg-OD" data-ref="/ O D /" data-aliases="/ D O /" data-type="segment" x1="115.5" y1="125.0" x2="160.5" y2="39.5" class="geom-line" />

    <!-- Other segments of the square and rectangle -->
    <line id="el-seg-AK" data-ref="/ A K /" data-aliases="/ K A /" data-type="segment" x1="18.5" y1="39.5" x2="18.5" y2="91.5" class="geom-line" />
    <line id="el-seg-DH" data-ref="/ D H /" data-aliases="/ H D /" data-type="segment" x1="160.5" y1="39.5" x2="160.5" y2="91.5" class="geom-line" />
    <line id="el-seg-DG" data-ref="/ D G /" data-aliases="/ G D /" data-type="segment" x1="160.5" y1="39.5" x2="160.5" y2="136.5" class="geom-line" />
    <line id="el-seg-BQ" data-ref="/ B Q /" data-aliases="/ Q B /" data-type="segment" x1="212.5" y1="39.5" x2="212.5" y2="136.5" class="geom-line" />
    <line id="el-seg-KM" data-ref="/ K M /" data-aliases="/ M K /" data-type="segment" x1="18.5" y1="91.5" x2="212.5" y2="91.5" class="geom-line" />
    <line id="el-seg-PQ" data-ref="/ P Q /" data-aliases="/ Q P /" data-type="segment" x1="115.5" y1="136.5" x2="212.5" y2="136.5" class="geom-line" />
