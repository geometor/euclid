    <path id="hl-cir-OND" data-ref="( O N )" data-aliases="( E N D )" d="M 70.5 39.5 A 97 97 0 0 1 160.5 39.5" class="geom-arc geom-overlay" />
    <polygon id="hl-rect-ADHK" data-ref="&lt; A D H K &gt;" data-aliases="&lt; A H &gt;;&lt; H A &gt;" points="18.5,39.5 160.5,39.5 160.5,91.5 18.5,91.5" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-OCD" data-ref="&lt; O C D &gt;" data-aliases="&lt; C O D &gt;;&lt; D C O &gt;" points="115.5,125.0 115.5,39.5 160.5,39.5" class="geom-polygon geom-overlay" />
    <polygon id="hl-sq-CPQB" data-ref="&lt; C P Q B &gt;" data-aliases="&lt; C Q &gt;;&lt; B P &gt;" points="115.5,39.5 115.5,136.5 212.5,136.5 212.5,39.5" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /;/ A E C D B /" x1="18.5" y1="39.5" x2="212.5" y2="39.5" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /;/ A E C /" x1="18.5" y1="39.5" x2="115.5" y2="39.5" class="geom-line geom-overlay" />
    <line id="hl-seg-CB" data-ref="/ C B /" data-aliases="/ B C /;/ C D B /" x1="115.5" y1="39.5" x2="212.5" y2="39.5" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /;/ A C D /" x1="18.5" y1="39.5" x2="160.5" y2="39.5" class="geom-line geom-overlay" />
    <line id="hl-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" x1="160.5" y1="39.5" x2="212.5" y2="39.5" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="115.5" y1="39.5" x2="160.5" y2="39.5" class="geom-line geom-overlay" />
    <line id="hl-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" x1="18.5" y1="39.5" x2="70.5" y2="39.5" class="geom-line geom-overlay" />
    <line id="hl-seg-EB" data-ref="/ B E /" data-aliases="/ E B /;/ E C D B /" x1="70.5" y1="39.5" x2="212.5" y2="39.5" class="geom-line geom-overlay" />
    <line id="hl-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" x1="70.5" y1="39.5" x2="115.5" y2="39.5" class="geom-line geom-overlay" />
    <line id="hl-seg-ED" data-ref="/ E D /" data-aliases="/ D E /" x1="70.5" y1="39.5" x2="160.5" y2="39.5" class="geom-line geom-overlay" />
    <line id="hl-seg-CO" data-ref="/ C O /" data-aliases="/ O C /" x1="115.5" y1="39.5" x2="115.5" y2="125.0" class="geom-line geom-overlay" />
    <line id="hl-seg-ON" data-ref="/ O N /" data-aliases="/ N O /;/ O C N /" x1="115.5" y1="125.0" x2="115.5" y2="28.0" class="geom-line geom-overlay" />
    <line id="hl-seg-NC" data-ref="/ N C /" data-aliases="/ C N /" x1="115.5" y1="28.0" x2="115.5" y2="39.5" class="geom-line geom-overlay" />
    <line id="hl-seg-OD" data-ref="/ O D /" data-aliases="/ D O /" x1="115.5" y1="125.0" x2="160.5" y2="39.5" class="geom-line geom-overlay" />
