<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 152" width="232" height="152" class="euclid-graphic" data-folio="0398" data-graphic="g1" data-proposition="II.5">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-area-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      font-style: italic;
    }
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Rectangle AH (Area = b^2) -->
  <polygon id="el-rect-AH" data-ref="AH" data-type="polygon" points="18.5,39.5 160.5,39.5 160.5,89.5 18.5,89.5" class="geom-polygon" />
  <!-- Square on DB -->
  <polygon id="el-square-DB" data-ref="sq_DB" data-type="polygon" points="160.5,39.5 210.5,39.5 210.5,89.5 160.5,89.5" class="geom-polygon" />
  <!-- Square on CD -->
  <polygon id="el-square-CD" data-ref="sq_CD" data-type="polygon" points="115.5,89.5 160.5,89.5 160.5,134.5 115.5,134.5" class="geom-polygon" />

  <!-- Horizontal Lines -->
  <line id="el-line-top" data-ref="AB" data-type="segment" x1="18.5" y1="39.5" x2="210.5" y2="39.5" class="geom-line" />
  <line id="el-line-mid" data-ref="mid_line" data-type="segment" x1="18.5" y1="89.5" x2="210.5" y2="89.5" class="geom-line" />
  <line id="el-line-bot" data-ref="bot_line" data-type="segment" x1="115.5" y1="134.5" x2="210.5" y2="134.5" class="geom-line" />

  <!-- Vertical Lines -->
  <line id="el-line-left" data-ref="left_line" data-type="segment" x1="18.5" y1="39.5" x2="18.5" y2="89.5" class="geom-line" />
  <line id="el-line-C" data-ref="line_C" data-type="segment" x1="115.5" y1="39.5" x2="115.5" y2="134.5" class="geom-line" />
  <line id="el-line-D" data-ref="line_D" data-type="segment" x1="160.5" y1="39.5" x2="160.5" y2="134.5" class="geom-line" />
  <line id="el-line-right" data-ref="right_line" data-type="segment" x1="210.5" y1="39.5" x2="210.5" y2="134.5" class="geom-line" />

  <!-- Diagonal in square on DB -->
  <line id="el-diag" data-ref="diag" data-type="line" x1="160.5" y1="89.5" x2="210.5" y2="39.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="18.5" cy="39.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="115.5" cy="39.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="160.5" cy="39.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="210.5" cy="39.5" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="160.5" cy="89.5" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="115.5" cy="134.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="18.5" y="30" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-C" data-ref="C" x="115.5" y="30" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-D" data-ref="D" x="160.5" y="30" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-B" data-ref="B" x="210.5" y="30" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-H" data-ref="H" x="167" y="100" text-anchor="start" class="geom-label">H</text>
  <text id="lbl-K" data-ref="K" x="108" y="142" text-anchor="end" class="geom-label">K</text>

  <!-- Area label b^2 in rectangle AH -->
  <text id="lbl-area-b2" data-ref="AH" x="65" y="69" text-anchor="middle" class="geom-area-label">b²</text>
</svg>