<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 275 193" width="275" height="193" class="euclid-graphic" data-folio="0400" data-graphic="g1" data-proposition="II.6">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-arc-dotted {
      stroke: #000000;
      stroke-width: 1.5;
      stroke-dasharray: 3 3;
      fill: none;
    }
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Sub-figures -->
  <!-- Square on BC: LG -->
  <polygon id="el-square-LG" data-ref="LG" data-type="polygon" points="112.5,68.5 207.5,68.5 207.5,164.5 112.5,164.5" class="geom-polygon" />
  <!-- Gnomon NOP -->
  <polygon id="el-gnomon-NOP" data-ref="NOP" data-type="polygon" points="112.5,29.5 244.5,29.5 244.5,164.5 207.5,164.5 207.5,68.5 112.5,68.5" class="geom-polygon" />
  <!-- Rectangle AL -->
  <polygon id="el-rect-AL" data-ref="AL" data-type="polygon" points="18.5,29.5 112.5,29.5 112.5,68.5 18.5,68.5" class="geom-polygon" />

  <!-- Horizontal Lines -->
  <line id="el-seg-AD" data-ref="AD" data-type="segment" x1="18.5" y1="29.5" x2="244.5" y2="29.5" class="geom-line" />
  <line id="el-seg-KM" data-ref="KM" data-type="segment" x1="18.5" y1="68.5" x2="244.5" y2="68.5" class="geom-line" />
  <line id="el-seg-EF" data-ref="EF" data-type="segment" x1="112.5" y1="164.5" x2="244.5" y2="164.5" class="geom-line" />

  <!-- Vertical Lines -->
  <line id="el-seg-AK" data-ref="AK" data-type="segment" x1="18.5" y1="29.5" x2="18.5" y2="68.5" class="geom-line" />
  <line id="el-seg-CE" data-ref="CE" data-type="segment" x1="112.5" y1="29.5" x2="112.5" y2="164.5" class="geom-line" />
  <line id="el-seg-BG" data-ref="BG" data-type="segment" x1="207.5" y1="29.5" x2="207.5" y2="164.5" class="geom-line" />
  <line id="el-seg-DF" data-ref="DF" data-type="segment" x1="244.5" y1="29.5" x2="244.5" y2="164.5" class="geom-line" />

  <!-- Diagonal DE -->
  <line id="el-seg-DE" data-ref="DE" data-type="segment" x1="244.5" y1="29.5" x2="112.5" y2="164.5" class="geom-line" />

  <!-- Gnomon Dotted Arc -->
  <path id="el-arc-NOP" data-ref="NOP_arc" d="M 160,49 Q 225,50 226,116" class="geom-arc-dotted" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="18.5" cy="29.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="112.5" cy="29.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="207.5" cy="29.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="244.5" cy="29.5" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="18.5" cy="68.5" r="3.5" class="geom-point" />
  <circle id="el-pt-L" data-ref="L" data-type="point" cx="112.5" cy="68.5" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="207.5" cy="68.5" r="3.5" class="geom-point" />
  <circle id="el-pt-M" data-ref="M" data-type="point" cx="244.5" cy="68.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="112.5" cy="164.5" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="207.5" cy="164.5" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="244.5" cy="164.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="18.5" y="21" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-C" data-ref="C" x="112.5" y="21" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-B" data-ref="B" x="207.5" y="21" text-anchor="middle" class="geom-label">B</text>
  <text id="lbl-D" data-ref="D" x="244.5" y="21" text-anchor="middle" class="geom-label">D</text>

  <text id="lbl-K" data-ref="K" x="11" y="73" text-anchor="end" class="geom-label">K</text>
  <text id="lbl-L" data-ref="L" x="107" y="64" text-anchor="end" class="geom-label">L</text>
  <text id="lbl-H" data-ref="H" x="214" y="64" text-anchor="start" class="geom-label">H</text>
  <text id="lbl-M" data-ref="M" x="252" y="73" text-anchor="start" class="geom-label">M</text>

  <text id="lbl-E" data-ref="E" x="112.5" y="178" text-anchor="middle" class="geom-label">E</text>
  <text id="lbl-G" data-ref="G" x="207.5" y="178" text-anchor="middle" class="geom-label">G</text>
  <text id="lbl-F" data-ref="F" x="244.5" y="178" text-anchor="middle" class="geom-label">F</text>

  <!-- Gnomon Letter Labels N, O, P -->
  <text id="lbl-N" data-ref="NOP" x="160" y="44" text-anchor="middle" class="geom-label">N</text>
  <text id="lbl-O" data-ref="NOP" x="232" y="55" text-anchor="middle" class="geom-label">O</text>
  <text id="lbl-P" data-ref="NOP" x="232" y="122" text-anchor="middle" class="geom-label">P</text>
</svg>