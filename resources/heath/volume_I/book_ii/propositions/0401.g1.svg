<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 271 163" width="271" height="163" class="euclid-graphic" data-folio="0401" data-graphic="g1" data-proposition="II.6">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 2;
      fill: none;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Triangles BAE and BFC -->
  <polygon id="el-tri-BAE" data-ref="BAE" data-type="polygon" points="68,134 252,134 116.5,44.5" class="geom-polygon" />
  <polygon id="el-tri-BFC" data-ref="BFC" data-type="polygon" points="206,134 252,134 206,111.5" class="geom-polygon" />

  <!-- Semicircle on AB: Center O(160, 134), Radius 92 -->
  <path id="el-semicircle" data-ref="semicircle" d="M 68,134 A 92,92 0 0,1 252,134" class="geom-circle" />

  <!-- Diameter AB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="68" y1="134" x2="252" y2="134" class="geom-line" />

  <!-- Perpendicular CD: x=206, y from 134 to 54.3 -->
  <line id="el-seg-CD" data-ref="CD" data-type="segment" x1="206" y1="134" x2="206" y2="54.3" class="geom-line" />

  <!-- Line BE (meeting CD at F and circumference at E) -->
  <line id="el-seg-BE" data-ref="BE" data-type="segment" x1="252" y1="134" x2="116.5" y2="44.5" class="geom-line" />

  <!-- Line AE (joined to form right triangle BAE) -->
  <line id="el-seg-AE" data-ref="AE" data-type="segment" x1="68" y1="134" x2="116.5" y2="44.5" class="geom-line" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="68" cy="134" r="3.5" class="geom-point" />
  <circle id="el-pt-O" data-ref="O" data-type="point" cx="160" cy="134" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="206" cy="134" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="252" cy="134" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="206" cy="54.3" r="3.5" class="geom-point" />
  <circle id="el-pt-F" data-ref="F" data-type="point" cx="206" cy="103.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="116.5" cy="44.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="58" y="142" text-anchor="end" class="geom-label">A</text>
  <text id="lbl-O" data-ref="O" x="160" y="148" text-anchor="middle" class="geom-label">O</text>
  <text id="lbl-C" data-ref="C" x="206" y="148" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-B" data-ref="B" x="260" y="142" text-anchor="start" class="geom-label">B</text>
  <text id="lbl-D" data-ref="D" x="206" y="46" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-F" data-ref="F" x="214" y="106" text-anchor="start" class="geom-label">F</text>
  <text id="lbl-E" data-ref="E" x="114" y="36" text-anchor="middle" class="geom-label">E</text>
</svg>