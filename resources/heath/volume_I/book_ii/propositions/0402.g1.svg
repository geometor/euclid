<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197 205" width="197" height="205" class="euclid-graphic" data-folio="0402" data-graphic="g1" data-proposition="II.7">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-arc-dotted {
      stroke: #000000;
      stroke-width: 1.5;
      stroke-dasharray: 3 3;
      fill: none;
    }
    [data-ref]:hover, .highlight {
      stroke: #0284c7 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight {
      fill: #0284c7 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight {
      fill-opacity: 0.22 !important;
      fill: #0284c7 !important;
      stroke: #0284c7 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight {
      r: 5 !important;
      fill: #0284c7 !important;
      stroke: #ffffff !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Sub-figures -->
  <!-- Square on AC: AH -->
  <polygon id="el-square-AH" data-ref="AH" data-type="polygon" points="27,71.5 130,71.5 130,174.5 27,174.5" class="geom-polygon" />
  <!-- Square on CB: CF -->
  <polygon id="el-square-CF" data-ref="CF" data-type="polygon" points="130,30.5 170.5,30.5 170.5,71.5 130,71.5" class="geom-polygon" />
  <!-- Gnomon KLM -->
  <polygon id="el-gnomon-KLM" data-ref="KLM" data-type="polygon" points="27,30.5 170.5,30.5 170.5,174.5 130,174.5 130,71.5 27,71.5" class="geom-polygon" />

  <!-- Outer Square ADEB -->
  <line id="el-seg-AB" data-ref="AB" data-type="segment" x1="27" y1="30.5" x2="170.5" y2="30.5" class="geom-line" />
  <line id="el-seg-BE" data-ref="BE" data-type="segment" x1="170.5" y1="30.5" x2="170.5" y2="174.5" class="geom-line" />
  <line id="el-seg-ED" data-ref="ED" data-type="segment" x1="170.5" y1="174.5" x2="27" y2="174.5" class="geom-line" />
  <line id="el-seg-DA" data-ref="DA" data-type="segment" x1="27" y1="174.5" x2="27" y2="30.5" class="geom-line" />

  <!-- Diagonal BD -->
  <line id="el-seg-BD" data-ref="BD" data-type="segment" x1="170.5" y1="30.5" x2="27" y2="174.5" class="geom-line" />

  <!-- Divider CF parallel to AD -->
  <line id="el-seg-CF" data-ref="CF_line" data-type="segment" x1="130" y1="30.5" x2="130" y2="174.5" class="geom-line" />

  <!-- Divider HK parallel to AB -->
  <line id="el-seg-HK" data-ref="HK" data-type="segment" x1="27" y1="71.5" x2="170.5" y2="71.5" class="geom-line" />

  <!-- Gnomon Dotted Arc connecting K, L, M -->
  <path id="el-arc-KLM" data-ref="KLM_arc" d="M 75,51 Q 150,52 150,125" class="geom-arc-dotted" />

  <!-- Points -->
  <circle id="el-pt-A" data-ref="A" data-type="point" cx="27" cy="30.5" r="3.5" class="geom-point" />
  <circle id="el-pt-C" data-ref="C" data-type="point" cx="130" cy="30.5" r="3.5" class="geom-point" />
  <circle id="el-pt-B" data-ref="B" data-type="point" cx="170.5" cy="30.5" r="3.5" class="geom-point" />
  <circle id="el-pt-H" data-ref="H" data-type="point" cx="27" cy="71.5" r="3.5" class="geom-point" />
  <circle id="el-pt-G" data-ref="G" data-type="point" cx="130" cy="71.5" r="3.5" class="geom-point" />
  <circle id="el-pt-K" data-ref="K" data-type="point" cx="170.5" cy="71.5" r="3.5" class="geom-point" />
  <circle id="el-pt-D" data-ref="D" data-type="point" cx="27" cy="174.5" r="3.5" class="geom-point" />
  <circle id="el-pt-N" data-ref="N" data-type="point" cx="130" cy="174.5" r="3.5" class="geom-point" />
  <circle id="el-pt-E" data-ref="E" data-type="point" cx="170.5" cy="174.5" r="3.5" class="geom-point" />

  <!-- Labels -->
  <text id="lbl-A" data-ref="A" x="27" y="21" text-anchor="middle" class="geom-label">A</text>
  <text id="lbl-C" data-ref="C" x="130" y="21" text-anchor="middle" class="geom-label">C</text>
  <text id="lbl-B" data-ref="B" x="170.5" y="21" text-anchor="middle" class="geom-label">B</text>

  <text id="lbl-H" data-ref="H" x="19" y="76" text-anchor="end" class="geom-label">H</text>
  <text id="lbl-G" data-ref="G" x="124" y="66" text-anchor="end" class="geom-label">G</text>

  <text id="lbl-D" data-ref="D" x="27" y="188" text-anchor="middle" class="geom-label">D</text>
  <text id="lbl-N" data-ref="N" x="130" y="188" text-anchor="middle" class="geom-label">N</text>
  <text id="lbl-E" data-ref="E" x="170.5" y="188" text-anchor="middle" class="geom-label">E</text>

  <!-- Gnomon Letter Labels K, L, M -->
  <text id="lbl-K" data-ref="KLM" x="75" y="47" text-anchor="middle" class="geom-label">K</text>
  <text id="lbl-L" data-ref="KLM" x="156" y="58" text-anchor="middle" class="geom-label">L</text>
  <text id="lbl-M" data-ref="KLM" x="156" y="130" text-anchor="middle" class="geom-label">M</text>
</svg>