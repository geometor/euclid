<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 263" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .gnomon { fill: #000000; fill-opacity: 0.14; stroke: none; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
    g.interactive:hover .gnomon { fill-opacity: 0.25; fill: #0284c7; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Shaded Gnomon STU: whole square minus square OH (OQHE) -->
  <path d="M 30 29 L 232 29 L 232 233 L 152 233 L 152 109 L 30 109 Z" class="gnomon"/>
  <!-- Dashed curve for Gnomon STU -->
  <path d="M 122 72 Q 152 120 220 120" class="dashed"/>
  <!-- Grid Lines -->
  <rect x="30" y="29" width="202" height="204" class="line"/>
  <line x1="30" y1="68" x2="232" y2="68" class="line"/>
  <line x1="30" y1="109" x2="232" y2="109" class="line"/>
  <line x1="152" y1="29" x2="152" y2="233" class="line"/>
  <line x1="191" y1="29" x2="191" y2="233" class="line"/>
  <!-- Diagonal ED -->
  <line x1="30" y1="233" x2="232" y2="29" class="line"/>
  <!-- Points -->
  <circle cx="30" cy="29" r="2" class="point"/>
  <circle cx="152" cy="29" r="2" class="point"/>
  <circle cx="191" cy="29" r="2" class="point"/>
  <circle cx="232" cy="29" r="2" class="point"/>
  <circle cx="30" cy="68" r="2" class="point"/>
  <circle cx="152" cy="68" r="2" class="point"/>
  <circle cx="191" cy="68" r="2" class="point"/>
  <circle cx="232" cy="68" r="2" class="point"/>
  <circle cx="30" cy="109" r="2" class="point"/>
  <circle cx="152" cy="109" r="2" class="point"/>
  <circle cx="191" cy="109" r="2" class="point"/>
  <circle cx="232" cy="109" r="2" class="point"/>
  <circle cx="30" cy="233" r="2" class="point"/>
  <circle cx="152" cy="233" r="2" class="point"/>
  <circle cx="191" cy="233" r="2" class="point"/>
  <circle cx="232" cy="233" r="2" class="point"/>
  <!-- Labels -->
  <text x="30" y="17" class="label">A</text>
  <text x="152" y="17" class="label">C</text>
  <text x="191" y="17" class="label">B</text>
  <text x="232" y="17" class="label">D</text>
  <text x="18" y="68" class="label">M</text>
  <text x="160" y="60" class="label">G</text>
  <text x="200" y="60" class="label">K</text>
  <text x="244" y="68" class="label">N</text>
  <text x="18" y="109" class="label">O</text>
  <text x="160" y="118" class="label">Q</text>
  <text x="201" y="118" class="label">R</text>
