<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 212" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .polygon { fill: #000000; fill-opacity: 0.08; stroke: none; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
    g.interactive:hover .polygon { fill-opacity: 0.18; fill: #0284c7; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Central square PM (square on AC) -->
  <rect x="69" y="70" width="68" height="71" class="polygon"/>
  <!-- Outer Square BEFD -->
  <rect x="26" y="28" width="153" height="155" class="line"/>
  <!-- Internal grid lines -->
  <line x1="26" y1="70" x2="179" y2="70" class="line"/>
  <line x1="26" y1="141" x2="179" y2="141" class="line"/>
  <line x1="69" y1="28" x2="69" y2="183" class="line"/>
  <line x1="137" y1="28" x2="137" y2="183" class="line"/>
  <!-- Points -->
  <circle cx="26" cy="28" r="2" class="point"/>
  <circle cx="69" cy="28" r="2" class="point"/>
  <circle cx="137" cy="28" r="2" class="point"/>
  <circle cx="179" cy="28" r="2" class="point"/>
  <circle cx="69" cy="70" r="2" class="point"/>
  <circle cx="137" cy="70" r="2" class="point"/>
  <circle cx="179" cy="70" r="2" class="point"/>
  <circle cx="26" cy="141" r="2" class="point"/>
  <circle cx="69" cy="141" r="2" class="point"/>
  <circle cx="137" cy="141" r="2" class="point"/>
  <circle cx="26" cy="183" r="2" class="point"/>
  <circle cx="137" cy="183" r="2" class="point"/>
  <circle cx="179" cy="183" r="2" class="point"/>
  <!-- Labels -->
  <text x="26" y="17" class="label">D</text>
  <text x="69" y="17" class="label">A</text>
  <text x="137" y="17" class="label">C</text>
  <text x="179" y="17" class="label">B</text>
  <text x="190" y="70" class="label">G</text>
  <text x="59" y="80" class="label">L</text>
  <text x="147" y="80" class="label">M</text>
  <text x="16" y="141" class="label">K</text>
  <text x="59" y="131" class="label">P</text>
  <text x="147" y="131" class="label">N</text>
  <text x="26" y="195" class="label">F</text>
  <text x="137" y="195" class="label">H</text>
  <text x="179" y="195" class="label">E</text>
</svg>