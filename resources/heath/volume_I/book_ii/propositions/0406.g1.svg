<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 291 185" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Base line AB -->
  <line x1="24" y1="156" x2="268" y2="156" class="line"/>
  <!-- Perpendicular CE -->
  <line x1="146" y1="156" x2="146" y2="34" class="line"/>
  <!-- Slanted lines EA, EB -->
  <line x1="146" y1="34" x2="24" y2="156" class="line"/>
  <line x1="146" y1="34" x2="268" y2="156" class="line"/>
  <!-- Parallel line DF -->
  <line x1="188" y1="156" x2="188" y2="76" class="line"/>
  <!-- Parallel line GF -->
  <line x1="146" y1="76" x2="188" y2="76" class="line"/>
  <!-- Line AF -->
  <line x1="24" y1="156" x2="188" y2="76" class="line"/>
  <!-- Points -->
  <circle cx="24" cy="156" r="2" class="point"/>
  <circle cx="146" cy="156" r="2" class="point"/>
  <circle cx="188" cy="156" r="2" class="point"/>
  <circle cx="268" cy="156" r="2" class="point"/>
  <circle cx="146" cy="34" r="2" class="point"/>
  <circle cx="146" cy="76" r="2" class="point"/>
  <circle cx="188" cy="76" r="2" class="point"/>
  <!-- Labels -->
  <text x="14" y="156" class="label">A</text>
  <text x="146" y="168" class="label">C</text>
  <text x="188" y="168" class="label">D</text>
  <text x="278" y="156" class="label">B</text>
  <text x="146" y="22" class="label">E</text>
  <text x="136" y="76" class="label">G</text>
  <text x="198" y="72" class="label">F</text>
</svg>