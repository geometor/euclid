<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 253 85" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Top Line: Prop 9 (A - C - D - B) -->
  <line x1="15" y1="18" x2="225" y2="18" class="line"/>
  <circle cx="15" cy="18" r="2" class="point"/>
  <circle cx="115" cy="18" r="2" class="point"/>
  <circle cx="160" cy="18" r="2" class="point"/>
  <circle cx="225" cy="18" r="2" class="point"/>
  <text x="15" y="7" class="label">A</text>
  <text x="115" y="7" class="label">C</text>
  <text x="160" y="7" class="label">D</text>
  <text x="225" y="7" class="label">B</text>
  <!-- Bottom Line: Prop 10 (A - C - B - D) -->
  <line x1="80" y1="58" x2="225" y2="58" class="line"/>
  <circle cx="80" cy="58" r="2" class="point"/>
  <circle cx="120" cy="58" r="2" class="point"/>
  <circle cx="160" cy="58" r="2" class="point"/>
  <circle cx="225" cy="58" r="2" class="point"/>
  <text x="80" y="47" class="label">A</text>
  <text x="120" y="47" class="label">C</text>
  <text x="160" y="47" class="label">B</text>
  <text x="225" y="47" class="label">D</text>
</svg>