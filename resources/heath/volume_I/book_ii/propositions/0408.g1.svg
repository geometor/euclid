<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 253 85" width="253" height="85" class="euclid-graphic" data-graphic-id="0408.g1" data-folio="0408" data-graphic="g1" data-proposition="II.9">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circles & Infinite Lines) -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
    <!-- Top Line: Prop. 9 (A - C - D - B) -->
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="15" y1="24" x2="120" y2="24" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="120" y1="24" x2="160" y2="24" class="geom-line" />
    <line id="el-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" data-type="segment" x1="160" y1="24" x2="225" y2="24" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A / | / A C D /" data-type="segment" x1="15" y1="24" x2="160" y2="24" class="geom-line geom-overlay" />
    <line id="el-seg-CB" data-ref="/ C B /" data-aliases="/ B C / | / C D B /" data-type="segment" x1="120" y1="24" x2="225" y2="24" class="geom-line geom-overlay" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A / | / A C B / | / A D B /" data-type="segment" x1="15" y1="24" x2="225" y2="24" class="geom-line geom-overlay" />

    <!-- Bottom Line: Prop. 10 (A' - C' - B' - D') -->
    <line id="el-seg-A2C2" data-ref="/ A' C' /" data-aliases="/ C' A' / | / A C / | / C A /" data-type="segment" x1="80" y1="64" x2="120" y2="64" class="geom-line" />
    <line id="el-seg-C2B2" data-ref="/ C' B' /" data-aliases="/ B' C' / | / C B / | / B C /" data-type="segment" x1="120" y1="64" x2="160" y2="64" class="geom-line" />
    <line id="el-seg-B2D2" data-ref="/ B' D' /" data-aliases="/ D' B' / | / B D / | / D B /" data-type="segment" x1="160" y1="64" x2="225" y2="64" class="geom-line" />
    <line id="el-seg-A2B2" data-ref="/ A' B' /" data-aliases="/ B' A' / | / A B / | / B A /" data-type="segment" x1="80" y1="64" x2="160" y2="64" class="geom-line geom-overlay" />
    <line id="el-seg-C2D2" data-ref="/ C' D' /" data-aliases="/ D' C' / | / C D / | / D C /" data-type="segment" x1="120" y1="64" x2="225" y2="64" class="geom-line geom-overlay" />
    <line id="el-seg-A2D2" data-ref="/ A' D' /" data-aliases="/ D' A' / | / A D / | / D A /" data-type="segment" x1="80" y1="64" x2="225" y2="64" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="15" y1="24" x2="120" y2="24" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="120" y1="24" x2="160" y2="24" class="geom-line geom-overlay" />
    <line id="hl-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" x1="160" y1="24" x2="225" y2="24" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A / | / A C D /" x1="15" y1="24" x2="160" y2="24" class="geom-line geom-overlay" />
    <line id="hl-seg-CB" data-ref="/ C B /" data-aliases="/ B C / | / C D B /" x1="120" y1="24" x2="225" y2="24" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A / | / A C B / | / A D B /" x1="15" y1="24" x2="225" y2="24" class="geom-line geom-overlay" />

    <line id="hl-seg-A2C2" data-ref="/ A' C' /" data-aliases="/ C' A' / | / A C / | / C A /" x1="80" y1="64" x2="120" y2="64" class="geom-line geom-overlay" />
    <line id="hl-seg-C2B2" data-ref="/ C' B' /" data-aliases="/ B' C' / | / C B / | / B C /" x1="120" y1="64" x2="160" y2="64" class="geom-line geom-overlay" />
    <line id="hl-seg-B2D2" data-ref="/ B' D' /" data-aliases="/ D' B' / | / B D / | / D B /" x1="160" y1="64" x2="225" y2="64" class="geom-line geom-overlay" />
    <line id="hl-seg-A2B2" data-ref="/ A' B' /" data-aliases="/ B' A' / | / A B / | / B A /" x1="80" y1="64" x2="160" y2="64" class="geom-line geom-overlay" />
    <line id="hl-seg-C2D2" data-ref="/ C' D' /" data-aliases="/ D' C' / | / C D / | / D C /" x1="120" y1="64" x2="225" y2="64" class="geom-line geom-overlay" />
    <line id="hl-seg-A2D2" data-ref="/ A' D' /" data-aliases="/ D' A' / | / A D / | / D A /" x1="80" y1="64" x2="225" y2="64" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="15" cy="24" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="120" cy="24" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="160" cy="24" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="225" cy="24" r="3.5" class="geom-point" />

    <circle id="el-pt-A2" data-ref="A'" data-aliases="A" data-type="point" cx="80" cy="64" r="3.5" class="geom-point" />
    <circle id="el-pt-C2" data-ref="C'" data-aliases="C" data-type="point" cx="120" cy="64" r="3.5" class="geom-point" />
    <circle id="el-pt-B2" data-ref="B'" data-aliases="B" data-type="point" cx="160" cy="64" r="3.5" class="geom-point" />
    <circle id="el-pt-D2" data-ref="D'" data-aliases="D" data-type="point" cx="225" cy="64" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="15" y="15" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-C" data-ref="C" x="120" y="15" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="160" y="15" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-B" data-ref="B" x="225" y="15" text-anchor="middle" class="geom-label">B</text>

    <text id="lbl-A2" data-ref="A'" data-aliases="A" x="80" y="55" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-C2" data-ref="C'" data-aliases="C" x="120" y="55" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-B2" data-ref="B'" data-aliases="B" x="160" y="55" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-D2" data-ref="D'" data-aliases="D" x="225" y="55" text-anchor="middle" class="geom-label">D</text>
  </g>
</svg>