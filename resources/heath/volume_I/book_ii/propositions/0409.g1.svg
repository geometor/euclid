<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 189" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Base line AD -->
  <line x1="24" y1="115" x2="242" y2="115" class="line"/>
  <!-- Perpendicular CE -->
  <line x1="110" y1="115" x2="110" y2="29" class="line"/>
  <!-- Parallel line EF -->
  <line x1="110" y1="29" x2="242" y2="29" class="line"/>
  <!-- Vertical line FDG -->
  <line x1="242" y1="29" x2="242" y2="161" class="line"/>
  <!-- Diagonal line EBG -->
  <line x1="110" y1="29" x2="242" y2="161" class="line"/>
  <!-- Slanted line EA -->
  <line x1="110" y1="29" x2="24" y2="115" class="line"/>
  <!-- Line AG -->
  <line x1="24" y1="115" x2="242" y2="161" class="line"/>
  <!-- Points -->
  <circle cx="24" cy="115" r="2" class="point"/>
  <circle cx="110" cy="115" r="2" class="point"/>
  <circle cx="196" cy="115" r="2" class="point"/>
  <circle cx="242" cy="115" r="2" class="point"/>
  <circle cx="110" cy="29" r="2" class="point"/>
  <circle cx="242" cy="29" r="2" class="point"/>
  <circle cx="242" cy="161" r="2" class="point"/>
  <!-- Labels -->
  <text x="14" y="115" class="label">A</text>
  <text x="110" y="127" class="label">C</text>
  <text x="194" y="127" class="label">B</text>
  <text x="252" y="115" class="label">D</text>
  <text x="110" y="18" class="label">E</text>
  <text x="252" y="29" class="label">F</text>
  <text x="252" y="161" class="label">G</text>
</svg>