<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 201 220" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Outer Square on AD -->
  <rect x="18" y="38" width="153" height="151" class="line"/>
  <!-- Horizontal internal lines -->
  <line x1="18" y1="68" x2="171" y2="68" class="line"/>
  <line x1="18" y1="128" x2="171" y2="128" class="line"/>
  <!-- Vertical internal lines -->
  <line x1="80" y1="38" x2="80" y2="189" class="line"/>
  <line x1="142" y1="38" x2="142" y2="189" class="line"/>
  <!-- Points -->
  <circle cx="18" cy="38" r="2" class="point"/>
  <circle cx="80" cy="38" r="2" class="point"/>
  <circle cx="142" cy="38" r="2" class="point"/>
  <circle cx="171" cy="38" r="2" class="point"/>
  <circle cx="80" cy="68" r="2" class="point"/>
  <circle cx="171" cy="68" r="2" class="point"/>
  <circle cx="80" cy="128" r="2" class="point"/>
  <circle cx="18" cy="189" r="2" class="point"/>
  <circle cx="171" cy="189" r="2" class="point"/>
  <!-- Labels -->
  <text x="18" y="26" class="label">A</text>
  <text x="80" y="26" class="label">C</text>
  <text x="142" y="26" class="label">B</text>
  <text x="171" y="26" class="label">D</text>
  <text x="71" y="62" class="label">H</text>
  <text x="182" y="68" class="label">G</text>
  <text x="71" y="122" class="label">K</text>
  <text x="18" y="201" class="label">F</text>
  <text x="171" y="201" class="label">E</text>
</svg>