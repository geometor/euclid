<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 183 205" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .polygon { fill: #000000; fill-opacity: 0.08; stroke: none; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
    g.interactive:hover .polygon { fill-opacity: 0.18; fill: #0284c7; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Center square GK (square on CD) -->
  <rect x="47" y="60" width="84" height="84" class="polygon"/>
  <!-- Outer Square ABEF -->
  <rect x="17" y="30" width="144" height="144" class="line"/>
  <!-- Horizontal internal lines -->
  <line x1="17" y1="60" x2="161" y2="60" class="line"/>
  <line x1="17" y1="144" x2="161" y2="144" class="line"/>
  <!-- Vertical internal lines -->
  <line x1="47" y1="30" x2="47" y2="174" class="line"/>
  <line x1="131" y1="30" x2="131" y2="174" class="line"/>
  <!-- Points -->
  <circle cx="17" cy="30" r="2" class="point"/>
  <circle cx="47" cy="30" r="2" class="point"/>
  <circle cx="131" cy="30" r="2" class="point"/>
  <circle cx="161" cy="30" r="2" class="point"/>
  <circle cx="47" cy="60" r="2" class="point"/>
  <circle cx="131" cy="60" r="2" class="point"/>
  <circle cx="47" cy="144" r="2" class="point"/>
  <circle cx="131" cy="144" r="2" class="point"/>
  <circle cx="17" cy="174" r="2" class="point"/>
  <circle cx="161" cy="174" r="2" class="point"/>
  <!-- Labels -->
  <text x="17" y="19" class="label">A</text>
  <text x="47" y="19" class="label">C</text>
  <text x="131" y="19" class="label">D</text>
  <text x="161" y="19" class="label">B</text>
  <text x="57" y="70" class="label">G</text>
  <text x="121" y="70" class="label">H</text>
  <text x="57" y="134" class="label">L</text>
  <text x="121" y="134" class="label">K</text>
  <text x="17" y="185" class="label">F</text>
  <text x="161" y="185" class="label">E</text>
</svg>