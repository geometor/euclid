<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255 45" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Line AB -->
  <line x1="22" y1="14" x2="227" y2="14" class="line"/>
  <!-- Ticks -->
  <line x1="22" y1="9" x2="22" y2="19" class="line"/>
  <line x1="125" y1="9" x2="125" y2="19" class="line"/>
  <line x1="188" y1="9" x2="188" y2="19" class="line"/>
  <line x1="227" y1="9" x2="227" y2="19" class="line"/>
  <!-- Points -->
  <circle cx="22" cy="14" r="2" class="point"/>
  <circle cx="125" cy="14" r="2" class="point"/>
  <circle cx="188" cy="14" r="2" class="point"/>
  <circle cx="227" cy="14" r="2" class="point"/>
  <!-- Labels -->
  <text x="22" y="28" class="label">A</text>
  <text x="125" y="28" class="label">C</text>
  <text x="188" y="28" class="label">D</text>
  <text x="227" y="28" class="label">B</text>
</svg>