    <!-- Sides and Diagonals of Square 1 (on AB) -->
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="20" y1="212" x2="20" y2="178" class="geom-line" />
    <line id="el-seg-EErt" data-ref="/ E E_rt /" data-type="segment" x1="20" y1="178" x2="54" y2="178" class="geom-line" />
    <line id="el-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" data-type="segment" x1="54" y1="212" x2="20" y2="178" class="geom-line" />

