    <line id="hl-seg-GH" data-ref="/ G H /" data-aliases="/ H G /" x1="218" y1="212" x2="334" y2="212" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /;/ A B C /" x1="20" y1="212" x2="88" y2="212" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /;/ B C D /" x1="54" y1="212" x2="136" y2="212" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /;/ A B D /;/ A C D /" x1="20" y1="212" x2="136" y2="212" class="geom-line geom-overlay" />
    <line id="hl-seg-DH" data-ref="/ D H /" data-aliases="/ H D /;/ D G H /" x1="136" y1="212" x2="334" y2="212" class="geom-line geom-overlay" />
    <line id="hl-seg-AH" data-ref="/ A H /" data-aliases="/ H A /" x1="20" y1="212" x2="334" y2="212" class="geom-line geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" x1="54" y1="212" x2="20" y2="178" class="geom-line geom-overlay" />
    <line id="hl-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" x1="136" y1="212" x2="54" y2="130" class="geom-line geom-overlay" />
    <line id="hl-seg-HK" data-ref="/ H K /" data-aliases="/ K H /" x1="334" y1="212" x2="136" y2="14" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="20" cy="212" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="54" cy="212" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="88" cy="212" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="136" cy="212" r="3.5" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="218" cy="212" r="3.5" class="geom-point" />
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="334" cy="212" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="20" cy="178" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="54" cy="130" r="3.5" class="geom-point" />
