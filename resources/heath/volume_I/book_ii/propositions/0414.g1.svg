<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 241" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Base line -->
  <line x1="20" y1="212" x2="380" y2="212" class="line"/>
  <!-- Square 1 on AB -->
  <rect x="20" y="178" width="34" height="34" class="line"/>
  <line x1="20" y1="178" x2="54" y2="212" class="line"/>
  <!-- Square 2 on BD -->
  <rect x="54" y="133" width="79" height="79" class="line"/>
  <line x1="54" y1="133" x2="133" y2="212" class="line"/>
  <!-- Square 3 on DH -->
  <rect x="133" y="18" width="195" height="194" class="line"/>
  <line x1="133" y1="18" x2="328" y2="212" class="line"/>
  <!-- Ticks at C and G -->
  <line x1="87" y1="207" x2="87" y2="217" class="line"/>
  <line x1="214" y1="207" x2="214" y2="217" class="line"/>
  <!-- Points -->
  <circle cx="20" cy="212" r="2" class="point"/>
  <circle cx="54" cy="212" r="2" class="point"/>
  <circle cx="87" cy="212" r="2" class="point"/>
  <circle cx="133" cy="212" r="2" class="point"/>
  <circle cx="214" cy="212" r="2" class="point"/>
  <circle cx="328" cy="212" r="2" class="point"/>
  <circle cx="20" cy="178" r="2" class="point"/>
  <circle cx="54" cy="133" r="2" class="point"/>
  <circle cx="133" cy="18" r="2" class="point"/>
  <circle cx="328" cy="18" r="2" class="point"/>
  <!-- Labels -->
  <text x="20" y="225" class="label">A</text>
  <text x="54" y="225" class="label">B</text>
  <text x="87" y="225" class="label">C</text>
  <text x="133" y="225" class="label">D</text>
  <text x="214" y="225" class="label">G</text>
  <text x="328" y="225" class="label">H</text>
  <text x="12" y="178" class="label">E</text>
  <text x="46" y="133" class="label">F</text>
  <text x="123" y="18" class="label">K</text>
  <text x="337" y="18" class="label">L</text>
</svg>