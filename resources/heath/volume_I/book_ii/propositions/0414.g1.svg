    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /;/ B C D /" data-type="segment" x1="54" y1="212" x2="136" y2="212" class="geom-line geom-overlay" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /;/ A B D /;/ A C D /" data-type="segment" x1="20" y1="212" x2="136" y2="212" class="geom-line geom-overlay" />
    <line id="el-seg-DH" data-ref="/ D H /" data-aliases="/ H D /;/ D G H /" data-type="segment" x1="136" y1="212" x2="334" y2="212" class="geom-line geom-overlay" />
