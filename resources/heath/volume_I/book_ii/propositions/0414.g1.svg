<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 241" width="395" height="241" class="euclid-graphic" data-graphic-id="0414.g1" data-folio="0414" data-graphic="g1" data-proposition="II.10">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Extended Base Line) -->
  <g id="elements">
    <line id="el-line-AH" data-ref="[ A H ]" data-aliases="[ A D ]" data-type="line" x1="20" y1="212" x2="380" y2="212" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Polygons & Segments) -->
  <g id="graphics">
    <!-- Three Squares on AB, BD, DH -->
    <polygon id="el-sq-AB" data-ref="&lt; A B E_rt E &gt;" data-aliases="&lt; A E &gt;;&lt; B E &gt;" data-type="polygon" points="20,212 54,212 54,178 20,178" class="geom-polygon" />
    <polygon id="el-sq-BD" data-ref="&lt; B D F_rt F &gt;" data-aliases="&lt; B F &gt;;&lt; D F &gt;" data-type="polygon" points="54,212 136,212 136,130 54,130" class="geom-polygon" />
    <polygon id="el-sq-DH" data-ref="&lt; D H K_rt K &gt;" data-aliases="&lt; D K &gt;;&lt; H K &gt;" data-type="polygon" points="136,212 334,212 334,14 136,14" class="geom-polygon" />

    <!-- Segments along base line -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="20" y1="212" x2="54" y2="212" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="54" y1="212" x2="88" y2="212" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="88" y1="212" x2="136" y2="212" class="geom-line" />
