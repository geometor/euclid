    <line id="el-seg-BF" data-ref="/ B F /" data-aliases="/ F B /" data-type="segment" x1="54" y1="212" x2="54" y2="130" class="geom-line" />
    <line id="el-seg-FFrt" data-ref="/ F F_rt /" data-type="segment" x1="54" y1="130" x2="136" y2="130" class="geom-line" />
    <line id="el-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" data-type="segment" x1="136" y1="212" x2="54" y2="130" class="geom-line" />

    <!-- Sides and Diagonals of Square 3 (on DH) -->
    <line id="el-seg-DK" data-ref="/ D K /" data-aliases="/ K D /" data-type="segment" x1="136" y1="212" x2="136" y2="14" class="geom-line" />
    <line id="el-seg-KKrt" data-ref="/ K K_rt /" data-type="segment" x1="136" y1="14" x2="334" y2="14" class="geom-line" />
    <line id="el-seg-HKrt" data-ref="/ H K_rt /" data-type="segment" x1="334" y1="212" x2="334" y2="14" class="geom-line" />
    <line id="el-seg-HK" data-ref="/ H K /" data-aliases="/ K H /" data-type="segment" x1="334" y1="212" x2="136" y2="14" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-sq-AB" data-ref="&lt; A B E_rt E &gt;" data-aliases="&lt; A E &gt;;&lt; B E &gt;" points="20,212 54,212 54,178 20,178" class="geom-polygon geom-overlay" />
    <polygon id="hl-sq-BD" data-ref="&lt; B D F_rt F &gt;" data-aliases="&lt; B F &gt;;&lt; D F &gt;" points="54,212 136,212 136,130 54,130" class="geom-polygon geom-overlay" />
    <polygon id="hl-sq-DH" data-ref="&lt; D H K_rt K &gt;" data-aliases="&lt; D K &gt;;&lt; H K &gt;" points="136,212 334,212 334,14 136,14" class="geom-polygon geom-overlay" />

