    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; B A C &gt;;&lt; C B A &gt;" data-type="polygon" points="29,130 73,130 29,86" class="geom-polygon" />
    <polygon id="el-tri-ADE" data-ref="&lt; A D E &gt;" data-aliases="&lt; D A E &gt;;&lt; E A D &gt;" data-type="polygon" points="29,130 135.23,130 29,23.77" class="geom-polygon" />
    <polygon id="el-rect-BCGF" data-ref="&lt; B F G C &gt;" data-aliases="&lt; B C G F &gt;" data-type="polygon" points="73,130 104.11,98.89 60.11,54.89 29,86" class="geom-polygon" />

    <!-- Right angle at A -->
    <path id="el-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; C A B );&lt; D A E );&lt; E A D )" data-type="wedge" d="M 29 130 L 45 130 A 16 16 0 0 0 29 114 Z" class="wedge angle geom-overlay" />

    <!-- Segments along horizontal leg AD -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="29" y1="130" x2="73" y2="130" class="geom-line" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="73" y1="130" x2="135.23" y2="130" class="geom-line" />
