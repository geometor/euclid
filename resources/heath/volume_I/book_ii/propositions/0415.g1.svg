    <line id="hl-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" x1="104.11" y1="98.89" x2="135.23" y2="130" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="135.23" y1="130" x2="29" y2="23.77" class="geom-line geom-overlay" />
    <line id="hl-seg-BF" data-ref="/ B F /" data-aliases="/ F B /" x1="73" y1="130" x2="104.11" y2="98.89" class="geom-line geom-overlay" />
    <line id="hl-seg-CG" data-ref="/ C G /" data-aliases="/ G C /" x1="29" y1="86" x2="60.11" y2="54.89" class="geom-line geom-overlay" />
