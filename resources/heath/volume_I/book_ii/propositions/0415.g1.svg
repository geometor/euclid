    <line id="el-seg-GF" data-ref="/ G F /" data-aliases="/ F G /" data-type="segment" x1="60.11" y1="54.89" x2="104.11" y2="98.89" class="geom-line" />
    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" data-type="segment" x1="104.11" y1="98.89" x2="135.23" y2="130" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="135.23" y1="130" x2="29" y2="23.77" class="geom-line geom-overlay" />

