    <polygon id="hl-tri-ADE" data-ref="&lt; A D E &gt;" data-aliases="&lt; D A E &gt;;&lt; E A D &gt;" points="29,130 135.23,130 29,23.77" class="geom-polygon geom-overlay" />
    <polygon id="hl-rect-BCGF" data-ref="&lt; B F G C &gt;" data-aliases="&lt; B C G F &gt;" points="73,130 104.11,98.89 60.11,54.89 29,86" class="geom-polygon geom-overlay" />

