    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="29" y1="130" x2="29" y2="86" class="geom-line" />
    <line id="el-seg-CE" data-ref="/ C E /" data-aliases="/ E C /" data-type="segment" x1="29" y1="86" x2="29" y2="23.77" class="geom-line" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /;/ A C E /" data-type="segment" x1="29" y1="130" x2="29" y2="23.77" class="geom-line geom-overlay" />

    <!-- Hypotenuse BC and DE with sub-segments EG, GF, FD -->
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="73" y1="130" x2="29" y2="86" class="geom-line" />
