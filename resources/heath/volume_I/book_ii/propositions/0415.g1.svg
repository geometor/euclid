<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 155 189" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Right-angle legs AD and AE -->
  <line x1="29" y1="130" x2="29" y2="23" class="line"/>
  <line x1="29" y1="130" x2="125" y2="130" class="line"/>
  <!-- Hypotenuse DE -->
  <line x1="29" y1="23" x2="125" y2="130" class="line"/>
  <!-- Segment BC -->
  <line x1="29" y1="85" x2="74" y2="130" class="line"/>
  <!-- Perpendicular BF to DE -->
  <line x1="29" y1="85" x2="66" y2="64" class="line"/>
  <!-- Perpendicular CG to DE -->
  <line x1="74" y1="130" x2="102" y2="104" class="line"/>
  <!-- Points -->
  <circle cx="29" cy="130" r="2" class="point"/>
  <circle cx="29" cy="23" r="2" class="point"/>
  <circle cx="125" cy="130" r="2" class="point"/>
  <circle cx="29" cy="85" r="2" class="point"/>
  <circle cx="74" cy="130" r="2" class="point"/>
  <circle cx="66" cy="64" r="2" class="point"/>
  <circle cx="102" cy="104" r="2" class="point"/>
  <!-- Labels -->
  <text x="19" y="139" class="label">A</text>
  <text x="29" y="12" class="label">D</text>
  <text x="19" y="85" class="label">B</text>
  <text x="74" y="142" class="label">C</text>
  <text x="135" y="130" class="label">E</text>
  <text x="66" y="52" class="label">F</text>
  <text x="110" y="96" class="label">G</text>
</svg>