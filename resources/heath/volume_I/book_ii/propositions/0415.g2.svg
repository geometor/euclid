<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 141" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Base line BC -->
  <line x1="18" y1="112" x2="148" y2="112" class="line"/>
  <!-- Sides AB, AC -->
  <line x1="113" y1="23" x2="18" y2="112" class="line"/>
  <line x1="113" y1="23" x2="148" y2="112" class="line"/>
  <!-- Median AD -->
  <line x1="113" y1="23" x2="83" y2="112" class="line"/>
  <!-- Altitude AE -->
  <line x1="113" y1="23" x2="113" y2="112" class="line"/>
  <!-- Points -->
  <circle cx="113" cy="23" r="2" class="point"/>
  <circle cx="18" cy="112" r="2" class="point"/>
  <circle cx="83" cy="112" r="2" class="point"/>
  <circle cx="113" cy="112" r="2" class="point"/>
  <circle cx="148" cy="112" r="2" class="point"/>
  <!-- Labels -->
  <text x="113" y="12" class="label">A</text>
  <text x="10" y="112" class="label">B</text>
  <text x="83" y="124" class="label">D</text>
  <text x="113" y="124" class="label">E</text>
  <text x="156" y="112" class="label">C</text>
</svg>