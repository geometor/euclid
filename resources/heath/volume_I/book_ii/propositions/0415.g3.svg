<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 143" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Base line BE (BC produced to E) -->
  <line x1="28" y1="113" x2="171" y2="113" class="line"/>
  <!-- Sides AB, AC -->
  <line x1="171" y1="38" x2="28" y2="113" class="line"/>
  <line x1="171" y1="38" x2="148" y2="113" class="line"/>
  <!-- Median AD -->
  <line x1="171" y1="38" x2="88" y2="113" class="line"/>
  <!-- Altitude AE -->
  <line x1="171" y1="38" x2="171" y2="113" class="line"/>
  <!-- Points -->
  <circle cx="171" cy="38" r="2" class="point"/>
  <circle cx="28" cy="113" r="2" class="point"/>
  <circle cx="88" cy="113" r="2" class="point"/>
  <circle cx="148" cy="113" r="2" class="point"/>
  <circle cx="171" cy="113" r="2" class="point"/>
  <!-- Labels -->
  <text x="171" y="26" class="label">A</text>
  <text x="18" y="113" class="label">B</text>
  <text x="88" y="125" class="label">D</text>
  <text x="148" y="125" class="label">C</text>
  <text x="181" y="113" class="label">E</text>
</svg>