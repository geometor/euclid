<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 219" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .polygon { fill: #000000; fill-opacity: 0.08; stroke: none; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
    g.interactive:hover .polygon { fill-opacity: 0.18; fill: #0284c7; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Shaded square FH (on AF) -->
  <rect x="27" y="31" width="62" height="62" class="polygon"/>
  <!-- Square ABDC on AB -->
  <rect x="27" y="93" width="100" height="100" class="line"/>
  <!-- CA produced to F -->
  <line x1="27" y1="93" x2="27" y2="31" class="line"/>
  <!-- Square FH top side FG and right side GH produced to K -->
  <line x1="27" y1="31" x2="89" y2="31" class="line"/>
  <line x1="89" y1="31" x2="89" y2="193" class="line"/>
  <!-- Line BE -->
  <line x1="127" y1="93" x2="27" y2="143" class="line"/>
  <!-- Points -->
  <circle cx="27" cy="31" r="2" class="point"/>
  <circle cx="89" cy="31" r="2" class="point"/>
  <circle cx="27" cy="93" r="2" class="point"/>
  <circle cx="89" cy="93" r="2" class="point"/>
  <circle cx="127" cy="93" r="2" class="point"/>
  <circle cx="27" cy="143" r="2" class="point"/>
  <circle cx="27" cy="193" r="2" class="point"/>
  <circle cx="89" cy="193" r="2" class="point"/>
  <circle cx="127" cy="193" r="2" class="point"/>
  <!-- Labels -->
  <text x="17" y="31" class="label">F</text>
  <text x="89" y="21" class="label">G</text>
  <text x="17" y="93" class="label">A</text>
  <text x="98" y="85" class="label">H</text>
  <text x="137" y="93" class="label">B</text>
  <text x="17" y="143" class="label">E</text>
  <text x="17" y="193" class="label">C</text>
  <text x="89" y="205" class="label">K</text>
  <text x="137" y="193" class="label">D</text>
</svg>