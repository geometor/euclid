<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197 157" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Base line DC (CA produced to D) -->
  <line x1="18" y1="129" x2="175" y2="129" class="line"/>
  <!-- Perpendicular BD -->
  <line x1="18" y1="25" x2="18" y2="129" class="line"/>
  <!-- Sides BA, BC -->
  <line x1="18" y1="25" x2="87" y2="129" class="line"/>
  <line x1="18" y1="25" x2="175" y2="129" class="line"/>
  <!-- Points -->
  <circle cx="18" cy="25" r="2" class="point"/>
  <circle cx="18" cy="129" r="2" class="point"/>
  <circle cx="87" cy="129" r="2" class="point"/>
  <circle cx="175" cy="129" r="2" class="point"/>
  <!-- Labels -->
  <text x="18" y="14" class="label">B</text>
  <text x="9" y="132" class="label">D</text>
  <text x="87" y="141" class="label">A</text>
  <text x="183" y="129" class="label">C</text>
</svg>