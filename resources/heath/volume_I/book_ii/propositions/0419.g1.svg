<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 257 317" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .auxiliary { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 13px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Triangle ABC -->
  <polygon points="157,120 82,147 195,147" class="line"/>
  <!-- Square on BC (BCED) -->
  <polygon points="82,147 195,147 195,260 82,260" class="line"/>
  <!-- Square on AB (ABKH) -->
  <polygon points="82,147 157,120 130,45 55,72" class="line"/>
  <!-- Square on CA (CAGF) -->
  <polygon points="195,147 157,120 184,45 222,72" class="line"/>
  <!-- Perpendicular AL produced to P -->
  <line x1="157" y1="120" x2="157" y2="260" class="line"/>
  <!-- Perpendicular BM produced to Q -->
  <line x1="82" y1="147" x2="203" y2="59" class="auxiliary"/>
  <!-- Perpendicular CN produced to R -->
  <line x1="195" y1="147" x2="93" y2="58" class="auxiliary"/>
  <!-- Points -->
  <circle cx="157" cy="120" r="2" class="point"/>
  <circle cx="82" cy="147" r="2" class="point"/>
  <circle cx="195" cy="147" r="2" class="point"/>
  <circle cx="82" cy="260" r="2" class="point"/>
  <circle cx="195" cy="260" r="2" class="point"/>
  <circle cx="157" cy="260" r="2" class="point"/>
  <circle cx="157" cy="147" r="2" class="point"/>
  <circle cx="55" cy="72" r="2" class="point"/>
  <circle cx="130" cy="45" r="2" class="point"/>
  <circle cx="184" cy="45" r="2" class="point"/>
  <circle cx="222" cy="72" r="2" class="point"/>
  <!-- Labels -->
  <text x="157" y="110" class="label">A</text>
  <text x="73" y="147" class="label">B</text>
  <text x="204" y="147" class="label">C</text>
  <text x="73" y="260" class="label">D</text>
  <text x="204" y="260" class="label">E</text>
  <text x="157" y="271" class="label">P</text>
  <text x="164" y="154" class="label">L</text>
  <text x="46" y="72" class="label">K</text>
  <text x="130" y="34" class="label">H</text>
  <text x="184" y="34" class="label">G</text>
  <text x="231" y="72" class="label">F</text>
  <text x="210" y="52" class="label">Q</text>
  <text x="86" y="52" class="label">R</text>
</svg>