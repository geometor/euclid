<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 307 156" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Horizontal line AC -->
  <line x1="95" y1="127" x2="288" y2="127" class="line"/>
  <!-- Perpendicular AD -->
  <line x1="95" y1="127" x2="95" y2="23" class="line"/>
  <!-- Line DC -->
  <line x1="95" y1="23" x2="288" y2="127" class="line"/>
  <!-- Side AB -->
  <line x1="43" y1="34" x2="95" y2="127" class="line"/>
  <!-- Side BC -->
  <line x1="43" y1="34" x2="288" y2="127" class="line"/>
  <!-- Points -->
  <circle cx="95" cy="127" r="2" class="point"/>
  <circle cx="288" cy="127" r="2" class="point"/>
  <circle cx="95" cy="23" r="2" class="point"/>
  <circle cx="43" cy="34" r="2" class="point"/>
  <!-- Labels -->
  <text x="95" y="139" class="label">A</text>
  <text x="298" y="127" class="label">C</text>
  <text x="95" y="13" class="label">D</text>
  <text x="33" y="30" class="label">B</text>
</svg>