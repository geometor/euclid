<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 307 156" width="307" height="156" class="euclid-graphic" data-graphic-id="0419.g2" data-folio="0419" data-graphic="g2" data-proposition="II.12">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active, path.geom-polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Polygons, Angles, Segments) -->
  <g id="graphics">
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; B A C &gt;" data-type="polygon" points="95,127 43,36.93 288,127" class="geom-polygon" />
    <polygon id="el-tri-DAC" data-ref="&lt; D A C &gt;" data-aliases="&lt; A D C &gt;" data-type="polygon" points="95,23 95,127 288,127" class="geom-polygon" />

    <!-- Angles BAC and DAC -->
    <path id="el-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; C A B )" data-type="angle" d="M 95,127 L 85,109.68 A 20,20 0 0,1 115,127 Z" class="geom-polygon" style="fill-opacity: 0;" />
    <path id="el-ang-DAC" data-ref="&lt; D A C )" data-aliases="&lt; C A D )" data-type="angle" d="M 95,127 L 95,111 L 111,111 L 111,127 Z" class="geom-polygon" style="fill-opacity: 0;" />

    <!-- Segments -->
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="95" y1="127" x2="288" y2="127" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="95" y1="127" x2="95" y2="23" class="geom-line" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" data-type="segment" x1="95" y1="23" x2="288" y2="127" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="95" y1="127" x2="43" y2="36.93" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="43" y1="36.93" x2="288" y2="127" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; B A C &gt;" points="95,127 43,36.93 288,127" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-DAC" data-ref="&lt; D A C &gt;" data-aliases="&lt; A D C &gt;" points="95,23 95,127 288,127" class="geom-polygon geom-overlay" />
    <path id="hl-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; C A B )" d="M 95,127 L 85,109.68 A 20,20 0 0,1 115,127 Z" class="geom-polygon geom-overlay" />
    <path id="hl-ang-DAC" data-ref="&lt; D A C )" data-aliases="&lt; C A D )" d="M 95,127 L 95,111 L 111,111 L 111,127 Z" class="geom-polygon geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="95" y1="127" x2="288" y2="127" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="95" y1="127" x2="95" y2="23" class="geom-line geom-overlay" />
    <line id="hl-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" x1="95" y1="23" x2="288" y2="127" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="95" y1="127" x2="43" y2="36.93" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="43" y1="36.93" x2="288" y2="127" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="95" cy="127" r="3" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="288" cy="127" r="3" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="95" cy="23" r="3" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="43" cy="36.93" r="3" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="95" y="140" class="geom-label">A</text>
    <text id="lbl-C" data-ref="C" x="288" y="140" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="95" y="11" class="geom-label">D</text>
    <text id="lbl-B" data-ref="B" x="33" y="34" class="geom-label">B</text>
  </g>
</svg>