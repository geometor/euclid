    <path id="el-ang-ADB" data-ref="&lt; A D B )" data-aliases="&lt; B D A ) &lt; A D C ) &lt; C D A )" data-type="angle" d="M 108,132 L 92,132 L 92,116 L 108,116 Z" class="geom-polygon" style="fill-opacity: 0;" />

