<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 183 159" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Base line CB -->
  <line x1="18" y1="132" x2="164" y2="132" class="line"/>
  <!-- Sides AC, AB -->
  <line x1="108" y1="25" x2="18" y2="132" class="line"/>
  <line x1="108" y1="25" x2="164" y2="132" class="line"/>
  <!-- Perpendicular AD -->
  <line x1="108" y1="25" x2="108" y2="132" class="line"/>
  <!-- Points -->
  <circle cx="108" cy="25" r="2" class="point"/>
  <circle cx="18" cy="132" r="2" class="point"/>
  <circle cx="108" cy="132" r="2" class="point"/>
  <circle cx="164" cy="132" r="2" class="point"/>
  <!-- Labels -->
  <text x="108" y="14" class="label">A</text>
  <text x="9" y="132" class="label">C</text>
  <text x="108" y="144" class="label">D</text>
  <text x="173" y="132" class="label">B</text>
</svg>