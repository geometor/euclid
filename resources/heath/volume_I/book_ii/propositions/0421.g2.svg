<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345 356" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .auxiliary { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Triangle ABC -->
  <polygon points="203,125 125,200 245,200" class="line"/>
  <!-- Square on BC (BCED) -->
  <polygon points="125,200 245,200 245,320 125,320" class="line"/>
  <!-- Square on AB (ABKH) -->
  <polygon points="125,200 203,125 128,47 50,122" class="line"/>
  <!-- Square on CA (CAGF) -->
  <polygon points="245,200 203,125 278,83 320,158" class="line"/>
  <!-- Perpendicular ALP -->
  <line x1="203" y1="125" x2="203" y2="320" class="line"/>
  <!-- Perpendicular BMQ -->
  <line x1="125" y1="200" x2="299" y2="120" class="auxiliary"/>
  <!-- Perpendicular CNR -->
  <line x1="245" y1="200" x2="89" y2="84" class="auxiliary"/>
  <!-- Auxiliary lines KC, AD -->
  <line x1="50" y1="122" x2="245" y2="200" class="auxiliary"/>
  <line x1="203" y1="125" x2="125" y2="320" class="auxiliary"/>
  <!-- Points -->
  <circle cx="203" cy="125" r="2" class="point"/>
  <circle cx="125" cy="200" r="2" class="point"/>
  <circle cx="245" cy="200" r="2" class="point"/>
  <circle cx="125" cy="320" r="2" class="point"/>
  <circle cx="245" cy="320" r="2" class="point"/>
  <circle cx="203" cy="320" r="2" class="point"/>
  <circle cx="203" cy="200" r="2" class="point"/>
  <circle cx="50" cy="122" r="2" class="point"/>
  <circle cx="128" cy="47" r="2" class="point"/>
  <circle cx="278" cy="83" r="2" class="point"/>
  <circle cx="320" cy="158" r="2" class="point"/>
  <!-- Labels -->
  <text x="203" y="112" class="label">A</text>
  <text x="114" y="200" class="label">B</text>
  <text x="256" y="200" class="label">C</text>
  <text x="114" y="320" class="label">D</text>
  <text x="256" y="320" class="label">E</text>
  <text x="203" y="332" class="label">P</text>
  <text x="211" y="208" class="label">L</text>
  <text x="40" y="122" class="label">K</text>
  <text x="128" y="35" class="label">H</text>
  <text x="278" y="71" class="label">G</text>
  <text x="331" y="158" class="label">F</text>
  <text x="307" y="114" class="label">Q</text>
  <text x="81" y="80" class="label">R</text>
</svg>