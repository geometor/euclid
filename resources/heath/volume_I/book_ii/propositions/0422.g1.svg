<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 263 289" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .auxiliary { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 13px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Triangle ABC -->
  <polygon points="166,117 90,146 202,146" class="line"/>
  <!-- Square on BC (BCED) -->
  <polygon points="90,146 202,146 202,258 90,258" class="line"/>
  <!-- Square on AB (ABKH) -->
  <polygon points="90,146 166,117 137,42 61,71" class="line"/>
  <!-- Square on CA (CAGF) -->
  <polygon points="202,146 166,117 195,48 231,77" class="line"/>
  <!-- Perpendicular AL to P -->
  <line x1="166" y1="117" x2="166" y2="258" class="line"/>
  <!-- Perpendicular BM to Q -->
  <line x1="90" y1="146" x2="213" y2="62" class="auxiliary"/>
  <!-- Perpendicular CN to R -->
  <line x1="202" y1="146" x2="99" y2="56" class="auxiliary"/>
  <!-- Points -->
  <circle cx="166" cy="117" r="2" class="point"/>
  <circle cx="90" cy="146" r="2" class="point"/>
  <circle cx="202" cy="146" r="2" class="point"/>
  <circle cx="90" cy="258" r="2" class="point"/>
  <circle cx="202" cy="258" r="2" class="point"/>
  <circle cx="166" cy="258" r="2" class="point"/>
  <circle cx="166" cy="146" r="2" class="point"/>
  <circle cx="61" cy="71" r="2" class="point"/>
  <circle cx="137" cy="42" r="2" class="point"/>
  <circle cx="195" cy="48" r="2" class="point"/>
  <circle cx="231" cy="77" r="2" class="point"/>
  <!-- Labels -->
  <text x="166" y="106" class="label">A</text>
  <text x="81" y="146" class="label">B</text>
  <text x="212" y="146" class="label">C</text>
  <text x="81" y="258" class="label">D</text>
  <text x="212" y="258" class="label">E</text>
  <text x="166" y="270" class="label">P</text>
  <text x="174" y="154" class="label">L</text>
  <text x="51" y="71" class="label">K</text>
  <text x="137" y="32" class="label">H</text>
  <text x="195" y="37" class="label">G</text>
  <text x="241" y="77" class="label">F</text>
  <text x="221" y="55" class="label">Q</text>
  <text x="91" y="50" class="label">R</text>
</svg>