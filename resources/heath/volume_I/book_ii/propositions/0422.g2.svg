<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 154 178" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Base line BC -->
  <line x1="28" y1="151" x2="137" y2="151" class="line"/>
  <!-- Perpendicular BD -->
  <line x1="28" y1="151" x2="28" y2="23" class="line"/>
  <!-- Line DC -->
  <line x1="28" y1="23" x2="137" y2="151" class="line"/>
  <!-- Sides BA, AC -->
  <line x1="28" y1="151" x2="60" y2="26" class="line"/>
  <line x1="60" y1="26" x2="137" y2="151" class="line"/>
  <!-- Points -->
  <circle cx="28" cy="151" r="2" class="point"/>
  <circle cx="137" cy="151" r="2" class="point"/>
  <circle cx="28" cy="23" r="2" class="point"/>
  <circle cx="60" cy="26" r="2" class="point"/>
  <!-- Labels -->
  <text x="20" y="161" class="label">B</text>
  <text x="146" y="151" class="label">C</text>
  <text x="20" y="23" class="label">D</text>
  <text x="60" y="15" class="label">A</text>
</svg>