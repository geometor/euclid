    <polygon id="el-tri-DBC" data-ref="&lt; D B C &gt;" data-type="polygon" points="28,21.97 28,151 137,151" class="geom-polygon" />

    <!-- Angles CBD / DBC and ABC -->
    <path id="el-ang-CBD" data-ref="&lt; C B D )" data-aliases="&lt; D B C )" data-type="angle" d="M 28,151 L 28,135 L 44,135 L 44,151 Z" class="geom-polygon" style="fill-opacity: 0;" />
    <path id="el-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A )" data-type="angle" d="M 28,151 L 32.96,131.63 A 20,20 0 0,1 48,151 Z" class="geom-polygon" style="fill-opacity: 0;" />

    <!-- Segments -->
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="28" y1="151" x2="137" y2="151" class="geom-line" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="28" y1="151" x2="28" y2="21.97" class="geom-line" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" data-type="segment" x1="28" y1="21.97" x2="137" y2="151" class="geom-line" />
    <line id="el-seg-BA" data-ref="/ B A /" data-aliases="/ A B /" data-type="segment" x1="28" y1="151" x2="60" y2="26" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="60" y1="26" x2="137" y2="151" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" points="60,26 28,151 137,151" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-DBC" data-ref="&lt; D B C &gt;" points="28,21.97 28,151 137,151" class="geom-polygon geom-overlay" />
    <path id="hl-ang-CBD" data-ref="&lt; C B D )" data-aliases="&lt; D B C )" d="M 28,151 L 28,135 L 44,135 L 44,151 Z" class="geom-polygon geom-overlay" />
    <path id="hl-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A )" d="M 28,151 L 32.96,131.63 A 20,20 0 0,1 48,151 Z" class="geom-polygon geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="28" y1="151" x2="137" y2="151" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="28" y1="151" x2="28" y2="21.97" class="geom-line geom-overlay" />
    <line id="hl-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" x1="28" y1="21.97" x2="137" y2="151" class="geom-line geom-overlay" />
    <line id="hl-seg-BA" data-ref="/ B A /" data-aliases="/ A B /" x1="28" y1="151" x2="60" y2="26" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="60" y1="26" x2="137" y2="151" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="28" cy="151" r="3" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="137" cy="151" r="3" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="28" cy="21.97" r="3" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="60" cy="26" r="3" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-B" data-ref="B" x="28" y="164" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="144" y="160" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="17" y="21" class="geom-label">D</text>
    <text id="lbl-A" data-ref="A" x="69" y="21" class="geom-label">A</text>
