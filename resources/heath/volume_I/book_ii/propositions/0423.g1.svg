<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 191" width="100%" height="100%">
  <style>
    .background { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .polygon { fill: #000000; fill-opacity: 0.08; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    g.interactive:hover .line { stroke: #0284c7; stroke-width: 2.5; }
    g.interactive:hover .polygon { stroke: #0284c7; stroke-width: 2.5; fill-opacity: 0.18; fill: #0284c7; }
    g.interactive:hover .point { fill: #0284c7; r: 3.5; }
    g.interactive:hover .label { fill: #0284c7; font-weight: bold; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <!-- Given rectilineal figure A -->
  <polygon points="35,95 25,60 45,45 75,55 85,80 60,105" class="polygon"/>
  <text x="54" y="75" class="label">A</text>
  <!-- Rectangle BD (BCDE) -->
  <rect x="190" y="95" width="125" height="37" class="line"/>
  <!-- Line BF (BE produced to F) -->
  <line x1="315" y1="95" x2="352" y2="95" class="line"/>
  <!-- Semicircle BHF on diameter BF, center G(271, 95), radius 81 -->
  <path d="M 190 95 A 81 81 0 0 1 352 95" class="line"/>
  <!-- DE produced to H on semicircle -->
  <line x1="315" y1="95" x2="315" y2="27" class="line"/>
  <!-- Line GH -->
  <line x1="271" y1="95" x2="315" y2="27" class="line"/>
  <!-- Points -->
  <circle cx="190" cy="95" r="2" class="point"/>
  <circle cx="190" cy="132" r="2" class="point"/>
  <circle cx="315" cy="132" r="2" class="point"/>
  <circle cx="315" cy="95" r="2" class="point"/>
  <circle cx="352" cy="95" r="2" class="point"/>
  <circle cx="271" cy="95" r="2" class="point"/>
  <circle cx="315" cy="27" r="2" class="point"/>
  <!-- Labels -->
  <text x="180" y="95" class="label">B</text>
  <text x="180" y="132" class="label">C</text>
  <text x="323" y="135" class="label">D</text>
  <text x="312" y="104" class="label">E</text>
  <text x="360" y="95" class="label">F</text>
  <text x="271" y="106" class="label">G</text>
  <text x="315" y="17" class="label">H</text>
</svg>