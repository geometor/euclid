<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 638 816" width="638" height="816" class="euclid-graphic" data-graphic-id="0003.g1" data-folio="0003" data-graphic="g1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .facsimile-frame { stroke: #cbd5e1; stroke-width: 2; fill: none; }
    .facsimile-bg { fill: #ffffff; }
    .facsimile-img { transition: opacity 0.2s ease; }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.25;
      transition: stroke 0.15s, stroke-width 0.15s, opacity 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      opacity: 0.25;
      transition: stroke 0.15s, stroke-width 0.15s, opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
      opacity: 0.35;
    }
    .geom-label {
      font-size: 13px;
      font-weight: bold;
      fill: #000000;
      opacity: 0;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      opacity: 1 !important;
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      opacity: 1 !important;
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <rect class="facsimile-bg" width="100%" height="100%" />
  <image class="facsimile-img" href="0003.g1.png" x="0" y="0" width="638" height="816" preserveAspectRatio="xMidYMid meet" />
  <rect class="facsimile-frame" x="1" y="1" width="636" height="814" rx="4" />

  <!-- Base Construction Elements (Circle ABCD on the manuscript page) -->
  <g id="elements">
    <circle id="el-cir-ABCD" data-ref="( Z A )" data-aliases="( A B C D )" data-type="circle" cx="512" cy="420" r="95.5" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Chords AC, BD and radius segment ZE) -->
  <g id="graphics">
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="439" y1="359" x2="560" y2="504" class="geom-line" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="439" y1="359" x2="512" y2="445" class="geom-line" />
    <line id="el-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" data-type="segment" x1="512" y1="445" x2="560" y2="504" class="geom-line" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="450" y1="490" x2="595" y2="371" class="geom-line" />
    <line id="el-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" data-type="segment" x1="450" y1="490" x2="512" y2="445" class="geom-line" />
    <line id="el-seg-ED" data-ref="/ E D /" data-aliases="/ D E /" data-type="segment" x1="512" y1="445" x2="595" y2="371" class="geom-line" />
    <line id="el-seg-ZE" data-ref="/ Z E /" data-aliases="/ E Z /" data-type="segment" x1="512" y1="420" x2="512" y2="445" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-cir-ABCD" data-ref="( Z A )" data-aliases="( A B C D )" cx="512" cy="420" r="95.5" class="geom-circle geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="439" y1="359" x2="560" y2="504" class="geom-line geom-overlay" />
    <line id="hl-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" x1="439" y1="359" x2="512" y2="445" class="geom-line geom-overlay" />
    <line id="hl-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" x1="512" y1="445" x2="560" y2="504" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="450" y1="490" x2="595" y2="371" class="geom-line geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" x1="450" y1="490" x2="512" y2="445" class="geom-line geom-overlay" />
    <line id="hl-seg-ED" data-ref="/ E D /" data-aliases="/ D E /" x1="512" y1="445" x2="595" y2="371" class="geom-line geom-overlay" />
    <line id="hl-seg-ZE" data-ref="/ Z E /" data-aliases="/ E Z /" x1="512" y1="420" x2="512" y2="445" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="439" cy="359" r="3" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="450" cy="490" r="3" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="560" cy="504" r="3" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="595" cy="371" r="3" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="512" cy="445" r="3" class="geom-point" />
    <circle id="el-pt-Z" data-ref="Z" data-type="point" cx="512" cy="420" r="3" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="427" y="355" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="440" y="502" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="568" y="514" text-anchor="middle" class="geom-label">Γ</text>
    <text id="lbl-D" data-ref="D" x="604" y="366" text-anchor="middle" class="geom-label">Δ</text>
    <text id="lbl-E" data-ref="E" x="510" y="458" text-anchor="middle" class="geom-label">Ε</text>
    <text id="lbl-Z" data-ref="Z" x="512" y="412" text-anchor="middle" class="geom-label">Ζ</text>
  </g>
</svg>
