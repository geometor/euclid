<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 115" width="100%" height="auto">
<style>
  .label { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  .point { fill: #000000; }
  .line, .circle { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .interactive { cursor: pointer; transition: stroke 0.2s, stroke-width 0.2s; }
  .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  .point-group:hover .point { fill: #0284c7; r: 3.5; }
  .point-group:hover .label { fill: #0284c7; font-weight: bold; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<!-- Circle -->
<g class="interactive" id="circle_K">
  <circle class="circle" cx="61.5" cy="69.5" r="53.0" />
</g>

<!-- Lines -->
<g class="interactive" id="line_DF">
  <line class="line" x1="22.0" y1="16.5" x2="119.0" y2="16.5" />
</g>
<g class="interactive" id="line_KG">
  <line class="line" x1="61.5" y1="69.5" x2="190.0" y2="69.5" />
</g>
<g class="interactive" id="line_KF">
  <line class="line" x1="61.5" y1="69.5" x2="119.0" y2="16.5" />
</g>
<g class="interactive" id="line_BG">
  <line class="line" x1="61.5" y1="16.5" x2="190.0" y2="69.5" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_D">
  <circle class="point" cx="22.0" cy="16.5" r="2.5" />
  <text class="label" x="22.0" y="7.5">D</text>
</g>
<g class="point-group" id="point_B">
  <circle class="point" cx="61.5" cy="16.5" r="2.5" />
  <text class="label" x="61.5" y="7.5">B</text>
</g>
<g class="point-group" id="point_F">
  <circle class="point" cx="119.0" cy="16.5" r="2.5" />
  <text class="label" x="119.0" y="7.5">F</text>
</g>
<g class="point-group" id="point_H">
  <circle class="point" cx="99.5" cy="32.5" r="2.5" />
  <text class="label" x="105.0" y="42.0">H</text>
</g>
<g class="point-group" id="point_K">
  <circle class="point" cx="61.5" cy="69.5" r="2.5" />
  <text class="label" x="61.5" y="80.5">K</text>
</g>
<g class="point-group" id="point_C">
  <circle class="point" cx="114.5" cy="69.5" r="2.5" />
  <text class="label" x="120.0" y="80.5">C</text>
</g>
<g class="point-group" id="point_G">
  <circle class="point" cx="190.0" cy="69.5" r="2.5" />
  <text class="label" x="190.0" y="80.5">G</text>
</g>
</svg>
