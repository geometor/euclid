    <path id="el-ang-BDE" data-ref="&lt; B D E )" data-aliases="&lt; E D B );&lt; C D E )" data-type="wedge" d="M 150.7 181.5 L 156.69 164.53 A 18 18 0 0 1 168.70 181.50 Z" class="wedge angle geom-overlay" />
