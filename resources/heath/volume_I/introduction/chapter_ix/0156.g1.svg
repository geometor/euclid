</g>
<g class="interactive" id="line_AE">
  <line class="line" x1="89.7" y1="44.0" x2="206.0" y2="181.5" />
</g>
<g class="interactive" id="line_CD">
  <line class="line" x1="199.3" y1="44.0" x2="150.7" y2="181.5" />
</g>

<!-- Points and Labels -->
<g class="point-group" id="point_F">
  <circle class="point" cx="7.5" cy="181.5" r="2.5" />
  <text class="label" x="7.5" y="191.0">F</text>
</g>
<g class="point-group" id="point_D">
  <circle class="point" cx="150.7" cy="181.5" r="2.5" />
  <text class="label" x="150.7" y="191.0">D</text>
</g>
<g class="point-group" id="point_E">
