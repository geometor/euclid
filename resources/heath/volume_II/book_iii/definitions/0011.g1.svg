<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 179 148" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="179" height="148" fill="#ffffff"/>

<g id="figure-ABCD" class="interactive">
    <line x1="48" y1="20" x2="15" y2="94" class="geometry"/>
    <line x1="48" y1="20" x2="155" y2="94" class="geometry"/>
    <path d="M 15 94 A 96 96 0 0 0 155 94" class="geometry"/>
</g>
<g id="bisection-and-perpendicular" class="interactive">
    <line x1="15" y1="94" x2="155" y2="94" class="geometry"/>
    <line x1="85" y1="94" x2="85" y2="126" class="geometry"/>
    <line x1="48" y1="20" x2="85" y2="126" class="geometry"/>
</g>
<g id="parallel-and-equalizing-line" class="interactive">
    <line x1="85" y1="94" x2="26" y2="69" class="construction"/>
    <line x1="26" y1="69" x2="85" y2="126" class="geometry"/>
</g>
<g id="points">
    <circle cx="48" cy="20" r="2.5" class="point"/>
    <circle cx="15" cy="94" r="2.5" class="point"/>
    <circle cx="155" cy="94" r="2.5" class="point"/>
    <circle cx="85" cy="94" r="2.5" class="point"/>
    <circle cx="85" cy="126" r="2.5" class="point"/>
    <circle cx="26" cy="69" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="48" y="11" class="label">A</text>
    <text x="8" y="94" class="label">B</text>
    <text x="163" y="94" class="label">D</text>
    <text x="85" y="85" class="label">E</text>
    <text x="85" y="137" class="label">C</text>
    <text x="17" y="66" class="label">F</text>
</g>

</svg>
