<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 208" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="178" height="208" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="89" cy="104" r="70" class="geometry"/>
</g>
<g id="diameter-CE" class="interactive">
    <line x1="89" y1="34" x2="89" y2="174" class="geometry"/>
</g>
<g id="chord-AB" class="interactive">
    <line x1="28" y1="148" x2="150" y2="148" class="geometry"/>
    <polyline points="89,140 97,140 97,148" class="geometry" style="stroke-width: 1;"/>
</g>
<g id="assumed-centre-G" class="interactive">
    <line x1="125" y1="126" x2="28" y2="148" class="construction"/>
    <line x1="125" y1="126" x2="89" y2="148" class="construction"/>
    <line x1="125" y1="126" x2="150" y2="148" class="construction"/>
</g>
<g id="points">
    <circle cx="89" cy="34" r="2.5" class="point"/>
    <circle cx="89" cy="174" r="2.5" class="point"/>
    <circle cx="28" cy="148" r="2.5" class="point"/>
    <circle cx="150" cy="148" r="2.5" class="point"/>
    <circle cx="89" cy="148" r="2.5" class="point"/>
    <circle cx="89" cy="104" r="2.5" class="point"/>
    <circle cx="125" cy="126" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="89" y="21" class="label">C</text>
    <text x="89" y="188" class="label">E</text>
    <text x="18" y="148" class="label">A</text>
    <text x="160" y="148" class="label">B</text>
    <text x="79" y="157" class="label">D</text>
    <text x="78" y="104" class="label">F</text>
    <text x="135" y="123" class="label">G</text>
</g>

</svg>
