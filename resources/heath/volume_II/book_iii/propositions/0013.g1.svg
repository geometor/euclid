<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 183 189" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="183" height="189" fill="#ffffff"/>

<g id="circle" class="interactive">
    <circle cx="96" cy="90" r="72" class="geometry"/>
</g>
<g id="chords" class="interactive">
    <line x1="28" y1="60" x2="96" y2="162" class="geometry"/>
    <line x1="96" y1="162" x2="158" y2="126" class="geometry"/>
</g>
<g id="perpendicular-bisectors" class="interactive">
    <line x1="62" y1="111" x2="96" y2="90" class="geometry"/>
    <line x1="127" y1="144" x2="96" y2="90" class="geometry"/>
</g>
<g id="points">
    <circle cx="28" cy="60" r="2.5" class="point"/>
    <circle cx="96" cy="162" r="2.5" class="point"/>
    <circle cx="158" cy="126" r="2.5" class="point"/>
    <circle cx="62" cy="111" r="2" class="point"/>
    <circle cx="127" cy="144" r="2" class="point"/>
    <circle cx="96" cy="90" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="18" y="56" class="label">A</text>
    <text x="96" y="174" class="label">B</text>
    <text x="168" y="130" class="label">C</text>
    <text x="52" y="118" class="label">D</text>
    <text x="134" y="148" class="label">E</text>
    <text x="96" y="78" class="label">O</text>
</g>

</svg>
