<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 193 197" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="193" height="197" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="102" cy="90" r="76" class="geometry"/>
</g>
<g id="chord-AB" class="interactive">
    <line x1="30" y1="110" x2="60" y2="160" class="geometry"/>
</g>
<g id="outside-arc" class="interactive">
    <path d="M 30 110 Q 20 142 60 160" class="geometry" style="stroke-dasharray: 4, 3;"/>
</g>
<g id="radii-and-transversal" class="interactive">
    <line x1="102" y1="90" x2="30" y2="110" class="geometry"/>
    <line x1="102" y1="90" x2="60" y2="160" class="geometry"/>
    <line x1="102" y1="90" x2="28" y2="142" class="geometry"/>
</g>
<g id="points">
    <circle cx="102" cy="90" r="2.5" class="point"/>
    <circle cx="30" cy="110" r="2.5" class="point"/>
    <circle cx="60" cy="160" r="2.5" class="point"/>
    <circle cx="43" cy="132" r="2" class="point"/>
    <circle cx="28" cy="142" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="102" y="78" class="label">D</text>
    <text x="18" y="105" class="label">A</text>
    <text x="65" y="174" class="label">B</text>
    <text x="168" y="32" class="label">C</text>
    <text x="50" y="130" class="label">F</text>
    <text x="18" y="148" class="label">E</text>
</g>

</svg>
