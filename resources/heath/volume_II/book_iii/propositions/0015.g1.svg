<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 161" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="160" height="161" fill="#ffffff"/>

<g id="circle-arc" class="interactive">
    <circle cx="80" cy="68" r="64" class="geometry"/>
</g>
<g id="chord-AB" class="interactive">
    <line x1="28" y1="122" x2="132" y2="122" class="geometry"/>
</g>
<g id="radii-and-oblique" class="interactive">
    <line x1="80" y1="68" x2="28" y2="122" class="geometry"/>
    <line x1="80" y1="68" x2="132" y2="122" class="geometry"/>
    <line x1="80" y1="68" x2="98" y2="122" class="geometry"/>
</g>
<g id="points">
    <circle cx="80" cy="68" r="2.5" class="point"/>
    <circle cx="28" cy="122" r="2.5" class="point"/>
    <circle cx="132" cy="122" r="2.5" class="point"/>
    <circle cx="98" cy="122" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="80" y="56" class="label">D</text>
    <text x="18" y="122" class="label">A</text>
    <text x="142" y="122" class="label">B</text>
    <text x="98" y="134" class="label">E</text>
</g>

</svg>
