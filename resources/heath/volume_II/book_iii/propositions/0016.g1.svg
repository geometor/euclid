<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 187 211" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="187" height="211" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="93" cy="104" r="76" class="geometry"/>
</g>
<g id="diameter-CD" class="interactive">
    <line x1="93" y1="28" x2="93" y2="180" class="geometry"/>
</g>
<g id="chord-AB" class="interactive">
    <line x1="23" y1="140" x2="163" y2="140" class="geometry"/>
    <polyline points="93,132 85,132 85,140" class="geometry" style="stroke-width: 1;"/>
    <polyline points="93,132 101,132 101,140" class="geometry" style="stroke-width: 1;"/>
</g>
<g id="radii" class="interactive">
    <line x1="93" y1="104" x2="23" y2="140" class="geometry"/>
    <line x1="93" y1="104" x2="163" y2="140" class="geometry"/>
</g>
<g id="points">
    <circle cx="93" cy="28" r="2.5" class="point"/>
    <circle cx="93" cy="180" r="2.5" class="point"/>
    <circle cx="23" cy="140" r="2.5" class="point"/>
    <circle cx="163" cy="140" r="2.5" class="point"/>
    <circle cx="93" cy="140" r="2.5" class="point"/>
    <circle cx="93" cy="104" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="93" y="18" class="label">C</text>
    <text x="93" y="193" class="label">D</text>
    <text x="14" y="140" class="label">A</text>
    <text x="173" y="140" class="label">B</text>
    <text x="105" y="148" class="label">F</text>
    <text x="105" y="98" class="label">E</text>
</g>

</svg>
