    <line id="el-seg-FE" data-ref="/ F E /" data-aliases="/ E F /" data-type="segment" x1="97" y1="89" x2="130.85" y2="116.47" class="geom-line" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="24.56" y1="112" x2="130.85" y2="116.47" class="geom-line geom-overlay" />
    <line id="el-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" data-type="segment" x1="130.85" y1="116.47" x2="167.25" y2="118" class="geom-line geom-overlay" />
    <line id="el-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" data-type="segment" x1="93.8" y1="164.93" x2="130.85" y2="116.47" class="geom-line geom-overlay" />
    <line id="el-seg-ED" data-ref="/ E D /" data-aliases="/ D E /" data-type="segment" x1="130.85" y1="116.47" x2="169.44" y2="66" class="geom-line geom-overlay" />
    <polyline id="el-sec-AEC" data-ref="/ A E C /" data-aliases="/ C E A / | } A E C { | } C E A {" data-type="section" points="24.56,112 130.85,116.47 167.25,118" fill="none" class="geom-line geom-overlay" />
    <polyline id="el-sec-BED" data-ref="/ B E D /" data-aliases="/ D E B / | } B E D { | } D E B {" data-type="section" points="93.8,164.93 130.85,116.47 169.44,66" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circle-ABCD" data-ref="( F A )" data-aliases="( A B C D ) | ( A B C ) | ( B C D ) | ( F B ) | ( F C ) | ( F D )" cx="97" cy="89" r="76" class="geom-circle geom-overlay" />
    <path id="hl-ang-FEA" data-ref="&lt; F E A )" data-aliases="&lt; A E F )" d="M 130.85 116.47 L 118.43 106.39 A 16 16 0 0 0 114.86 115.80 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-FEB" data-ref="&lt; F E B )" data-aliases="&lt; B E F )" d="M 130.85 116.47 L 115.32 103.87 A 20 20 0 0 0 118.70 132.36 Z" class="wedge angle geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="24.56" y1="112" x2="167.25" y2="118" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="93.8" y1="164.93" x2="169.44" y2="66" class="geom-line geom-overlay" />
    <line id="hl-seg-FE" data-ref="/ F E /" data-aliases="/ E F /" x1="97" y1="89" x2="130.85" y2="116.47" class="geom-line geom-overlay" />
    <line id="hl-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" x1="24.56" y1="112" x2="130.85" y2="116.47" class="geom-line geom-overlay" />
    <line id="hl-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" x1="130.85" y1="116.47" x2="167.25" y2="118" class="geom-line geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" x1="93.8" y1="164.93" x2="130.85" y2="116.47" class="geom-line geom-overlay" />
    <line id="hl-seg-ED" data-ref="/ E D /" data-aliases="/ D E /" x1="130.85" y1="116.47" x2="169.44" y2="66" class="geom-line geom-overlay" />
    <polyline id="hl-sec-AEC" data-ref="/ A E C /" data-aliases="/ C E A / | } A E C { | } C E A {" points="24.56,112 130.85,116.47 167.25,118" fill="none" class="geom-line geom-overlay" />
    <polyline id="hl-sec-BED" data-ref="/ B E D /" data-aliases="/ D E B / | } B E D { | } D E B {" points="93.8,164.93 130.85,116.47 169.44,66" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
