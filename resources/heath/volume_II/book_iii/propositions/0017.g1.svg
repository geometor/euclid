<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 193" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="195" height="193" fill="#ffffff"/>

<g id="circle-ABCD" class="interactive">
    <circle cx="97" cy="85" r="74" class="geometry"/>
</g>
<g id="chords" class="interactive">
    <line x1="28" y1="115" x2="171" y2="60" class="geometry"/>
    <line x1="88" y1="168" x2="142" y2="28" class="geometry"/>
</g>
<g id="segment-FE" class="interactive">
    <line x1="97" y1="85" x2="95" y2="115" class="geometry"/>
</g>
<g id="points">
    <circle cx="28" cy="115" r="2.5" class="point"/>
    <circle cx="171" cy="60" r="2.5" class="point"/>
    <circle cx="88" cy="168" r="2.5" class="point"/>
    <circle cx="142" cy="28" r="2.5" class="point"/>
    <circle cx="95" cy="115" r="2.5" class="point"/>
    <circle cx="97" cy="85" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="18" y="115" class="label">A</text>
    <text x="181" y="60" class="label">C</text>
    <text x="88" y="180" class="label">B</text>
    <text x="145" y="18" class="label">D</text>
    <text x="105" y="123" class="label">E</text>
    <text x="97" y="74" class="label">F</text>
</g>

</svg>
