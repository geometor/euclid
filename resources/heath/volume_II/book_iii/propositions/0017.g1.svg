  <g id="elements">
    <circle id="el-circle-ABCD" data-ref="( F A )" data-aliases="( A B C D ) | ( A B C ) | ( B C D ) | ( F B ) | ( F C ) | ( F D )" data-type="circle" cx="97" cy="89" r="76" class="geom-circle" />
  </g>

