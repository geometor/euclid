  <g id="graphics">
    <path id="el-ang-FEA" data-ref="&lt; F E A )" data-aliases="&lt; A E F )" data-type="wedge" d="M 130.85 116.47 L 118.43 106.39 A 16 16 0 0 0 114.86 115.80 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-FEB" data-ref="&lt; F E B )" data-aliases="&lt; B E F )" data-type="wedge" d="M 130.85 116.47 L 115.32 103.87 A 20 20 0 0 0 118.70 132.36 Z" class="wedge angle geom-overlay" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="24.56" y1="112" x2="167.25" y2="118" class="geom-line" />
