<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 193 185" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="193" height="185" fill="#ffffff"/>

<g id="circles" class="interactive">
    <circle cx="102" cy="95" r="70" class="geometry"/>
    <circle cx="76" cy="95" r="60" class="geometry"/>
</g>
<g id="radii-from-assumed-centre" class="interactive">
    <line x1="89" y1="95" x2="89" y2="158" class="geometry"/>
    <line x1="89" y1="95" x2="106" y2="26" class="geometry"/>
</g>
<g id="points">
    <circle cx="89" cy="32" r="2.5" class="point"/>
    <circle cx="89" cy="158" r="2.5" class="point"/>
    <circle cx="89" cy="95" r="2.5" class="point"/>
    <circle cx="102" cy="42" r="2.5" class="point"/>
    <circle cx="106" cy="26" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="89" y="20" class="label">B</text>
    <text x="89" y="171" class="label">C</text>
    <text x="79" y="95" class="label">E</text>
    <text x="112" y="44" class="label">F</text>
    <text x="116" y="22" class="label">G</text>
    <text x="175" y="95" class="label">A</text>
    <text x="14" y="95" class="label">D</text>
</g>

</svg>
