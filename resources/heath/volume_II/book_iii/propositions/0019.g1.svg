<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 215" width="216" height="215" class="euclid-graphic" data-graphic-id="0019.g1" data-folio="0019" data-graphic="g1" data-proposition="III.6">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle, .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <circle id="el-circle-ABC" data-ref="( A B C )" data-aliases="( F B ) | ( F A )" data-type="circle" cx="102" cy="102" r="86" class="geom-circle" />
    <circle id="el-circle-CDE" data-ref="( C D E )" data-aliases="( F E ) | ( F D )" data-type="circle" cx="82.8" cy="87.6" r="62" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
    <line id="el-seg-FC" data-ref="/ F C /" data-aliases="/ C F /" data-type="segment" x1="94" y1="96" x2="33.2" y2="50.4" class="geom-line" />
    <line id="el-seg-FB" data-ref="/ F B /" data-aliases="/ B F /" data-type="segment" x1="94" y1="96" x2="187.07" y2="114.61" class="geom-line" />
    <line id="el-seg-FE" data-ref="/ F E /" data-aliases="/ E F /" data-type="segment" x1="94" y1="96" x2="142.12" y2="105.62" class="geom-line geom-overlay" />
    <line id="el-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" data-type="segment" x1="142.12" y1="105.62" x2="187.07" y2="114.61" class="geom-line geom-overlay" />
    <polyline id="el-sec-FEB" data-ref="/ F E B /" data-aliases="/ B E F / | } F E B { | } B E F {" data-type="section" points="94,96 142.12,105.62 187.07,114.61" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circle-ABC" data-ref="( A B C )" data-aliases="( F B ) | ( F A )" cx="102" cy="102" r="86" class="geom-circle geom-overlay" />
    <circle id="hl-circle-CDE" data-ref="( C D E )" data-aliases="( F E ) | ( F D )" cx="82.8" cy="87.6" r="62" class="geom-circle geom-overlay" />
    <line id="hl-seg-FC" data-ref="/ F C /" data-aliases="/ C F /" x1="94" y1="96" x2="33.2" y2="50.4" class="geom-line geom-overlay" />
    <line id="hl-seg-FB" data-ref="/ F B /" data-aliases="/ B F /" x1="94" y1="96" x2="187.07" y2="114.61" class="geom-line geom-overlay" />
    <line id="hl-seg-FE" data-ref="/ F E /" data-aliases="/ E F /" x1="94" y1="96" x2="142.12" y2="105.62" class="geom-line geom-overlay" />
    <line id="hl-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" x1="142.12" y1="105.62" x2="187.07" y2="114.61" class="geom-line geom-overlay" />
    <polyline id="hl-sec-FEB" data-ref="/ F E B /" data-aliases="/ B E F / | } F E B { | } B E F {" points="94,96 142.12,105.62 187.07,114.61" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="33.2" cy="50.4" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="94" cy="96" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="142.12" cy="105.62" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="187.07" cy="114.61" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="82.8" cy="149.6" r="3.5" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="85" cy="186.3" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-C" data-ref="C" x="24" y="49" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-F" data-ref="F" x="93" y="110" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-E" data-ref="E" x="150" y="102" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-B" data-ref="B" x="197" y="119" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-D" data-ref="D" x="81" y="143" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-A" data-ref="A" x="83" y="201" text-anchor="middle" class="geom-label">A</text>
  </g>
</svg>
