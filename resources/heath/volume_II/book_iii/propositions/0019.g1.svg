<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 215" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="216" height="215" fill="#ffffff"/>

<g id="circles" class="interactive">
    <circle cx="102" cy="100" r="86" class="geometry"/>
    <circle cx="74" cy="82" r="58" class="geometry"/>
</g>
<g id="radii-from-F" class="interactive">
    <line x1="88" y1="100" x2="28" y2="48" class="geometry"/>
    <line x1="88" y1="100" x2="188" y2="110" class="geometry"/>
</g>
<g id="points">
    <circle cx="28" cy="48" r="2.5" class="point"/>
    <circle cx="88" cy="100" r="2.5" class="point"/>
    <circle cx="132" cy="105" r="2.5" class="point"/>
    <circle cx="188" cy="110" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="18" y="42" class="label">C</text>
    <text x="80" y="105" class="label">F</text>
    <text x="136" y="96" class="label">E</text>
    <text x="200" y="112" class="label">B</text>
    <text x="102" y="196" class="label">A</text>
    <text x="74" y="148" class="label">D</text>
</g>

</svg>
