<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 197" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="215" height="197" fill="#ffffff"/>

<g id="circle-ABCD" class="interactive">
    <circle cx="97" cy="100" r="82" class="geometry"/>
</g>
<g id="diameter-AD" class="interactive">
    <line x1="15" y1="100" x2="179" y2="100" class="geometry"/>
</g>
<g id="lines-from-F" class="interactive">
    <line x1="125" y1="100" x2="45" y2="45" class="geometry"/>
    <line x1="125" y1="100" x2="85" y2="20" class="geometry"/>
    <line x1="125" y1="100" x2="145" y2="35" class="geometry"/>
    <line x1="125" y1="100" x2="85" y2="180" class="geometry"/>
    <line x1="125" y1="100" x2="145" y2="165" class="geometry"/>
</g>
<g id="radii-from-E" class="interactive">
    <line x1="97" y1="100" x2="45" y2="45" class="construction"/>
    <line x1="97" y1="100" x2="85" y2="20" class="construction"/>
    <line x1="97" y1="100" x2="145" y2="35" class="construction"/>
    <line x1="97" y1="100" x2="85" y2="180" class="construction"/>
    <line x1="97" y1="100" x2="145" y2="165" class="construction"/>
</g>
<g id="points">
    <circle cx="15" cy="100" r="2.5" class="point"/>
    <circle cx="179" cy="100" r="2.5" class="point"/>
    <circle cx="97" cy="100" r="2.5" class="point"/>
    <circle cx="125" cy="100" r="2.5" class="point"/>
    <circle cx="45" cy="45" r="2.5" class="point"/>
    <circle cx="85" cy="20" r="2.5" class="point"/>
    <circle cx="145" cy="35" r="2.5" class="point"/>
    <circle cx="85" cy="180" r="2.5" class="point"/>
    <circle cx="145" cy="165" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="8" y="100" class="label">A</text>
    <text x="189" y="100" class="label">D</text>
    <text x="97" y="112" class="label">E</text>
    <text x="125" y="112" class="label">F</text>
    <text x="36" y="42" class="label">B</text>
    <text x="85" y="10" class="label">C</text>
    <text x="153" y="28" class="label">G</text>
    <text x="85" y="191" class="label">H</text>
    <text x="153" y="172" class="label">K</text>
</g>

</svg>
