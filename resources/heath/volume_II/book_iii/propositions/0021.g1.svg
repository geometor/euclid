<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 173 148" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="173" height="148" fill="#ffffff"/>

<g id="circle-arc" class="interactive">
    <circle cx="86" cy="76" r="61" class="geometry"/>
</g>
<g id="diameter-line" class="interactive">
    <line x1="16" y1="76" x2="147" y2="76" class="geometry"/>
</g>
<g id="radii" class="interactive">
    <line x1="86" y1="76" x2="35" y2="30" class="geometry"/>
    <line x1="86" y1="76" x2="25" y2="50" class="geometry"/>
</g>
<g id="line-FB" class="interactive">
    <line x1="107" y1="76" x2="25" y2="50" class="geometry"/>
</g>
<g id="points">
    <circle cx="86" cy="76" r="2.5" class="point"/>
    <circle cx="107" cy="76" r="2.5" class="point"/>
    <circle cx="35" cy="30" r="2.5" class="point"/>
    <circle cx="25" cy="50" r="2.5" class="point"/>
    <circle cx="56" cy="60" r="2" class="point"/>
</g>
<g id="labels">
    <text x="86" y="88" class="label">E</text>
    <text x="109" y="88" class="label">F</text>
    <text x="35" y="19" class="label">C</text>
    <text x="16" y="48" class="label">B</text>
    <text x="61" y="52" class="label">M</text>
</g>

</svg>
