<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 176" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="212" height="176" fill="#ffffff"/>

<g id="circle" class="interactive">
    <circle cx="108" cy="80" r="70" class="geometry"/>
</g>
<g id="lines-from-A" class="interactive">
    <line x1="28" y1="65" x2="178" y2="50" class="geometry"/>
    <line x1="28" y1="65" x2="178" y2="100" class="geometry"/>
</g>
<g id="perpendiculars-from-D" class="interactive">
    <line x1="108" y1="80" x2="104" y2="57" class="geometry"/>
    <line x1="108" y1="80" x2="104" y2="88" class="geometry"/>
    <polyline points="104,63 98,62 98,58" class="geometry" style="stroke-width: 1;"/>
    <polyline points="104,82 98,81 98,87" class="geometry" style="stroke-width: 1;"/>
</g>
<g id="radii" class="interactive">
    <line x1="108" y1="80" x2="178" y2="50" class="construction"/>
    <line x1="108" y1="80" x2="178" y2="100" class="construction"/>
</g>
<g id="points">
    <circle cx="28" cy="65" r="2.5" class="point"/>
    <circle cx="108" cy="80" r="2.5" class="point"/>
    <circle cx="178" cy="50" r="2.5" class="point"/>
    <circle cx="178" cy="100" r="2.5" class="point"/>
    <circle cx="104" cy="57" r="2.5" class="point"/>
    <circle cx="104" cy="88" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="18" y="65" class="label">A</text>
    <text x="108" y="93" class="label">D</text>
    <text x="189" y="47" class="label">E</text>
    <text x="189" y="103" class="label">F</text>
    <text x="104" y="46" class="label">G</text>
    <text x="104" y="100" class="label">H</text>
</g>

</svg>
