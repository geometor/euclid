<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 174" width="195" height="174" class="euclid-graphic" data-graphic-id="0023.g1" data-folio="0023" data-graphic="g1" data-proposition="III.7">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <circle id="el-circle-DB" data-ref="( D B )" data-aliases="( B C E ) | ( C E B ) | ( C B E F )" data-type="circle" cx="98" cy="86" r="70" class="geom-circle" />
    <line id="el-line-CB" data-ref="[ C B ]" data-aliases="[ B C ]" data-type="line" x1="28" y1="86" x2="168" y2="86" class="geom-line geom-overlay" />
    <line id="el-line-FH" data-ref="[ F A ]" data-aliases="[ A F ] | [ F H ]" data-type="line" x1="42" y1="128" x2="59" y2="56.6" class="geom-line" />
  </g>

  <!-- Constructed Graphics -->
  <g id="graphics">
    <!-- Polygons -->
    <polygon id="el-tri-DGE" data-ref="&lt; D G E &gt;" data-type="polygon" points="98,86 81.48,63.93 133,25.38" class="geom-polygon" />
    <polygon id="el-tri-DGA" data-ref="&lt; D G A &gt;" data-type="polygon" points="98,86 81.48,63.93 52,86" class="geom-polygon" />
    <polygon id="el-tri-DHF" data-ref="&lt; D H F &gt;" data-type="polygon" points="98,86 54.47,75.64 42,128" class="geom-polygon" />
    <polygon id="el-tri-DHA" data-ref="&lt; D H A &gt;" data-type="polygon" points="98,86 54.47,75.64 52,86" class="geom-polygon" />

