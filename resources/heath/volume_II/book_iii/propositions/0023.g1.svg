    <line id="el-seg-AG" data-ref="/ A G /" data-aliases="/ G A /" data-type="segment" x1="52" y1="86" x2="81.48" y2="63.93" class="geom-line" />
    <line id="el-seg-GE" data-ref="/ G E /" data-aliases="/ E G /" data-type="segment" x1="81.48" y1="63.93" x2="133" y2="25.38" class="geom-line" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="52" y1="86" x2="133" y2="25.38" class="geom-line geom-overlay" />

