    <line id="el-seg-DG" data-ref="/ D G /" data-aliases="/ G D /" data-type="segment" x1="98" y1="86" x2="81.48" y2="63.93" class="geom-line" />
    <line id="el-seg-DH" data-ref="/ D H /" data-aliases="/ H D /" data-type="segment" x1="98" y1="86" x2="54.47" y2="75.64" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="98" y1="86" x2="133" y2="25.38" class="geom-line" />
    <line id="el-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" data-type="segment" x1="98" y1="86" x2="42" y2="128" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circle-DB" data-ref="( D B )" data-aliases="( B C E ) | ( C E B ) | ( C B E F )" cx="98" cy="86" r="70" class="geom-circle geom-overlay" />
    <polygon id="hl-tri-DGE" data-ref="&lt; D G E &gt;" points="98,86 81.48,63.93 133,25.38" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-DGA" data-ref="&lt; D G A &gt;" points="98,86 81.48,63.93 52,86" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-DHF" data-ref="&lt; D H F &gt;" points="98,86 54.47,75.64 42,128" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-DHA" data-ref="&lt; D H A &gt;" points="98,86 54.47,75.64 52,86" class="geom-polygon geom-overlay" />

