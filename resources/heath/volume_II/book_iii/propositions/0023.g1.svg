    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="52" y1="86" x2="98" y2="86" class="geom-line geom-overlay" />
    <line id="hl-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" x1="98" y1="86" x2="168" y2="86" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="28" y1="86" x2="98" y2="86" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="52" y1="86" x2="168" y2="86" class="geom-line geom-overlay" />
    <line id="hl-seg-CB" data-ref="/ C B /" data-aliases="/ B C /" x1="28" y1="86" x2="168" y2="86" class="geom-line geom-overlay" />

    <line id="hl-seg-AG" data-ref="/ A G /" data-aliases="/ G A /" x1="52" y1="86" x2="81.48" y2="63.93" class="geom-line geom-overlay" />
    <line id="hl-seg-GE" data-ref="/ G E /" data-aliases="/ E G /" x1="81.48" y1="63.93" x2="133" y2="25.38" class="geom-line geom-overlay" />
    <line id="hl-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" x1="52" y1="86" x2="133" y2="25.38" class="geom-line geom-overlay" />

    <line id="hl-seg-AF" data-ref="/ A F /" data-aliases="/ F A /" x1="52" y1="86" x2="42" y2="128" class="geom-line geom-overlay" />
    <line id="hl-seg-AH" data-ref="/ A H /" data-aliases="/ H A /" x1="52" y1="86" x2="54.47" y2="75.64" class="geom-line geom-overlay" />
    <line id="hl-seg-HF" data-ref="/ H F /" data-aliases="/ F H /" x1="54.47" y1="75.64" x2="42" y2="128" class="geom-line geom-overlay" />

    <line id="hl-seg-DG" data-ref="/ D G /" data-aliases="/ G D /" x1="98" y1="86" x2="81.48" y2="63.93" class="geom-line geom-overlay" />
    <line id="hl-seg-DH" data-ref="/ D H /" data-aliases="/ H D /" x1="98" y1="86" x2="54.47" y2="75.64" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="98" y1="86" x2="133" y2="25.38" class="geom-line geom-overlay" />
    <line id="hl-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" x1="98" y1="86" x2="42" y2="128" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="52" cy="86" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="168" cy="86" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="28" cy="86" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="98" cy="86" r="3.5" class="geom-point" />
