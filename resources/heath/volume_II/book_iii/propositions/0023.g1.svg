<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 174" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="195" height="174" fill="#ffffff"/>

<g id="circle" class="interactive">
    <circle cx="98" cy="86" r="70" class="geometry"/>
</g>
<g id="lines-from-A" class="interactive">
    <line x1="38" y1="42" x2="155" y2="45" class="geometry"/>
    <line x1="38" y1="42" x2="101" y2="150" class="geometry"/>
    <line x1="155" y1="45" x2="175" y2="45" class="construction"/>
</g>
<g id="perpendiculars" class="interactive">
    <line x1="98" y1="86" x2="175" y2="45" class="geometry"/>
    <line x1="98" y1="86" x2="68" y2="94" class="geometry"/>
    <polyline points="175,52 168,52 168,45" class="geometry" style="stroke-width: 1;"/>
    <polyline points="68,87 75,87 75,94" class="geometry" style="stroke-width: 1;"/>
</g>
<g id="radii" class="interactive">
    <line x1="98" y1="86" x2="155" y2="45" class="construction"/>
    <line x1="98" y1="86" x2="101" y2="150" class="construction"/>
</g>
<g id="points">
    <circle cx="38" cy="42" r="2.5" class="point"/>
    <circle cx="98" cy="86" r="2.5" class="point"/>
    <circle cx="155" cy="45" r="2.5" class="point"/>
    <circle cx="101" cy="150" r="2.5" class="point"/>
    <circle cx="175" cy="45" r="2.5" class="point"/>
    <circle cx="68" cy="94" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="30" y="42" class="label">A</text>
    <text x="98" y="98" class="label">D</text>
    <text x="155" y="33" class="label">E</text>
    <text x="101" y="162" class="label">F</text>
    <text x="183" y="45" class="label">G</text>
    <text x="60" y="102" class="label">H</text>
</g>

</svg>
