    <line id="el-seg-AH" data-ref="/ A H /" data-aliases="/ H A /" data-type="segment" x1="52" y1="86" x2="54.47" y2="75.64" class="geom-line geom-overlay" />
    <line id="el-seg-HF" data-ref="/ H F /" data-aliases="/ F H /" data-type="segment" x1="54.47" y1="75.64" x2="42" y2="128" class="geom-line geom-overlay" />

