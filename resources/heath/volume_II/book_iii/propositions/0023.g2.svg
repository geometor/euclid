<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 177" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="196" height="177" fill="#ffffff"/>

<g id="circle" class="interactive">
    <circle cx="98" cy="90" r="70" class="geometry"/>
</g>
<g id="lines-from-A" class="interactive">
    <line x1="28" y1="117" x2="103" y2="23" class="geometry"/>
    <line x1="28" y1="117" x2="172" y2="85" class="geometry"/>
</g>
<g id="perpendiculars" class="interactive">
    <line x1="98" y1="90" x2="54" y2="62" class="geometry"/>
    <line x1="98" y1="90" x2="100" y2="101" class="geometry"/>
    <polyline points="54,69 61,69 61,62" class="geometry" style="stroke-width: 1;"/>
    <polyline points="100,95 106,95 106,101" class="geometry" style="stroke-width: 1;"/>
</g>
<g id="radii" class="interactive">
    <line x1="98" y1="90" x2="103" y2="23" class="construction"/>
    <line x1="98" y1="90" x2="172" y2="85" class="construction"/>
</g>
<g id="points">
    <circle cx="28" cy="117" r="2.5" class="point"/>
    <circle cx="98" cy="90" r="2.5" class="point"/>
    <circle cx="103" cy="23" r="2.5" class="point"/>
    <circle cx="172" cy="85" r="2.5" class="point"/>
    <circle cx="54" cy="62" r="2.5" class="point"/>
    <circle cx="100" cy="101" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="18" y="117" class="label">A</text>
    <text x="98" y="80" class="label">D</text>
    <text x="103" y="12" class="label">E</text>
    <text x="183" y="85" class="label">F</text>
    <text x="45" y="58" class="label">G</text>
    <text x="100" y="113" class="label">H</text>
</g>

</svg>
