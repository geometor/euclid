<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 280" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="195" height="280" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="102" cy="176" r="78" class="geometry"/>
</g>
<g id="diameter-line" class="interactive">
    <line x1="102" y1="18" x2="102" y2="254" class="geometry"/>
</g>
<g id="lines-to-upper-arc" class="interactive">
    <line x1="102" y1="18" x2="155" y2="120" class="geometry"/>
    <line x1="102" y1="18" x2="175" y2="150" class="geometry"/>
    <line x1="102" y1="18" x2="180" y2="185" class="geometry"/>
</g>
<g id="lines-to-lower-arc" class="interactive">
    <line x1="102" y1="18" x2="49" y2="120" class="geometry"/>
    <line x1="102" y1="18" x2="29" y2="150" class="geometry"/>
    <line x1="102" y1="18" x2="24" y2="185" class="geometry"/>
</g>
<g id="radii-upper" class="interactive">
    <line x1="102" y1="176" x2="155" y2="120" class="construction"/>
    <line x1="102" y1="176" x2="175" y2="150" class="construction"/>
    <line x1="102" y1="176" x2="180" y2="185" class="construction"/>
</g>
<g id="radii-lower" class="interactive">
    <line x1="102" y1="176" x2="49" y2="120" class="construction"/>
    <line x1="102" y1="176" x2="29" y2="150" class="construction"/>
    <line x1="102" y1="176" x2="24" y2="185" class="construction"/>
</g>
<g id="points">
    <circle cx="102" cy="18" r="2.5" class="point"/>
    <circle cx="102" cy="98" r="2.5" class="point"/>
    <circle cx="102" cy="176" r="2.5" class="point"/>
    <circle cx="102" cy="254" r="2.5" class="point"/>
    <circle cx="155" cy="120" r="2.5" class="point"/>
    <circle cx="175" cy="150" r="2.5" class="point"/>
    <circle cx="180" cy="185" r="2.5" class="point"/>
    <circle cx="49" cy="120" r="2.5" class="point"/>
    <circle cx="29" cy="150" r="2.5" class="point"/>
    <circle cx="24" cy="185" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="102" y="9" class="label">D</text>
    <text x="113" y="100" class="label">G</text>
    <text x="113" y="176" class="label">M</text>
    <text x="102" y="266" class="label">A</text>
    <text x="165" y="116" class="label">C</text>
    <text x="186" y="148" class="label">F</text>
    <text x="191" y="185" class="label">E</text>
    <text x="39" y="116" class="label">K</text>
    <text x="18" y="148" class="label">L</text>
    <text x="14" y="185" class="label">H</text>
    <text x="155" y="235" class="label">B</text>
</g>

</svg>
