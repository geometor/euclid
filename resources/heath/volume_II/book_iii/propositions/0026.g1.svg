<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 210" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="195" height="210" fill="#ffffff"/>

<g id="circle" class="interactive">
    <circle cx="96" cy="116" r="68" class="geometry"/>
</g>
<g id="secants-from-D" class="interactive">
    <line x1="170" y1="16" x2="35" y2="148" class="geometry"/>
    <line x1="170" y1="16" x2="68" y2="178" class="geometry"/>
</g>
<g id="perpendicular-from-M" class="interactive">
    <line x1="96" y1="116" x2="108" y2="76" class="geometry"/>
    <polyline points="108,82 102,80 104,74" class="geometry" style="stroke-width: 1;"/>
</g>
<g id="points">
    <circle cx="170" cy="16" r="2.5" class="point"/>
    <circle cx="132" cy="53" r="2.5" class="point"/>
    <circle cx="35" cy="148" r="2.5" class="point"/>
    <circle cx="140" cy="65" r="2.5" class="point"/>
    <circle cx="68" cy="178" r="2.5" class="point"/>
    <circle cx="96" cy="116" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="180" y="16" class="label">D</text>
    <text x="142" y="47" class="label">Z</text>
    <text x="25" y="154" class="label">E</text>
    <text x="150" y="65" class="label">Y</text>
    <text x="68" y="190" class="label">F</text>
    <text x="96" y="130" class="label">M</text>
</g>

</svg>
