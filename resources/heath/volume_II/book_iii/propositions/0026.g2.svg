<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 171 255" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="171" height="255" fill="#ffffff"/>

<g id="circle" class="interactive">
    <circle cx="84" cy="158" r="71" class="geometry"/>
</g>
<g id="lines-from-A" class="interactive">
    <line x1="72" y1="17" x2="25" y2="198" class="geometry"/>
    <line x1="72" y1="17" x2="135" y2="215" class="geometry"/>
</g>
<g id="perpendiculars" class="interactive">
    <line x1="84" y1="158" x2="44" y2="125" class="geometry"/>
    <line x1="84" y1="158" x2="108" y2="130" class="geometry"/>
    <polyline points="44,132 50,134 50,127" class="geometry" style="stroke-width: 1;"/>
    <polyline points="108,137 102,135 102,128" class="geometry" style="stroke-width: 1;"/>
</g>
<g id="radii" class="interactive">
    <line x1="84" y1="158" x2="25" y2="198" class="construction"/>
    <line x1="84" y1="158" x2="135" y2="215" class="construction"/>
</g>
<g id="points">
    <circle cx="72" cy="17" r="2.5" class="point"/>
    <circle cx="84" cy="158" r="2.5" class="point"/>
    <circle cx="25" cy="198" r="2.5" class="point"/>
    <circle cx="135" cy="215" r="2.5" class="point"/>
    <circle cx="44" cy="125" r="2.5" class="point"/>
    <circle cx="108" cy="130" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="72" y="8" class="label">A</text>
    <text x="84" y="172" class="label">D</text>
    <text x="15" y="200" class="label">E</text>
    <text x="145" y="215" class="label">F</text>
    <text x="35" y="122" class="label">G</text>
    <text x="118" y="128" class="label">H</text>
</g>

</svg>
