<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 222 219" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="222" height="219" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="110" cy="108" r="84" class="geometry"/>
</g>
<g id="lines-DA-DB-DC" class="interactive">
    <line x1="110" y1="108" x2="40" y2="48" class="geometry"/>
    <line x1="110" y1="108" x2="110" y2="24" class="geometry"/>
    <line x1="110" y1="108" x2="194" y2="98" class="geometry"/>
</g>
<g id="chords" class="interactive">
    <line x1="40" y1="48" x2="110" y2="24" class="geometry"/>
    <line x1="110" y1="24" x2="194" y2="98" class="geometry"/>
</g>
<g id="perpendicular-bisectors" class="interactive">
    <line x1="75" y1="36" x2="145" y2="180" class="geometry"/>
    <line x1="152" y1="61" x2="68" y2="155" class="geometry"/>
</g>
<g id="points">
    <circle cx="110" cy="108" r="2.5" class="point"/>
    <circle cx="40" cy="48" r="2.5" class="point"/>
    <circle cx="110" cy="24" r="2.5" class="point"/>
    <circle cx="194" cy="98" r="2.5" class="point"/>
    <circle cx="75" cy="36" r="2.5" class="point"/>
    <circle cx="152" cy="61" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="110" y="120" class="label">D</text>
    <text x="30" y="48" class="label">A</text>
    <text x="110" y="14" class="label">B</text>
    <text x="204" y="98" class="label">C</text>
    <text x="70" y="27" class="label">E</text>
    <text x="160" y="55" class="label">F</text>
    <text x="70" y="45" class="label">G</text>
    <text x="150" y="192" class="label">K</text>
    <text x="60" y="165" class="label">H</text>
    <text x="162" y="68" class="label">L</text>
</g>

</svg>
