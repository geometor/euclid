<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 182 172" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="182" height="172" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="90" cy="82" r="65" class="geometry"/>
</g>
<g id="diameter-FG" class="interactive">
    <line x1="32" y1="120" x2="148" y2="44" class="geometry"/>
</g>
<g id="lines-DA-DB-DC" class="interactive">
    <line x1="72" y1="94" x2="28" y2="60" class="geometry"/>
    <line x1="72" y1="94" x2="90" y2="17" class="geometry"/>
    <line x1="72" y1="94" x2="152" y2="98" class="geometry"/>
</g>
<g id="points">
    <circle cx="90" cy="82" r="2.5" class="point"/>
    <circle cx="72" cy="94" r="2.5" class="point"/>
    <circle cx="28" cy="60" r="2.5" class="point"/>
    <circle cx="90" cy="17" r="2.5" class="point"/>
    <circle cx="152" cy="98" r="2.5" class="point"/>
    <circle cx="32" cy="120" r="2.5" class="point"/>
    <circle cx="148" cy="44" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="96" y="74" class="label">E</text>
    <text x="65" y="104" class="label">D</text>
    <text x="18" y="58" class="label">A</text>
    <text x="90" y="8" class="label">B</text>
    <text x="162" y="98" class="label">C</text>
    <text x="24" y="130" class="label">F</text>
    <text x="156" y="40" class="label">G</text>
</g>

</svg>
