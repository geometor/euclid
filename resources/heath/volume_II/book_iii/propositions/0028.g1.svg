<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 182 172" width="182" height="172" class="euclid-graphic" data-graphic-id="0028.g1" data-folio="0028" data-graphic="g1" data-proposition="III.9">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <circle id="el-circle-ABC" data-ref="( A B C )" data-aliases="( D G ); ( F A B C G )" data-type="circle" cx="91" cy="86" r="66" class="geom-circle" />
    <line id="el-line-FG" data-ref="[ F G ]" data-aliases="[ G F ]" data-type="line" x1="25" y1="86" x2="157" y2="86" class="geom-line geom-overlay" />
  </g>

  <!-- Constructed Graphics -->
  <g id="graphics">
    <!-- Diameter F-D-E-G Sub-Segments -->
    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" data-type="segment" x1="25" y1="86" x2="91" y2="86" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="91" y1="86" x2="116" y2="86" class="geom-line" />
    <line id="el-seg-EG" data-ref="/ E G /" data-aliases="/ G E /" data-type="segment" x1="116" y1="86" x2="157" y2="86" class="geom-line" />
    <line id="el-seg-DG" data-ref="/ D G /" data-aliases="/ G D /" data-type="segment" x1="91" y1="86" x2="157" y2="86" class="geom-line geom-overlay" />
    <line id="el-seg-FG" data-ref="/ F G /" data-aliases="/ G F /" data-type="segment" x1="25" y1="86" x2="157" y2="86" class="geom-line geom-overlay" />

    <!-- Equal Straight Lines DA, DB, DC -->
    <line id="el-seg-DA" data-ref="/ D A /" data-aliases="/ A D /" data-type="segment" x1="91" y1="86" x2="51.40" y2="138.80" class="geom-line" />
    <line id="el-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" data-type="segment" x1="91" y1="86" x2="109.48" y2="149.36" class="geom-line" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" data-type="segment" x1="91" y1="86" x2="151.92" y2="111.38" class="geom-line" />

    <!-- Angle Wedge ADC -->
    <path id="el-ang-ADC" data-ref="&lt; A D C )" data-aliases="&lt; C D A )" data-type="wedge" d="M 91.00 86.00 L 79.00 102.00 A 20.0 20.0 0 0 0 109.46 93.69 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circle-ABC" data-ref="( A B C )" data-aliases="( D G ); ( F A B C G )" cx="91" cy="86" r="66" class="geom-circle geom-overlay" />
    <line id="hl-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" x1="25" y1="86" x2="91" y2="86" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="91" y1="86" x2="116" y2="86" class="geom-line geom-overlay" />
    <line id="hl-seg-EG" data-ref="/ E G /" data-aliases="/ G E /" x1="116" y1="86" x2="157" y2="86" class="geom-line geom-overlay" />
    <line id="hl-seg-DG" data-ref="/ D G /" data-aliases="/ G D /" x1="91" y1="86" x2="157" y2="86" class="geom-line geom-overlay" />
    <line id="hl-seg-FG" data-ref="/ F G /" data-aliases="/ G F /" x1="25" y1="86" x2="157" y2="86" class="geom-line geom-overlay" />

    <line id="hl-seg-DA" data-ref="/ D A /" data-aliases="/ A D /" x1="91" y1="86" x2="51.40" y2="138.80" class="geom-line geom-overlay" />
    <line id="hl-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" x1="91" y1="86" x2="109.48" y2="149.36" class="geom-line geom-overlay" />
    <line id="hl-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" x1="91" y1="86" x2="151.92" y2="111.38" class="geom-line geom-overlay" />

    <path id="hl-ang-ADC" data-ref="&lt; A D C )" data-aliases="&lt; C D A )" d="M 91.00 86.00 L 79.00 102.00 A 20.0 20.0 0 0 0 109.46 93.69 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="51.40" cy="138.80" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="109.48" cy="149.36" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="151.92" cy="111.38" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="91" cy="86" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="116" cy="86" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="25" cy="86" r="3.5" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="157" cy="86" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="45" y="152" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="112" y="164" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="160" y="119" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="92" y="81" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="118" y="82" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="15" y="90" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-G" data-ref="G" x="166" y="90" text-anchor="middle" class="geom-label">G</text>
  </g>
</svg>
