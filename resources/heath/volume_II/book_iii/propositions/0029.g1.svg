<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 274 232" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="274" height="232" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="138" cy="118" r="89" class="geometry"/>
</g>
<g id="chords-BH-BG" class="interactive">
    <line x1="65" y1="65" x2="195" y2="65" class="geometry"/>
    <line x1="65" y1="65" x2="85" y2="195" class="geometry"/>
</g>
<g id="perpendicular-bisectors" class="interactive">
    <line x1="130" y1="29" x2="130" y2="207" class="geometry"/>
    <line x1="75" y1="130" x2="225" y2="105" class="geometry"/>
</g>
<g id="points">
    <circle cx="138" cy="118" r="2.5" class="point"/>
    <circle cx="65" cy="65" r="2.5" class="point"/>
    <circle cx="195" cy="65" r="2.5" class="point"/>
    <circle cx="85" cy="195" r="2.5" class="point"/>
    <circle cx="130" cy="65" r="2.5" class="point"/>
    <circle cx="75" cy="130" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="138" y="118" class="label">P</text>
    <text x="54" y="65" class="label">B</text>
    <text x="206" y="65" class="label">H</text>
    <text x="85" y="206" class="label">G</text>
    <text x="130" y="55" class="label">K</text>
    <text x="65" y="130" class="label">L</text>
    <text x="130" y="18" class="label">A</text>
    <text x="130" y="218" class="label">C</text>
    <text x="235" y="105" class="label">E</text>
</g>

</svg>
