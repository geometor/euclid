<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 187 169" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="187" height="169" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="80" cy="85" r="58" class="geometry"/>
</g>
<g id="circle-DEF" class="interactive">
    <circle cx="110" cy="85" r="58" class="geometry"/>
</g>
<g id="radii-from-K" class="interactive">
    <line x1="95" y1="85" x2="95" y2="29" class="geometry"/>
    <line x1="95" y1="85" x2="168" y2="85" class="geometry"/>
    <line x1="95" y1="85" x2="140" y2="132" class="geometry"/>
</g>
<g id="points">
    <circle cx="95" cy="85" r="2.5" class="point"/>
    <circle cx="95" cy="29" r="2.5" class="point"/>
    <circle cx="95" cy="141" r="2.5" class="point"/>
    <circle cx="168" cy="85" r="2.5" class="point"/>
    <circle cx="140" cy="132" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="95" y="18" class="label">B</text>
    <text x="95" y="152" class="label">C</text>
    <text x="85" y="85" class="label">K</text>
    <text x="178" y="85" class="label">F</text>
    <text x="148" y="140" class="label">G</text>
    <text x="22" y="85" class="label">A</text>
    <text x="55" y="125" class="label">D</text>
    <text x="140" y="45" class="label">E</text>
</g>

</svg>
