<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 187 169" width="187" height="169" class="euclid-graphic" data-graphic-id="0030.g1" data-folio="0030" data-graphic="g1" data-proposition="III.10">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <circle id="el-circle-ABC" data-ref="( A B C )" data-aliases="( K A ) | ( K B ) | ( A B G C F H )" data-type="circle" cx="86" cy="86" r="58" class="geom-circle" />
    <ellipse id="el-circle-DEF" data-ref="( D E F )" data-aliases="( K D ) | ( D B E G F H )" data-type="circle" cx="94" cy="86" rx="72" ry="45" class="geom-circle" />
  </g>

  <!-- Constructed Graphics -->
  <g id="graphics">
    <line id="el-seg-KB" data-ref="/ K B /" data-aliases="/ B K /" data-type="segment" x1="86.00" y1="86.00" x2="128.46" y2="46.49" class="geom-line" />
    <line id="el-seg-KG" data-ref="/ K G /" data-aliases="/ G K /" data-type="segment" x1="86.00" y1="86.00" x2="128.46" y2="125.51" class="geom-line" />
    <line id="el-seg-KF" data-ref="/ K F /" data-aliases="/ F K /" data-type="segment" x1="86.00" y1="86.00" x2="33.28" y2="110.19" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circle-ABC" data-ref="( A B C )" data-aliases="( K A ) | ( K B ) | ( A B G C F H )" cx="86" cy="86" r="58" class="geom-circle geom-overlay" />
    <ellipse id="hl-circle-DEF" data-ref="( D E F )" data-aliases="( K D ) | ( D B E G F H )" cx="94" cy="86" rx="72" ry="45" class="geom-circle geom-overlay" />

    <line id="hl-seg-KB" data-ref="/ K B /" data-aliases="/ B K /" x1="86.00" y1="86.00" x2="128.46" y2="46.49" class="geom-line geom-overlay" />
    <line id="hl-seg-KG" data-ref="/ K G /" data-aliases="/ G K /" x1="86.00" y1="86.00" x2="128.46" y2="125.51" class="geom-line geom-overlay" />
    <line id="hl-seg-KF" data-ref="/ K F /" data-aliases="/ F K /" x1="86.00" y1="86.00" x2="33.28" y2="110.19" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="86.00" cy="28.00" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="128.46" cy="46.49" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="86.00" cy="144.00" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="76.00" cy="42.42" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="164.00" cy="75.00" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="33.28" cy="110.19" r="3.5" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="128.46" cy="125.51" r="3.5" class="geom-point" />
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="33.28" cy="61.81" r="3.5" class="geom-point" />
    <circle id="el-pt-K" data-ref="K" data-type="point" cx="86.00" cy="86.00" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="78" y="21" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="134" y="38" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="103" y="158" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="76" y="57" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="174" y="72" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="28" y="125" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-G" data-ref="G" x="140" y="135" text-anchor="middle" class="geom-label">G</text>
    <text id="lbl-H" data-ref="H" x="23" y="59" text-anchor="middle" class="geom-label">H</text>
    <text id="lbl-K" data-ref="K" x="79" y="82" text-anchor="middle" class="geom-label">K</text>
  </g>
</svg>
