<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 255" width="246" height="255" class="euclid-graphic" data-graphic-id="0030.g2" data-folio="0030" data-graphic="g2" data-proposition="III.11">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <circle id="el-circle-ABC" data-ref="( A B C )" data-aliases="( F A ) | ( F H ) | ( A H B C )" data-type="circle" cx="118" cy="128" r="98" class="geom-circle" />
    <circle id="el-circle-ADE" data-ref="( A D E )" data-aliases="( G A ) | ( G D ) | ( A D E )" data-type="circle" cx="95.06" cy="111.94" r="70" class="geom-circle" />
    <line id="el-line-FGH" data-ref="[ F H ]" data-aliases="[ F G ] | [ G F ] | [ F G H ] | / F G H /" data-type="line" x1="118" y1="128" x2="118" y2="30" class="geom-line geom-overlay" />
  </g>

  <!-- Constructed Graphics -->
  <g id="graphics">
    <!-- Triangle AFG -->
    <polygon id="el-tri-AFG" data-ref="&lt; A F G &gt;" data-aliases="&lt; A G F &gt;" data-type="polygon" points="37.72,71.79 118.00,128.00 118.00,96.00" class="geom-polygon" />

    <!-- Collinear Sub-Segments along F-G-D-H -->
    <line id="el-seg-FG" data-ref="/ F G /" data-aliases="/ G F /" data-type="segment" x1="118.00" y1="128.00" x2="118.00" y2="96.00" class="geom-line" />
    <line id="el-seg-GD" data-ref="/ G D /" data-aliases="/ D G /" data-type="segment" x1="118.00" y1="96.00" x2="118.00" y2="45.80" class="geom-line" />
    <line id="el-seg-DH" data-ref="/ D H /" data-aliases="/ H D /" data-type="segment" x1="118.00" y1="45.80" x2="118.00" y2="30.00" class="geom-line" />
    <line id="el-seg-GH" data-ref="/ G H /" data-aliases="/ H G /" data-type="segment" x1="118.00" y1="96.00" x2="118.00" y2="30.00" class="geom-line geom-overlay" />
    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" data-type="segment" x1="118.00" y1="128.00" x2="118.00" y2="45.80" class="geom-line geom-overlay" />
    <line id="el-seg-FH" data-ref="/ F H /" data-aliases="/ H F / | / F G H /" data-type="segment" x1="118.00" y1="128.00" x2="118.00" y2="30.00" class="geom-line geom-overlay" />

    <!-- Segments AF and AG -->
    <line id="el-seg-AF" data-ref="/ A F /" data-aliases="/ F A /" data-type="segment" x1="37.72" y1="71.79" x2="118.00" y2="128.00" class="geom-line" />
    <line id="el-seg-AG" data-ref="/ A G /" data-aliases="/ G A /" data-type="segment" x1="37.72" y1="71.79" x2="118.00" y2="96.00" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circle-ABC" data-ref="( A B C )" data-aliases="( F A ) | ( F H ) | ( A H B C )" cx="118" cy="128" r="98" class="geom-circle geom-overlay" />
    <circle id="hl-circle-ADE" data-ref="( A D E )" data-aliases="( G A ) | ( G D ) | ( A D E )" cx="95.06" cy="111.94" r="70" class="geom-circle geom-overlay" />
    <polygon id="hl-tri-AFG" data-ref="&lt; A F G &gt;" data-aliases="&lt; A G F &gt;" points="37.72,71.79 118.00,128.00 118.00,96.00" class="geom-polygon geom-overlay" />

    <line id="hl-seg-FG" data-ref="/ F G /" data-aliases="/ G F /" x1="118.00" y1="128.00" x2="118.00" y2="96.00" class="geom-line geom-overlay" />
    <line id="hl-seg-GD" data-ref="/ G D /" data-aliases="/ D G /" x1="118.00" y1="96.00" x2="118.00" y2="45.80" class="geom-line geom-overlay" />
    <line id="hl-seg-DH" data-ref="/ D H /" data-aliases="/ H D /" x1="118.00" y1="45.80" x2="118.00" y2="30.00" class="geom-line geom-overlay" />
    <line id="hl-seg-GH" data-ref="/ G H /" data-aliases="/ H G /" x1="118.00" y1="96.00" x2="118.00" y2="30.00" class="geom-line geom-overlay" />
    <line id="hl-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" x1="118.00" y1="128.00" x2="118.00" y2="45.80" class="geom-line geom-overlay" />
    <line id="hl-seg-FH" data-ref="/ F H /" data-aliases="/ H F / | / F G H /" x1="118.00" y1="128.00" x2="118.00" y2="30.00" class="geom-line geom-overlay" />

    <line id="hl-seg-AF" data-ref="/ A F /" data-aliases="/ F A /" x1="37.72" y1="71.79" x2="118.00" y2="128.00" class="geom-line geom-overlay" />
    <line id="hl-seg-AG" data-ref="/ A G /" data-aliases="/ G A /" x1="37.72" y1="71.79" x2="118.00" y2="96.00" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="37.72" cy="71.79" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="216.00" cy="128.00" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="85.33" cy="220.40" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="118.00" cy="45.80" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="84.00" cy="181.06" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="118.00" cy="128.00" r="3.5" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="118.00" cy="96.00" r="3.5" class="geom-point" />
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="118.00" cy="30.00" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="30" y="68" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="225" y="132" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="85" y="236" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="109" y="56" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="84" y="196" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="117" y="143" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-G" data-ref="G" x="126" y="102" text-anchor="middle" class="geom-label">G</text>
    <text id="lbl-H" data-ref="H" x="119" y="23" text-anchor="middle" class="geom-label">H</text>
  </g>
</svg>
