<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 255" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="246" height="255" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="118" cy="130" r="101" class="geometry"/>
</g>
<g id="circle-ADE" class="interactive">
    <circle cx="118" cy="160" r="71" class="geometry"/>
</g>
<g id="hypothetical-line-FGH" class="interactive">
    <line x1="118" y1="130" x2="78" y2="184" class="geometry"/>
</g>
<g id="radii" class="interactive">
    <line x1="118" y1="130" x2="118" y2="231" class="geometry"/>
    <line x1="118" y1="160" x2="118" y2="231" class="geometry"/>
    <line x1="78" y1="184" x2="118" y2="231" class="construction"/>
</g>
<g id="points">
    <circle cx="118" cy="130" r="2.5" class="point"/>
    <circle cx="118" cy="160" r="2.5" class="point"/>
    <circle cx="118" cy="231" r="2.5" class="point"/>
    <circle cx="78" cy="184" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="118" y="120" class="label">F</text>
    <text x="128" y="160" class="label">G</text>
    <text x="118" y="242" class="label">A</text>
    <text x="68" y="184" class="label">H</text>
    <text x="118" y="18" class="label">C</text>
    <text x="21" y="130" class="label">B</text>
    <text x="47" y="160" class="label">D</text>
    <text x="190" y="160" class="label">E</text>
</g>

</svg>
