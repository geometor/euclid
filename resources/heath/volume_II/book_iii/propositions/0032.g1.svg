    <!-- Angle Wedges DFX and DGX -->
    <path id="el-ang-DFX" data-ref="&lt; D F X )" data-aliases="&lt; X F D )" data-type="wedge" d="M 104.00 69.00 L 88.00 69.00 A 16.0 16.0 0 0 1 91.89 58.54 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-DGX" data-ref="&lt; D G X )" data-aliases="&lt; X G D )" data-type="wedge" d="M 86.00 69.00 L 72.00 69.00 A 14.0 14.0 0 0 1 78.47 57.20 Z" class="wedge angle geom-overlay" />
  </g>

