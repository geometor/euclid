<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 179 138" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="179" height="138" fill="#ffffff"/>

<g id="circles" class="interactive">
    <circle cx="98" cy="68" r="54" class="geometry"/>
    <circle cx="112" cy="68" r="40" class="geometry"/>
</g>
<g id="line-AFGDH" class="interactive">
    <line x1="15" y1="68" x2="155" y2="68" class="geometry"/>
</g>
<g id="points">
    <circle cx="15" cy="68" r="2.5" class="point"/>
    <circle cx="98" cy="68" r="2.5" class="point"/>
    <circle cx="112" cy="68" r="2.5" class="point"/>
    <circle cx="152" cy="68" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="15" y="56" class="label">A</text>
    <text x="98" y="56" class="label">F</text>
    <text x="114" y="56" class="label">G</text>
    <text x="160" y="68" class="label">D</text>
    <text x="145" y="80" class="label">H</text>
</g>

</svg>
