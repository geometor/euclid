<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 179 138" width="179" height="138" class="euclid-graphic" data-graphic-id="0032.g1" data-folio="0032" data-graphic="g1" data-proposition="III.11">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <circle id="el-circle-FA" data-ref="( F A )" data-aliases="( F H ); ( A X H )" data-type="circle" cx="104" cy="69" r="53" class="geom-circle" />
    <ellipse id="el-circle-GA" data-ref="( G A )" data-aliases="( G D ); ( A X D )" data-type="circle" cx="91" cy="69" rx="66" ry="38" class="geom-circle" />
    <line id="el-line-DA" data-ref="[ F G ]" data-aliases="[ G F ]; [ D A ]" data-type="line" x1="25" y1="69" x2="157" y2="69" class="geom-line geom-overlay" />
  </g>

  <!-- Constructed Graphics -->
  <g id="graphics">
    <!-- Collinear Sub-Segments along D-H-G-F-A -->
    <line id="el-seg-DH" data-ref="/ D H /" data-aliases="/ H D /" data-type="segment" x1="25.00" y1="69.00" x2="51.00" y2="69.00" class="geom-line" />
    <line id="el-seg-HG" data-ref="/ G H /" data-aliases="/ H G /" data-type="segment" x1="86.00" y1="69.00" x2="51.00" y2="69.00" class="geom-line" />
    <line id="el-seg-GF" data-ref="/ F G /" data-aliases="/ G F /" data-type="segment" x1="104.00" y1="69.00" x2="86.00" y2="69.00" class="geom-line" />
    <line id="el-seg-FA" data-ref="/ F A /" data-aliases="/ A F /" data-type="segment" x1="104.00" y1="69.00" x2="157.00" y2="69.00" class="geom-line" />
    <line id="el-seg-GD" data-ref="/ G D /" data-aliases="/ D G /" data-type="segment" x1="86.00" y1="69.00" x2="25.00" y2="69.00" class="geom-line geom-overlay" />
    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" data-type="segment" x1="104.00" y1="69.00" x2="25.00" y2="69.00" class="geom-line geom-overlay" />
    <line id="el-seg-FH" data-ref="/ F H /" data-aliases="/ H F /" data-type="segment" x1="104.00" y1="69.00" x2="51.00" y2="69.00" class="geom-line geom-overlay" />
    <line id="el-seg-GA" data-ref="/ G A /" data-aliases="/ A G /" data-type="segment" x1="86.00" y1="69.00" x2="157.00" y2="69.00" class="geom-line geom-overlay" />

    <!-- Toggleable Segments FX, GX, FY, GY -->
    <line id="el-seg-FX" data-ref="/ F X /" data-aliases="/ X F /" data-type="segment" x1="104.00" y1="69.00" x2="63.89" y2="34.35" class="geom-line geom-overlay" />
    <line id="el-seg-GX" data-ref="/ G X /" data-aliases="/ X G /" data-type="segment" x1="86.00" y1="69.00" x2="63.89" y2="34.35" class="geom-line geom-overlay" />
    <line id="el-seg-FY" data-ref="/ F Y /" data-aliases="/ Y F /" data-type="segment" x1="104.00" y1="69.00" x2="63.89" y2="103.65" class="geom-line geom-overlay" />
