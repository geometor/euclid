    <ellipse id="hl-circle-GA" data-ref="( G A )" data-aliases="( G D ); ( A X D )" cx="91" cy="69" rx="66" ry="38" class="geom-circle geom-overlay" />
    <line id="hl-line-DA" data-ref="[ F G ]" data-aliases="[ G F ]; [ D A ]" x1="25" y1="69" x2="157" y2="69" class="geom-line geom-overlay" />

    <line id="hl-seg-DH" data-ref="/ D H /" data-aliases="/ H D /" x1="25.00" y1="69.00" x2="51.00" y2="69.00" class="geom-line geom-overlay" />
    <line id="hl-seg-HG" data-ref="/ G H /" data-aliases="/ H G /" x1="86.00" y1="69.00" x2="51.00" y2="69.00" class="geom-line geom-overlay" />
    <line id="hl-seg-GF" data-ref="/ F G /" data-aliases="/ G F /" x1="104.00" y1="69.00" x2="86.00" y2="69.00" class="geom-line geom-overlay" />
    <line id="hl-seg-FA" data-ref="/ F A /" data-aliases="/ A F /" x1="104.00" y1="69.00" x2="157.00" y2="69.00" class="geom-line geom-overlay" />
    <line id="hl-seg-GD" data-ref="/ G D /" data-aliases="/ D G /" x1="86.00" y1="69.00" x2="25.00" y2="69.00" class="geom-line geom-overlay" />
    <line id="hl-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" x1="104.00" y1="69.00" x2="25.00" y2="69.00" class="geom-line geom-overlay" />
    <line id="hl-seg-FH" data-ref="/ F H /" data-aliases="/ H F /" x1="104.00" y1="69.00" x2="51.00" y2="69.00" class="geom-line geom-overlay" />
    <line id="hl-seg-GA" data-ref="/ G A /" data-aliases="/ A G /" x1="86.00" y1="69.00" x2="157.00" y2="69.00" class="geom-line geom-overlay" />

    <line id="hl-seg-FX" data-ref="/ F X /" data-aliases="/ X F /" x1="104.00" y1="69.00" x2="63.89" y2="34.35" class="geom-line geom-overlay" />
    <line id="hl-seg-GX" data-ref="/ G X /" data-aliases="/ X G /" x1="86.00" y1="69.00" x2="63.89" y2="34.35" class="geom-line geom-overlay" />
    <line id="hl-seg-FY" data-ref="/ F Y /" data-aliases="/ Y F /" x1="104.00" y1="69.00" x2="63.89" y2="103.65" class="geom-line geom-overlay" />
    <line id="hl-seg-GY" data-ref="/ G Y /" data-aliases="/ Y G /" x1="86.00" y1="69.00" x2="63.89" y2="103.65" class="geom-line geom-overlay" />

    <path id="hl-ang-DFX" data-ref="&lt; D F X )" data-aliases="&lt; X F D )" d="M 104.00 69.00 L 88.00 69.00 A 16.0 16.0 0 0 1 91.89 58.54 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-DGX" data-ref="&lt; D G X )" data-aliases="&lt; X G D )" d="M 86.00 69.00 L 72.00 69.00 A 14.0 14.0 0 0 1 78.47 57.20 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="157.00" cy="69.00" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="25.00" cy="69.00" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="104.00" cy="69.00" r="3.5" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="86.00" cy="69.00" r="3.5" class="geom-point" />
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="51.00" cy="69.00" r="3.5" class="geom-point" />
