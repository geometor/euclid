<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 138" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="148" height="138" fill="#ffffff"/>

<g id="circles" class="interactive">
    <circle cx="70" cy="68" r="53" class="geometry"/>
    <circle cx="85" cy="68" r="38" class="geometry"/>
</g>
<g id="tilted-line" class="interactive">
    <line x1="55" y1="68" x2="123" y2="68" class="geometry"/>
    <line x1="70" y1="68" x2="35" y2="28" class="construction"/>
    <line x1="85" y1="68" x2="35" y2="28" class="construction"/>
</g>
<g id="points">
    <circle cx="35" cy="28" r="2.5" class="point"/>
    <circle cx="70" cy="68" r="2.5" class="point"/>
    <circle cx="85" cy="68" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="25" y="25" class="label">A</text>
    <text x="70" y="80" class="label">F</text>
    <text x="85" y="80" class="label">G</text>
    <text x="128" y="60" class="label">D</text>
    <text x="130" y="76" class="label">H</text>
</g>

</svg>
