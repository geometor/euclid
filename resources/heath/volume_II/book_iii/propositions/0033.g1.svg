<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 204 181" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="204" height="181" fill="#ffffff"/>

<g id="circles" class="interactive">
    <circle cx="90" cy="90" r="75" class="geometry"/>
    <circle cx="125" cy="90" r="40" class="geometry"/>
</g>
<g id="common-diameter" class="interactive">
    <line x1="15" y1="90" x2="165" y2="90" class="geometry"/>
</g>
<g id="secant-FPQ" class="interactive">
    <line x1="105" y1="145" x2="155" y2="35" class="geometry"/>
</g>
<g id="points">
    <circle cx="165" cy="90" r="2.5" class="point"/>
    <circle cx="125" cy="90" r="2.5" class="point"/>
    <circle cx="90" cy="90" r="2.5" class="point"/>
    <circle cx="105" cy="145" r="2.5" class="point"/>
    <circle cx="140" cy="68" r="2.5" class="point"/>
    <circle cx="152" cy="42" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="175" y="90" class="label">A</text>
    <text x="125" y="102" class="label">B</text>
    <text x="80" y="102" class="label">C</text>
    <text x="105" y="158" class="label">F</text>
    <text x="132" y="68" class="label">P</text>
    <text x="162" y="42" class="label">Q</text>
</g>

</svg>
