<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 271 230" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="271" height="230" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="74" cy="100" r="56" class="geometry"/>
</g>
<g id="circle-ADE" class="interactive">
    <circle cx="180" cy="140" r="65" class="geometry"/>
</g>
<g id="hypothetical-line-FCDG" class="interactive">
    <line x1="74" y1="100" x2="180" y2="140" class="geometry"/>
</g>
<g id="radii-to-contact" class="interactive">
    <line x1="74" y1="100" x2="123" y2="119" class="geometry"/>
    <line x1="180" y1="140" x2="123" y2="119" class="geometry"/>
</g>
<g id="points">
    <circle cx="74" cy="100" r="2.5" class="point"/>
    <circle cx="180" cy="140" r="2.5" class="point"/>
    <circle cx="123" cy="119" r="2.5" class="point"/>
    <circle cx="102" cy="111" r="2.5" class="point"/>
    <circle cx="130" cy="121" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="65" y="100" class="label">F</text>
    <text x="190" y="145" class="label">G</text>
    <text x="123" y="108" class="label">A</text>
    <text x="100" y="125" class="label">C</text>
    <text x="135" y="135" class="label">D</text>
    <text x="74" y="24" class="label">B</text>
    <text x="250" y="145" class="label">E</text>
</g>

</svg>
