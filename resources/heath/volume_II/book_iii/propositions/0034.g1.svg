<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 271 230" width="271" height="230" class="euclid-graphic" data-graphic-id="0034.g1" data-folio="0034" data-graphic="g1" data-proposition="III.12">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Two Externally Tangent Circles & Line FCDG) -->
  <g id="elements">
    <circle id="el-circle-ABC" data-ref="( F A )" data-aliases="( A B C ); ( F C )" data-type="circle" cx="72" cy="85" r="54.13" class="geom-circle" />
    <circle id="el-circle-ADE" data-ref="( G A )" data-aliases="( A D E ); ( G D )" data-type="circle" cx="181" cy="136.16" r="66.28" class="geom-circle" />
    <line id="el-line-FCDG" data-ref="[ F G ]" data-aliases="/ F C D G /; [ F C D G ]" data-type="line" x1="68" y1="96" x2="168" y2="160" class="geom-line geom-overlay" />
  </g>

  <!-- Constructed Graphics (Triangle FAG, Radii FA & GA, Collinear Segments along FCDG) -->
  <g id="graphics">
    <polygon id="el-tri-FAG" data-ref="&lt; F A G &gt;" data-aliases="&lt; A F G &gt;; &lt; G A F &gt;" data-type="polygon" points="68,96 121,108 168,160" class="geom-polygon" />

    <!-- Radii to point of contact A -->
    <line id="el-seg-FA" data-ref="/ F A /" data-aliases="/ A F /" data-type="segment" x1="68" y1="96" x2="121" y2="108" class="geom-line" />
    <line id="el-seg-GA" data-ref="/ G A /" data-aliases="/ A G /" data-type="segment" x1="168" y1="160" x2="121" y2="108" class="geom-line" />

    <!-- Atomic collinear segments along FCDG -->
    <line id="el-seg-FC" data-ref="/ F C /" data-aliases="/ C F /; / C B /" data-type="segment" x1="68" y1="96" x2="110.40" y2="123.14" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="110.40" y1="123.14" x2="115.46" y2="126.37" class="geom-line" />
    <line id="el-seg-DG" data-ref="/ G D /" data-aliases="/ D G /" data-type="segment" x1="115.46" y1="126.37" x2="168" y2="160" class="geom-line" />

    <!-- Composite collinear segments along FCDG -->
    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" data-type="segment" x1="68" y1="96" x2="115.46" y2="126.37" class="geom-line geom-overlay" />
    <line id="el-seg-CG" data-ref="/ C G /" data-aliases="/ G C /" data-type="segment" x1="110.40" y1="123.14" x2="168" y2="160" class="geom-line geom-overlay" />
    <line id="el-seg-FG" data-ref="/ F G /" data-aliases="/ G F /" data-type="segment" x1="68" y1="96" x2="168" y2="160" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-FAG" data-ref="&lt; F A G &gt;" data-aliases="&lt; A F G &gt;; &lt; G A F &gt;" points="68,96 121,108 168,160" class="geom-polygon geom-overlay" />
    <circle id="hl-circle-ABC" data-ref="( F A )" data-aliases="( A B C ); ( F C )" cx="72" cy="85" r="54.13" class="geom-circle geom-overlay" />
    <circle id="hl-circle-ADE" data-ref="( G A )" data-aliases="( A D E ); ( G D )" cx="181" cy="136.16" r="66.28" class="geom-circle geom-overlay" />
    <line id="hl-line-FCDG" data-ref="[ F G ]" data-aliases="/ F C D G /; [ F C D G ]" x1="68" y1="96" x2="168" y2="160" class="geom-line geom-overlay" />

    <line id="hl-seg-FA" data-ref="/ F A /" data-aliases="/ A F /" x1="68" y1="96" x2="121" y2="108" class="geom-line geom-overlay" />
    <line id="hl-seg-GA" data-ref="/ G A /" data-aliases="/ A G /" x1="168" y1="160" x2="121" y2="108" class="geom-line geom-overlay" />
    <line id="hl-seg-FC" data-ref="/ F C /" data-aliases="/ C F /; / C B /" x1="68" y1="96" x2="110.40" y2="123.14" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="110.40" y1="123.14" x2="115.46" y2="126.37" class="geom-line geom-overlay" />
    <line id="hl-seg-DG" data-ref="/ G D /" data-aliases="/ D G /" x1="115.46" y1="126.37" x2="168" y2="160" class="geom-line geom-overlay" />
    <line id="hl-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" x1="68" y1="96" x2="115.46" y2="126.37" class="geom-line geom-overlay" />
    <line id="hl-seg-CG" data-ref="/ C G /" data-aliases="/ G C /" x1="110.40" y1="123.14" x2="168" y2="160" class="geom-line geom-overlay" />
    <line id="hl-seg-FG" data-ref="/ F G /" data-aliases="/ G F /" x1="68" y1="96" x2="168" y2="160" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="68" cy="96" r="3.5" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="168" cy="160" r="3.5" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="121" cy="108" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="110.40" cy="123.14" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="115.46" cy="126.37" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="72" cy="30.87" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="247.28" cy="136.16" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-B" data-ref="B" x="72" y="22" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-F" data-ref="F" x="59" y="100" text-anchor="end" class="geom-label">F</text>
    <text id="lbl-A" data-ref="A" x="117" y="99" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-C" data-ref="C" x="103" y="131" text-anchor="end" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="118" y="143" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-G" data-ref="G" x="174" y="170" text-anchor="start" class="geom-label">G</text>
    <text id="lbl-E" data-ref="E" x="255" y="149" text-anchor="start" class="geom-label">E</text>
  </g>
</svg>
