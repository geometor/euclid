<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 142" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="195" height="142" fill="#ffffff"/>

<g id="circles" class="interactive">
    <circle cx="76" cy="92" r="50" class="geometry"/>
    <circle cx="150" cy="92" r="35" class="geometry"/>
</g>
<g id="line-through-centres" class="interactive">
    <line x1="15" y1="92" x2="185" y2="92" class="geometry"/>
</g>
<g id="points">
    <circle cx="26" cy="92" r="2.5" class="point"/>
    <circle cx="76" cy="92" r="2.5" class="point"/>
    <circle cx="115" cy="92" r="2.5" class="point"/>
    <circle cx="150" cy="92" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="16" y="92" class="label">A</text>
    <text x="76" y="80" class="label">F</text>
    <text x="115" y="80" class="label">C</text>
    <text x="150" y="80" class="label">G</text>
    <text x="125" y="104" class="label">D</text>
</g>

</svg>
