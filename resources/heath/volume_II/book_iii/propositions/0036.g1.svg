<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 291 160" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="291" height="160" fill="#ffffff"/>

<g id="circle-O" class="interactive">
    <circle cx="78" cy="80" r="64" class="geometry"/>
</g>
<g id="circle-O-prime" class="interactive">
    <circle cx="228" cy="80" r="48" class="geometry"/>
</g>
<g id="line-OO-prime" class="interactive">
    <line x1="78" y1="80" x2="228" y2="80" class="geometry"/>
</g>
<g id="line-O-prime-B" class="interactive">
    <line x1="228" y1="80" x2="128" y2="119" class="geometry"/>
</g>
<g id="lines-OC-O-prime-C" class="interactive">
    <line x1="78" y1="80" x2="62" y2="50" class="construction"/>
    <line x1="228" y1="80" x2="62" y2="50" class="construction"/>
</g>
<g id="points">
    <circle cx="78" cy="80" r="2.5" class="point"/>
    <circle cx="228" cy="80" r="2.5" class="point"/>
    <circle cx="142" cy="80" r="2.5" class="point"/>
    <circle cx="128" cy="119" r="2.5" class="point"/>
    <circle cx="62" cy="50" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="78" y="94" class="label">O</text>
    <text x="234" y="94" class="label">O'</text>
    <text x="150" y="92" class="label">A</text>
    <text x="136" y="130" class="label">B</text>
    <text x="53" y="40" class="label">C</text>
</g>

</svg>
