<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 173" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="184" height="173" fill="#ffffff"/>

<g id="circle-O-prime" class="interactive">
    <circle cx="92" cy="87" r="73" class="geometry"/>
</g>
<g id="circle-O" class="interactive">
    <circle cx="71" cy="87" r="31" class="geometry"/>
</g>
<g id="line-A-prime-O-prime" class="interactive">
    <line x1="19" y1="87" x2="102" y2="87" class="geometry"/>
</g>
<g id="points">
    <circle cx="19" cy="87" r="2.5" class="point"/>
    <circle cx="40" cy="87" r="2.5" class="point"/>
    <circle cx="71" cy="87" r="2.5" class="point"/>
    <circle cx="92" cy="87" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="10" y="93" class="label">A'</text>
    <text x="33" y="95" class="label">A</text>
    <text x="71" y="99" class="label">O</text>
    <text x="92" y="99" class="label">O'</text>
</g>

</svg>
