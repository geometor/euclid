<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 164" width="247" height="164" class="euclid-graphic" data-graphic-id="0037.g1" data-folio="0037" data-graphic="g1" data-proposition="III.12">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke-dasharray: 3, 3;
      stroke-width: 1.8;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circles O and O') -->
  <g id="elements">
    <circle id="el-circle-O" data-ref="( O A )" data-aliases="( O ) | ( A B D )" data-type="circle" cx="54" cy="80" r="48" class="geom-circle" />
    <circle id="el-circle-Oprime" data-ref="( O' A )" data-aliases="( O' )" data-type="circle" cx="166" cy="80" r="64" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Segments & Polygons) -->
  <g id="graphics">
    <polygon id="el-tri-OCOprime" data-ref="&lt; O C O' &gt;" data-type="polygon" points="54,80 46,52 166,80" class="geom-polygon" />

    <!-- Collinear segments along OO' -->
    <line id="el-seg-OA" data-ref="/ O A /" data-aliases="/ A O / | r" data-type="segment" x1="54" y1="80" x2="102" y2="80" class="geom-line" />
    <line id="el-seg-OprimeA" data-ref="/ O' A /" data-aliases="/ A O' / | r'" data-type="segment" x1="102" y1="80" x2="166" y2="80" class="geom-line" />
    <line id="el-seg-OOprime" data-ref="/ O O' /" data-aliases="/ O' O /" data-type="segment" x1="54" y1="80" x2="166" y2="80" class="geom-line geom-overlay" />

    <!-- Dashed segments O'B and C-D-O' -->
    <line id="el-seg-OprimeB" data-ref="/ O' B /" data-aliases="/ B O' /" data-type="segment" x1="166" y1="80" x2="89.10" y2="112.74" class="geom-line geom-dashed" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="46" y1="52" x2="99.30" y2="64.44" class="geom-line geom-dashed" />
    <line id="el-seg-DOprime" data-ref="/ D O' /" data-aliases="/ O' D /" data-type="segment" x1="99.30" y1="64.44" x2="166" y2="80" class="geom-line geom-dashed" />
    <line id="el-seg-OprimeC" data-ref="/ O' C /" data-aliases="/ C O' /" data-type="segment" x1="166" y1="80" x2="46" y2="52" class="geom-line geom-dashed geom-overlay" />
    <line id="el-seg-OC" data-ref="/ O C /" data-aliases="/ C O /" data-type="segment" x1="54" y1="80" x2="46" y2="52" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-OCOprime" data-ref="&lt; O C O' &gt;" points="54,80 46,52 166,80" class="geom-polygon geom-overlay" />
    <circle id="hl-circle-O" data-ref="( O A )" data-aliases="( O ) | ( A B D )" cx="54" cy="80" r="48" class="geom-circle geom-overlay" />
    <circle id="hl-circle-Oprime" data-ref="( O' A )" data-aliases="( O' )" cx="166" cy="80" r="64" class="geom-circle geom-overlay" />

    <line id="hl-seg-OA" data-ref="/ O A /" data-aliases="/ A O / | r" x1="54" y1="80" x2="102" y2="80" class="geom-line geom-overlay" />
    <line id="hl-seg-OprimeA" data-ref="/ O' A /" data-aliases="/ A O' / | r'" x1="102" y1="80" x2="166" y2="80" class="geom-line geom-overlay" />
    <line id="hl-seg-OOprime" data-ref="/ O O' /" data-aliases="/ O' O /" x1="54" y1="80" x2="166" y2="80" class="geom-line geom-overlay" />
    <line id="hl-seg-OprimeB" data-ref="/ O' B /" data-aliases="/ B O' /" x1="166" y1="80" x2="89.10" y2="112.74" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="46" y1="52" x2="99.30" y2="64.44" class="geom-line geom-overlay" />
    <line id="hl-seg-DOprime" data-ref="/ D O' /" data-aliases="/ O' D /" x1="99.30" y1="64.44" x2="166" y2="80" class="geom-line geom-overlay" />
    <line id="hl-seg-OprimeC" data-ref="/ O' C /" data-aliases="/ C O' /" x1="166" y1="80" x2="46" y2="52" class="geom-line geom-overlay" />
    <line id="hl-seg-OC" data-ref="/ O C /" data-aliases="/ C O /" x1="54" y1="80" x2="46" y2="52" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-O" data-ref="O" data-type="point" cx="54" cy="80" r="3.5" class="geom-point" />
    <circle id="el-pt-Oprime" data-ref="O'" data-type="point" cx="166" cy="80" r="3.5" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="102" cy="80" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="89.10" cy="112.74" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="46" cy="52" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="99.30" cy="64.44" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-O" data-ref="O" x="54" y="96" text-anchor="middle" class="geom-label">O</text>
    <text id="lbl-Oprime" data-ref="O'" x="172" y="96" text-anchor="middle" class="geom-label">O'</text>
    <text id="lbl-A" data-ref="A" x="111" y="94" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="96" y="128" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="39" y="51" text-anchor="end" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="100" y="56" text-anchor="middle" class="geom-label">D</text>
  </g>
</svg>
