<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 164" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="247" height="164" fill="#ffffff"/>

<g id="circle-O" class="interactive">
    <circle cx="54" cy="80" r="48" class="geometry"/>
</g>
<g id="circle-O-prime" class="interactive">
    <circle cx="166" cy="80" r="64" class="geometry"/>
</g>
<g id="line-OO-prime" class="interactive">
    <line x1="54" y1="80" x2="166" y2="80" class="geometry"/>
</g>
<g id="line-O-prime-B" class="interactive">
    <line x1="166" y1="80" x2="89" y2="113" class="geometry"/>
</g>
<g id="lines-OC-O-prime-C" class="interactive">
    <line x1="54" y1="80" x2="46" y2="52" class="construction"/>
    <line x1="166" y1="80" x2="46" y2="52" class="construction"/>
</g>
<g id="points">
    <circle cx="54" cy="80" r="2.5" class="point"/>
    <circle cx="166" cy="80" r="2.5" class="point"/>
    <circle cx="102" cy="80" r="2.5" class="point"/>
    <circle cx="89" cy="113" r="2.5" class="point"/>
    <circle cx="46" cy="52" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="54" y="93" class="label">O</text>
    <text x="172" y="93" class="label">O'</text>
    <text x="111" y="91" class="label">A</text>
    <text x="96" y="125" class="label">B</text>
    <text x="48" y="42" class="label">C</text>
</g>

</svg>
