<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 266 170" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="266" height="170" fill="#ffffff"/>

<g id="circle-O" class="interactive">
    <circle cx="88" cy="84" r="61" class="geometry"/>
</g>
<g id="circle-O-prime" class="interactive">
    <circle cx="181" cy="84" r="69" class="geometry"/>
</g>
<g id="line-MO-prime" class="interactive">
    <line x1="27" y1="84" x2="181" y2="84" class="geometry"/>
</g>
<g id="chord-AB" class="interactive">
    <line x1="130" y1="39.7" x2="130" y2="128.3" class="geometry"/>
</g>
<g id="points">
    <circle cx="27" cy="84" r="2.5" class="point"/>
    <circle cx="88" cy="84" r="2.5" class="point"/>
    <circle cx="149" cy="84" r="2.5" class="point"/>
    <circle cx="181" cy="84" r="2.5" class="point"/>
    <circle cx="130" cy="39.7" r="2.5" class="point"/>
    <circle cx="130" cy="128.3" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="16" y="86" class="label">M</text>
    <text x="88" y="96" class="label">O</text>
    <text x="155" y="76" class="label">L</text>
    <text x="187" y="96" class="label">O'</text>
    <text x="130" y="26" class="label">A</text>
    <text x="130" y="143" class="label">B</text>
</g>

</svg>
