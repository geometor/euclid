<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 227 170" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="227" height="170" fill="#ffffff"/>

<g id="circle-O" class="interactive">
    <circle cx="86" cy="86" r="58" class="geometry"/>
</g>
<g id="circle-O-prime" class="interactive">
    <circle cx="144" cy="86" r="67" class="geometry"/>
</g>
<g id="line-MO-prime" class="interactive">
    <line x1="28" y1="86" x2="144" y2="86" class="geometry"/>
</g>
<g id="chord-AB" class="interactive">
    <line x1="107" y1="32" x2="107" y2="140" class="geometry"/>
</g>
<g id="points">
    <circle cx="28" cy="86" r="2.5" class="point"/>
    <circle cx="86" cy="86" r="2.5" class="point"/>
    <circle cx="144" cy="86" r="2.5" class="point"/>
    <circle cx="107" cy="32" r="2.5" class="point"/>
    <circle cx="107" cy="140" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="17" y="86" class="label">M</text>
    <text x="86" y="98" class="label">O</text>
    <text x="153" y="77" class="label">L</text>
    <text x="155" y="96" class="label">O'</text>
    <text x="105" y="20" class="label">A</text>
    <text x="107" y="153" class="label">B</text>
</g>

</svg>
