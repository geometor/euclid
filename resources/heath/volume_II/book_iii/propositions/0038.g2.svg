<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197 172" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="197" height="172" fill="#ffffff"/>

<g id="circle-O" class="interactive">
    <circle cx="90" cy="85" r="59" class="geometry"/>
</g>
<g id="circle-O-prime" class="interactive">
    <circle cx="112" cy="85" r="68" class="geometry"/>
</g>
<g id="line-ML" class="interactive">
    <line x1="31" y1="85" x2="149" y2="85" class="geometry"/>
</g>
<g id="chord-AB" class="interactive">
    <line x1="72" y1="28.8" x2="72" y2="141.2" class="geometry"/>
</g>
<g id="points">
    <circle cx="31" cy="85" r="2.5" class="point"/>
    <circle cx="90" cy="85" r="2.5" class="point"/>
    <circle cx="112" cy="85" r="2.5" class="point"/>
    <circle cx="149" cy="85" r="2.5" class="point"/>
    <circle cx="72" cy="28.8" r="2.5" class="point"/>
    <circle cx="72" cy="141.2" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="19" y="85" class="label">M</text>
    <text x="90" y="97" class="label">O</text>
    <text x="116" y="97" class="label">O'</text>
    <text x="158" y="84" class="label">L</text>
    <text x="70" y="18" class="label">A</text>
    <text x="72" y="153" class="label">B</text>
</g>

</svg>
