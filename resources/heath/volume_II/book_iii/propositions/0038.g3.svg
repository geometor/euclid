<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 262 256" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="262" height="256" fill="#ffffff"/>

<g id="circle-ABDC" class="interactive">
    <circle cx="95" cy="158" r="80" class="geometry"/>
</g>
<g id="circle-EBFD" class="interactive">
    <path d="M 40,216 A 65,65 0 0,1 150,216 A 75,75 0 0,1 40,216 Z" class="geometry"/>
</g>
<g id="circle-ACK" class="interactive">
    <circle cx="181" cy="70" r="54" class="geometry"/>
</g>
<g id="line-BGHD" class="interactive">
    <line x1="40" y1="216" x2="150" y2="216" class="geometry"/>
</g>
<g id="chord-AC" class="interactive">
    <line x1="128" y1="85" x2="161" y2="113" class="geometry"/>
</g>
<g id="points">
    <circle cx="40" cy="216" r="2.5" class="point"/>
    <circle cx="75" cy="216" r="2.5" class="point"/>
    <circle cx="115" cy="216" r="2.5" class="point"/>
    <circle cx="150" cy="216" r="2.5" class="point"/>
    <circle cx="128" cy="85" r="2.5" class="point"/>
    <circle cx="161" cy="113" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="120" y="74" class="label">A</text>
    <text x="31" y="223" class="label">B</text>
    <text x="98" y="130" class="label">E</text>
    <text x="75" y="205" class="label">G</text>
    <text x="94" y="226" class="label">F</text>
    <text x="115" y="205" class="label">H</text>
    <text x="160" y="221" class="label">D</text>
    <text x="172" y="124" class="label">C</text>
    <text x="242" y="49" class="label">K</text>
</g>

</svg>
