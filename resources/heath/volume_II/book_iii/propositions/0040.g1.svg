<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 164" width="188" height="164" class="euclid-graphic" data-graphic-id="0040.g1" data-folio="0040" data-graphic="g1" data-proposition="III.13">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Outer Circle ABC, Inner Curve EBF, Bisector Line GH) -->
  <g id="elements">
    <circle id="el-circle-ABC" data-ref="( A B C )" data-aliases="( A B D C ); ( B A C )" data-type="circle" cx="92" cy="86" r="71" class="geom-circle" />
    <path id="el-circle-EBF" data-ref="( E B F )" data-aliases="( E B D F ); ( B E F )" data-type="circle" d="M 36,42.35 A 59.5,57 0 1,1 36,129.65 A 60,60 0 0,1 36,42.35 Z" class="geom-circle" />
    <line id="el-line-GH" data-ref="[ G H ]" data-aliases="[ H G ]" data-type="line" x1="21" y1="86" x2="163" y2="86" class="geom-line geom-overlay" />
  </g>

  <!-- Constructed Graphics (Chord BD and Perpendicular Bisector GH) -->
  <g id="graphics">
    <line id="el-seg-BM" data-ref="/ B M /" data-type="segment" x1="36" y1="42.35" x2="36" y2="86" class="geom-line" />
    <line id="el-seg-MD" data-ref="/ M D /" data-type="segment" x1="36" y1="86" x2="36" y2="129.65" class="geom-line" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="36" y1="42.35" x2="36" y2="129.65" class="geom-line geom-overlay" />

    <line id="el-seg-GM" data-ref="/ G M /" data-type="segment" x1="21" y1="86" x2="36" y2="86" class="geom-line" />
    <line id="el-seg-MH" data-ref="/ M H /" data-type="segment" x1="36" y1="86" x2="163" y2="86" class="geom-line" />
    <line id="el-seg-GH" data-ref="/ G H /" data-aliases="/ H G /" data-type="segment" x1="21" y1="86" x2="163" y2="86" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circle-ABC" data-ref="( A B C )" data-aliases="( A B D C ); ( B A C )" cx="92" cy="86" r="71" class="geom-circle geom-overlay" />
    <path id="hl-circle-EBF" data-ref="( E B F )" data-aliases="( E B D F ); ( B E F )" d="M 36,42.35 A 59.5,57 0 1,1 36,129.65 A 60,60 0 0,1 36,42.35 Z" class="geom-circle geom-overlay" />
    <line id="hl-line-GH" data-ref="[ G H ]" data-aliases="[ H G ]" x1="21" y1="86" x2="163" y2="86" class="geom-line geom-overlay" />

    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="36" y1="42.35" x2="36" y2="129.65" class="geom-line geom-overlay" />
    <line id="hl-seg-GH" data-ref="/ G H /" data-aliases="/ H G /" x1="21" y1="86" x2="163" y2="86" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="36" cy="42.35" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="36" cy="129.65" r="3.5" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="21" cy="86" r="3.5" class="geom-point" />
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="163" cy="86" r="3.5" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="146.94" cy="40.96" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="146.94" cy="131.04" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="122.45" cy="48.55" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="122.45" cy="123.45" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-B" data-ref="B" x="28" y="38" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-D" data-ref="D" x="25" y="138" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-A" data-ref="A" x="155" y="39" text-anchor="start" class="geom-label">A</text>
    <text id="lbl-C" data-ref="C" x="155" y="142" text-anchor="start" class="geom-label">C</text>
    <text id="lbl-E" data-ref="E" x="131" y="49" text-anchor="start" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="131" y="130" text-anchor="start" class="geom-label">F</text>
    <text id="lbl-G" data-ref="G" x="11" y="91" text-anchor="middle" class="geom-label">G</text>
    <text id="lbl-H" data-ref="H" x="174" y="91" text-anchor="middle" class="geom-label">H</text>
  </g>
</svg>
