<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 164" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="188" height="164" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="92" cy="86" r="71" class="geometry"/>
</g>
<g id="circle-EBF" class="interactive">
    <path d="M 36,42 A 58,58 0 1,1 36,130 A 71,71 0 0,0 36,42 Z" class="geometry"/>
    <circle cx="74" cy="86" r="59" class="geometry"/>
</g>
<g id="chord-BD" class="interactive">
    <line x1="36" y1="42" x2="36" y2="130" class="geometry"/>
</g>
<g id="line-GH" class="interactive">
    <line x1="21" y1="86" x2="163" y2="86" class="geometry"/>
</g>
<g id="points">
    <circle cx="36" cy="42" r="2.5" class="point"/>
    <circle cx="36" cy="130" r="2.5" class="point"/>
    <circle cx="36" cy="86" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="28" y="38" class="label">B</text>
    <text x="25" y="130" class="label">D</text>
    <text x="154" y="38" class="label">A</text>
    <text x="153" y="138" class="label">C</text>
    <text x="133" y="49" class="label">E</text>
    <text x="133" y="122" class="label">F</text>
    <text x="12" y="86" class="label">G</text>
    <text x="172" y="86" class="label">H</text>
</g>

</svg>
