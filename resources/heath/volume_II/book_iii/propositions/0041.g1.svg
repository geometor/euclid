<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 162 169" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="162" height="169" fill="#ffffff"/>

<g id="circle-ABDC" class="interactive">
    <circle cx="85" cy="78" r="62" class="geometry"/>
</g>
<g id="chord-AB" class="interactive">
    <line x1="24" y1="66" x2="95" y2="139" class="geometry"/>
</g>
<g id="chord-CD" class="interactive">
    <line x1="121" y1="27.6" x2="121" y2="128.4" class="geometry"/>
</g>
<g id="perp-EF" class="interactive">
    <line x1="85" y1="78" x2="59.5" y2="102.5" class="construction"/>
</g>
<g id="perp-EG" class="interactive">
    <line x1="85" y1="78" x2="121" y2="78" class="construction"/>
</g>
<g id="radii-EA-EC" class="interactive">
    <line x1="85" y1="78" x2="95" y2="139" class="construction"/>
    <line x1="85" y1="78" x2="121" y2="128.4" class="construction"/>
</g>
<g id="points">
    <circle cx="85" cy="78" r="2.5" class="point"/>
    <circle cx="24" cy="66" r="2.5" class="point"/>
    <circle cx="95" cy="139" r="2.5" class="point"/>
    <circle cx="59.5" cy="102.5" r="2.5" class="point"/>
    <circle cx="121" cy="27.6" r="2.5" class="point"/>
    <circle cx="121" cy="128.4" r="2.5" class="point"/>
    <circle cx="121" cy="78" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="95" y="151" class="label">A</text>
    <text x="15" y="62" class="label">B</text>
    <text x="129" y="135" class="label">C</text>
    <text x="125" y="20" class="label">D</text>
    <text x="79" y="70" class="label">E</text>
    <text x="49" y="96" class="label">F</text>
    <text x="131" y="79" class="label">G</text>
</g>

</svg>
