<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 162 169" width="162" height="169" class="euclid-graphic" data-graphic-id="0041.g1" data-folio="0041" data-graphic="g1" data-proposition="III.14">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circle ABDC) -->
  <g id="elements">
    <circle id="el-circle-ABDC" data-ref="( E A )" data-aliases="( A B D C ); ( A B C D ); ( E C ); ( E D ); ( E B )" data-type="circle" cx="85" cy="78" r="62" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Right Triangles, Chords AB & CD, Perpendiculars EF & EG, Radii AE & EC, Right Angle Wedges) -->
  <g id="graphics">
    <polygon id="el-tri-EFA" data-ref="&lt; E F A &gt;" data-aliases="&lt; A E F &gt;" data-type="polygon" points="85,78 59.54,103.46 95.24,139.15" class="geom-polygon" />
    <polygon id="el-tri-EGC" data-ref="&lt; E G C &gt;" data-aliases="&lt; C E G &gt;" data-type="polygon" points="85,78 121,78 121,128.48" class="geom-polygon" />

    <!-- Chord AB and half-segments AF, FB -->
    <line id="el-seg-BF" data-ref="/ F B /" data-aliases="/ B F /" data-type="segment" x1="23.85" y1="67.76" x2="59.54" y2="103.46" class="geom-line" />
    <line id="el-seg-FA" data-ref="/ A F /" data-aliases="/ F A /" data-type="segment" x1="59.54" y1="103.46" x2="95.24" y2="139.15" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /; / A F B /" data-type="segment" x1="23.85" y1="67.76" x2="95.24" y2="139.15" class="geom-line geom-overlay" />

    <!-- Chord CD and half-segments CG, GD -->
    <line id="el-seg-DG" data-ref="/ G D /" data-aliases="/ D G /" data-type="segment" x1="121" y1="27.52" x2="121" y2="78" class="geom-line" />
    <line id="el-seg-GC" data-ref="/ C G /" data-aliases="/ G C /" data-type="segment" x1="121" y1="78" x2="121" y2="128.48" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /; / C G D /" data-type="segment" x1="121" y1="27.52" x2="121" y2="128.48" class="geom-line geom-overlay" />

    <!-- Perpendiculars EF, EG and Radii AE, EC -->
    <line id="el-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" data-type="segment" x1="85" y1="78" x2="59.54" y2="103.46" class="geom-line" />
    <line id="el-seg-EG" data-ref="/ E G /" data-aliases="/ G E /" data-type="segment" x1="85" y1="78" x2="121" y2="78" class="geom-line" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="95.24" y1="139.15" x2="85" y2="78" class="geom-line" />
    <line id="el-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" data-type="segment" x1="85" y1="78" x2="121" y2="128.48" class="geom-line" />

    <!-- Right-Angle Wedges at F and G -->
    <path id="el-ang-EFA" data-ref="&lt; E F A )" data-aliases="&lt; A F E )" data-type="wedge" d="M 59.54 103.46 L 69.44 93.56 A 14 14 0 0 1 69.44 113.36 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-EGC" data-ref="&lt; E G C )" data-aliases="&lt; C G E )" data-type="wedge" d="M 121 78 L 107 78 A 14 14 0 0 0 121 92 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circle-ABDC" data-ref="( E A )" data-aliases="( A B D C ); ( A B C D ); ( E C ); ( E D ); ( E B )" cx="85" cy="78" r="62" class="geom-circle geom-overlay" />
    <polygon id="hl-tri-EFA" data-ref="&lt; E F A &gt;" data-aliases="&lt; A E F &gt;" points="85,78 59.54,103.46 95.24,139.15" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-EGC" data-ref="&lt; E G C &gt;" data-aliases="&lt; C E G &gt;" points="85,78 121,78 121,128.48" class="geom-polygon geom-overlay" />

    <line id="hl-seg-BF" data-ref="/ F B /" data-aliases="/ B F /" x1="23.85" y1="67.76" x2="59.54" y2="103.46" class="geom-line geom-overlay" />
    <line id="hl-seg-FA" data-ref="/ A F /" data-aliases="/ F A /" x1="59.54" y1="103.46" x2="95.24" y2="139.15" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /; / A F B /" x1="23.85" y1="67.76" x2="95.24" y2="139.15" class="geom-line geom-overlay" />

    <line id="hl-seg-DG" data-ref="/ G D /" data-aliases="/ D G /" x1="121" y1="27.52" x2="121" y2="78" class="geom-line geom-overlay" />
    <line id="hl-seg-GC" data-ref="/ C G /" data-aliases="/ G C /" x1="121" y1="78" x2="121" y2="128.48" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /; / C G D /" x1="121" y1="27.52" x2="121" y2="128.48" class="geom-line geom-overlay" />

    <line id="hl-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" x1="85" y1="78" x2="59.54" y2="103.46" class="geom-line geom-overlay" />
    <line id="hl-seg-EG" data-ref="/ E G /" data-aliases="/ G E /" x1="85" y1="78" x2="121" y2="78" class="geom-line geom-overlay" />
    <line id="hl-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" x1="95.24" y1="139.15" x2="85" y2="78" class="geom-line geom-overlay" />
    <line id="hl-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" x1="85" y1="78" x2="121" y2="128.48" class="geom-line geom-overlay" />

    <path id="hl-ang-EFA" data-ref="&lt; E F A )" data-aliases="&lt; A F E )" d="M 59.54 103.46 L 69.44 93.56 A 14 14 0 0 1 69.44 113.36 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-EGC" data-ref="&lt; E G C )" data-aliases="&lt; C G E )" d="M 121 78 L 107 78 A 14 14 0 0 0 121 92 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="85" cy="78" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="23.85" cy="67.76" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="59.54" cy="103.46" r="3.5" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="95.24" cy="139.15" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="121" cy="27.52" r="3.5" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="121" cy="78" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="121" cy="128.48" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="95" y="154" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="15" y="65" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="129" y="139" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="125" y="23" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="79" y="73" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="50" y="112" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-G" data-ref="G" x="131" y="83" text-anchor="middle" class="geom-label">G</text>
  </g>
</svg>
