<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 183 211" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="183" height="211" fill="#ffffff"/>

<g id="circle-ABCD" class="interactive">
    <circle cx="91" cy="105" r="76" class="geometry"/>
</g>
<g id="diameter-AD" class="interactive">
    <line x1="91" y1="29" x2="91" y2="181" class="geometry"/>
</g>
<g id="chord-BC" class="interactive">
    <line x1="136" y1="43.8" x2="116" y2="176.8" class="geometry"/>
</g>
<g id="chord-FG" class="interactive">
    <line x1="39" y1="49.6" x2="29" y2="148.9" class="geometry"/>
</g>
<g id="chord-MN" class="interactive">
    <line x1="63" y1="34.4" x2="53" y2="170.8" class="construction"/>
</g>
<g id="perpendiculars-EH-EK" class="interactive">
    <line x1="91" y1="105" x2="126" y2="110" class="construction"/>
    <line x1="91" y1="105" x2="34" y2="99" class="construction"/>
</g>
