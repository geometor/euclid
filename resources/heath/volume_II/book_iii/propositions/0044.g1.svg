<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 242 199" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="242" height="199" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="158" cy="101" r="70" class="geometry"/>
</g>
<g id="diameter-BA" class="interactive">
    <line x1="158" y1="31" x2="158" y2="171" class="geometry"/>
</g>
<g id="tangent-AE" class="interactive">
    <line x1="158" y1="171" x2="24" y2="171" class="geometry"/>
</g>
<g id="line-AF" class="interactive">
    <line x1="158" y1="171" x2="28" y2="152" class="construction"/>
</g>
<g id="chord-AC-and-DC" class="interactive">
    <line x1="158" y1="171" x2="104" y2="145.6" class="construction"/>
    <line x1="158" y1="101" x2="104" y2="145.6" class="construction"/>
</g>
<g id="line-DGH" class="interactive">
    <line x1="158" y1="101" x2="134" y2="167.5" class="construction"/>
</g>
<g id="points">
    <circle cx="158" cy="101" r="2.5" class="point"/>
    <circle cx="158" cy="31" r="2.5" class="point"/>
    <circle cx="158" cy="171" r="2.5" class="point"/>
    <circle cx="104" cy="145.6" r="2.5" class="point"/>
    <circle cx="134" cy="167.5" r="2.5" class="point"/>
    <circle cx="141" cy="148" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="158" y="181" class="label">A</text>
    <text x="158" y="20" class="label">B</text>
    <text x="95" y="148" class="label">C</text>
    <text x="167" y="101" class="label">D</text>
    <text x="18" y="177" class="label">E</text>
    <text x="23" y="152" class="label">F</text>
    <text x="130" y="156" class="label">G</text>
    <text x="142" y="114" class="label">H</text>
</g>

</svg>
