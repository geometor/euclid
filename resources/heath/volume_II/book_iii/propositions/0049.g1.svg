<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 211 225" width="211" height="225" class="euclid-graphic" data-graphic-id="0049.g1" data-folio="0049" data-graphic="g1" data-proposition="III.17">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circles BCD & AFG) -->
  <g id="elements">
    <circle id="el-circle-AFG" data-ref="( E A )" data-aliases="( A F G )" data-type="circle" cx="105" cy="118" r="90" class="geom-circle" />
    <circle id="el-circle-BCD" data-ref="( E D )" data-aliases="( B C D )" data-type="circle" cx="105" cy="118" r="58" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Polygons, Segments, Angles) -->
  <g id="graphics">
    <!-- Polygons -->
    <polygon id="el-tri-DEF" data-ref="&lt; D E F &gt;" data-type="polygon" points="105,60 105,118 36.18,60" class="geom-polygon" />
    <polygon id="el-tri-BEA" data-ref="&lt; B E A &gt;" data-type="polygon" points="60.65,80.62 105,118 105,28" class="geom-polygon" />

    <!-- Segment AE (ED, DA) -->
    <line id="el-seg-ED" data-ref="/ E D /" data-aliases="/ D E /" data-type="segment" x1="105" y1="118" x2="105" y2="60" class="geom-line" />
    <line id="el-seg-DA" data-ref="/ D A /" data-aliases="/ A D /" data-type="segment" x1="105" y1="60" x2="105" y2="28" class="geom-line" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="105" y1="28" x2="105" y2="118" class="geom-line geom-overlay" />

    <!-- Segment EF (EB, BF) -->
    <line id="el-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" data-type="segment" x1="105" y1="118" x2="60.65" y2="80.62" class="geom-line" />
    <line id="el-seg-BF" data-ref="/ B F /" data-aliases="/ F B /" data-type="segment" x1="60.65" y1="80.62" x2="36.18" y2="60" class="geom-line" />
    <line id="el-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" data-type="segment" x1="105" y1="118" x2="36.18" y2="60" class="geom-line geom-overlay" />

    <!-- Segments DF and AB -->
    <line id="el-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" data-type="segment" x1="105" y1="60" x2="36.18" y2="60" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="105" y1="28" x2="60.65" y2="80.62" class="geom-line" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-DEF" data-ref="&lt; D E F )" data-aliases="&lt; B E A ); &lt; A E F )" data-type="wedge" d="M 105.00 118.00 L 105.00 94.00 A 24.0 24.0 0 0 0 86.65 102.53 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-EDF" data-ref="&lt; E D F )" data-aliases="&lt; F D E )" data-type="wedge" d="M 105.00 60.00 L 105.00 80.00 A 20.0 20.0 0 0 1 85.00 60.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-EBA" data-ref="&lt; E B A )" data-aliases="&lt; A B E )" data-type="wedge" d="M 60.65 80.62 L 73.53 65.34 A 20.0 20.0 0 0 1 75.94 93.51 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circle-AFG" data-ref="( E A )" data-aliases="( A F G )" cx="105" cy="118" r="90" class="geom-circle geom-overlay" />
    <circle id="hl-circle-BCD" data-ref="( E D )" data-aliases="( B C D )" cx="105" cy="118" r="58" class="geom-circle geom-overlay" />
    <polygon id="hl-tri-DEF" data-ref="&lt; D E F &gt;" points="105,60 105,118 36.18,60" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-BEA" data-ref="&lt; B E A &gt;" points="60.65,80.62 105,118 105,28" class="geom-polygon geom-overlay" />

    <line id="hl-seg-ED" data-ref="/ E D /" data-aliases="/ D E /" x1="105" y1="118" x2="105" y2="60" class="geom-line geom-overlay" />
    <line id="hl-seg-DA" data-ref="/ D A /" data-aliases="/ A D /" x1="105" y1="60" x2="105" y2="28" class="geom-line geom-overlay" />
    <line id="hl-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" x1="105" y1="28" x2="105" y2="118" class="geom-line geom-overlay" />

    <line id="hl-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" x1="105" y1="118" x2="60.65" y2="80.62" class="geom-line geom-overlay" />
    <line id="hl-seg-BF" data-ref="/ B F /" data-aliases="/ F B /" x1="60.65" y1="80.62" x2="36.18" y2="60" class="geom-line geom-overlay" />
    <line id="hl-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" x1="105" y1="118" x2="36.18" y2="60" class="geom-line geom-overlay" />

    <line id="hl-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" x1="105" y1="60" x2="36.18" y2="60" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="105" y1="28" x2="60.65" y2="80.62" class="geom-line geom-overlay" />

    <path id="hl-ang-DEF" data-ref="&lt; D E F )" data-aliases="&lt; B E A ); &lt; A E F )" d="M 105.00 118.00 L 105.00 94.00 A 24.0 24.0 0 0 0 86.65 102.53 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-EDF" data-ref="&lt; E D F )" data-aliases="&lt; F D E )" d="M 105.00 60.00 L 105.00 80.00 A 20.0 20.0 0 0 1 85.00 60.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-EBA" data-ref="&lt; E B A )" data-aliases="&lt; A B E )" d="M 60.65 80.62 L 73.53 65.34 A 20.0 20.0 0 0 1 75.94 93.51 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="105" cy="28" r="3" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="60.65" cy="80.62" r="3" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="163" cy="118" r="3" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="105" cy="60" r="3" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="105" cy="118" r="3" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="36.18" cy="60" r="3" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="173.94" cy="175.85" r="3" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="105" y="19" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="50" y="85" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="172" y="123" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="115" y="55" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="105" y="133" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="27" y="62" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-G" data-ref="G" x="184" y="183" text-anchor="middle" class="geom-label">G</text>
  </g>
</svg>
