<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 211 225" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="211" height="225" fill="#ffffff"/>

<g id="circle-AFG" class="interactive">
    <circle cx="105" cy="118" r="90" class="geometry"/>
</g>
<g id="circle-BCD" class="interactive">
    <circle cx="105" cy="118" r="58" class="geometry"/>
</g>
<g id="line-EA" class="interactive">
    <line x1="105" y1="118" x2="105" y2="28" class="geometry"/>
</g>
<g id="line-DF" class="interactive">
    <line x1="105" y1="60" x2="36" y2="60" class="construction"/>
</g>
<g id="line-EF" class="interactive">
    <line x1="105" y1="118" x2="36" y2="60" class="construction"/>
</g>
<g id="tangent-AB" class="interactive">
    <line x1="105" y1="28" x2="60.6" y2="80.7" class="geometry"/>
</g>
<g id="points">
    <circle cx="105" cy="118" r="2.5" class="point"/>
    <circle cx="105" cy="28" r="2.5" class="point"/>
    <circle cx="105" cy="60" r="2.5" class="point"/>
    <circle cx="36" cy="60" r="2.5" class="point"/>
    <circle cx="60.6" cy="80.7" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="105" y="19" class="label">A</text>
    <text x="50" y="83" class="label">B</text>
    <text x="171" y="121" class="label">C</text>
    <text x="114" y="53" class="label">D</text>
    <text x="105" y="129" class="label">E</text>
    <text x="29" y="59" class="label">F</text>
    <text x="182" y="180" class="label">G</text>
</g>

</svg>
