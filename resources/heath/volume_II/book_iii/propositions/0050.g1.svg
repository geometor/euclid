<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 239 219" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="239" height="219" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="96" cy="96" r="80" class="geometry"/>
</g>
<g id="tangent-DE" class="interactive">
    <line x1="212" y1="73" x2="128" y2="188" class="geometry"/>
</g>
<g id="radius-FC" class="interactive">
    <line x1="96" y1="96" x2="161" y2="143" class="geometry"/>
</g>
<g id="line-FBG" class="interactive">
    <line x1="96" y1="96" x2="190" y2="103" class="construction"/>
</g>
<g id="points">
    <circle cx="96" cy="96" r="2.5" class="point"/>
    <circle cx="161" cy="143" r="2.5" class="point"/>
    <circle cx="175.8" cy="101.9" r="2.5" class="point"/>
    <circle cx="190" cy="103" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="25" y="42" class="label">A</text>
    <text x="169" y="90" class="label">B</text>
    <text x="170" y="152" class="label">C</text>
    <text x="220" y="65" class="label">D</text>
    <text x="131" y="198" class="label">E</text>
    <text x="88" y="97" class="label">F</text>
    <text x="204" y="101" class="label">G</text>
</g>

</svg>
