<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 239 219" width="239" height="219" class="euclid-graphic" data-graphic-id="0050.g1" data-folio="0050" data-graphic="g1" data-proposition="III.18">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circle ABC & Tangent Line DE) -->
  <g id="elements">
    <circle id="el-circle-ABC" data-ref="( F C )" data-aliases="( A B C )" data-type="circle" cx="96" cy="96" r="80" class="geom-circle" />
    <line id="el-line-DE" data-ref="[ D E ]" data-aliases="[ E D ]" data-type="line" x1="211" y1="76" x2="127" y2="188" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Polygon, Segments, Angles) -->
  <g id="graphics">
    <polygon id="el-tri-FCG" data-ref="&lt; F C G &gt;" data-type="polygon" points="96,96 160,144 196,96" class="geom-polygon" />

    <!-- Tangent DE and Sub-Segments DG, GC, CE -->
    <line id="el-seg-DG" data-ref="/ D G /" data-aliases="/ G D /" data-type="segment" x1="211" y1="76" x2="196" y2="96" class="geom-line" />
    <line id="el-seg-GC" data-ref="/ G C /" data-aliases="/ C G /" data-type="segment" x1="196" y1="96" x2="160" y2="144" class="geom-line" />
    <line id="el-seg-CE" data-ref="/ C E /" data-aliases="/ E C /" data-type="segment" x1="160" y1="144" x2="127" y2="188" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="211" y1="76" x2="127" y2="188" class="geom-line geom-overlay" />

    <!-- Radius FC -->
    <line id="el-seg-FC" data-ref="/ F C /" data-aliases="/ C F /" data-type="segment" x1="96" y1="96" x2="160" y2="144" class="geom-line" />

    <!-- Supposed Perpendicular FG (FB, BG) -->
    <line id="el-seg-FB" data-ref="/ F B /" data-aliases="/ B F /" data-type="segment" x1="96" y1="96" x2="176" y2="96" class="geom-line" />
    <line id="el-seg-BG" data-ref="/ B G /" data-aliases="/ G B /" data-type="segment" x1="176" y1="96" x2="196" y2="96" class="geom-line" />
    <line id="el-seg-FG" data-ref="/ F G /" data-aliases="/ G F /" data-type="segment" x1="96" y1="96" x2="196" y2="96" class="geom-line geom-overlay" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-FGC" data-ref="&lt; F G C )" data-aliases="&lt; C G F )" data-type="wedge" d="M 196.00 96.00 L 176.00 96.00 A 20.0 20.0 0 0 0 184.00 112.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-FCG" data-ref="&lt; F C G )" data-aliases="&lt; G C F )" data-type="wedge" d="M 160.00 144.00 L 144.00 132.00 A 20.0 20.0 0 0 1 172.00 128.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circle-ABC" data-ref="( F C )" data-aliases="( A B C )" cx="96" cy="96" r="80" class="geom-circle geom-overlay" />
    <polygon id="hl-tri-FCG" data-ref="&lt; F C G &gt;" points="96,96 160,144 196,96" class="geom-polygon geom-overlay" />

    <line id="hl-seg-DG" data-ref="/ D G /" data-aliases="/ G D /" x1="211" y1="76" x2="196" y2="96" class="geom-line geom-overlay" />
    <line id="hl-seg-GC" data-ref="/ G C /" data-aliases="/ C G /" x1="196" y1="96" x2="160" y2="144" class="geom-line geom-overlay" />
    <line id="hl-seg-CE" data-ref="/ C E /" data-aliases="/ E C /" x1="160" y1="144" x2="127" y2="188" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D / | [ D E ] | [ E D ]" x1="211" y1="76" x2="127" y2="188" class="geom-line geom-overlay" />

    <line id="hl-seg-FC" data-ref="/ F C /" data-aliases="/ C F /" x1="96" y1="96" x2="160" y2="144" class="geom-line geom-overlay" />

    <line id="hl-seg-FB" data-ref="/ F B /" data-aliases="/ B F /" x1="96" y1="96" x2="176" y2="96" class="geom-line geom-overlay" />
    <line id="hl-seg-BG" data-ref="/ B G /" data-aliases="/ G B /" x1="176" y1="96" x2="196" y2="96" class="geom-line geom-overlay" />
    <line id="hl-seg-FG" data-ref="/ F G /" data-aliases="/ G F /" x1="96" y1="96" x2="196" y2="96" class="geom-line geom-overlay" />

    <path id="hl-ang-FGC" data-ref="&lt; F G C )" data-aliases="&lt; C G F )" d="M 196.00 96.00 L 176.00 96.00 A 20.0 20.0 0 0 0 184.00 112.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-FCG" data-ref="&lt; F C G )" data-aliases="&lt; G C F )" d="M 160.00 144.00 L 144.00 132.00 A 20.0 20.0 0 0 1 172.00 128.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="32" cy="48" r="3" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="176" cy="96" r="3" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="160" cy="144" r="3" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="211" cy="76" r="3" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="127" cy="188" r="3" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="96" cy="96" r="3" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="196" cy="96" r="3" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="23" y="44" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="169" y="89" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="171" y="153" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="220" y="69" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="131" y="201" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="86" y="100" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-G" data-ref="G" x="206" y="104" text-anchor="middle" class="geom-label">G</text>
  </g>
</svg>
