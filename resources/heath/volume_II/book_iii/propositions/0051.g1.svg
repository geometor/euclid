<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 239 221" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="239" height="221" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="106" cy="110" r="80" class="geometry"/>
</g>
<g id="tangent-DE" class="interactive">
    <line x1="20" y1="190" x2="215" y2="190" class="geometry"/>
</g>
<g id="line-CA" class="interactive">
    <line x1="106" y1="190" x2="106" y2="30" class="geometry"/>
</g>
<g id="line-CF" class="interactive">
    <line x1="106" y1="190" x2="132" y2="104" class="construction"/>
</g>
<g id="points">
    <circle cx="106" cy="190" r="2.5" class="point"/>
    <circle cx="106" cy="30" r="2.5" class="point"/>
    <circle cx="132" cy="104" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="106" y="20" class="label">A</text>
    <text x="195" y="92" class="label">B</text>
    <text x="106" y="201" class="label">C</text>
    <text x="20" y="201" class="label">D</text>
    <text x="219" y="201" class="label">E</text>
    <text x="132" y="94" class="label">F</text>
</g>

</svg>
