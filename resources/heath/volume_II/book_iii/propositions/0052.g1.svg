<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 214 212" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="214" height="212" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="103" cy="106" r="81" class="geometry"/>
</g>
<g id="angle-BAC" class="interactive">
    <line x1="136" y1="32" x2="25" y2="84" class="geometry"/>
    <line x1="136" y1="32" x2="180" y2="132" class="geometry"/>
</g>
<g id="angle-BEC" class="interactive">
    <line x1="103" y1="106" x2="25" y2="84" class="geometry"/>
    <line x1="103" y1="106" x2="180" y2="132" class="geometry"/>
</g>
<g id="line-AEF" class="interactive">
    <line x1="136" y1="32" x2="70" y2="180" class="construction"/>
</g>
<g id="points">
    <circle cx="103" cy="106" r="2.5" class="point"/>
    <circle cx="136" cy="32" r="2.5" class="point"/>
    <circle cx="25" cy="84" r="2.5" class="point"/>
    <circle cx="180" cy="132" r="2.5" class="point"/>
    <circle cx="70" cy="180" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="139" y="20" class="label">A</text>
    <text x="16" y="80" class="label">B</text>
    <text x="191" y="135" class="label">C</text>
    <text x="94" y="114" class="label">E</text>
    <text x="72" y="192" class="label">F</text>
</g>

</svg>
