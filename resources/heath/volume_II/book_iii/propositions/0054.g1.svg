<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 204 239" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="204" height="239" fill="#ffffff"/>

<g id="circle-ABEC" class="interactive">
    <circle cx="98" cy="118" r="88" class="geometry"/>
</g>
<g id="angle-BAC" class="interactive">
    <line x1="108" y1="30.6" x2="64" y2="199.2" class="geometry"/>
    <line x1="108" y1="30.6" x2="132" y2="199.2" class="geometry"/>
</g>
<g id="angle-BEC" class="interactive">
    <line x1="98" y1="206" x2="64" y2="199.2" class="geometry"/>
    <line x1="98" y1="206" x2="132" y2="199.2" class="geometry"/>
</g>
<g id="diameters-BDF-CDG" class="interactive">
    <line x1="64" y1="199.2" x2="132" y2="36.8" class="construction"/>
    <line x1="132" y1="199.2" x2="64" y2="36.8" class="construction"/>
</g>
<g id="radius-DE" class="interactive">
    <line x1="98" y1="118" x2="98" y2="206" class="construction"/>
</g>
<g id="points">
    <circle cx="98" cy="118" r="2.5" class="point"/>
    <circle cx="108" cy="30.6" r="2.5" class="point"/>
    <circle cx="64" cy="199.2" r="2.5" class="point"/>
    <circle cx="132" cy="199.2" r="2.5" class="point"/>
    <circle cx="98" cy="206" r="2.5" class="point"/>
    <circle cx="132" cy="36.8" r="2.5" class="point"/>
    <circle cx="64" cy="36.8" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="111" y="21" class="label">A</text>
    <text x="60" y="211" class="label">B</text>
    <text x="136" y="211" class="label">C</text>
    <text x="108" y="120" class="label">D</text>
    <text x="108" y="220" class="label">E</text>
    <text x="139" y="28" class="label">F</text>
    <text x="61" y="26" class="label">G</text>
</g>

</svg>
