<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 214" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="208" height="214" fill="#ffffff"/>

<g id="circle-ABCD" class="interactive">
    <circle cx="99" cy="103" r="82" class="geometry"/>
</g>
<g id="angle-BAD" class="interactive">
    <line x1="66" y1="27.9" x2="38" y2="157.8" class="geometry"/>
    <line x1="66" y1="27.9" x2="160" y2="157.8" class="geometry"/>
</g>
<g id="angle-BED" class="interactive">
    <line x1="180" y1="91" x2="38" y2="157.8" class="geometry"/>
    <line x1="180" y1="91" x2="160" y2="157.8" class="geometry"/>
</g>
<g id="angle-BFD" class="interactive">
    <line x1="99" y1="103" x2="38" y2="157.8" class="construction"/>
    <line x1="99" y1="103" x2="160" y2="157.8" class="construction"/>
</g>
<g id="points">
    <circle cx="99" cy="103" r="2.5" class="point"/>
    <circle cx="66" cy="27.9" r="2.5" class="point"/>
    <circle cx="180" cy="91" r="2.5" class="point"/>
    <circle cx="38" cy="157.8" r="2.5" class="point"/>
    <circle cx="160" cy="157.8" r="2.5" class="point"/>
    <circle cx="99" cy="185" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="62" y="18" class="label">A</text>
    <text x="27" y="160" class="label">B</text>
    <text x="99" y="197" class="label">C</text>
    <text x="171" y="160" class="label">D</text>
    <text x="190" y="92" class="label">E</text>
    <text x="99" y="92" class="label">F</text>
</g>

</svg>
