<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 214" width="208" height="214" class="euclid-graphic" data-graphic-id="0055.g1" data-folio="0055" data-graphic="g1" data-proposition="III.21">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circle ABCD) -->
  <g id="elements">
    <circle id="el-circle-ABCD" data-ref="( F C )" data-aliases="( A B C D )" data-type="circle" cx="99" cy="103" r="82" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Polygons, Circular Segment BAED, Arc BCD, Segments, Angles) -->
  <g id="graphics">
    <polygon id="el-tri-BAD" data-ref="&lt; B A D &gt;" data-type="polygon" points="38,157.84 66,27.91 160,157.84" class="geom-polygon" />
    <polygon id="el-tri-BED" data-ref="&lt; B E D &gt;" data-type="polygon" points="38,157.84 180.12,91 160,157.84" class="geom-polygon" />

    <!-- Circular Segment BAED and Base Circumference BCD -->
    <path id="el-cseg-BAED" data-ref="&lt; B A E D )" data-aliases="( B A E D )" data-type="wedge" d="M 38.00 157.84 A 82.0 82.0 0 1 1 160.00 157.84 Z" class="wedge angle geom-overlay" />
    <path id="el-arc-BCD" data-ref="( B C D )" data-aliases="&lt; B C D )" data-type="arc" d="M 38.00 157.84 A 82.0 82.0 0 0 0 160.00 157.84" class="geom-arc geom-overlay" />

    <!-- Chords AB, AD, EB, ED, BD and Radii BF, FD -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="66" y1="27.91" x2="38" y2="157.84" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="66" y1="27.91" x2="160" y2="157.84" class="geom-line" />
    <line id="el-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" data-type="segment" x1="180.12" y1="91" x2="38" y2="157.84" class="geom-line" />
    <line id="el-seg-ED" data-ref="/ E D /" data-aliases="/ D E /" data-type="segment" x1="180.12" y1="91" x2="160" y2="157.84" class="geom-line" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="38" y1="157.84" x2="160" y2="157.84" class="geom-line" />
    <line id="el-seg-BF" data-ref="/ B F /" data-aliases="/ F B /" data-type="segment" x1="38" y1="157.84" x2="99" y2="103" class="geom-line" />
    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" data-type="segment" x1="99" y1="103" x2="160" y2="157.84" class="geom-line" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-BAD" data-ref="&lt; B A D )" data-aliases="&lt; D A B )" data-type="wedge" d="M 66.00 27.91 L 79.96 47.20 A 23.8 23.8 0 0 1 61.00 51.19 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BED" data-ref="&lt; B E D )" data-aliases="&lt; D E B )" data-type="wedge" d="M 180.12 91.00 L 173.28 113.73 A 23.8 23.8 0 0 1 158.59 101.12 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BFD" data-ref="&lt; B F D )" data-aliases="&lt; D F B )" data-type="wedge" d="M 99.00 103.00 L 116.85 119.04 A 24.0 24.0 0 0 1 81.15 119.04 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circle-ABCD" data-ref="( F C )" data-aliases="( A B C D )" cx="99" cy="103" r="82" class="geom-circle geom-overlay" />
    <path id="hl-cseg-BAED" data-ref="&lt; B A E D )" data-aliases="( B A E D )" d="M 38.00 157.84 A 82.0 82.0 0 1 1 160.00 157.84 Z" class="wedge angle geom-overlay" />
    <path id="hl-arc-BCD" data-ref="( B C D )" data-aliases="&lt; B C D )" d="M 38.00 157.84 A 82.0 82.0 0 0 0 160.00 157.84" class="geom-arc geom-overlay" />
    <polygon id="hl-tri-BAD" data-ref="&lt; B A D &gt;" points="38,157.84 66,27.91 160,157.84" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-BED" data-ref="&lt; B E D &gt;" points="38,157.84 180.12,91 160,157.84" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="66" y1="27.91" x2="38" y2="157.84" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="66" y1="27.91" x2="160" y2="157.84" class="geom-line geom-overlay" />
    <line id="hl-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" x1="180.12" y1="91" x2="38" y2="157.84" class="geom-line geom-overlay" />
    <line id="hl-seg-ED" data-ref="/ E D /" data-aliases="/ D E /" x1="180.12" y1="91" x2="160" y2="157.84" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="38" y1="157.84" x2="160" y2="157.84" class="geom-line geom-overlay" />
    <line id="hl-seg-BF" data-ref="/ B F /" data-aliases="/ F B /" x1="38" y1="157.84" x2="99" y2="103" class="geom-line geom-overlay" />
    <line id="hl-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" x1="99" y1="103" x2="160" y2="157.84" class="geom-line geom-overlay" />

    <path id="hl-ang-BAD" data-ref="&lt; B A D )" data-aliases="&lt; D A B )" d="M 66.00 27.91 L 79.96 47.20 A 23.8 23.8 0 0 1 61.00 51.19 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-BED" data-ref="&lt; B E D )" data-aliases="&lt; D E B )" d="M 180.12 91.00 L 173.28 113.73 A 23.8 23.8 0 0 1 158.59 101.12 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-BFD" data-ref="&lt; B F D )" data-aliases="&lt; D F B )" d="M 99.00 103.00 L 116.85 119.04 A 24.0 24.0 0 0 1 81.15 119.04 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="66" cy="27.91" r="3" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="38" cy="157.84" r="3" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="99" cy="185" r="3" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="160" cy="157.84" r="3" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="180.12" cy="91" r="3" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="99" cy="103" r="3" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="62" y="18" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="27" y="163" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="99" y="199" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="171" y="163" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="191" y="94" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="99" y="94" text-anchor="middle" class="geom-label">F</text>
  </g>
</svg>
