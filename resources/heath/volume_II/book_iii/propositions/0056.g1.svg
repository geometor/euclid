    <path id="el-ang-CAD" data-ref="&lt; C A D )" data-aliases="&lt; D A C )" data-type="wedge" d="M 38.00 29.03 L 55.14 34.50 A 18.0 18.0 0 0 1 48.39 43.72 Z" class="wedge angle geom-overlay" />
