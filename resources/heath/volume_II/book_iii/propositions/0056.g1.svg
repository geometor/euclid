    <path id="el-cseg-BADC" data-ref="&lt; B A D C )" data-aliases="( B A D C )" data-type="wedge" d="M 12.01 63.50 A 71.0 71.0 0 1 1 120.00 144.97 Z" class="wedge angle geom-overlay" />
