    <path id="el-ang-BED" data-ref="&lt; B E D )" data-aliases="&lt; D E B )" data-type="wedge" d="M 110.00 23.13 L 123.36 37.99 A 20.0 20.0 0 0 1 91.50 30.75 Z" class="wedge angle geom-overlay" />
