<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 175" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="180" height="175" fill="#ffffff"/>

<g id="circle-ABCD" class="interactive">
    <circle cx="79" cy="87" r="71" class="geometry"/>
</g>
<g id="angle-BAD" class="interactive">
    <line x1="38" y1="29" x2="12" y2="63.5" class="geometry"/>
    <line x1="38" y1="29" x2="146" y2="63.5" class="geometry"/>
</g>
<g id="angle-BED" class="interactive">
    <line x1="110" y1="23.1" x2="12" y2="63.5" class="geometry"/>
    <line x1="110" y1="23.1" x2="146" y2="63.5" class="geometry"/>
</g>
<g id="diameter-AFC-and-EC" class="interactive">
    <line x1="38" y1="29" x2="120" y2="145" class="construction"/>
    <line x1="110" y1="23.1" x2="120" y2="145" class="construction"/>
</g>
<g id="points">
    <circle cx="79" cy="87" r="2.5" class="point"/>
    <circle cx="38" cy="29" r="2.5" class="point"/>
    <circle cx="110" cy="23.1" r="2.5" class="point"/>
    <circle cx="12" cy="63.5" r="2.5" class="point"/>
    <circle cx="146" cy="63.5" r="2.5" class="point"/>
    <circle cx="120" cy="145" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="33" y="21" class="label">A</text>
    <text x="8" y="57" class="label">B</text>
    <text x="126" y="152" class="label">C</text>
    <text x="155" y="59" class="label">D</text>
    <text x="117" y="16" class="label">E</text>
    <text x="72" y="92" class="label">F</text>
</g>

</svg>
