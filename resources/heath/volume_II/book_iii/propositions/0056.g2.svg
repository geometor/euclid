<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 188" width="170" height="188" class="euclid-graphic" data-graphic-id="0056.g2" data-folio="0056" data-graphic="g2" data-proposition="III.21">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circle BAC) -->
  <g id="elements">
    <circle id="el-circle-BAC" data-ref="( B A C )" data-aliases="( B D C )" data-type="circle" cx="76" cy="105" r="69" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Triangles, Segments, Angles) -->
  <g id="graphics">
    <polygon id="el-tri-BAC" data-ref="&lt; B A C &gt;" data-type="polygon" points="14.88,137 116,48.79 137.12,137" class="geom-polygon" />
    <polygon id="el-tri-BDC" data-ref="&lt; B D C &gt;" data-type="polygon" points="14.88,137 68,36.47 137.12,137" class="geom-polygon" />

    <!-- Chords BC, AB, AC, BD (BE, ED), DC, and Reductio Chord EC -->
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="14.88" y1="137" x2="137.12" y2="137" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="116" y1="48.79" x2="14.88" y2="137" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="116" y1="48.79" x2="137.12" y2="137" class="geom-line" />
    <line id="el-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" data-type="segment" x1="14.88" y1="137" x2="57.38" y2="56.58" class="geom-line" />
    <line id="el-seg-ED" data-ref="/ E D /" data-aliases="/ D E /" data-type="segment" x1="57.38" y1="56.58" x2="68" y2="36.47" class="geom-line" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="14.88" y1="137" x2="68" y2="36.47" class="geom-line geom-overlay" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" data-type="segment" x1="68" y1="36.47" x2="137.12" y2="137" class="geom-line" />
    <line id="el-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" data-type="segment" x1="57.38" y1="56.58" x2="137.12" y2="137" class="geom-line geom-overlay" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; C A B )" data-type="wedge" d="M 116.00 48.79 L 121.24 70.65 A 22.5 22.5 0 0 1 99.04 63.59 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BDC" data-ref="&lt; B D C )" data-aliases="&lt; C D B )" data-type="wedge" d="M 68.00 36.47 L 80.76 55.02 A 22.5 22.5 0 0 1 57.52 56.39 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BEC" data-ref="&lt; B E C )" data-aliases="&lt; C E B )" data-type="wedge" d="M 57.38 56.58 L 73.22 72.55 A 22.5 22.5 0 0 1 46.90 76.50 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circle-BAC" data-ref="( B A C )" data-aliases="( B D C )" cx="76" cy="105" r="69" class="geom-circle geom-overlay" />
    <polygon id="hl-tri-BAC" data-ref="&lt; B A C &gt;" points="14.88,137 116,48.79 137.12,137" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-BDC" data-ref="&lt; B D C &gt;" points="14.88,137 68,36.47 137.12,137" class="geom-polygon geom-overlay" />

    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="14.88" y1="137" x2="137.12" y2="137" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="116" y1="48.79" x2="14.88" y2="137" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="116" y1="48.79" x2="137.12" y2="137" class="geom-line geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" x1="14.88" y1="137" x2="57.38" y2="56.58" class="geom-line geom-overlay" />
    <line id="hl-seg-ED" data-ref="/ E D /" data-aliases="/ D E /" x1="57.38" y1="56.58" x2="68" y2="36.47" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="14.88" y1="137" x2="68" y2="36.47" class="geom-line geom-overlay" />
    <line id="hl-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" x1="68" y1="36.47" x2="137.12" y2="137" class="geom-line geom-overlay" />
    <line id="hl-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" x1="57.38" y1="56.58" x2="137.12" y2="137" class="geom-line geom-overlay" />

    <path id="hl-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; C A B )" d="M 116.00 48.79 L 121.24 70.65 A 22.5 22.5 0 0 1 99.04 63.59 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-BDC" data-ref="&lt; B D C )" data-aliases="&lt; C D B )" d="M 68.00 36.47 L 80.76 55.02 A 22.5 22.5 0 0 1 57.52 56.39 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-BEC" data-ref="&lt; B E C )" data-aliases="&lt; C E B )" d="M 57.38 56.58 L 73.22 72.55 A 22.5 22.5 0 0 1 46.90 76.50 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="116" cy="48.79" r="3" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="14.88" cy="137" r="3" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="137.12" cy="137" r="3" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="68" cy="36.47" r="3" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="57.38" cy="56.58" r="3" class="geom-point geom-overlay" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="123" y="45" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="8" y="143" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="145" y="143" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="68" y="26" text-anchor="middle" class="geom-label">D</text>
  </g>
</svg>
