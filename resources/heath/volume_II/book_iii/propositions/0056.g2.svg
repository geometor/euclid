<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 188" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="170" height="188" fill="#ffffff"/>

<g id="circle-BAC" class="interactive">
    <circle cx="76" cy="105" r="69" class="geometry"/>
</g>
<g id="base-BC" class="interactive">
    <line x1="14.9" y1="137" x2="137.1" y2="137" class="geometry"/>
</g>
<g id="triangle-BAC" class="interactive">
    <line x1="68" y1="36.5" x2="14.9" y2="137" class="geometry"/>
    <line x1="68" y1="36.5" x2="137.1" y2="137" class="geometry"/>
</g>
<g id="triangle-BDC-and-EC" class="interactive">
    <line x1="14.9" y1="137" x2="118" y2="28" class="construction"/>
    <line x1="118" y1="28" x2="137.1" y2="137" class="construction"/>
    <line x1="103" y1="41.5" x2="137.1" y2="137" class="construction"/>
</g>
<g id="points">
    <circle cx="68" cy="36.5" r="2.5" class="point"/>
    <circle cx="14.9" cy="137" r="2.5" class="point"/>
    <circle cx="137.1" cy="137" r="2.5" class="point"/>
    <circle cx="103" cy="41.5" r="2.5" class="point"/>
    <circle cx="118" cy="28" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="68" y="25" class="label">A</text>
    <text x="8" y="139" class="label">B</text>
    <text x="145" y="139" class="label">C</text>
    <text x="124" y="24" class="label">D</text>
    <text x="115" y="42" class="label">E</text>
</g>

</svg>
