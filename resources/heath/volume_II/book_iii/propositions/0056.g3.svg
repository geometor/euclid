<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 206" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="224" height="206" fill="#ffffff"/>

<g id="circle-AFEB" class="interactive">
    <circle cx="113.5" cy="108" r="88.5" class="geometry"/>
</g>
<g id="segment-ADCB" class="interactive">
    <path d="M 62,180 A 54.4,54.4 0 0,1 165,180" class="geometry"/>
    <line x1="62" y1="180" x2="165" y2="180" class="geometry"/>
</g>
<g id="lines-BC-CF-AF-AC" class="interactive">
    <line x1="165" y1="180" x2="62" y2="36" class="geometry"/>
    <line x1="62" y1="180" x2="113.5" y2="108" class="geometry"/>
    <line x1="62" y1="180" x2="62" y2="36" class="construction"/>
</g>
<g id="lines-BDE-AD-AE" class="interactive">
    <line x1="165" y1="180" x2="112" y2="19.5" class="geometry"/>
    <line x1="62" y1="180" x2="147.8" y2="132" class="geometry"/>
    <line x1="62" y1="180" x2="112" y2="19.5" class="construction"/>
</g>
<g id="points">
    <circle cx="62" cy="180" r="2.5" class="point"/>
    <circle cx="165" cy="180" r="2.5" class="point"/>
    <circle cx="113.5" cy="108" r="2.5" class="point"/>
    <circle cx="62" cy="36" r="2.5" class="point"/>
    <circle cx="112" cy="19.5" r="2.5" class="point"/>
    <circle cx="147.8" cy="132" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="58" y="190" class="label">A</text>
    <text x="172" y="190" class="label">B</text>
    <text x="122" y="99" class="label">C</text>
    <text x="158" y="132" class="label">D</text>
    <text x="113" y="11" class="label">E</text>
    <text x="56" y="26" class="label">F</text>
    <text x="19" y="96" class="label">H</text>
</g>

</svg>
