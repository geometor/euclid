<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 189" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="175" height="189" fill="#ffffff"/>

<g id="circle-ABCD" class="interactive">
    <circle cx="87" cy="92" r="71" class="geometry"/>
</g>
<g id="quadrilateral-ABCD" class="interactive">
    <polygon points="31.5,47.5 142.5,47.5 141,138 85,163" class="geometry"/>
</g>
<g id="diagonals-AC-BD" class="interactive">
    <line x1="31.5" y1="47.5" x2="141" y2="138" class="construction"/>
    <line x1="142.5" y1="47.5" x2="85" y2="163" class="construction"/>
</g>
<g id="points">
    <circle cx="31.5" cy="47.5" r="2.5" class="point"/>
    <circle cx="142.5" cy="47.5" r="2.5" class="point"/>
    <circle cx="141" cy="138" r="2.5" class="point"/>
    <circle cx="85" cy="163" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="21" y="42" class="label">A</text>
    <text x="151" y="38" class="label">B</text>
    <text x="150" y="142" class="label">C</text>
    <text x="85" y="176" class="label">D</text>
</g>

</svg>
