<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 94" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="192" height="94" fill="#ffffff"/>

<g id="base-AB" class="interactive">
    <line x1="28" y1="66" x2="164" y2="66" class="geometry"/>
</g>
<g id="segment-ADB" class="interactive">
    <path d="M 28,66 A 78,78 0 0,1 164,66" class="geometry"/>
</g>
<g id="segment-ACB" class="interactive">
    <path d="M 28,66 A 92,92 0 0,1 164,66" class="geometry"/>
</g>
<g id="lines-ACD-CB-DB" class="interactive">
    <line x1="28" y1="66" x2="122" y2="30" class="construction"/>
    <line x1="101" y1="38" x2="164" y2="66" class="construction"/>
    <line x1="122" y1="30" x2="164" y2="66" class="construction"/>
</g>
<g id="points">
    <circle cx="28" cy="66" r="2.5" class="point"/>
    <circle cx="164" cy="66" r="2.5" class="point"/>
    <circle cx="101" cy="38" r="2.5" class="point"/>
    <circle cx="122" cy="30" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="19" y="72" class="label">A</text>
    <text x="173" y="73" class="label">B</text>
    <text x="103" y="49" class="label">C</text>
    <text x="128" y="19" class="label">D</text>
</g>

</svg>
