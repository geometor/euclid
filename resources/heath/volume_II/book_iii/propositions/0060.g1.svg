<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 408 96" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="408" height="96" fill="#ffffff"/>

<g id="segment-AEB" class="interactive">
    <line x1="28" y1="68" x2="158" y2="68" class="geometry"/>
    <path d="M 28,68 A 74,74 0 0,1 158,68" class="geometry"/>
</g>
<g id="segment-CFD" class="interactive">
    <line x1="252" y1="68" x2="382" y2="68" class="geometry"/>
    <path d="M 252,68 A 74,74 0 0,1 382,68" class="geometry"/>
</g>
<g id="segment-CGD" class="interactive">
    <path d="M 252,68 Q 332,2 382,68" class="construction"/>
</g>
<g id="points">
    <circle cx="28" cy="68" r="2.5" class="point"/>
    <circle cx="158" cy="68" r="2.5" class="point"/>
    <circle cx="93" cy="29" r="2.5" class="point"/>
    <circle cx="252" cy="68" r="2.5" class="point"/>
    <circle cx="382" cy="68" r="2.5" class="point"/>
    <circle cx="332" cy="31" r="2.5" class="point"/>
    <circle cx="294" cy="35" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="19" y="75" class="label">A</text>
    <text x="166" y="75" class="label">B</text>
    <text x="93" y="19" class="label">E</text>
    <text x="244" y="75" class="label">C</text>
    <text x="390" y="75" class="label">D</text>
    <text x="292" y="22" class="label">F</text>
    <text x="334" y="19" class="label">G</text>
</g>

</svg>
