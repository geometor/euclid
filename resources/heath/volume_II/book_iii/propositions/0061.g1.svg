<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 182" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="178" height="182" fill="#ffffff"/>

<g id="segment-ABC" class="interactive">
    <path d="M 44,28 A 123.7,123.7 0 0,0 44,152" class="geometry"/>
    <line x1="44" y1="28" x2="44" y2="152" class="geometry"/>
</g>
<g id="line-BDE" class="interactive">
    <line x1="27.3" y1="90" x2="151" y2="90" class="geometry"/>
</g>
<g id="lines-BA-AE-EC" class="interactive">
    <line x1="27.3" y1="90" x2="44" y2="28" class="geometry"/>
    <line x1="44" y1="28" x2="151" y2="90" class="construction"/>
    <line x1="44" y1="152" x2="151" y2="90" class="construction"/>
</g>
<g id="points">
    <circle cx="44" cy="28" r="2.5" class="point"/>
    <circle cx="44" cy="152" r="2.5" class="point"/>
    <circle cx="44" cy="90" r="2.5" class="point"/>
    <circle cx="27.3" cy="90" r="2.5" class="point"/>
    <circle cx="151" cy="90" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="44" y="18" class="label">A</text>
    <text x="17" y="90" class="label">B</text>
    <text x="44" y="164" class="label">C</text>
    <text x="52" y="100" class="label">D</text>
    <text x="161" y="90" class="label">E</text>
</g>

</svg>
