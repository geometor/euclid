<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 113 161" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="113" height="161" fill="#ffffff"/>

<g id="semicircle-ABC" class="interactive">
    <path d="M 85,22 A 58,58 0 0,0 85,138" class="geometry"/>
    <line x1="85" y1="22" x2="85" y2="138" class="geometry"/>
</g>
<g id="lines-BD-BA" class="interactive">
    <line x1="27" y1="80" x2="85" y2="80" class="geometry"/>
    <line x1="27" y1="80" x2="85" y2="22" class="geometry"/>
</g>
<g id="points">
    <circle cx="85" cy="22" r="2.5" class="point"/>
    <circle cx="85" cy="138" r="2.5" class="point"/>
    <circle cx="85" cy="80" r="2.5" class="point"/>
    <circle cx="27" cy="80" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="91" y="18" class="label">A</text>
    <text x="17" y="82" class="label">B</text>
    <text x="91" y="144" class="label">C</text>
    <text x="95" y="82" class="label">D</text>
</g>

</svg>
