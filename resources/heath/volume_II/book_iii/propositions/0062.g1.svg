    <path id="el-ang-ABD" data-ref="&lt; A B D )" data-aliases="&lt; D B A ) | &lt; A B E ) | &lt; E B A )" data-type="wedge" d="M 27.93 72.00 L 43.47 62.91 A 18.0 18.0 0 0 1 45.93 72.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BAD" data-ref="&lt; B A D )" data-aliases="&lt; D A B )" data-type="wedge" d="M 110.00 24.00 L 110.00 42.00 A 18.0 18.0 0 0 1 94.46 33.09 Z" class="wedge angle geom-overlay" />
