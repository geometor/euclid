    <polyline id="hl-sec-ADC" data-ref="/ A D C /" data-aliases="/ C D A / | } A D C { | } C D A {" points="110.00,24.00 110.00,72.00 110.00,120.00" fill="none" class="geom-line geom-overlay" />
    <polyline id="hl-sec-BED" data-ref="/ B E D /" data-aliases="/ D E B / | } B E D { | } D E B {" points="27.93,72.00 83.00,72.00 110.00,72.00" fill="none" class="geom-line geom-overlay" />
