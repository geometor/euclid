    <path id="hl-ang-BAE" data-ref="&lt; B A E )" data-aliases="&lt; E A B )" d="M 110.00 24.00 L 99.21 43.17 A 22.0 22.0 0 0 1 91.01 35.11 Z" class="wedge angle geom-overlay" />
