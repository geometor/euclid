    <polygon id="el-tri-ABE" data-ref="&lt; A B E &gt;" data-type="polygon" points="110.00,24.00 27.93,72.00 83.00,72.00" class="geom-polygon" />
    <polygon id="el-tri-AED" data-ref="&lt; A E D &gt;" data-type="polygon" points="110.00,24.00 83.00,72.00 110.00,72.00" class="geom-polygon" />

