    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="110.00" y1="24.00" x2="110.00" y2="120.00" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="110.00" y1="24.00" x2="110.00" y2="72.00" class="geom-line geom-overlay" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" data-type="segment" x1="110.00" y1="72.00" x2="110.00" y2="120.00" class="geom-line geom-overlay" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="27.93" y1="72.00" x2="110.00" y2="72.00" class="geom-line" />
    <line id="el-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" data-type="segment" x1="27.93" y1="72.00" x2="83.00" y2="72.00" class="geom-line geom-overlay" />
    <line id="el-seg-ED" data-ref="/ E D /" data-aliases="/ D E /" data-type="segment" x1="83.00" y1="72.00" x2="110.00" y2="72.00" class="geom-line geom-overlay" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="110.00" y1="24.00" x2="27.93" y2="72.00" class="geom-line" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="110.00" y1="24.00" x2="83.00" y2="72.00" class="geom-line" />
    <line id="el-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" data-type="segment" x1="83.00" y1="72.00" x2="110.00" y2="120.00" class="geom-line geom-overlay" />

    <!-- Sections -->
    <polyline id="el-sec-ADC" data-ref="/ A D C /" data-aliases="/ C D A / | } A D C { | } C D A {" data-type="section" points="110.00,24.00 110.00,72.00 110.00,120.00" fill="none" class="geom-line geom-overlay" />
    <polyline id="el-sec-BED" data-ref="/ B E D /" data-aliases="/ D E B / | } B E D { | } D E B {" data-type="section" points="27.93,72.00 83.00,72.00 110.00,72.00" fill="none" class="geom-line geom-overlay" />
  </g>

