<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 138 144" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="138" height="144" fill="#ffffff"/>

<g id="segment-ABC" class="interactive">
    <path d="M 110,24 A 55,55 0 1,0 110,120" class="geometry"/>
    <line x1="110" y1="24" x2="110" y2="120" class="geometry"/>
</g>
<g id="line-BED" class="interactive">
    <line x1="28" y1="72" x2="110" y2="72" class="geometry"/>
</g>
<g id="lines-BA-EA-EC" class="interactive">
    <line x1="28" y1="72" x2="110" y2="24" class="geometry"/>
    <line x1="83" y1="72" x2="110" y2="24" class="construction"/>
    <line x1="83" y1="72" x2="110" y2="120" class="construction"/>
</g>
<g id="points">
    <circle cx="110" cy="24" r="2.5" class="point"/>
    <circle cx="110" cy="120" r="2.5" class="point"/>
    <circle cx="110" cy="72" r="2.5" class="point"/>
    <circle cx="83" cy="72" r="2.5" class="point"/>
    <circle cx="28" cy="72" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="118" y="20" class="label">A</text>
    <text x="18" y="72" class="label">B</text>
    <text x="118" y="124" class="label">C</text>
    <text x="119" y="72" class="label">D</text>
    <text x="81" y="82" class="label">E</text>
</g>

</svg>
