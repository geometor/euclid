    <path id="el-arc-ABC" data-ref="( A B C )" data-aliases="&lt; A B C ) | ( E A )" data-type="circle" d="M 110.00 24.00 A 55.07 55.07 0 1 0 110.00 120.00" class="geom-arc" />
  </g>

