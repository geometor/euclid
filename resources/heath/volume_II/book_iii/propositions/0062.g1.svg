    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="110.00" y1="24.00" x2="110.00" y2="72.00" class="geom-line geom-overlay" />
    <line id="hl-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" x1="110.00" y1="72.00" x2="110.00" y2="120.00" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="27.93" y1="72.00" x2="110.00" y2="72.00" class="geom-line geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" x1="27.93" y1="72.00" x2="83.00" y2="72.00" class="geom-line geom-overlay" />
