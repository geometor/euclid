<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 185" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="366" height="185" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="101" cy="86" r="59" class="geometry"/>
</g>
<g id="circle-DEF" class="interactive">
    <circle cx="281" cy="86" r="59" class="geometry"/>
</g>
<g id="left-lines" class="interactive">
    <line x1="68" y1="37" x2="52" y2="119" class="geometry"/>
    <line x1="68" y1="37" x2="150" y2="119" class="geometry"/>
    <line x1="101" y1="86" x2="52" y2="119" class="geometry"/>
    <line x1="101" y1="86" x2="150" y2="119" class="geometry"/>
    <line x1="52" y1="119" x2="150" y2="119" class="construction"/>
</g>
<g id="right-lines" class="interactive">
    <line x1="334" y1="60" x2="232" y2="119" class="geometry"/>
    <line x1="334" y1="60" x2="330" y2="119" class="geometry"/>
    <line x1="281" y1="86" x2="232" y2="119" class="geometry"/>
    <line x1="281" y1="86" x2="330" y2="119" class="geometry"/>
    <line x1="232" y1="119" x2="330" y2="119" class="construction"/>
</g>
<g id="points">
    <circle cx="101" cy="86" r="2.5" class="point"/>
    <circle cx="68" cy="37" r="2.5" class="point"/>
    <circle cx="52" cy="119" r="2.5" class="point"/>
    <circle cx="150" cy="119" r="2.5" class="point"/>
    <circle cx="101" cy="145" r="2.5" class="point"/>
    <circle cx="281" cy="86" r="2.5" class="point"/>
    <circle cx="334" cy="60" r="2.5" class="point"/>
    <circle cx="232" cy="119" r="2.5" class="point"/>
    <circle cx="330" cy="119" r="2.5" class="point"/>
    <circle cx="281" cy="145" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="64" y="25" class="label">A</text>
    <text x="42" y="124" class="label">B</text>
    <text x="160" y="124" class="label">C</text>
    <text x="101" y="76" class="label">G</text>
    <text x="101" y="157" class="label">K</text>
    <text x="346" y="59" class="label">D</text>
    <text x="222" y="124" class="label">E</text>
    <text x="340" y="124" class="label">F</text>
    <text x="281" y="76" class="label">H</text>
    <text x="281" y="157" class="label">L</text>
</g>

</svg>
