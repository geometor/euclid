<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 329 184" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="329" height="184" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="83" cy="86" r="65" class="geometry"/>
</g>
<g id="circle-DEF" class="interactive">
    <circle cx="244" cy="92" r="65" class="geometry"/>
</g>
<g id="left-lines" class="interactive">
    <line x1="40" y1="37" x2="29" y2="122" class="geometry"/>
    <line x1="40" y1="37" x2="137" y2="122" class="geometry"/>
    <line x1="83" y1="86" x2="29" y2="122" class="geometry"/>
    <line x1="83" y1="86" x2="137" y2="122" class="geometry"/>
    <line x1="83" y1="86" x2="121" y2="139" class="construction"/>
</g>
<g id="right-lines" class="interactive">
    <line x1="218" y1="32.4" x2="190" y2="128" class="geometry"/>
    <line x1="218" y1="32.4" x2="298" y2="128" class="geometry"/>
    <line x1="244" y1="92" x2="190" y2="128" class="geometry"/>
    <line x1="244" y1="92" x2="298" y2="128" class="geometry"/>
</g>
<g id="points">
    <circle cx="83" cy="86" r="2.5" class="point"/>
    <circle cx="40" cy="37" r="2.5" class="point"/>
    <circle cx="29" cy="122" r="2.5" class="point"/>
    <circle cx="137" cy="122" r="2.5" class="point"/>
    <circle cx="121" cy="139" r="2.5" class="point"/>
    <circle cx="244" cy="92" r="2.5" class="point"/>
    <circle cx="218" cy="32.4" r="2.5" class="point"/>
    <circle cx="190" cy="128" r="2.5" class="point"/>
    <circle cx="298" cy="128" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="34" y="25" class="label">A</text>
    <text x="19" y="126" class="label">B</text>
    <text x="147" y="126" class="label">C</text>
    <text x="77" y="76" class="label">G</text>
    <text x="128" y="150" class="label">K</text>
    <text x="218" y="20" class="label">D</text>
    <text x="180" y="135" class="label">E</text>
    <text x="308" y="135" class="label">F</text>
    <text x="245" y="81" class="label">H</text>
</g>

</svg>
