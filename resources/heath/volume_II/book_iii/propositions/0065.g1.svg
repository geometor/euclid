<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 165" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="390" height="165" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="73" cy="75" r="58" class="geometry"/>
</g>
<g id="circle-DEF" class="interactive">
    <circle cx="313" cy="75" r="58" class="geometry"/>
</g>
<g id="left-chord-radii" class="interactive">
    <line x1="25" y1="108" x2="121" y2="108" class="geometry"/>
    <line x1="73" y1="75" x2="25" y2="108" class="construction"/>
    <line x1="73" y1="75" x2="121" y2="108" class="construction"/>
</g>
<g id="right-chord-radii" class="interactive">
    <line x1="265" y1="108" x2="361" y2="108" class="geometry"/>
    <line x1="313" y1="75" x2="265" y2="108" class="construction"/>
    <line x1="313" y1="75" x2="361" y2="108" class="construction"/>
</g>
<g id="points">
    <circle cx="73" cy="75" r="2.5" class="point"/>
    <circle cx="25" cy="108" r="2.5" class="point"/>
    <circle cx="121" cy="108" r="2.5" class="point"/>
    <circle cx="73" cy="133" r="2.5" class="point"/>
    <circle cx="313" cy="75" r="2.5" class="point"/>
    <circle cx="265" cy="108" r="2.5" class="point"/>
    <circle cx="361" cy="108" r="2.5" class="point"/>
    <circle cx="313" cy="133" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="17" y="114" class="label">A</text>
    <text x="131" y="114" class="label">B</text>
    <text x="73" y="25" class="label">C</text>
    <text x="73" y="145" class="label">G</text>
    <text x="73" y="65" class="label">K</text>
    <text x="257" y="114" class="label">D</text>
    <text x="371" y="114" class="label">E</text>
    <text x="313" y="25" class="label">F</text>
    <text x="313" y="145" class="label">H</text>
    <text x="313" y="65" class="label">L</text>
</g>

</svg>
