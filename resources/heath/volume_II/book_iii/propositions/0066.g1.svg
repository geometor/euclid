<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 354 160" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="354" height="160" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="77" cy="78" r="58" class="geometry"/>
</g>
<g id="circle-DEF" class="interactive">
    <circle cx="277" cy="78" r="58" class="geometry"/>
</g>
<g id="left-chord-radii" class="interactive">
    <line x1="29" y1="110" x2="125" y2="110" class="geometry"/>
    <line x1="77" y1="78" x2="29" y2="110" class="construction"/>
    <line x1="77" y1="78" x2="125" y2="110" class="construction"/>
</g>
<g id="right-chord-radii" class="interactive">
    <line x1="229" y1="110" x2="325" y2="110" class="geometry"/>
    <line x1="277" y1="78" x2="229" y2="110" class="construction"/>
    <line x1="277" y1="78" x2="325" y2="110" class="construction"/>
</g>
<g id="points">
    <circle cx="77" cy="78" r="2.5" class="point"/>
    <circle cx="29" cy="110" r="2.5" class="point"/>
    <circle cx="125" cy="110" r="2.5" class="point"/>
    <circle cx="77" cy="136" r="2.5" class="point"/>
    <circle cx="277" cy="78" r="2.5" class="point"/>
    <circle cx="229" cy="110" r="2.5" class="point"/>
    <circle cx="325" cy="110" r="2.5" class="point"/>
    <circle cx="277" cy="136" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="77" y="28" class="label">A</text>
    <text x="19" y="110" class="label">B</text>
    <text x="135" y="110" class="label">C</text>
    <text x="77" y="128" class="label">G</text>
    <text x="77" y="68" class="label">K</text>
    <text x="277" y="28" class="label">D</text>
    <text x="219" y="110" class="label">E</text>
    <text x="335" y="110" class="label">F</text>
    <text x="277" y="128" class="label">H</text>
    <text x="277" y="68" class="label">L</text>
</g>

</svg>
