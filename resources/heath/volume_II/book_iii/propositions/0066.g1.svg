    <circle id="hl-circle-DEF" data-ref="( D E F )" data-aliases="( L E ) | ( L F )" cx="277.00" cy="78.00" r="58" class="geom-circle geom-overlay" />
    <path id="hl-arc-BGC" data-ref="( B G C )" data-aliases="( C G B )" d="M 28.63 110.00 A 58.0 58.0 0 0 0 125.37 110.00" class="geom-arc geom-overlay" />
    <path id="hl-arc-EHF" data-ref="( E H F )" data-aliases="( F H E )" d="M 228.63 110.00 A 58.0 58.0 0 0 0 325.37 110.00" class="geom-arc geom-overlay" />
    <polygon id="hl-tri-BKC" data-ref="&lt; B K C &gt;" points="28.63,110.00 77.00,78.00 125.37,110.00" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-ELF" data-ref="&lt; E L F &gt;" points="228.63,110.00 277.00,78.00 325.37,110.00" class="geom-polygon geom-overlay" />
    <path id="hl-ang-BKC" data-ref="&lt; B K C )" data-aliases="&lt; C K B )" d="M 77.00 78.00 L 92.01 87.93 A 18.0 18.0 0 0 1 61.99 87.93 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ELF" data-ref="&lt; E L F )" data-aliases="&lt; F L E )" d="M 277.00 78.00 L 292.01 87.93 A 18.0 18.0 0 0 1 261.99 87.93 Z" class="wedge angle geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="28.63" y1="110.00" x2="125.37" y2="110.00" class="geom-line geom-overlay" />
    <line id="hl-seg-BK" data-ref="/ B K /" data-aliases="/ K B /" x1="28.63" y1="110.00" x2="77.00" y2="78.00" class="geom-line geom-overlay" />
    <line id="hl-seg-KC" data-ref="/ K C /" data-aliases="/ C K /" x1="77.00" y1="78.00" x2="125.37" y2="110.00" class="geom-line geom-overlay" />
    <line id="hl-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" x1="228.63" y1="110.00" x2="325.37" y2="110.00" class="geom-line geom-overlay" />
    <line id="hl-seg-EL" data-ref="/ E L /" data-aliases="/ L E /" x1="228.63" y1="110.00" x2="277.00" y2="78.00" class="geom-line geom-overlay" />
    <line id="hl-seg-LF" data-ref="/ L F /" data-aliases="/ F L /" x1="277.00" y1="78.00" x2="325.37" y2="110.00" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="77.00" cy="20.00" r="3" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="28.63" cy="110.00" r="3" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="125.37" cy="110.00" r="3" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="77.00" cy="136.00" r="3" class="geom-point" />
    <circle id="el-pt-K" data-ref="K" data-type="point" cx="77.00" cy="78.00" r="3" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="277.00" cy="20.00" r="3" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="228.63" cy="110.00" r="3" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="325.37" cy="110.00" r="3" class="geom-point" />
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="277.00" cy="136.00" r="3" class="geom-point" />
    <circle id="el-pt-L" data-ref="L" data-type="point" cx="277.00" cy="78.00" r="3" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="77" y="34" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="18" y="116" text-anchor="middle" class="geom-label">B</text>
