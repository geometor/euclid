<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 354 160" width="354" height="160" class="euclid-graphic" data-graphic-id="0066.g1" data-folio="0066" data-graphic="g1" data-proposition="III.29">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle, .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Equal Circles ABC and DEF) -->
  <g id="elements">
    <circle id="el-circle-ABC" data-ref="( A B C )" data-aliases="( K B ) | ( K C )" data-type="circle" cx="77.00" cy="78.00" r="58" class="geom-circle" />
    <circle id="el-circle-DEF" data-ref="( D E F )" data-aliases="( L E ) | ( L F )" data-type="circle" cx="277.00" cy="78.00" r="58" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Circumference Arcs, Polygons, Angles, Segments) -->
  <g id="graphics">
    <!-- Circumference arcs BGC and EHF -->
    <path id="el-arc-BGC" data-ref="( B G C )" data-aliases="( C G B )" data-type="arc" d="M 28.63 110.00 A 58.0 58.0 0 0 0 125.37 110.00" class="geom-arc geom-overlay" />
    <path id="el-arc-EHF" data-ref="( E H F )" data-aliases="( F H E )" data-type="arc" d="M 228.63 110.00 A 58.0 58.0 0 0 0 325.37 110.00" class="geom-arc geom-overlay" />

    <!-- Polygons -->
    <polygon id="el-tri-BKC" data-ref="&lt; B K C &gt;" data-type="polygon" points="28.63,110.00 77.00,78.00 125.37,110.00" class="geom-polygon" />
    <polygon id="el-tri-ELF" data-ref="&lt; E L F &gt;" data-type="polygon" points="228.63,110.00 277.00,78.00 325.37,110.00" class="geom-polygon" />

    <!-- Angles -->
    <path id="el-ang-BKC" data-ref="&lt; B K C )" data-aliases="&lt; C K B )" data-type="wedge" d="M 77.00 78.00 L 92.01 87.93 A 18.0 18.0 0 0 1 61.99 87.93 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ELF" data-ref="&lt; E L F )" data-aliases="&lt; F L E )" data-type="wedge" d="M 277.00 78.00 L 292.01 87.93 A 18.0 18.0 0 0 1 261.99 87.93 Z" class="wedge angle geom-overlay" />

    <!-- Segments (all solid per Heath diagram) -->
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="28.63" y1="110.00" x2="125.37" y2="110.00" class="geom-line" />
    <line id="el-seg-BK" data-ref="/ B K /" data-aliases="/ K B /" data-type="segment" x1="28.63" y1="110.00" x2="77.00" y2="78.00" class="geom-line" />
    <line id="el-seg-KC" data-ref="/ K C /" data-aliases="/ C K /" data-type="segment" x1="77.00" y1="78.00" x2="125.37" y2="110.00" class="geom-line" />

    <line id="el-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" data-type="segment" x1="228.63" y1="110.00" x2="325.37" y2="110.00" class="geom-line" />
    <line id="el-seg-EL" data-ref="/ E L /" data-aliases="/ L E /" data-type="segment" x1="228.63" y1="110.00" x2="277.00" y2="78.00" class="geom-line" />
    <line id="el-seg-LF" data-ref="/ L F /" data-aliases="/ F L /" data-type="segment" x1="277.00" y1="78.00" x2="325.37" y2="110.00" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
