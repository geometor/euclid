    <text id="lbl-G" data-ref="G" x="77" y="130" text-anchor="middle" class="geom-label">G</text>
    <text id="lbl-K" data-ref="K" x="77" y="70" text-anchor="middle" class="geom-label">K</text>
    <text id="lbl-D" data-ref="D" x="277" y="34" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="218" y="116" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="336" y="116" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-H" data-ref="H" x="277" y="130" text-anchor="middle" class="geom-label">H</text>
