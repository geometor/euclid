<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 213 112" width="213" height="112" class="euclid-graphic" data-graphic-id="0067.g1" data-folio="0067" data-graphic="g1" data-proposition="III.30">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle, .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circumference ADB) -->
  <g id="elements">
    <path id="el-arc-ADB" data-ref="( A D B )" data-aliases="&lt; A D B ); ( O A )" data-type="circle" d="M 28.00 83.00 A 85.38 85.38 0 0 1 186.00 83.00" class="geom-arc" />
  </g>

  <!-- Constructed Graphics (Sub-Arcs, Polygons, Angles, Segments & Section) -->
  <g id="graphics">
    <!-- Sub-arcs AD and DB -->
    <path id="el-arc-AD" data-ref="( A D )" data-aliases="( D A )" data-type="arc" d="M 28.00 83.00 A 85.38 85.38 0 0 1 107.00 30.00" class="geom-arc geom-overlay" />
    <path id="el-arc-DB" data-ref="( D B )" data-aliases="( B D )" data-type="arc" d="M 107.00 30.00 A 85.38 85.38 0 0 1 186.00 83.00" class="geom-arc geom-overlay" />

    <!-- Polygons -->
    <polygon id="el-tri-ACD" data-ref="&lt; A C D &gt;" data-type="polygon" points="28.00,83.00 107.00,83.00 107.00,30.00" class="geom-polygon" />
    <polygon id="el-tri-BCD" data-ref="&lt; B C D &gt;" data-type="polygon" points="186.00,83.00 107.00,83.00 107.00,30.00" class="geom-polygon" />
    <polygon id="el-tri-ADB" data-ref="&lt; A D B &gt;" data-type="polygon" points="28.00,83.00 107.00,30.00 186.00,83.00" class="geom-polygon" />

    <!-- Angles -->
    <path id="el-ang-ACD" data-ref="&lt; A C D )" data-aliases="&lt; D C A )" data-type="wedge" d="M 107.00 83.00 L 92.00 83.00 A 15.0 15.0 0 0 1 107.00 68.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BCD" data-ref="&lt; B C D )" data-aliases="&lt; D C B )" data-type="wedge" d="M 107.00 83.00 L 107.00 68.00 A 15.0 15.0 0 0 1 122.00 83.00 Z" class="wedge angle geom-overlay" />

    <!-- Segments (all solid per Heath diagram) -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="28.00" y1="83.00" x2="186.00" y2="83.00" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="28.00" y1="83.00" x2="107.00" y2="83.00" class="geom-line geom-overlay" />
    <line id="el-seg-CB" data-ref="/ C B /" data-aliases="/ B C /" data-type="segment" x1="107.00" y1="83.00" x2="186.00" y2="83.00" class="geom-line geom-overlay" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="107.00" y1="83.00" x2="107.00" y2="30.00" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="28.00" y1="83.00" x2="107.00" y2="30.00" class="geom-line" />
    <line id="el-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" data-type="segment" x1="107.00" y1="30.00" x2="186.00" y2="83.00" class="geom-line" />
    <polyline id="el-sec-ACB" data-ref="/ A C B /" data-aliases="/ B C A /; } A C B {; } B C A {" data-type="section" points="28.00,83.00 107.00,83.00 186.00,83.00" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <path id="hl-arc-ADB" data-ref="( A D B )" data-aliases="&lt; A D B ); ( O A )" d="M 28.00 83.00 A 85.38 85.38 0 0 1 186.00 83.00" class="geom-arc geom-overlay" />
    <path id="hl-arc-AD" data-ref="( A D )" data-aliases="( D A )" d="M 28.00 83.00 A 85.38 85.38 0 0 1 107.00 30.00" class="geom-arc geom-overlay" />
    <path id="hl-arc-DB" data-ref="( D B )" data-aliases="( B D )" d="M 107.00 30.00 A 85.38 85.38 0 0 1 186.00 83.00" class="geom-arc geom-overlay" />
    <polygon id="hl-tri-ACD" data-ref="&lt; A C D &gt;" points="28.00,83.00 107.00,83.00 107.00,30.00" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-BCD" data-ref="&lt; B C D &gt;" points="186.00,83.00 107.00,83.00 107.00,30.00" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-ADB" data-ref="&lt; A D B &gt;" points="28.00,83.00 107.00,30.00 186.00,83.00" class="geom-polygon geom-overlay" />
    <path id="hl-ang-ACD" data-ref="&lt; A C D )" data-aliases="&lt; D C A )" d="M 107.00 83.00 L 92.00 83.00 A 15.0 15.0 0 0 1 107.00 68.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-BCD" data-ref="&lt; B C D )" data-aliases="&lt; D C B )" d="M 107.00 83.00 L 107.00 68.00 A 15.0 15.0 0 0 1 122.00 83.00 Z" class="wedge angle geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="28.00" y1="83.00" x2="186.00" y2="83.00" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="28.00" y1="83.00" x2="107.00" y2="83.00" class="geom-line geom-overlay" />
    <line id="hl-seg-CB" data-ref="/ C B /" data-aliases="/ B C /" x1="107.00" y1="83.00" x2="186.00" y2="83.00" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="107.00" y1="83.00" x2="107.00" y2="30.00" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="28.00" y1="83.00" x2="107.00" y2="30.00" class="geom-line geom-overlay" />
    <line id="hl-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" x1="107.00" y1="30.00" x2="186.00" y2="83.00" class="geom-line geom-overlay" />
    <polyline id="hl-sec-ACB" data-ref="/ A C B /" data-aliases="/ B C A /; } A C B {; } B C A {" points="28.00,83.00 107.00,83.00 186.00,83.00" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="28.00" cy="83.00" r="3" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="186.00" cy="83.00" r="3" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="107.00" cy="83.00" r="3" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="107.00" cy="30.00" r="3" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="19" y="96" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="194" y="96" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="107" y="99" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="107" y="21" text-anchor="middle" class="geom-label">D</text>
  </g>
</svg>
