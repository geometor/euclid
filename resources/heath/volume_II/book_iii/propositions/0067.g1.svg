<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 213 112" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="213" height="112" fill="#ffffff"/>

<g id="arc-ADB" class="interactive">
    <path d="M 28,83 A 85,85 0 0,1 186,83" class="geometry"/>
</g>
<g id="chord-AB" class="interactive">
    <line x1="28" y1="83" x2="186" y2="83" class="geometry"/>
</g>
<g id="perp-CD-and-chords" class="interactive">
    <line x1="107" y1="83" x2="107" y2="30" class="geometry"/>
    <line x1="28" y1="83" x2="107" y2="30" class="construction"/>
    <line x1="107" y1="30" x2="186" y2="83" class="construction"/>
</g>
<g id="points">
    <circle cx="28" cy="83" r="2.5" class="point"/>
    <circle cx="186" cy="83" r="2.5" class="point"/>
    <circle cx="107" cy="83" r="2.5" class="point"/>
    <circle cx="107" cy="30" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="19" y="90" class="label">A</text>
    <text x="194" y="90" class="label">B</text>
    <text x="107" y="94" class="label">C</text>
    <text x="107" y="19" class="label">D</text>
</g>

</svg>
