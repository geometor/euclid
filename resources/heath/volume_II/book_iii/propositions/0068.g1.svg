<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 204" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="225" height="204" fill="#ffffff"/>

<g id="circle-ABCD" class="interactive">
    <circle cx="129" cy="103" r="78" class="geometry"/>
</g>
<g id="diameter-BC" class="interactive">
    <line x1="101" y1="175.8" x2="157" y2="30.2" class="geometry"/>
</g>
<g id="line-BAF-and-AC" class="interactive">
    <line x1="101" y1="175.8" x2="26" y2="41" class="geometry"/>
    <line x1="52" y1="89.5" x2="157" y2="30.2" class="geometry"/>
</g>
<g id="chords-AD-DC-and-EA" class="interactive">
    <line x1="52" y1="89.5" x2="77" y2="45" class="geometry"/>
    <line x1="77" y1="45" x2="157" y2="30.2" class="geometry"/>
    <line x1="129" y1="103" x2="52" y2="89.5" class="construction"/>
</g>
<g id="points">
    <circle cx="129" cy="103" r="2.5" class="point"/>
    <circle cx="101" cy="175.8" r="2.5" class="point"/>
    <circle cx="157" cy="30.2" r="2.5" class="point"/>
    <circle cx="52" cy="89.5" r="2.5" class="point"/>
    <circle cx="77" cy="45" r="2.5" class="point"/>
    <circle cx="26" cy="41" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="41" y="91" class="label">A</text>
    <text x="96" y="187" class="label">B</text>
    <text x="161" y="19" class="label">C</text>
    <text x="72" y="35" class="label">D</text>
    <text x="138" y="105" class="label">E</text>
    <text x="18" y="44" class="label">F</text>
</g>

</svg>
