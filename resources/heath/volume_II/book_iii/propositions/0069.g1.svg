<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 169 103" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="169" height="103" fill="#ffffff"/>

<g id="semicircle" class="interactive">
    <path d="M 16,84 A 69,69 0 0,1 154,84" class="geometry"/>
    <line x1="16" y1="84" x2="154" y2="84" class="geometry"/>
</g>
<g id="inscribed-right-triangle" class="interactive">
    <line x1="16" y1="84" x2="85" y2="15" class="geometry"/>
    <line x1="85" y1="15" x2="154" y2="84" class="geometry"/>
    <line x1="85" y1="84" x2="85" y2="15" class="construction"/>
</g>
<g id="points">
    <circle cx="16" cy="84" r="2.5" class="point"/>
    <circle cx="85" cy="84" r="2.5" class="point"/>
    <circle cx="154" cy="84" r="2.5" class="point"/>
    <circle cx="85" cy="15" r="2.5" class="point"/>
</g>

</svg>
