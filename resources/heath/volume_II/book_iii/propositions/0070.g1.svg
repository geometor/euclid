<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 159 148" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="159" height="148" fill="#ffffff"/>

<g id="circle-ABCD" class="interactive">
    <circle cx="80" cy="78" r="52" class="geometry"/>
</g>
<g id="triangle-ABC" class="interactive">
    <line x1="65" y1="28.2" x2="28.5" y2="85" class="geometry"/>
    <line x1="28.5" y1="85" x2="131.5" y2="71" class="geometry"/>
    <line x1="65" y1="28.2" x2="131.5" y2="71" class="geometry"/>
</g>
<g id="diameter-AD-and-CD" class="interactive">
    <line x1="65" y1="28.2" x2="95" y2="127.8" class="construction"/>
    <line x1="95" y1="127.8" x2="131.5" y2="71" class="construction"/>
    <line x1="28.5" y1="85" x2="95" y2="127.8" class="construction"/>
</g>
<g id="points">
    <circle cx="65" cy="28.2" r="2.5" class="point"/>
    <circle cx="28.5" cy="85" r="2.5" class="point"/>
    <circle cx="131.5" cy="71" r="2.5" class="point"/>
    <circle cx="95" cy="127.8" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="64" y="18" class="label">A</text>
    <text x="19" y="86" class="label">B</text>
    <text x="140" y="69" class="label">C</text>
    <text x="101" y="139" class="label">D</text>
</g>

</svg>
