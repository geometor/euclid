<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 141" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="238" height="141" fill="#ffffff"/>

<g id="semicircle-ABC" class="interactive">
    <path d="M 18,113 A 84,84 0 0,1 186,113" class="geometry"/>
    <line x1="18" y1="113" x2="220" y2="113" class="geometry"/>
</g>
<g id="semicircle-DEF" class="interactive">
    <path d="M 102,113 A 59,59 0 0,1 220,113" class="geometry"/>
</g>
<g id="secant-FGEB-and-DE" class="interactive">
    <line x1="220" y1="113" x2="73" y2="33.8" class="geometry"/>
    <line x1="102" y1="113" x2="130" y2="64.5" class="construction"/>
</g>
<g id="points">
    <circle cx="18" cy="113" r="2.5" class="point"/>
    <circle cx="102" cy="113" r="2.5" class="point"/>
    <circle cx="186" cy="113" r="2.5" class="point"/>
    <circle cx="220" cy="113" r="2.5" class="point"/>
    <circle cx="73" cy="33.8" r="2.5" class="point"/>
    <circle cx="130" cy="64.5" r="2.5" class="point"/>
    <circle cx="181" cy="92" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="18" y="124" class="label">A</text>
    <text x="74" y="21" class="label">B</text>
    <text x="189" y="124" class="label">C</text>
    <text x="102" y="124" class="label">D</text>
    <text x="134" y="53" class="label">E</text>
    <text x="225" y="124" class="label">F</text>
    <text x="192" y="88" class="label">G</text>
</g>

</svg>
