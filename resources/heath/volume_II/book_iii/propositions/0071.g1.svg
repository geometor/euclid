<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 180" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="330" height="180" fill="#ffffff"/>

<g id="left-circle" class="interactive">
    <circle cx="82" cy="84" r="68" class="geometry"/>
</g>
<g id="left-chords" class="interactive">
    <line x1="29.3" y1="41" x2="134.7" y2="41" class="geometry"/>
    <line x1="63" y1="18.7" x2="63" y2="149.3" class="geometry"/>
    <line x1="63" y1="18.7" x2="101" y2="149.3" class="construction"/>
    <line x1="29.3" y1="41" x2="63" y2="18.7" class="construction"/>
    <line x1="63" y1="18.7" x2="134.7" y2="41" class="construction"/>
    <line x1="29.3" y1="41" x2="63" y2="149.3" class="construction"/>
    <line x1="134.7" y1="41" x2="101" y2="149.3" class="construction"/>
</g>
<g id="right-circle" class="interactive">
    <circle cx="234" cy="84" r="68" class="geometry"/>
</g>
<g id="right-chords" class="interactive">
    <line x1="156" y1="24" x2="266" y2="24" class="geometry"/>
    <line x1="156" y1="24" x2="168" y2="98" class="geometry"/>
    <line x1="168" y1="68" x2="300" y2="100" class="construction"/>
    <line x1="202" y1="24" x2="168" y2="68" class="construction"/>
    <line x1="168" y1="68" x2="266" y2="24" class="construction"/>
    <line x1="202" y1="24" x2="168" y2="98" class="construction"/>
    <line x1="266" y1="24" x2="300" y2="100" class="construction"/>
</g>
<g id="points">
    <circle cx="29.3" cy="41" r="2.5" class="point"/>
    <circle cx="134.7" cy="41" r="2.5" class="point"/>
    <circle cx="63" cy="18.7" r="2.5" class="point"/>
    <circle cx="63" cy="149.3" r="2.5" class="point"/>
    <circle cx="63" cy="41" r="2.5" class="point"/>
    <circle cx="101" cy="149.3" r="2.5" class="point"/>
    <circle cx="156" cy="24" r="2.5" class="point"/>
    <circle cx="202" cy="24" r="2.5" class="point"/>
    <circle cx="266" cy="24" r="2.5" class="point"/>
    <circle cx="168" cy="68" r="2.5" class="point"/>
    <circle cx="168" cy="98" r="2.5" class="point"/>
    <circle cx="300" cy="100" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="20" y="38" class="label">A</text>
    <text x="144" y="41" class="label">B</text>
    <text x="63" y="10" class="label">C</text>
    <text x="63" y="161" class="label">D</text>
    <text x="103" y="161" class="label">E</text>
    <text x="54" y="52" class="label">O</text>
    <text x="150" y="18" class="label">O</text>
    <text x="198" y="14" class="label">A</text>
    <text x="275" y="18" class="label">B</text>
    <text x="156" y="64" class="label">C</text>
    <text x="158" y="107" class="label">D</text>
    <text x="311" y="105" class="label">E</text>
</g>

</svg>
