<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 209 214" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="209" height="214" fill="#ffffff"/>

<g id="circle-ABCD" class="interactive">
    <circle cx="103" cy="105" r="79" class="geometry"/>
</g>
<g id="tangent-EF" class="interactive">
    <line x1="18" y1="184" x2="190" y2="184" class="geometry"/>
</g>
<g id="diameter-BA" class="interactive">
    <line x1="103" y1="184" x2="103" y2="26" class="geometry"/>
</g>
<g id="chords-BD-AD-DC-CB" class="interactive">
    <line x1="103" y1="184" x2="142" y2="36.3" class="geometry"/>
    <line x1="103" y1="26" x2="142" y2="36.3" class="geometry"/>
    <line x1="142" y1="36.3" x2="176" y2="75" class="geometry"/>
    <line x1="176" y1="75" x2="103" y2="184" class="geometry"/>
</g>
<g id="points">
    <circle cx="103" cy="184" r="2.5" class="point"/>
    <circle cx="103" cy="26" r="2.5" class="point"/>
    <circle cx="142" cy="36.3" r="2.5" class="point"/>
    <circle cx="176" cy="75" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="103" y="16" class="label">A</text>
    <text x="103" y="196" class="label">B</text>
    <text x="186" y="75" class="label">C</text>
    <text x="149" y="28" class="label">D</text>
    <text x="190" y="196" class="label">E</text>
    <text x="19" y="196" class="label">F</text>
</g>

</svg>
