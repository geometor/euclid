<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 301 208" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="301" height="208" fill="#ffffff"/>

<g id="given-angle-C" class="interactive">
    <line x1="20" y1="103" x2="93" y2="103" class="geometry"/>
    <line x1="38" y1="45" x2="93" y2="103" class="geometry"/>
</g>
<g id="circle-ABE" class="interactive">
    <circle cx="207" cy="104" r="74" class="geometry"/>
</g>
<g id="diameter-AE-and-tangent-AD" class="interactive">
    <line x1="207" y1="30" x2="207" y2="178" class="geometry"/>
    <line x1="138" y1="30" x2="207" y2="30" class="geometry"/>
</g>
<g id="chord-AB-and-EB" class="interactive">
    <line x1="207" y1="30" x2="134.2" y2="117" class="geometry"/>
    <line x1="207" y1="178" x2="134.2" y2="117" class="geometry"/>
</g>
<g id="construction-FG-GB" class="interactive">
    <line x1="170.6" y1="73.5" x2="207" y2="104" class="construction"/>
    <line x1="207" y1="104" x2="134.2" y2="117" class="construction"/>
</g>
<g id="points">
    <circle cx="93" cy="103" r="2.5" class="point"/>
    <circle cx="207" cy="104" r="2.5" class="point"/>
    <circle cx="207" cy="30" r="2.5" class="point"/>
    <circle cx="207" cy="178" r="2.5" class="point"/>
    <circle cx="134.2" cy="117" r="2.5" class="point"/>
    <circle cx="170.6" cy="73.5" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="89" y="114" class="label">C</text>
    <text x="207" y="19" class="label">A</text>
    <text x="124" y="123" class="label">B</text>
    <text x="141" y="19" class="label">D</text>
    <text x="207" y="190" class="label">E</text>
    <text x="163" y="69" class="label">F</text>
    <text x="216" y="103" class="label">G</text>
</g>

</svg>
