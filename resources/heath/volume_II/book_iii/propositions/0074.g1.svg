    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="212.0" y1="30.0" x2="135.0" y2="30.0" class="geom-line geom-overlay" />
    <line id="hl-seg-FA" data-ref="/ F A /" data-aliases="/ A F /" x1="212.0" y1="105.0" x2="212.0" y2="30.0" class="geom-line geom-overlay" />
    <line id="hl-seg-FB" data-ref="/ F B /" data-aliases="/ B F /" x1="212.0" y1="105.0" x2="212.0" y2="180.0" class="geom-line geom-overlay" />
    <polyline id="hl-sec-AFB" data-ref="/ A F B /" data-aliases="/ B F A /; } A F B {; } B F A {" points="212.0,30.0 212.0,105.0 212.0,180.0" fill="none" class="geom-line geom-overlay" />
