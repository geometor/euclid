    <polygon id="hl-tri-AEB" data-ref="&lt; A E B &gt;" data-aliases="&lt; A B E &gt;; &lt; B E A &gt;" points="212.0,30.0 137.54,114.0 212.0,180.0" class="geom-polygon geom-overlay" />
