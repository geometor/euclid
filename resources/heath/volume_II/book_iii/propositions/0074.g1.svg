    <line id="el-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" data-type="segment" x1="137.54" y1="114.0" x2="212.0" y2="180.0" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="212.0" y1="30.0" x2="135.0" y2="30.0" class="geom-line geom-overlay" />
    <line id="el-seg-FA" data-ref="/ F A /" data-aliases="/ A F /" data-type="segment" x1="212.0" y1="105.0" x2="212.0" y2="30.0" class="geom-line geom-overlay" />
