    <path id="hl-ang-AEB" data-ref="&lt; A E B )" data-aliases="&lt; B E A )" d="M 137.54 114.00 L 148.15 102.03 A 16 16 0 0 1 149.51 124.61 Z" class="wedge angle geom-overlay" />
