<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 314 208" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="314" height="208" fill="#ffffff"/>

<g id="given-right-angle-C" class="interactive">
    <line x1="18" y1="105" x2="99" y2="105" class="geometry"/>
    <line x1="52" y1="105" x2="52" y2="55" class="geometry"/>
</g>
<g id="circle-AEB" class="interactive">
    <circle cx="212" cy="105" r="75" class="geometry"/>
</g>
<g id="diameter-AB-and-tangent-AD" class="interactive">
    <line x1="212" y1="30" x2="212" y2="180" class="geometry"/>
    <line x1="135" y1="30" x2="295" y2="30" class="geometry"/>
</g>
<g id="angle-AEB" class="interactive">
    <line x1="212" y1="30" x2="137" y2="105" class="geometry"/>
    <line x1="137" y1="105" x2="212" y2="180" class="geometry"/>
</g>
<g id="points">
    <circle cx="52" cy="105" r="2.5" class="point"/>
    <circle cx="212" cy="105" r="2.5" class="point"/>
    <circle cx="212" cy="30" r="2.5" class="point"/>
    <circle cx="212" cy="180" r="2.5" class="point"/>
    <circle cx="137" cy="105" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="95" y="116" class="label">C</text>
    <text x="212" y="19" class="label">A</text>
    <text x="212" y="192" class="label">B</text>
    <text x="135" y="19" class="label">D</text>
    <text x="128" y="114" class="label">E</text>
    <text x="221" y="105" class="label">F</text>
</g>

</svg>
