<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="360" height="180" fill="#ffffff"/>

<g id="given-obtuse-angle-C" class="interactive">
    <line x1="45" y1="89" x2="155" y2="89" class="geometry"/>
    <line x1="45" y1="89" x2="12" y2="32" class="geometry"/>
</g>
<g id="circle-AEBH" class="interactive">
    <circle cx="263" cy="91" r="73" class="geometry"/>
</g>
<g id="diameter-AE-and-tangent-AD" class="interactive">
    <line x1="263" y1="18" x2="263" y2="164" class="geometry"/>
    <line x1="263" y1="18" x2="338" y2="18" class="geometry"/>
</g>
<g id="chord-AB-and-angle-AHB" class="interactive">
    <line x1="263" y1="18" x2="191.2" y2="103.8" class="geometry"/>
    <line x1="263" y1="18" x2="211.4" y2="39.4" class="geometry"/>
    <line x1="211.4" y1="39.4" x2="191.2" y2="103.8" class="geometry"/>
</g>
<g id="construction-FG-GB" class="interactive">
    <line x1="227.1" y1="60.9" x2="263" y2="91" class="construction"/>
    <line x1="263" y1="91" x2="191.2" y2="103.8" class="construction"/>
</g>
<g id="points">
    <circle cx="45" cy="89" r="2.5" class="point"/>
    <circle cx="263" cy="91" r="2.5" class="point"/>
    <circle cx="263" cy="18" r="2.5" class="point"/>
    <circle cx="263" cy="164" r="2.5" class="point"/>
    <circle cx="191.2" cy="103.8" r="2.5" class="point"/>
    <circle cx="211.4" cy="39.4" r="2.5" class="point"/>
    <circle cx="227.1" cy="60.9" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="45" y="100" class="label">C</text>
    <text x="263" y="8" class="label">A</text>
    <text x="181" y="106" class="label">B</text>
    <text x="340" y="8" class="label">D</text>
    <text x="263" y="174" class="label">E</text>
    <text x="220" y="54" class="label">F</text>
    <text x="272" y="91" class="label">G</text>
    <text x="208" y="25" class="label">H</text>
</g>

</svg>
