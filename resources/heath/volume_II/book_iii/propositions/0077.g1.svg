<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 317 181" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="317" height="181" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="97" cy="95" r="67" class="geometry"/>
</g>
<g id="tangent-EF" class="interactive">
    <line x1="30" y1="28" x2="30" y2="158" class="geometry"/>
</g>
<g id="triangle-ABC" class="interactive">
    <line x1="30" y1="95" x2="138" y2="148" class="geometry"/>
    <line x1="86" y1="28.9" x2="30" y2="95" class="geometry"/>
    <line x1="86" y1="28.9" x2="138" y2="148" class="geometry"/>
</g>
<g id="given-angle-D" class="interactive">
    <line x1="233" y1="138" x2="301" y2="138" class="geometry"/>
    <line x1="233" y1="138" x2="289" y2="92" class="geometry"/>
</g>
<g id="points">
    <circle cx="30" cy="95" r="2.5" class="point"/>
    <circle cx="138" cy="148" r="2.5" class="point"/>
    <circle cx="86" cy="28.9" r="2.5" class="point"/>
    <circle cx="233" cy="138" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="86" y="18" class="label">A</text>
    <text x="19" y="96" class="label">B</text>
    <text x="145" y="156" class="label">C</text>
    <text x="223" y="135" class="label">D</text>
    <text x="19" y="158" class="label">E</text>
    <text x="19" y="33" class="label">F</text>
</g>

</svg>
