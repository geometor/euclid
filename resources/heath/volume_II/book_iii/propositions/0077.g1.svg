    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; B A C &gt;; &lt; C A B &gt;" points="138.0,148.0 30.0,95.0 86.0,28.91" class="geom-polygon geom-overlay" />
    <path id="hl-arc-BAC" data-ref="( B A C )" data-aliases="( C A B )" d="M 30.00 95.00 A 67 67 0 1 0 86.00 28.91" class="geom-arc geom-overlay" />
