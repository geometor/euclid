    <!-- Segments -->
    <line id="el-seg-DD1" data-ref="/ D D1 /" data-type="segment" x1="233.0" y1="138.0" x2="301.0" y2="138.0" class="geom-line" />
    <line id="el-seg-DD2" data-ref="/ D D2 /" data-type="segment" x1="233.0" y1="138.0" x2="289.0" y2="92.0" class="geom-line" />
    <line id="el-seg-EF" data-ref="/ E F /" data-aliases="/ F E /; [ E F ]; [ F E ]" data-type="segment" x1="30.0" y1="158.0" x2="30.0" y2="28.0" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="30.0" y1="95.0" x2="86.0" y2="28.91" class="geom-line" />
    <line id="el-seg-BA" data-ref="/ B A /" data-aliases="/ A B /" data-type="segment" x1="30.0" y1="95.0" x2="138.0" y2="148.0" class="geom-line" />
    <line id="el-seg-CA" data-ref="/ C A /" data-aliases="/ A C /" data-type="segment" x1="86.0" y1="28.91" x2="138.0" y2="148.0" class="geom-line" />
    <line id="el-seg-FB" data-ref="/ F B /" data-aliases="/ B F /" data-type="segment" x1="30.0" y1="28.0" x2="30.0" y2="95.0" class="geom-line geom-overlay" />
    <line id="el-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" data-type="segment" x1="30.0" y1="95.0" x2="30.0" y2="158.0" class="geom-line geom-overlay" />
    <polyline id="el-sec-EBF" data-ref="/ E B F /" data-aliases="/ F B E /; } E B F {; } F B E {" data-type="section" points="30.0,158.0 30.0,95.0 30.0,28.0" fill="none" class="geom-line geom-overlay" />
  </g>

