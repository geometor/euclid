    <line id="hl-seg-EF" data-ref="/ E F /" data-aliases="/ F E /; [ E F ]; [ F E ]" x1="30.0" y1="158.0" x2="30.0" y2="28.0" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="30.0" y1="95.0" x2="86.0" y2="28.91" class="geom-line geom-overlay" />
    <line id="hl-seg-BA" data-ref="/ B A /" data-aliases="/ A B /" x1="30.0" y1="95.0" x2="138.0" y2="148.0" class="geom-line geom-overlay" />
    <line id="hl-seg-CA" data-ref="/ C A /" data-aliases="/ A C /" x1="86.0" y1="28.91" x2="138.0" y2="148.0" class="geom-line geom-overlay" />
    <line id="hl-seg-FB" data-ref="/ F B /" data-aliases="/ B F /" x1="30.0" y1="28.0" x2="30.0" y2="95.0" class="geom-line geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" x1="30.0" y1="95.0" x2="30.0" y2="158.0" class="geom-line geom-overlay" />
    <polyline id="hl-sec-EBF" data-ref="/ E B F /" data-aliases="/ F B E /; } E B F {; } F B E {" points="30.0,158.0 30.0,95.0 30.0,28.0" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
