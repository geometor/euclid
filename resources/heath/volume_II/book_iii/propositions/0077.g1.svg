    <!-- Arcs -->
    <path id="el-arc-BAC" data-ref="( B A C )" data-aliases="( C A B )" data-type="arc" d="M 30.00 95.00 A 67 67 0 1 0 86.00 28.91" class="geom-arc geom-overlay" />

    <!-- Angles -->
    <path id="el-ang-D" data-ref="&lt; D )" data-aliases="D; &lt; D1 D D2 ); &lt; D2 D D1 )" data-type="wedge" d="M 233.00 138.00 L 245.36 127.84 A 16 16 0 0 1 249.00 138.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-FBC" data-ref="&lt; F B C )" data-aliases="&lt; C B F )" data-type="wedge" d="M 30.00 95.00 L 30.00 77.00 A 18 18 0 0 1 41.64 81.27 Z" class="wedge angle geom-overlay" />
