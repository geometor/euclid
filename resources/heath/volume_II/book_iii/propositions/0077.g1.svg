  <g id="elements">
    <circle id="el-circle-ABC" data-ref="( O B )" data-aliases="( A B C ); ( A C B ); ( O A ); ( O C )" data-type="circle" cx="97" cy="95" r="67" class="geom-circle" />
  </g>

