<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 153" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="176" height="153" fill="#ffffff"/>

<g id="circle-ABCD" class="interactive">
    <circle cx="86" cy="76" r="61" class="geometry"/>
</g>
<g id="diameters-AC-BD" class="interactive">
    <line x1="25" y1="76" x2="147" y2="76" class="geometry"/>
    <line x1="39.3" y1="36.8" x2="132.7" y2="115.2" class="geometry"/>
</g>
<g id="points">
    <circle cx="86" cy="76" r="2.5" class="point"/>
    <circle cx="25" cy="76" r="2.5" class="point"/>
    <circle cx="147" cy="76" r="2.5" class="point"/>
    <circle cx="39.3" cy="36.8" r="2.5" class="point"/>
    <circle cx="132.7" cy="115.2" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="31" y="29" class="label">A</text>
    <text x="16" y="76" class="label">B</text>
    <text x="140" y="122" class="label">C</text>
    <text x="157" y="76" class="label">D</text>
    <text x="84" y="87" class="label">E</text>
</g>

</svg>
