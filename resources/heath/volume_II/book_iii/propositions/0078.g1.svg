<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 193 200" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="193" height="200" fill="#ffffff"/>

<g id="circle-ABCD" class="interactive">
    <circle cx="95" cy="92" r="78" class="geometry"/>
</g>
<g id="chords-AC-BD" class="interactive">
    <line x1="24.3" y1="59" x2="101" y2="169.8" class="geometry"/>
    <line x1="68" y1="165.2" x2="165.7" y2="59" class="geometry"/>
</g>
<g id="construction-lines" class="interactive">
    <line x1="95" y1="92" x2="62.6" y2="114.4" class="construction"/>
    <line x1="95" y1="92" x2="116.8" y2="112.1" class="construction"/>
    <line x1="95" y1="92" x2="68" y2="165.2" class="construction"/>
    <line x1="95" y1="92" x2="101" y2="169.8" class="construction"/>
    <line x1="95" y1="92" x2="83.4" y2="144.4" class="construction"/>
</g>
<g id="points">
    <circle cx="95" cy="92" r="2.5" class="point"/>
    <circle cx="24.3" cy="59" r="2.5" class="point"/>
    <circle cx="101" cy="169.8" r="2.5" class="point"/>
    <circle cx="68" cy="165.2" r="2.5" class="point"/>
    <circle cx="165.7" cy="59" r="2.5" class="point"/>
    <circle cx="83.4" cy="144.4" r="2.5" class="point"/>
    <circle cx="62.6" cy="114.4" r="2.5" class="point"/>
    <circle cx="116.8" cy="112.1" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="17" y="54" class="label">A</text>
    <text x="68" y="178" class="label">B</text>
    <text x="103" y="181" class="label">C</text>
    <text x="175" y="55" class="label">D</text>
    <text x="76" y="152" class="label">E</text>
    <text x="98" y="81" class="label">F</text>
    <text x="53" y="120" class="label">G</text>
    <text x="128" y="116" class="label">H</text>
</g>

</svg>
