    <polygon id="hl-tri-FBD" data-ref="&lt; F B D &gt;" data-aliases="&lt; B D F &gt; | &lt; D F B &gt;" points="84.0,74.0 26.0,74.0 26.0,152.0" class="geom-polygon geom-overlay" />
    <path id="hl-ang-FBD" data-ref="&lt; F B D )" data-aliases="&lt; D B F )" d="M 26.00 74.00 L 40.00 74.00 A 14 14 0 0 1 26.00 88.00 Z" class="wedge angle geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="118.61" y1="27.46" x2="26.0" y2="152.0" class="geom-line geom-overlay" />
    <line id="hl-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" x1="26.0" y1="152.0" x2="26.0" y2="74.0" class="geom-line geom-overlay" />
    <line id="hl-seg-FB" data-ref="/ F B /" data-aliases="/ B F /" x1="84.0" y1="74.0" x2="26.0" y2="74.0" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="118.61" y1="27.46" x2="49.39" y2="120.54" class="geom-line geom-overlay" />
    <line id="hl-seg-AF" data-ref="/ A F /" data-aliases="/ F A /" x1="118.61" y1="27.46" x2="84.0" y2="74.0" class="geom-line geom-overlay" />
    <line id="hl-seg-FC" data-ref="/ F C /" data-aliases="/ C F /" x1="84.0" y1="74.0" x2="49.39" y2="120.54" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="49.39" y1="120.54" x2="26.0" y2="152.0" class="geom-line geom-overlay" />
    <line id="hl-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" x1="84.0" y1="74.0" x2="26.0" y2="152.0" class="geom-line geom-overlay" />
    <polyline id="hl-sec-DCA" data-ref="/ D C A /" data-aliases="/ A C D / | } D C A { | } A C D {" points="26.0,152.0 49.39,120.54 118.61,27.46" fill="none" class="geom-line geom-overlay" />
    <polyline id="hl-sec-DCF" data-ref="/ D C F /" data-aliases="/ F C D / | } D C F { | } F C D {" points="26.0,152.0 49.39,120.54 84.0,74.0" fill="none" class="geom-line geom-overlay" />
    <polyline id="hl-sec-CFA" data-ref="/ C F A /" data-aliases="/ A F C / | } C F A { | } A F C {" points="49.39,120.54 84.0,74.0 118.61,27.46" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="118.61" cy="27.46" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="26.0" cy="74.0" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="49.39" cy="120.54" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="26.0" cy="152.0" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="84.0" cy="74.0" r="3.5" class="geom-point" />
