<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 174" width="156" height="174" class="euclid-graphic" data-graphic-id="0080.g1" data-folio="0080" data-graphic="g1" data-proposition="III.36">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle, .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <circle id="el-circle-ABC" data-ref="( F B )" data-aliases="( A B C ) | ( A C B ) | ( F A ) | ( F C )" data-type="circle" cx="84" cy="74" r="58" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
    <polygon id="el-tri-FBD" data-ref="&lt; F B D &gt;" data-aliases="&lt; B D F &gt; | &lt; D F B &gt;" data-type="polygon" points="84.0,74.0 26.0,74.0 26.0,152.0" class="geom-polygon" />
    <path id="el-ang-FBD" data-ref="&lt; F B D )" data-aliases="&lt; D B F )" data-type="wedge" d="M 26.00 74.00 L 40.00 74.00 A 14 14 0 0 1 26.00 88.00 Z" class="wedge angle geom-overlay" />

    <!-- Drawn Segments -->
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="118.61" y1="27.46" x2="26.0" y2="152.0" class="geom-line" />
    <line id="el-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" data-type="segment" x1="26.0" y1="152.0" x2="26.0" y2="74.0" class="geom-line" />
    <line id="el-seg-FB" data-ref="/ F B /" data-aliases="/ B F /" data-type="segment" x1="84.0" y1="74.0" x2="26.0" y2="74.0" class="geom-line" />

    <!-- Sub-segments -->
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="118.61" y1="27.46" x2="49.39" y2="120.54" class="geom-line geom-overlay" />
    <line id="el-seg-AF" data-ref="/ A F /" data-aliases="/ F A /" data-type="segment" x1="118.61" y1="27.46" x2="84.0" y2="74.0" class="geom-line geom-overlay" />
    <line id="el-seg-FC" data-ref="/ F C /" data-aliases="/ C F /" data-type="segment" x1="84.0" y1="74.0" x2="49.39" y2="120.54" class="geom-line geom-overlay" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="49.39" y1="120.54" x2="26.0" y2="152.0" class="geom-line geom-overlay" />
    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" data-type="segment" x1="84.0" y1="74.0" x2="26.0" y2="152.0" class="geom-line geom-overlay" />

    <!-- Sections -->
    <polyline id="el-sec-DCA" data-ref="/ D C A /" data-aliases="/ A C D / | } D C A { | } A C D {" data-type="section" points="26.0,152.0 49.39,120.54 118.61,27.46" fill="none" class="geom-line geom-overlay" />
    <polyline id="el-sec-DCF" data-ref="/ D C F /" data-aliases="/ F C D / | } D C F { | } F C D {" data-type="section" points="26.0,152.0 49.39,120.54 84.0,74.0" fill="none" class="geom-line geom-overlay" />
    <polyline id="el-sec-CFA" data-ref="/ C F A /" data-aliases="/ A F C / | } C F A { | } A F C {" data-type="section" points="49.39,120.54 84.0,74.0 118.61,27.46" fill="none" class="geom-line geom-overlay" />
  </g>

