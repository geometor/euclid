<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 174" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="156" height="174" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="84" cy="74" r="58" class="geometry"/>
</g>
<g id="secant-DCA" class="interactive">
    <line x1="26" y1="152" x2="118.6" y2="27.4" class="geometry"/>
</g>
<g id="tangent-DB-and-radius-FB" class="interactive">
    <line x1="26" y1="152" x2="26" y2="74" class="geometry"/>
    <line x1="84" y1="74" x2="26" y2="74" class="construction"/>
</g>
<g id="points">
    <circle cx="84" cy="74" r="2.5" class="point"/>
    <circle cx="26" cy="152" r="2.5" class="point"/>
    <circle cx="26" cy="74" r="2.5" class="point"/>
    <circle cx="49.4" cy="120.6" r="2.5" class="point"/>
    <circle cx="118.6" cy="27.4" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="122" y="18" class="label">A</text>
    <text x="16" y="74" class="label">B</text>
    <text x="38" y="138" class="label">C</text>
    <text x="18" y="156" class="label">D</text>
    <text x="92" y="80" class="label">F</text>
</g>

</svg>
