<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 158" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="212" height="158" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="138" cy="70" r="54" class="geometry"/>
</g>
<g id="secant-DCA" class="interactive">
    <line x1="24" y1="129" x2="185" y2="96.6" class="geometry"/>
</g>
<g id="tangent-DB" class="interactive">
    <line x1="24" y1="129" x2="138" y2="124" class="geometry"/>
</g>
<g id="construction-lines" class="interactive">
    <line x1="138" y1="70" x2="138" y2="124" class="construction"/>
    <line x1="138" y1="70" x2="144.8" y2="104.7" class="construction"/>
    <line x1="138" y1="70" x2="104.6" y2="112.8" class="construction"/>
    <line x1="138" y1="70" x2="24" y2="129" class="construction"/>
</g>
<g id="points">
    <circle cx="138" cy="70" r="2.5" class="point"/>
    <circle cx="24" cy="129" r="2.5" class="point"/>
    <circle cx="138" cy="124" r="2.5" class="point"/>
    <circle cx="104.6" cy="112.8" r="2.5" class="point"/>
    <circle cx="144.8" cy="104.7" r="2.5" class="point"/>
    <circle cx="185" cy="96.6" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="194" y="99" class="label">A</text>
    <text x="139" y="135" class="label">B</text>
    <text x="101" y="102" class="label">C</text>
    <text x="16" y="136" class="label">D</text>
    <text x="139" y="60" class="label">E</text>
    <text x="150" y="96" class="label">F</text>
</g>

</svg>
