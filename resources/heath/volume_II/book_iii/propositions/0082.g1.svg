<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 227 156" width="100%" height="auto" class="euclid-diagram">
<style>
.euclid-diagram {
    display: block;
    max-width: 100%;
    margin: 1.5rem auto;
    background-color: #ffffff;
}
.geometry {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.construction {
    stroke: #000000;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4, 3;
    fill: none;
}
.point {
    fill: #000000;
}
.label {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
}
.interactive {
    cursor: pointer;
}
.interactive:hover .geometry,
.interactive:hover.geometry,
.interactive:hover .construction,
.interactive:hover.construction {
    stroke: #0284c7;
    stroke-width: 2.5;
}
.interactive:hover .point,
.interactive:hover.point {
    fill: #0284c7;
}
.interactive:hover .label,
.interactive:hover.label {
    fill: #0284c7;
    font-weight: bold;
}
</style>
<rect width="227" height="156" fill="#ffffff"/>

<g id="circle-ABC" class="interactive">
    <circle cx="156" cy="84" r="52" class="geometry"/>
</g>
<g id="line-DB" class="interactive">
    <line x1="24" y1="30" x2="156" y2="32" class="geometry"/>
</g>
<g id="secant-DCA" class="interactive">
    <line x1="24" y1="30" x2="182" y2="129" class="geometry"/>
</g>
<g id="tangent-DE" class="interactive">
    <line x1="24" y1="30" x2="117" y2="118.4" class="construction"/>
</g>
<g id="radii-FB-FE-and-FD" class="interactive">
    <line x1="156" y1="84" x2="156" y2="32" class="construction"/>
    <line x1="156" y1="84" x2="117" y2="118.4" class="construction"/>
    <line x1="156" y1="84" x2="24" y2="30" class="construction"/>
</g>
<g id="points">
    <circle cx="156" cy="84" r="2.5" class="point"/>
    <circle cx="24" cy="30" r="2.5" class="point"/>
    <circle cx="156" cy="32" r="2.5" class="point"/>
    <circle cx="105" cy="80.8" r="2.5" class="point"/>
    <circle cx="182" cy="129" r="2.5" class="point"/>
    <circle cx="117" cy="118.4" r="2.5" class="point"/>
</g>
<g id="labels">
    <text x="190" y="135" class="label">A</text>
    <text x="159" y="21" class="label">B</text>
    <text x="95" y="65" class="label">C</text>
    <text x="17" y="28" class="label">D</text>
    <text x="114" y="128" class="label">E</text>
    <text x="165" y="84" class="label">F</text>
</g>

</svg>
