<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 198 200" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="198" height="200" fill="#ffffff"/>
  <circle cx="99.00" cy="99.00" r="71.00" class="geometry interactive"/>
  <polygon points="99.00,28.00 28.00,99.00 99.00,170.00 170.00,99.00" class="geometry interactive"/>
  <line x1="99.00" y1="28.00" x2="99.00" y2="170.00" class="geometry interactive"/>
  <line x1="28.00" y1="99.00" x2="170.00" y2="99.00" class="geometry interactive"/>
  <circle cx="99.00" cy="28.00" r="2.5" class="point"/>
  <circle cx="28.00" cy="99.00" r="2.5" class="point"/>
  <circle cx="99.00" cy="170.00" r="2.5" class="point"/>
  <circle cx="170.00" cy="99.00" r="2.5" class="point"/>
  <circle cx="99.00" cy="99.00" r="2.5" class="point"/>
  <text x="99.00" y="17.00" class="label">A</text>
  <text x="17.00" y="99.00" class="label">B</text>
  <text x="99.00" y="182.00" class="label">C</text>
  <text x="181.00" y="99.00" class="label">D</text>
  <text x="108.00" y="90.00" class="label">E</text>
</svg>
