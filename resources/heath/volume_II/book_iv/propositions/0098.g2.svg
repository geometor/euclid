  <line x1="26.00" y1="95.00" x2="154.00" y2="95.00" class="geometry interactive"/>
  <circle cx="90.00" cy="31.00" r="2.5" class="point"/>
  <circle cx="26.00" cy="95.00" r="2.5" class="point"/>
  <circle cx="90.00" cy="159.00" r="2.5" class="point"/>
  <circle cx="154.00" cy="95.00" r="2.5" class="point"/>
