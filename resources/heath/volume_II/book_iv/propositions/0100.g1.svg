<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 200" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="192" height="200" fill="#ffffff"/>
  <polygon points="26.00,29.00 166.00,29.00 166.00,169.00 26.00,169.00" class="geometry interactive"/>
  <circle cx="96.00" cy="99.00" r="70.00" class="geometry interactive"/>
  <line x1="96.00" y1="29.00" x2="96.00" y2="169.00" class="geometry interactive"/>
  <line x1="26.00" y1="99.00" x2="166.00" y2="99.00" class="geometry interactive"/>
  <circle cx="26.00" cy="29.00" r="2.5" class="point"/>
  <circle cx="26.00" cy="169.00" r="2.5" class="point"/>
  <circle cx="166.00" cy="169.00" r="2.5" class="point"/>
  <circle cx="166.00" cy="29.00" r="2.5" class="point"/>
  <circle cx="96.00" cy="29.00" r="2.5" class="point"/>
  <circle cx="26.00" cy="99.00" r="2.5" class="point"/>
  <circle cx="96.00" cy="99.00" r="2.5" class="point"/>
  <circle cx="96.00" cy="169.00" r="2.5" class="point"/>
  <circle cx="166.00" cy="99.00" r="2.5" class="point"/>
  <text x="23.00" y="18.00" class="label">A</text>
  <text x="96.00" y="18.00" class="label">E</text>
  <text x="169.00" y="18.00" class="label">D</text>
  <text x="16.00" y="99.00" class="label">F</text>
  <text x="105.00" y="90.00" class="label">G</text>
  <text x="176.00" y="99.00" class="label">K</text>
  <text x="23.00" y="181.00" class="label">B</text>
  <text x="96.00" y="181.00" class="label">H</text>
  <text x="169.00" y="181.00" class="label">C</text>
</svg>
