<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 174 175" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="174" height="175" fill="#ffffff"/>
  <circle cx="87.00" cy="89.00" r="59.00" class="geometry interactive"/>
  <polygon points="87.00,30.00 28.00,89.00 87.00,148.00 146.00,89.00" class="geometry interactive"/>
  <line x1="87.00" y1="30.00" x2="87.00" y2="148.00" class="geometry interactive"/>
  <line x1="28.00" y1="89.00" x2="146.00" y2="89.00" class="geometry interactive"/>
  <circle cx="87.00" cy="30.00" r="2.5" class="point"/>
  <circle cx="28.00" cy="89.00" r="2.5" class="point"/>
  <circle cx="87.00" cy="148.00" r="2.5" class="point"/>
  <circle cx="146.00" cy="89.00" r="2.5" class="point"/>
  <circle cx="87.00" cy="89.00" r="2.5" class="point"/>
  <text x="87.00" y="19.00" class="label">A</text>
  <text x="18.00" y="89.00" class="label">B</text>
  <text x="87.00" y="160.00" class="label">C</text>
  <text x="156.00" y="89.00" class="label">D</text>
  <text x="96.00" y="80.00" class="label">E</text>
</svg>
