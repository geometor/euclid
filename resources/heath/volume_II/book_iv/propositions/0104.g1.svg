<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 95 92" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="95" height="92" fill="#ffffff"/>
  <polygon points="12.00,12.00 82.00,12.00 82.00,82.00 12.00,82.00" class="geometry interactive"/>
  <line x1="12.00" y1="12.00" x2="82.00" y2="82.00" class="geometry interactive"/>
  <line x1="12.00" y1="82.00" x2="82.00" y2="12.00" class="geometry interactive"/>
</svg>
