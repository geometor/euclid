  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements" />

  <!-- Constructed Graphics -->
  <g id="graphics">
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-type="polygon" points="65.00,18.86 17.00,102.00 113.00,102.00" class="geom-polygon" />
    <line id="el-seg-AB" data-ref="/ A B /" data-type="segment" x1="65.00" y1="18.86" x2="17.00" y2="102.00" class="geom-line" />
