    <line id="el-seg-AD" data-ref="/ A D /" data-type="segment" x1="65.00" y1="18.86" x2="65.00" y2="102.00" class="geom-line" />
    <line id="el-seg-BE" data-ref="/ B E /" data-type="segment" x1="17.00" y1="102.00" x2="89.00" y2="60.43" class="geom-line" />
