<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 125" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="370" height="125" />
  <g class="el" data-name="A">
    <line class="line" x1="33.0" y1="23.0" x2="69.0" y2="23.0" />
    <text class="lbl" x="22.0" y="23.0">A</text>
  </g>
  <g class="el" data-name="B">
    <line class="line" x1="31.0" y1="44.5" x2="88.0" y2="44.5" />
    <text class="lbl" x="20.0" y="44.5">B</text>
  </g>
  <g class="el" data-name="C">
    <line class="line" x1="33.0" y1="62.5" x2="109.0" y2="62.5" />
    <text class="lbl" x="22.0" y="62.5">C</text>
  </g>
  <g class="el" data-name="D">
    <line class="line" x1="32.0" y1="84.5" x2="157.0" y2="84.5" />
    <text class="lbl" x="21.0" y="84.5">D</text>
  </g>
  <g class="el" data-name="E">
    <line class="line" x1="31.0" y1="104.5" x2="53.0" y2="104.5" />
    <text class="lbl" x="20.0" y="104.5">E</text>
  </g>
  <g class="el" data-name="F">
    <line class="line" x1="196.0" y1="23.5" x2="350.0" y2="23.5" />
    <text class="lbl" x="185.0" y="23.5">F</text>
  </g>
  <g class="el" data-name="G">
    <line class="line" x1="196.0" y1="45.5" x2="306.0" y2="45.5" />
    <text class="lbl" x="185.0" y="45.5">G</text>
  </g>
  <g class="el" data-name="H">
    <line class="line" x1="196.0" y1="68.5" x2="270.0" y2="68.5" />
    <text class="lbl" x="185.0" y="68.5">H</text>
  </g>
</svg>
