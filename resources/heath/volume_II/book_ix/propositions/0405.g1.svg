<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 115" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="405" height="115" />
  <g class="el" data-name="A">
    <line class="line" x1="31.0" y1="23.5" x2="110.0" y2="23.5" />
    <text class="lbl" x="20.0" y="23.5">A</text>
  </g>
  <g class="el" data-name="B">
    <line class="line" x1="34.0" y1="45.5" x2="129.0" y2="45.5" />
    <text class="lbl" x="23.0" y="45.5">B</text>
  </g>
  <g class="el" data-name="C">
    <line class="line" x1="30.0" y1="71.5" x2="165.0" y2="71.5" />
    <text class="lbl" x="19.0" y="71.5">C</text>
  </g>
  <g class="el" data-name="D">
    <line class="line" x1="31.0" y1="95.0" x2="206.0" y2="95.0" />
    <text class="lbl" x="20.0" y="95.0">D</text>
  </g>
  <g class="el" data-name="E">
    <line class="line" x1="265.0" y1="23.5" x2="306.0" y2="23.5" />
    <text class="lbl" x="254.0" y="23.5">E</text>
  </g>
  <g class="el" data-name="F">
    <line class="line" x1="265.0" y1="45.5" x2="390.0" y2="45.5" />
    <text class="lbl" x="254.0" y="45.5">F</text>
  </g>
  <g class="el" data-name="G">
    <line class="line" x1="265.0" y1="71.5" x2="322.0" y2="71.5" />
    <text class="lbl" x="254.0" y="71.5">G</text>
  </g>
  <g class="el" data-name="H">
    <line class="line" x1="273.0" y1="95.5" x2="350.0" y2="95.5" />
    <text class="lbl" x="262.0" y="95.5">H</text>
  </g>
</svg>
