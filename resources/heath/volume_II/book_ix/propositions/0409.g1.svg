<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 335 90" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="335" height="90" />
  <g class="el" data-name="A">
    <line class="line" x1="32.0" y1="20.0" x2="174.0" y2="20.0" />
    <text class="lbl" x="21.0" y="20.0">A</text>
  </g>
  <g class="el" data-name="E">
    <line class="line" x1="31.0" y1="42.5" x2="101.0" y2="42.5" />
    <text class="lbl" x="20.0" y="42.5">E</text>
  </g>
  <g class="el" data-name="F">
    <line class="line" x1="34.0" y1="71.5" x2="94.0" y2="71.5" />
    <text class="lbl" x="23.0" y="71.5">F</text>
  </g>
  <g class="el" data-name="B">
    <line class="line" x1="263.0" y1="19.5" x2="289.0" y2="19.5" />
    <text class="lbl" x="252.0" y="19.5">B</text>
  </g>
  <g class="el" data-name="C">
    <line class="line" x1="263.0" y1="42.5" x2="305.0" y2="42.5" />
    <text class="lbl" x="252.0" y="42.5">C</text>
  </g>
  <g class="el" data-name="D">
    <line class="line" x1="263.0" y1="60.5" x2="317.0" y2="60.5" />
    <text class="lbl" x="252.0" y="60.5">D</text>
  </g>
</svg>
