<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="220" height="100" />
  <g class="el" data-name="A">
    <line class="line" x1="33.0" y1="21.5" x2="68.0" y2="21.5" />
    <text class="lbl" x="22.0" y="21.5">A</text>
  </g>
  <g class="el" data-name="B">
    <line class="line" x1="153.0" y1="21.5" x2="206.0" y2="21.5" />
    <text class="lbl" x="142.0" y="21.5">B</text>
  </g>
  <g class="el" data-name="C">
    <line class="line" x1="80.0" y1="47.5" x2="163.0" y2="47.5" />
    <text class="lbl" x="69.0" y="47.5">C</text>
  </g>
  <g class="el" data-name="DF">
    <line class="line" x1="79.0" y1="75.0" x2="163.0" y2="75.0" />
    <text class="lbl" x="69.0" y="75.0">D</text>
    <line class="tick" x1="119.0" y1="71.5" x2="119.0" y2="78.5" />
    <text class="lbl" x="119.0" y="64.0">E</text>
    <text class="lbl" x="173.0" y="75.0">F</text>
  </g>
</svg>
