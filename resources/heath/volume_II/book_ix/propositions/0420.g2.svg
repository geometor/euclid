<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 50" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="270" height="50" />
  <g class="el" data-name="AD">
    <line class="line" x1="13.0" y1="26.5" x2="254.0" y2="26.5" />
    <text class="lbl" x="18.0" y="14.0">A</text>
    <line class="tick" x1="63.0" y1="23.0" x2="63.0" y2="30.0" />
    <text class="lbl" x="63.0" y="14.0">B</text>
    <line class="tick" x1="177.0" y1="23.0" x2="177.0" y2="30.0" />
    <text class="lbl" x="177.0" y="14.0">C</text>
    <line class="tick" x1="237.0" y1="23.0" x2="237.0" y2="30.0" />
    <text class="lbl" x="237.0" y="14.0">E</text>
    <text class="lbl" x="251.0" y="14.0">D</text>
  </g>
</svg>
