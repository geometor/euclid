<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 50" width="180" height="50" class="euclid-graphic" data-graphic-id="0420.g3" data-folio="0420" data-graphic="g3" data-proposition="IX.24">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-AB" data-ref="[ A B ]" data-aliases="[ B A ]" data-type="line" x1="14.00" y1="30.00" x2="163.00" y2="30.00" class="geom-line" />
    <!-- Tick mark at C -->
    <line x1="118.00" y1="26.50" x2="118.00" y2="33.50" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Segments & Sub-segments) -->
  <g id="graphics">
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="14.00" y1="30.00" x2="163.00" y2="30.00" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="14.00" y1="30.00" x2="118.00" y2="30.00" class="geom-line geom-overlay" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="118.00" y1="30.00" x2="163.00" y2="30.00" class="geom-line geom-overlay" />
    <polyline id="el-sec-ACB" data-ref="/ A C B /" data-aliases="/ B C A /; } A C B {; } B C A {" data-type="section" points="14.00,30.00 118.00,30.00 163.00,30.00" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="14.00" y1="30.00" x2="163.00" y2="30.00" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="14.00" y1="30.00" x2="118.00" y2="30.00" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="118.00" y1="30.00" x2="163.00" y2="30.00" class="geom-line geom-overlay" />
    <polyline id="hl-sec-ACB" data-ref="/ A C B /" data-aliases="/ B C A /; } A C B {; } B C A {" points="14.00,30.00 118.00,30.00 163.00,30.00" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="14.00" cy="30.00" r="2.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="118.00" cy="30.00" r="2.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="163.00" cy="30.00" r="2.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="19.00" y="17.00" class="geom-label">A</text>
    <text id="lbl-C" data-ref="C" x="118.00" y="17.00" class="geom-label">C</text>
    <text id="lbl-B" data-ref="B" x="158.00" y="17.00" class="geom-label">B</text>
  </g>
</svg>
