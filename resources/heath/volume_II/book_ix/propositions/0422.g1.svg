    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="11.00" y1="29.00" x2="28.00" y2="29.00" class="geom-line geom-overlay" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="11.00" y1="29.00" x2="92.00" y2="29.00" class="geom-line geom-overlay" />
