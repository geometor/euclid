    <polyline id="el-sec-ACB" data-ref="/ A C B /" data-aliases="/ B C A / | } A C B { | } B C A {" data-type="section" points="11.00,29.00 92.00,29.00 159.00,29.00" fill="none" class="geom-line geom-overlay" />
