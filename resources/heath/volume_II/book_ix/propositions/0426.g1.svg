<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285 100" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="285" height="100" />
  <g class="el" data-name="A">
    <line class="line" x1="235.0" y1="13.0" x2="265.0" y2="13.0" />
    <text class="lbl" x="224.0" y="13.0">A</text>
  </g>
  <g class="el" data-name="BC">
    <line class="line" x1="205.0" y1="28.5" x2="265.0" y2="28.5" />
    <text class="lbl" x="195.0" y="28.5">B</text>
    <line class="tick" x1="235.0" y1="25.0" x2="235.0" y2="32.0" />
    <text class="lbl" x="235.0" y="39.0">G</text>
    <text class="lbl" x="275.0" y="28.5">C</text>
  </g>
  <g class="el" data-name="D">
    <line class="line" x1="176.0" y1="53.0" x2="267.0" y2="53.0" />
    <text class="lbl" x="165.0" y="53.0">D</text>
  </g>
  <g class="el" data-name="EF">
    <line class="line" x1="15.0" y1="78.0" x2="266.0" y2="78.0" />
    <text class="lbl" x="5.0" y="78.0">E</text>
    <line class="tick" x1="176.0" y1="74.5" x2="176.0" y2="81.5" />
    <text class="lbl" x="176.0" y="89.0">L</text>
    <line class="tick" x1="205.0" y1="74.5" x2="205.0" y2="81.5" />
    <text class="lbl" x="221.0" y="89.0">K</text>
    <line class="tick" x1="235.0" y1="74.5" x2="235.0" y2="81.5" />
    <text class="lbl" x="241.0" y="89.0">H</text>
    <text class="lbl" x="275.0" y="78.0">F</text>
  </g>
</svg>
