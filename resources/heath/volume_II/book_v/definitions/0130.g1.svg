  <text x="253.00" y="123.00" class="label">a<tspan dy="3" font-size="11px" font-style="normal">3</tspan></text>
  <line x1="332.00" y1="37.89" x2="332.00" y2="113.00" class="construction interactive"/>
  <text x="334.00" y="27.89" class="label">b<tspan dy="3" font-size="11px" font-style="normal">4</tspan></text>
  <text x="332.00" y="123.00" class="label">a<tspan dy="3" font-size="11px" font-style="normal">4</tspan></text>
