<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 414 139" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="414" height="139" fill="#ffffff"/>
  <line x1="20.00" y1="113.00" x2="398.00" y2="22.00" class="geometry interactive"/>
  <line x1="20.00" y1="113.00" x2="403.00" y2="113.00" class="geometry interactive"/>
  <text x="16.00" y="123.00" class="label" font-style="normal" font-size="14px">O</text>
  <line x1="94.00" y1="95.19" x2="94.00" y2="113.00" class="construction interactive"/>
  <text x="96.00" y="85.19" class="label">b</text>
  <text x="94.00" y="123.00" class="label">a</text>
  <line x1="172.00" y1="76.41" x2="172.00" y2="113.00" class="construction interactive"/>
  <text x="174.00" y="66.41" class="label">b<tspan dy="3" font-size="11px" font-style="normal">2</tspan></text>
  <text x="172.00" y="123.00" class="label">a<tspan dy="3" font-size="11px" font-style="normal">2</tspan></text>
  <line x1="253.00" y1="56.91" x2="253.00" y2="113.00" class="construction interactive"/>
