<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 105" width="500" height="105" class="euclid-graphic" data-graphic-id="0133.g1" data-folio="0133" data-graphic="g1" data-proposition="V.def.5">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Magnitude Bars) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="26.00" y1="22.00" x2="152.00" y2="22.00" class="geom-line" />
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="26.00" y1="45.00" x2="68.00" y2="45.00" class="geom-line" />
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="26.00" y1="68.00" x2="111.00" y2="68.00" class="geom-line" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="26.00" y1="90.00" x2="56.00" y2="90.00" class="geom-line" />
    <line id="el-mag-E" data-ref="E" data-aliases="/ E /" data-type="segment" x1="232.00" y1="22.00" x2="478.00" y2="22.00" class="geom-line" />
    <line id="el-mag-G" data-ref="G" data-aliases="/ G /" data-type="segment" x1="232.00" y1="45.00" x2="316.00" y2="45.00" class="geom-line" />
    <line id="el-mag-F" data-ref="F" data-aliases="/ F /" data-type="segment" x1="232.00" y1="68.00" x2="401.00" y2="68.00" class="geom-line" />
    <line id="el-mag-H" data-ref="H" data-aliases="/ H /" data-type="segment" x1="232.00" y1="90.00" x2="289.00" y2="90.00" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /" x1="26.00" y1="22.00" x2="152.00" y2="22.00" class="geom-line geom-overlay" />
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /" x1="26.00" y1="45.00" x2="68.00" y2="45.00" class="geom-line geom-overlay" />
    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /" x1="26.00" y1="68.00" x2="111.00" y2="68.00" class="geom-line geom-overlay" />
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="26.00" y1="90.00" x2="56.00" y2="90.00" class="geom-line geom-overlay" />
    <line id="hl-mag-E" data-ref="E" data-aliases="/ E /" x1="232.00" y1="22.00" x2="478.00" y2="22.00" class="geom-line geom-overlay" />
    <line id="hl-mag-G" data-ref="G" data-aliases="/ G /" x1="232.00" y1="45.00" x2="316.00" y2="45.00" class="geom-line geom-overlay" />
    <line id="hl-mag-F" data-ref="F" data-aliases="/ F /" x1="232.00" y1="68.00" x2="401.00" y2="68.00" class="geom-line geom-overlay" />
    <line id="hl-mag-H" data-ref="H" data-aliases="/ H /" x1="232.00" y1="90.00" x2="289.00" y2="90.00" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="16.00" y="22.00" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="16.00" y="45.00" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="16.00" y="68.00" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="16.00" y="90.00" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="222.00" y="22.00" class="geom-label">E</text>
    <text id="lbl-G" data-ref="G" x="222.00" y="45.00" class="geom-label">G</text>
    <text id="lbl-F" data-ref="F" x="222.00" y="68.00" class="geom-label">F</text>
    <text id="lbl-H" data-ref="H" x="222.00" y="90.00" class="geom-label">H</text>
  </g>
</svg>
