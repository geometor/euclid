<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 105" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="500" height="105" fill="#ffffff"/>
  <line x1="26.00" y1="22.00" x2="152.00" y2="22.00" class="geometry interactive"/>
  <text x="16.00" y="22.00" class="label">A</text>
  <line x1="26.00" y1="45.00" x2="68.00" y2="45.00" class="geometry interactive"/>
  <text x="16.00" y="45.00" class="label">B</text>
  <line x1="26.00" y1="68.00" x2="111.00" y2="68.00" class="geometry interactive"/>
  <text x="16.00" y="68.00" class="label">C</text>
  <line x1="26.00" y1="90.00" x2="56.00" y2="90.00" class="geometry interactive"/>
  <text x="16.00" y="90.00" class="label">D</text>
  <line x1="232.00" y1="22.00" x2="478.00" y2="22.00" class="geometry interactive"/>
  <text x="222.00" y="22.00" class="label">E</text>
  <line x1="232.00" y1="45.00" x2="316.00" y2="45.00" class="geometry interactive"/>
  <text x="222.00" y="45.00" class="label">G</text>
  <line x1="232.00" y1="68.00" x2="401.00" y2="68.00" class="geometry interactive"/>
  <text x="222.00" y="68.00" class="label">F</text>
  <line x1="232.00" y1="90.00" x2="289.00" y2="90.00" class="geometry interactive"/>
  <text x="222.00" y="90.00" class="label">H</text>
</svg>
