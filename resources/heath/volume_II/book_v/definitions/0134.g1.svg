    <polyline id="hl-sec-GLH" data-ref="/ G L H /" data-aliases="/ H L G / | } G L H { | } H L G {" points="240.00,50.00 279.00,50.00 362.00,50.00" fill="none" class="geom-line geom-overlay" />
