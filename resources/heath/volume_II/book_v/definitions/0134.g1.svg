<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 80" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="450" height="80" fill="#ffffff"/>
  <line x1="30.00" y1="22.00" x2="146.00" y2="22.00" class="geometry interactive"/>
  <text x="20.00" y="22.00" class="label">A</text>
  <text x="156.00" y="22.00" class="label">B</text>
  <line x1="30.00" y1="50.00" x2="115.00" y2="50.00" class="geometry interactive"/>
  <text x="20.00" y="50.00" class="label">C</text>
  <text x="125.00" y="50.00" class="label">D</text>
  <line x1="60.00" y1="46.50" x2="60.00" y2="53.50" class="geometry"/>
  <text x="60.00" y="62.00" class="label">K</text>
  <line x1="240.00" y1="22.00" x2="402.00" y2="22.00" class="geometry interactive"/>
  <text x="230.00" y="22.00" class="label">E</text>
  <text x="412.00" y="22.00" class="label">F</text>
  <line x1="240.00" y1="50.00" x2="362.00" y2="50.00" class="geometry interactive"/>
  <text x="230.00" y="50.00" class="label">G</text>
  <text x="372.00" y="50.00" class="label">H</text>
  <line x1="279.00" y1="46.50" x2="279.00" y2="53.50" class="geometry"/>
  <text x="279.00" y="62.00" class="label">L</text>
</svg>
