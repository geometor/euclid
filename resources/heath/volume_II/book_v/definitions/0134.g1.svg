    <line id="el-line-CD" data-ref="[ C D ]" data-aliases="[ D C ]" data-type="line" x1="30.00" y1="50.00" x2="115.00" y2="50.00" class="geom-line" />
    <line id="el-line-EF" data-ref="[ E F ]" data-aliases="[ F E ]" data-type="line" x1="240.00" y1="22.00" x2="402.00" y2="22.00" class="geom-line" />
    <line id="el-line-GH" data-ref="[ G H ]" data-aliases="[ H G ]" data-type="line" x1="240.00" y1="50.00" x2="362.00" y2="50.00" class="geom-line" />
    <!-- Tick marks at K and L -->
    <line x1="60.00" y1="46.50" x2="60.00" y2="53.50" class="geom-line" />
    <line x1="279.00" y1="46.50" x2="279.00" y2="53.50" class="geom-line" />
  </g>

