<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 100" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="470" height="100" fill="#ffffff"/>
  <line x1="26.00" y1="22.00" x2="188.00" y2="22.00" class="geometry interactive"/>
  <text x="16.00" y="22.00" class="label">A</text>
  <line x1="26.00" y1="49.00" x2="110.00" y2="49.00" class="geometry interactive"/>
  <text x="16.00" y="49.00" class="label">B</text>
  <line x1="26.00" y1="76.00" x2="194.00" y2="76.00" class="geometry interactive"/>
  <text x="16.00" y="76.00" class="label">E</text>
  <line x1="328.00" y1="22.00" x2="439.00" y2="22.00" class="geometry interactive"/>
  <text x="318.00" y="22.00" class="label">C</text>
  <line x1="328.00" y1="49.00" x2="384.00" y2="49.00" class="geometry interactive"/>
  <text x="318.00" y="49.00" class="label">D</text>
  <line x1="328.00" y1="76.00" x2="440.00" y2="76.00" class="geometry interactive"/>
  <text x="318.00" y="76.00" class="label">F</text>
</svg>
