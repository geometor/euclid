<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 88" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="600" height="88" fill="#ffffff"/>
  <line x1="30.00" y1="34.00" x2="132.00" y2="34.00" class="geometry interactive"/>
  <text x="20.00" y="34.00" class="label">A</text>
  <text x="142.00" y="34.00" class="label">B</text>
  <line x1="30.00" y1="60.00" x2="108.00" y2="60.00" class="geometry interactive"/>
  <text x="20.00" y="60.00" class="label">C</text>
  <text x="118.00" y="60.00" class="label">D</text>
  <line x1="52.00" y1="56.50" x2="52.00" y2="63.50" class="geometry"/>
  <text x="52.00" y="72.00" class="label">K</text>
  <line x1="236.00" y1="27.00" x2="390.00" y2="27.00" class="geometry interactive"/>
  <text x="226.00" y="27.00" class="label">E</text>
  <text x="400.00" y="27.00" class="label">F</text>
  <line x1="236.00" y1="60.00" x2="350.00" y2="60.00" class="geometry interactive"/>
  <text x="226.00" y="60.00" class="label">G</text>
  <text x="360.00" y="60.00" class="label">H</text>
  <line x1="275.00" y1="56.50" x2="275.00" y2="63.50" class="geometry"/>
  <text x="275.00" y="72.00" class="label">L</text>
  <line x1="422.00" y1="58.00" x2="575.00" y2="58.00" class="geometry interactive"/>
  <text x="412.00" y="58.00" class="label">M</text>
</svg>
