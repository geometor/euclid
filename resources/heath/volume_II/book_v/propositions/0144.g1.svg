<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 335 75" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="335" height="75" fill="#ffffff"/>
  <line x1="30.00" y1="29.00" x2="106.00" y2="29.00" class="geometry interactive"/>
  <line x1="68.00" y1="25.50" x2="68.00" y2="32.50" class="geometry"/>
  <text x="30.00" y="18.00" class="label">A</text>
  <text x="68.00" y="18.00" class="label">G</text>
  <text x="106.00" y="18.00" class="label">B</text>
  <line x1="26.00" y1="63.00" x2="66.00" y2="63.00" class="geometry interactive"/>
  <text x="16.00" y="63.00" class="label">E</text>
  <line x1="196.00" y1="29.00" x2="306.00" y2="29.00" class="geometry interactive"/>
  <line x1="251.00" y1="25.50" x2="251.00" y2="32.50" class="geometry"/>
  <text x="196.00" y="18.00" class="label">C</text>
  <text x="251.00" y="18.00" class="label">H</text>
  <text x="306.00" y="18.00" class="label">D</text>
  <line x1="194.00" y1="63.00" x2="249.00" y2="63.00" class="geometry interactive"/>
  <text x="184.00" y="63.00" class="label">F</text>
</svg>
