<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="300" height="120" fill="#ffffff"/>
  <line x1="26.00" y1="27.00" x2="206.00" y2="27.00" class="geometry interactive"/>
  <text x="16.00" y="27.00" class="label">A</text>
  <line x1="62.00" y1="23.50" x2="62.00" y2="30.50" class="geometry"/>
  <line x1="98.00" y1="23.50" x2="98.00" y2="30.50" class="geometry"/>
  <line x1="134.00" y1="23.50" x2="134.00" y2="30.50" class="geometry"/>
  <line x1="170.00" y1="23.50" x2="170.00" y2="30.50" class="geometry"/>
  <line x1="206.00" y1="23.50" x2="206.00" y2="30.50" class="geometry"/>
  <text x="134.00" y="16.00" class="label">B</text>
  <text x="206.00" y="16.00" class="label">G</text>
  <line x1="26.00" y1="57.00" x2="62.00" y2="57.00" class="geometry interactive"/>
  <text x="16.00" y="57.00" class="label">C</text>
  <line x1="26.00" y1="81.00" x2="276.00" y2="81.00" class="geometry interactive"/>
  <text x="16.00" y="81.00" class="label">D</text>
  <line x1="76.00" y1="77.50" x2="76.00" y2="84.50" class="geometry"/>
  <line x1="126.00" y1="77.50" x2="126.00" y2="84.50" class="geometry"/>
  <line x1="176.00" y1="77.50" x2="176.00" y2="84.50" class="geometry"/>
  <line x1="226.00" y1="77.50" x2="226.00" y2="84.50" class="geometry"/>
  <line x1="276.00" y1="77.50" x2="276.00" y2="84.50" class="geometry"/>
  <text x="176.00" y="70.00" class="label">E</text>
  <text x="276.00" y="70.00" class="label">H</text>
  <line x1="26.00" y1="109.00" x2="76.00" y2="109.00" class="geometry interactive"/>
  <text x="16.00" y="109.00" class="label">F</text>
</svg>
