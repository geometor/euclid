<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 70" width="315" height="70" class="euclid-graphic" data-graphic-id="0151.g1" data-folio="0151" data-graphic="g1" data-proposition="V.5">
  <style>
    .euclid-graphic {
      font-family: "Times New Roman", "Georgia", serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-tick {
      stroke: #000000;
      stroke-width: 1.5;
      stroke-linecap: round;
      fill: none;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
      transition: r 0.15s, fill 0.15s;
    }
    .geom-label {
      font-size: 16px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

