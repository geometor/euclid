<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 70" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="315" height="70" fill="#ffffff"/>
  <line x1="22.00" y1="33.00" x2="298.00" y2="33.00" class="geometry interactive"/>
  <line x1="22.00" y1="29.50" x2="22.00" y2="36.50" class="geometry"/>
  <line x1="77.00" y1="29.50" x2="77.00" y2="36.50" class="geometry"/>
  <line x1="133.00" y1="29.50" x2="133.00" y2="36.50" class="geometry"/>
  <line x1="188.00" y1="29.50" x2="188.00" y2="36.50" class="geometry"/>
  <line x1="225.00" y1="29.50" x2="225.00" y2="36.50" class="geometry"/>
  <line x1="261.00" y1="29.50" x2="261.00" y2="36.50" class="geometry"/>
  <line x1="298.00" y1="29.50" x2="298.00" y2="36.50" class="geometry"/>
  <text x="22.00" y="22.00" class="label">A</text>
  <text x="188.00" y="22.00" class="label">E</text>
  <text x="298.00" y="22.00" class="label">B</text>
  <line x1="101.00" y1="62.00" x2="235.00" y2="62.00" class="geometry interactive"/>
  <line x1="101.00" y1="58.50" x2="101.00" y2="65.50" class="geometry"/>
  <line x1="142.00" y1="58.50" x2="142.00" y2="65.50" class="geometry"/>
  <line x1="195.00" y1="58.50" x2="195.00" y2="65.50" class="geometry"/>
  <line x1="235.00" y1="58.50" x2="235.00" y2="65.50" class="geometry"/>
  <text x="101.00" y="51.00" class="label">G</text>
  <text x="142.00" y="51.00" class="label">C</text>
  <text x="195.00" y="51.00" class="label">F</text>
  <text x="235.00" y="51.00" class="label">D</text>
</svg>
