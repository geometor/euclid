    <line id="el-line-GD" data-ref="[ G D ]" data-aliases="[ D G ]; [ C D ]" data-type="line" x1="101.00" y1="62.00" x2="235.00" y2="62.00" class="geom-line geom-overlay"/>
    <!-- Division Tick Marks -->
    <line x1="22.00" y1="29.50" x2="22.00" y2="36.50" class="geom-tick"/>
    <line x1="77.00" y1="29.50" x2="77.00" y2="36.50" class="geom-tick"/>
