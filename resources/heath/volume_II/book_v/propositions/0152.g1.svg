<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 288" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="68" height="288" fill="#ffffff"/>
  <line x1="24.00" y1="15.00" x2="24.00" y2="272.00" class="geometry interactive"/>
  <line x1="20.50" y1="78.00" x2="27.50" y2="78.00" class="geometry"/>
  <line x1="20.50" y1="194.00" x2="27.50" y2="194.00" class="geometry"/>
  <text x="14.00" y="18.00" class="label">G</text>
  <text x="14.00" y="78.00" class="label">A</text>
  <text x="15.00" y="194.00" class="label">E</text>
  <text x="15.00" y="270.00" class="label">B</text>
  <line x1="53.00" y1="140.00" x2="53.00" y2="272.00" class="geometry interactive"/>
  <line x1="49.50" y1="231.00" x2="56.50" y2="231.00" class="geometry"/>
  <text x="53.00" y="128.00" class="label">C</text>
  <text x="43.00" y="231.00" class="label">F</text>
  <text x="44.00" y="270.00" class="label">D</text>
</svg>
