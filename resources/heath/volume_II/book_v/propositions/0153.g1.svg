<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 120" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="230" height="120" fill="#ffffff"/>
  <line x1="27.00" y1="28.00" x2="204.00" y2="28.00" class="geometry interactive"/>
  <line x1="71.00" y1="24.50" x2="71.00" y2="31.50" class="geometry"/>
  <line x1="115.00" y1="24.50" x2="115.00" y2="31.50" class="geometry"/>
  <line x1="159.00" y1="24.50" x2="159.00" y2="31.50" class="geometry"/>
  <text x="27.00" y="17.00" class="label">A</text>
  <text x="159.00" y="17.00" class="label">G</text>
  <text x="204.00" y="17.00" class="label">B</text>
  <line x1="27.00" y1="52.00" x2="71.00" y2="52.00" class="geometry interactive"/>
  <text x="17.00" y="52.00" class="label">E</text>
  <line x1="27.00" y1="84.00" x2="173.00" y2="84.00" class="geometry interactive"/>
  <line x1="56.00" y1="80.50" x2="56.00" y2="87.50" class="geometry"/>
  <line x1="85.00" y1="80.50" x2="85.00" y2="87.50" class="geometry"/>
  <line x1="115.00" y1="80.50" x2="115.00" y2="87.50" class="geometry"/>
  <line x1="144.00" y1="80.50" x2="144.00" y2="87.50" class="geometry"/>
  <text x="27.00" y="73.00" class="label">K</text>
  <text x="56.00" y="73.00" class="label">C</text>
  <text x="144.00" y="73.00" class="label">H</text>
  <text x="173.00" y="73.00" class="label">D</text>
  <line x1="27.00" y1="107.00" x2="56.00" y2="107.00" class="geometry interactive"/>
  <text x="17.00" y="107.00" class="label">F</text>
</svg>
