    <line id="el-mag-E" data-ref="E" data-aliases="/ E /" data-type="segment" x1="127.00" y1="45.00" x2="296.00" y2="45.00" class="geom-line"/>
    <line id="el-mag-F" data-ref="F" data-aliases="/ F /" data-type="segment" x1="127.00" y1="74.00" x2="294.00" y2="74.00" class="geom-line"/>
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
