    <line x1="169.00" y1="14.50" x2="169.00" y2="21.50" class="geom-tick"/>
    <line x1="211.00" y1="14.50" x2="211.00" y2="21.50" class="geom-tick"/>
    <line x1="254.00" y1="14.50" x2="254.00" y2="21.50" class="geom-tick"/>
    <line x1="296.00" y1="14.50" x2="296.00" y2="21.50" class="geom-tick"/>
    <line x1="127.00" y1="41.50" x2="127.00" y2="48.50" class="geom-tick"/>
    <line x1="169.00" y1="41.50" x2="169.00" y2="48.50" class="geom-tick"/>
    <line x1="211.00" y1="41.50" x2="211.00" y2="48.50" class="geom-tick"/>
    <line x1="254.00" y1="41.50" x2="254.00" y2="48.50" class="geom-tick"/>
    <line x1="296.00" y1="41.50" x2="296.00" y2="48.50" class="geom-tick"/>
