    <line x1="183.00" y1="70.50" x2="183.00" y2="77.50" class="geom-tick"/>
    <line x1="238.00" y1="70.50" x2="238.00" y2="77.50" class="geom-tick"/>
    <line x1="294.00" y1="70.50" x2="294.00" y2="77.50" class="geom-tick"/>
  </g>

  <!-- Constructed Graphics (Standalone Magnitude Bars) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="28.00" y1="18.00" x2="72.00" y2="18.00" class="geom-line"/>
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="28.00" y1="45.00" x2="72.00" y2="45.00" class="geom-line"/>
