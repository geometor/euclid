  <text x="117.00" y="18.00" class="label">D</text>
  <line x1="127.00" y1="14.50" x2="127.00" y2="21.50" class="geometry"/>
  <line x1="169.00" y1="14.50" x2="169.00" y2="21.50" class="geometry"/>
  <line x1="211.00" y1="14.50" x2="211.00" y2="21.50" class="geometry"/>
  <line x1="254.00" y1="14.50" x2="254.00" y2="21.50" class="geometry"/>
  <line x1="296.00" y1="14.50" x2="296.00" y2="21.50" class="geometry"/>
