    <line id="el-line-FH" data-ref="[ F H ]" data-aliases="[ H F ]" data-type="line" x1="28.00" y1="76.00" x2="267.00" y2="76.00" class="geom-line geom-overlay"/>
    <!-- Division Tick Marks -->
    <line x1="67.00" y1="24.50" x2="67.00" y2="31.50" class="geom-tick"/>
    <line x1="145.00" y1="24.50" x2="145.00" y2="31.50" class="geom-tick"/>
    <line x1="69.00" y1="72.50" x2="69.00" y2="79.50" class="geom-tick"/>
    <line x1="109.00" y1="72.50" x2="109.00" y2="79.50" class="geom-tick"/>
    <line x1="188.00" y1="72.50" x2="188.00" y2="79.50" class="geom-tick"/>
    <line x1="267.00" y1="72.50" x2="267.00" y2="79.50" class="geom-tick"/>
  </g>

  <!-- Constructed Graphics -->
  <g id="graphics">
