  <line x1="188.00" y1="72.50" x2="188.00" y2="79.50" class="geometry"/>
  <line x1="267.00" y1="72.50" x2="267.00" y2="79.50" class="geometry"/>
  <text x="109.00" y="65.00" class="label">G</text>
