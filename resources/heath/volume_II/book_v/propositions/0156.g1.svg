    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="28.00" y1="28.00" x2="67.00" y2="28.00" class="geom-line"/>
    <line id="el-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" data-type="segment" x1="67.00" y1="28.00" x2="145.00" y2="28.00" class="geom-line"/>
