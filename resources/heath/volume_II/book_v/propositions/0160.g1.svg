<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 72" width="270" height="72" class="euclid-graphic" data-graphic-id="0160.g1" data-folio="0160" data-graphic="g1" data-proposition="V.9">
  <style>
    .euclid-graphic {
      font-family: "Times New Roman", "Georgia", serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
      transition: r 0.15s, fill 0.15s;
    }
    .geom-label {
      font-size: 16px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Base Construction Elements -->
  <g id="elements"/>

  <!-- Constructed Graphics (Standalone Magnitude Bars) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="29.00" y1="19.00" x2="109.00" y2="19.00" class="geom-line"/>
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="174.00" y1="19.00" x2="253.00" y2="19.00" class="geom-line"/>
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="88.00" y1="50.00" x2="198.00" y2="50.00" class="geom-line"/>
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /" x1="29.00" y1="19.00" x2="109.00" y2="19.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /" x1="174.00" y1="19.00" x2="253.00" y2="19.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /" x1="88.00" y1="50.00" x2="198.00" y2="50.00" class="geom-line geom-overlay"/>
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A1" data-ref="A_1" data-type="point" cx="29.00" cy="19.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-A2" data-ref="A_2" data-type="point" cx="109.00" cy="19.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-B1" data-ref="B_1" data-type="point" cx="174.00" cy="19.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-B2" data-ref="B_2" data-type="point" cx="253.00" cy="19.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-C1" data-ref="C_1" data-type="point" cx="88.00" cy="50.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-C2" data-ref="C_2" data-type="point" cx="198.00" cy="50.00" r="2.0" class="geom-point geom-overlay"/>
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="19.00" y="19.00" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="164.00" y="19.00" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="78.00" y="50.00" class="geom-label">C</text>
  </g>
</svg>
