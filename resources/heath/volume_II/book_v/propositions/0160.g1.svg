<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 72" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="270" height="72" fill="#ffffff"/>
  <line x1="29.00" y1="19.00" x2="109.00" y2="19.00" class="geometry interactive"/>
  <text x="19.00" y="19.00" class="label">A</text>
  <line x1="174.00" y1="19.00" x2="253.00" y2="19.00" class="geometry interactive"/>
  <text x="164.00" y="19.00" class="label">B</text>
  <line x1="88.00" y1="50.00" x2="198.00" y2="50.00" class="geometry interactive"/>
  <text x="78.00" y="50.00" class="label">C</text>
</svg>
