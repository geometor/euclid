<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 56" width="360" height="56" class="euclid-graphic" data-graphic-id="0161.g1" data-folio="0161" data-graphic="g1" data-proposition="V.10">
  <style>
    .euclid-graphic {
      font-family: "Times New Roman", "Georgia", serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
      transition: r 0.15s, fill 0.15s;
    }
    .geom-label {
      font-size: 16px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Base Construction Elements -->
  <g id="elements"/>

  <!-- Constructed Graphics (Standalone Magnitude Bars) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="35.00" y1="16.00" x2="199.00" y2="16.00" class="geom-line"/>
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="235.00" y1="16.00" x2="341.00" y2="16.00" class="geom-line"/>
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="129.00" y1="42.00" x2="270.00" y2="42.00" class="geom-line"/>
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /" x1="35.00" y1="16.00" x2="199.00" y2="16.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /" x1="235.00" y1="16.00" x2="341.00" y2="16.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /" x1="129.00" y1="42.00" x2="270.00" y2="42.00" class="geom-line geom-overlay"/>
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A1" data-ref="A_1" data-type="point" cx="35.00" cy="16.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-A2" data-ref="A_2" data-type="point" cx="199.00" cy="16.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-B1" data-ref="B_1" data-type="point" cx="235.00" cy="16.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-B2" data-ref="B_2" data-type="point" cx="341.00" cy="16.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-C1" data-ref="C_1" data-type="point" cx="129.00" cy="42.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-C2" data-ref="C_2" data-type="point" cx="270.00" cy="42.00" r="2.0" class="geom-point geom-overlay"/>
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="25.00" y="16.00" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="225.00" y="16.00" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="119.00" y="42.00" class="geom-label">C</text>
  </g>
</svg>
