<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 56" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="360" height="56" fill="#ffffff"/>
  <line x1="35.00" y1="16.00" x2="199.00" y2="16.00" class="geometry interactive"/>
  <text x="25.00" y="16.00" class="label">A</text>
  <line x1="235.00" y1="16.00" x2="341.00" y2="16.00" class="geometry interactive"/>
  <text x="225.00" y="16.00" class="label">B</text>
  <line x1="129.00" y1="42.00" x2="270.00" y2="42.00" class="geometry interactive"/>
  <text x="119.00" y="42.00" class="label">C</text>
</svg>
