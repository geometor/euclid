<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 305 73" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="305" height="73" fill="#ffffff"/>
  <line x1="25.00" y1="24.00" x2="132.00" y2="24.00" class="geometry interactive"/>
  <text x="15.00" y="24.00" class="label">A</text>
  <line x1="25.00" y1="51.00" x2="106.00" y2="51.00" class="geometry interactive"/>
  <text x="15.00" y="51.00" class="label">B</text>
  <line x1="209.00" y1="24.00" x2="290.00" y2="24.00" class="geometry interactive"/>
  <text x="199.00" y="24.00" class="label">C</text>
  <line x1="209.00" y1="51.00" x2="272.00" y2="51.00" class="geometry interactive"/>
  <text x="199.00" y="51.00" class="label">D</text>
</svg>
