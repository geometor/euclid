  <text x="202.00" y="27.00" class="label">B</text>
  <line x1="28.00" y1="23.50" x2="28.00" y2="30.50" class="geometry"/>
  <line x1="83.00" y1="23.50" x2="83.00" y2="30.50" class="geometry"/>
  <line x1="137.00" y1="23.50" x2="137.00" y2="30.50" class="geometry"/>
  <line x1="192.00" y1="23.50" x2="192.00" y2="30.50" class="geometry"/>
  <text x="83.00" y="16.00" class="label">G</text>
  <text x="137.00" y="16.00" class="label">H</text>
  <line x1="28.00" y1="55.00" x2="162.00" y2="55.00" class="geometry interactive"/>
  <text x="18.00" y="55.00" class="label">D</text>
  <text x="172.00" y="55.00" class="label">E</text>
  <line x1="28.00" y1="51.50" x2="28.00" y2="58.50" class="geometry"/>
  <line x1="73.00" y1="51.50" x2="73.00" y2="58.50" class="geometry"/>
  <line x1="117.00" y1="51.50" x2="117.00" y2="58.50" class="geometry"/>
  <line x1="162.00" y1="51.50" x2="162.00" y2="58.50" class="geometry"/>
  <text x="73.00" y="44.00" class="label">K</text>
  <text x="117.00" y="44.00" class="label">L</text>
