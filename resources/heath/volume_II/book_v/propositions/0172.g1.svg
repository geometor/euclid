<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 185" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="215" height="185" fill="#ffffff"/>
  <polygon points="21.00,23.00 189.00,23.00 189.00,160.00 21.00,160.00" class="geometry interactive"/>
  <line x1="21.00" y1="98.00" x2="189.00" y2="98.00" class="geometry interactive"/>
  <line x1="128.00" y1="23.00" x2="128.00" y2="160.00" class="geometry interactive"/>
  <text x="21.00" y="11.00" class="label">d</text>
  <text x="128.00" y="11.00" class="label">c</text>
  <text x="189.00" y="11.00" class="label">e</text>
  <text x="12.00" y="98.00" class="label">a</text>
  <text x="121.00" y="106.00" class="label">b</text>
  <text x="197.00" y="98.00" class="label">f</text>
  <text x="21.00" y="172.00" class="label">h</text>
  <text x="128.00" y="172.00" class="label">g</text>
  <text x="189.00" y="172.00" class="label">k</text>
</svg>
