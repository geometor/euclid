<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 103" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="360" height="103" fill="#ffffff"/>
  <polygon points="16.00,24.00 341.00,24.00 341.00,80.00 16.00,80.00" class="geometry interactive"/>
  <line x1="136.00" y1="24.00" x2="136.00" y2="80.00" class="geometry interactive"/>
  <line x1="197.00" y1="24.00" x2="197.00" y2="80.00" class="geometry interactive"/>
  <line x1="292.00" y1="24.00" x2="292.00" y2="80.00" class="geometry interactive"/>
  <text x="16.00" y="12.00" class="label">a</text>
  <text x="136.00" y="12.00" class="label">b</text>
  <text x="197.00" y="12.00" class="label">c</text>
  <text x="292.00" y="12.00" class="label">d</text>
  <text x="341.00" y="12.00" class="label">e</text>
  <text x="16.00" y="92.00" class="label" font-style="normal">A</text>
  <text x="136.00" y="92.00" class="label" font-style="normal">B</text>
  <text x="197.00" y="92.00" class="label" font-style="normal">C</text>
  <text x="292.00" y="92.00" class="label" font-style="normal">D</text>
  <text x="341.00" y="92.00" class="label" font-style="normal">E</text>
</svg>
