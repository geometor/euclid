  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linejoin: round;
      fill: transparent;
      transition: fill 0.15s, stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 0.75;
    }
    .geom-label {
      font-size: 16px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-label-roman {
      font-size: 15px;
      font-weight: bold;
      font-style: normal;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    polygon[data-ref]:hover, polygon.highlight, polygon.geom-highlight-active {
      fill: rgba(239, 68, 68, 0.15) !important;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 4.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

