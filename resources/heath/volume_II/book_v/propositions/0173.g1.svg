<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 110" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="410" height="110" fill="#ffffff"/>
  <line x1="99.00" y1="19.00" x2="223.00" y2="19.00" class="geometry interactive"/>
  <line x1="179.00" y1="15.50" x2="179.00" y2="22.50" class="geometry"/>
  <text x="99.00" y="31.00" class="label">A</text>
  <text x="179.00" y="31.00" class="label">E</text>
  <text x="223.00" y="31.00" class="label">B</text>
  <line x1="312.00" y1="19.00" x2="383.00" y2="19.00" class="geometry interactive"/>
  <line x1="358.00" y1="15.50" x2="358.00" y2="22.50" class="geometry"/>
  <text x="312.00" y="31.00" class="label">C</text>
  <text x="358.00" y="31.00" class="label">F</text>
  <text x="383.00" y="31.00" class="label">D</text>
  <line x1="16.00" y1="76.00" x2="393.00" y2="76.00" class="geometry interactive"/>
  <line x1="168.00" y1="72.50" x2="168.00" y2="79.50" class="geometry"/>
  <line x1="258.00" y1="72.50" x2="258.00" y2="79.50" class="geometry"/>
  <text x="16.00" y="65.00" class="label">G</text>
  <text x="168.00" y="65.00" class="label">H</text>
  <text x="258.00" y="65.00" class="label">K</text>
  <text x="393.00" y="65.00" class="label">O</text>
  <line x1="18.00" y1="105.00" x2="254.00" y2="105.00" class="geometry interactive"/>
  <line x1="108.00" y1="101.50" x2="108.00" y2="108.50" class="geometry"/>
  <line x1="164.00" y1="101.50" x2="164.00" y2="108.50" class="geometry"/>
  <text x="18.00" y="94.00" class="label">L</text>
  <text x="108.00" y="94.00" class="label">M</text>
  <text x="164.00" y="94.00" class="label">N</text>
  <text x="254.00" y="94.00" class="label">P</text>
</svg>
