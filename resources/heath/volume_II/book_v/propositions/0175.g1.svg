<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285 85" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="285" height="85" fill="#ffffff"/>
  <line x1="17.00" y1="26.00" x2="138.00" y2="26.00" class="geometry interactive"/>
  <line x1="94.00" y1="22.50" x2="94.00" y2="29.50" class="geometry"/>
  <text x="17.00" y="15.00" class="label">A</text>
  <text x="94.00" y="15.00" class="label">E</text>
  <text x="138.00" y="15.00" class="label">B</text>
  <line x1="17.00" y1="54.00" x2="260.00" y2="54.00" class="geometry interactive"/>
  <line x1="170.00" y1="50.50" x2="170.00" y2="57.50" class="geometry"/>
  <line x1="191.00" y1="50.50" x2="191.00" y2="57.50" class="geometry"/>
  <text x="191.00" y="43.00" class="label">G</text>
  <text x="17.00" y="66.00" class="label">C</text>
  <text x="170.00" y="66.00" class="label">F</text>
  <text x="260.00" y="66.00" class="label">D</text>
</svg>
