<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 202" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="80" height="202" fill="#ffffff"/>
  <line x1="22.00" y1="12.00" x2="22.00" y2="190.00" class="geometry interactive"/>
  <line x1="22.00" y1="71.00" x2="26.00" y2="71.00" class="geometry interactive"/>
  <text x="12.00" y="16.00" class="label">A</text>
  <text x="12.00" y="71.00" class="label">E</text>
  <text x="12.00" y="186.00" class="label">B</text>
  <line x1="52.00" y1="48.00" x2="52.00" y2="190.00" class="geometry interactive"/>
  <line x1="52.00" y1="95.00" x2="56.00" y2="95.00" class="geometry interactive"/>
  <text x="42.00" y="52.00" class="label">C</text>
  <text x="42.00" y="95.00" class="label">F</text>
  <text x="42.00" y="186.00" class="label">D</text>
</svg>
