<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 142" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="225" height="142" fill="#ffffff"/>
  <polygon points="21.00,22.00 200.00,22.00 200.00,113.00 21.00,113.00" class="geometry interactive"/>
  <line x1="21.00" y1="56.00" x2="200.00" y2="56.00" class="geometry interactive"/>
  <line x1="146.00" y1="22.00" x2="146.00" y2="113.00" class="geometry interactive"/>
  <text x="21.00" y="11.00" class="label">d</text>
  <text x="146.00" y="11.00" class="label">c</text>
  <text x="200.00" y="11.00" class="label">e</text>
  <text x="13.00" y="56.00" class="label">a</text>
  <text x="140.00" y="64.00" class="label">b</text>
  <text x="207.00" y="56.00" class="label">f</text>
  <text x="21.00" y="124.00" class="label">h</text>
  <text x="146.00" y="124.00" class="label">g</text>
  <text x="200.00" y="124.00" class="label">k</text>
</svg>
