    <line id="el-line-CD" data-ref="[ C D ]" data-aliases="[ D C ]" data-type="line" x1="16.00" y1="57.00" x2="83.00" y2="57.00" class="geom-line"/>
    <!-- Division tick marks at E and F -->
    <line x1="56.00" y1="23.50" x2="56.00" y2="30.50" class="geom-line"/>
    <line x1="38.00" y1="53.50" x2="38.00" y2="60.50" class="geom-line"/>
  </g>

  <!-- Constructed Graphics (Segments & Sub-segments) -->
