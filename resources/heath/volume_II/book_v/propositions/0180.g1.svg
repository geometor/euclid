    <polyline id="hl-sec-AEB" data-ref="/ A E B /" data-aliases="/ B E A /; } A E B {; } B E A {" points="16.00,27.00 56.00,27.00 132.00,27.00" fill="none" class="geom-line geom-overlay"/>
    <polyline id="hl-sec-CFD" data-ref="/ C F D /" data-aliases="/ D F C /; } C F D {; } D F C {" points="16.00,57.00 38.00,57.00 83.00,57.00" fill="none" class="geom-line geom-overlay"/>
  </g>

