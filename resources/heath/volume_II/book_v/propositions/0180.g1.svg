    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="16.00" y1="27.00" x2="132.00" y2="27.00" class="geom-line"/>
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="16.00" y1="27.00" x2="56.00" y2="27.00" class="geom-line geom-overlay"/>
    <line id="el-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" data-type="segment" x1="56.00" y1="27.00" x2="132.00" y2="27.00" class="geom-line geom-overlay"/>
