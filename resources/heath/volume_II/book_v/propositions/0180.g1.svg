<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 155 70" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="155" height="70" fill="#ffffff"/>
  <line x1="16.00" y1="27.00" x2="132.00" y2="27.00" class="geometry interactive"/>
  <line x1="56.00" y1="23.50" x2="56.00" y2="30.50" class="geometry"/>
  <text x="16.00" y="16.00" class="label">A</text>
  <text x="56.00" y="16.00" class="label">E</text>
  <text x="132.00" y="16.00" class="label">B</text>
  <line x1="16.00" y1="57.00" x2="83.00" y2="57.00" class="geometry interactive"/>
  <line x1="38.00" y1="53.50" x2="38.00" y2="60.50" class="geometry"/>
  <text x="16.00" y="46.00" class="label">C</text>
  <text x="38.00" y="46.00" class="label">F</text>
  <text x="83.00" y="46.00" class="label">D</text>
</svg>
