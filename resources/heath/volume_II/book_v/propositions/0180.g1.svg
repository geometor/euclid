    <line id="el-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" data-type="segment" x1="16.00" y1="57.00" x2="38.00" y2="57.00" class="geom-line geom-overlay"/>
    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" data-type="segment" x1="38.00" y1="57.00" x2="83.00" y2="57.00" class="geom-line geom-overlay"/>
    <polyline id="el-sec-AEB" data-ref="/ A E B /" data-aliases="/ B E A /; } A E B {; } B E A {" data-type="section" points="16.00,27.00 56.00,27.00 132.00,27.00" fill="none" class="geom-line geom-overlay"/>
    <polyline id="el-sec-CFD" data-ref="/ C F D /" data-aliases="/ D F C /; } C F D {; } D F C {" data-type="section" points="16.00,57.00 38.00,57.00 83.00,57.00" fill="none" class="geom-line geom-overlay"/>
  </g>

