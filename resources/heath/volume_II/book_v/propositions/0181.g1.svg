    <polyline id="el-sec-AEB" data-ref="/ A E B /" data-aliases="/ B E A / | } A E B { | } B E A {" data-type="section" points="22.00,10.00 22.00,54.00 22.00,140.00" fill="none" class="geom-line geom-overlay"/>
    <polyline id="el-sec-CFD" data-ref="/ C F D /" data-aliases="/ D F C / | } C F D { | } D F C {" data-type="section" points="76.00,36.00 76.00,68.00 76.00,140.00" fill="none" class="geom-line geom-overlay"/>
