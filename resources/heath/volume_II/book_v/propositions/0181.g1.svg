    <polyline id="hl-sec-CFD" data-ref="/ C F D /" data-aliases="/ D F C / | } C F D { | } D F C {" points="76.00,36.00 76.00,68.00 76.00,140.00" fill="none" class="geom-line geom-overlay"/>
