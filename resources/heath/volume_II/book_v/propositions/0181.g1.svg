    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="22.00" y1="10.00" x2="22.00" y2="54.00" class="geom-line geom-overlay"/>
    <line id="el-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" data-type="segment" x1="22.00" y1="54.00" x2="22.00" y2="140.00" class="geom-line geom-overlay"/>
