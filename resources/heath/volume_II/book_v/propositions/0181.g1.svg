<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 152" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="90" height="152" fill="#ffffff"/>
  <line x1="22.00" y1="10.00" x2="22.00" y2="140.00" class="geometry interactive"/>
  <line x1="22.00" y1="54.00" x2="26.00" y2="54.00" class="geometry interactive"/>
  <text x="13.00" y="14.00" class="label">A</text>
  <text x="13.00" y="54.00" class="label">E</text>
  <text x="13.00" y="136.00" class="label">B</text>
  <line x1="76.00" y1="36.00" x2="76.00" y2="140.00" class="geometry interactive"/>
  <line x1="76.00" y1="68.00" x2="80.00" y2="68.00" class="geometry interactive"/>
  <text x="67.00" y="40.00" class="label">C</text>
  <text x="67.00" y="68.00" class="label">F</text>
  <text x="67.00" y="136.00" class="label">D</text>
</svg>
