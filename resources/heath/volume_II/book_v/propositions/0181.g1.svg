    <line id="el-line-CD" data-ref="[ C D ]" data-aliases="[ D C ]" data-type="line" x1="76.00" y1="36.00" x2="76.00" y2="140.00" class="geom-line"/>
    <!-- Division tick marks at E and F -->
    <line x1="22.00" y1="54.00" x2="26.00" y2="54.00" class="geom-line"/>
    <line x1="76.00" y1="68.00" x2="80.00" y2="68.00" class="geom-line"/>
  </g>

