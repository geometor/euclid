<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 297 82" width="297" height="82" class="euclid-graphic" data-graphic-id="0182.g1" data-folio="0182" data-graphic="g1" data-proposition="V.20">
  <style>
    .euclid-graphic {
      font-family: "Times New Roman", "Georgia", serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
      transition: r 0.15s, fill 0.15s;
    }
    .geom-label {
      font-size: 16px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Base Construction Elements -->
  <g id="elements">
    <!-- End serif ticks on E and F as in Heath's printed diagram -->
    <line x1="239.00" y1="37.50" x2="239.00" y2="44.50" class="geom-line"/>
    <line x1="262.00" y1="61.50" x2="262.00" y2="68.50" class="geom-line"/>
  </g>

  <!-- Constructed Graphics (Standalone Magnitude Bars) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A / | / A_1 A_2 /" data-type="segment" x1="24.00" y1="15.00" x2="141.00" y2="15.00" class="geom-line"/>
    <line id="el-mag-B" data-ref="B" data-aliases="/ B / | / B_1 B_2 /" data-type="segment" x1="24.00" y1="41.00" x2="66.00" y2="41.00" class="geom-line"/>
    <line id="el-mag-C" data-ref="C" data-aliases="/ C / | / C_1 C_2 /" data-type="segment" x1="24.00" y1="65.00" x2="101.00" y2="65.00" class="geom-line"/>
    <line id="el-mag-D" data-ref="D" data-aliases="/ D / | / D_1 D_2 /" data-type="segment" x1="214.00" y1="15.00" x2="286.00" y2="15.00" class="geom-line"/>
    <line id="el-mag-E" data-ref="E" data-aliases="/ E / | / E_1 E_2 /" data-type="segment" x1="214.00" y1="41.00" x2="239.00" y2="41.00" class="geom-line"/>
    <line id="el-mag-F" data-ref="F" data-aliases="/ F / | / F_1 F_2 /" data-type="segment" x1="214.00" y1="65.00" x2="262.00" y2="65.00" class="geom-line"/>
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A / | / A_1 A_2 /" x1="24.00" y1="15.00" x2="141.00" y2="15.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B / | / B_1 B_2 /" x1="24.00" y1="41.00" x2="66.00" y2="41.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-C" data-ref="C" data-aliases="/ C / | / C_1 C_2 /" x1="24.00" y1="65.00" x2="101.00" y2="65.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D / | / D_1 D_2 /" x1="214.00" y1="15.00" x2="286.00" y2="15.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-E" data-ref="E" data-aliases="/ E / | / E_1 E_2 /" x1="214.00" y1="41.00" x2="239.00" y2="41.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-F" data-ref="F" data-aliases="/ F / | / F_1 F_2 /" x1="214.00" y1="65.00" x2="262.00" y2="65.00" class="geom-line geom-overlay"/>
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A1" data-ref="A_1" data-type="point" cx="24.00" cy="15.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-A2" data-ref="A_2" data-type="point" cx="141.00" cy="15.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-B1" data-ref="B_1" data-type="point" cx="24.00" cy="41.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-B2" data-ref="B_2" data-type="point" cx="66.00" cy="41.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-C1" data-ref="C_1" data-type="point" cx="24.00" cy="65.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-C2" data-ref="C_2" data-type="point" cx="101.00" cy="65.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-D1" data-ref="D_1" data-type="point" cx="214.00" cy="15.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-D2" data-ref="D_2" data-type="point" cx="286.00" cy="15.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-E1" data-ref="E_1" data-type="point" cx="214.00" cy="41.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-E2" data-ref="E_2" data-type="point" cx="239.00" cy="41.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-F1" data-ref="F_1" data-type="point" cx="214.00" cy="65.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-F2" data-ref="F_2" data-type="point" cx="262.00" cy="65.00" r="2.0" class="geom-point geom-overlay"/>
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="14.00" y="15.00" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="14.00" y="41.00" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="14.00" y="65.00" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="204.00" y="15.00" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="204.00" y="41.00" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="204.00" y="65.00" class="geom-label">F</text>
  </g>
</svg>
