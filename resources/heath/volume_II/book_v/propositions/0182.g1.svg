<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 297 82" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="297" height="82" fill="#ffffff"/>
  <line x1="24.00" y1="15.00" x2="141.00" y2="15.00" class="geometry interactive"/>
  <text x="14.00" y="15.00" class="label">A</text>
  <line x1="24.00" y1="41.00" x2="66.00" y2="41.00" class="geometry interactive"/>
  <text x="14.00" y="41.00" class="label">B</text>
  <line x1="24.00" y1="65.00" x2="101.00" y2="65.00" class="geometry interactive"/>
  <text x="14.00" y="65.00" class="label">C</text>
  <line x1="214.00" y1="15.00" x2="286.00" y2="15.00" class="geometry interactive"/>
  <text x="204.00" y="15.00" class="label">D</text>
  <line x1="214.00" y1="41.00" x2="239.00" y2="41.00" class="geometry interactive"/>
  <text x="204.00" y="41.00" class="label">E</text>
  <line x1="239.00" y1="37.50" x2="239.00" y2="44.50" class="geometry"/>
  <line x1="214.00" y1="65.00" x2="262.00" y2="65.00" class="geometry interactive"/>
  <text x="204.00" y="65.00" class="label">F</text>
  <line x1="262.00" y1="61.50" x2="262.00" y2="68.50" class="geometry"/>
</svg>
