<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 365 70" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="365" height="70" fill="#ffffff"/>
  <line x1="24.00" y1="16.00" x2="141.00" y2="16.00" class="geometry interactive"/>
  <text x="14.00" y="16.00" class="label">A</text>
  <line x1="24.00" y1="35.00" x2="105.00" y2="35.00" class="geometry interactive"/>
  <text x="14.00" y="35.00" class="label">B</text>
  <line x1="24.00" y1="54.00" x2="129.00" y2="54.00" class="geometry interactive"/>
  <text x="14.00" y="54.00" class="label">C</text>
  <line x1="227.00" y1="16.00" x2="331.00" y2="16.00" class="geometry interactive"/>
  <text x="217.00" y="16.00" class="label">D</text>
  <line x1="227.00" y1="35.00" x2="359.00" y2="35.00" class="geometry interactive"/>
  <text x="217.00" y="35.00" class="label">E</text>
  <line x1="227.00" y1="54.00" x2="317.00" y2="54.00" class="geometry interactive"/>
  <text x="217.00" y="54.00" class="label">F</text>
</svg>
