<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 365 70" width="365" height="70" class="euclid-graphic" data-graphic-id="0184.g1" data-folio="0184" data-graphic="g1" data-proposition="V.21">
  <style>
    .euclid-graphic {
      font-family: "Times New Roman", "Georgia", serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
      transition: r 0.15s, fill 0.15s;
    }
    .geom-label {
      font-size: 16px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Base Construction Elements -->
  <g id="elements"/>

  <!-- Constructed Graphics (Standalone Magnitude Bars) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /; / A_1 A_2 /" data-type="segment" x1="24.00" y1="16.00" x2="141.00" y2="16.00" class="geom-line"/>
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /; / B_1 B_2 /" data-type="segment" x1="24.00" y1="35.00" x2="105.00" y2="35.00" class="geom-line"/>
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /; / C_1 C_2 /" data-type="segment" x1="24.00" y1="54.00" x2="129.00" y2="54.00" class="geom-line"/>
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /; / D_1 D_2 /" data-type="segment" x1="227.00" y1="16.00" x2="331.00" y2="16.00" class="geom-line"/>
    <line id="el-mag-E" data-ref="E" data-aliases="/ E /; / E_1 E_2 /" data-type="segment" x1="227.00" y1="35.00" x2="359.00" y2="35.00" class="geom-line"/>
    <line id="el-mag-F" data-ref="F" data-aliases="/ F /; / F_1 F_2 /" data-type="segment" x1="227.00" y1="54.00" x2="317.00" y2="54.00" class="geom-line"/>
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /; / A_1 A_2 /" x1="24.00" y1="16.00" x2="141.00" y2="16.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /; / B_1 B_2 /" x1="24.00" y1="35.00" x2="105.00" y2="35.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /; / C_1 C_2 /" x1="24.00" y1="54.00" x2="129.00" y2="54.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /; / D_1 D_2 /" x1="227.00" y1="16.00" x2="331.00" y2="16.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-E" data-ref="E" data-aliases="/ E /; / E_1 E_2 /" x1="227.00" y1="35.00" x2="359.00" y2="35.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-F" data-ref="F" data-aliases="/ F /; / F_1 F_2 /" x1="227.00" y1="54.00" x2="317.00" y2="54.00" class="geom-line geom-overlay"/>
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A1" data-ref="A_1" data-type="point" cx="24.00" cy="16.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-A2" data-ref="A_2" data-type="point" cx="141.00" cy="16.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-B1" data-ref="B_1" data-type="point" cx="24.00" cy="35.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-B2" data-ref="B_2" data-type="point" cx="105.00" cy="35.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-C1" data-ref="C_1" data-type="point" cx="24.00" cy="54.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-C2" data-ref="C_2" data-type="point" cx="129.00" cy="54.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-D1" data-ref="D_1" data-type="point" cx="227.00" cy="16.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-D2" data-ref="D_2" data-type="point" cx="331.00" cy="16.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-E1" data-ref="E_1" data-type="point" cx="227.00" cy="35.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-E2" data-ref="E_2" data-type="point" cx="359.00" cy="35.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-F1" data-ref="F_1" data-type="point" cx="227.00" cy="54.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-F2" data-ref="F_2" data-type="point" cx="317.00" cy="54.00" r="2.0" class="geom-point geom-overlay"/>
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="14.00" y="16.00" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="14.00" y="35.00" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="14.00" y="54.00" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="217.00" y="16.00" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="217.00" y="35.00" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="217.00" y="54.00" class="geom-label">F</text>
  </g>
</svg>
