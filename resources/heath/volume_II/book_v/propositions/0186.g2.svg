<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 60" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="130" height="60" fill="#ffffff"/>
  <polygon points="6.00,6.00 124.00,6.00 124.00,54.00 6.00,54.00" class="geometry interactive"/>
  <text x="26.00" y="20.00" class="label" font-style="normal">A</text>
  <text x="52.00" y="20.00" class="label" font-style="normal">B</text>
  <text x="78.00" y="20.00" class="label" font-style="normal">C</text>
  <text x="104.00" y="20.00" class="label" font-style="normal">D</text>
  <text x="26.00" y="41.00" class="label" font-style="normal">E</text>
  <text x="52.00" y="41.00" class="label" font-style="normal">F</text>
  <text x="78.00" y="41.00" class="label" font-style="normal">G</text>
  <text x="104.00" y="41.00" class="label" font-style="normal">H</text>
</svg>
