<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 130" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="290" height="130" fill="#ffffff"/>
  <line x1="30.00" y1="38.00" x2="252.00" y2="38.00" class="geometry interactive"/>
  <text x="20.00" y="38.00" class="label">A</text>
  <text x="262.00" y="38.00" class="label">G</text>
  <line x1="160.00" y1="34.50" x2="160.00" y2="41.50" class="geometry"/>
  <text x="160.00" y="27.00" class="label">B</text>
  <line x1="30.00" y1="62.00" x2="125.00" y2="62.00" class="geometry interactive"/>
  <text x="20.00" y="62.00" class="label">C</text>
  <line x1="30.00" y1="84.00" x2="211.00" y2="84.00" class="geometry interactive"/>
  <text x="20.00" y="84.00" class="label">D</text>
  <text x="221.00" y="84.00" class="label">H</text>
  <line x1="136.00" y1="80.50" x2="136.00" y2="87.50" class="geometry"/>
  <text x="136.00" y="73.00" class="label">E</text>
  <line x1="30.00" y1="108.00" x2="104.00" y2="108.00" class="geometry interactive"/>
  <text x="20.00" y="108.00" class="label">F</text>
</svg>
