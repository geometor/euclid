    <line id="hl-mag-E" data-ref="E" data-aliases="/ E /; / E_1 E_2 /" x1="20.00" y1="44.00" x2="124.00" y2="44.00" class="geom-line geom-overlay"/>

    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="20.00" y1="70.00" x2="148.00" y2="70.00" class="geom-line geom-overlay"/>
    <line id="hl-seg-CH" data-ref="/ C H /" data-aliases="/ H C /" x1="20.00" y1="70.00" x2="106.00" y2="70.00" class="geom-line geom-overlay"/>
    <line id="hl-seg-HD" data-ref="/ H D /" data-aliases="/ D H /" x1="106.00" y1="70.00" x2="148.00" y2="70.00" class="geom-line geom-overlay"/>
    <line id="hl-mag-F" data-ref="F" data-aliases="/ F /; / F_1 F_2 /" x1="20.00" y1="95.00" x2="106.00" y2="95.00" class="geom-line geom-overlay"/>

    <polyline id="hl-sec-AGB" data-ref="/ A G B /" data-aliases="/ B G A /; } A G B {; } B G A {" points="20.00,18.00 125.00,18.00 179.00,18.00" fill="none" class="geom-line geom-overlay"/>
    <polyline id="hl-sec-CHD" data-ref="/ C H D /" data-aliases="/ D H C /; } C H D {; } D H C {" points="20.00,70.00 106.00,70.00 148.00,70.00" fill="none" class="geom-line geom-overlay"/>
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="20.00" cy="18.00" r="2.0" class="geom-point"/>
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="125.00" cy="18.00" r="2.0" class="geom-point"/>
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="179.00" cy="18.00" r="2.0" class="geom-point"/>
