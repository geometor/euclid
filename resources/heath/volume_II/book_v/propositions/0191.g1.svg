    <polyline id="el-sec-CHD" data-ref="/ C H D /" data-aliases="/ D H C /; } C H D {; } D H C {" data-type="section" points="20.00,70.00 106.00,70.00 148.00,70.00" fill="none" class="geom-line geom-overlay"/>
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
