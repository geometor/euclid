<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" class="euclid-graphic" data-graphic-id="0191.g1" data-folio="0191" data-graphic="g1" data-proposition="V.25">
  <style>
    .euclid-graphic {
      font-family: "Times New Roman", "Georgia", serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
      transition: r 0.15s, fill 0.15s;
    }
    .geom-label {
      font-size: 16px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-AB" data-ref="[ A B ]" data-aliases="[ B A ]" data-type="line" x1="20.00" y1="18.00" x2="179.00" y2="18.00" class="geom-line"/>
    <line id="el-line-CD" data-ref="[ C D ]" data-aliases="[ D C ]" data-type="line" x1="20.00" y1="70.00" x2="148.00" y2="70.00" class="geom-line"/>
    <!-- Division tick marks at G and H -->
    <line x1="125.00" y1="14.50" x2="125.00" y2="21.50" class="geom-line"/>
    <line x1="106.00" y1="66.50" x2="106.00" y2="73.50" class="geom-line"/>
  </g>

  <!-- Constructed Graphics (Segments, Sub-segments, and Standalone Magnitudes) -->
  <g id="graphics">
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="20.00" y1="18.00" x2="179.00" y2="18.00" class="geom-line"/>
    <line id="el-seg-AG" data-ref="/ A G /" data-aliases="/ G A /" data-type="segment" x1="20.00" y1="18.00" x2="125.00" y2="18.00" class="geom-line geom-overlay"/>
    <line id="el-seg-GB" data-ref="/ G B /" data-aliases="/ B G /" data-type="segment" x1="125.00" y1="18.00" x2="179.00" y2="18.00" class="geom-line geom-overlay"/>
    <line id="el-mag-E" data-ref="E" data-aliases="/ E /; / E_1 E_2 /" data-type="segment" x1="20.00" y1="44.00" x2="124.00" y2="44.00" class="geom-line"/>

    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="20.00" y1="70.00" x2="148.00" y2="70.00" class="geom-line"/>
    <line id="el-seg-CH" data-ref="/ C H /" data-aliases="/ H C /" data-type="segment" x1="20.00" y1="70.00" x2="106.00" y2="70.00" class="geom-line geom-overlay"/>
    <line id="el-seg-HD" data-ref="/ H D /" data-aliases="/ D H /" data-type="segment" x1="106.00" y1="70.00" x2="148.00" y2="70.00" class="geom-line geom-overlay"/>
    <line id="el-mag-F" data-ref="F" data-aliases="/ F /; / F_1 F_2 /" data-type="segment" x1="20.00" y1="95.00" x2="106.00" y2="95.00" class="geom-line"/>

