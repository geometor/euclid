<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="200" height="120" fill="#ffffff"/>
  <line x1="20.00" y1="15.00" x2="179.00" y2="15.00" class="geometry interactive"/>
  <text x="10.00" y="15.00" class="label">A</text>
  <text x="189.00" y="15.00" class="label">B</text>
  <line x1="125.00" y1="11.50" x2="125.00" y2="18.50" class="geometry"/>
  <text x="125.00" y="4.00" class="label">G</text>
  <line x1="20.00" y1="42.00" x2="124.00" y2="42.00" class="geometry interactive"/>
  <text x="10.00" y="42.00" class="label">E</text>
  <line x1="20.00" y1="68.00" x2="148.00" y2="68.00" class="geometry interactive"/>
  <text x="10.00" y="68.00" class="label">C</text>
  <text x="158.00" y="68.00" class="label">D</text>
  <line x1="106.00" y1="64.50" x2="106.00" y2="71.50" class="geometry"/>
  <text x="106.00" y="57.00" class="label">H</text>
  <line x1="20.00" y1="93.00" x2="106.00" y2="93.00" class="geometry interactive"/>
  <text x="10.00" y="93.00" class="label">F</text>
</svg>
