    <circle id="el-pt-E2" data-ref="E_2" data-type="point" cx="124.00" cy="44.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="20.00" cy="70.00" r="2.0" class="geom-point"/>
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="106.00" cy="70.00" r="2.0" class="geom-point"/>
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="148.00" cy="70.00" r="2.0" class="geom-point"/>
    <circle id="el-pt-F1" data-ref="F_1" data-type="point" cx="20.00" cy="95.00" r="2.0" class="geom-point geom-overlay"/>
    <circle id="el-pt-F2" data-ref="F_2" data-type="point" cx="106.00" cy="95.00" r="2.0" class="geom-point geom-overlay"/>
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="10.00" y="18.00" class="geom-label">A</text>
    <text id="lbl-G" data-ref="G" x="125.00" y="7.00" class="geom-label">G</text>
    <text id="lbl-B" data-ref="B" x="179.00" y="7.00" class="geom-label">B</text>
    <text id="lbl-E" data-ref="E" x="10.00" y="44.00" class="geom-label">E</text>
    <text id="lbl-C" data-ref="C" x="10.00" y="70.00" class="geom-label">C</text>
    <text id="lbl-H" data-ref="H" x="106.00" y="59.00" class="geom-label">H</text>
    <text id="lbl-D" data-ref="D" x="148.00" y="59.00" class="geom-label">D</text>
    <text id="lbl-F" data-ref="F" x="10.00" y="95.00" class="geom-label">F</text>
  </g>
</svg>
