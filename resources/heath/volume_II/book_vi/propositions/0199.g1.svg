<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 207 147" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="207" height="147" fill="#ffffff"/>
  <polygon points="18.00,29.00 185.00,29.00 185.00,118.00 18.00,118.00" class="geometry interactive"/>
  <line x1="114.00" y1="29.00" x2="114.00" y2="118.00" class="geometry interactive"/>
  <line x1="122.00" y1="29.00" x2="122.00" y2="118.00" class="geometry interactive"/>
  <line x1="137.00" y1="114.00" x2="137.00" y2="118.00" class="geometry interactive"/>
  <text x="20.00" y="18.00" class="label">D</text>
  <text x="112.00" y="18.00" class="label">F</text>
  <text x="124.00" y="18.00" class="label">K</text>
  <text x="185.00" y="18.00" class="label">C</text>
  <text x="20.00" y="130.00" class="label">A</text>
  <text x="112.00" y="130.00" class="label">E</text>
  <text x="123.00" y="130.00" class="label">I</text>
  <text x="137.00" y="130.00" class="label">O</text>
  <text x="185.00" y="130.00" class="label">B</text>
</svg>
