<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 159 153" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="159" height="153" fill="#ffffff"/>
  <polygon points="55.00,27.00 27.00,131.00 132.00,131.00" class="geometry interactive"/>
  <line x1="36.24" y1="96.68" x2="106.59" y2="96.68" class="geometry interactive"/>
  <line x1="27.00" y1="131.00" x2="106.59" y2="96.68" class="geometry interactive"/>
  <line x1="132.00" y1="131.00" x2="36.24" y2="96.68" class="geometry interactive"/>
  <circle cx="55.00" cy="27.00" r="2.5" class="point"/>
  <circle cx="27.00" cy="131.00" r="2.5" class="point"/>
  <circle cx="132.00" cy="131.00" r="2.5" class="point"/>
  <circle cx="36.24" cy="96.68" r="2.5" class="point"/>
  <circle cx="106.59" cy="96.68" r="2.5" class="point"/>
  <text x="55.00" y="16.00" class="label">A</text>
  <text x="26.24" y="94.68" class="label">D</text>
  <text x="116.59" y="94.68" class="label">E</text>
  <text x="18.00" y="133.00" class="label">B</text>
  <text x="141.00" y="133.00" class="label">C</text>
</svg>
