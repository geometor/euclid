    <polygon id="el-poly-ADE" data-ref="&lt; A D E &gt;" data-aliases="&lt; A E D &gt;;&lt; D A E &gt;;&lt; D E A &gt;;&lt; E A D &gt;;&lt; E D A &gt;" data-type="polygon" points="55,27 36.24,96.68 106.59,96.68" class="geom-polygon" />
    <polygon id="el-poly-BDE" data-ref="&lt; B D E &gt;" data-aliases="&lt; B E D &gt;;&lt; D B E &gt;;&lt; D E B &gt;;&lt; E B D &gt;;&lt; E D B &gt;" data-type="polygon" points="27,131 36.24,96.68 106.59,96.68" class="geom-polygon" />
    <polygon id="el-poly-CDE" data-ref="&lt; C D E &gt;" data-aliases="&lt; C E D &gt;;&lt; D C E &gt;;&lt; D E C &gt;;&lt; E C D &gt;;&lt; E D C &gt;" data-type="polygon" points="132,131 36.24,96.68 106.59,96.68" class="geom-polygon" />

    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /;/ A D B /" data-type="segment" x1="55" y1="27" x2="27" y2="131" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="55" y1="27" x2="36.24" y2="96.68" class="geom-line" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="27" y1="131" x2="36.24" y2="96.68" class="geom-line" />

    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /;/ A E C /" data-type="segment" x1="55" y1="27" x2="132" y2="131" class="geom-line" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="55" y1="27" x2="106.59" y2="96.68" class="geom-line" />
    <line id="el-seg-CE" data-ref="/ C E /" data-aliases="/ E C /" data-type="segment" x1="132" y1="131" x2="106.59" y2="96.68" class="geom-line" />

    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="36.24" y1="96.68" x2="106.59" y2="96.68" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="27" y1="131" x2="132" y2="131" class="geom-line" />
    <line id="el-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" data-type="segment" x1="27" y1="131" x2="106.59" y2="96.68" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="132" y1="131" x2="36.24" y2="96.68" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt;;&lt; B A C &gt;;&lt; B C A &gt;;&lt; C A B &gt;;&lt; C B A &gt;" points="55,27 27,131 132,131" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-ADE" data-ref="&lt; A D E &gt;" data-aliases="&lt; A E D &gt;;&lt; D A E &gt;;&lt; D E A &gt;;&lt; E A D &gt;;&lt; E D A &gt;" points="55,27 36.24,96.68 106.59,96.68" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-BDE" data-ref="&lt; B D E &gt;" data-aliases="&lt; B E D &gt;;&lt; D B E &gt;;&lt; D E B &gt;;&lt; E B D &gt;;&lt; E D B &gt;" points="27,131 36.24,96.68 106.59,96.68" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-CDE" data-ref="&lt; C D E &gt;" data-aliases="&lt; C E D &gt;;&lt; D C E &gt;;&lt; D E C &gt;;&lt; E C D &gt;;&lt; E D C &gt;" points="132,131 36.24,96.68 106.59,96.68" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /;/ A D B /" x1="55" y1="27" x2="27" y2="131" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="55" y1="27" x2="36.24" y2="96.68" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="27" y1="131" x2="36.24" y2="96.68" class="geom-line geom-overlay" />

    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /;/ A E C /" x1="55" y1="27" x2="132" y2="131" class="geom-line geom-overlay" />
    <line id="hl-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" x1="55" y1="27" x2="106.59" y2="96.68" class="geom-line geom-overlay" />
    <line id="hl-seg-CE" data-ref="/ C E /" data-aliases="/ E C /" x1="132" y1="131" x2="106.59" y2="96.68" class="geom-line geom-overlay" />

    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="36.24" y1="96.68" x2="106.59" y2="96.68" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="27" y1="131" x2="132" y2="131" class="geom-line geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" x1="27" y1="131" x2="106.59" y2="96.68" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="132" y1="131" x2="36.24" y2="96.68" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="55" cy="27" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="27" cy="131" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="132" cy="131" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="36.24" cy="96.68" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="106.59" cy="96.68" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="55" y="18" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-D" data-ref="D" x="24" y="100" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="119" y="100" text-anchor="middle" class="geom-label">E</text>
