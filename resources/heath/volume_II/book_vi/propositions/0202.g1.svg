<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 277 188" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="277" height="188" fill="#ffffff"/>
  <polygon points="18.00,160.00 249.38,23.62 197.00,160.00" class="geometry interactive"/>
  <line x1="169.00" y1="71.00" x2="197.00" y2="160.00" class="geometry interactive"/>
  <line x1="169.00" y1="71.00" x2="134.82" y2="160.00" class="geometry interactive"/>
  <circle cx="169.00" cy="71.00" r="2.5" class="point"/>
  <circle cx="18.00" cy="160.00" r="2.5" class="point"/>
  <circle cx="197.00" cy="160.00" r="2.5" class="point"/>
  <circle cx="134.82" cy="160.00" r="2.5" class="point"/>
  <circle cx="249.38" cy="23.62" r="2.5" class="point"/>
  <text x="20.00" y="172.00" class="label">B</text>
  <text x="135.82" y="172.00" class="label">D</text>
  <text x="199.00" y="172.00" class="label">C</text>
