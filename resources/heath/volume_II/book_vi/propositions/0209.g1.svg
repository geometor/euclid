<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 151 177" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="151" height="177" fill="#ffffff"/>
  <polygon points="131.00,49.00 26.00,151.00 103.00,136.00" class="geometry interactive"/>
  <circle cx="131.00" cy="49.00" r="2.5" class="point"/>
  <circle cx="26.00" cy="151.00" r="2.5" class="point"/>
  <circle cx="103.00" cy="136.00" r="2.5" class="point"/>
  <text x="132.00" y="39.00" class="label">A</text>
  <text x="25.00" y="163.00" class="label">B</text>
  <text x="106.00" y="147.00" class="label">C</text>
</svg>
