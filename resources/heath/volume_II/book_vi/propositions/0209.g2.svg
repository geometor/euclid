    <path id="el-ang-EFG" data-ref="&lt; E F G )" data-aliases="&lt; G F E )" data-type="wedge" d="M 69.00 75.00 L 55.25 77.62 A 14 14 0 0 0 79.61 84.14 Z" class="wedge angle geom-overlay" />
