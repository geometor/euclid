<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 125 135" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="125" height="135" fill="#ffffff"/>
  <polygon points="84.00,29.00 27.00,83.00 105.00,106.00 69.00,75.00" class="geometry interactive"/>
  <line x1="27.00" y1="83.00" x2="69.00" y2="75.00" class="geometry interactive"/>
  <circle cx="84.00" cy="29.00" r="2.5" class="point"/>
  <circle cx="27.00" cy="83.00" r="2.5" class="point"/>
  <circle cx="69.00" cy="75.00" r="2.5" class="point"/>
  <circle cx="105.00" cy="106.00" r="2.5" class="point"/>
  <text x="85.00" y="18.00" class="label">D</text>
  <text x="18.00" y="85.00" class="label">E</text>
  <text x="78.00" y="71.00" class="label">F</text>
  <text x="105.00" y="118.00" class="label">G</text>
</svg>
