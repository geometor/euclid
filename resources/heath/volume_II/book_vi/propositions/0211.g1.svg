<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 318 176" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="318" height="176" fill="#ffffff"/>
  <polygon points="38.00,19.00 26.00,156.00 122.00,156.00" class="geometry interactive"/>
  <polygon points="212.00,39.00 204.56,123.94 264.08,123.94 291.08,70.89" class="geometry interactive"/>
  <line x1="212.00" y1="39.00" x2="264.08" y2="123.94" class="geometry interactive"/>
  <circle cx="38.00" cy="19.00" r="2.5" class="point"/>
  <circle cx="26.00" cy="156.00" r="2.5" class="point"/>
  <circle cx="122.00" cy="156.00" r="2.5" class="point"/>
  <circle cx="212.00" cy="39.00" r="2.5" class="point"/>
  <circle cx="204.56" cy="123.94" r="2.5" class="point"/>
  <circle cx="264.08" cy="123.94" r="2.5" class="point"/>
  <circle cx="291.08" cy="70.89" r="2.5" class="point"/>
  <text x="30.00" y="21.00" class="label">A</text>
  <text x="17.00" y="156.00" class="label">B</text>
  <text x="131.00" y="158.00" class="label">C</text>
  <text x="204.00" y="39.00" class="label">D</text>
  <text x="195.56" y="125.94" class="label">E</text>
