<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 185" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="220" height="185" fill="#ffffff"/>
  <polygon points="83.00,29.00 23.00,160.00 108.00,142.00" class="geometry interactive"/>
  <line x1="23.00" y1="160.00" x2="104.50" y2="126.18" class="geometry interactive"/>
  <polygon points="188.00,56.00 155.00,130.00 201.00,121.00" class="geometry interactive"/>
  <circle cx="83.00" cy="29.00" r="2.5" class="point"/>
  <circle cx="23.00" cy="160.00" r="2.5" class="point"/>
  <circle cx="108.00" cy="142.00" r="2.5" class="point"/>
  <circle cx="104.50" cy="126.18" r="2.5" class="point"/>
  <circle cx="188.00" cy="56.00" r="2.5" class="point"/>
  <circle cx="155.00" cy="130.00" r="2.5" class="point"/>
  <circle cx="201.00" cy="121.00" r="2.5" class="point"/>
  <text x="84.00" y="18.00" class="label">A</text>
  <text x="19.00" y="171.00" class="label">B</text>
  <text x="113.50" y="127.18" class="label">G</text>
  <text x="109.00" y="153.00" class="label">C</text>
  <text x="189.00" y="45.00" class="label">D</text>
  <text x="154.00" y="141.00" class="label">E</text>
  <text x="201.00" y="132.00" class="label">F</text>
</svg>
