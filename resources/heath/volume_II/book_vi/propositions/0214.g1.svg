<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 314 160" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="314" height="160" fill="#ffffff"/>
  <polygon points="110.00,21.00 19.00,133.00 142.00,133.00" class="geometry interactive"/>
  <line x1="19.00" y1="133.00" x2="121.52" y2="61.32" class="geometry interactive"/>
  <polygon points="284.00,38.00 210.00,132.00 294.00,73.00" class="geometry interactive"/>
  <circle cx="110.00" cy="21.00" r="2.5" class="point"/>
  <circle cx="19.00" cy="133.00" r="2.5" class="point"/>
  <circle cx="142.00" cy="133.00" r="2.5" class="point"/>
  <circle cx="121.52" cy="61.32" r="2.5" class="point"/>
  <circle cx="284.00" cy="38.00" r="2.5" class="point"/>
  <circle cx="210.00" cy="132.00" r="2.5" class="point"/>
  <circle cx="294.00" cy="73.00" r="2.5" class="point"/>
  <text x="101.00" y="21.00" class="label">A</text>
  <text x="19.00" y="144.00" class="label">B</text>
  <text x="142.00" y="144.00" class="label">C</text>
  <text x="130.52" y="59.32" class="label">G</text>
  <text x="284.00" y="27.00" class="label">D</text>
  <text x="210.00" y="143.00" class="label">E</text>
  <text x="296.00" y="84.00" class="label">F</text>
</svg>
