<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 222 148" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="222" height="148" fill="#ffffff"/>
  <polygon points="131.00,28.00 19.00,118.00 203.00,118.00" class="geometry interactive"/>
  <line x1="131.00" y1="28.00" x2="131.00" y2="118.00" class="geometry interactive"/>
  <circle cx="131.00" cy="28.00" r="2.5" class="point"/>
  <circle cx="19.00" cy="118.00" r="2.5" class="point"/>
  <circle cx="203.00" cy="118.00" r="2.5" class="point"/>
  <circle cx="131.00" cy="118.00" r="2.5" class="point"/>
  <text x="132.00" y="17.00" class="label">A</text>
  <text x="19.00" y="130.00" class="label">B</text>
  <text x="132.00" y="130.00" class="label">D</text>
  <text x="203.00" y="130.00" class="label">C</text>
</svg>
