<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 203 147" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="203" height="147" fill="#ffffff"/>
  <line x1="19.00" y1="118.00" x2="163.00" y2="16.00" class="geometry interactive"/>
  <line x1="19.00" y1="118.00" x2="182.00" y2="118.00" class="geometry interactive"/>
  <line x1="129.00" y1="40.00" x2="182.00" y2="118.00" class="geometry interactive"/>
  <line x1="55.67" y1="92.00" x2="73.33" y2="118.00" class="geometry interactive"/>
  <circle cx="19.00" cy="118.00" r="2.5" class="point"/>
  <circle cx="182.00" cy="118.00" r="2.5" class="point"/>
  <circle cx="129.00" cy="40.00" r="2.5" class="point"/>
  <circle cx="55.67" cy="92.00" r="2.5" class="point"/>
  <circle cx="92.33" cy="66.00" r="2.5" class="point"/>
  <circle cx="73.33" cy="118.00" r="2.5" class="point"/>
  <text x="20.00" y="129.00" class="label">A</text>
  <text x="73.33" y="129.00" class="label">F</text>
  <text x="183.00" y="129.00" class="label">B</text>
  <text x="51.67" y="82.00" class="label">D</text>
  <text x="88.33" y="56.00" class="label">E</text>
  <text x="125.00" y="30.00" class="label">C</text>
</svg>
