<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 203 147" width="203" height="147" class="euclid-graphic" data-graphic-id="0218.g1" data-folio="0218" data-graphic="g1" data-proposition="VI.9">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circles & Infinite Lines) -->
  <g id="elements">
    <line id="el-line-AC" data-ref="[ A C ]" data-aliases="[ C A ] | [ A D ] | [ D A ]" data-type="line" x1="19" y1="118" x2="163" y2="16" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
    <polygon id="el-poly-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt; | &lt; B A C &gt; | &lt; B C A &gt; | &lt; C A B &gt; | &lt; C B A &gt;" data-type="polygon" points="19,118 182,118 129,40" class="geom-polygon" />
    <polygon id="el-poly-AFD" data-ref="&lt; A F D &gt;" data-aliases="&lt; A D F &gt; | &lt; F A D &gt; | &lt; F D A &gt; | &lt; D A F &gt; | &lt; D F A &gt;" data-type="polygon" points="19,118 73.33,118 55.67,92" class="geom-polygon" />

    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A / | / A F B /" data-type="segment" x1="19" y1="118" x2="182" y2="118" class="geom-line" />
    <line id="el-seg-AF" data-ref="/ A F /" data-aliases="/ F A /" data-type="segment" x1="19" y1="118" x2="73.33" y2="118" class="geom-line" />
    <line id="el-seg-FB" data-ref="/ F B /" data-aliases="/ B F /" data-type="segment" x1="73.33" y1="118" x2="182" y2="118" class="geom-line" />

    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A / | / A D C / | / A E C /" data-type="segment" x1="19" y1="118" x2="129" y2="40" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="19" y1="118" x2="55.67" y2="92" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="55.67" y1="92" x2="92.33" y2="66" class="geom-line" />
    <line id="el-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" data-type="segment" x1="92.33" y1="66" x2="129" y2="40" class="geom-line" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D / | / D E C /" data-type="segment" x1="55.67" y1="92" x2="129" y2="40" class="geom-line" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A / | / A D E /" data-type="segment" x1="19" y1="118" x2="92.33" y2="66" class="geom-line" />

    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="182" y1="118" x2="129" y2="40" class="geom-line" />
    <line id="el-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" data-type="segment" x1="55.67" y1="92" x2="73.33" y2="118" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt; | &lt; B A C &gt; | &lt; B C A &gt; | &lt; C A B &gt; | &lt; C B A &gt;" points="19,118 182,118 129,40" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-AFD" data-ref="&lt; A F D &gt;" data-aliases="&lt; A D F &gt; | &lt; F A D &gt; | &lt; F D A &gt; | &lt; D A F &gt; | &lt; D F A &gt;" points="19,118 73.33,118 55.67,92" class="geom-polygon geom-overlay" />

    <line id="hl-line-AC" data-ref="[ A C ]" data-aliases="[ C A ] | [ A D ] | [ D A ]" x1="19" y1="118" x2="163" y2="16" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A / | / A F B /" x1="19" y1="118" x2="182" y2="118" class="geom-line geom-overlay" />
    <line id="hl-seg-AF" data-ref="/ A F /" data-aliases="/ F A /" x1="19" y1="118" x2="73.33" y2="118" class="geom-line geom-overlay" />
    <line id="hl-seg-FB" data-ref="/ F B /" data-aliases="/ B F /" x1="73.33" y1="118" x2="182" y2="118" class="geom-line geom-overlay" />

    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A / | / A D C / | / A E C /" x1="19" y1="118" x2="129" y2="40" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="19" y1="118" x2="55.67" y2="92" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="55.67" y1="92" x2="92.33" y2="66" class="geom-line geom-overlay" />
    <line id="hl-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" x1="92.33" y1="66" x2="129" y2="40" class="geom-line geom-overlay" />
    <line id="hl-seg-DC" data-ref="/ D C /" data-aliases="/ C D / | / D E C /" x1="55.67" y1="92" x2="129" y2="40" class="geom-line geom-overlay" />
    <line id="hl-seg-AE" data-ref="/ A E /" data-aliases="/ E A / | / A D E /" x1="19" y1="118" x2="92.33" y2="66" class="geom-line geom-overlay" />

    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="182" y1="118" x2="129" y2="40" class="geom-line geom-overlay" />
    <line id="hl-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" x1="55.67" y1="92" x2="73.33" y2="118" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="19" cy="118" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="182" cy="118" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="129" cy="40" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="55.67" cy="92" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="92.33" cy="66" r="3.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="73.33" cy="118" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="20" y="131" text-anchor="middle" dominant-baseline="central" class="geom-label">A</text>
    <text id="lbl-F" data-ref="F" x="73.33" y="131" text-anchor="middle" dominant-baseline="central" class="geom-label">F</text>
    <text id="lbl-B" data-ref="B" x="183" y="131" text-anchor="middle" dominant-baseline="central" class="geom-label">B</text>
