<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 203" width="246" height="203" class="euclid-graphic" data-graphic-id="0218.g2" data-folio="0218" data-graphic="g2" data-proposition="VI.9">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circles & Infinite Lines) -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
    <polygon id="el-poly-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt; | &lt; B A C &gt; | &lt; B C A &gt; | &lt; C A B &gt; | &lt; C B A &gt;" data-type="polygon" points="95,29 49,173 226,173" class="geom-polygon" />
    <polygon id="el-poly-AED" data-ref="&lt; A E D &gt;" data-aliases="&lt; A D E &gt; | &lt; E A D &gt; | &lt; E D A &gt; | &lt; D A E &gt; | &lt; D E A &gt;" data-type="polygon" points="95,29 79.82,76.52 138.23,76.52" class="geom-polygon" />

    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A / | / A E B /" data-type="segment" x1="95" y1="29" x2="49" y2="173" class="geom-line" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="95" y1="29" x2="79.82" y2="76.52" class="geom-line" />
    <line id="el-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" data-type="segment" x1="79.82" y1="76.52" x2="49" y2="173" class="geom-line" />

    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A / | / A D C /" data-type="segment" x1="95" y1="29" x2="226" y2="173" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="95" y1="29" x2="138.23" y2="76.52" class="geom-line" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" data-type="segment" x1="138.23" y1="76.52" x2="226" y2="173" class="geom-line" />

    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="49" y1="173" x2="226" y2="173" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="138.23" y1="76.52" x2="79.82" y2="76.52" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt; | &lt; B A C &gt; | &lt; B C A &gt; | &lt; C A B &gt; | &lt; C B A &gt;" points="95,29 49,173 226,173" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-AED" data-ref="&lt; A E D &gt;" data-aliases="&lt; A D E &gt; | &lt; E A D &gt; | &lt; E D A &gt; | &lt; D A E &gt; | &lt; D E A &gt;" points="95,29 79.82,76.52 138.23,76.52" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A / | / A E B /" x1="95" y1="29" x2="49" y2="173" class="geom-line geom-overlay" />
    <line id="hl-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" x1="95" y1="29" x2="79.82" y2="76.52" class="geom-line geom-overlay" />
    <line id="hl-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" x1="79.82" y1="76.52" x2="49" y2="173" class="geom-line geom-overlay" />

    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A / | / A D C /" x1="95" y1="29" x2="226" y2="173" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="95" y1="29" x2="138.23" y2="76.52" class="geom-line geom-overlay" />
    <line id="hl-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" x1="138.23" y1="76.52" x2="226" y2="173" class="geom-line geom-overlay" />

    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="49" y1="173" x2="226" y2="173" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="138.23" y1="76.52" x2="79.82" y2="76.52" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="95" cy="29" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="49" cy="173" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="226" cy="173" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="138.23" cy="76.52" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="79.82" cy="76.52" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="96" y="17" text-anchor="middle" dominant-baseline="central" class="geom-label">A</text>
    <text id="lbl-E" data-ref="E" x="69" y="75" text-anchor="middle" dominant-baseline="central" class="geom-label">E</text>
    <text id="lbl-D" data-ref="D" x="148" y="75" text-anchor="middle" dominant-baseline="central" class="geom-label">D</text>
    <text id="lbl-B" data-ref="B" x="50" y="185" text-anchor="middle" dominant-baseline="central" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="227" y="185" text-anchor="middle" dominant-baseline="central" class="geom-label">C</text>
  </g>
</svg>
