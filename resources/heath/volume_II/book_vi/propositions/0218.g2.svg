<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 203" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="246" height="203" fill="#ffffff"/>
  <polygon points="95.00,29.00 49.00,173.00 226.00,173.00" class="geometry interactive"/>
  <line x1="79.82" y1="76.52" x2="138.23" y2="76.52" class="geometry interactive"/>
  <circle cx="95.00" cy="29.00" r="2.5" class="point"/>
  <circle cx="49.00" cy="173.00" r="2.5" class="point"/>
  <circle cx="226.00" cy="173.00" r="2.5" class="point"/>
  <circle cx="138.23" cy="76.52" r="2.5" class="point"/>
  <circle cx="79.82" cy="76.52" r="2.5" class="point"/>
  <text x="96.00" y="18.00" class="label">A</text>
  <text x="70.82" y="74.52" class="label">E</text>
  <text x="147.23" y="74.52" class="label">D</text>
  <text x="50.00" y="184.00" class="label">B</text>
  <text x="227.00" y="184.00" class="label">C</text>
</svg>
