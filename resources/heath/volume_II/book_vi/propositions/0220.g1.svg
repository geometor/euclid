<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 177 208" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="177" height="208" fill="#ffffff"/>
  <polygon points="49.00,25.00 20.00,141.00 157.00,179.00" class="geometry interactive"/>
  <line x1="37.40" y1="71.40" x2="92.20" y2="86.60" class="geometry interactive"/>
  <circle cx="49.00" cy="25.00" r="2.5" class="point"/>
  <circle cx="37.40" cy="71.40" r="2.5" class="point"/>
  <circle cx="92.20" cy="86.60" r="2.5" class="point"/>
  <circle cx="20.00" cy="141.00" r="2.5" class="point"/>
  <circle cx="157.00" cy="179.00" r="2.5" class="point"/>
  <text x="49.00" y="15.00" class="label">A</text>
  <text x="28.40" y="69.40" class="label">B</text>
  <text x="101.20" y="84.60" class="label">C</text>
  <text x="20.00" y="152.00" class="label">D</text>
  <text x="158.00" y="190.00" class="label">E</text>
</svg>
