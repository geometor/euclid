<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 177 208" width="177" height="208" class="euclid-graphic" data-graphic-id="0220.g1" data-folio="0220" data-graphic="g1" data-proposition="VI.11">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circles & Infinite Lines) -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
    <polygon id="el-poly-ADE" data-ref="&lt; A D E &gt;" data-aliases="&lt; A E D &gt;;&lt; D A E &gt;;&lt; D E A &gt;;&lt; E A D &gt;;&lt; E D A &gt;" data-type="polygon" points="49,25 20,141 157,179" class="geom-polygon" />
    <polygon id="el-poly-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt;;&lt; B A C &gt;;&lt; B C A &gt;;&lt; C A B &gt;;&lt; C B A &gt;" data-type="polygon" points="49,25 37.4,71.4 92.2,86.6" class="geom-polygon" />

    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /;/ A B D /" data-type="segment" x1="49" y1="25" x2="20" y2="141" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="49" y1="25" x2="37.4" y2="71.4" class="geom-line" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="37.4" y1="71.4" x2="20" y2="141" class="geom-line" />

    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /;/ A C E /" data-type="segment" x1="49" y1="25" x2="157" y2="179" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="49" y1="25" x2="92.2" y2="86.6" class="geom-line" />
    <line id="el-seg-CE" data-ref="/ C E /" data-aliases="/ E C /" data-type="segment" x1="92.2" y1="86.6" x2="157" y2="179" class="geom-line" />

    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="37.4" y1="71.4" x2="92.2" y2="86.6" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="20" y1="141" x2="157" y2="179" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-ADE" data-ref="&lt; A D E &gt;" data-aliases="&lt; A E D &gt;;&lt; D A E &gt;;&lt; D E A &gt;;&lt; E A D &gt;;&lt; E D A &gt;" points="49,25 20,141 157,179" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt;;&lt; B A C &gt;;&lt; B C A &gt;;&lt; C A B &gt;;&lt; C B A &gt;" points="49,25 37.4,71.4 92.2,86.6" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /;/ A B D /" x1="49" y1="25" x2="20" y2="141" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="49" y1="25" x2="37.4" y2="71.4" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="37.4" y1="71.4" x2="20" y2="141" class="geom-line geom-overlay" />

    <line id="hl-seg-AE" data-ref="/ A E /" data-aliases="/ E A /;/ A C E /" x1="49" y1="25" x2="157" y2="179" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="49" y1="25" x2="92.2" y2="86.6" class="geom-line geom-overlay" />
    <line id="hl-seg-CE" data-ref="/ C E /" data-aliases="/ E C /" x1="92.2" y1="86.6" x2="157" y2="179" class="geom-line geom-overlay" />

    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="37.4" y1="71.4" x2="92.2" y2="86.6" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="20" y1="141" x2="157" y2="179" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="49" cy="25" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="37.4" cy="71.4" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="92.2" cy="86.6" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="20" cy="141" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="157" cy="179" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="49" y="14" text-anchor="middle" dominant-baseline="central" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="27" y="69" text-anchor="middle" dominant-baseline="central" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="102" y="84" text-anchor="middle" dominant-baseline="central" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="20" y="153" text-anchor="middle" dominant-baseline="central" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="158" y="191" text-anchor="middle" dominant-baseline="central" class="geom-label">E</text>
  </g>
</svg>
