<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 227 176" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="227" height="176" fill="#ffffff"/>
  <line x1="19.00" y1="149.00" x2="188.00" y2="19.00" class="geometry interactive"/>
  <line x1="19.00" y1="149.00" x2="211.00" y2="149.00" class="geometry interactive"/>
  <line x1="113.64" y1="76.20" x2="108.00" y2="149.00" class="geometry interactive"/>
  <line x1="176.17" y1="28.10" x2="166.80" y2="149.00" class="geometry interactive"/>
  <circle cx="19.00" cy="149.00" r="2.5" class="point"/>
  <circle cx="113.64" cy="76.20" r="2.5" class="point"/>
  <circle cx="176.17" cy="28.10" r="2.5" class="point"/>
  <circle cx="108.00" cy="149.00" r="2.5" class="point"/>
  <circle cx="166.80" cy="149.00" r="2.5" class="point"/>
  <text x="19.00" y="160.00" class="label">D</text>
  <text x="108.00" y="160.00" class="label">H</text>
  <text x="165.80" y="160.00" class="label">F</text>
  <text x="111.64" y="65.20" class="label">G</text>
  <text x="174.17" y="18.10" class="label">E</text>
