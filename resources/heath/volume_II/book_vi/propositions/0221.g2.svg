<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 138" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="208" height="138" fill="#ffffff"/>
  <line x1="18.00" y1="110.00" x2="145.00" y2="16.00" class="geometry interactive"/>
  <line x1="18.00" y1="110.00" x2="192.00" y2="110.00" class="geometry interactive"/>
  <line x1="84.04" y1="61.12" x2="152.00" y2="110.00" class="geometry interactive"/>
  <line x1="92.93" y1="54.54" x2="76.00" y2="110.00" class="geometry interactive"/>
  <circle cx="18.00" cy="110.00" r="2.5" class="point"/>
  <circle cx="84.04" cy="61.12" r="2.5" class="point"/>
  <circle cx="92.93" cy="54.54" r="2.5" class="point"/>
  <circle cx="76.00" cy="110.00" r="2.5" class="point"/>
  <circle cx="152.00" cy="110.00" r="2.5" class="point"/>
  <text x="20.00" y="120.00" class="label">D</text>
  <text x="76.00" y="121.00" class="label">H</text>
  <text x="152.00" y="121.00" class="label">E</text>
  <text x="80.04" y="52.12" class="label">F</text>
  <text x="90.93" y="43.54" class="label">G</text>
</svg>
