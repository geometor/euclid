<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 131" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="195" height="131" fill="#ffffff"/>
  <path d="M 18.00 101.00 A 78.50 78.50 0 0 1 175.00 101.00" class="geometry interactive"/>
  <line x1="18.00" y1="101.00" x2="175.00" y2="101.00" class="geometry interactive"/>
  <line x1="18.00" y1="101.00" x2="131.00" y2="30.49" class="geometry interactive"/>
  <line x1="131.00" y1="30.49" x2="175.00" y2="101.00" class="geometry interactive"/>
  <line x1="131.00" y1="30.49" x2="131.00" y2="101.00" class="geometry interactive"/>
  <circle cx="18.00" cy="101.00" r="2.5" class="point"/>
  <circle cx="131.00" cy="101.00" r="2.5" class="point"/>
  <circle cx="175.00" cy="101.00" r="2.5" class="point"/>
  <circle cx="131.00" cy="30.49" r="2.5" class="point"/>
  <text x="19.00" y="113.00" class="label">A</text>
  <text x="132.00" y="113.00" class="label">B</text>
  <text x="175.00" y="113.00" class="label">C</text>
  <text x="134.00" y="19.49" class="label">D</text>
</svg>
