<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 190" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="250" height="190" fill="#ffffff"/>
  <line x1="60.00" y1="30.00" x2="229.00" y2="30.00" class="geometry interactive"/>
  <line x1="47.00" y1="72.00" x2="216.00" y2="72.00" class="geometry interactive"/>
  <line x1="19.00" y1="163.00" x2="74.00" y2="163.00" class="geometry interactive"/>
  <line x1="60.00" y1="30.00" x2="19.00" y2="163.00" class="geometry interactive"/>
  <line x1="115.00" y1="30.00" x2="74.00" y2="163.00" class="geometry interactive"/>
  <line x1="229.00" y1="30.00" x2="216.00" y2="72.00" class="geometry interactive"/>
  <circle cx="19.00" cy="163.00" r="2.5" class="point"/>
  <circle cx="74.00" cy="163.00" r="2.5" class="point"/>
  <circle cx="47.00" cy="72.00" r="2.5" class="point"/>
  <circle cx="102.00" cy="72.00" r="2.5" class="point"/>
  <circle cx="216.00" cy="72.00" r="2.5" class="point"/>
  <circle cx="115.00" cy="30.00" r="2.5" class="point"/>
  <circle cx="229.00" cy="30.00" r="2.5" class="point"/>
  <text x="19.00" y="175.00" class="label">A</text>
  <text x="74.00" y="175.00" class="label">D</text>
  <text x="38.00" y="73.00" class="label">F</text>
  <text x="108.00" y="82.00" class="label">B</text>
  <text x="216.00" y="82.00" class="label">G</text>
  <text x="116.00" y="20.00" class="label">E</text>
  <text x="230.00" y="20.00" class="label">C</text>
</svg>
