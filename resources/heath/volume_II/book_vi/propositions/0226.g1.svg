<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 212" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="160" height="212" fill="#ffffff"/>
  <line x1="51.00" y1="30.00" x2="20.00" y2="152.00" class="geometry interactive"/>
  <line x1="51.00" y1="30.00" x2="112.00" y2="48.00" class="geometry interactive"/>
  <line x1="112.00" y1="48.00" x2="139.00" y2="185.00" class="geometry interactive"/>
  <line x1="51.00" y1="30.00" x2="139.00" y2="185.00" class="geometry interactive"/>
  <line x1="20.00" y1="152.00" x2="112.00" y2="48.00" class="geometry interactive"/>
  <circle cx="81.07" cy="82.96" r="2.5" class="point"/>
  <circle cx="51.00" cy="30.00" r="2.5" class="point"/>
  <circle cx="20.00" cy="152.00" r="2.5" class="point"/>
  <circle cx="112.00" cy="48.00" r="2.5" class="point"/>
  <circle cx="139.00" cy="185.00" r="2.5" class="point"/>
  <text x="52.00" y="19.00" class="label">B</text>
  <text x="115.00" y="38.00" class="label">D</text>
  <text x="81.07" y="94.96" class="label">A</text>
  <text x="20.00" y="164.00" class="label">C</text>
  <text x="140.00" y="197.00" class="label">E</text>
</svg>
