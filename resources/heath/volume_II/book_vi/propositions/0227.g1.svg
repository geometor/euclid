<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197 142" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="197" height="142" fill="#ffffff"/>
  <polygon points="104.00,24.00 19.00,114.00 177.00,114.00" class="geometry interactive"/>
  <line x1="104.00" y1="24.00" x2="78.00" y2="114.00" class="geometry interactive"/>
  <line x1="94.90" y1="55.50" x2="177.00" y2="114.00" class="geometry interactive"/>
  <circle cx="78.00" cy="114.00" r="2.5" class="point"/>
  <circle cx="104.00" cy="24.00" r="2.5" class="point"/>
  <circle cx="19.00" cy="114.00" r="2.5" class="point"/>
  <circle cx="177.00" cy="114.00" r="2.5" class="point"/>
  <circle cx="94.90" cy="55.50" r="2.5" class="point"/>
  <text x="113.00" y="20.00" class="label">B</text>
  <text x="103.90" y="51.50" class="label">E</text>
  <text x="20.00" y="125.00" class="label">C</text>
  <text x="78.00" y="125.00" class="label">A</text>
  <text x="177.00" y="125.00" class="label">D</text>
</svg>
