<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 133" width="165" height="133" class="euclid-graphic" data-graphic-id="0227.g2" data-folio="0227" data-graphic="g2" data-proposition="VI.16">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
      transition: stroke 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge.angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .wedge.angle:hover, .wedge.angle.highlight, .wedge.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.28 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Circles & Infinite Lines) -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
    <polygon id="el-poly-BG" data-ref="&lt; B G &gt;" data-aliases="&lt; G B &gt;;&lt; G A B K &gt;;&lt; A B K G &gt;" data-type="polygon" points="27.00,20.00 142.00,20.00 142.00,74.00 27.00,74.00" class="geom-polygon" />

    <path id="el-ang-BAG" data-ref="&lt; B A G )" data-aliases="&lt; G A B );( A B )&lt; B A G &gt;;( A G )&lt; G A B &gt;" data-type="wedge" d="M 27.00 74.00 L 27.00 56.00 A 18 18 0 0 1 45.00 74.00 Z" class="wedge angle geom-overlay" />

    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="27.00" y1="74.00" x2="142.00" y2="74.00" class="geom-line" />
    <line id="el-seg-AG" data-ref="/ A G /" data-aliases="/ G A /" data-type="segment" x1="27.00" y1="74.00" x2="27.00" y2="20.00" class="geom-line" />
    <line id="el-seg-GK" data-ref="/ G K /" data-aliases="/ K G /" data-type="segment" x1="27.00" y1="20.00" x2="142.00" y2="20.00" class="geom-line" />
    <line id="el-seg-BK" data-ref="/ B K /" data-aliases="/ K B /" data-type="segment" x1="142.00" y1="74.00" x2="142.00" y2="20.00" class="geom-line" />
    <line id="el-seg-E" data-ref="/ E /" data-aliases="E;/ E1 E2 /" data-type="segment" x1="27.00" y1="113.00" x2="87.00" y2="113.00" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-BG" data-ref="&lt; B G &gt;" data-aliases="&lt; G B &gt;;&lt; G A B K &gt;;&lt; A B K G &gt;" points="27.00,20.00 142.00,20.00 142.00,74.00 27.00,74.00" class="geom-polygon geom-overlay" />
    <path id="hl-ang-BAG" data-ref="&lt; B A G )" data-aliases="&lt; G A B );( A B )&lt; B A G &gt;;( A G )&lt; G A B &gt;" d="M 27.00 74.00 L 27.00 56.00 A 18 18 0 0 1 45.00 74.00 Z" class="wedge angle geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="27.00" y1="74.00" x2="142.00" y2="74.00" class="geom-line geom-overlay" />
    <line id="hl-seg-AG" data-ref="/ A G /" data-aliases="/ G A /" x1="27.00" y1="74.00" x2="27.00" y2="20.00" class="geom-line geom-overlay" />
    <line id="hl-seg-E" data-ref="/ E /" data-aliases="E;/ E1 E2 /" x1="27.00" y1="113.00" x2="87.00" y2="113.00" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="27.00" cy="20.00" r="3.5" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="27.00" cy="74.00" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="142.00" cy="74.00" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-G" data-ref="G" x="18.00" y="22.00" text-anchor="middle" dominant-baseline="central" class="geom-label">G</text>
    <text id="lbl-A" data-ref="A" x="27.00" y="86.00" text-anchor="middle" dominant-baseline="central" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="142.00" y="86.00" text-anchor="middle" dominant-baseline="central" class="geom-label">B</text>
    <text id="lbl-E" data-ref="/ E /" data-aliases="E" x="18.00" y="113.00" text-anchor="middle" dominant-baseline="central" class="geom-label">E</text>
  </g>
</svg>
