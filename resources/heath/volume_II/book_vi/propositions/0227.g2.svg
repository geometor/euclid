<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 95" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="165" height="95" fill="#ffffff"/>
  <polygon points="27.00,20.00 142.00,20.00 142.00,74.00 27.00,74.00" class="geometry interactive"/>
  <text x="20.00" y="23.00" class="label">G</text>
  <text x="27.00" y="85.00" class="label">A</text>
  <text x="144.00" y="85.00" class="label">B</text>
</svg>
