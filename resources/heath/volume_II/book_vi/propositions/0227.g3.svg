<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 139 133" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
    }
    .geometry {
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .construction {
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 4, 3;
      fill: none;
      stroke-linecap: round;
    }
    .point {
      fill: #000000;
      stroke: none;
    }
    .label {
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .interactive:hover {
      stroke: #0284c7;
      stroke-width: 2.5;
      cursor: pointer;
    }
  </style>
  <rect width="139" height="133" fill="#ffffff"/>
  <polygon points="28.00,20.00 120.00,20.00 120.00,80.00 28.00,80.00" class="geometry interactive"/>
  <line x1="28.00" y1="113.00" x2="76.00" y2="113.00" class="geometry interactive"/>
  <text x="19.00" y="22.00" class="label">H</text>
  <text x="29.00" y="90.00" class="label">C</text>
  <text x="119.00" y="91.00" class="label">D</text>
  <text x="21.00" y="113.00" class="label">F</text>
</svg>
