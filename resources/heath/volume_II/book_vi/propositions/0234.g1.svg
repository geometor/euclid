<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 100" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="330" height="100" fill="#ffffff"/>
  <line x1="79" y1="19" x2="265" y2="19" class="geometry interactive"/>
  <circle cx="79" cy="19" r="2.5" class="point"/>
  <circle cx="265" cy="19" r="2.5" class="point"/>
  <text x="69" y="19" class="label">A</text>
  <line x1="29" y1="53" x2="149" y2="53" class="geometry interactive"/>
  <circle cx="29" cy="53" r="2.5" class="point"/>
  <circle cx="149" cy="53" r="2.5" class="point"/>
  <text x="19" y="53" class="label">B</text>
  <line x1="193" y1="53" x2="312" y2="53" class="geometry interactive"/>
  <circle cx="193" cy="53" r="2.5" class="point"/>
  <circle cx="312" cy="53" r="2.5" class="point"/>
  <text x="183" y="53" class="label">D</text>
  <line x1="33" y1="84" x2="108" y2="84" class="geometry interactive"/>
  <circle cx="33" cy="84" r="2.5" class="point"/>
  <circle cx="108" cy="84" r="2.5" class="point"/>
  <text x="23" y="84" class="label">C</text>
</svg>
