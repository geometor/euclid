    <line id="el-seg-B" data-ref="B" data-aliases="/ B /;/ B1 B2 /" data-type="segment" x1="29.00" y1="53.00" x2="149.00" y2="53.00" class="geom-line" />
    <line id="el-seg-D" data-ref="D" data-aliases="/ D /;/ D1 D2 /" data-type="segment" x1="193.00" y1="53.00" x2="312.00" y2="53.00" class="geom-line" />
    <line id="el-seg-C" data-ref="C" data-aliases="/ C /;/ C1 C2 /" data-type="segment" x1="33.00" y1="84.00" x2="108.00" y2="84.00" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-seg-A" data-ref="A" data-aliases="/ A /;/ A1 A2 /" x1="79.00" y1="19.00" x2="265.00" y2="19.00" class="geom-line geom-overlay" />
    <line id="hl-seg-B" data-ref="B" data-aliases="/ B /;/ B1 B2 /" x1="29.00" y1="53.00" x2="149.00" y2="53.00" class="geom-line geom-overlay" />
