<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 394 177" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="394" height="177" fill="#ffffff"/>
  <polygon points="71,148 182,148 199,71 99,28 27,76" class="geometry interactive"/>
  <line x1="182" y1="148" x2="27" y2="76" class="geometry interactive"/>
  <line x1="182" y1="148" x2="99" y2="28" class="geometry interactive"/>
  <circle cx="71" cy="148" r="2.5" class="point"/>
  <circle cx="182" cy="148" r="2.5" class="point"/>
  <circle cx="199" cy="71" r="2.5" class="point"/>
  <circle cx="99" cy="28" r="2.5" class="point"/>
  <circle cx="27" cy="76" r="2.5" class="point"/>
  <text x="68" y="161" class="label">A</text>
  <text x="186" y="161" class="label">B</text>
  <text x="211" y="71" class="label">H</text>
  <text x="99" y="15" class="label">K</text>
  <text x="15" y="76" class="label">L</text>
  <polygon points="289,148 355,148 366,102 306,76 262,105" class="geometry interactive"/>
  <line x1="355" y1="148" x2="262" y2="105" class="geometry interactive"/>
  <line x1="355" y1="148" x2="306" y2="76" class="geometry interactive"/>
  <circle cx="289" cy="148" r="2.5" class="point"/>
  <circle cx="355" cy="148" r="2.5" class="point"/>
  <circle cx="366" cy="102" r="2.5" class="point"/>
  <circle cx="306" cy="76" r="2.5" class="point"/>
  <circle cx="262" cy="105" r="2.5" class="point"/>
  <text x="285" y="161" class="label">C</text>
  <text x="359" y="161" class="label">D</text>
  <text x="378" y="102" class="label">E</text>
  <text x="306" y="63" class="label">F</text>
  <text x="250" y="105" class="label">G</text>
</svg>
