<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 284 173" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="284" height="173" fill="#ffffff"/>
  <polygon points="65,147 41,95 65,69 192,112 156,147" class="geometry interactive"/>
  <line x1="65" y1="147" x2="65" y2="69" class="geometry interactive"/>
  <line x1="65" y1="147" x2="192" y2="112" class="geometry interactive"/>
  <polyline points="41,95 28,68 65,31 253,95 200,147" class="construction interactive"/>
  <line x1="156" y1="147" x2="200" y2="147" class="construction interactive"/>
  <line x1="65" y1="69" x2="65" y2="31" class="construction interactive"/>
  <line x1="192" y1="112" x2="253" y2="95" class="construction interactive"/>
  <line x1="266" y1="147" x2="280" y2="147" class="geometry interactive"/>
  <circle cx="65" cy="147" r="2.5" class="point"/>
  <circle cx="41" cy="95" r="2.5" class="point"/>
  <circle cx="65" cy="69" r="2.5" class="point"/>
  <circle cx="192" cy="112" r="2.5" class="point"/>
  <circle cx="156" cy="147" r="2.5" class="point"/>
  <circle cx="28" cy="68" r="2.5" class="point"/>
  <circle cx="65" cy="31" r="2.5" class="point"/>
  <circle cx="253" cy="95" r="2.5" class="point"/>
  <circle cx="200" cy="147" r="2.5" class="point"/>
  <text x="65" y="160" class="label">C</text>
  <text x="30" y="99" class="label">G</text>
  <text x="75" y="62" class="label">F</text>
  <text x="192" y="99" class="label">E</text>
  <text x="156" y="160" class="label">D</text>
  <text x="17" y="66" class="label">G'</text>
  <text x="65" y="18" class="label">F'</text>
  <text x="256" y="82" class="label">E'</text>
  <text x="202" y="160" class="label">D'</text>
  <text x="266" y="160" class="label">A</text>
</svg>
