  <line x1="9" y1="169" x2="465" y2="48" class="construction interactive"/>
  <line x1="34" y1="198" x2="452" y2="24" class="construction interactive"/>
  <polygon points="53,157 54,68 92,43 147,112 110,166" class="geometry interactive"/>
  <polygon points="169,126 170,80 188,68 215,103 197,130" class="geometry interactive"/>
  <polygon points="421,59 420,120 397,137 361,90 383,55" class="geometry interactive"/>
  <circle cx="272" cy="99" r="2.5" class="point"/>
