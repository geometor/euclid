  <circle cx="110" cy="166" r="2.5" class="point"/>
  <circle cx="169" cy="126" r="2.5" class="point"/>
  <circle cx="170" cy="80" r="2.5" class="point"/>
  <circle cx="188" cy="68" r="2.5" class="point"/>
  <circle cx="215" cy="103" r="2.5" class="point"/>
  <circle cx="197" cy="130" r="2.5" class="point"/>
  <circle cx="421" cy="59" r="2.5" class="point"/>
