<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="320" height="150" fill="#ffffff"/>
  <polygon points="101,27 21,123 146,123" class="geometry interactive"/>
  <line x1="101" y1="27" x2="74" y2="123" class="geometry interactive"/>
  <polygon points="272,56 221,124 300,124" class="geometry interactive"/>
  <circle cx="101" cy="27" r="2.5" class="point"/>
  <circle cx="21" cy="123" r="2.5" class="point"/>
  <circle cx="74" cy="123" r="2.5" class="point"/>
  <circle cx="146" cy="123" r="2.5" class="point"/>
  <circle cx="272" cy="56" r="2.5" class="point"/>
  <circle cx="221" cy="124" r="2.5" class="point"/>
  <circle cx="300" cy="124" r="2.5" class="point"/>
  <text x="96" y="16" class="label">A</text>
  <text x="18" y="136" class="label">B</text>
  <text x="72" y="136" class="label">G</text>
  <text x="148" y="136" class="label">C</text>
  <text x="272" y="43" class="label">D</text>
  <text x="218" y="137" class="label">E</text>
  <text x="303" y="137" class="label">F</text>
</svg>
