<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 378 186" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="378" height="186" fill="#ffffff"/>
  <polygon points="66,27 28,70 66,157 177,157 193,70" class="geometry interactive"/>
  <line x1="28" y1="70" x2="193" y2="70" class="geometry interactive"/>
  <line x1="28" y1="70" x2="177" y2="157" class="geometry interactive"/>
  <line x1="66" y1="157" x2="193" y2="70" class="geometry interactive"/>
  <line x1="66" y1="27" x2="66" y2="157" class="geometry interactive"/>
  <circle cx="66" cy="27" r="2.5" class="point"/>
  <circle cx="28" cy="70" r="2.5" class="point"/>
  <circle cx="66" cy="157" r="2.5" class="point"/>
  <circle cx="177" cy="157" r="2.5" class="point"/>
  <circle cx="193" cy="70" r="2.5" class="point"/>
  <circle cx="66" cy="70" r="2.5" class="point"/>
  <text x="66" y="14" class="label">A</text>
  <text x="16" y="70" class="label">B</text>
  <text x="64" y="171" class="label">C</text>
  <text x="181" y="171" class="label">D</text>
  <text x="205" y="70" class="label">E</text>
  <text x="77" y="61" class="label">M</text>
  <polygon points="259,61 230,94 259,157 338,157 352,94" class="geometry interactive"/>
  <line x1="230" y1="94" x2="352" y2="94" class="geometry interactive"/>
  <line x1="230" y1="94" x2="338" y2="157" class="geometry interactive"/>
  <line x1="259" y1="157" x2="352" y2="94" class="geometry interactive"/>
  <line x1="259" y1="61" x2="259" y2="157" class="geometry interactive"/>
  <circle cx="259" cy="61" r="2.5" class="point"/>
  <circle cx="230" cy="94" r="2.5" class="point"/>
  <circle cx="259" cy="157" r="2.5" class="point"/>
  <circle cx="338" cy="157" r="2.5" class="point"/>
  <circle cx="352" cy="94" r="2.5" class="point"/>
  <circle cx="259" cy="94" r="2.5" class="point"/>
  <text x="259" y="48" class="label">F</text>
  <text x="218" y="94" class="label">G</text>
  <text x="257" y="171" class="label">H</text>
  <text x="342" y="171" class="label">K</text>
  <text x="364" y="94" class="label">L</text>
  <text x="270" y="84" class="label">N</text>
</svg>
