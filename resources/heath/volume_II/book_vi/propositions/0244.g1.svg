<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 401 192" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="401" height="192" fill="#ffffff"/>
  <polygon points="39,60 26,115 68,163 137,163 139,108" class="geometry interactive"/>
  <line x1="26" y1="115" x2="139" y2="108" class="geometry interactive"/>
  <line x1="68" y1="163" x2="139" y2="108" class="geometry interactive"/>
  <circle cx="39" cy="60" r="2.5" class="point"/>
  <circle cx="26" cy="115" r="2.5" class="point"/>
  <circle cx="68" cy="163" r="2.5" class="point"/>
  <circle cx="137" cy="163" r="2.5" class="point"/>
  <circle cx="139" cy="108" r="2.5" class="point"/>
  <text x="36" y="47" class="label">A</text>
  <text x="14" y="115" class="label">B</text>
  <text x="66" y="176" class="label">C</text>
  <text x="141" y="176" class="label">D</text>
  <text x="151" y="108" class="label">E</text>
  <polygon points="238,22 220,97 277,162 371,162 375,87" class="geometry interactive"/>
  <line x1="220" y1="97" x2="375" y2="87" class="geometry interactive"/>
  <line x1="277" y1="162" x2="375" y2="87" class="geometry interactive"/>
  <circle cx="238" cy="22" r="2.5" class="point"/>
  <circle cx="220" cy="97" r="2.5" class="point"/>
  <circle cx="277" cy="162" r="2.5" class="point"/>
  <circle cx="371" cy="162" r="2.5" class="point"/>
  <circle cx="375" cy="87" r="2.5" class="point"/>
  <text x="238" y="11" class="label">F</text>
  <text x="207" y="97" class="label">G</text>
  <text x="275" y="176" class="label">H</text>
  <text x="375" y="176" class="label">K</text>
  <text x="387" y="87" class="label">L</text>
</svg>
