<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 491 195" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="491" height="195" fill="#ffffff"/>
  <polygon points="16,48 166,86 179,153 52,153" class="geometry interactive"/>
  <circle cx="16" cy="48" r="2.5" class="point"/>
  <circle cx="166" cy="86" r="2.5" class="point"/>
  <circle cx="179" cy="153" r="2.5" class="point"/>
  <circle cx="52" cy="153" r="2.5" class="point"/>
  <text x="105" y="112" class="label">A</text>
  <polygon points="231,86 328,112 336,154 254,154" class="geometry interactive"/>
  <circle cx="231" cy="86" r="2.5" class="point"/>
  <circle cx="328" cy="112" r="2.5" class="point"/>
  <circle cx="336" cy="154" r="2.5" class="point"/>
  <circle cx="254" cy="154" r="2.5" class="point"/>
  <text x="288" y="128" class="label">B</text>
  <polygon points="397,102 468,121 474,154 415,154" class="geometry interactive"/>
  <circle cx="397" cy="102" r="2.5" class="point"/>
  <circle cx="468" cy="121" r="2.5" class="point"/>
  <circle cx="474" cy="154" r="2.5" class="point"/>
  <circle cx="415" cy="154" r="2.5" class="point"/>
  <text x="440" y="134" class="label">C</text>
</svg>
