    <line id="el-seg-G" data-ref="G" data-aliases="&lt; G &gt;;/ G /" data-type="segment" x1="24.0" y1="86.0" x2="99.0" y2="86.0" class="geom-line" />
    <line id="el-seg-H" data-ref="H" data-aliases="&lt; H &gt;;/ H /" data-type="segment" x1="24.0" y1="106.0" x2="121.0" y2="106.0" class="geom-line" />

    <line id="el-seg-D" data-ref="D" data-aliases="&lt; D &gt;;/ D /" data-type="segment" x1="233.0" y1="19.0" x2="377.0" y2="19.0" class="geom-line" />
    <line id="el-seg-E" data-ref="E" data-aliases="&lt; E &gt;;/ E /" data-type="segment" x1="233.0" y1="40.0" x2="336.0" y2="40.0" class="geom-line" />
