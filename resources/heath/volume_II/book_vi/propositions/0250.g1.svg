<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 125" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="395" height="125" fill="#ffffff"/>
  <line x1="24" y1="19" x2="154" y2="19" class="geometry interactive"/>
  <circle cx="24" cy="19" r="2.5" class="point"/>
  <circle cx="154" cy="19" r="2.5" class="point"/>
  <text x="14" y="19" class="label">A</text>
  <line x1="24" y1="40" x2="105" y2="40" class="geometry interactive"/>
  <circle cx="24" cy="40" r="2.5" class="point"/>
  <circle cx="105" cy="40" r="2.5" class="point"/>
  <text x="14" y="40" class="label">B</text>
  <line x1="24" y1="63" x2="77" y2="63" class="geometry interactive"/>
  <circle cx="24" cy="63" r="2.5" class="point"/>
  <circle cx="77" cy="63" r="2.5" class="point"/>
  <text x="14" y="63" class="label">C</text>
  <line x1="24" y1="86" x2="99" y2="86" class="geometry interactive"/>
  <circle cx="24" cy="86" r="2.5" class="point"/>
  <circle cx="99" cy="86" r="2.5" class="point"/>
  <text x="14" y="86" class="label">G</text>
  <line x1="24" y1="106" x2="121" y2="106" class="geometry interactive"/>
  <circle cx="24" cy="106" r="2.5" class="point"/>
  <circle cx="121" cy="106" r="2.5" class="point"/>
  <text x="14" y="106" class="label">H</text>
  <line x1="233" y1="19" x2="377" y2="19" class="geometry interactive"/>
  <circle cx="233" cy="19" r="2.5" class="point"/>
  <circle cx="377" cy="19" r="2.5" class="point"/>
  <text x="223" y="19" class="label">D</text>
  <line x1="233" y1="40" x2="336" y2="40" class="geometry interactive"/>
  <circle cx="233" cy="40" r="2.5" class="point"/>
  <circle cx="336" cy="40" r="2.5" class="point"/>
  <text x="223" y="40" class="label">E</text>
  <line x1="233" y1="63" x2="308" y2="63" class="geometry interactive"/>
  <circle cx="233" cy="63" r="2.5" class="point"/>
  <circle cx="308" cy="63" r="2.5" class="point"/>
  <text x="223" y="63" class="label">F</text>
</svg>
