<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 263 149" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="263" height="149" fill="#ffffff"/>
  <polygon points="31,28 123,28 118,59 26,59" class="geometry interactive"/>
  <polygon points="118,59 231,59 223,109 110,109" class="geometry interactive"/>
  <line x1="123" y1="28" x2="236" y2="28" class="geometry interactive"/>
  <line x1="236" y1="28" x2="231" y2="59" class="geometry interactive"/>
  <circle cx="31" cy="28" r="2.5" class="point"/>
  <circle cx="123" cy="28" r="2.5" class="point"/>
  <circle cx="236" cy="28" r="2.5" class="point"/>
  <circle cx="26" cy="59" r="2.5" class="point"/>
  <circle cx="118" cy="59" r="2.5" class="point"/>
  <circle cx="231" cy="59" r="2.5" class="point"/>
  <circle cx="110" cy="109" r="2.5" class="point"/>
  <circle cx="223" cy="109" r="2.5" class="point"/>
  <text x="31" y="16" class="label">A</text>
  <text x="123" y="16" class="label">D</text>
  <text x="238" y="16" class="label">H</text>
  <text x="15" y="59" class="label">B</text>
  <text x="107" y="71" class="label">C</text>
  <text x="242" y="59" class="label">G</text>
  <text x="110" y="122" class="label">E</text>
  <text x="223" y="122" class="label">F</text>
</svg>
