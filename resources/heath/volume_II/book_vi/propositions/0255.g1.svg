<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 158" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="240" height="158" fill="#ffffff"/>
  <polygon points="43,31 124,31 118,62 37,62" class="geometry interactive"/>
  <polygon points="118,62 213,62 204,112 109,112" class="geometry interactive"/>
  <line x1="124" y1="31" x2="219" y2="31" class="geometry interactive"/>
  <line x1="219" y1="31" x2="213" y2="62" class="geometry interactive"/>
  <line x1="124" y1="31" x2="213" y2="62" class="construction interactive"/>
  <line x1="43" y1="31" x2="8" y2="31" class="construction interactive"/>
  <line x1="37" y1="62" x2="8" y2="62" class="construction interactive"/>
  <line x1="109" y1="112" x2="8" y2="112" class="construction interactive"/>
  <circle cx="43" cy="31" r="2.5" class="point"/>
  <circle cx="124" cy="31" r="2.5" class="point"/>
  <circle cx="219" cy="31" r="2.5" class="point"/>
  <circle cx="37" cy="62" r="2.5" class="point"/>
  <circle cx="118" cy="62" r="2.5" class="point"/>
  <circle cx="213" cy="62" r="2.5" class="point"/>
  <circle cx="109" cy="112" r="2.5" class="point"/>
  <circle cx="204" cy="112" r="2.5" class="point"/>
  <text x="43" y="19" class="label">A</text>
  <text x="124" y="19" class="label">D</text>
  <text x="221" y="19" class="label">H</text>
  <text x="28" y="52" class="label">B</text>
  <text x="108" y="74" class="label">C</text>
  <text x="224" y="62" class="label">G</text>
  <text x="109" y="125" class="label">E</text>
  <text x="204" y="125" class="label">F</text>
</svg>
