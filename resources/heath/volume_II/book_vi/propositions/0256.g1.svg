<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 339 165" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="339" height="165" fill="#ffffff"/>
  <polygon points="44,29 137,29 111,122 18,122" class="geometry interactive"/>
  <line x1="44" y1="29" x2="44" y2="122" class="geometry interactive"/>
  <circle cx="44" cy="29" r="2.5" class="point"/>
  <circle cx="137" cy="29" r="2.5" class="point"/>
  <circle cx="18" cy="122" r="2.5" class="point"/>
  <circle cx="44" cy="122" r="2.5" class="point"/>
  <circle cx="111" cy="122" r="2.5" class="point"/>
  <text x="44" y="16" class="label">A</text>
  <text x="18" y="135" class="label">B</text>
  <text x="44" y="135" class="label">G</text>
  <text x="111" y="135" class="label">C</text>
  <polygon points="197,44 324,44 303,122 176,122" class="geometry interactive"/>
  <line x1="197" y1="44" x2="197" y2="122" class="geometry interactive"/>
  <circle cx="197" cy="44" r="2.5" class="point"/>
  <circle cx="324" cy="44" r="2.5" class="point"/>
  <circle cx="176" cy="122" r="2.5" class="point"/>
  <circle cx="197" cy="122" r="2.5" class="point"/>
  <circle cx="303" cy="122" r="2.5" class="point"/>
  <text x="197" y="31" class="label">D</text>
  <text x="176" y="135" class="label">E</text>
  <text x="197" y="135" class="label">H</text>
  <text x="303" y="135" class="label">F</text>
</svg>
