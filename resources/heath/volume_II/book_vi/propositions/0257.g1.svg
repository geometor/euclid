<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 209 155" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="209" height="155" fill="#ffffff"/>
  <polygon points="27,29 179,29 187,128 35,128" class="geometry interactive"/>
  <line x1="27" y1="29" x2="187" y2="128" class="geometry interactive"/>
  <line x1="30" y1="61" x2="182" y2="61" class="geometry interactive"/>
  <line x1="73" y1="29" x2="81" y2="128" class="geometry interactive"/>
  <circle cx="27" cy="29" r="2.5" class="point"/>
  <circle cx="73" cy="29" r="2.5" class="point"/>
  <circle cx="179" cy="29" r="2.5" class="point"/>
  <circle cx="30" cy="61" r="2.5" class="point"/>
  <circle cx="76" cy="61" r="2.5" class="point"/>
  <circle cx="182" cy="61" r="2.5" class="point"/>
  <circle cx="35" cy="128" r="2.5" class="point"/>
  <circle cx="81" cy="128" r="2.5" class="point"/>
  <circle cx="187" cy="128" r="2.5" class="point"/>
  <text x="20" y="20" class="label">A</text>
  <text x="73" y="16" class="label">E</text>
  <text x="185" y="20" class="label">B</text>
  <text x="18" y="61" class="label">G</text>
  <text x="66" y="73" class="label">F</text>
  <text x="194" y="61" class="label">H</text>
  <text x="32" y="141" class="label">D</text>
  <text x="81" y="141" class="label">K</text>
  <text x="191" y="141" class="label">C</text>
</svg>
