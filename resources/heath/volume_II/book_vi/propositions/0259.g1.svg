<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 190" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="510" height="190" fill="#ffffff"/>
  <polygon points="26,51 47,125 119,125" class="geometry interactive"/>
  <polygon points="47,125 119,125 108,164 36,164" class="geometry interactive"/>
  <polygon points="119,125 199,125 188,164 108,164" class="geometry interactive"/>
  <circle cx="26" cy="51" r="2.5" class="point"/>
  <circle cx="47" cy="125" r="2.5" class="point"/>
  <circle cx="119" cy="125" r="2.5" class="point"/>
  <circle cx="199" cy="125" r="2.5" class="point"/>
  <circle cx="36" cy="164" r="2.5" class="point"/>
  <circle cx="108" cy="164" r="2.5" class="point"/>
  <circle cx="188" cy="164" r="2.5" class="point"/>
  <text x="24" y="38" class="label">A</text>
  <text x="36" y="122" class="label">B</text>
  <text x="124" y="114" class="label">C</text>
  <text x="208" y="122" class="label">F</text>
  <text x="33" y="177" class="label">L</text>
  <text x="108" y="177" class="label">E</text>
  <text x="191" y="177" class="label">M</text>
  <polygon points="156,84 252,48 296,94 221,110" class="geometry interactive"/>
  <circle cx="156" cy="84" r="2.5" class="point"/>
  <circle cx="252" cy="48" r="2.5" class="point"/>
  <circle cx="296" cy="94" r="2.5" class="point"/>
  <circle cx="221" cy="110" r="2.5" class="point"/>
  <text x="234" y="83" class="label">D</text>
  <polygon points="356,56 385,162 490,162" class="geometry interactive"/>
  <circle cx="356" cy="56" r="2.5" class="point"/>
  <circle cx="385" cy="162" r="2.5" class="point"/>
  <circle cx="490" cy="162" r="2.5" class="point"/>
  <text x="354" y="43" class="label">K</text>
  <text x="382" y="175" class="label">G</text>
  <text x="493" y="175" class="label">H</text>
</svg>
