<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 209 163" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="209" height="163" fill="#ffffff"/>
  <polygon points="35,29 180,29 164,134 19,134" class="geometry interactive"/>
  <line x1="35" y1="29" x2="164" y2="134" class="geometry interactive"/>
  <line x1="95" y1="29" x2="86" y2="89" class="geometry interactive"/>
  <line x1="28" y1="72" x2="88" y2="72" class="geometry interactive"/>
  <line x1="26" y1="89" x2="86" y2="89" class="geometry interactive"/>
  <line x1="35" y1="29" x2="86" y2="89" class="geometry interactive"/>
  <line x1="86" y1="89" x2="164" y2="134" class="geometry interactive"/>
  <circle cx="35" cy="29" r="2.5" class="point"/>
  <circle cx="95" cy="29" r="2.5" class="point"/>
  <circle cx="180" cy="29" r="2.5" class="point"/>
  <circle cx="28" cy="72" r="2.5" class="point"/>
  <circle cx="88" cy="72" r="2.5" class="point"/>
  <circle cx="26" cy="89" r="2.5" class="point"/>
  <circle cx="86" cy="89" r="2.5" class="point"/>
  <circle cx="19" cy="134" r="2.5" class="point"/>
  <circle cx="164" cy="134" r="2.5" class="point"/>
  <text x="25" y="20" class="label">A</text>
  <text x="95" y="16" class="label">G</text>
  <text x="191" y="25" class="label">D</text>
  <text x="16" y="70" class="label">E</text>
  <text x="97" y="65" class="label">F</text>
  <text x="14" y="89" class="label">K</text>
  <text x="82" y="103" class="label">H</text>
  <text x="18" y="147" class="label">B</text>
  <text x="164" y="147" class="label">C</text>
</svg>
