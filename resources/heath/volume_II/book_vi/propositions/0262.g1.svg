<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 143 157" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="143" height="157" fill="#ffffff"/>
  <polygon points="25,29 56,29 51,59 20,59" class="geometry interactive"/>
  <polygon points="51,59 122,59 111,129 40,129" class="geometry interactive"/>
  <line x1="25" y1="29" x2="111" y2="129" class="geometry interactive"/>
  <circle cx="25" cy="29" r="2.5" class="point"/>
  <circle cx="56" cy="29" r="2.5" class="point"/>
  <circle cx="20" cy="59" r="2.5" class="point"/>
  <circle cx="51" cy="59" r="2.5" class="point"/>
  <circle cx="122" cy="59" r="2.5" class="point"/>
  <circle cx="40" cy="129" r="2.5" class="point"/>
  <circle cx="111" cy="129" r="2.5" class="point"/>
  <text x="23" y="16" class="label">F</text>
  <text x="58" y="16" class="label">E</text>
  <text x="10" y="59" class="label">G</text>
  <text x="62" y="50" class="label">A</text>
  <text x="132" y="59" class="label">D</text>
  <text x="38" y="142" class="label">B</text>
  <text x="113" y="142" class="label">C</text>
</svg>
