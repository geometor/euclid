<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 296 212" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="296" height="212" fill="#ffffff"/>
  <line x1="33" y1="122" x2="222" y2="122" class="geometry interactive"/>
  <line x1="222" y1="122" x2="271" y2="122" class="construction interactive"/>
  <polygon points="138,122 158,74 242,74 222,122" class="geometry interactive"/>
  <line x1="121" y1="46" x2="280" y2="166" class="geometry interactive"/>
  <line x1="48" y1="89" x2="236" y2="89" class="construction interactive"/>
  <line x1="19" y1="150" x2="259" y2="150" class="construction interactive"/>
  <line x1="48" y1="89" x2="19" y2="150" class="construction interactive"/>
  <line x1="177" y1="89" x2="163" y2="122" class="construction interactive"/>
  <line x1="222" y1="122" x2="209" y2="150" class="construction interactive"/>
  <line x1="271" y1="122" x2="259" y2="150" class="construction interactive"/>
  <circle cx="33" cy="122" r="2.5" class="point"/>
  <circle cx="138" cy="122" r="2.5" class="point"/>
  <circle cx="163" cy="122" r="2.5" class="point"/>
  <circle cx="222" cy="122" r="2.5" class="point"/>
  <circle cx="271" cy="122" r="2.5" class="point"/>
  <circle cx="158" cy="74" r="2.5" class="point"/>
  <circle cx="242" cy="74" r="2.5" class="point"/>
  <circle cx="177" cy="89" r="2.5" class="point"/>
  <circle cx="236" cy="89" r="2.5" class="point"/>
  <circle cx="19" cy="150" r="2.5" class="point"/>
  <circle cx="209" cy="150" r="2.5" class="point"/>
  <circle cx="259" cy="150" r="2.5" class="point"/>
  <text x="23" y="118" class="label">A</text>
  <text x="138" y="134" class="label">C</text>
  <text x="163" y="134" class="label">F</text>
  <text x="233" y="114" class="label">B</text>
  <text x="269" y="110" class="label">L</text>
  <text x="160" y="62" class="label">D</text>
  <text x="182" y="79" class="label">E</text>
  <text x="244" y="92" class="label">H</text>
