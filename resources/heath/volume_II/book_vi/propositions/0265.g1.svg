<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 203 145" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="203" height="145" fill="#ffffff"/>
  <polygon points="28,30 164,30 164,115 28,115" class="geometry interactive"/>
  <line x1="28" y1="55" x2="164" y2="55" class="geometry interactive"/>
  <line x1="96" y1="30" x2="96" y2="115" class="geometry interactive"/>
  <line x1="116" y1="55" x2="116" y2="115" class="geometry interactive"/>
  <line x1="96" y1="30" x2="164" y2="115" class="geometry interactive"/>
  <circle cx="28" cy="30" r="2.5" class="point"/>
  <circle cx="96" cy="30" r="2.5" class="point"/>
  <circle cx="164" cy="30" r="2.5" class="point"/>
  <circle cx="28" cy="55" r="2.5" class="point"/>
  <circle cx="96" cy="55" r="2.5" class="point"/>
  <circle cx="116" cy="55" r="2.5" class="point"/>
  <circle cx="164" cy="55" r="2.5" class="point"/>
  <circle cx="28" cy="115" r="2.5" class="point"/>
  <circle cx="96" cy="115" r="2.5" class="point"/>
  <circle cx="116" cy="115" r="2.5" class="point"/>
  <circle cx="164" cy="115" r="2.5" class="point"/>
  <text x="96" y="17" class="label">D</text>
  <text x="164" y="17" class="label">E</text>
  <text x="18" y="55" class="label">G</text>
  <text x="121" y="44" class="label">F</text>
  <text x="174" y="55" class="label">H</text>
  <text x="123" y="86" class="label">x</text>
  <text x="28" y="128" class="label">A</text>
  <text x="96" y="128" class="label">C</text>
  <text x="116" y="128" class="label">K</text>
  <text x="164" y="128" class="label">B</text>
</svg>
