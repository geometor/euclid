  <circle cx="24" cy="25" r="2.5" class="point"/>
  <circle cx="187" cy="25" r="2.5" class="point"/>
  <circle cx="35" cy="78" r="2.5" class="point"/>
  <circle cx="91" cy="78" r="2.5" class="point"/>
