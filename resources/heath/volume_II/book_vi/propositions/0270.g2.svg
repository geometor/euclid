<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 155" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="244" height="155" fill="#ffffff"/>
  <polygon points="50,29 228,29 197,95 19,95" class="geometry interactive"/>
  <line x1="123" y1="29" x2="92" y2="95" class="geometry interactive"/>
  <circle cx="50" cy="29" r="2.5" class="point"/>
  <circle cx="123" cy="29" r="2.5" class="point"/>
  <circle cx="228" cy="29" r="2.5" class="point"/>
  <circle cx="19" cy="95" r="2.5" class="point"/>
  <circle cx="92" cy="95" r="2.5" class="point"/>
  <circle cx="197" cy="95" r="2.5" class="point"/>
  <text x="50" y="17" class="label">E</text>
  <text x="123" y="17" class="label">A</text>
  <text x="19" y="108" class="label">D</text>
  <text x="92" y="108" class="label">B</text>
  <text x="197" y="108" class="label">C</text>
</svg>
