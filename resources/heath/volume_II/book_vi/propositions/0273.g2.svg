<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 225" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="150" height="225" fill="#ffffff"/>
  <polygon points="27,29 129,29 129,132 27,132" class="geometry interactive"/>
  <polygon points="27,132 91,132 91,196 27,196" class="geometry interactive"/>
  <line x1="91" y1="29" x2="91" y2="132" class="geometry interactive"/>
  <circle cx="27" cy="29" r="2.5" class="point"/>
  <circle cx="91" cy="29" r="2.5" class="point"/>
  <circle cx="129" cy="29" r="2.5" class="point"/>
  <circle cx="27" cy="132" r="2.5" class="point"/>
  <circle cx="91" cy="132" r="2.5" class="point"/>
  <circle cx="129" cy="132" r="2.5" class="point"/>
  <circle cx="27" cy="196" r="2.5" class="point"/>
  <circle cx="91" cy="196" r="2.5" class="point"/>
  <text x="27" y="17" class="label">C</text>
  <text x="91" y="17" class="label">F</text>
  <text x="129" y="17" class="label">H</text>
  <text x="17" y="132" class="label">A</text>
  <text x="99" y="142" class="label">E</text>
  <text x="129" y="144" class="label">B</text>
  <text x="91" y="208" class="label">D</text>
</svg>
