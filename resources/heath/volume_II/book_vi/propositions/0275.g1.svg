<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 219" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="264" height="219" fill="#ffffff"/>
  <polygon points="85,65 46,139 221,139" class="geometry interactive"/>
  <line x1="85" y1="65" x2="85" y2="139" class="geometry interactive"/>
  <polygon points="46,139 221,139 221,202 46,202" class="geometry interactive"/>
  <polygon points="46,139 17,124 56,50 85,65" class="geometry interactive"/>
  <polygon points="85,65 111,16 246,90 221,139" class="geometry interactive"/>
  <circle cx="85" cy="65" r="2.5" class="point"/>
  <circle cx="46" cy="139" r="2.5" class="point"/>
  <circle cx="85" cy="139" r="2.5" class="point"/>
  <circle cx="221" cy="139" r="2.5" class="point"/>
  <circle cx="46" cy="202" r="2.5" class="point"/>
  <circle cx="221" cy="202" r="2.5" class="point"/>
  <circle cx="17" cy="124" r="2.5" class="point"/>
  <circle cx="56" cy="50" r="2.5" class="point"/>
  <circle cx="111" cy="16" r="2.5" class="point"/>
  <circle cx="246" cy="90" r="2.5" class="point"/>
  <text x="82" y="52" class="label">A</text>
  <text x="36" y="143" class="label">B</text>
  <text x="85" y="151" class="label">D</text>
  <text x="231" y="141" class="label">C</text>
</svg>
