<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 184" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="276" height="184" fill="#ffffff"/>
  <polygon points="21,154 105,90 91,154" class="geometry interactive"/>
  <polygon points="91,154 255,25 228,154" class="geometry interactive"/>
  <circle cx="21" cy="154" r="2.5" class="point"/>
  <circle cx="105" cy="90" r="2.5" class="point"/>
  <circle cx="91" cy="154" r="2.5" class="point"/>
  <circle cx="255" cy="25" r="2.5" class="point"/>
  <circle cx="228" cy="154" r="2.5" class="point"/>
  <text x="109" y="78" class="label">A</text>
  <text x="21" y="167" class="label">B</text>
  <text x="91" y="167" class="label">C</text>
  <text x="257" y="13" class="label">D</text>
  <text x="228" y="167" class="label">E</text>
</svg>
