<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 207 168" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="207" height="168" fill="#ffffff"/>
  <polygon points="103,39 41,113 139,113" class="geometry interactive"/>
  <polygon points="139,113 154,29 176,71" class="geometry interactive"/>
  <circle cx="103" cy="39" r="2.5" class="point"/>
  <circle cx="41" cy="113" r="2.5" class="point"/>
  <circle cx="139" cy="113" r="2.5" class="point"/>
  <circle cx="154" cy="29" r="2.5" class="point"/>
  <circle cx="176" cy="71" r="2.5" class="point"/>
  <text x="103" y="27" class="label">A</text>
  <text x="41" y="125" class="label">B</text>
  <text x="139" y="125" class="label">C</text>
  <text x="154" y="17" class="label">E</text>
  <text x="186" y="71" class="label">D</text>
</svg>
