<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 207 168" width="207" height="168" class="euclid-graphic" data-graphic-id="0278.g1" data-folio="0278" data-graphic="g1" data-proposition="VI.32">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Polygons & Segments) -->
  <g id="graphics">
    <polygon id="el-poly-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt; | &lt; B A C &gt; | &lt; B C A &gt; | &lt; C A B &gt; | &lt; C B A &gt;" data-type="polygon" points="103.0,39.0 41.0,113.0 139.0,113.0" class="geom-polygon" />
    <polygon id="el-poly-ECD" data-ref="&lt; E C D &gt;" data-aliases="&lt; E D C &gt; | &lt; C E D &gt; | &lt; C D E &gt; | &lt; D C E &gt; | &lt; D E C &gt;" data-type="polygon" points="154.0,29.0 139.0,113.0 176.0,71.0" class="geom-polygon" />

    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="103.0" y1="39.0" x2="41.0" y2="113.0" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="41.0" y1="113.0" x2="139.0" y2="113.0" class="geom-line" />
    <line id="el-seg-CA" data-ref="/ C A /" data-aliases="/ A C /" data-type="segment" x1="139.0" y1="113.0" x2="103.0" y2="39.0" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="139.0" y1="113.0" x2="176.0" y2="71.0" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="176.0" y1="71.0" x2="154.0" y2="29.0" class="geom-line" />
    <line id="el-seg-CE" data-ref="/ C E /" data-aliases="/ E C /" data-type="segment" x1="139.0" y1="113.0" x2="154.0" y2="29.0" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; A C B &gt; | &lt; B A C &gt; | &lt; B C A &gt; | &lt; C A B &gt; | &lt; C B A &gt;" points="103.0,39.0 41.0,113.0 139.0,113.0" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-ECD" data-ref="&lt; E C D &gt;" data-aliases="&lt; E D C &gt; | &lt; C E D &gt; | &lt; C D E &gt; | &lt; D C E &gt; | &lt; D E C &gt;" points="154.0,29.0 139.0,113.0 176.0,71.0" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="103.0" y1="39.0" x2="41.0" y2="113.0" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="41.0" y1="113.0" x2="139.0" y2="113.0" class="geom-line geom-overlay" />
    <line id="hl-seg-CA" data-ref="/ C A /" data-aliases="/ A C /" x1="139.0" y1="113.0" x2="103.0" y2="39.0" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="139.0" y1="113.0" x2="176.0" y2="71.0" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="176.0" y1="71.0" x2="154.0" y2="29.0" class="geom-line geom-overlay" />
    <line id="hl-seg-CE" data-ref="/ C E /" data-aliases="/ E C /" x1="139.0" y1="113.0" x2="154.0" y2="29.0" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="103.0" cy="39.0" r="3.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="41.0" cy="113.0" r="3.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="139.0" cy="113.0" r="3.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="154.0" cy="29.0" r="3.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="176.0" cy="71.0" r="3.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="103.0" y="27.0" text-anchor="middle" dominant-baseline="central" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="41.0" y="125.0" text-anchor="middle" dominant-baseline="central" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="139.0" y="125.0" text-anchor="middle" dominant-baseline="central" class="geom-label">C</text>
    <text id="lbl-E" data-ref="E" x="154.0" y="17.0" text-anchor="middle" dominant-baseline="central" class="geom-label">E</text>
    <text id="lbl-D" data-ref="D" x="187.0" y="71.0" text-anchor="middle" dominant-baseline="central" class="geom-label">D</text>
  </g>
</svg>
