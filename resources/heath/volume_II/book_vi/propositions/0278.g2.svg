<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 282 149" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="282" height="149" fill="#ffffff"/>
  <polygon points="87,41 18,119 139,119" class="geometry interactive"/>
  <polygon points="229,27 188,76 264,76" class="geometry interactive"/>
  <line x1="56" y1="76" x2="188" y2="76" class="construction interactive"/>
  <circle cx="87" cy="41" r="2.5" class="point"/>
  <circle cx="18" cy="119" r="2.5" class="point"/>
  <circle cx="139" cy="119" r="2.5" class="point"/>
  <circle cx="56" cy="76" r="2.5" class="point"/>
  <circle cx="229" cy="27" r="2.5" class="point"/>
  <circle cx="188" cy="76" r="2.5" class="point"/>
  <circle cx="264" cy="76" r="2.5" class="point"/>
  <text x="87" y="29" class="label">A</text>
  <text x="18" y="131" class="label">B</text>
  <text x="139" y="131" class="label">C</text>
  <text x="45" y="72" class="label">G</text>
  <text x="229" y="15" class="label">D</text>
  <text x="188" y="88" class="label">E</text>
  <text x="264" y="88" class="label">F</text>
</svg>
