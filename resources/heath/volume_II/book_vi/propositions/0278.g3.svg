<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 267 142" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="267" height="142" fill="#ffffff"/>
  <polygon points="22,29 74,54 19,113" class="geometry interactive"/>
  <polygon points="111,29 144,44 109,80" class="geometry interactive"/>
  <line x1="22" y1="29" x2="245" y2="29" class="geometry interactive"/>
  <line x1="74" y1="54" x2="245" y2="29" class="geometry interactive"/>
  <line x1="19" y1="113" x2="245" y2="29" class="geometry interactive"/>
  <circle cx="22" cy="29" r="2.5" class="point"/>
  <circle cx="74" cy="54" r="2.5" class="point"/>
  <circle cx="19" cy="113" r="2.5" class="point"/>
  <circle cx="111" cy="29" r="2.5" class="point"/>
  <circle cx="144" cy="44" r="2.5" class="point"/>
  <circle cx="109" cy="80" r="2.5" class="point"/>
  <circle cx="245" cy="29" r="2.5" class="point"/>
  <text x="22" y="17" class="label">A</text>
  <text x="62" y="57" class="label">B</text>
  <text x="19" y="125" class="label">C</text>
  <text x="111" y="17" class="label">D</text>
  <text x="148" y="33" class="label">E</text>
  <text x="109" y="93" class="label">F</text>
  <text x="249" y="41" class="label">G</text>
</svg>
