<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 237 202" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label-sub { font-family: "Times New Roman", Times, serif; font-size: 11px; font-style: normal; fill: #000000; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="237" height="202" fill="#ffffff"/>
  <polygon points="24,51 85,51 102,102 41,102" class="geometry interactive"/>
  <polygon points="102,102 189,102 213,173 126,173" class="geometry interactive"/>
  <line x1="24" y1="51" x2="213" y2="173" class="geometry interactive"/>
  <circle cx="24" cy="51" r="2.5" class="point"/>
  <circle cx="85" cy="51" r="2.5" class="point"/>
  <circle cx="41" cy="102" r="2.5" class="point"/>
  <circle cx="102" cy="102" r="2.5" class="point"/>
  <circle cx="189" cy="102" r="2.5" class="point"/>
  <circle cx="126" cy="173" r="2.5" class="point"/>
  <circle cx="213" cy="173" r="2.5" class="point"/>
  <text x="17" y="44" class="label">A</text>
  <text x="93" y="47" class="label">F</text>
  <text x="31" y="102" class="label">B</text>
  <text x="108" y="91" class="label">C</text>
  <text x="198" y="97" class="label">G</text>
  <text x="126" y="185" class="label">D</text>
  <text x="216" y="185" class="label">E</text>
</svg>
