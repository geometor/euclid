<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 173" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="135" height="173" fill="#ffffff"/>
  <line x1="24" y1="21" x2="24" y2="152" class="geometry interactive"/>
  <circle cx="24" cy="21" r="2.5" class="point"/>
  <circle cx="24" cy="152" r="2.5" class="point"/>
  <circle cx="24" cy="21" r="2.5" class="point"/>
  <text x="24" y="9" class="label">A</text>
  <circle cx="24" cy="31" r="2.5" class="point"/>
  <text x="35" y="31" class="label">H</text>
  <circle cx="24" cy="48" r="2.5" class="point"/>
  <text x="13" y="48" class="label">F</text>
  <circle cx="24" cy="152" r="2.5" class="point"/>
  <text x="24" y="165" class="label">B</text>
  <line x1="63" y1="48" x2="63" y2="152" class="geometry interactive"/>
  <circle cx="63" cy="48" r="2.5" class="point"/>
  <circle cx="63" cy="152" r="2.5" class="point"/>
  <circle cx="63" cy="48" r="2.5" class="point"/>
  <text x="63" y="36" class="label">C</text>
  <circle cx="63" cy="60" r="2.5" class="point"/>
  <text x="74" y="60" class="label">G</text>
  <circle cx="63" cy="152" r="2.5" class="point"/>
  <text x="63" y="165" class="label">D</text>
  <line x1="101" y1="123" x2="101" y2="151" class="geometry interactive"/>
  <circle cx="101" cy="123" r="2.5" class="point"/>
  <circle cx="101" cy="151" r="2.5" class="point"/>
  <text x="112" y="137" class="label">E</text>
</svg>
