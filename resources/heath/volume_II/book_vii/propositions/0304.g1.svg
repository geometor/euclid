<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 125 154" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="125" height="154" fill="#ffffff"/>
  <line x1="23" y1="10" x2="23" y2="129" class="geometry interactive"/>
  <circle cx="23" cy="10" r="2.5" class="point"/>
  <circle cx="23" cy="129" r="2.5" class="point"/>
  <circle cx="23" cy="15" r="2.5" class="point"/>
  <text x="12" y="15" class="label">A</text>
  <circle cx="23" cy="43" r="2.5" class="point"/>
  <text x="12" y="43" class="label">E</text>
  <circle cx="23" cy="129" r="2.5" class="point"/>
  <text x="23" y="142" class="label">B</text>
  <line x1="59" y1="43" x2="59" y2="129" class="geometry interactive"/>
  <circle cx="59" cy="43" r="2.5" class="point"/>
  <circle cx="59" cy="129" r="2.5" class="point"/>
  <circle cx="59" cy="31" r="2.5" class="point"/>
  <text x="59" y="19" class="label">C</text>
  <circle cx="59" cy="60" r="2.5" class="point"/>
  <text x="70" y="60" class="label">F</text>
  <circle cx="59" cy="129" r="2.5" class="point"/>
  <text x="59" y="142" class="label">D</text>
  <line x1="93" y1="73" x2="93" y2="107" class="geometry interactive"/>
  <circle cx="93" cy="73" r="2.5" class="point"/>
  <circle cx="93" cy="107" r="2.5" class="point"/>
  <text x="104" y="90" class="label">G</text>
</svg>
