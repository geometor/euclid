<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 205 145" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="205" height="145" fill="#ffffff"/>
  <line x1="29" y1="12" x2="29" y2="124" class="geometry interactive"/>
  <circle cx="29" cy="12" r="2.5" class="point"/>
  <circle cx="29" cy="124" r="2.5" class="point"/>
  <text x="18" y="68" class="label">A</text>
  <line x1="63" y1="41" x2="63" y2="126" class="geometry interactive"/>
  <circle cx="63" cy="41" r="2.5" class="point"/>
  <circle cx="63" cy="126" r="2.5" class="point"/>
  <text x="52" y="83" class="label">B</text>
  <line x1="89" y1="75" x2="89" y2="124" class="geometry interactive"/>
  <circle cx="89" cy="75" r="2.5" class="point"/>
  <circle cx="89" cy="124" r="2.5" class="point"/>
  <text x="78" y="99" class="label">C</text>
  <line x1="129" y1="95" x2="129" y2="125" class="geometry interactive"/>
  <circle cx="129" cy="95" r="2.5" class="point"/>
  <circle cx="129" cy="125" r="2.5" class="point"/>
  <text x="118" y="110" class="label">D</text>
  <line x1="159" y1="98" x2="159" y2="124" class="geometry interactive"/>
  <circle cx="159" cy="98" r="2.5" class="point"/>
  <circle cx="159" cy="124" r="2.5" class="point"/>
  <text x="148" y="111" class="label">E</text>
  <line x1="183" y1="97" x2="183" y2="121" class="geometry interactive"/>
  <circle cx="183" cy="97" r="2.5" class="point"/>
  <circle cx="183" cy="121" r="2.5" class="point"/>
  <text x="172" y="109" class="label">F</text>
</svg>
