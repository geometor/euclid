<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 115 176" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="115" height="176" fill="#ffffff"/>
  <line x1="22" y1="10" x2="22" y2="159" class="geometry interactive"/>
  <circle cx="22" cy="10" r="2.5" class="point"/>
  <circle cx="22" cy="159" r="2.5" class="point"/>
  <text x="11" y="84" class="label">A</text>
  <line x1="54" y1="69" x2="54" y2="159" class="geometry interactive"/>
  <circle cx="54" cy="69" r="2.5" class="point"/>
  <circle cx="54" cy="159" r="2.5" class="point"/>
  <circle cx="54" cy="69" r="2.5" class="point"/>
  <text x="43" y="69" class="label">B</text>
  <circle cx="54" cy="98" r="2.5" class="point"/>
  <text x="43" y="98" class="label">E</text>
  <circle cx="54" cy="129" r="2.5" class="point"/>
  <text x="43" y="129" class="label">F</text>
  <circle cx="54" cy="159" r="2.5" class="point"/>
  <text x="43" y="159" class="label">C</text>
  <line x1="83" y1="129" x2="83" y2="158" class="geometry interactive"/>
  <circle cx="83" cy="129" r="2.5" class="point"/>
  <circle cx="83" cy="158" r="2.5" class="point"/>
  <text x="94" y="143" class="label">D</text>
</svg>
