<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 130" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="140" height="130" fill="#ffffff"/>
  <line x1="25" y1="54" x2="25" y2="102" class="geometry interactive"/>
  <circle cx="25" cy="54" r="2.5" class="point"/>
  <circle cx="25" cy="102" r="2.5" class="point"/>
  <text x="14" y="78" class="label">A</text>
  <line x1="49" y1="12" x2="49" y2="109" class="geometry interactive"/>
  <circle cx="49" cy="12" r="2.5" class="point"/>
  <circle cx="49" cy="109" r="2.5" class="point"/>
  <circle cx="49" cy="12" r="2.5" class="point"/>
  <text x="38" y="12" class="label">B</text>
  <circle cx="49" cy="60" r="2.5" class="point"/>
  <text x="60" y="60" class="label">G</text>
  <circle cx="49" cy="109" r="2.5" class="point"/>
  <text x="49" y="122" class="label">C</text>
  <line x1="88" y1="62" x2="88" y2="97" class="geometry interactive"/>
  <circle cx="88" cy="62" r="2.5" class="point"/>
  <circle cx="88" cy="97" r="2.5" class="point"/>
  <text x="99" y="79" class="label">D</text>
  <line x1="116" y1="36" x2="116" y2="107" class="geometry interactive"/>
  <circle cx="116" cy="36" r="2.5" class="point"/>
  <circle cx="116" cy="107" r="2.5" class="point"/>
  <circle cx="116" cy="24" r="2.5" class="point"/>
  <text x="116" y="12" class="label">E</text>
  <circle cx="116" cy="72" r="2.5" class="point"/>
  <text x="127" y="72" class="label">H</text>
  <circle cx="116" cy="107" r="2.5" class="point"/>
  <text x="116" y="120" class="label">F</text>
</svg>
