<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 138" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="150" height="138" fill="#ffffff"/>
  <line x1="12" y1="47" x2="12" y2="120" class="geometry interactive"/>
  <circle cx="12" cy="47" r="2.5" class="point"/>
  <circle cx="12" cy="120" r="2.5" class="point"/>
  <circle cx="12" cy="47" r="2.5" class="point"/>
  <text x="23" y="47" class="label">A</text>
  <circle cx="12" cy="83" r="2.5" class="point"/>
  <text x="23" y="83" class="label">G</text>
  <circle cx="12" cy="120" r="2.5" class="point"/>
  <text x="23" y="120" class="label">B</text>
  <line x1="42" y1="10" x2="42" y2="120" class="geometry interactive"/>
  <circle cx="42" cy="10" r="2.5" class="point"/>
  <circle cx="42" cy="120" r="2.5" class="point"/>
  <text x="53" y="65" class="label">C</text>
  <line x1="98" y1="64" x2="98" y2="119" class="geometry interactive"/>
  <circle cx="98" cy="64" r="2.5" class="point"/>
  <circle cx="98" cy="119" r="2.5" class="point"/>
  <circle cx="98" cy="64" r="2.5" class="point"/>
  <text x="109" y="64" class="label">D</text>
  <circle cx="98" cy="92" r="2.5" class="point"/>
  <text x="109" y="92" class="label">H</text>
  <circle cx="98" cy="119" r="2.5" class="point"/>
  <text x="109" y="119" class="label">E</text>
  <line x1="129" y1="32" x2="129" y2="120" class="geometry interactive"/>
  <circle cx="129" cy="32" r="2.5" class="point"/>
  <circle cx="129" cy="120" r="2.5" class="point"/>
  <text x="140" y="76" class="label">F</text>
</svg>
