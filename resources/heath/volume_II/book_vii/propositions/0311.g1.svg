    <polyline id="hl-sec-DHE" data-ref="/ D H E /" data-aliases="/ E H D /; } D H E {; } E H D {" points="98.00,64.00 98.00,91.50 98.00,119.00" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
