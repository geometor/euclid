    <line id="el-line-DE" data-ref="[ D E ]" data-aliases="[ E D ]" data-type="line" x1="98.00" y1="64.00" x2="98.00" y2="119.00" class="geom-line" />
    <!-- Tick marks at G and H -->
    <line x1="8.50" y1="83.50" x2="15.50" y2="83.50" class="geom-line" />
    <line x1="94.50" y1="91.50" x2="101.50" y2="91.50" class="geom-line" />
  </g>

