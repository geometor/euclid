    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="12.00" y1="47.00" x2="12.00" y2="120.00" class="geom-line" />
    <line id="el-seg-AG" data-ref="/ A G /" data-aliases="/ G A /" data-type="segment" x1="12.00" y1="47.00" x2="12.00" y2="83.50" class="geom-line geom-overlay" />
    <line id="el-seg-GB" data-ref="/ G B /" data-aliases="/ B G /" data-type="segment" x1="12.00" y1="83.50" x2="12.00" y2="120.00" class="geom-line geom-overlay" />
