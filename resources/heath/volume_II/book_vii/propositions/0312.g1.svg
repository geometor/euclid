<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 406 65" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="406" height="65" fill="#ffffff"/>
  <line x1="17" y1="24" x2="130" y2="24" class="geometry interactive"/>
  <circle cx="17" cy="24" r="2.5" class="point"/>
  <circle cx="130" cy="24" r="2.5" class="point"/>
  <circle cx="17" cy="24" r="2.5" class="point"/>
  <text x="17" y="12" class="label">A</text>
  <circle cx="56" cy="24" r="2.5" class="point"/>
  <text x="56" y="12" class="label">E</text>
  <circle cx="130" cy="24" r="2.5" class="point"/>
  <text x="130" y="12" class="label">B</text>
  <line x1="11" y1="53" x2="395" y2="53" class="geometry interactive"/>
  <circle cx="11" cy="53" r="2.5" class="point"/>
  <circle cx="395" cy="53" r="2.5" class="point"/>
  <circle cx="11" cy="53" r="2.5" class="point"/>
  <text x="11" y="41" class="label">G</text>
  <circle cx="166" cy="53" r="2.5" class="point"/>
  <text x="166" y="41" class="label">C</text>
  <circle cx="240" cy="53" r="2.5" class="point"/>
  <text x="240" y="41" class="label">F</text>
  <circle cx="395" cy="53" r="2.5" class="point"/>
  <text x="395" y="41" class="label">D</text>
</svg>
