<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 105" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="244" height="105" fill="#ffffff"/>
  <line x1="13" y1="24" x2="231" y2="24" class="geometry interactive"/>
  <circle cx="13" cy="24" r="2.5" class="point"/>
  <circle cx="231" cy="24" r="2.5" class="point"/>
  <circle cx="13" cy="24" r="2.5" class="point"/>
  <text x="13" y="12" class="label">C</text>
  <circle cx="157" cy="24" r="2.5" class="point"/>
  <text x="157" y="12" class="label">F</text>
  <circle cx="231" cy="24" r="2.5" class="point"/>
  <text x="231" y="12" class="label">D</text>
  <line x1="13" y1="55" x2="164" y2="55" class="geometry interactive"/>
  <circle cx="13" cy="55" r="2.5" class="point"/>
  <circle cx="164" cy="55" r="2.5" class="point"/>
  <circle cx="13" cy="55" r="2.5" class="point"/>
  <text x="13" y="43" class="label">G</text>
  <circle cx="65" cy="55" r="2.5" class="point"/>
  <text x="65" y="43" class="label">M</text>
  <circle cx="87" cy="55" r="2.5" class="point"/>
  <text x="87" y="43" class="label">K</text>
  <circle cx="140" cy="55" r="2.5" class="point"/>
  <text x="140" y="43" class="label">N</text>
  <circle cx="164" cy="55" r="2.5" class="point"/>
  <text x="164" y="43" class="label">H</text>
  <line x1="12" y1="81" x2="162" y2="81" class="geometry interactive"/>
  <circle cx="12" cy="81" r="2.5" class="point"/>
  <circle cx="162" cy="81" r="2.5" class="point"/>
  <circle cx="12" cy="81" r="2.5" class="point"/>
  <text x="12" y="94" class="label">A</text>
  <circle cx="63" cy="81" r="2.5" class="point"/>
  <text x="63" y="94" class="label">L</text>
  <circle cx="115" cy="81" r="2.5" class="point"/>
  <text x="115" y="94" class="label">E</text>
  <circle cx="162" cy="81" r="2.5" class="point"/>
  <text x="162" y="94" class="label">B</text>
</svg>
