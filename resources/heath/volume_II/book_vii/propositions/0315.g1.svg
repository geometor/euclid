<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 109" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="132" height="109" fill="#ffffff"/>
  <line x1="28" y1="60" x2="28" y2="97" class="geometry interactive"/>
  <circle cx="28" cy="60" r="2.5" class="point"/>
  <circle cx="28" cy="97" r="2.5" class="point"/>
  <text x="17" y="78" class="label">A</text>
  <line x1="54" y1="30" x2="54" y2="95" class="geometry interactive"/>
  <circle cx="54" cy="30" r="2.5" class="point"/>
  <circle cx="54" cy="95" r="2.5" class="point"/>
  <circle cx="54" cy="30" r="2.5" class="point"/>
  <text x="43" y="30" class="label">B</text>
  <circle cx="54" cy="62" r="2.5" class="point"/>
  <text x="43" y="62" class="label">G</text>
  <circle cx="54" cy="95" r="2.5" class="point"/>
  <text x="43" y="95" class="label">C</text>
  <line x1="82" y1="52" x2="82" y2="93" class="geometry interactive"/>
  <circle cx="82" cy="52" r="2.5" class="point"/>
  <circle cx="82" cy="93" r="2.5" class="point"/>
  <text x="93" y="72" class="label">D</text>
  <line x1="106" y1="13" x2="106" y2="94" class="geometry interactive"/>
  <circle cx="106" cy="13" r="2.5" class="point"/>
  <circle cx="106" cy="94" r="2.5" class="point"/>
  <circle cx="106" cy="13" r="2.5" class="point"/>
  <text x="117" y="13" class="label">E</text>
  <circle cx="106" cy="53" r="2.5" class="point"/>
  <text x="117" y="53" class="label">H</text>
  <circle cx="106" cy="94" r="2.5" class="point"/>
  <text x="117" y="94" class="label">F</text>
</svg>
