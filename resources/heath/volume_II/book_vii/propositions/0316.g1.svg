<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 142 153" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="142" height="153" fill="#ffffff"/>
  <line x1="24" y1="63" x2="24" y2="140" class="geometry interactive"/>
  <circle cx="24" cy="63" r="2.5" class="point"/>
  <circle cx="24" cy="140" r="2.5" class="point"/>
  <circle cx="24" cy="63" r="2.5" class="point"/>
  <text x="13" y="63" class="label">A</text>
  <circle cx="24" cy="101" r="2.5" class="point"/>
  <text x="13" y="101" class="label">G</text>
  <circle cx="24" cy="140" r="2.5" class="point"/>
  <text x="13" y="140" class="label">B</text>
  <line x1="52" y1="27" x2="52" y2="136" class="geometry interactive"/>
  <circle cx="52" cy="27" r="2.5" class="point"/>
  <circle cx="52" cy="136" r="2.5" class="point"/>
  <text x="41" y="81" class="label">C</text>
  <line x1="91" y1="55" x2="91" y2="140" class="geometry interactive"/>
  <circle cx="91" cy="55" r="2.5" class="point"/>
  <circle cx="91" cy="140" r="2.5" class="point"/>
  <circle cx="91" cy="55" r="2.5" class="point"/>
  <text x="102" y="55" class="label">D</text>
  <circle cx="91" cy="97" r="2.5" class="point"/>
  <text x="102" y="97" class="label">H</text>
  <circle cx="91" cy="140" r="2.5" class="point"/>
  <text x="102" y="140" class="label">E</text>
  <line x1="120" y1="11" x2="120" y2="141" class="geometry interactive"/>
  <circle cx="120" cy="11" r="2.5" class="point"/>
  <circle cx="120" cy="141" r="2.5" class="point"/>
  <text x="131" y="76" class="label">F</text>
</svg>
