<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 67 127" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="67" height="127" fill="#ffffff"/>
  <line x1="24" y1="13" x2="24" y2="111" class="geometry interactive"/>
  <circle cx="24" cy="13" r="2.5" class="point"/>
  <circle cx="24" cy="111" r="2.5" class="point"/>
  <circle cx="24" cy="13" r="2.5" class="point"/>
  <text x="13" y="13" class="label">A</text>
  <circle cx="24" cy="50" r="2.5" class="point"/>
  <text x="13" y="50" class="label">E</text>
  <circle cx="24" cy="111" r="2.5" class="point"/>
  <text x="13" y="111" class="label">B</text>
  <line x1="54" y1="26" x2="54" y2="112" class="geometry interactive"/>
  <circle cx="54" cy="26" r="2.5" class="point"/>
  <circle cx="54" cy="112" r="2.5" class="point"/>
  <circle cx="54" cy="26" r="2.5" class="point"/>
  <text x="43" y="26" class="label">C</text>
  <circle cx="54" cy="57" r="2.5" class="point"/>
  <text x="43" y="57" class="label">F</text>
  <circle cx="54" cy="112" r="2.5" class="point"/>
  <text x="43" y="112" class="label">D</text>
</svg>
