<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 67 127" width="67" height="127" class="euclid-graphic" data-graphic-id="0317.g1" data-folio="0317" data-graphic="g1" data-proposition="VII.11">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-AB" data-ref="[ A B ]" data-aliases="[ B A ]" data-type="line" x1="24.00" y1="13.00" x2="24.00" y2="111.00" class="geom-line" />
    <line id="el-line-CD" data-ref="[ C D ]" data-aliases="[ D C ]" data-type="line" x1="54.00" y1="26.00" x2="54.00" y2="112.00" class="geom-line" />
    <!-- Tick marks at E and F -->
    <line x1="20.50" y1="50.00" x2="27.50" y2="50.00" class="geom-line" />
    <line x1="50.50" y1="57.00" x2="57.50" y2="57.00" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Segments & Sub-segments) -->
  <g id="graphics">
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="24.00" y1="13.00" x2="24.00" y2="111.00" class="geom-line" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="24.00" y1="13.00" x2="24.00" y2="50.00" class="geom-line geom-overlay" />
    <line id="el-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" data-type="segment" x1="24.00" y1="50.00" x2="24.00" y2="111.00" class="geom-line geom-overlay" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="54.00" y1="26.00" x2="54.00" y2="112.00" class="geom-line" />
    <line id="el-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" data-type="segment" x1="54.00" y1="26.00" x2="54.00" y2="57.00" class="geom-line geom-overlay" />
    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" data-type="segment" x1="54.00" y1="57.00" x2="54.00" y2="112.00" class="geom-line geom-overlay" />
    <polyline id="el-sec-AEB" data-ref="/ A E B /" data-aliases="/ B E A / | } A E B { | } B E A {" data-type="section" points="24.00,13.00 24.00,50.00 24.00,111.00" fill="none" class="geom-line geom-overlay" />
    <polyline id="el-sec-CFD" data-ref="/ C F D /" data-aliases="/ D F C / | } C F D { | } D F C {" data-type="section" points="54.00,26.00 54.00,57.00 54.00,112.00" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="24.00" y1="13.00" x2="24.00" y2="111.00" class="geom-line geom-overlay" />
    <line id="hl-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" x1="24.00" y1="13.00" x2="24.00" y2="50.00" class="geom-line geom-overlay" />
    <line id="hl-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" x1="24.00" y1="50.00" x2="24.00" y2="111.00" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="54.00" y1="26.00" x2="54.00" y2="112.00" class="geom-line geom-overlay" />
    <line id="hl-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" x1="54.00" y1="26.00" x2="54.00" y2="57.00" class="geom-line geom-overlay" />
    <line id="hl-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" x1="54.00" y1="57.00" x2="54.00" y2="112.00" class="geom-line geom-overlay" />
    <polyline id="hl-sec-AEB" data-ref="/ A E B /" data-aliases="/ B E A / | } A E B { | } B E A {" points="24.00,13.00 24.00,50.00 24.00,111.00" fill="none" class="geom-line geom-overlay" />
    <polyline id="hl-sec-CFD" data-ref="/ C F D /" data-aliases="/ D F C / | } C F D { | } D F C {" points="54.00,26.00 54.00,57.00 54.00,112.00" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="24.00" cy="13.00" r="2.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="24.00" cy="50.00" r="2.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="24.00" cy="111.00" r="2.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="54.00" cy="26.00" r="2.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="54.00" cy="57.00" r="2.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="54.00" cy="112.00" r="2.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="13.00" y="13.00" class="geom-label">A</text>
    <text id="lbl-E" data-ref="E" x="13.00" y="50.00" class="geom-label">E</text>
    <text id="lbl-B" data-ref="B" x="13.00" y="111.00" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="43.00" y="26.00" class="geom-label">C</text>
    <text id="lbl-F" data-ref="F" x="43.00" y="57.00" class="geom-label">F</text>
    <text id="lbl-D" data-ref="D" x="43.00" y="112.00" class="geom-label">D</text>
  </g>
</svg>
