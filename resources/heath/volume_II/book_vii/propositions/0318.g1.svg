<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 85" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="118" height="85" fill="#ffffff"/>
  <line x1="26" y1="36" x2="26" y2="69" class="geometry interactive"/>
  <circle cx="26" cy="36" r="2.5" class="point"/>
  <circle cx="26" cy="69" r="2.5" class="point"/>
  <text x="15" y="52" class="label">A</text>
  <line x1="50" y1="34" x2="50" y2="69" class="geometry interactive"/>
  <circle cx="50" cy="34" r="2.5" class="point"/>
  <circle cx="50" cy="69" r="2.5" class="point"/>
  <text x="39" y="51" class="label">B</text>
  <line x1="72" y1="14" x2="72" y2="72" class="geometry interactive"/>
  <circle cx="72" cy="14" r="2.5" class="point"/>
  <circle cx="72" cy="72" r="2.5" class="point"/>
  <text x="61" y="43" class="label">C</text>
  <line x1="102" y1="10" x2="102" y2="73" class="geometry interactive"/>
  <circle cx="102" cy="10" r="2.5" class="point"/>
  <circle cx="102" cy="73" r="2.5" class="point"/>
  <text x="91" y="41" class="label">D</text>
</svg>
