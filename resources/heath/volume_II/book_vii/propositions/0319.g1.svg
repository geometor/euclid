<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 125" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="130" height="125" fill="#ffffff"/>
  <line x1="24" y1="13" x2="24" y2="108" class="geometry interactive"/>
  <circle cx="24" cy="13" r="2.5" class="point"/>
  <circle cx="24" cy="108" r="2.5" class="point"/>
  <circle cx="24" cy="16" r="2.5" class="point"/>
  <text x="13" y="16" class="label">A</text>
  <line x1="54" y1="14" x2="54" y2="73" class="geometry interactive"/>
  <circle cx="54" cy="14" r="2.5" class="point"/>
  <circle cx="54" cy="73" r="2.5" class="point"/>
  <circle cx="54" cy="73" r="2.5" class="point"/>
  <text x="54" y="86" class="label">B</text>
  <line x1="80" y1="13" x2="80" y2="86" class="geometry interactive"/>
  <circle cx="80" cy="13" r="2.5" class="point"/>
  <circle cx="80" cy="86" r="2.5" class="point"/>
  <circle cx="80" cy="86" r="2.5" class="point"/>
  <text x="80" y="99" class="label">C</text>
  <line x1="112" y1="58" x2="112" y2="104" class="geometry interactive"/>
  <circle cx="112" cy="58" r="2.5" class="point"/>
  <circle cx="112" cy="104" r="2.5" class="point"/>
  <circle cx="112" cy="45" r="2.5" class="point"/>
  <text x="112" y="33" class="label">D</text>
</svg>
