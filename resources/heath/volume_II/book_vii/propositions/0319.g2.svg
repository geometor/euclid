    <line id="hl-mag-E" data-ref="E" data-aliases="/ E /" x1="182.00" y1="60.00" x2="296.00" y2="60.00" class="geom-line geom-overlay" />
    <line id="hl-mag-F" data-ref="F" data-aliases="/ F /" x1="183.00" y1="89.00" x2="274.00" y2="89.00" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
