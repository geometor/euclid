<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 329 110" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="329" height="110" fill="#ffffff"/>
  <line x1="8" y1="42" x2="132" y2="42" class="geometry interactive"/>
  <circle cx="8" cy="42" r="2.5" class="point"/>
  <circle cx="132" cy="42" r="2.5" class="point"/>
  <text x="70" y="55" class="label">A</text>
  <line x1="12" y1="66" x2="107" y2="66" class="geometry interactive"/>
  <circle cx="12" cy="66" r="2.5" class="point"/>
  <circle cx="107" cy="66" r="2.5" class="point"/>
  <text x="59" y="79" class="label">B</text>
  <line x1="12" y1="89" x2="90" y2="89" class="geometry interactive"/>
  <circle cx="12" cy="89" r="2.5" class="point"/>
  <circle cx="90" cy="89" r="2.5" class="point"/>
  <text x="51" y="102" class="label">C</text>
  <line x1="181" y1="37" x2="322" y2="37" class="geometry interactive"/>
  <circle cx="181" cy="37" r="2.5" class="point"/>
  <circle cx="322" cy="37" r="2.5" class="point"/>
  <text x="251" y="50" class="label">D</text>
  <line x1="182" y1="60" x2="296" y2="60" class="geometry interactive"/>
  <circle cx="182" cy="60" r="2.5" class="point"/>
  <circle cx="296" cy="60" r="2.5" class="point"/>
  <text x="239" y="73" class="label">E</text>
  <line x1="183" y1="89" x2="274" y2="89" class="geometry interactive"/>
  <circle cx="183" cy="89" r="2.5" class="point"/>
  <circle cx="274" cy="89" r="2.5" class="point"/>
  <text x="228" y="102" class="label">F</text>
</svg>
