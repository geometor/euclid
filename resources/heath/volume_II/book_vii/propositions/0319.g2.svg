    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="12.00" y1="66.00" x2="107.00" y2="66.00" class="geom-line" />
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="12.00" y1="89.00" x2="90.00" y2="89.00" class="geom-line" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="181.00" y1="37.00" x2="322.00" y2="37.00" class="geom-line" />
    <line id="el-mag-E" data-ref="E" data-aliases="/ E /" data-type="segment" x1="182.00" y1="60.00" x2="296.00" y2="60.00" class="geom-line" />
    <line id="el-mag-F" data-ref="F" data-aliases="/ F /" data-type="segment" x1="183.00" y1="89.00" x2="274.00" y2="89.00" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
