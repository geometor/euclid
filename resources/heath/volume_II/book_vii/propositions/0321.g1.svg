<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 275 100" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="275" height="100" fill="#ffffff"/>
  <line x1="24" y1="21" x2="62" y2="21" class="geometry interactive"/>
  <circle cx="24" cy="21" r="2.5" class="point"/>
  <circle cx="62" cy="21" r="2.5" class="point"/>
  <text x="43" y="10" class="label">A</text>
  <line x1="109" y1="23" x2="232" y2="23" class="geometry interactive"/>
  <circle cx="109" cy="23" r="2.5" class="point"/>
  <circle cx="232" cy="23" r="2.5" class="point"/>
  <circle cx="109" cy="23" r="2.5" class="point"/>
  <text x="109" y="11" class="label">B</text>
  <circle cx="150" cy="23" r="2.5" class="point"/>
  <text x="150" y="11" class="label">G</text>
  <circle cx="191" cy="23" r="2.5" class="point"/>
  <text x="191" y="11" class="label">H</text>
  <circle cx="232" cy="23" r="2.5" class="point"/>
  <text x="232" y="11" class="label">C</text>
  <line x1="99" y1="49" x2="177" y2="49" class="geometry interactive"/>
  <circle cx="99" cy="49" r="2.5" class="point"/>
  <circle cx="177" cy="49" r="2.5" class="point"/>
  <text x="138" y="38" class="label">D</text>
  <line x1="14" y1="75" x2="260" y2="75" class="geometry interactive"/>
  <circle cx="14" cy="75" r="2.5" class="point"/>
  <circle cx="260" cy="75" r="2.5" class="point"/>
  <circle cx="14" cy="75" r="2.5" class="point"/>
  <text x="14" y="63" class="label">E</text>
  <circle cx="96" cy="75" r="2.5" class="point"/>
  <text x="96" y="63" class="label">K</text>
  <circle cx="178" cy="75" r="2.5" class="point"/>
  <text x="178" y="63" class="label">L</text>
  <circle cx="260" cy="75" r="2.5" class="point"/>
  <text x="260" y="63" class="label">F</text>
</svg>
