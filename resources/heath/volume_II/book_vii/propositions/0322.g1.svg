<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295 128" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="295" height="128" fill="#ffffff"/>
  <line x1="22" y1="16" x2="105" y2="16" class="geometry interactive"/>
  <circle cx="22" cy="16" r="2.5" class="point"/>
  <circle cx="105" cy="16" r="2.5" class="point"/>
  <text x="116" y="16" class="label">A</text>
  <line x1="23" y1="39" x2="134" y2="39" class="geometry interactive"/>
  <circle cx="23" cy="39" r="2.5" class="point"/>
  <circle cx="134" cy="39" r="2.5" class="point"/>
  <text x="145" y="39" class="label">B</text>
  <line x1="22" y1="63" x2="256" y2="63" class="geometry interactive"/>
  <circle cx="22" cy="63" r="2.5" class="point"/>
  <circle cx="256" cy="63" r="2.5" class="point"/>
  <text x="11" y="63" class="label">C</text>
  <line x1="21" y1="85" x2="278" y2="85" class="geometry interactive"/>
  <circle cx="21" cy="85" r="2.5" class="point"/>
  <circle cx="278" cy="85" r="2.5" class="point"/>
  <text x="10" y="85" class="label">D</text>
  <line x1="23" y1="111" x2="51" y2="111" class="geometry interactive"/>
  <circle cx="23" cy="111" r="2.5" class="point"/>
  <circle cx="51" cy="111" r="2.5" class="point"/>
  <text x="62" y="111" class="label">E</text>
</svg>
