<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 105" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="395" height="105" fill="#ffffff"/>
  <line x1="48" y1="16" x2="123" y2="16" class="geometry interactive"/>
  <circle cx="48" cy="16" r="2.5" class="point"/>
  <circle cx="123" cy="16" r="2.5" class="point"/>
  <text x="134" y="16" class="label">A</text>
  <line x1="30" y1="39" x2="133" y2="39" class="geometry interactive"/>
  <circle cx="30" cy="39" r="2.5" class="point"/>
  <circle cx="133" cy="39" r="2.5" class="point"/>
  <text x="19" y="39" class="label">B</text>
  <line x1="201" y1="39" x2="328" y2="39" class="geometry interactive"/>
  <circle cx="201" cy="39" r="2.5" class="point"/>
  <circle cx="328" cy="39" r="2.5" class="point"/>
  <text x="190" y="39" class="label">C</text>
  <line x1="19" y1="65" x2="158" y2="65" class="geometry interactive"/>
  <circle cx="19" cy="65" r="2.5" class="point"/>
  <circle cx="158" cy="65" r="2.5" class="point"/>
  <text x="88" y="54" class="label">D</text>
  <line x1="196" y1="65" x2="374" y2="65" class="geometry interactive"/>
  <circle cx="196" cy="65" r="2.5" class="point"/>
  <circle cx="374" cy="65" r="2.5" class="point"/>
  <text x="285" y="54" class="label">E</text>
  <line x1="54" y1="90" x2="79" y2="90" class="geometry interactive"/>
  <circle cx="54" cy="90" r="2.5" class="point"/>
  <circle cx="79" cy="90" r="2.5" class="point"/>
  <text x="90" y="90" class="label">F</text>
</svg>
