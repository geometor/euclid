<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="260" height="100" fill="#ffffff"/>
  <line x1="23" y1="14" x2="58" y2="14" class="geometry interactive"/>
  <circle cx="23" cy="14" r="2.5" class="point"/>
  <circle cx="58" cy="14" r="2.5" class="point"/>
  <text x="40" y="27" class="label">C</text>
  <line x1="101" y1="14" x2="181" y2="14" class="geometry interactive"/>
  <circle cx="101" cy="14" r="2.5" class="point"/>
  <circle cx="181" cy="14" r="2.5" class="point"/>
  <text x="90" y="14" class="label">A</text>
  <line x1="102" y1="35" x2="217" y2="35" class="geometry interactive"/>
  <circle cx="102" cy="35" r="2.5" class="point"/>
  <circle cx="217" cy="35" r="2.5" class="point"/>
  <text x="91" y="35" class="label">B</text>
  <line x1="102" y1="55" x2="197" y2="55" class="geometry interactive"/>
  <circle cx="102" cy="55" r="2.5" class="point"/>
  <circle cx="197" cy="55" r="2.5" class="point"/>
  <text x="91" y="55" class="label">D</text>
  <line x1="102" y1="80" x2="245" y2="80" class="geometry interactive"/>
  <circle cx="102" cy="80" r="2.5" class="point"/>
  <circle cx="245" cy="80" r="2.5" class="point"/>
  <text x="91" y="80" class="label">E</text>
</svg>
