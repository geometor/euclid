<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100" width="260" height="100" class="euclid-graphic" data-graphic-id="0324.g1" data-folio="0324" data-graphic="g1" data-proposition="VII.18">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Number Segments) -->
  <g id="graphics">
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="23.00" y1="14.00" x2="58.00" y2="14.00" class="geom-line" />
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="101.00" y1="14.00" x2="181.00" y2="14.00" class="geom-line" />
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="102.00" y1="35.00" x2="217.00" y2="35.00" class="geom-line" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="102.00" y1="55.00" x2="197.00" y2="55.00" class="geom-line" />
    <line id="el-mag-E" data-ref="E" data-aliases="/ E /" data-type="segment" x1="102.00" y1="80.00" x2="245.00" y2="80.00" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /" x1="23.00" y1="14.00" x2="58.00" y2="14.00" class="geom-line geom-overlay" />
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /" x1="101.00" y1="14.00" x2="181.00" y2="14.00" class="geom-line geom-overlay" />
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /" x1="102.00" y1="35.00" x2="217.00" y2="35.00" class="geom-line geom-overlay" />
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="102.00" y1="55.00" x2="197.00" y2="55.00" class="geom-line geom-overlay" />
    <line id="hl-mag-E" data-ref="E" data-aliases="/ E /" x1="102.00" y1="80.00" x2="245.00" y2="80.00" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-C" data-ref="C" x="40.00" y="27.00" class="geom-label">C</text>
    <text id="lbl-A" data-ref="A" x="90.00" y="14.00" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="91.00" y="35.00" class="geom-label">B</text>
    <text id="lbl-D" data-ref="D" x="91.00" y="55.00" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="91.00" y="80.00" class="geom-label">E</text>
  </g>
</svg>
