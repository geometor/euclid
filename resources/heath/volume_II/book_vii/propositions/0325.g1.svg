<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 194 247" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="194" height="247" fill="#ffffff"/>
  <line x1="22" y1="33" x2="22" y2="155" class="geometry interactive"/>
  <circle cx="22" cy="33" r="2.5" class="point"/>
  <circle cx="22" cy="155" r="2.5" class="point"/>
  <text x="11" y="94" class="label">A</text>
  <line x1="46" y1="35" x2="46" y2="113" class="geometry interactive"/>
  <circle cx="46" cy="35" r="2.5" class="point"/>
  <circle cx="46" cy="113" r="2.5" class="point"/>
  <text x="35" y="74" class="label">B</text>
  <line x1="70" y1="34" x2="70" y2="127" class="geometry interactive"/>
  <circle cx="70" cy="34" r="2.5" class="point"/>
  <circle cx="70" cy="127" r="2.5" class="point"/>
  <text x="59" y="80" class="label">C</text>
  <line x1="96" y1="35" x2="96" y2="98" class="geometry interactive"/>
  <circle cx="96" cy="35" r="2.5" class="point"/>
  <circle cx="96" cy="98" r="2.5" class="point"/>
  <text x="85" y="66" class="label">D</text>
  <line x1="126" y1="37" x2="126" y2="189" class="geometry interactive"/>
  <circle cx="126" cy="37" r="2.5" class="point"/>
  <circle cx="126" cy="189" r="2.5" class="point"/>
  <text x="115" y="113" class="label">E</text>
  <line x1="154" y1="39" x2="154" y2="188" class="geometry interactive"/>
  <circle cx="154" cy="39" r="2.5" class="point"/>
  <circle cx="154" cy="188" r="2.5" class="point"/>
  <text x="143" y="113" class="label">F</text>
  <line x1="180" y1="10" x2="180" y2="237" class="geometry interactive"/>
  <circle cx="180" cy="10" r="2.5" class="point"/>
  <circle cx="180" cy="237" r="2.5" class="point"/>
  <text x="169" y="123" class="label">G</text>
</svg>
