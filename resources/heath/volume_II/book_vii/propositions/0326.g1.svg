<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 145 185" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="145" height="185" fill="#ffffff"/>
  <line x1="19" y1="10" x2="19" y2="175" class="geometry interactive"/>
  <circle cx="19" cy="10" r="2.5" class="point"/>
  <circle cx="19" cy="175" r="2.5" class="point"/>
  <text x="30" y="92" class="label">A</text>
  <line x1="49" y1="16" x2="49" y2="133" class="geometry interactive"/>
  <circle cx="49" cy="16" r="2.5" class="point"/>
  <circle cx="49" cy="133" r="2.5" class="point"/>
  <text x="60" y="74" class="label">B</text>
  <line x1="101" y1="80" x2="101" y2="163" class="geometry interactive"/>
  <circle cx="101" cy="80" r="2.5" class="point"/>
  <circle cx="101" cy="163" r="2.5" class="point"/>
  <circle cx="101" cy="83" r="2.5" class="point"/>
  <text x="90" y="83" class="label">C</text>
  <circle cx="101" cy="121" r="2.5" class="point"/>
  <text x="90" y="121" class="label">G</text>
  <circle cx="101" cy="160" r="2.5" class="point"/>
  <text x="90" y="160" class="label">D</text>
  <line x1="123" y1="84" x2="123" y2="141" class="geometry interactive"/>
  <circle cx="123" cy="84" r="2.5" class="point"/>
  <circle cx="123" cy="141" r="2.5" class="point"/>
  <circle cx="123" cy="86" r="2.5" class="point"/>
  <text x="134" y="86" class="label">E</text>
  <circle cx="123" cy="112" r="2.5" class="point"/>
  <text x="134" y="112" class="label">H</text>
  <circle cx="123" cy="138" r="2.5" class="point"/>
  <text x="134" y="138" class="label">F</text>
</svg>
