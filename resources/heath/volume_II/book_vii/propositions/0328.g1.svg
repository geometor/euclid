<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 124" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="220" height="124" fill="#ffffff"/>
  <line x1="22" y1="10" x2="22" y2="114" class="geometry interactive"/>
  <circle cx="22" cy="10" r="2.5" class="point"/>
  <circle cx="22" cy="114" r="2.5" class="point"/>
  <text x="11" y="62" class="label">A</text>
  <line x1="49" y1="16" x2="49" y2="89" class="geometry interactive"/>
  <circle cx="49" cy="16" r="2.5" class="point"/>
  <circle cx="49" cy="89" r="2.5" class="point"/>
  <text x="38" y="52" class="label">B</text>
  <line x1="128" y1="15" x2="128" y2="70" class="geometry interactive"/>
  <circle cx="128" cy="15" r="2.5" class="point"/>
  <circle cx="128" cy="70" r="2.5" class="point"/>
  <text x="117" y="42" class="label">C</text>
  <line x1="152" y1="12" x2="152" y2="54" class="geometry interactive"/>
  <circle cx="152" cy="12" r="2.5" class="point"/>
  <circle cx="152" cy="54" r="2.5" class="point"/>
  <text x="141" y="33" class="label">D</text>
  <line x1="198" y1="17" x2="198" y2="43" class="geometry interactive"/>
  <circle cx="198" cy="17" r="2.5" class="point"/>
  <circle cx="198" cy="43" r="2.5" class="point"/>
  <text x="209" y="30" class="label">E</text>
</svg>
