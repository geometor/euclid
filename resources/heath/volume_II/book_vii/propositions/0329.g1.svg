<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 122" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="195" height="122" fill="#ffffff"/>
  <line x1="27" y1="14" x2="181" y2="14" class="geometry interactive"/>
  <circle cx="27" cy="14" r="2.5" class="point"/>
  <circle cx="181" cy="14" r="2.5" class="point"/>
  <text x="16" y="14" class="label">A</text>
  <line x1="25" y1="41" x2="147" y2="41" class="geometry interactive"/>
  <circle cx="25" cy="41" r="2.5" class="point"/>
  <circle cx="147" cy="41" r="2.5" class="point"/>
  <text x="14" y="41" class="label">B</text>
  <line x1="25" y1="65" x2="95" y2="65" class="geometry interactive"/>
  <circle cx="25" cy="65" r="2.5" class="point"/>
  <circle cx="95" cy="65" r="2.5" class="point"/>
  <text x="14" y="65" class="label">C</text>
  <line x1="23" y1="85" x2="85" y2="85" class="geometry interactive"/>
  <circle cx="23" cy="85" r="2.5" class="point"/>
  <circle cx="85" cy="85" r="2.5" class="point"/>
  <text x="12" y="85" class="label">D</text>
  <line x1="23" y1="109" x2="72" y2="109" class="geometry interactive"/>
  <circle cx="23" cy="109" r="2.5" class="point"/>
  <circle cx="72" cy="109" r="2.5" class="point"/>
  <text x="12" y="109" class="label">E</text>
</svg>
