<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 115 168" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="115" height="168" fill="#ffffff"/>
  <line x1="14" y1="9" x2="14" y2="144" class="geometry interactive"/>
  <circle cx="14" cy="9" r="2.5" class="point"/>
  <circle cx="14" cy="144" r="2.5" class="point"/>
  <text x="14" y="157" class="label">A</text>
  <line x1="44" y1="43" x2="44" y2="144" class="geometry interactive"/>
  <circle cx="44" cy="43" r="2.5" class="point"/>
  <circle cx="44" cy="144" r="2.5" class="point"/>
  <text x="44" y="157" class="label">B</text>
  <line x1="72" y1="99" x2="72" y2="146" class="geometry interactive"/>
  <circle cx="72" cy="99" r="2.5" class="point"/>
  <circle cx="72" cy="146" r="2.5" class="point"/>
  <text x="72" y="159" class="label">C</text>
  <line x1="96" y1="108" x2="96" y2="145" class="geometry interactive"/>
  <circle cx="96" cy="108" r="2.5" class="point"/>
  <circle cx="96" cy="145" r="2.5" class="point"/>
  <text x="96" y="158" class="label">D</text>
</svg>
