<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 149 183" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="149" height="183" fill="#ffffff"/>
  <line x1="15" y1="11" x2="15" y2="108" class="geometry interactive"/>
  <circle cx="15" cy="11" r="2.5" class="point"/>
  <circle cx="15" cy="108" r="2.5" class="point"/>
  <text x="15" y="121" class="label">A</text>
  <line x1="39" y1="10" x2="39" y2="87" class="geometry interactive"/>
  <circle cx="39" cy="10" r="2.5" class="point"/>
  <circle cx="39" cy="87" r="2.5" class="point"/>
  <text x="39" y="100" class="label">B</text>
  <line x1="60" y1="11" x2="60" y2="124" class="geometry interactive"/>
  <circle cx="60" cy="11" r="2.5" class="point"/>
  <circle cx="60" cy="124" r="2.5" class="point"/>
  <text x="60" y="137" class="label">C</text>
  <line x1="86" y1="10" x2="86" y2="160" class="geometry interactive"/>
  <circle cx="86" cy="10" r="2.5" class="point"/>
  <circle cx="86" cy="160" r="2.5" class="point"/>
  <text x="86" y="173" class="label">D</text>
  <line x1="109" y1="13" x2="109" y2="91" class="geometry interactive"/>
  <circle cx="109" cy="13" r="2.5" class="point"/>
  <circle cx="109" cy="91" r="2.5" class="point"/>
  <text x="109" y="104" class="label">E</text>
  <line x1="136" y1="16" x2="136" y2="80" class="geometry interactive"/>
  <circle cx="136" cy="16" r="2.5" class="point"/>
  <circle cx="136" cy="80" r="2.5" class="point"/>
  <text x="136" y="93" class="label">F</text>
</svg>
