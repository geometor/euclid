<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 149 183" width="149" height="183" class="euclid-graphic" data-graphic-id="0331.g1" data-folio="0331" data-graphic="g1" data-proposition="VII.24">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Number Segments) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="15.00" y1="11.00" x2="15.00" y2="108.00" class="geom-line" />
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="39.00" y1="10.00" x2="39.00" y2="87.00" class="geom-line" />
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="60.00" y1="11.00" x2="60.00" y2="124.00" class="geom-line" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="86.00" y1="10.00" x2="86.00" y2="160.00" class="geom-line" />
    <line id="el-mag-E" data-ref="E" data-aliases="/ E /" data-type="segment" x1="109.00" y1="13.00" x2="109.00" y2="91.00" class="geom-line" />
    <line id="el-mag-F" data-ref="F" data-aliases="/ F /" data-type="segment" x1="136.00" y1="16.00" x2="136.00" y2="80.00" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /" x1="15.00" y1="11.00" x2="15.00" y2="108.00" class="geom-line geom-overlay" />
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /" x1="39.00" y1="10.00" x2="39.00" y2="87.00" class="geom-line geom-overlay" />
    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /" x1="60.00" y1="11.00" x2="60.00" y2="124.00" class="geom-line geom-overlay" />
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="86.00" y1="10.00" x2="86.00" y2="160.00" class="geom-line geom-overlay" />
    <line id="hl-mag-E" data-ref="E" data-aliases="/ E /" x1="109.00" y1="13.00" x2="109.00" y2="91.00" class="geom-line geom-overlay" />
    <line id="hl-mag-F" data-ref="F" data-aliases="/ F /" x1="136.00" y1="16.00" x2="136.00" y2="80.00" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="15.00" y="121.00" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="39.00" y="100.00" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="60.00" y="137.00" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="86.00" y="173.00" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="109.00" y="104.00" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="136.00" y="93.00" class="geom-label">F</text>
  </g>
</svg>
