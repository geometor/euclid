<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 95 155" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="95" height="155" fill="#ffffff"/>
  <line x1="22" y1="10" x2="22" y2="71" class="geometry interactive"/>
  <circle cx="22" cy="10" r="2.5" class="point"/>
  <circle cx="22" cy="71" r="2.5" class="point"/>
  <text x="11" y="40" class="label">A</text>
  <line x1="22" y1="83" x2="22" y2="141" class="geometry interactive"/>
  <circle cx="22" cy="83" r="2.5" class="point"/>
  <circle cx="22" cy="141" r="2.5" class="point"/>
  <text x="11" y="112" class="label">D</text>
  <line x1="48" y1="12" x2="48" y2="60" class="geometry interactive"/>
  <circle cx="48" cy="12" r="2.5" class="point"/>
  <circle cx="48" cy="60" r="2.5" class="point"/>
  <text x="48" y="73" class="label">B</text>
  <line x1="72" y1="13" x2="72" y2="119" class="geometry interactive"/>
  <circle cx="72" cy="13" r="2.5" class="point"/>
  <circle cx="72" cy="119" r="2.5" class="point"/>
  <text x="72" y="132" class="label">C</text>
</svg>
