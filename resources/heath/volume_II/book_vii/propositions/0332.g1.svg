<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 95 155" width="95" height="155" class="euclid-graphic" data-graphic-id="0332.g1" data-folio="0332" data-graphic="g1" data-proposition="VII.25">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <!-- End tick marks on A (bottom) and D (top) -->
    <line x1="19.50" y1="71.00" x2="24.50" y2="71.00" class="geom-line" />
    <line x1="19.50" y1="83.00" x2="24.50" y2="83.00" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Number Segments) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="22.00" y1="10.00" x2="22.00" y2="71.00" class="geom-line" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="22.00" y1="83.00" x2="22.00" y2="141.00" class="geom-line" />
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="48.00" y1="12.00" x2="48.00" y2="60.00" class="geom-line" />
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="72.00" y1="13.00" x2="72.00" y2="119.00" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /" x1="22.00" y1="10.00" x2="22.00" y2="71.00" class="geom-line geom-overlay" />
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="22.00" y1="83.00" x2="22.00" y2="141.00" class="geom-line geom-overlay" />
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /" x1="48.00" y1="12.00" x2="48.00" y2="60.00" class="geom-line geom-overlay" />
    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /" x1="72.00" y1="13.00" x2="72.00" y2="119.00" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="11.00" y="40.00" class="geom-label">A</text>
    <text id="lbl-D" data-ref="D" x="11.00" y="112.00" class="geom-label">D</text>
    <text id="lbl-B" data-ref="B" x="48.00" y="73.00" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="72.00" y="132.00" class="geom-label">C</text>
  </g>
</svg>
