<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285 105" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="285" height="105" fill="#ffffff"/>
  <line x1="24" y1="16" x2="143" y2="16" class="geometry interactive"/>
  <circle cx="24" cy="16" r="2.5" class="point"/>
  <circle cx="143" cy="16" r="2.5" class="point"/>
  <text x="13" y="16" class="label">A</text>
  <line x1="189" y1="16" x2="272" y2="16" class="geometry interactive"/>
  <circle cx="189" cy="16" r="2.5" class="point"/>
  <circle cx="272" cy="16" r="2.5" class="point"/>
  <text x="178" y="16" class="label">C</text>
  <line x1="24" y1="39" x2="123" y2="39" class="geometry interactive"/>
  <circle cx="24" cy="39" r="2.5" class="point"/>
  <circle cx="123" cy="39" r="2.5" class="point"/>
  <text x="13" y="39" class="label">B</text>
  <line x1="188" y1="39" x2="257" y2="39" class="geometry interactive"/>
  <circle cx="188" cy="39" r="2.5" class="point"/>
  <circle cx="257" cy="39" r="2.5" class="point"/>
  <text x="177" y="39" class="label">D</text>
  <line x1="26" y1="64" x2="195" y2="64" class="geometry interactive"/>
  <circle cx="26" cy="64" r="2.5" class="point"/>
  <circle cx="195" cy="64" r="2.5" class="point"/>
  <text x="15" y="64" class="label">E</text>
  <line x1="26" y1="90" x2="139" y2="90" class="geometry interactive"/>
  <circle cx="26" cy="90" r="2.5" class="point"/>
  <circle cx="139" cy="90" r="2.5" class="point"/>
  <text x="15" y="90" class="label">F</text>
</svg>
