<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="160" height="170" class="euclid-graphic" data-graphic-id="0334.g1" data-folio="0334" data-graphic="g1" data-proposition="VII.27">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Number Segments) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="23.00" y1="17.00" x2="23.00" y2="74.00" class="geom-line" />
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="25.00" y1="112.00" x2="25.00" y2="155.00" class="geom-line" />
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="51.00" y1="14.00" x2="51.00" y2="106.00" class="geom-line" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="80.00" y1="11.00" x2="80.00" y2="141.00" class="geom-line" />
    <line id="el-mag-E" data-ref="E" data-aliases="/ E /" data-type="segment" x1="110.00" y1="11.00" x2="110.00" y2="78.00" class="geom-line" />
    <line id="el-mag-F" data-ref="F" data-aliases="/ F /" data-type="segment" x1="141.00" y1="10.00" x2="141.00" y2="102.00" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /" x1="23.00" y1="17.00" x2="23.00" y2="74.00" class="geom-line geom-overlay" />
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /" x1="25.00" y1="112.00" x2="25.00" y2="155.00" class="geom-line geom-overlay" />
    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /" x1="51.00" y1="14.00" x2="51.00" y2="106.00" class="geom-line geom-overlay" />
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="80.00" y1="11.00" x2="80.00" y2="141.00" class="geom-line geom-overlay" />
    <line id="hl-mag-E" data-ref="E" data-aliases="/ E /" x1="110.00" y1="11.00" x2="110.00" y2="78.00" class="geom-line geom-overlay" />
    <line id="hl-mag-F" data-ref="F" data-aliases="/ F /" x1="141.00" y1="10.00" x2="141.00" y2="102.00" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="12.00" y="34.00" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="14.00" y="133.00" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="51.00" y="119.00" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="80.00" y="154.00" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="110.00" y="91.00" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="141.00" y="115.00" class="geom-label">F</text>
  </g>
</svg>
