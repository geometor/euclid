<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="160" height="170" fill="#ffffff"/>
  <line x1="23" y1="17" x2="23" y2="74" class="geometry interactive"/>
  <circle cx="23" cy="17" r="2.5" class="point"/>
  <circle cx="23" cy="74" r="2.5" class="point"/>
  <text x="12" y="45" class="label">A</text>
  <line x1="25" y1="112" x2="25" y2="155" class="geometry interactive"/>
  <circle cx="25" cy="112" r="2.5" class="point"/>
  <circle cx="25" cy="155" r="2.5" class="point"/>
  <text x="14" y="133" class="label">B</text>
  <line x1="51" y1="14" x2="51" y2="106" class="geometry interactive"/>
  <circle cx="51" cy="14" r="2.5" class="point"/>
  <circle cx="51" cy="106" r="2.5" class="point"/>
  <text x="51" y="119" class="label">C</text>
  <line x1="80" y1="11" x2="80" y2="141" class="geometry interactive"/>
  <circle cx="80" cy="11" r="2.5" class="point"/>
  <circle cx="80" cy="141" r="2.5" class="point"/>
  <text x="80" y="154" class="label">D</text>
  <line x1="110" y1="11" x2="110" y2="78" class="geometry interactive"/>
  <circle cx="110" cy="11" r="2.5" class="point"/>
  <circle cx="110" cy="78" r="2.5" class="point"/>
  <text x="110" y="91" class="label">E</text>
  <line x1="141" y1="10" x2="141" y2="102" class="geometry interactive"/>
  <circle cx="141" cy="10" r="2.5" class="point"/>
  <circle cx="141" cy="102" r="2.5" class="point"/>
  <text x="141" y="115" class="label">F</text>
</svg>
