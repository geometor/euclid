<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 207 64" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="207" height="64" fill="#ffffff"/>
  <line x1="10" y1="12" x2="197" y2="12" class="geometry interactive"/>
  <circle cx="10" cy="12" r="2.5" class="point"/>
  <circle cx="197" cy="12" r="2.5" class="point"/>
  <circle cx="10" cy="12" r="2.5" class="point"/>
  <text x="10" y="25" class="label">A</text>
  <circle cx="138" cy="12" r="2.5" class="point"/>
  <text x="138" y="25" class="label">B</text>
  <circle cx="197" cy="12" r="2.5" class="point"/>
  <text x="197" y="25" class="label">C</text>
  <line x1="9" y1="43" x2="66" y2="43" class="geometry interactive"/>
  <circle cx="9" cy="43" r="2.5" class="point"/>
  <circle cx="66" cy="43" r="2.5" class="point"/>
  <text x="37" y="56" class="label">D</text>
</svg>
