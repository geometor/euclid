<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 207 64" width="207" height="64" class="euclid-graphic" data-graphic-id="0335.g1" data-folio="0335" data-graphic="g1" data-proposition="VII.28">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-AC" data-ref="[ A C ]" data-aliases="[ C A ]" data-type="line" x1="10.00" y1="12.00" x2="197.00" y2="12.00" class="geom-line" />
    <!-- Tick mark at B -->
    <line x1="138.00" y1="8.50" x2="138.00" y2="15.50" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Segments & Sub-segments) -->
  <g id="graphics">
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="10.00" y1="12.00" x2="197.00" y2="12.00" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="10.00" y1="12.00" x2="138.00" y2="12.00" class="geom-line geom-overlay" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="138.00" y1="12.00" x2="197.00" y2="12.00" class="geom-line geom-overlay" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="9.00" y1="43.00" x2="66.00" y2="43.00" class="geom-line" />
    <polyline id="el-sec-ABC" data-ref="/ A B C /" data-aliases="/ C B A /; } A B C {; } C B A {" data-type="section" points="10.00,12.00 138.00,12.00 197.00,12.00" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="10.00" y1="12.00" x2="197.00" y2="12.00" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="10.00" y1="12.00" x2="138.00" y2="12.00" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="138.00" y1="12.00" x2="197.00" y2="12.00" class="geom-line geom-overlay" />
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="9.00" y1="43.00" x2="66.00" y2="43.00" class="geom-line geom-overlay" />
    <polyline id="hl-sec-ABC" data-ref="/ A B C /" data-aliases="/ C B A /; } A B C {; } C B A {" points="10.00,12.00 138.00,12.00 197.00,12.00" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="10.00" cy="12.00" r="2.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="138.00" cy="12.00" r="2.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="197.00" cy="12.00" r="2.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="10.00" y="25.00" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="138.00" y="25.00" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="197.00" y="25.00" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="37.00" y="56.00" class="geom-label">D</text>
  </g>
</svg>
