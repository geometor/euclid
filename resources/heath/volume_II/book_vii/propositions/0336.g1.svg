<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 75" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="180" height="75" fill="#ffffff"/>
  <line x1="16" y1="15" x2="113" y2="15" class="geometry interactive"/>
  <circle cx="16" cy="15" r="2.5" class="point"/>
  <circle cx="113" cy="15" r="2.5" class="point"/>
  <text x="124" y="15" class="label">A</text>
  <line x1="14" y1="39" x2="158" y2="39" class="geometry interactive"/>
  <circle cx="14" cy="39" r="2.5" class="point"/>
  <circle cx="158" cy="39" r="2.5" class="point"/>
  <text x="169" y="39" class="label">B</text>
  <line x1="13" y1="61" x2="63" y2="61" class="geometry interactive"/>
  <circle cx="13" cy="61" r="2.5" class="point"/>
  <circle cx="63" cy="61" r="2.5" class="point"/>
  <text x="74" y="61" class="label">C</text>
</svg>
