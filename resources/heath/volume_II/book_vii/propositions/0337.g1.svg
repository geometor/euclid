<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 122" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="195" height="122" fill="#ffffff"/>
  <line x1="22" y1="13" x2="122" y2="13" class="geometry interactive"/>
  <circle cx="22" cy="13" r="2.5" class="point"/>
  <circle cx="122" cy="13" r="2.5" class="point"/>
  <text x="11" y="13" class="label">A</text>
  <line x1="24" y1="36" x2="140" y2="36" class="geometry interactive"/>
  <circle cx="24" cy="36" r="2.5" class="point"/>
  <circle cx="140" cy="36" r="2.5" class="point"/>
  <text x="13" y="36" class="label">B</text>
  <line x1="23" y1="59" x2="173" y2="59" class="geometry interactive"/>
  <circle cx="23" cy="59" r="2.5" class="point"/>
  <circle cx="173" cy="59" r="2.5" class="point"/>
  <text x="12" y="59" class="label">C</text>
  <line x1="24" y1="86" x2="57" y2="86" class="geometry interactive"/>
  <circle cx="24" cy="86" r="2.5" class="point"/>
  <circle cx="57" cy="86" r="2.5" class="point"/>
  <text x="13" y="86" class="label">D</text>
  <line x1="25" y1="107" x2="153" y2="107" class="geometry interactive"/>
  <circle cx="25" cy="107" r="2.5" class="point"/>
  <circle cx="153" cy="107" r="2.5" class="point"/>
  <text x="14" y="107" class="label">E</text>
</svg>
