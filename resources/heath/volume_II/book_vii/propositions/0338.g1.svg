<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 181 75" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="181" height="75" fill="#ffffff"/>
  <line x1="23" y1="12" x2="174" y2="12" class="geometry interactive"/>
  <circle cx="23" cy="12" r="2.5" class="point"/>
  <circle cx="174" cy="12" r="2.5" class="point"/>
  <text x="12" y="12" class="label">A</text>
  <line x1="24" y1="37" x2="135" y2="37" class="geometry interactive"/>
  <circle cx="24" cy="37" r="2.5" class="point"/>
  <circle cx="135" cy="37" r="2.5" class="point"/>
  <text x="13" y="37" class="label">B</text>
  <line x1="24" y1="61" x2="79" y2="61" class="geometry interactive"/>
  <circle cx="24" cy="61" r="2.5" class="point"/>
  <circle cx="79" cy="61" r="2.5" class="point"/>
  <text x="13" y="61" class="label">C</text>
</svg>
