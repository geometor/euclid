<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 110" width="215" height="110" class="euclid-graphic" data-graphic-id="0342.g1" data-folio="0342" data-graphic="g1" data-proposition="VII.34">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Number Segments) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="41.00" y1="17.00" x2="98.00" y2="17.00" class="geom-line" />
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="128.00" y1="17.00" x2="196.00" y2="17.00" class="geom-line" />
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="43.00" y1="42.00" x2="199.00" y2="42.00" class="geom-line" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="46.00" y1="65.00" x2="156.00" y2="65.00" class="geom-line" />
    <line id="el-mag-E" data-ref="E" data-aliases="/ E /" data-type="segment" x1="24.00" y1="95.00" x2="78.00" y2="95.00" class="geom-line" />
    <line id="el-mag-F" data-ref="F" data-aliases="/ F /" data-type="segment" x1="126.00" y1="95.00" x2="167.00" y2="95.00" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /" x1="41.00" y1="17.00" x2="98.00" y2="17.00" class="geom-line geom-overlay" />
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /" x1="128.00" y1="17.00" x2="196.00" y2="17.00" class="geom-line geom-overlay" />
    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /" x1="43.00" y1="42.00" x2="199.00" y2="42.00" class="geom-line geom-overlay" />
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="46.00" y1="65.00" x2="156.00" y2="65.00" class="geom-line geom-overlay" />
    <line id="hl-mag-E" data-ref="E" data-aliases="/ E /" x1="24.00" y1="95.00" x2="78.00" y2="95.00" class="geom-line geom-overlay" />
    <line id="hl-mag-F" data-ref="F" data-aliases="/ F /" x1="126.00" y1="95.00" x2="167.00" y2="95.00" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="30.00" y="17.00" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="117.00" y="17.00" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="32.00" y="42.00" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="167.00" y="65.00" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="13.00" y="95.00" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="115.00" y="95.00" class="geom-label">F</text>
  </g>
</svg>
