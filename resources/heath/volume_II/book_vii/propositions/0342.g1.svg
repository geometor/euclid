<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 110" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="215" height="110" fill="#ffffff"/>
  <line x1="41" y1="17" x2="98" y2="17" class="geometry interactive"/>
  <circle cx="41" cy="17" r="2.5" class="point"/>
  <circle cx="98" cy="17" r="2.5" class="point"/>
  <text x="30" y="17" class="label">A</text>
  <line x1="128" y1="17" x2="196" y2="17" class="geometry interactive"/>
  <circle cx="128" cy="17" r="2.5" class="point"/>
  <circle cx="196" cy="17" r="2.5" class="point"/>
  <text x="117" y="17" class="label">B</text>
  <line x1="43" y1="42" x2="199" y2="42" class="geometry interactive"/>
  <circle cx="43" cy="42" r="2.5" class="point"/>
  <circle cx="199" cy="42" r="2.5" class="point"/>
  <text x="32" y="42" class="label">C</text>
  <line x1="46" y1="65" x2="156" y2="65" class="geometry interactive"/>
  <circle cx="46" cy="65" r="2.5" class="point"/>
  <circle cx="156" cy="65" r="2.5" class="point"/>
  <text x="167" y="65" class="label">D</text>
  <line x1="24" y1="95" x2="78" y2="95" class="geometry interactive"/>
  <circle cx="24" cy="95" r="2.5" class="point"/>
  <circle cx="78" cy="95" r="2.5" class="point"/>
  <text x="13" y="95" class="label">E</text>
  <line x1="126" y1="95" x2="167" y2="95" class="geometry interactive"/>
  <circle cx="126" cy="95" r="2.5" class="point"/>
  <circle cx="167" cy="95" r="2.5" class="point"/>
  <text x="115" y="95" class="label">F</text>
</svg>
