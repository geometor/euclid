<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 140" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="245" height="140" fill="#ffffff"/>
  <line x1="22" y1="23" x2="90" y2="23" class="geometry interactive"/>
  <circle cx="22" cy="23" r="2.5" class="point"/>
  <circle cx="90" cy="23" r="2.5" class="point"/>
  <text x="56" y="12" class="label">A</text>
  <line x1="124" y1="23" x2="227" y2="23" class="geometry interactive"/>
  <circle cx="124" cy="23" r="2.5" class="point"/>
  <circle cx="227" cy="23" r="2.5" class="point"/>
  <text x="175" y="12" class="label">B</text>
  <line x1="23" y1="49" x2="69" y2="49" class="geometry interactive"/>
  <circle cx="23" cy="49" r="2.5" class="point"/>
  <circle cx="69" cy="49" r="2.5" class="point"/>
  <text x="80" y="49" class="label">F</text>
  <line x1="116" y1="49" x2="184" y2="49" class="geometry interactive"/>
  <circle cx="116" cy="49" r="2.5" class="point"/>
  <circle cx="184" cy="49" r="2.5" class="point"/>
  <text x="195" y="49" class="label">E</text>
  <line x1="23" y1="76" x2="165" y2="76" class="geometry interactive"/>
  <circle cx="23" cy="76" r="2.5" class="point"/>
  <circle cx="165" cy="76" r="2.5" class="point"/>
  <text x="94" y="89" class="label">C</text>
  <line x1="27" y1="99" x2="132" y2="99" class="geometry interactive"/>
  <circle cx="27" cy="99" r="2.5" class="point"/>
  <circle cx="132" cy="99" r="2.5" class="point"/>
  <text x="143" y="99" class="label">D</text>
  <line x1="40" y1="126" x2="75" y2="126" class="geometry interactive"/>
  <circle cx="40" cy="126" r="2.5" class="point"/>
  <circle cx="75" cy="126" r="2.5" class="point"/>
  <text x="86" y="126" class="label">G</text>
  <line x1="123" y1="126" x2="147" y2="126" class="geometry interactive"/>
  <circle cx="123" cy="126" r="2.5" class="point"/>
  <circle cx="147" cy="126" r="2.5" class="point"/>
  <text x="158" y="126" class="label">H</text>
</svg>
