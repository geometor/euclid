    <circle id="el-pt-F" data-ref="F" data-type="point" cx="91.00" cy="39.00" r="2.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="234.00" cy="39.00" r="2.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="14.00" y="15.00" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="117.00" y="14.00" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="19.00" y="39.00" class="geom-label">C</text>
    <text id="lbl-F" data-ref="F" x="91.00" y="27.00" class="geom-label">F</text>
    <text id="lbl-D" data-ref="D" x="244.00" y="39.00" class="geom-label">D</text>
