<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 253 80" width="253" height="80" class="euclid-graphic" data-graphic-id="0345.g1" data-folio="0345" data-graphic="g1" data-proposition="VII.35">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-CD" data-ref="[ C D ]" data-aliases="[ D C ]" data-type="line" x1="30.00" y1="39.00" x2="234.00" y2="39.00" class="geom-line" />
    <!-- Tick mark at F -->
    <line x1="91.00" y1="35.50" x2="91.00" y2="42.50" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Segments & Sub-segments) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="25.00" y1="15.00" x2="84.00" y2="15.00" class="geom-line" />
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="128.00" y1="14.00" x2="204.00" y2="14.00" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="30.00" y1="39.00" x2="234.00" y2="39.00" class="geom-line" />
    <line id="el-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" data-type="segment" x1="30.00" y1="39.00" x2="91.00" y2="39.00" class="geom-line geom-overlay" />
    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" data-type="segment" x1="91.00" y1="39.00" x2="234.00" y2="39.00" class="geom-line geom-overlay" />
    <line id="el-mag-E" data-ref="E" data-aliases="/ E /" data-type="segment" x1="42.00" y1="66.00" x2="128.00" y2="66.00" class="geom-line" />
    <polyline id="el-sec-CFD" data-ref="/ C F D /" data-aliases="/ D F C / | } C F D { | } D F C {" data-type="section" points="30.00,39.00 91.00,39.00 234.00,39.00" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /" x1="25.00" y1="15.00" x2="84.00" y2="15.00" class="geom-line geom-overlay" />
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /" x1="128.00" y1="14.00" x2="204.00" y2="14.00" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="30.00" y1="39.00" x2="234.00" y2="39.00" class="geom-line geom-overlay" />
    <line id="hl-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" x1="30.00" y1="39.00" x2="91.00" y2="39.00" class="geom-line geom-overlay" />
    <line id="hl-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" x1="91.00" y1="39.00" x2="234.00" y2="39.00" class="geom-line geom-overlay" />
    <line id="hl-mag-E" data-ref="E" data-aliases="/ E /" x1="42.00" y1="66.00" x2="128.00" y2="66.00" class="geom-line geom-overlay" />
    <polyline id="hl-sec-CFD" data-ref="/ C F D /" data-aliases="/ D F C / | } C F D { | } D F C {" points="30.00,39.00 91.00,39.00 234.00,39.00" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
