<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 253 80" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="253" height="80" fill="#ffffff"/>
  <line x1="25" y1="15" x2="84" y2="15" class="geometry interactive"/>
  <circle cx="25" cy="15" r="2.5" class="point"/>
  <circle cx="84" cy="15" r="2.5" class="point"/>
  <text x="14" y="15" class="label">A</text>
  <line x1="128" y1="14" x2="204" y2="14" class="geometry interactive"/>
  <circle cx="128" cy="14" r="2.5" class="point"/>
  <circle cx="204" cy="14" r="2.5" class="point"/>
  <text x="117" y="14" class="label">B</text>
  <line x1="30" y1="39" x2="234" y2="39" class="geometry interactive"/>
  <circle cx="30" cy="39" r="2.5" class="point"/>
  <circle cx="91" cy="39" r="2.5" class="point"/>
  <circle cx="234" cy="39" r="2.5" class="point"/>
  <text x="19" y="39" class="label">C</text>
  <text x="91" y="27" class="label">F</text>
  <text x="244" y="39" class="label">D</text>
  <line x1="42" y1="66" x2="128" y2="66" class="geometry interactive"/>
  <circle cx="42" cy="66" r="2.5" class="point"/>
  <circle cx="128" cy="66" r="2.5" class="point"/>
  <text x="31" y="66" class="label">E</text>
</svg>
