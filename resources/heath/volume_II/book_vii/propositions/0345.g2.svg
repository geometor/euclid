<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 171 121" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="171" height="121" fill="#ffffff"/>
  <line x1="21" y1="14" x2="82" y2="14" class="geometry interactive"/>
  <circle cx="21" cy="14" r="2.5" class="point"/>
  <circle cx="82" cy="14" r="2.5" class="point"/>
  <text x="10" y="14" class="label">A</text>
  <line x1="22" y1="38" x2="86" y2="38" class="geometry interactive"/>
  <circle cx="22" cy="38" r="2.5" class="point"/>
  <circle cx="86" cy="38" r="2.5" class="point"/>
  <text x="11" y="38" class="label">B</text>
  <line x1="22" y1="60" x2="105" y2="60" class="geometry interactive"/>
  <circle cx="22" cy="60" r="2.5" class="point"/>
  <circle cx="105" cy="60" r="2.5" class="point"/>
  <text x="11" y="60" class="label">C</text>
  <line x1="20" y1="84" x2="163" y2="84" class="geometry interactive"/>
  <circle cx="20" cy="84" r="2.5" class="point"/>
  <circle cx="163" cy="84" r="2.5" class="point"/>
  <text x="9" y="84" class="label">D</text>
  <line x1="20" y1="106" x2="135" y2="106" class="geometry interactive"/>
  <circle cx="20" cy="106" r="2.5" class="point"/>
  <circle cx="135" cy="106" r="2.5" class="point"/>
  <text x="9" y="106" class="label">E</text>
</svg>
