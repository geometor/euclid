<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 150" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="175" height="150" fill="#ffffff"/>
  <line x1="22" y1="15" x2="81" y2="15" class="geometry interactive"/>
  <circle cx="22" cy="15" r="2.5" class="point"/>
  <circle cx="81" cy="15" r="2.5" class="point"/>
  <text x="11" y="15" class="label">A</text>
  <line x1="22" y1="40" x2="99" y2="40" class="geometry interactive"/>
  <circle cx="22" cy="40" r="2.5" class="point"/>
  <circle cx="99" cy="40" r="2.5" class="point"/>
  <text x="11" y="40" class="label">B</text>
  <line x1="23" y1="62" x2="109" y2="62" class="geometry interactive"/>
  <circle cx="23" cy="62" r="2.5" class="point"/>
  <circle cx="109" cy="62" r="2.5" class="point"/>
  <text x="12" y="62" class="label">C</text>
  <line x1="23" y1="87" x2="116" y2="87" class="geometry interactive"/>
  <circle cx="23" cy="87" r="2.5" class="point"/>
  <circle cx="116" cy="87" r="2.5" class="point"/>
  <text x="12" y="87" class="label">D</text>
  <line x1="22" y1="110" x2="159" y2="110" class="geometry interactive"/>
  <circle cx="22" cy="110" r="2.5" class="point"/>
  <circle cx="159" cy="110" r="2.5" class="point"/>
  <text x="170" y="110" class="label">E</text>
  <line x1="23" y1="136" x2="134" y2="136" class="geometry interactive"/>
  <circle cx="23" cy="136" r="2.5" class="point"/>
  <circle cx="134" cy="136" r="2.5" class="point"/>
  <text x="145" y="136" class="label">F</text>
</svg>
