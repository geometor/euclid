<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 105" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="168" height="105" fill="#ffffff"/>
  <line x1="23" y1="14" x2="153" y2="14" class="geometry interactive"/>
  <circle cx="23" cy="14" r="2.5" class="point"/>
  <circle cx="153" cy="14" r="2.5" class="point"/>
  <text x="12" y="14" class="label">A</text>
  <line x1="22" y1="39" x2="68" y2="39" class="geometry interactive"/>
  <circle cx="22" cy="39" r="2.5" class="point"/>
  <circle cx="68" cy="39" r="2.5" class="point"/>
  <text x="11" y="39" class="label">B</text>
  <line x1="23" y1="66" x2="90" y2="66" class="geometry interactive"/>
  <circle cx="23" cy="66" r="2.5" class="point"/>
  <circle cx="90" cy="66" r="2.5" class="point"/>
  <text x="12" y="66" class="label">C</text>
  <line x1="24" y1="88" x2="48" y2="88" class="geometry interactive"/>
  <circle cx="24" cy="88" r="2.5" class="point"/>
  <circle cx="48" cy="88" r="2.5" class="point"/>
  <text x="13" y="88" class="label">D</text>
</svg>
