<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 100" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="180" height="100" fill="#ffffff"/>
  <line x1="19" y1="14" x2="163" y2="14" class="geometry interactive"/>
  <circle cx="19" cy="14" r="2.5" class="point"/>
  <circle cx="163" cy="14" r="2.5" class="point"/>
  <text x="8" y="14" class="label">A</text>
  <line x1="21" y1="40" x2="95" y2="40" class="geometry interactive"/>
  <circle cx="21" cy="40" r="2.5" class="point"/>
  <circle cx="95" cy="40" r="2.5" class="point"/>
  <text x="106" y="40" class="label">B</text>
  <line x1="21" y1="62" x2="72" y2="62" class="geometry interactive"/>
  <circle cx="21" cy="62" r="2.5" class="point"/>
  <circle cx="72" cy="62" r="2.5" class="point"/>
  <text x="83" y="62" class="label">C</text>
  <line x1="23" y1="86" x2="46" y2="86" class="geometry interactive"/>
  <circle cx="23" cy="86" r="2.5" class="point"/>
  <circle cx="46" cy="86" r="2.5" class="point"/>
  <text x="57" y="86" class="label">D</text>
</svg>
