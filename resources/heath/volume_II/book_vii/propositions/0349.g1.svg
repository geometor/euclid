<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 325 132" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="325" height="132" fill="#ffffff"/>
  <line x1="66" y1="19" x2="93" y2="19" class="geometry interactive"/>
  <circle cx="66" cy="19" r="2.5" class="point"/>
  <circle cx="93" cy="19" r="2.5" class="point"/>
  <text x="79" y="8" class="label">A</text>
  <line x1="128" y1="19" x2="165" y2="19" class="geometry interactive"/>
  <circle cx="128" cy="19" r="2.5" class="point"/>
  <circle cx="165" cy="19" r="2.5" class="point"/>
  <text x="146" y="8" class="label">B</text>
  <line x1="210" y1="19" x2="260" y2="19" class="geometry interactive"/>
  <circle cx="210" cy="19" r="2.5" class="point"/>
  <circle cx="260" cy="19" r="2.5" class="point"/>
  <text x="235" y="8" class="label">C</text>
  <line x1="70" y1="43" x2="113" y2="43" class="geometry interactive"/>
  <circle cx="70" cy="43" r="2.5" class="point"/>
  <circle cx="113" cy="43" r="2.5" class="point"/>
  <text x="91" y="32" class="label">D</text>
  <line x1="149" y1="43" x2="224" y2="43" class="geometry interactive"/>
  <circle cx="149" cy="43" r="2.5" class="point"/>
  <circle cx="224" cy="43" r="2.5" class="point"/>
  <text x="235" y="43" class="label">E</text>
  <line x1="98" y1="67" x2="185" y2="67" class="geometry interactive"/>
  <circle cx="98" cy="67" r="2.5" class="point"/>
  <circle cx="185" cy="67" r="2.5" class="point"/>
  <text x="196" y="67" class="label">F</text>
  <line x1="9" y1="93" x2="304" y2="93" class="geometry interactive"/>
  <circle cx="9" cy="93" r="2.5" class="point"/>
  <circle cx="304" cy="93" r="2.5" class="point"/>
  <text x="315" y="93" class="label">G</text>
  <line x1="45" y1="116" x2="255" y2="116" class="geometry interactive"/>
  <circle cx="45" cy="116" r="2.5" class="point"/>
  <circle cx="255" cy="116" r="2.5" class="point"/>
  <text x="266" y="116" class="label">H</text>
</svg>
