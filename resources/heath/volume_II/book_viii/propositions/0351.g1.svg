<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 275 98" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="275" height="98" fill="#ffffff"/>
  <line x1="26" y1="14" x2="80" y2="14" class="geometry interactive"/>
  <circle cx="26" cy="14" r="2.5" class="point"/>
  <circle cx="80" cy="14" r="2.5" class="point"/>
  <text x="15" y="14" class="label">A</text>
  <line x1="26" y1="36" x2="104" y2="36" class="geometry interactive"/>
  <circle cx="26" cy="36" r="2.5" class="point"/>
  <circle cx="104" cy="36" r="2.5" class="point"/>
  <text x="15" y="36" class="label">B</text>
  <line x1="26" y1="58" x2="124" y2="58" class="geometry interactive"/>
  <circle cx="26" cy="58" r="2.5" class="point"/>
  <circle cx="124" cy="58" r="2.5" class="point"/>
  <text x="15" y="58" class="label">C</text>
  <line x1="27" y1="80" x2="156" y2="80" class="geometry interactive"/>
  <circle cx="27" cy="80" r="2.5" class="point"/>
  <circle cx="156" cy="80" r="2.5" class="point"/>
  <text x="16" y="80" class="label">D</text>
  <line x1="204" y1="14" x2="233" y2="14" class="geometry interactive"/>
  <circle cx="204" cy="14" r="2.5" class="point"/>
  <circle cx="233" cy="14" r="2.5" class="point"/>
  <text x="193" y="14" class="label">E</text>
  <line x1="205" y1="38" x2="245" y2="38" class="geometry interactive"/>
  <circle cx="205" cy="38" r="2.5" class="point"/>
  <circle cx="245" cy="38" r="2.5" class="point"/>
  <text x="194" y="38" class="label">F</text>
  <line x1="204" y1="58" x2="253" y2="58" class="geometry interactive"/>
  <circle cx="204" cy="58" r="2.5" class="point"/>
  <circle cx="253" cy="58" r="2.5" class="point"/>
  <text x="193" y="58" class="label">G</text>
  <line x1="204" y1="82" x2="263" y2="82" class="geometry interactive"/>
  <circle cx="204" cy="82" r="2.5" class="point"/>
  <circle cx="263" cy="82" r="2.5" class="point"/>
  <text x="193" y="82" class="label">H</text>
</svg>
