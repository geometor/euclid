    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="26.00" y1="36.00" x2="104.00" y2="36.00" class="geom-line" />
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="26.00" y1="58.00" x2="124.00" y2="58.00" class="geom-line" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="27.00" y1="80.00" x2="156.00" y2="80.00" class="geom-line" />
    <line id="el-mag-E" data-ref="E" data-aliases="/ E /" data-type="segment" x1="204.00" y1="14.00" x2="233.00" y2="14.00" class="geom-line" />
    <line id="el-mag-F" data-ref="F" data-aliases="/ F /" data-type="segment" x1="205.00" y1="38.00" x2="245.00" y2="38.00" class="geom-line" />
    <line id="el-mag-G" data-ref="G" data-aliases="/ G /" data-type="segment" x1="204.00" y1="58.00" x2="253.00" y2="58.00" class="geom-line" />
    <line id="el-mag-H" data-ref="H" data-aliases="/ H /" data-type="segment" x1="204.00" y1="82.00" x2="263.00" y2="82.00" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
