    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /" x1="26.00" y1="58.00" x2="124.00" y2="58.00" class="geom-line geom-overlay" />
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="27.00" y1="80.00" x2="156.00" y2="80.00" class="geom-line geom-overlay" />
    <line id="hl-mag-E" data-ref="E" data-aliases="/ E /" x1="204.00" y1="14.00" x2="233.00" y2="14.00" class="geom-line geom-overlay" />
    <line id="hl-mag-F" data-ref="F" data-aliases="/ F /" x1="205.00" y1="38.00" x2="245.00" y2="38.00" class="geom-line geom-overlay" />
    <line id="hl-mag-G" data-ref="G" data-aliases="/ G /" x1="204.00" y1="58.00" x2="253.00" y2="58.00" class="geom-line geom-overlay" />
    <line id="hl-mag-H" data-ref="H" data-aliases="/ H /" x1="204.00" y1="82.00" x2="263.00" y2="82.00" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
