<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 325 170" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="325" height="170" fill="#ffffff"/>
  <line x1="29" y1="15" x2="71" y2="15" class="geometry interactive"/>
  <circle cx="29" cy="15" r="2.5" class="point"/>
  <circle cx="71" cy="15" r="2.5" class="point"/>
  <text x="82" y="15" class="label">A</text>
  <line x1="120" y1="15" x2="180" y2="15" class="geometry interactive"/>
  <circle cx="120" cy="15" r="2.5" class="point"/>
  <circle cx="180" cy="15" r="2.5" class="point"/>
  <text x="191" y="15" class="label">C</text>
  <line x1="27" y1="45" x2="81" y2="45" class="geometry interactive"/>
  <circle cx="27" cy="45" r="2.5" class="point"/>
  <circle cx="81" cy="45" r="2.5" class="point"/>
  <text x="92" y="45" class="label">B</text>
  <line x1="120" y1="45" x2="202" y2="45" class="geometry interactive"/>
  <circle cx="120" cy="45" r="2.5" class="point"/>
  <circle cx="202" cy="45" r="2.5" class="point"/>
  <text x="213" y="45" class="label">D</text>
  <line x1="48" y1="72" x2="161" y2="72" class="geometry interactive"/>
  <circle cx="48" cy="72" r="2.5" class="point"/>
  <circle cx="161" cy="72" r="2.5" class="point"/>
  <text x="172" y="72" class="label">E</text>
  <line x1="38" y1="100" x2="140" y2="100" class="geometry interactive"/>
  <circle cx="38" cy="100" r="2.5" class="point"/>
  <circle cx="140" cy="100" r="2.5" class="point"/>
  <text x="27" y="100" class="label">F</text>
  <line x1="178" y1="100" x2="304" y2="100" class="geometry interactive"/>
  <circle cx="178" cy="100" r="2.5" class="point"/>
  <circle cx="304" cy="100" r="2.5" class="point"/>
  <text x="315" y="100" class="label">G</text>
  <line x1="55" y1="126" x2="240" y2="126" class="geometry interactive"/>
  <circle cx="55" cy="126" r="2.5" class="point"/>
  <circle cx="240" cy="126" r="2.5" class="point"/>
  <text x="251" y="126" class="label">H</text>
  <line x1="64" y1="154" x2="224" y2="154" class="geometry interactive"/>
  <circle cx="64" cy="154" r="2.5" class="point"/>
  <circle cx="224" cy="154" r="2.5" class="point"/>
  <text x="235" y="154" class="label">K</text>
</svg>
