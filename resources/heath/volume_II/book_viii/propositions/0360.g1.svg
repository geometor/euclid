  <text x="120" y="61" class="label">D</text>
  <line x1="26" y1="83" x2="48" y2="83" class="geometry interactive"/>
  <circle cx="26" cy="83" r="2.5" class="point"/>
  <circle cx="48" cy="83" r="2.5" class="point"/>
  <text x="59" y="83" class="label">E</text>
  <line x1="129" y1="83" x2="155" y2="83" class="geometry interactive"/>
  <circle cx="129" cy="83" r="2.5" class="point"/>
