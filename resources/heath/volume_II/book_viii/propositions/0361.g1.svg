<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 365 195" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="365" height="195" fill="#ffffff"/>
  <line x1="30" y1="15" x2="92" y2="15" class="geometry interactive"/>
  <circle cx="30" cy="15" r="2.5" class="point"/>
  <circle cx="92" cy="15" r="2.5" class="point"/>
  <text x="103" y="15" class="label">A</text>
  <line x1="31" y1="39" x2="124" y2="39" class="geometry interactive"/>
  <circle cx="31" cy="39" r="2.5" class="point"/>
  <circle cx="124" cy="39" r="2.5" class="point"/>
  <text x="135" y="39" class="label">B</text>
  <line x1="29" y1="59" x2="167" y2="59" class="geometry interactive"/>
  <circle cx="29" cy="59" r="2.5" class="point"/>
  <circle cx="167" cy="59" r="2.5" class="point"/>
  <text x="178" y="59" class="label">C</text>
  <line x1="28" y1="89" x2="243" y2="89" class="geometry interactive"/>
  <circle cx="28" cy="89" r="2.5" class="point"/>
  <circle cx="243" cy="89" r="2.5" class="point"/>
  <text x="254" y="89" class="label">D</text>
  <line x1="27" y1="117" x2="353" y2="117" class="geometry interactive"/>
  <circle cx="27" cy="117" r="2.5" class="point"/>
  <circle cx="353" cy="117" r="2.5" class="point"/>
  <text x="364" y="117" class="label">E</text>
  <line x1="29" y1="141" x2="59" y2="141" class="geometry interactive"/>
  <circle cx="29" cy="141" r="2.5" class="point"/>
  <circle cx="59" cy="141" r="2.5" class="point"/>
  <text x="70" y="141" class="label">F</text>
  <line x1="26" y1="161" x2="78" y2="161" class="geometry interactive"/>
  <circle cx="26" cy="161" r="2.5" class="point"/>
  <circle cx="78" cy="161" r="2.5" class="point"/>
  <text x="89" y="161" class="label">G</text>
  <line x1="27" y1="179" x2="98" y2="179" class="geometry interactive"/>
  <circle cx="27" cy="179" r="2.5" class="point"/>
  <circle cx="98" cy="179" r="2.5" class="point"/>
  <text x="109" y="179" class="label">H</text>
</svg>
