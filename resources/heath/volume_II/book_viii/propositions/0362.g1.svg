<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285 110" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="285" height="110" fill="#ffffff"/>
  <line x1="31" y1="15" x2="65" y2="15" class="geometry interactive"/>
  <circle cx="31" cy="15" r="2.5" class="point"/>
  <circle cx="65" cy="15" r="2.5" class="point"/>
  <text x="20" y="15" class="label">A</text>
  <line x1="28" y1="41" x2="90" y2="41" class="geometry interactive"/>
  <circle cx="28" cy="41" r="2.5" class="point"/>
  <circle cx="90" cy="41" r="2.5" class="point"/>
  <text x="17" y="41" class="label">B</text>
  <line x1="28" y1="67" x2="154" y2="67" class="geometry interactive"/>
  <circle cx="28" cy="67" r="2.5" class="point"/>
  <circle cx="154" cy="67" r="2.5" class="point"/>
  <text x="17" y="67" class="label">C</text>
  <line x1="24" y1="93" x2="275" y2="93" class="geometry interactive"/>
  <circle cx="24" cy="93" r="2.5" class="point"/>
  <circle cx="275" cy="93" r="2.5" class="point"/>
  <text x="13" y="93" class="label">D</text>
</svg>
