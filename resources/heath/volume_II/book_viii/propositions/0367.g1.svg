  <circle cx="57" cy="114" r="2.5" class="point"/>
  <text x="15" y="114" class="label">F</text>
  <line x1="25" y1="139" x2="97" y2="139" class="geometry interactive"/>
  <circle cx="25" cy="139" r="2.5" class="point"/>
  <circle cx="97" cy="139" r="2.5" class="point"/>
  <text x="14" y="139" class="label">G</text>
  <line x1="161" y1="16" x2="227" y2="16" class="geometry interactive"/>
  <circle cx="161" cy="16" r="2.5" class="point"/>
  <circle cx="227" cy="16" r="2.5" class="point"/>
  <text x="150" y="16" class="label">A</text>
  <line x1="160" y1="37" x2="388" y2="37" class="geometry interactive"/>
  <circle cx="160" cy="37" r="2.5" class="point"/>
  <circle cx="388" cy="37" r="2.5" class="point"/>
  <text x="149" y="37" class="label">B</text>
  <line x1="180" y1="88" x2="243" y2="88" class="geometry interactive"/>
  <circle cx="180" cy="88" r="2.5" class="point"/>
  <circle cx="243" cy="88" r="2.5" class="point"/>
  <text x="169" y="88" class="label">H</text>
  <line x1="190" y1="112" x2="290" y2="112" class="geometry interactive"/>
  <circle cx="190" cy="112" r="2.5" class="point"/>
