<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 108" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="188" height="108" fill="#ffffff"/>
  <line x1="26" y1="15" x2="89" y2="15" class="geometry interactive"/>
  <circle cx="26" cy="15" r="2.5" class="point"/>
  <circle cx="89" cy="15" r="2.5" class="point"/>
  <text x="15" y="15" class="label">A</text>
  <line x1="23" y1="41" x2="165" y2="41" class="geometry interactive"/>
  <circle cx="23" cy="41" r="2.5" class="point"/>
  <circle cx="165" cy="41" r="2.5" class="point"/>
  <text x="12" y="41" class="label">B</text>
  <line x1="24" y1="65" x2="58" y2="65" class="geometry interactive"/>
  <circle cx="24" cy="65" r="2.5" class="point"/>
  <circle cx="58" cy="65" r="2.5" class="point"/>
  <text x="13" y="65" class="label">C</text>
  <line x1="130" y1="65" x2="176" y2="65" class="geometry interactive"/>
  <circle cx="130" cy="65" r="2.5" class="point"/>
  <circle cx="176" cy="65" r="2.5" class="point"/>
  <text x="119" y="65" class="label">D</text>
  <line x1="24" y1="91" x2="118" y2="91" class="geometry interactive"/>
  <circle cx="24" cy="91" r="2.5" class="point"/>
  <circle cx="118" cy="91" r="2.5" class="point"/>
  <text x="13" y="91" class="label">E</text>
</svg>
