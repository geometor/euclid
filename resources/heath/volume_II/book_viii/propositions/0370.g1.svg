<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 105" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="400" height="105" fill="#ffffff"/>
  <line x1="23" y1="17" x2="90" y2="17" class="geometry interactive"/>
  <circle cx="23" cy="17" r="2.5" class="point"/>
  <circle cx="90" cy="17" r="2.5" class="point"/>
  <text x="12" y="17" class="label">A</text>
  <line x1="22" y1="40" x2="261" y2="40" class="geometry interactive"/>
  <circle cx="22" cy="40" r="2.5" class="point"/>
  <circle cx="261" cy="40" r="2.5" class="point"/>
  <text x="11" y="40" class="label">B</text>
  <line x1="63" y1="66" x2="86" y2="66" class="geometry interactive"/>
  <circle cx="63" cy="66" r="2.5" class="point"/>
  <circle cx="86" cy="66" r="2.5" class="point"/>
  <text x="52" y="66" class="label">C</text>
  <line x1="61" y1="90" x2="93" y2="90" class="geometry interactive"/>
  <circle cx="61" cy="90" r="2.5" class="point"/>
  <circle cx="93" cy="90" r="2.5" class="point"/>
  <text x="50" y="90" class="label">D</text>
  <line x1="165" y1="66" x2="244" y2="66" class="geometry interactive"/>
  <circle cx="165" cy="66" r="2.5" class="point"/>
  <circle cx="244" cy="66" r="2.5" class="point"/>
  <text x="154" y="66" class="label">H</text>
  <line x1="163" y1="90" x2="304" y2="90" class="geometry interactive"/>
  <circle cx="163" cy="90" r="2.5" class="point"/>
  <circle cx="304" cy="90" r="2.5" class="point"/>
  <text x="152" y="90" class="label">K</text>
  <line x1="327" y1="15" x2="364" y2="15" class="geometry interactive"/>
  <circle cx="327" cy="15" r="2.5" class="point"/>
  <circle cx="364" cy="15" r="2.5" class="point"/>
  <text x="316" y="15" class="label">E</text>
  <line x1="328" y1="39" x2="379" y2="39" class="geometry interactive"/>
  <circle cx="328" cy="39" r="2.5" class="point"/>
  <circle cx="379" cy="39" r="2.5" class="point"/>
  <text x="317" y="39" class="label">F</text>
  <line x1="329" y1="66" x2="387" y2="66" class="geometry interactive"/>
  <circle cx="329" cy="66" r="2.5" class="point"/>
  <circle cx="387" cy="66" r="2.5" class="point"/>
  <text x="318" y="66" class="label">G</text>
</svg>
