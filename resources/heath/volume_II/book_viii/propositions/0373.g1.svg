<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 102" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="165" height="102" fill="#ffffff"/>
  <line x1="25" y1="15" x2="62" y2="15" class="geometry interactive"/>
  <circle cx="25" cy="15" r="2.5" class="point"/>
  <circle cx="62" cy="15" r="2.5" class="point"/>
  <text x="14" y="15" class="label">A</text>
  <line x1="25" y1="39" x2="148" y2="39" class="geometry interactive"/>
  <circle cx="25" cy="39" r="2.5" class="point"/>
  <circle cx="148" cy="39" r="2.5" class="point"/>
  <text x="14" y="39" class="label">B</text>
  <line x1="27" y1="62" x2="52" y2="62" class="geometry interactive"/>
  <circle cx="27" cy="62" r="2.5" class="point"/>
  <circle cx="52" cy="62" r="2.5" class="point"/>
  <text x="16" y="62" class="label">C</text>
  <line x1="110" y1="62" x2="150" y2="62" class="geometry interactive"/>
  <circle cx="110" cy="62" r="2.5" class="point"/>
  <circle cx="150" cy="62" r="2.5" class="point"/>
  <text x="99" y="62" class="label">D</text>
  <line x1="61" y1="87" x2="125" y2="87" class="geometry interactive"/>
  <circle cx="61" cy="87" r="2.5" class="point"/>
  <circle cx="125" cy="87" r="2.5" class="point"/>
  <text x="50" y="87" class="label">E</text>
</svg>
