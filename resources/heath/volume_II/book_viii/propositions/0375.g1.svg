<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 174" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="375" height="174" fill="#ffffff"/>
  <line x1="26" y1="16" x2="61" y2="16" class="geometry interactive"/>
  <circle cx="26" cy="16" r="2.5" class="point"/>
  <circle cx="61" cy="16" r="2.5" class="point"/>
  <text x="15" y="16" class="label">A</text>
  <line x1="28" y1="40" x2="282" y2="40" class="geometry interactive"/>
  <circle cx="28" cy="40" r="2.5" class="point"/>
  <circle cx="282" cy="40" r="2.5" class="point"/>
  <text x="17" y="40" class="label">B</text>
  <line x1="26" y1="63" x2="48" y2="63" class="geometry interactive"/>
  <circle cx="26" cy="63" r="2.5" class="point"/>
  <circle cx="48" cy="63" r="2.5" class="point"/>
  <text x="15" y="63" class="label">C</text>
  <line x1="22" y1="88" x2="47" y2="88" class="geometry interactive"/>
  <circle cx="22" cy="88" r="2.5" class="point"/>
  <circle cx="47" cy="88" r="2.5" class="point"/>
  <text x="11" y="88" class="label">D</text>
  <line x1="31" y1="110" x2="51" y2="110" class="geometry interactive"/>
  <circle cx="31" cy="110" r="2.5" class="point"/>
  <circle cx="51" cy="110" r="2.5" class="point"/>
  <text x="20" y="110" class="label">E</text>
  <line x1="28" y1="133" x2="97" y2="133" class="geometry interactive"/>
  <circle cx="28" cy="133" r="2.5" class="point"/>
  <circle cx="97" cy="133" r="2.5" class="point"/>
  <text x="17" y="133" class="label">G</text>
  <line x1="29" y1="158" x2="65" y2="158" class="geometry interactive"/>
  <circle cx="29" cy="158" r="2.5" class="point"/>
  <circle cx="65" cy="158" r="2.5" class="point"/>
  <text x="18" y="158" class="label">F</text>
  <line x1="227" y1="64" x2="297" y2="64" class="geometry interactive"/>
  <circle cx="227" cy="64" r="2.5" class="point"/>
  <circle cx="297" cy="64" r="2.5" class="point"/>
  <text x="216" y="64" class="label">H</text>
  <line x1="228" y1="88" x2="361" y2="88" class="geometry interactive"/>
  <circle cx="228" cy="88" r="2.5" class="point"/>
  <circle cx="361" cy="88" r="2.5" class="point"/>
  <text x="217" y="88" class="label">K</text>
</svg>
