<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 102" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="180" height="102" fill="#ffffff"/>
  <line x1="27" y1="13" x2="88" y2="13" class="geometry interactive"/>
  <circle cx="27" cy="13" r="2.5" class="point"/>
  <circle cx="88" cy="13" r="2.5" class="point"/>
  <text x="16" y="13" class="label">A</text>
  <line x1="25" y1="39" x2="168" y2="39" class="geometry interactive"/>
  <circle cx="25" cy="39" r="2.5" class="point"/>
  <circle cx="168" cy="39" r="2.5" class="point"/>
  <text x="14" y="39" class="label">B</text>
  <line x1="26" y1="63" x2="59" y2="63" class="geometry interactive"/>
  <circle cx="26" cy="63" r="2.5" class="point"/>
  <circle cx="59" cy="63" r="2.5" class="point"/>
  <text x="15" y="63" class="label">C</text>
  <line x1="27" y1="88" x2="68" y2="88" class="geometry interactive"/>
  <circle cx="27" cy="88" r="2.5" class="point"/>
  <circle cx="68" cy="88" r="2.5" class="point"/>
  <text x="16" y="88" class="label">D</text>
</svg>
