<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 90" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="245" height="90" fill="#ffffff"/>
  <line x1="21" y1="13" x2="82" y2="13" class="geometry interactive"/>
  <circle cx="21" cy="13" r="2.5" class="point"/>
  <circle cx="82" cy="13" r="2.5" class="point"/>
  <text x="10" y="13" class="label">A</text>
  <line x1="21" y1="33" x2="232" y2="33" class="geometry interactive"/>
  <circle cx="21" cy="33" r="2.5" class="point"/>
  <circle cx="232" cy="33" r="2.5" class="point"/>
  <text x="10" y="33" class="label">B</text>
  <line x1="22" y1="54" x2="42" y2="54" class="geometry interactive"/>
  <circle cx="22" cy="54" r="2.5" class="point"/>
  <circle cx="42" cy="54" r="2.5" class="point"/>
  <text x="11" y="54" class="label">C</text>
  <line x1="23" y1="73" x2="48" y2="73" class="geometry interactive"/>
  <circle cx="23" cy="73" r="2.5" class="point"/>
  <circle cx="48" cy="73" r="2.5" class="point"/>
  <text x="12" y="73" class="label">D</text>
</svg>
