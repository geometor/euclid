    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /" x1="361.00" y1="15.00" x2="388.00" y2="15.00" class="geom-line geom-overlay" />
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="361.00" y1="39.00" x2="399.00" y2="39.00" class="geom-line geom-overlay" />
    <line id="hl-mag-E" data-ref="E" data-aliases="/ E /" x1="329.00" y1="63.00" x2="379.00" y2="63.00" class="geom-line geom-overlay" />
    <line id="hl-mag-F" data-ref="F" data-aliases="/ F /" x1="330.00" y1="85.00" x2="406.00" y2="85.00" class="geom-line geom-overlay" />
