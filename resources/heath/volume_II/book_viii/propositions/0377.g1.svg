    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="22.00" y1="41.00" x2="308.00" y2="41.00" class="geom-line" />
    <line id="el-mag-G" data-ref="G" data-aliases="/ G /" data-type="segment" x1="25.00" y1="77.00" x2="165.00" y2="77.00" class="geom-line" />
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="361.00" y1="15.00" x2="388.00" y2="15.00" class="geom-line" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="361.00" y1="39.00" x2="399.00" y2="39.00" class="geom-line" />
    <line id="el-mag-E" data-ref="E" data-aliases="/ E /" data-type="segment" x1="329.00" y1="63.00" x2="379.00" y2="63.00" class="geom-line" />
    <line id="el-mag-F" data-ref="F" data-aliases="/ F /" data-type="segment" x1="330.00" y1="85.00" x2="406.00" y2="85.00" class="geom-line" />
