<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 102" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="420" height="102" fill="#ffffff"/>
  <line x1="22" y1="16" x2="92" y2="16" class="geometry interactive"/>
  <circle cx="22" cy="16" r="2.5" class="point"/>
  <circle cx="92" cy="16" r="2.5" class="point"/>
  <text x="11" y="16" class="label">A</text>
  <line x1="22" y1="41" x2="308" y2="41" class="geometry interactive"/>
  <circle cx="22" cy="41" r="2.5" class="point"/>
  <circle cx="308" cy="41" r="2.5" class="point"/>
  <text x="11" y="41" class="label">B</text>
  <line x1="25" y1="77" x2="165" y2="77" class="geometry interactive"/>
  <circle cx="25" cy="77" r="2.5" class="point"/>
  <circle cx="165" cy="77" r="2.5" class="point"/>
  <text x="14" y="77" class="label">G</text>
  <line x1="361" y1="15" x2="388" y2="15" class="geometry interactive"/>
  <circle cx="361" cy="15" r="2.5" class="point"/>
  <circle cx="388" cy="15" r="2.5" class="point"/>
  <text x="350" y="15" class="label">C</text>
  <line x1="361" y1="39" x2="399" y2="39" class="geometry interactive"/>
  <circle cx="361" cy="39" r="2.5" class="point"/>
  <circle cx="399" cy="39" r="2.5" class="point"/>
  <text x="350" y="39" class="label">D</text>
  <line x1="329" y1="63" x2="379" y2="63" class="geometry interactive"/>
  <circle cx="329" cy="63" r="2.5" class="point"/>
  <circle cx="379" cy="63" r="2.5" class="point"/>
  <text x="318" y="63" class="label">E</text>
  <line x1="330" y1="85" x2="406" y2="85" class="geometry interactive"/>
  <circle cx="330" cy="85" r="2.5" class="point"/>
  <circle cx="406" cy="85" r="2.5" class="point"/>
  <text x="319" y="85" class="label">F</text>
</svg>
