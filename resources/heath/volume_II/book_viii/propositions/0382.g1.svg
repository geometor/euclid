<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 435 125" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="435" height="125" fill="#ffffff"/>
  <line x1="20" y1="15" x2="95" y2="15" class="geometry interactive"/>
  <circle cx="20" cy="15" r="2.5" class="point"/>
  <circle cx="95" cy="15" r="2.5" class="point"/>
  <text x="9" y="15" class="label">A</text>
  <line x1="24" y1="42" x2="311" y2="42" class="geometry interactive"/>
  <circle cx="24" cy="42" r="2.5" class="point"/>
  <circle cx="311" cy="42" r="2.5" class="point"/>
  <text x="13" y="42" class="label">B</text>
  <line x1="22" y1="63" x2="164" y2="63" class="geometry interactive"/>
  <circle cx="22" cy="63" r="2.5" class="point"/>
  <circle cx="164" cy="63" r="2.5" class="point"/>
  <text x="11" y="63" class="label">C</text>
  <line x1="91" y1="87" x2="129" y2="87" class="geometry interactive"/>
  <circle cx="91" cy="87" r="2.5" class="point"/>
  <circle cx="129" cy="87" r="2.5" class="point"/>
  <text x="80" y="87" class="label">F</text>
  <line x1="92" y1="107" x2="164" y2="107" class="geometry interactive"/>
  <circle cx="92" cy="107" r="2.5" class="point"/>
  <circle cx="164" cy="107" r="2.5" class="point"/>
  <text x="81" y="107" class="label">G</text>
  <line x1="352" y1="15" x2="388" y2="15" class="geometry interactive"/>
  <circle cx="352" cy="15" r="2.5" class="point"/>
  <circle cx="388" cy="15" r="2.5" class="point"/>
  <text x="341" y="15" class="label">D</text>
  <line x1="351" y1="42" x2="423" y2="42" class="geometry interactive"/>
  <circle cx="351" cy="42" r="2.5" class="point"/>
  <circle cx="423" cy="42" r="2.5" class="point"/>
  <text x="340" y="42" class="label">E</text>
</svg>
