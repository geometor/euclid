<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 90" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="240" height="90" fill="#ffffff"/>
  <line x1="19" y1="14" x2="86" y2="14" class="geometry interactive"/>
  <circle cx="19" cy="14" r="2.5" class="point"/>
  <circle cx="86" cy="14" r="2.5" class="point"/>
  <text x="8" y="14" class="label">A</text>
  <line x1="21" y1="34" x2="120" y2="34" class="geometry interactive"/>
  <circle cx="21" cy="34" r="2.5" class="point"/>
  <circle cx="120" cy="34" r="2.5" class="point"/>
  <text x="10" y="34" class="label">B</text>
  <line x1="22" y1="54" x2="162" y2="54" class="geometry interactive"/>
  <circle cx="22" cy="54" r="2.5" class="point"/>
  <circle cx="162" cy="54" r="2.5" class="point"/>
  <text x="11" y="54" class="label">C</text>
  <line x1="23" y1="75" x2="230" y2="75" class="geometry interactive"/>
  <circle cx="23" cy="75" r="2.5" class="point"/>
  <circle cx="230" cy="75" r="2.5" class="point"/>
  <text x="12" y="75" class="label">D</text>
</svg>
