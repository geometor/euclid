<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 90" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="200" height="90" fill="#ffffff"/>
  <line x1="23" y1="15" x2="146" y2="15" class="geometry interactive"/>
  <circle cx="23" cy="15" r="2.5" class="point"/>
  <circle cx="146" cy="15" r="2.5" class="point"/>
  <text x="12" y="15" class="label">A</text>
  <line x1="24" y1="36" x2="188" y2="36" class="geometry interactive"/>
  <circle cx="24" cy="36" r="2.5" class="point"/>
  <circle cx="188" cy="36" r="2.5" class="point"/>
  <text x="13" y="36" class="label">B</text>
  <line x1="24" y1="55" x2="78" y2="55" class="geometry interactive"/>
  <circle cx="24" cy="55" r="2.5" class="point"/>
  <circle cx="78" cy="55" r="2.5" class="point"/>
  <text x="13" y="55" class="label">C</text>
  <line x1="25" y1="75" x2="96" y2="75" class="geometry interactive"/>
  <circle cx="25" cy="75" r="2.5" class="point"/>
  <circle cx="96" cy="75" r="2.5" class="point"/>
  <text x="14" y="75" class="label">D</text>
</svg>
