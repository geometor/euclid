<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 95" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="395" height="95" fill="#ffffff"/>
  <line x1="22" y1="14" x2="66" y2="14" class="geometry interactive"/>
  <circle cx="22" cy="14" r="2.5" class="point"/>
  <circle cx="66" cy="14" r="2.5" class="point"/>
  <text x="11" y="14" class="label">A</text>
  <line x1="21" y1="37" x2="153" y2="37" class="geometry interactive"/>
  <circle cx="21" cy="37" r="2.5" class="point"/>
  <circle cx="153" cy="37" r="2.5" class="point"/>
  <text x="10" y="37" class="label">B</text>
  <line x1="22" y1="58" x2="88" y2="58" class="geometry interactive"/>
  <circle cx="22" cy="58" r="2.5" class="point"/>
  <circle cx="88" cy="58" r="2.5" class="point"/>
  <text x="11" y="58" class="label">C</text>
  <line x1="22" y1="80" x2="229" y2="80" class="geometry interactive"/>
  <circle cx="22" cy="80" r="2.5" class="point"/>
  <circle cx="229" cy="80" r="2.5" class="point"/>
  <text x="11" y="80" class="label">D</text>
  <line x1="290" y1="14" x2="356" y2="14" class="geometry interactive"/>
  <circle cx="290" cy="14" r="2.5" class="point"/>
  <circle cx="356" cy="14" r="2.5" class="point"/>
  <text x="279" y="14" class="label">E</text>
  <line x1="290" y1="37" x2="382" y2="37" class="geometry interactive"/>
  <circle cx="290" cy="37" r="2.5" class="point"/>
  <circle cx="382" cy="37" r="2.5" class="point"/>
  <text x="279" y="37" class="label">F</text>
</svg>
