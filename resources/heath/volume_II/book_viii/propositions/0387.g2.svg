<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 85" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="445" height="85" fill="#ffffff"/>
  <line x1="25" y1="14" x2="95" y2="14" class="geometry interactive"/>
  <circle cx="25" cy="14" r="2.5" class="point"/>
  <circle cx="95" cy="14" r="2.5" class="point"/>
  <text x="14" y="14" class="label">A</text>
  <line x1="144" y1="14" x2="431" y2="14" class="geometry interactive"/>
  <circle cx="144" cy="14" r="2.5" class="point"/>
  <circle cx="431" cy="14" r="2.5" class="point"/>
  <text x="133" y="14" class="label">B</text>
  <line x1="112" y1="44" x2="253" y2="44" class="geometry interactive"/>
  <circle cx="112" cy="44" r="2.5" class="point"/>
  <circle cx="253" cy="44" r="2.5" class="point"/>
  <text x="101" y="44" class="label">C</text>
  <line x1="19" y1="68" x2="58" y2="68" class="geometry interactive"/>
  <circle cx="19" cy="68" r="2.5" class="point"/>
  <circle cx="58" cy="68" r="2.5" class="point"/>
  <text x="8" y="68" class="label">D</text>
  <line x1="114" y1="68" x2="181" y2="68" class="geometry interactive"/>
  <circle cx="114" cy="68" r="2.5" class="point"/>
  <circle cx="181" cy="68" r="2.5" class="point"/>
  <text x="103" y="68" class="label">E</text>
  <line x1="243" y1="68" x2="388" y2="68" class="geometry interactive"/>
  <circle cx="243" cy="68" r="2.5" class="point"/>
  <circle cx="388" cy="68" r="2.5" class="point"/>
  <text x="232" y="68" class="label">F</text>
</svg>
