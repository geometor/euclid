<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 545 87" width="100%" height="100%" class="euclid-diagram">
  <style>
    .euclid-diagram { font-family: "Times New Roman", Times, serif; }
    .geometry { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .construction { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4, 3; fill: none; stroke-linecap: round; }
    .point { fill: #000000; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .interactive { cursor: pointer; transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .interactive:hover { stroke: #0284c7; stroke-width: 2.5; }
  </style>
  <rect width="545" height="87" fill="#ffffff"/>
  <line x1="50" y1="15" x2="89" y2="15" class="geometry interactive"/>
  <circle cx="50" cy="15" r="2.5" class="point"/>
  <circle cx="89" cy="15" r="2.5" class="point"/>
  <text x="39" y="15" class="label">A</text>
  <line x1="387" y1="15" x2="462" y2="15" class="geometry interactive"/>
  <circle cx="387" cy="15" r="2.5" class="point"/>
  <circle cx="462" cy="15" r="2.5" class="point"/>
  <text x="376" y="15" class="label">C</text>
  <line x1="51" y1="40" x2="341" y2="40" class="geometry interactive"/>
  <circle cx="51" cy="40" r="2.5" class="point"/>
  <circle cx="341" cy="40" r="2.5" class="point"/>
  <text x="40" y="40" class="label">B</text>
  <line x1="387" y1="40" x2="531" y2="40" class="geometry interactive"/>
  <circle cx="387" cy="40" r="2.5" class="point"/>
  <circle cx="531" cy="40" r="2.5" class="point"/>
  <text x="376" y="40" class="label">D</text>
  <line x1="23" y1="69" x2="46" y2="69" class="geometry interactive"/>
  <circle cx="23" cy="69" r="2.5" class="point"/>
  <circle cx="46" cy="69" r="2.5" class="point"/>
  <text x="12" y="69" class="label">E</text>
  <line x1="98" y1="69" x2="135" y2="69" class="geometry interactive"/>
  <circle cx="98" cy="69" r="2.5" class="point"/>
  <circle cx="135" cy="69" r="2.5" class="point"/>
  <text x="87" y="69" class="label">F</text>
  <line x1="202" y1="69" x2="275" y2="69" class="geometry interactive"/>
  <circle cx="202" cy="69" r="2.5" class="point"/>
  <circle cx="275" cy="69" r="2.5" class="point"/>
  <text x="191" y="69" class="label">G</text>
  <line x1="334" y1="69" x2="478" y2="69" class="geometry interactive"/>
  <circle cx="334" cy="69" r="2.5" class="point"/>
  <circle cx="478" cy="69" r="2.5" class="point"/>
  <text x="323" y="69" class="label">H</text>
</svg>
