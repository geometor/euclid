<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 170" width="170" height="170" class="euclid-graphic" data-graphic-id="0519.g1" data-folio="0519" data-graphic="g1" data-proposition="XIV.3">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line, .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #000000;
      stroke-width: 1.5;
      stroke-dasharray: 4,3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <circle id="el-cir-ABCDE" data-ref="( A B C D E )" data-aliases="( F A ) | ( F C ) | ( F D )" data-type="circle" cx="85.0" cy="89.0" r="70.0" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Polygons, Segments) -->
  <g id="graphics">
    <polygon id="el-poly-ABCDE" data-ref="&lt; A B C D E &gt;" data-aliases="&lt; B C D E A &gt; | &lt; C D E A B &gt; | &lt; D E A B C &gt; | &lt; E A B C D &gt;" data-type="polygon" points="85.0,19.0 18.0,67.0 44.0,146.0 126.0,146.0 152.0,67.0" class="geom-polygon" />
    <polygon id="el-poly-CDF" data-ref="&lt; C D F &gt;" data-aliases="&lt; D C F &gt; | &lt; F C D &gt; | &lt; F D C &gt;" data-type="polygon" points="44.0,146.0 126.0,146.0 85.0,89.0" class="geom-polygon" />
    <polygon id="el-poly-CFG" data-ref="&lt; C F G &gt;" data-aliases="&lt; F C G &gt; | &lt; G C F &gt;" data-type="polygon" points="44.0,146.0 85.0,89.0 85.0,146.0" class="geom-polygon" />
    <polygon id="el-poly-DFG" data-ref="&lt; D F G &gt;" data-aliases="&lt; F D G &gt; | &lt; G D F &gt;" data-type="polygon" points="126.0,146.0 85.0,89.0 85.0,146.0" class="geom-polygon" />

    <!-- Pentagon Sides and Sub-segments -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="85.0" y1="19.0" x2="18.0" y2="67.0" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="18.0" y1="67.0" x2="44.0" y2="146.0" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="44.0" y1="146.0" x2="126.0" y2="146.0" class="geom-line" />
    <line id="el-seg-CG" data-ref="/ C G /" data-aliases="/ G C /" data-type="segment" x1="44.0" y1="146.0" x2="85.0" y2="146.0" class="geom-line" />
    <line id="el-seg-GD" data-ref="/ G D /" data-aliases="/ D G /" data-type="segment" x1="85.0" y1="146.0" x2="126.0" y2="146.0" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="126.0" y1="146.0" x2="152.0" y2="67.0" class="geom-line" />
    <line id="el-seg-EA" data-ref="/ E A /" data-aliases="/ A E /" data-type="segment" x1="152.0" y1="67.0" x2="85.0" y2="19.0" class="geom-line" />

    <!-- Radii CF, FD and Perpendicular FG -->
    <line id="el-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" data-type="segment" x1="44.0" y1="146.0" x2="85.0" y2="89.0" class="geom-line" />
    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" data-type="segment" x1="85.0" y1="89.0" x2="126.0" y2="146.0" class="geom-line" />
    <line id="el-seg-FG" data-ref="/ F G /" data-aliases="/ G F /" data-type="segment" x1="85.0" y1="89.0" x2="85.0" y2="146.0" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
