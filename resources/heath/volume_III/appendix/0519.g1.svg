    <polygon id="hl-poly-ABCDE" data-ref="&lt; A B C D E &gt;" data-aliases="&lt; B C D E A &gt; | &lt; C D E A B &gt; | &lt; D E A B C &gt; | &lt; E A B C D &gt;" points="85.0,19.0 18.0,67.0 44.0,146.0 126.0,146.0 152.0,67.0" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-CDF" data-ref="&lt; C D F &gt;" data-aliases="&lt; D C F &gt; | &lt; F C D &gt; | &lt; F D C &gt;" points="44.0,146.0 126.0,146.0 85.0,89.0" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-CFG" data-ref="&lt; C F G &gt;" data-aliases="&lt; F C G &gt; | &lt; G C F &gt;" points="44.0,146.0 85.0,89.0 85.0,146.0" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-DFG" data-ref="&lt; D F G &gt;" data-aliases="&lt; F D G &gt; | &lt; G D F &gt;" points="126.0,146.0 85.0,89.0 85.0,146.0" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="85.0" y1="19.0" x2="18.0" y2="67.0" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="18.0" y1="67.0" x2="44.0" y2="146.0" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="44.0" y1="146.0" x2="126.0" y2="146.0" class="geom-line geom-overlay" />
    <line id="hl-seg-CG" data-ref="/ C G /" data-aliases="/ G C /" x1="44.0" y1="146.0" x2="85.0" y2="146.0" class="geom-line geom-overlay" />
    <line id="hl-seg-GD" data-ref="/ G D /" data-aliases="/ D G /" x1="85.0" y1="146.0" x2="126.0" y2="146.0" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="126.0" y1="146.0" x2="152.0" y2="67.0" class="geom-line geom-overlay" />
    <line id="hl-seg-EA" data-ref="/ E A /" data-aliases="/ A E /" x1="152.0" y1="67.0" x2="85.0" y2="19.0" class="geom-line geom-overlay" />

    <line id="hl-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" x1="44.0" y1="146.0" x2="85.0" y2="89.0" class="geom-line geom-overlay" />
    <line id="hl-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" x1="85.0" y1="89.0" x2="126.0" y2="146.0" class="geom-line geom-overlay" />
    <line id="hl-seg-FG" data-ref="/ F G /" data-aliases="/ G F /" x1="85.0" y1="89.0" x2="85.0" y2="146.0" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="85.0" cy="19.0" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="18.0" cy="67.0" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="44.0" cy="146.0" r="3.2" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="85.0" cy="146.0" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="126.0" cy="146.0" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="152.0" cy="67.0" r="3.2" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="85.0" cy="89.0" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="85.0" y="9.0" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="9.0" y="67.0" class="geom-label">B</text>
