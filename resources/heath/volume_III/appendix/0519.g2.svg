<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 158 168" width="158" height="168" class="euclid-graphic" data-graphic-id="0519.g2" data-folio="0519" data-graphic="g2" data-proposition="XIV.4">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line, .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #000000;
      stroke-width: 1.5;
      stroke-dasharray: 4,3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <circle id="el-cir-ABC" data-ref="( A B C )" data-aliases="( D A ) | ( D B ) | ( D C )" data-type="circle" cx="80.0" cy="88.0" r="68.0" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Polygons, Segments) -->
  <g id="graphics">
    <polygon id="el-poly-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; B C A &gt; | &lt; C A B &gt; | &lt; A C B &gt;" data-type="polygon" points="80.0,20.0 21.0,122.0 139.0,122.0" class="geom-polygon" />
    <polygon id="el-poly-DBC" data-ref="&lt; D B C &gt;" data-aliases="&lt; B D C &gt; | &lt; B C D &gt; | &lt; C D B &gt;" data-type="polygon" points="80.0,88.0 21.0,122.0 139.0,122.0" class="geom-polygon" />
    <polygon id="el-poly-DBE" data-ref="&lt; D B E &gt;" data-aliases="&lt; B D E &gt; | &lt; E B D &gt;" data-type="polygon" points="80.0,88.0 21.0,122.0 80.0,122.0" class="geom-polygon" />
    <polygon id="el-poly-DCE" data-ref="&lt; D C E &gt;" data-aliases="&lt; C D E &gt; | &lt; E C D &gt;" data-type="polygon" points="80.0,88.0 139.0,122.0 80.0,122.0" class="geom-polygon" />

    <!-- Triangle ABC Sides and Sub-segments -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="80.0" y1="20.0" x2="21.0" y2="122.0" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="21.0" y1="122.0" x2="139.0" y2="122.0" class="geom-line" />
    <line id="el-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" data-type="segment" x1="21.0" y1="122.0" x2="80.0" y2="122.0" class="geom-line" />
    <line id="el-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" data-type="segment" x1="80.0" y1="122.0" x2="139.0" y2="122.0" class="geom-line" />
    <line id="el-seg-CA" data-ref="/ C A /" data-aliases="/ A C /" data-type="segment" x1="139.0" y1="122.0" x2="80.0" y2="20.0" class="geom-line" />

    <!-- Radii DB, DC and Perpendicular DE -->
    <line id="el-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" data-type="segment" x1="80.0" y1="88.0" x2="21.0" y2="122.0" class="geom-line" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" data-type="segment" x1="80.0" y1="88.0" x2="139.0" y2="122.0" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="80.0" y1="88.0" x2="80.0" y2="122.0" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-cir-ABC" data-ref="( A B C )" data-aliases="( D A ) | ( D B ) | ( D C )" cx="80.0" cy="88.0" r="68.0" class="geom-circle geom-overlay" />

    <polygon id="hl-poly-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; B C A &gt; | &lt; C A B &gt; | &lt; A C B &gt;" points="80.0,20.0 21.0,122.0 139.0,122.0" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-DBC" data-ref="&lt; D B C &gt;" data-aliases="&lt; B D C &gt; | &lt; B C D &gt; | &lt; C D B &gt;" points="80.0,88.0 21.0,122.0 139.0,122.0" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-DBE" data-ref="&lt; D B E &gt;" data-aliases="&lt; B D E &gt; | &lt; E B D &gt;" points="80.0,88.0 21.0,122.0 80.0,122.0" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-DCE" data-ref="&lt; D C E &gt;" data-aliases="&lt; C D E &gt; | &lt; E C D &gt;" points="80.0,88.0 139.0,122.0 80.0,122.0" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="80.0" y1="20.0" x2="21.0" y2="122.0" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="21.0" y1="122.0" x2="139.0" y2="122.0" class="geom-line geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" x1="21.0" y1="122.0" x2="80.0" y2="122.0" class="geom-line geom-overlay" />
    <line id="hl-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" x1="80.0" y1="122.0" x2="139.0" y2="122.0" class="geom-line geom-overlay" />
    <line id="hl-seg-CA" data-ref="/ C A /" data-aliases="/ A C /" x1="139.0" y1="122.0" x2="80.0" y2="20.0" class="geom-line geom-overlay" />

    <line id="hl-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" x1="80.0" y1="88.0" x2="21.0" y2="122.0" class="geom-line geom-overlay" />
    <line id="hl-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" x1="80.0" y1="88.0" x2="139.0" y2="122.0" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="80.0" y1="88.0" x2="80.0" y2="122.0" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="80.0" cy="20.0" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="80.0" cy="88.0" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="21.0" cy="122.0" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="80.0" cy="122.0" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="139.0" cy="122.0" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="80.0" y="10.0" class="geom-label">A</text>
    <text id="lbl-D" data-ref="D" x="80.0" y="77.0" class="geom-label">D</text>
    <text id="lbl-B" data-ref="B" x="12.0" y="126.0" class="geom-label">B</text>
    <text id="lbl-E" data-ref="E" x="80.0" y="134.0" class="geom-label">E</text>
    <text id="lbl-C" data-ref="C" x="148.0" y="126.0" class="geom-label">C</text>
  </g>
</svg>
