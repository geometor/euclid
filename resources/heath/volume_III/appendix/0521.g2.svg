<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 174 226" width="174" height="226" class="euclid-graphic" data-graphic-id="0521.g2" data-folio="0521" data-graphic="g2" data-proposition="XIV.7">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line, .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #000000;
      stroke-width: 1.5;
      stroke-dasharray: 4,3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <circle id="el-cir-AHB" data-ref="( A H B )" data-aliases="( C B ) | ( C A ) | ( C H ) | ( A B H )" data-type="circle" cx="94.0" cy="88.0" r="68.0" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Segments) -->
  <g id="graphics">
    <!-- Radius C-D-B -->
    <line id="el-seg-CB" data-ref="/ C B /" data-aliases="/ B C / | / C D B /" data-type="segment" x1="94.0" y1="88.0" x2="162.0" y2="88.0" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="94.0" y1="88.0" x2="136.0" y2="88.0" class="geom-line" />
    <line id="el-seg-DB" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="136.0" y1="88.0" x2="162.0" y2="88.0" class="geom-line" />
    <line id="el-tick-D" x1="136.0" y1="84.0" x2="136.0" y2="92.0" class="geom-line" />

    <!-- Single-letter Magnitude Lines E, F, G -->
    <line id="el-seg-E" data-ref="E" data-aliases="/ E /" data-type="segment" x1="24.0" y1="175.0" x2="138.0" y2="175.0" class="geom-line" />
    <line id="el-seg-F" data-ref="F" data-aliases="/ F /" data-type="segment" x1="24.0" y1="194.0" x2="110.0" y2="194.0" class="geom-line" />
    <line id="el-seg-G" data-ref="G" data-aliases="/ G /" data-type="segment" x1="24.0" y1="213.0" x2="144.0" y2="213.0" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-cir-AHB" data-ref="( A H B )" data-aliases="( C B ) | ( C A ) | ( C H ) | ( A B H )" cx="94.0" cy="88.0" r="68.0" class="geom-circle geom-overlay" />

    <line id="hl-seg-CB" data-ref="/ C B /" data-aliases="/ B C / | / C D B /" x1="94.0" y1="88.0" x2="162.0" y2="88.0" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="94.0" y1="88.0" x2="136.0" y2="88.0" class="geom-line geom-overlay" />
    <line id="hl-seg-DB" data-ref="/ B D /" data-aliases="/ D B /" x1="136.0" y1="88.0" x2="162.0" y2="88.0" class="geom-line geom-overlay" />

    <line id="hl-seg-E" data-ref="E" data-aliases="/ E /" x1="24.0" y1="175.0" x2="138.0" y2="175.0" class="geom-line geom-overlay" />
    <line id="hl-seg-F" data-ref="F" data-aliases="/ F /" x1="24.0" y1="194.0" x2="110.0" y2="194.0" class="geom-line geom-overlay" />
    <line id="hl-seg-G" data-ref="G" data-aliases="/ G /" x1="24.0" y1="213.0" x2="144.0" y2="213.0" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="94.0" cy="20.0" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="94.0" cy="88.0" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="136.0" cy="88.0" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="162.0" cy="88.0" r="3.2" class="geom-point" />
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="94.0" cy="156.0" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="94.0" y="10.0" class="geom-label">A</text>
    <text id="lbl-C" data-ref="C" x="94.0" y="98.0" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="136.0" y="100.0" class="geom-label">D</text>
    <text id="lbl-B" data-ref="B" x="169.0" y="88.0" class="geom-label">B</text>
    <text id="lbl-H" data-ref="H" x="94.0" y="145.0" class="geom-label">H</text>
    <text id="lbl-E" data-ref="E" data-aliases="/ E /" x="13.0" y="175.0" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" data-aliases="/ F /" x="13.0" y="194.0" class="geom-label">F</text>
    <text id="lbl-G" data-ref="G" data-aliases="/ G /" x="13.0" y="213.0" class="geom-label">G</text>
  </g>
</svg>
