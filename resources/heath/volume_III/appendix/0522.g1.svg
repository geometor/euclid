<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 65" width="184" height="65" class="euclid-graphic" data-graphic-id="0522.g1" data-folio="0522" data-graphic="g1" data-proposition="XIV.8.Lemma">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line, .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #000000;
      stroke-width: 1.5;
      stroke-dasharray: 4,3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements" />

  <!-- Constructed Graphics (Segments) -->
  <g id="graphics">
    <!-- Upper Line A-C-B -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A / | / A C B /" data-type="segment" x1="14.0" y1="25.0" x2="168.0" y2="25.0" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="14.0" y1="25.0" x2="108.0" y2="25.0" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="108.0" y1="25.0" x2="168.0" y2="25.0" class="geom-line" />
    <line id="el-tick-C" x1="108.0" y1="21.0" x2="108.0" y2="29.0" class="geom-line" />

    <!-- Lower Line D-F-E -->
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D / | / D F E /" data-type="segment" x1="36.0" y1="54.0" x2="136.0" y2="54.0" class="geom-line" />
    <line id="el-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" data-type="segment" x1="36.0" y1="54.0" x2="98.0" y2="54.0" class="geom-line" />
    <line id="el-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" data-type="segment" x1="98.0" y1="54.0" x2="136.0" y2="54.0" class="geom-line" />
    <line id="el-tick-F" x1="98.0" y1="50.0" x2="98.0" y2="58.0" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A / | / A C B /" x1="14.0" y1="25.0" x2="168.0" y2="25.0" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="14.0" y1="25.0" x2="108.0" y2="25.0" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="108.0" y1="25.0" x2="168.0" y2="25.0" class="geom-line geom-overlay" />

    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D / | / D F E /" x1="36.0" y1="54.0" x2="136.0" y2="54.0" class="geom-line geom-overlay" />
    <line id="hl-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" x1="36.0" y1="54.0" x2="98.0" y2="54.0" class="geom-line geom-overlay" />
    <line id="hl-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" x1="98.0" y1="54.0" x2="136.0" y2="54.0" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="14.0" cy="25.0" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="108.0" cy="25.0" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="168.0" cy="25.0" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="36.0" cy="54.0" r="3.2" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="98.0" cy="54.0" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="136.0" cy="54.0" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="14.0" y="13.0" class="geom-label">A</text>
    <text id="lbl-C" data-ref="C" x="108.0" y="13.0" class="geom-label">C</text>
    <text id="lbl-B" data-ref="B" x="168.0" y="13.0" class="geom-label">B</text>
    <text id="lbl-D" data-ref="D" x="36.0" y="42.0" class="geom-label">D</text>
    <text id="lbl-F" data-ref="F" x="98.0" y="42.0" class="geom-label">F</text>
    <text id="lbl-E" data-ref="E" x="136.0" y="42.0" class="geom-label">E</text>
  </g>
</svg>
