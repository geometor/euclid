<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 65" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.3; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .geom:hover { stroke: #0284c7; stroke-width: 2.5; cursor: pointer; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label:hover { fill: #0284c7; font-weight: bold; cursor: pointer; }
  </style>
  <rect class="bg" width="184" height="65" />
  <line class="line geom" x1="14" y1="25" x2="168" y2="25" />
  <line class="line geom" x1="108" y1="21" x2="108" y2="29" />
  <text class="label" x="14" y="13">A</text>
  <text class="label" x="108" y="13">C</text>
  <text class="label" x="168" y="13">B</text>
  <line class="line geom" x1="36" y1="54" x2="136" y2="54" />
  <line class="line geom" x1="98" y1="50" x2="98" y2="58" />
  <text class="label" x="36" y="42">D</text>
  <text class="label" x="98" y="42">F</text>
  <text class="label" x="136" y="42">E</text>
</svg>
