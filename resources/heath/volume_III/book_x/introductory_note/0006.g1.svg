<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 145" width="140" height="145" class="euclid-graphic" data-graphic-id="0006.g1" data-folio="0006" data-graphic="g1" data-proposition="X.intro">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
  </g>

  <!-- Constructed Graphics (Polygons, Segments & Angles) -->
  <g id="graphics">
    <polygon id="el-poly-ABCD" data-ref="&lt; A B C D &gt;" data-aliases="&lt; A D C B &gt; | &lt; B C D A &gt; | &lt; A C &gt;" data-type="polygon" points="21.50,22.50 119.00,22.50 119.00,120.00 21.50,120.00" class="geom-polygon" />
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; C B A &gt;" data-type="polygon" points="21.50,22.50 119.00,22.50 119.00,120.00" class="geom-polygon" />
    <polygon id="el-tri-ADC" data-ref="&lt; A D C &gt;" data-aliases="&lt; C D A &gt;" data-type="polygon" points="21.50,22.50 21.50,120.00 119.00,120.00" class="geom-polygon" />

    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="21.50" y1="22.50" x2="119.00" y2="22.50" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="119.00" y1="22.50" x2="119.00" y2="120.00" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="119.00" y1="120.00" x2="21.50" y2="120.00" class="geom-line" />
    <line id="el-seg-DA" data-ref="/ D A /" data-aliases="/ A D /" data-type="segment" x1="21.50" y1="120.00" x2="21.50" y2="22.50" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="21.50" y1="22.50" x2="119.00" y2="120.00" class="geom-line" />

    <path id="el-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A )" data-type="wedge" d="M 119.00 22.50 L 99.00 22.50 A 20.0 20.0 0 0 0 119.00 42.50 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ADC" data-ref="&lt; A D C )" data-aliases="&lt; C D A )" data-type="wedge" d="M 21.50 120.00 L 21.50 100.00 A 20.0 20.0 0 0 1 41.50 120.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; C A B )" data-type="wedge" d="M 21.50 22.50 L 41.50 22.50 A 20.0 20.0 0 0 1 35.64 36.64 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-DAC" data-ref="&lt; D A C )" data-aliases="&lt; C A D )" data-type="wedge" d="M 21.50 22.50 L 35.64 36.64 A 20.0 20.0 0 0 1 21.50 42.50 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-ABCD" data-ref="&lt; A B C D &gt;" data-aliases="&lt; A D C B &gt; | &lt; B C D A &gt; | &lt; A C &gt;" points="21.50,22.50 119.00,22.50 119.00,120.00 21.50,120.00" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; C B A &gt;" points="21.50,22.50 119.00,22.50 119.00,120.00" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-ADC" data-ref="&lt; A D C &gt;" data-aliases="&lt; C D A &gt;" points="21.50,22.50 21.50,120.00 119.00,120.00" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="21.50" y1="22.50" x2="119.00" y2="22.50" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="119.00" y1="22.50" x2="119.00" y2="120.00" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="119.00" y1="120.00" x2="21.50" y2="120.00" class="geom-line geom-overlay" />
    <line id="hl-seg-DA" data-ref="/ D A /" data-aliases="/ A D /" x1="21.50" y1="120.00" x2="21.50" y2="22.50" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="21.50" y1="22.50" x2="119.00" y2="120.00" class="geom-line geom-overlay" />

    <path id="hl-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A )" d="M 119.00 22.50 L 99.00 22.50 A 20.0 20.0 0 0 0 119.00 42.50 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ADC" data-ref="&lt; A D C )" data-aliases="&lt; C D A )" d="M 21.50 120.00 L 21.50 100.00 A 20.0 20.0 0 0 1 41.50 120.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; C A B )" d="M 21.50 22.50 L 41.50 22.50 A 20.0 20.0 0 0 1 35.64 36.64 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-DAC" data-ref="&lt; D A C )" data-aliases="&lt; C A D )" d="M 21.50 22.50 L 35.64 36.64 A 20.0 20.0 0 0 1 21.50 42.50 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="21.50" cy="22.50" r="3.0" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="119.00" cy="22.50" r="3.0" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="119.00" cy="120.00" r="3.0" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="21.50" cy="120.00" r="3.0" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="21.50" y="11.00" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="119.00" y="11.00" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="119.00" y="132.00" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="21.50" y="132.00" class="geom-label">D</text>
  </g>
</svg>
