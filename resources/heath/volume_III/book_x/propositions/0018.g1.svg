<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 75" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="280" height="75" />
  <g class="el" data-name="AB">
    <line class="line" x1="27.0" y1="24.0" x2="153.0" y2="24.0" />
    <text class="lbl" x="17.0" y="24.0">A</text>
    <line class="tick" x1="60.0" y1="20.5" x2="60.0" y2="27.5" />
    <text class="lbl" x="60.0" y="12.0">K</text>
    <line class="tick" x1="95.0" y1="20.5" x2="95.0" y2="27.5" />
    <text class="lbl" x="95.0" y="12.0">H</text>
    <text class="lbl" x="163.0" y="24.0">B</text>
  </g>
  <g class="el" data-name="C">
    <line class="line" x1="217.0" y1="24.5" x2="266.0" y2="24.5" />
    <text class="lbl" x="241.5" y="13.5">C</text>
  </g>
  <g class="el" data-name="DE">
    <line class="line" x1="65.0" y1="52.5" x2="226.0" y2="52.5" />
    <text class="lbl" x="54.0" y="52.5">D</text>
    <line class="tick" x1="118.0" y1="49.0" x2="118.0" y2="56.0" />
    <text class="lbl" x="118.0" y="64.0">F</text>
    <line class="tick" x1="172.0" y1="49.0" x2="172.0" y2="56.0" />
    <text class="lbl" x="172.0" y="64.0">G</text>
    <text class="lbl" x="236.0" y="52.5">E</text>
  </g>
</svg>
