<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 55" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="315" height="55" />
  <g class="el" data-name="AC">
    <line class="line" x1="19.0" y1="25.0" x2="299.0" y2="25.0" />
    <text class="lbl" x="19.0" y="38.0">A</text>
    <line class="tick" x1="32.0" y1="21.5" x2="32.0" y2="28.5" />
    <text class="lbl" x="32.0" y="13.0">H</text>
    <line class="tick" x1="61.0" y1="21.5" x2="61.0" y2="28.5" />
    <text class="lbl" x="61.0" y="38.0">X</text>
    <line class="tick" x1="75.0" y1="21.5" x2="75.0" y2="28.5" />
    <text class="lbl" x="75.0" y="13.0">M</text>
    <line class="tick" x1="96.0" y1="21.5" x2="96.0" y2="28.5" />
    <text class="lbl" x="96.0" y="38.0">Y</text>
    <line class="tick" x1="122.0" y1="21.5" x2="122.0" y2="28.5" />
    <text class="lbl" x="122.0" y="13.0">K</text>
    <line class="tick" x1="146.0" y1="21.5" x2="146.0" y2="28.5" />
    <text class="lbl" x="146.0" y="38.0">B</text>
    <text class="lbl" x="299.0" y="38.0">C</text>
  </g>
</svg>
