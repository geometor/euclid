<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 355 75" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="355" height="75" />
  <g class="el" data-name="E">
    <line class="line" x1="70.0" y1="23.5" x2="118.0" y2="23.5" />
    <text class="lbl" x="94.0" y="12.5">E</text>
  </g>
  <g class="el" data-name="AB">
    <line class="line" x1="205.0" y1="23.5" x2="339.0" y2="23.5" />
    <text class="lbl" x="195.0" y="23.5">A</text>
    <line class="tick" x1="230.0" y1="20.0" x2="230.0" y2="27.0" />
    <text class="lbl" x="230.0" y="12.0">G</text>
    <text class="lbl" x="348.0" y="23.5">B</text>
  </g>
  <g class="el" data-name="CD">
    <line class="line" x1="17.0" y1="50.0" x2="337.0" y2="50.0" />
    <text class="lbl" x="7.0" y="50.0">C</text>
    <line class="tick" x1="75.0" y1="46.5" x2="75.0" y2="53.5" />
    <text class="lbl" x="75.0" y="61.0">F</text>
    <text class="lbl" x="347.0" y="50.0">D</text>
  </g>
</svg>
