<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 190" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="180" height="190" />
  <g class="el" data-name="ABCD">
    <rect class="line" x="18.0" y="21.0" width="143.0" height="143.0" />
    <line class="line" x1="161.0" y1="21.0" x2="18.0" y2="164.0" />
    <line class="line" x1="18.0" y1="80.2" x2="77.2" y2="164.0" />
    <line class="line" x1="18.0" y1="80.2" x2="60.0" y2="122.0" />
    <text class="lbl" x="18.0" y="10.0">B</text>
    <text class="lbl" x="90.0" y="11.0">a</text>
    <text class="lbl" x="161.0" y="10.0">A</text>
    <text class="lbl" x="10.0" y="80.0">E</text>
    <text class="lbl" x="10.0" y="122.0">d₁</text>
    <text class="lbl" x="42.0" y="134.0">a₁</text>
    <text class="lbl" x="67.0" y="124.0">F</text>
    <text class="lbl" x="98.0" y="96.0">d</text>
    <text class="lbl" x="18.0" y="175.0">C</text>
    <text class="lbl" x="161.0" y="175.0">D</text>
  </g>
</svg>
