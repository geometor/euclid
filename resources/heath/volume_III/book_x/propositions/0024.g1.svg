<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 75" width="315" height="75" class="euclid-graphic" data-graphic-id="0024.g1" data-folio="0024" data-graphic="g1" data-proposition="X.3">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-AB" data-ref="[ A B ]" data-aliases="[ B A ]" data-type="line" x1="179.00" y1="23.00" x2="300.00" y2="23.00" class="geom-line" />
    <line id="el-line-CD" data-ref="[ C D ]" data-aliases="[ D C ]" data-type="line" x1="19.00" y1="51.00" x2="298.00" y2="51.00" class="geom-line" />
    <line x1="193.00" y1="19.50" x2="193.00" y2="26.50" class="geom-line" />
    <line x1="54.00" y1="47.50" x2="54.00" y2="54.50" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Magnitude Bars, Segments & Sub-segments) -->
  <g id="graphics">
    <!-- Single-letter magnitude G -->
    <line id="el-mag-G" data-ref="G" data-aliases="/ G /" data-type="segment" x1="29.00" y1="20.50" x2="76.00" y2="20.50" class="geom-line" />

    <!-- Magnitude AB and sub-segments -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="179.00" y1="23.00" x2="300.00" y2="23.00" class="geom-line" />
    <line id="el-seg-AF" data-ref="/ A F /" data-aliases="/ F A /" data-type="segment" x1="179.00" y1="23.00" x2="193.00" y2="23.00" class="geom-line geom-overlay" />
    <line id="el-seg-FB" data-ref="/ F B /" data-aliases="/ B F /" data-type="segment" x1="193.00" y1="23.00" x2="300.00" y2="23.00" class="geom-line geom-overlay" />

    <!-- Magnitude CD and sub-segments -->
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="19.00" y1="51.00" x2="298.00" y2="51.00" class="geom-line" />
    <line id="el-seg-CE" data-ref="/ C E /" data-aliases="/ E C /" data-type="segment" x1="19.00" y1="51.00" x2="54.00" y2="51.00" class="geom-line geom-overlay" />
    <line id="el-seg-ED" data-ref="/ E D /" data-aliases="/ D E /" data-type="segment" x1="54.00" y1="51.00" x2="298.00" y2="51.00" class="geom-line geom-overlay" />

    <!-- Sections -->
    <polyline id="el-sec-AFB" data-ref="/ A F B /" data-aliases="/ B F A / | } A F B { | } B F A {" data-type="section" points="179.00,23.00 193.00,23.00 300.00,23.00" fill="none" class="geom-line geom-overlay" />
    <polyline id="el-sec-CED" data-ref="/ C E D /" data-aliases="/ D E C / | } C E D { | } D E C {" data-type="section" points="19.00,51.00 54.00,51.00 298.00,51.00" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-G" data-ref="G" data-aliases="/ G /" x1="29.00" y1="20.50" x2="76.00" y2="20.50" class="geom-line geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="179.00" y1="23.00" x2="300.00" y2="23.00" class="geom-line geom-overlay" />
    <line id="hl-seg-AF" data-ref="/ A F /" data-aliases="/ F A /" x1="179.00" y1="23.00" x2="193.00" y2="23.00" class="geom-line geom-overlay" />
    <line id="hl-seg-FB" data-ref="/ F B /" data-aliases="/ B F /" x1="193.00" y1="23.00" x2="300.00" y2="23.00" class="geom-line geom-overlay" />

    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="19.00" y1="51.00" x2="298.00" y2="51.00" class="geom-line geom-overlay" />
    <line id="hl-seg-CE" data-ref="/ C E /" data-aliases="/ E C /" x1="19.00" y1="51.00" x2="54.00" y2="51.00" class="geom-line geom-overlay" />
    <line id="hl-seg-ED" data-ref="/ E D /" data-aliases="/ D E /" x1="54.00" y1="51.00" x2="298.00" y2="51.00" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="179.00" cy="23.00" r="2.5" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="193.00" cy="23.00" r="2.5" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="300.00" cy="23.00" r="2.5" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="19.00" cy="51.00" r="2.5" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="54.00" cy="51.00" r="2.5" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="298.00" cy="51.00" r="2.5" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-G" data-ref="G" x="52.50" y="9.50" class="geom-label">G</text>
    <text id="lbl-A" data-ref="A" x="169.00" y="23.00" class="geom-label">A</text>
    <text id="lbl-F" data-ref="F" x="193.00" y="11.00" class="geom-label">F</text>
    <text id="lbl-B" data-ref="B" x="309.00" y="23.00" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="9.00" y="51.00" class="geom-label">C</text>
    <text id="lbl-E" data-ref="E" x="54.00" y="62.00" class="geom-label">E</text>
    <text id="lbl-D" data-ref="D" x="308.00" y="51.00" class="geom-label">D</text>
  </g>
</svg>
