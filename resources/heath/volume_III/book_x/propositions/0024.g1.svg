<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 75" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="315" height="75" />
  <g class="el" data-name="G">
    <line class="line" x1="29.0" y1="20.5" x2="76.0" y2="20.5" />
    <text class="lbl" x="52.5" y="9.5">G</text>
  </g>
  <g class="el" data-name="AB">
    <line class="line" x1="179.0" y1="23.0" x2="300.0" y2="23.0" />
    <text class="lbl" x="169.0" y="23.0">A</text>
    <line class="tick" x1="193.0" y1="19.5" x2="193.0" y2="26.5" />
    <text class="lbl" x="193.0" y="11.0">F</text>
    <text class="lbl" x="309.0" y="23.0">B</text>
  </g>
  <g class="el" data-name="CD">
    <line class="line" x1="19.0" y1="51.0" x2="298.0" y2="51.0" />
    <text class="lbl" x="9.0" y="51.0">C</text>
    <line class="tick" x1="54.0" y1="47.5" x2="54.0" y2="54.5" />
    <text class="lbl" x="54.0" y="62.0">E</text>
    <text class="lbl" x="308.0" y="51.0">D</text>
  </g>
</svg>
