<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 80" width="385" height="80" class="euclid-graphic" data-graphic-id="0030.g1" data-folio="0030" data-graphic="g1" data-proposition="X.6">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    /* Interactive Highlight States */
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <!-- Subdivision tick marks on magnitude A -->
    <line x1="56.00" y1="15.50" x2="56.00" y2="22.50" class="geom-line" />
    <line x1="98.00" y1="15.50" x2="98.00" y2="22.50" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Magnitude & Number Bars) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="14.00" y1="19.00" x2="140.00" y2="19.00" class="geom-line" />
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="193.00" y1="18.50" x2="270.00" y2="18.50" class="geom-line" />
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="326.00" y1="18.00" x2="370.00" y2="18.00" class="geom-line" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="104.00" y1="43.00" x2="172.00" y2="43.00" class="geom-line" />
    <line id="el-mag-E" data-ref="E" data-aliases="/ E /" data-type="segment" x1="104.00" y1="65.50" x2="149.00" y2="65.50" class="geom-line" />
    <line id="el-mag-F" data-ref="F" data-aliases="/ F /" data-type="segment" x1="249.00" y1="64.50" x2="321.00" y2="64.50" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /" x1="14.00" y1="19.00" x2="140.00" y2="19.00" class="geom-line geom-overlay" />
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /" x1="193.00" y1="18.50" x2="270.00" y2="18.50" class="geom-line geom-overlay" />
    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /" x1="326.00" y1="18.00" x2="370.00" y2="18.00" class="geom-line geom-overlay" />
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="104.00" y1="43.00" x2="172.00" y2="43.00" class="geom-line geom-overlay" />
    <line id="hl-mag-E" data-ref="E" data-aliases="/ E /" x1="104.00" y1="65.50" x2="149.00" y2="65.50" class="geom-line geom-overlay" />
    <line id="hl-mag-F" data-ref="F" data-aliases="/ F /" x1="249.00" y1="64.50" x2="321.00" y2="64.50" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="5.00" y="19.00" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="182.00" y="18.50" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="315.00" y="18.00" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="93.00" y="43.00" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="93.00" y="65.50" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="238.00" y="64.50" class="geom-label">F</text>
  </g>
</svg>
