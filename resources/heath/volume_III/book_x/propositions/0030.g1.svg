<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 80" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="385" height="80" />
  <g class="el" data-name="A">
    <line class="line" x1="14.0" y1="19.0" x2="140.0" y2="19.0" />
    <text class="lbl" x="5.0" y="19.0">A</text>
    <line class="tick" x1="56.0" y1="15.5" x2="56.0" y2="22.5" />
  </g>
  <g class="el" data-name="B">
    <line class="line" x1="193.0" y1="18.5" x2="270.0" y2="18.5" />
    <text class="lbl" x="182.0" y="18.5">B</text>
  </g>
  <g class="el" data-name="C">
    <line class="line" x1="326.0" y1="18.0" x2="370.0" y2="18.0" />
    <text class="lbl" x="315.0" y="18.0">C</text>
  </g>
  <g class="el" data-name="D">
    <line class="line" x1="104.0" y1="43.0" x2="172.0" y2="43.0" />
    <text class="lbl" x="93.0" y="43.0">D</text>
  </g>
  <g class="el" data-name="E">
    <line class="line" x1="104.0" y1="65.5" x2="149.0" y2="65.5" />
    <text class="lbl" x="93.0" y="65.5">E</text>
  </g>
  <g class="el" data-name="F">
    <line class="line" x1="249.0" y1="64.5" x2="321.0" y2="64.5" />
    <text class="lbl" x="238.0" y="64.5">F</text>
  </g>
</svg>
