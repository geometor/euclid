<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 55" width="100%" height="100%" class="euclid-graphic" data-graphic-id="0032.g2" data-folio="0032" data-graphic="g2" data-proposition="X.8">
  <style>
    .euclid-graphic {
      font-family: "Times New Roman", Times, Georgia, serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s ease, stroke-width 0.15s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-A" data-ref="[ A_l A_r ]" data-type="line" x1="25.0" y1="16.5" x2="97.0" y2="16.5" class="geom-line" />
    <line id="el-line-B" data-ref="[ B_l B_r ]" data-type="line" x1="33.0" y1="37.5" x2="89.0" y2="37.5" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Magnitude Segments) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="25.0" y1="16.5" x2="97.0" y2="16.5" class="geom-line" />
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="33.0" y1="37.5" x2="89.0" y2="37.5" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /" x1="25.0" y1="16.5" x2="97.0" y2="16.5" class="geom-line geom-overlay" />
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /" x1="33.0" y1="37.5" x2="89.0" y2="37.5" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" data-aliases="/ A /" x="61.0" y="5.5" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" data-aliases="/ B /" x="61.0" y="26.5" class="geom-label">B</text>
  </g>
</svg>
