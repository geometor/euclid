<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 305 85" width="100%" height="100%" class="euclid-graphic" data-graphic-id="0033.g1" data-folio="0033" data-graphic="g1" data-proposition="X.9">
  <style>
    .euclid-graphic {
      font-family: "Times New Roman", Times, Georgia, serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s ease, stroke-width 0.15s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-A" data-ref="[ A_l A_r ]" data-type="line" x1="16.0" y1="24.0" x2="153.0" y2="24.0" class="geom-line" />
    <line id="el-line-B" data-ref="[ B_l B_r ]" data-type="line" x1="191.0" y1="23.5" x2="291.0" y2="23.5" class="geom-line" />
    <line id="el-line-C" data-ref="[ C_l C_r ]" data-type="line" x1="124.0" y1="43.5" x2="178.0" y2="43.5" class="geom-line" />
    <line id="el-line-D" data-ref="[ D_l D_r ]" data-type="line" x1="124.0" y1="66.5" x2="166.0" y2="66.5" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Magnitude & Number Segments) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="16.0" y1="24.0" x2="153.0" y2="24.0" class="geom-line" />
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="191.0" y1="23.5" x2="291.0" y2="23.5" class="geom-line" />
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="124.0" y1="43.5" x2="178.0" y2="43.5" class="geom-line" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="124.0" y1="66.5" x2="166.0" y2="66.5" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /" x1="16.0" y1="24.0" x2="153.0" y2="24.0" class="geom-line geom-overlay" />
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /" x1="191.0" y1="23.5" x2="291.0" y2="23.5" class="geom-line geom-overlay" />
    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /" x1="124.0" y1="43.5" x2="178.0" y2="43.5" class="geom-line geom-overlay" />
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="124.0" y1="66.5" x2="166.0" y2="66.5" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" data-aliases="/ A /" x="84.5" y="13.0" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" data-aliases="/ B /" x="241.0" y="12.5" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" data-aliases="/ C /" x="151.0" y="32.5" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" data-aliases="/ D /" x="145.0" y="55.5" class="geom-label">D</text>
  </g>
</svg>
