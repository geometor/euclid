<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 120" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="395" height="120" />
  <g class="el" data-name="A">
    <line class="line" x1="27.0" y1="20.5" x2="99.0" y2="20.5" />
    <text class="lbl" x="16.0" y="20.5">A</text>
  </g>
  <g class="el" data-name="C">
    <line class="line" x1="136.0" y1="21.5" x2="231.0" y2="21.5" />
    <text class="lbl" x="125.0" y="21.5">C</text>
  </g>
  <g class="el" data-name="B">
    <line class="line" x1="267.0" y1="22.5" x2="381.0" y2="22.5" />
    <text class="lbl" x="256.0" y="22.5">B</text>
  </g>
  <g class="el" data-name="D">
    <line class="line" x1="82.0" y1="42.5" x2="135.0" y2="42.5" />
    <text class="lbl" x="144.0" y="42.5">D</text>
  </g>
  <g class="el" data-name="E">
    <line class="line" x1="82.0" y1="63.0" x2="148.0" y2="63.0" />
    <text class="lbl" x="157.0" y="63.0">E</text>
  </g>
  <g class="el" data-name="F">
    <line class="line" x1="80.0" y1="84.5" x2="117.0" y2="84.5" />
    <text class="lbl" x="126.0" y="84.5">F</text>
  </g>
  <g class="el" data-name="G">
    <line class="line" x1="80.0" y1="103.0" x2="125.0" y2="103.0" />
    <text class="lbl" x="134.0" y="103.0">G</text>
  </g>
  <g class="el" data-name="H">
    <line class="line" x1="271.0" y1="64.5" x2="319.0" y2="64.5" />
    <text class="lbl" x="328.0" y="64.5">H</text>
  </g>
  <g class="el" data-name="K">
    <line class="line" x1="270.0" y1="85.5" x2="335.0" y2="85.5" />
    <text class="lbl" x="344.0" y="85.5">K</text>
  </g>
  <g class="el" data-name="L">
    <line class="line" x1="271.0" y1="103.5" x2="349.0" y2="103.5" />
    <text class="lbl" x="358.0" y="103.5">L</text>
  </g>
</svg>
