<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 200" width="100%" height="100%" class="euclid-graphic" data-graphic-id="0041.g1" data-folio="0041" data-graphic="g1" data-proposition="X.14">
  <style>
    .euclid-graphic {
      font-family: "Times New Roman", Times, Georgia, serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s ease, stroke-width 0.15s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-A" data-ref="[ A_t A_b ]" data-type="line" x1="19.5" y1="12.0" x2="19.5" y2="175.0" class="geom-line" />
    <line id="el-line-B" data-ref="[ B_t B_b ]" data-type="line" x1="44.5" y1="33.0" x2="44.5" y2="175.0" class="geom-line" />
    <line id="el-line-E" data-ref="[ E_t E_b ]" data-type="line" x1="78.5" y1="16.0" x2="78.5" y2="98.0" class="geom-line" />
    <line id="el-line-C" data-ref="[ C_t C_b ]" data-type="line" x1="103.5" y1="34.0" x2="103.5" y2="172.0" class="geom-line" />
    <line id="el-line-D" data-ref="[ D_t D_b ]" data-type="line" x1="130.5" y1="58.0" x2="130.5" y2="178.0" class="geom-line" />
    <line id="el-line-F" data-ref="[ F_t F_b ]" data-type="line" x1="153.5" y1="18.0" x2="153.5" y2="91.0" class="geom-line" />
    <!-- Top tick caps matching Heath print -->
    <line x1="15.0" y1="12.0" x2="24.0" y2="12.0" class="geom-line" />
    <line x1="40.0" y1="33.0" x2="49.0" y2="33.0" class="geom-line" />
    <line x1="74.0" y1="16.0" x2="83.0" y2="16.0" class="geom-line" />
    <line x1="99.0" y1="34.0" x2="108.0" y2="34.0" class="geom-line" />
    <line x1="126.0" y1="58.0" x2="135.0" y2="58.0" class="geom-line" />
    <line x1="149.0" y1="18.0" x2="158.0" y2="18.0" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Straight Line Segments) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="19.5" y1="12.0" x2="19.5" y2="175.0" class="geom-line" />
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="44.5" y1="33.0" x2="44.5" y2="175.0" class="geom-line" />
    <line id="el-mag-E" data-ref="E" data-aliases="/ E /" data-type="segment" x1="78.5" y1="16.0" x2="78.5" y2="98.0" class="geom-line" />
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="103.5" y1="34.0" x2="103.5" y2="172.0" class="geom-line" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="130.5" y1="58.0" x2="130.5" y2="178.0" class="geom-line" />
    <line id="el-mag-F" data-ref="F" data-aliases="/ F /" data-type="segment" x1="153.5" y1="18.0" x2="153.5" y2="91.0" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /" x1="19.5" y1="12.0" x2="19.5" y2="175.0" class="geom-line geom-overlay" />
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /" x1="44.5" y1="33.0" x2="44.5" y2="175.0" class="geom-line geom-overlay" />
    <line id="hl-mag-E" data-ref="E" data-aliases="/ E /" x1="78.5" y1="16.0" x2="78.5" y2="98.0" class="geom-line geom-overlay" />
    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /" x1="103.5" y1="34.0" x2="103.5" y2="172.0" class="geom-line geom-overlay" />
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="130.5" y1="58.0" x2="130.5" y2="178.0" class="geom-line geom-overlay" />
    <line id="hl-mag-F" data-ref="F" data-aliases="/ F /" x1="153.5" y1="18.0" x2="153.5" y2="91.0" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" data-aliases="/ A /" x="19.5" y="187.0" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" data-aliases="/ B /" x="44.5" y="187.0" class="geom-label">B</text>
    <text id="lbl-E" data-ref="E" data-aliases="/ E /" x="78.5" y="110.0" class="geom-label">E</text>
    <text id="lbl-C" data-ref="C" data-aliases="/ C /" x="103.5" y="187.0" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" data-aliases="/ D /" x="130.5" y="187.0" class="geom-label">D</text>
    <text id="lbl-F" data-ref="F" data-aliases="/ F /" x="153.5" y="103.0" class="geom-label">F</text>
  </g>
</svg>
