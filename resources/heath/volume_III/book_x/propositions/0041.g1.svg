<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 200" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="170" height="200" />
  <g class="el" data-name="A">
    <line class="line" x1="19.5" y1="12.0" x2="19.5" y2="175.0" />
    <text class="lbl" x="19.5" y="187.0">A</text>
  </g>
  <g class="el" data-name="B">
    <line class="line" x1="44.5" y1="33.0" x2="44.5" y2="175.0" />
    <text class="lbl" x="44.5" y="187.0">B</text>
  </g>
  <g class="el" data-name="E">
    <line class="line" x1="78.5" y1="16.0" x2="78.5" y2="98.0" />
    <text class="lbl" x="78.5" y="110.0">E</text>
  </g>
  <g class="el" data-name="C">
    <line class="line" x1="103.5" y1="34.0" x2="103.5" y2="172.0" />
    <text class="lbl" x="103.5" y="187.0">C</text>
  </g>
  <g class="el" data-name="D">
    <line class="line" x1="130.5" y1="58.0" x2="130.5" y2="178.0" />
    <text class="lbl" x="130.5" y="187.0">D</text>
  </g>
  <g class="el" data-name="F">
    <line class="line" x1="153.5" y1="18.0" x2="153.5" y2="91.0" />
    <text class="lbl" x="153.5" y="103.0">F</text>
  </g>
</svg>
