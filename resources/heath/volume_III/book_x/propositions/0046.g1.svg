<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 125" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="200" height="125" />
  <g class="el" data-name="A">
    <line class="line" x1="23.0" y1="23.0" x2="147.0" y2="23.0" />
    <text class="lbl" x="85.0" y="15.0">A</text>
  </g>
  <g class="el" data-name="BC">
    <line class="line" x1="17.0" y1="103.0" x2="184.0" y2="103.0" />
    <polyline class="dashed" points="17.0,103.0 17.0,63.0 138.0,63.0 138.0,103.0" />
    <line class="tick" x1="59.0" y1="99.5" x2="59.0" y2="106.5" />
    <line class="tick" x1="99.0" y1="99.5" x2="99.0" y2="106.5" />
    <line class="tick" x1="138.0" y1="99.5" x2="138.0" y2="106.5" />
    <text class="lbl" x="17.0" y="114.0">B</text>
    <text class="lbl" x="59.0" y="114.0">F</text>
    <text class="lbl" x="99.0" y="114.0">E</text>
    <text class="lbl" x="138.0" y="114.0">D</text>
    <text class="lbl" x="184.0" y="114.0">C</text>
  </g>
</svg>
