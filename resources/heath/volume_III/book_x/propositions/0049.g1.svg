<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 85 195" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="85" height="195" />
  <g class="el" data-name="BC">
    <line class="line" x1="28.5" y1="17.0" x2="28.5" y2="184.0" />
    <text class="lbl" x="17.0" y="21.0">B</text>
    <line class="tick" x1="25.0" y1="61.0" x2="32.0" y2="61.0" />
    <text class="lbl" x="17.0" y="61.0">F</text>
    <line class="tick" x1="25.0" y1="101.0" x2="32.0" y2="101.0" />
    <text class="lbl" x="17.0" y="101.0">E</text>
    <line class="tick" x1="25.0" y1="139.0" x2="32.0" y2="139.0" />
    <text class="lbl" x="17.0" y="139.0">D</text>
    <text class="lbl" x="17.0" y="180.0">C</text>
  </g>
  <g class="el" data-name="A">
    <line class="line" x1="64.5" y1="27.0" x2="64.5" y2="171.0" />
    <text class="lbl" x="74.0" y="99.0">A</text>
  </g>
</svg>
