<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 195" width="100%" height="100%" class="euclid-graphic" data-graphic-id="0053.g1" data-folio="0053" data-graphic="g1" data-proposition="X.20">
  <style>
    .euclid-graphic {
      font-family: "Times New Roman", Times, Georgia, serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s ease, stroke-width 0.15s ease;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.22 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-DC" data-ref="[ D C ]" data-aliases="[ C D ]" data-type="line" x1="26.0" y1="15.5" x2="26.0" y2="180.0" class="geom-line" />
    <line id="el-line-DrCr" data-ref="[ D_r C_r ]" data-type="line" x1="97.0" y1="15.5" x2="97.0" y2="180.0" class="geom-line" />
    <line id="el-line-DDr" data-ref="[ D D_r ]" data-type="line" x1="26.0" y1="15.5" x2="97.0" y2="15.5" class="geom-line" />
    <line id="el-line-BA" data-ref="[ B A ]" data-aliases="[ A B ]" data-type="line" x1="26.0" y1="88.5" x2="97.0" y2="88.5" class="geom-line" />
    <line id="el-line-CCr" data-ref="[ C C_r ]" data-type="line" x1="26.0" y1="180.0" x2="97.0" y2="180.0" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Polygons & Segments) -->
  <g id="graphics">
    <polygon id="el-poly-AD" data-ref="&lt; A B D D_r &gt;" data-aliases="&lt; A D &gt; | &lt; D A &gt;" data-type="polygon" points="97.0,88.5 26.0,88.5 26.0,15.5 97.0,15.5" class="geom-polygon" />
    <polygon id="el-poly-AC" data-ref="&lt; A B C C_r &gt;" data-aliases="&lt; A C &gt; | &lt; C A &gt;" data-type="polygon" points="97.0,88.5 26.0,88.5 26.0,180.0 97.0,180.0" class="geom-polygon" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="97.0" y1="88.5" x2="26.0" y2="88.5" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="26.0" y1="88.5" x2="26.0" y2="180.0" class="geom-line" />
    <line id="el-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" data-type="segment" x1="26.0" y1="15.5" x2="26.0" y2="88.5" class="geom-line" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" data-type="segment" x1="26.0" y1="15.5" x2="26.0" y2="180.0" class="geom-line geom-overlay" />
    <line id="el-seg-DDr" data-ref="/ D D_r /" data-type="segment" x1="26.0" y1="15.5" x2="97.0" y2="15.5" class="geom-line" />
    <line id="el-seg-CCr" data-ref="/ C C_r /" data-type="segment" x1="26.0" y1="180.0" x2="97.0" y2="180.0" class="geom-line" />
    <line id="el-seg-DrCr" data-ref="/ D_r C_r /" data-type="segment" x1="97.0" y1="15.5" x2="97.0" y2="180.0" class="geom-line" />
    <polyline id="el-sec-DBC" data-ref="/ D B C /" data-aliases="/ C B D / | } D B C { | } C B D {" data-type="section" points="26.0,15.5 26.0,88.5 26.0,180.0" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-AD" data-ref="&lt; A B D D_r &gt;" data-aliases="&lt; A D &gt; | &lt; D A &gt;" points="97.0,88.5 26.0,88.5 26.0,15.5 97.0,15.5" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-AC" data-ref="&lt; A B C C_r &gt;" data-aliases="&lt; A C &gt; | &lt; C A &gt;" points="97.0,88.5 26.0,88.5 26.0,180.0 97.0,180.0" class="geom-polygon geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="97.0" y1="88.5" x2="26.0" y2="88.5" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="26.0" y1="88.5" x2="26.0" y2="180.0" class="geom-line geom-overlay" />
    <line id="hl-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" x1="26.0" y1="15.5" x2="26.0" y2="88.5" class="geom-line geom-overlay" />
    <line id="hl-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" x1="26.0" y1="15.5" x2="26.0" y2="180.0" class="geom-line geom-overlay" />
    <polyline id="hl-sec-DBC" data-ref="/ D B C /" data-aliases="/ C B D / | } D B C { | } C B D {" points="26.0,15.5 26.0,88.5 26.0,180.0" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="26.0" cy="15.5" r="2.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="26.0" cy="88.5" r="2.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="26.0" cy="180.0" r="2.2" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="97.0" cy="88.5" r="2.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-D" data-ref="D" x="16.0" y="15.5" class="geom-label">D</text>
    <text id="lbl-B" data-ref="B" x="16.0" y="88.5" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="16.0" y="180.0" class="geom-label">C</text>
    <text id="lbl-A" data-ref="A" x="106.0" y="88.5" class="geom-label">A</text>
  </g>
</svg>
