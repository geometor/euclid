    <line id="el-line-ED" data-ref="[ E D ]" data-aliases="[ D E ]" data-type="line" x1="72.5" y1="22.5" x2="72.5" y2="76.0" class="geom-line" />
    <line id="el-line-GGb" data-ref="[ G G_b ]" data-type="line" x1="212.0" y1="22.5" x2="212.0" y2="76.0" class="geom-line" />
  </g>

