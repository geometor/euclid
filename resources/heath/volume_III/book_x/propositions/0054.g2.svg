    <polygon id="el-poly-GD" data-ref="&lt; E G G_b D &gt;" data-aliases="&lt; G D &gt; | &lt; D G &gt;" data-type="polygon" points="72.5,22.5 212.0,22.5 212.0,76.0 72.5,76.0" class="geom-polygon" />
