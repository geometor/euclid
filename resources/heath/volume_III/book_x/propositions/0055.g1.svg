<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 190" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="245" height="190" />
  <g class="el" data-name="A">
    <line class="line" x1="21.5" y1="58.0" x2="21.5" y2="133.0" />
    <text class="lbl" x="11.0" y="125.0">A</text>
  </g>
  <g class="el" data-name="BCD">
    <rect class="line" x="72.0" y="18.5" width="37.5" height="153.0" />
    <text class="lbl" x="62.0" y="21.0">B</text>
    <text class="lbl" x="72.0" y="181.0">C</text>
    <text class="lbl" x="109.5" y="181.0">D</text>
  </g>
  <g class="el" data-name="GEF">
    <rect class="line" x="173.5" y="68.5" width="55.0" height="102.5" />
    <text class="lbl" x="163.5" y="71.0">G</text>
    <text class="lbl" x="173.5" y="181.0">E</text>
    <text class="lbl" x="228.5" y="181.0">F</text>
  </g>
</svg>
