<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 180" width="100%" height="100%" class="euclid-graphic" data-graphic-id="0059.g1" data-folio="0059" data-graphic="g1" data-proposition="X.24">
  <style>
    .euclid-graphic {
      font-family: "Times New Roman", Times, Georgia, serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s ease, stroke-width 0.15s ease;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.0 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.22 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.2 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 4.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-ClDl" data-ref="[ C_l D_l ]" data-type="line" x1="25.0" y1="14.5" x2="25.0" y2="160.5" class="geom-line" />
    <line id="el-line-CD" data-ref="[ C D ]" data-aliases="[ D C ]" data-type="line" x1="89.0" y1="14.5" x2="89.0" y2="160.5" class="geom-line" />
    <line id="el-line-ClC" data-ref="[ C_l C ]" data-type="line" x1="25.0" y1="14.5" x2="89.0" y2="14.5" class="geom-line" />
    <line id="el-line-AB" data-ref="[ A B ]" data-aliases="[ B A ]" data-type="line" x1="25.0" y1="97.5" x2="89.0" y2="97.5" class="geom-line" />
    <line id="el-line-DlD" data-ref="[ D_l D ]" data-type="line" x1="25.0" y1="160.5" x2="89.0" y2="160.5" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Polygons & Segments) -->
  <g id="graphics">
    <polygon id="el-poly-AC" data-ref="&lt; A B C C_l &gt;" data-aliases="&lt; A C &gt; | &lt; C A &gt;" data-type="polygon" points="25.0,97.5 89.0,97.5 89.0,14.5 25.0,14.5" class="geom-polygon" />
    <polygon id="el-poly-AD" data-ref="&lt; A B D D_l &gt;" data-aliases="&lt; A D &gt; | &lt; D A &gt;" data-type="polygon" points="25.0,97.5 89.0,97.5 89.0,160.5 25.0,160.5" class="geom-polygon" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="25.0" y1="97.5" x2="89.0" y2="97.5" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="89.0" y1="97.5" x2="89.0" y2="14.5" class="geom-line" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="89.0" y1="97.5" x2="89.0" y2="160.5" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="89.0" y1="14.5" x2="89.0" y2="160.5" class="geom-line geom-overlay" />
    <line id="el-seg-ClC" data-ref="/ C_l C /" data-type="segment" x1="25.0" y1="14.5" x2="89.0" y2="14.5" class="geom-line" />
    <line id="el-seg-DlD" data-ref="/ D_l D /" data-type="segment" x1="25.0" y1="160.5" x2="89.0" y2="160.5" class="geom-line" />
    <line id="el-seg-ClDl" data-ref="/ C_l D_l /" data-type="segment" x1="25.0" y1="14.5" x2="25.0" y2="160.5" class="geom-line" />
    <polyline id="el-sec-CBD" data-ref="/ C B D /" data-aliases="/ D B C / | } C B D { | } D B C {" data-type="section" points="89.0,14.5 89.0,97.5 89.0,160.5" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-AC" data-ref="&lt; A B C C_l &gt;" data-aliases="&lt; A C &gt; | &lt; C A &gt;" points="25.0,97.5 89.0,97.5 89.0,14.5 25.0,14.5" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-AD" data-ref="&lt; A B D D_l &gt;" data-aliases="&lt; A D &gt; | &lt; D A &gt;" points="25.0,97.5 89.0,97.5 89.0,160.5 25.0,160.5" class="geom-polygon geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="25.0" y1="97.5" x2="89.0" y2="97.5" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="89.0" y1="97.5" x2="89.0" y2="14.5" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="89.0" y1="97.5" x2="89.0" y2="160.5" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="89.0" y1="14.5" x2="89.0" y2="160.5" class="geom-line geom-overlay" />
    <polyline id="hl-sec-CBD" data-ref="/ C B D /" data-aliases="/ D B C / | } C B D { | } D B C {" points="89.0,14.5 89.0,97.5 89.0,160.5" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="25.0" cy="97.5" r="2.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="89.0" cy="97.5" r="2.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="89.0" cy="14.5" r="2.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="89.0" cy="160.5" r="2.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="15.0" y="97.5" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="98.0" y="97.5" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="98.0" y="16.0" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" x="98.0" y="160.5" class="geom-label">D</text>
  </g>
</svg>
