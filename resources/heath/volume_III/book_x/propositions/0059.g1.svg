<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 180" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="110" height="180" />
  <g class="el" data-name="ABCD">
    <rect class="line" x="25.0" y="14.5" width="64.0" height="146.0" />
    <line class="line" x1="25.0" y1="97.5" x2="89.0" y2="97.5" />
    <text class="lbl" x="15.0" y="97.5">A</text>
    <text class="lbl" x="98.0" y="97.5">B</text>
    <text class="lbl" x="98.0" y="16.0">C</text>
    <text class="lbl" x="98.0" y="160.5">D</text>
  </g>
</svg>
