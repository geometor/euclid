<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 265 155" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="265" height="155" />
  <g class="el" data-name="ADCB">
    <rect class="line" x="21.0" y="16.5" width="101.0" height="87.0" />
    <line class="line" x1="21.0" y1="73.5" x2="122.0" y2="73.5" />
    <text class="lbl" x="11.0" y="18.0">A</text>
    <text class="lbl" x="11.0" y="73.5">D</text>
    <text class="lbl" x="131.0" y="73.5">C</text>
    <text class="lbl" x="131.0" y="103.5">B</text>
  </g>
  <g class="el" data-name="FEKGH">
    <rect class="line" x="167.5" y="17.5" width="75.5" height="123.0" />
    <line class="line" x1="167.5" y1="95.5" x2="243.0" y2="95.5" />
    <text class="lbl" x="157.5" y="19.0">F</text>
    <text class="lbl" x="252.0" y="19.0">E</text>
    <text class="lbl" x="157.5" y="95.5">K</text>
    <text class="lbl" x="252.0" y="95.5">G</text>
    <text class="lbl" x="252.0" y="140.5">H</text>
  </g>
</svg>
