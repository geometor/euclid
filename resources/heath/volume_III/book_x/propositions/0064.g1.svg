<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 180" width="100%" height="100%" class="euclid-graphic" data-graphic-id="0064.g1" data-folio="0064" data-graphic="g1" data-proposition="X.27">
  <style>
    .euclid-graphic {
      font-family: "Times New Roman", Times, Georgia, serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s ease, stroke-width 0.15s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.0 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-A" data-ref="[ A A_b ]" data-type="line" x1="24.0" y1="15.0" x2="24.0" y2="166.0" class="geom-line" />
    <line id="el-line-B" data-ref="[ B B_b ]" data-type="line" x1="50.5" y1="50.0" x2="50.5" y2="166.0" class="geom-line" />
    <line id="el-line-C" data-ref="[ C C_b ]" data-type="line" x1="95.5" y1="15.0" x2="95.5" y2="116.0" class="geom-line" />
    <line id="el-line-D" data-ref="[ D D_b ]" data-type="line" x1="120.5" y1="15.0" x2="120.5" y2="89.0" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Magnitude Segments) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="24.0" y1="15.0" x2="24.0" y2="166.0" class="geom-line" />
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="50.5" y1="50.0" x2="50.5" y2="166.0" class="geom-line" />
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="95.5" y1="15.0" x2="95.5" y2="116.0" class="geom-line" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="120.5" y1="15.0" x2="120.5" y2="89.0" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /" x1="24.0" y1="15.0" x2="24.0" y2="166.0" class="geom-line geom-overlay" />
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /" x1="50.5" y1="50.0" x2="50.5" y2="166.0" class="geom-line geom-overlay" />
    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /" x1="95.5" y1="15.0" x2="95.5" y2="116.0" class="geom-line geom-overlay" />
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="120.5" y1="15.0" x2="120.5" y2="89.0" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" data-aliases="/ A /" x="14.0" y="105.0" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" data-aliases="/ B /" x="41.0" y="93.0" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" data-aliases="/ C /" x="86.0" y="65.0" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" data-aliases="/ D /" x="111.0" y="40.0" class="geom-label">D</text>
  </g>
</svg>
