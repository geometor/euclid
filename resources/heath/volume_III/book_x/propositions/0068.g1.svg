<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 55" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="280" height="55" />
  <g class="el" data-name="AB">
    <line class="line" x1="15.0" y1="34.0" x2="263.0" y2="34.0" />
    <text class="lbl" x="15.0" y="46.0">A</text>
    <line class="tick" x1="46.0" y1="30.5" x2="46.0" y2="37.5" />
    <text class="lbl" x="46.0" y="46.0">G</text>
    <line class="tick" x1="83.0" y1="30.5" x2="83.0" y2="37.5" />
    <text class="lbl" x="83.0" y="46.0">H</text>
    <line class="tick" x1="101.0" y1="30.5" x2="101.0" y2="37.5" />
    <text class="lbl" x="101.0" y="46.0">D</text>
    <line class="tick" x1="123.0" y1="30.5" x2="123.0" y2="37.5" />
    <text class="lbl" x="123.0" y="22.0">E</text>
    <line class="tick" x1="145.0" y1="30.5" x2="145.0" y2="37.5" />
    <text class="lbl" x="145.0" y="46.0">F</text>
    <line class="tick" x1="201.0" y1="30.5" x2="201.0" y2="37.5" />
    <text class="lbl" x="201.0" y="46.0">C</text>
    <text class="lbl" x="261.0" y="46.0">B</text>
  </g>
</svg>
