<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 205 150" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="205" height="150" />
  <g class="el" data-name="AFB">
    <path class="line" d="M 19.0 104.0 A 86.5 86.5 0 0 1 192.0 104.0 Z" />
    <line class="line" x1="19.0" y1="104.0" x2="105.5" y2="17.5" />
    <line class="line" x1="105.5" y1="17.5" x2="192.0" y2="104.0" />
    <text class="lbl" x="19.0" y="114.0">A</text>
    <text class="lbl" x="105.5" y="9.0">F</text>
    <text class="lbl" x="192.0" y="114.0">B</text>
  </g>
  <g class="el" data-name="CD">
    <line class="line" x1="46.0" y1="130.5" x2="186.0" y2="130.5" />
    <text class="lbl" x="46.0" y="141.5">C</text>
    <line class="tick" x1="108.0" y1="127.0" x2="108.0" y2="134.0" />
    <text class="lbl" x="108.0" y="141.5">E</text>
    <text class="lbl" x="186.0" y="141.5">D</text>
  </g>
</svg>
