<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="240" height="160" />
  <g class="el" data-name="AFB">
    <path class="line" d="M 19.0 111.5 A 102.5 102.5 0 0 1 224.0 111.5 Z" />
    <line class="line" x1="19.0" y1="111.5" x2="115.0" y2="9.2" />
    <line class="line" x1="115.0" y1="9.2" x2="224.0" y2="111.5" />
    <text class="lbl" x="19.0" y="121.0">A</text>
    <text class="lbl" x="105.0" y="10.0">F</text>
    <text class="lbl" x="224.0" y="121.0">B</text>
  </g>
  <g class="el" data-name="CD">
    <line class="line" x1="46.0" y1="139.5" x2="178.0" y2="139.5" />
    <text class="lbl" x="46.0" y="150.5">C</text>
    <line class="tick" x1="92.0" y1="136.0" x2="92.0" y2="143.0" />
    <text class="lbl" x="92.0" y="150.5">E</text>
    <text class="lbl" x="178.0" y="150.5">D</text>
  </g>
</svg>
