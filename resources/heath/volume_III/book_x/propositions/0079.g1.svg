<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 125" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="290" height="125" />
  <g class="el" data-name="AFBC">
    <path class="line" d="M 19.0 102.0 A 84.0 84.0 0 0 1 187.0 102.0" />
    <line class="line" x1="19.0" y1="102.0" x2="278.0" y2="102.0" />
    <line class="line" x1="19.0" y1="102.0" x2="175.0" y2="55.0" />
    <line class="line" x1="175.0" y1="55.0" x2="187.0" y2="102.0" />
    <line class="line" x1="175.0" y1="55.0" x2="175.0" y2="102.0" />
    <line class="tick" x1="232.5" y1="98.5" x2="232.5" y2="105.5" />
    <text class="lbl" x="19.0" y="113.0">A</text>
    <text class="lbl" x="172.0" y="113.0">E</text>
    <text class="lbl" x="189.0" y="113.0">B</text>
    <text class="lbl" x="232.5" y="113.0">D</text>
    <text class="lbl" x="275.0" y="113.0">C</text>
    <text class="lbl" x="180.0" y="45.0">F</text>
