    <line class="line" x1="155.5" y1="39.5" x2="183.0" y2="101.0" />
    <line class="line" x1="155.5" y1="39.5" x2="155.5" y2="101.0" />
    <line class="tick" x1="243.0" y1="97.5" x2="243.0" y2="104.5" />
    <text class="lbl" x="17.0" y="112.0">A</text>
    <text class="lbl" x="155.5" y="112.0">F</text>
