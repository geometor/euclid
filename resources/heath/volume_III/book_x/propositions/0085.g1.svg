<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 325 130" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="325" height="130" />
  <g class="el" data-name="ADBC">
    <path class="line" d="M 19.0 109.0 A 92.5 92.5 0 0 1 204.0 109.0" />
    <line class="line" x1="19.0" y1="109.0" x2="310.0" y2="109.0" />
    <line class="line" x1="19.0" y1="109.0" x2="188.0" y2="54.5" />
    <line class="line" x1="188.0" y1="54.5" x2="204.0" y2="109.0" />
    <line class="line" x1="188.0" y1="54.5" x2="188.0" y2="109.0" />
    <line class="tick" x1="257.0" y1="105.5" x2="257.0" y2="112.5" />
    <text class="lbl" x="19.0" y="120.0">A</text>
    <text class="lbl" x="185.0" y="120.0">F</text>
    <text class="lbl" x="204.0" y="120.0">B</text>
    <text class="lbl" x="257.0" y="120.0">E</text>
    <text class="lbl" x="310.0" y="120.0">C</text>
    <text class="lbl" x="193.0" y="44.0">D</text>
