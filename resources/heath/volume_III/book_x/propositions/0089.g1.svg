<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 265 145" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="265" height="145" />
  <g class="el" data-name="AC">
    <line class="line" x1="70.0" y1="17.5" x2="202.0" y2="17.5" />
    <text class="lbl" x="73.0" y="29.0">A</text>
    <line class="tick" x1="148.5" y1="14.0" x2="148.5" y2="21.0" />
    <text class="lbl" x="148.5" y="29.0">B</text>
    <text class="lbl" x="199.0" y="29.0">C</text>
  </g>
  <g class="el" data-name="DEFG">
    <rect class="line" x="19.5" y="48.0" width="230.0" height="77.0" />
    <line class="line" x1="148.5" y1="48.0" x2="148.5" y2="125.0" />
    <text class="lbl" x="19.5" y="38.0">D</text>
    <text class="lbl" x="148.5" y="38.0">H</text>
    <text class="lbl" x="249.5" y="38.0">G</text>
    <text class="lbl" x="19.5" y="135.5">E</text>
    <text class="lbl" x="249.5" y="135.5">F</text>
  </g>
</svg>
