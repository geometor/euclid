<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 280" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="160" height="280" />
  <g class="el" data-name="DEHK">
    <rect class="line" x="53.5" y="18.5" width="65.0" height="217.5" />
    <line class="line" x1="53.5" y1="103.5" x2="118.5" y2="103.5" />
    <text class="lbl" x="43.5" y="20.0">K</text>
    <text class="lbl" x="128.0" y="20.0">H</text>
    <text class="lbl" x="43.5" y="103.5">G</text>
    <text class="lbl" x="128.0" y="103.5">F</text>
    <text class="lbl" x="43.5" y="234.0">D</text>
    <text class="lbl" x="128.0" y="234.0">E</text>
  </g>
  <g class="el" data-name="AC">
    <line class="line" x1="23.0" y1="259.5" x2="146.0" y2="259.5" />
    <text class="lbl" x="25.0" y="271.0">A</text>
    <line class="tick" x1="94.0" y1="256.0" x2="94.0" y2="263.0" />
    <text class="lbl" x="94.0" y="271.0">B</text>
    <text class="lbl" x="143.0" y="271.0">C</text>
  </g>
</svg>
