<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 170" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="430" height="170" />
  <g class="el" data-name="AB">
    <line class="line" x1="125.0" y1="21.5" x2="313.0" y2="21.5" />
    <text class="lbl" x="128.0" y="10.5">A</text>
    <line class="tick" x1="228.0" y1="18.0" x2="228.0" y2="25.0" />
    <text class="lbl" x="228.0" y="10.5">D</text>
    <line class="tick" x1="257.0" y1="18.0" x2="257.0" y2="25.0" />
    <text class="lbl" x="257.0" y="10.5">C</text>
    <text class="lbl" x="310.0" y="10.5">B</text>
  </g>
  <g class="el" data-name="EFKN">
    <rect class="line" x="19.0" y="54.0" width="388.0" height="91.5" />
    <line class="line" x1="217.5" y1="54.0" x2="217.5" y2="145.5" />
    <line class="line" x1="258.5" y1="54.0" x2="258.5" y2="145.5" />
    <text class="lbl" x="19.0" y="44.0">E</text>
    <text class="lbl" x="215.0" y="44.0">M</text>
    <text class="lbl" x="260.0" y="44.0">H</text>
    <text class="lbl" x="407.0" y="44.0">N</text>
    <text class="lbl" x="19.0" y="156.5">F</text>
    <text class="lbl" x="215.0" y="156.5">L</text>
    <text class="lbl" x="260.0" y="156.5">G</text>
    <text class="lbl" x="407.0" y="156.5">K</text>
  </g>
</svg>
