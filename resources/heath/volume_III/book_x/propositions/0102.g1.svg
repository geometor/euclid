    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="14.0" y1="19.0" x2="121.0" y2="19.0" class="geom-line geom-overlay" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="14.0" y1="19.0" x2="151.0" y2="19.0" class="geom-line geom-overlay" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" data-type="segment" x1="121.0" y1="19.0" x2="151.0" y2="19.0" class="geom-line geom-overlay" />
    <line id="el-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" data-type="segment" x1="121.0" y1="19.0" x2="208.0" y2="19.0" class="geom-line geom-overlay" />
    <line id="el-seg-CB" data-ref="/ C B /" data-aliases="/ B C /" data-type="segment" x1="151.0" y1="19.0" x2="208.0" y2="19.0" class="geom-line geom-overlay" />

    <polyline id="el-sec-ACB" data-ref="/ A C B /" data-aliases="/ B C A / | } A C B { | } B C A {" data-type="section" points="14.0,19.0 151.0,19.0 208.0,19.0" class="geom-line geom-overlay" />
    <polyline id="el-sec-ADB" data-ref="/ A D B /" data-aliases="/ B D A / | } A D B { | } B D A {" data-type="section" points="14.0,19.0 121.0,19.0 208.0,19.0" class="geom-line geom-overlay" />
  </g>

