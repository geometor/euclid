    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="14.0" y1="19.0" x2="121.0" y2="19.0" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="14.0" y1="19.0" x2="151.0" y2="19.0" class="geom-line geom-overlay" />
