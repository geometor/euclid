    <polyline id="hl-sec-ADB" data-ref="/ A D B /" data-aliases="/ B D A / | } A D B { | } B D A {" points="14.0,19.0 121.0,19.0 208.0,19.0" class="geom-line geom-overlay" />
  </g>

