<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 325 240" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="325" height="240" />
  <g class="el" data-name="AB">
    <line class="line" x1="26.0" y1="21.0" x2="26.0" y2="224.0" />
    <text class="lbl" x="16.0" y="25.0">A</text>
    <line class="tick" x1="22.5" y1="139.0" x2="29.5" y2="139.0" />
    <text class="lbl" x="16.0" y="139.0">D</text>
    <line class="tick" x1="22.5" y1="173.0" x2="29.5" y2="173.0" />
    <text class="lbl" x="16.0" y="173.0">C</text>
    <text class="lbl" x="16.0" y="220.0">B</text>
  </g>
  <g class="el" data-name="EFKN">
    <rect class="line" x="69.0" y="19.0" width="237.0" height="176.0" />
    <line class="line" x1="187.0" y1="19.0" x2="187.0" y2="195.0" />
    <line class="line" x1="212.5" y1="19.0" x2="212.5" y2="195.0" />
    <text class="lbl" x="69.0" y="9.5">E</text>
    <text class="lbl" x="184.0" y="9.5">M</text>
    <text class="lbl" x="215.0" y="9.5">H</text>
    <text class="lbl" x="306.0" y="9.5">N</text>
    <text class="lbl" x="69.0" y="206.0">F</text>
    <text class="lbl" x="184.0" y="206.0">L</text>
    <text class="lbl" x="215.0" y="206.0">G</text>
    <text class="lbl" x="306.0" y="206.0">K</text>
  </g>
</svg>
