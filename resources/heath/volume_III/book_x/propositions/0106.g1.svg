<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 110" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="225" height="110" />
  <g class="el" data-name="D">
    <line class="line" x1="15.0" y1="21.0" x2="91.0" y2="21.0" />
    <text class="lbl" x="4.0" y="21.0">D</text>
  </g>
  <g class="el" data-name="H">
    <line class="line" x1="145.0" y1="20.5" x2="207.0" y2="20.5" />
    <text class="lbl" x="134.0" y="20.5">H</text>
  </g>
  <g class="el" data-name="EG">
    <line class="line" x1="23.0" y1="55.5" x2="191.0" y2="55.5" />
    <text class="lbl" x="26.0" y="66.5">E</text>
    <line class="tick" x1="125.0" y1="52.0" x2="125.0" y2="59.0" />
    <text class="lbl" x="125.0" y="66.5">F</text>
    <text class="lbl" x="188.0" y="66.5">G</text>
  </g>
  <g class="el" data-name="AB">
    <line class="line" x1="91.0" y1="87.5" x2="212.0" y2="87.5" />
    <text class="lbl" x="94.0" y="98.5">A</text>
    <line class="tick" x1="167.0" y1="84.0" x2="167.0" y2="91.0" />
    <text class="lbl" x="167.0" y="98.5">C</text>
    <text class="lbl" x="209.0" y="98.5">B</text>
  </g>
</svg>
