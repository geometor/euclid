<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 175" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="170" height="175" />
  <g class="el" data-name="AB">
    <line class="line" x1="27.0" y1="20.0" x2="27.0" y2="144.0" />
    <text class="lbl" x="16.0" y="24.0">A</text>
    <line class="tick" x1="23.5" y1="95.0" x2="30.5" y2="95.0" />
    <text class="lbl" x="16.0" y="95.0">C</text>
    <text class="lbl" x="16.0" y="140.0">B</text>
  </g>
  <g class="el" data-name="D">
    <line class="line" x1="64.5" y1="28.0" x2="64.5" y2="77.0" />
    <text class="lbl" x="75.0" y="52.0">D</text>
  </g>
  <g class="el" data-name="EG">
    <line class="line" x1="107.5" y1="16.0" x2="107.5" y2="160.0" />
    <text class="lbl" x="97.0" y="20.0">E</text>
    <line class="tick" x1="104.0" y1="85.0" x2="111.0" y2="85.0" />
    <text class="lbl" x="97.0" y="85.0">F</text>
    <text class="lbl" x="97.0" y="156.0">G</text>
  </g>
  <g class="el" data-name="H">
    <line class="line" x1="150.0" y1="28.0" x2="150.0" y2="79.0" />
    <text class="lbl" x="160.0" y="53.0">H</text>
  </g>
</svg>
