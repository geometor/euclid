<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="360" height="80" />
  <g class="el" data-name="E">
    <line class="line" x1="17.0" y1="31.5" x2="89.0" y2="31.5" />
    <text class="lbl" x="6.0" y="31.5">E</text>
  </g>
  <g class="el" data-name="K">
    <line class="line" x1="123.0" y1="20.5" x2="182.0" y2="20.5" />
    <text class="lbl" x="152.5" y="9.5">K</text>
  </g>
  <g class="el" data-name="AB">
    <line class="line" x1="221.0" y1="20.5" x2="343.0" y2="20.5" />
    <text class="lbl" x="224.0" y="9.5">A</text>
    <line class="tick" x1="297.0" y1="17.0" x2="297.0" y2="24.0" />
    <text class="lbl" x="297.0" y="9.5">C</text>
    <text class="lbl" x="340.0" y="9.5">B</text>
  </g>
  <g class="el" data-name="D">
    <line class="line" x1="252.0" y1="41.0" x2="321.0" y2="41.0" />
    <text class="lbl" x="241.0" y="41.0">D</text>
  </g>
  <g class="el" data-name="FH">
    <line class="line" x1="20.0" y1="58.5" x2="190.0" y2="58.5" />
    <text class="lbl" x="10.0" y="58.5">F</text>
    <line class="tick" x1="123.0" y1="55.0" x2="123.0" y2="62.0" />
    <text class="lbl" x="123.0" y="47.0">G</text>
    <text class="lbl" x="200.0" y="58.5">H</text>
  </g>
</svg>
