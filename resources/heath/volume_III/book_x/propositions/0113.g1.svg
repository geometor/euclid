<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 115 210" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="115" height="210" />
  <g class="el" data-name="AB">
    <line class="line" x1="24.5" y1="19.0" x2="24.5" y2="145.0" />
    <text class="lbl" x="14.0" y="23.0">A</text>
    <line class="tick" x1="21.0" y1="94.0" x2="28.0" y2="94.0" />
    <text class="lbl" x="14.0" y="94.0">C</text>
    <text class="lbl" x="14.0" y="141.0">B</text>
  </g>
  <g class="el" data-name="D">
    <line class="line" x1="61.5" y1="18.0" x2="61.5" y2="92.0" />
    <text class="lbl" x="51.0" y="40.0">D</text>
  </g>
  <g class="el" data-name="H">
    <line class="line" x1="60.5" y1="122.0" x2="60.5" y2="187.0" />
    <text class="lbl" x="50.0" y="161.0">H</text>
  </g>
  <g class="el" data-name="EG">
    <line class="line" x1="98.0" y1="24.0" x2="98.0" y2="195.0" />
    <text class="lbl" x="87.0" y="28.0">E</text>
    <line class="tick" x1="94.5" y1="115.0" x2="101.5" y2="115.0" />
    <text class="lbl" x="87.0" y="115.0">F</text>
    <text class="lbl" x="87.0" y="191.0">G</text>
  </g>
</svg>
