<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 210" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="120" height="210" />
  <g class="el" data-name="AB">
    <line class="line" x1="26.0" y1="19.0" x2="26.0" y2="144.0" />
    <text class="lbl" x="15.0" y="23.0">A</text>
    <line class="tick" x1="22.5" y1="94.0" x2="29.5" y2="94.0" />
    <text class="lbl" x="15.0" y="94.0">C</text>
    <text class="lbl" x="15.0" y="140.0">B</text>
  </g>
  <g class="el" data-name="D">
    <line class="line" x1="58.0" y1="19.0" x2="58.0" y2="69.0" />
    <text class="lbl" x="68.0" y="40.0">D</text>
  </g>
  <g class="el" data-name="H">
    <line class="line" x1="58.5" y1="144.0" x2="58.5" y2="191.0" />
    <text class="lbl" x="48.0" y="170.0">H</text>
  </g>
  <g class="el" data-name="EG">
    <line class="line" x1="100.0" y1="19.0" x2="100.0" y2="164.0" />
    <text class="lbl" x="89.0" y="23.0">E</text>
    <line class="tick" x1="96.5" y1="74.0" x2="103.5" y2="74.0" />
    <text class="lbl" x="89.0" y="74.0">F</text>
    <text class="lbl" x="89.0" y="173.0">G</text>
  </g>
</svg>
