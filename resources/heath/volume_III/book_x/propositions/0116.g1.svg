<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 210" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="160" height="210" />
  <g class="el" data-name="AB">
    <line class="line" x1="22.5" y1="18.0" x2="22.5" y2="144.0" />
    <text class="lbl" x="12.0" y="22.0">A</text>
    <line class="tick" x1="19.0" y1="93.0" x2="26.0" y2="93.0" />
    <text class="lbl" x="12.0" y="93.0">C</text>
    <text class="lbl" x="12.0" y="140.0">B</text>
  </g>
  <g class="el" data-name="D">
    <line class="line" x1="63.5" y1="20.0" x2="63.5" y2="93.0" />
    <text class="lbl" x="53.0" y="55.0">D</text>
  </g>
  <g class="el" data-name="E">
    <line class="line" x1="95.5" y1="21.0" x2="95.5" y2="92.0" />
    <text class="lbl" x="106.0" y="55.0">E</text>
  </g>
  <g class="el" data-name="K">
    <line class="line" x1="94.5" y1="116.0" x2="94.5" y2="177.0" />
    <text class="lbl" x="105.0" y="146.0">K</text>
  </g>
  <g class="el" data-name="FH">
    <line class="line" x1="138.0" y1="20.0" x2="138.0" y2="192.0" />
    <text class="lbl" x="148.0" y="24.0">F</text>
    <line class="tick" x1="134.5" y1="113.0" x2="141.5" y2="113.0" />
    <text class="lbl" x="148.0" y="113.0">G</text>
    <text class="lbl" x="148.0" y="188.0">H</text>
  </g>
</svg>
