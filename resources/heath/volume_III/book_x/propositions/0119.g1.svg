<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 145 145" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="145" height="145" />
  <g class="el" data-name="AC">
    <rect class="line" x="22.5" y="19.0" width="104.0" height="106.0" />
    <line class="line" x1="22.5" y1="58.0" x2="126.5" y2="58.0" />
    <line class="line" x1="88.5" y1="19.0" x2="88.5" y2="125.0" />
    <text class="lbl" x="13.0" y="20.0">K</text>
    <text class="lbl" x="88.5" y="10.0">G</text>
    <text class="lbl" x="126.5" y="10.0">C</text>
    <text class="lbl" x="13.0" y="58.0">D</text>
    <text class="lbl" x="80.0" y="49.0">B</text>
    <text class="lbl" x="136.0" y="58.0">E</text>
    <text class="lbl" x="22.5" y="135.5">A</text>
    <text class="lbl" x="88.5" y="135.5">F</text>
    <text class="lbl" x="126.5" y="135.5">H</text>
  </g>
</svg>
