<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 155" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="230" height="155" />
  <g class="el" data-name="DEFG">
    <rect class="line" x="23.5" y="18.5" width="191.0" height="93.5" />
    <line class="line" x1="102.0" y1="18.5" x2="102.0" y2="112.0" />
    <line class="line" x1="124.5" y1="18.5" x2="124.5" y2="112.0" />
    <line class="line" x1="169.5" y1="18.5" x2="169.5" y2="112.0" />
    <text class="lbl" x="23.5" y="8.5">D</text>
    <text class="lbl" x="102.0" y="8.5">K</text>
    <text class="lbl" x="124.5" y="8.5">M</text>
    <text class="lbl" x="169.5" y="8.5">N</text>
    <text class="lbl" x="214.5" y="8.5">G</text>
    <text class="lbl" x="23.5" y="122.0">E</text>
    <text class="lbl" x="102.0" y="122.0">H</text>
    <text class="lbl" x="124.5" y="122.0">L</text>
    <text class="lbl" x="169.5" y="122.0">O</text>
    <text class="lbl" x="214.5" y="122.0">F</text>
  </g>
  <g class="el" data-name="AB">
    <line class="line" x1="56.0" y1="136.5" x2="192.0" y2="136.5" />
    <line class="tick" x1="144.0" y1="133.0" x2="144.0" y2="140.0" />
    <text class="lbl" x="56.0" y="147.5">A</text>
    <text class="lbl" x="144.0" y="147.5">C</text>
    <text class="lbl" x="192.0" y="147.5">B</text>
  </g>
</svg>
