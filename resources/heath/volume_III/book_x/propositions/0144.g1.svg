<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 155" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="230" height="155" />
  <g class="el" data-name="DEFG">
    <rect class="line" x="22.5" y="18.5" width="188.0" height="93.0" />
    <line class="line" x1="102.5" y1="18.5" x2="102.5" y2="111.5" />
    <line class="line" x1="124.5" y1="18.5" x2="124.5" y2="111.5" />
    <line class="line" x1="168.5" y1="18.5" x2="168.5" y2="111.5" />
    <text class="lbl" x="22.5" y="8.5">D</text>
    <text class="lbl" x="102.5" y="8.5">K</text>
    <text class="lbl" x="124.5" y="8.5">M</text>
    <text class="lbl" x="168.5" y="8.5">N</text>
    <text class="lbl" x="210.5" y="8.5">G</text>
    <text class="lbl" x="22.5" y="121.5">E</text>
    <text class="lbl" x="102.5" y="121.5">H</text>
    <text class="lbl" x="124.5" y="121.5">L</text>
    <text class="lbl" x="168.5" y="121.5">O</text>
    <text class="lbl" x="210.5" y="121.5">F</text>
  </g>
  <g class="el" data-name="AB">
    <line class="line" x1="53.0" y1="138.0" x2="183.0" y2="138.0" />
    <line class="tick" x1="137.0" y1="134.5" x2="137.0" y2="141.5" />
    <text class="lbl" x="53.0" y="149.0">A</text>
    <text class="lbl" x="137.0" y="149.0">C</text>
    <text class="lbl" x="183.0" y="149.0">B</text>
  </g>
</svg>
