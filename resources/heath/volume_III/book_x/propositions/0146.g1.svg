<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 150" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="230" height="150" />
  <g class="el" data-name="DEFG">
    <rect class="line" x="23.5" y="18.0" width="189.0" height="92.5" />
    <line class="line" x1="101.5" y1="18.0" x2="101.5" y2="110.5" />
    <line class="line" x1="124.5" y1="18.0" x2="124.5" y2="110.5" />
    <line class="line" x1="168.5" y1="18.0" x2="168.5" y2="110.5" />
    <text class="lbl" x="23.5" y="8.0">D</text>
    <text class="lbl" x="101.5" y="8.0">K</text>
    <text class="lbl" x="124.5" y="8.0">M</text>
    <text class="lbl" x="168.5" y="8.0">N</text>
    <text class="lbl" x="212.5" y="8.0">G</text>
    <text class="lbl" x="23.5" y="120.5">E</text>
    <text class="lbl" x="101.5" y="120.5">H</text>
    <text class="lbl" x="124.5" y="120.5">L</text>
    <text class="lbl" x="168.5" y="120.5">O</text>
    <text class="lbl" x="212.5" y="120.5">F</text>
  </g>
  <g class="el" data-name="AB">
    <line class="line" x1="52.0" y1="131.5" x2="185.0" y2="131.5" />
    <line class="tick" x1="139.0" y1="128.0" x2="139.0" y2="135.0" />
    <text class="lbl" x="52.0" y="142.5">A</text>
    <text class="lbl" x="139.0" y="142.5">C</text>
    <text class="lbl" x="185.0" y="142.5">B</text>
  </g>
</svg>
