<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 150" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="230" height="150" />
  <g class="el" data-name="DEFG">
    <rect class="line" x="19.5" y="19.5" width="188.0" height="93.0" />
    <line class="line" x1="97.5" y1="19.5" x2="97.5" y2="112.5" />
    <line class="line" x1="119.5" y1="19.5" x2="119.5" y2="112.5" />
    <line class="line" x1="164.5" y1="19.5" x2="164.5" y2="112.5" />
    <text class="lbl" x="19.5" y="9.5">D</text>
    <text class="lbl" x="97.5" y="9.5">K</text>
    <text class="lbl" x="119.5" y="9.5">M</text>
    <text class="lbl" x="164.5" y="9.5">N</text>
    <text class="lbl" x="207.5" y="9.5">G</text>
    <text class="lbl" x="19.5" y="122.5">E</text>
    <text class="lbl" x="97.5" y="122.5">H</text>
    <text class="lbl" x="119.5" y="122.5">L</text>
    <text class="lbl" x="164.5" y="122.5">O</text>
    <text class="lbl" x="207.5" y="122.5">F</text>
  </g>
  <g class="el" data-name="AB">
    <line class="line" x1="48.0" y1="132.5" x2="180.0" y2="132.5" />
    <line class="tick" x1="134.0" y1="129.0" x2="134.0" y2="136.0" />
    <text class="lbl" x="48.0" y="143.5">A</text>
    <text class="lbl" x="134.0" y="143.5">C</text>
    <text class="lbl" x="180.0" y="143.5">B</text>
  </g>
</svg>
