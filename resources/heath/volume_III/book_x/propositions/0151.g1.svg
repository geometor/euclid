    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="30.0" y1="41.5" x2="137.0" y2="41.5" class="geom-line geom-overlay" />
    <line id="hl-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" x1="30.0" y1="41.5" x2="103.0" y2="41.5" class="geom-line geom-overlay" />
    <line id="hl-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" x1="103.0" y1="41.5" x2="137.0" y2="41.5" class="geom-line geom-overlay" />

    <polyline id="hl-sec-AEB" data-ref="/ A E B /" data-aliases="/ B E A / | } A E B { | } B E A {" points="18.0,18.5 112.0,18.5 159.0,18.5" class="geom-line geom-overlay" />
    <polyline id="hl-sec-CFD" data-ref="/ C F D /" data-aliases="/ D F C / | } C F D { | } D F C {" points="30.0,41.5 103.0,41.5 137.0,41.5" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
