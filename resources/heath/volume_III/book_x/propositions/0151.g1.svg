    <circle id="el-pt-F" data-ref="F" data-type="point" cx="103.0" cy="41.5" r="2.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="137.0" cy="41.5" r="2.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="21.0" y="8.0" class="geom-label">A</text>
    <text id="lbl-E" data-ref="E" x="112.0" y="8.0" class="geom-label">E</text>
    <text id="lbl-B" data-ref="B" x="156.0" y="8.0" class="geom-label">B</text>
