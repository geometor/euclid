<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 65" width="100%" height="100%" class="euclid-graphic" data-graphic-id="0151.g1" data-folio="0151" data-graphic="g1" data-proposition="X.67">
  <style>
    .euclid-graphic {
      font-family: "Times New Roman", Times, Georgia, serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s ease, stroke-width 0.15s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-AB" data-ref="[ A B ]" data-aliases="[ B A ]" data-type="line" x1="18.0" y1="18.5" x2="159.0" y2="18.5" class="geom-line" />
    <line x1="112.0" y1="15.0" x2="112.0" y2="22.0" class="geom-line" />
    <line id="el-line-CD" data-ref="[ C D ]" data-aliases="[ D C ]" data-type="line" x1="30.0" y1="41.5" x2="137.0" y2="41.5" class="geom-line" />
    <line x1="103.0" y1="38.0" x2="103.0" y2="45.0" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Segments & Sections) -->
  <g id="graphics">
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="18.0" y1="18.5" x2="159.0" y2="18.5" class="geom-line" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="18.0" y1="18.5" x2="112.0" y2="18.5" class="geom-line geom-overlay" />
    <line id="el-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" data-type="segment" x1="112.0" y1="18.5" x2="159.0" y2="18.5" class="geom-line geom-overlay" />

    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="30.0" y1="41.5" x2="137.0" y2="41.5" class="geom-line" />
    <line id="el-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" data-type="segment" x1="30.0" y1="41.5" x2="103.0" y2="41.5" class="geom-line geom-overlay" />
    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" data-type="segment" x1="103.0" y1="41.5" x2="137.0" y2="41.5" class="geom-line geom-overlay" />

    <polyline id="el-sec-AEB" data-ref="/ A E B /" data-aliases="/ B E A / | } A E B { | } B E A {" data-type="section" points="18.0,18.5 112.0,18.5 159.0,18.5" class="geom-line geom-overlay" />
    <polyline id="el-sec-CFD" data-ref="/ C F D /" data-aliases="/ D F C / | } C F D { | } D F C {" data-type="section" points="30.0,41.5 103.0,41.5 137.0,41.5" class="geom-line geom-overlay" />
  </g>

