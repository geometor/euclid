    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="24.5" y1="14.0" x2="24.5" y2="79.0" class="geom-line geom-overlay" />
    <line id="el-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" data-type="segment" x1="24.5" y1="79.0" x2="24.5" y2="122.0" class="geom-line geom-overlay" />

