    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" data-type="segment" x1="56.5" y1="96.0" x2="56.5" y2="121.0" class="geom-line geom-overlay" />

    <polyline id="el-sec-AEB" data-ref="/ A E B /" data-aliases="/ B E A / | } A E B { | } B E A {" data-type="section" points="24.5,14.0 24.5,79.0 24.5,122.0" class="geom-line geom-overlay" />
    <polyline id="el-sec-CFD" data-ref="/ C F D /" data-aliases="/ D F C / | } C F D { | } D F C {" data-type="section" points="56.5,44.0 56.5,96.0 56.5,121.0" class="geom-line geom-overlay" />
