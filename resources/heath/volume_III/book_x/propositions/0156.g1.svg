<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 190" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="390" height="190" />
  <g class="el" data-name="ABCD">
    <rect class="line" x="21.0" y="18.5" width="86.0" height="153.5" />
    <line class="line" x1="83.5" y1="18.5" x2="83.5" y2="172.0" />
    <text class="lbl" x="21.0" y="9.0">A</text>
    <text class="lbl" x="83.5" y="9.0">C</text>
    <text class="lbl" x="83.5" y="182.0">B</text>
    <text class="lbl" x="107.0" y="182.0">D</text>
  </g>
  <g class="el" data-name="EHKFGI">
    <rect class="line" x="221.5" y="47.5" width="146.0" height="108.5" />
    <line class="line" x1="312.5" y1="47.5" x2="312.5" y2="156.0" />
    <text class="lbl" x="221.5" y="38.0">E</text>
    <text class="lbl" x="312.5" y="38.0">H</text>
    <text class="lbl" x="367.5" y="38.0">K</text>
    <text class="lbl" x="221.5" y="166.5">F</text>
    <text class="lbl" x="312.5" y="166.5">G</text>
    <text class="lbl" x="367.5" y="166.5">I</text>
  </g>
</svg>
