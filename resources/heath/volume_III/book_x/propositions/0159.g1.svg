<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 125" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="500" height="125" />
  <g class="el" data-name="ABCD">
    <rect class="line" x="21.5" y="16.5" width="126.0" height="87.5" />
    <line class="line" x1="105.5" y1="16.5" x2="105.5" y2="104.0" />
    <text class="lbl" x="21.5" y="7.5">A</text>
    <text class="lbl" x="105.5" y="7.5">C</text>
    <text class="lbl" x="105.5" y="114.5">B</text>
    <text class="lbl" x="147.5" y="114.5">D</text>
  </g>
  <g class="el" data-name="EFHGKI">
    <rect class="line" x="274.5" y="41.0" width="203.5" height="59.0" />
    <line class="line" x1="274.5" y1="83.0" x2="478.0" y2="83.0" />
    <text class="lbl" x="274.5" y="31.5">E</text>
    <text class="lbl" x="478.0" y="31.5">F</text>
    <text class="lbl" x="265.0" y="83.0">H</text>
    <text class="lbl" x="487.5" y="83.0">G</text>
    <text class="lbl" x="274.5" y="110.5">K</text>
    <text class="lbl" x="478.0" y="110.5">I</text>
  </g>
</svg>
