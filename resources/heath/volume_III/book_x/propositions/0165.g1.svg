<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 175" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="410" height="175" />
  <g class="el" data-name="AB">
    <line class="line" x1="129.0" y1="21.5" x2="276.0" y2="21.5" />
    <text class="lbl" x="132.0" y="11.0">A</text>
    <line class="tick" x1="161.0" y1="18.0" x2="161.0" y2="25.0" />
    <text class="lbl" x="161.0" y="11.0">C</text>
    <text class="lbl" x="273.0" y="11.0">B</text>
  </g>
  <g class="el" data-name="DIGFEH">
    <rect class="line" x="17.0" y="53.0" width="371.5" height="100.5" />
    <line class="line" x1="378.5" y1="53.0" x2="378.5" y2="153.5" />
    <text class="lbl" x="17.0" y="43.5">D</text>
    <text class="lbl" x="376.5" y="43.5">F</text>
    <text class="lbl" x="390.5" y="43.5">G</text>
    <text class="lbl" x="17.0" y="164.0">I</text>
    <text class="lbl" x="376.5" y="164.0">H</text>
    <text class="lbl" x="390.5" y="164.0">E</text>
  </g>
</svg>
