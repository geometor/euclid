<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="220" height="160" />
  <g class="el" data-name="DIGFEH">
    <rect class="line" x="18.5" y="18.5" width="181.0" height="93.5" />
    <line class="line" x1="175.5" y1="18.5" x2="175.5" y2="112.0" />
    <text class="lbl" x="18.5" y="9.0">D</text>
    <text class="lbl" x="174.0" y="9.0">F</text>
    <text class="lbl" x="200.5" y="9.0">G</text>
    <text class="lbl" x="18.5" y="122.0">I</text>
    <text class="lbl" x="174.0" y="122.0">H</text>
    <text class="lbl" x="200.5" y="122.0">E</text>
  </g>
  <g class="el" data-name="AB">
    <line class="line" x1="54.0" y1="139.5" x2="168.0" y2="139.5" />
    <text class="lbl" x="57.0" y="150.5">A</text>
    <line class="tick" x1="111.0" y1="136.0" x2="111.0" y2="143.0" />
    <text class="lbl" x="111.0" y="150.5">C</text>
    <text class="lbl" x="165.0" y="150.5">B</text>
  </g>
</svg>
