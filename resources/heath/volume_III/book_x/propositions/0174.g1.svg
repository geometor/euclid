<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 355" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="170" height="355" />
  <g class="el" data-name="AD">
    <line class="line" x1="16.0" y1="21.5" x2="154.0" y2="21.5" />
    <text class="lbl" x="19.0" y="11.0">A</text>
    <line class="tick" x1="80.0" y1="18.0" x2="80.0" y2="25.0" />
    <text class="lbl" x="80.0" y="11.0">B</text>
    <line class="tick" x1="122.0" y1="18.0" x2="122.0" y2="25.0" />
    <text class="lbl" x="122.0" y="11.0">C</text>
    <text class="lbl" x="151.0" y="11.0">D</text>
  </g>
  <g class="el" data-name="FEIN">
    <rect class="line" x="29.0" y="45.5" width="92.0" height="289.5" />
    <line class="line" x1="29.0" y1="65.5" x2="121.0" y2="65.5" />
    <line class="line" x1="29.0" y1="237.0" x2="121.0" y2="237.0" />
    <text class="lbl" x="19.0" y="45.5">F</text>
    <text class="lbl" x="130.5" y="45.5">E</text>
    <text class="lbl" x="19.0" y="65.5">L</text>
    <text class="lbl" x="130.5" y="65.5">H</text>
    <text class="lbl" x="19.0" y="237.0">G</text>
    <text class="lbl" x="130.5" y="237.0">M</text>
    <text class="lbl" x="19.0" y="335.0">I</text>
    <text class="lbl" x="130.5" y="335.0">N</text>
  </g>
</svg>
