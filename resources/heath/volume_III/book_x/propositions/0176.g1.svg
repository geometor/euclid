    <circle id="el-pt-B" data-ref="B" data-type="point" cx="72.0" cy="20.0" r="2.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="168.0" cy="20.0" r="2.2" class="geom-point" />
