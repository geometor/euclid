    <polyline id="hl-sec-BCD" data-ref="/ B C D /" data-aliases="/ D C B / | } B C D { | } D C B {" points="72.0,20.0 168.0,20.0 200.0,20.0" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
