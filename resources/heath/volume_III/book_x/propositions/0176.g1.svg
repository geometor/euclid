    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="15.0" y1="20.0" x2="168.0" y2="20.0" class="geom-line geom-overlay" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="15.0" y1="20.0" x2="72.0" y2="20.0" class="geom-line geom-overlay" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="72.0" y1="20.0" x2="200.0" y2="20.0" class="geom-line geom-overlay" />
