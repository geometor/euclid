    <polyline id="el-sec-ABD" data-ref="/ A B D /" data-aliases="/ D B A / | } A B D { | } D B A {" data-type="section" points="15.0,20.0 72.0,20.0 200.0,20.0" fill="none" class="geom-line geom-overlay" />
    <polyline id="el-sec-ACD" data-ref="/ A C D /" data-aliases="/ D C A / | } A C D { | } D C A {" data-type="section" points="15.0,20.0 168.0,20.0 200.0,20.0" fill="none" class="geom-line geom-overlay" />
