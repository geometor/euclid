<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 325 170" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="325" height="170" />
  <g class="el" data-name="AD">
    <line class="line" x1="105.0" y1="20.5" x2="242.0" y2="20.5" />
    <text class="lbl" x="108.0" y="10.0">A</text>
    <line class="tick" x1="147.0" y1="17.0" x2="147.0" y2="24.0" />
    <text class="lbl" x="147.0" y="10.0">B</text>
    <line class="tick" x1="213.0" y1="17.0" x2="213.0" y2="24.0" />
    <text class="lbl" x="213.0" y="10.0">C</text>
    <text class="lbl" x="239.0" y="10.0">D</text>
  </g>
  <g class="el" data-name="EFNI">
    <rect class="line" x="16.0" y="51.5" width="287.5" height="94.0" />
    <line class="line" x1="36.5" y1="51.5" x2="36.5" y2="145.5" />
    <line class="line" x1="205.5" y1="51.5" x2="205.5" y2="145.5" />
    <text class="lbl" x="16.0" y="42.0">E</text>
    <text class="lbl" x="36.5" y="42.0">H</text>
    <text class="lbl" x="205.5" y="42.0">M</text>
    <text class="lbl" x="303.5" y="42.0">N</text>
    <text class="lbl" x="16.0" y="156.0">F</text>
    <text class="lbl" x="36.5" y="156.0">L</text>
    <text class="lbl" x="205.5" y="156.0">G</text>
    <text class="lbl" x="303.5" y="156.0">I</text>
  </g>
</svg>
