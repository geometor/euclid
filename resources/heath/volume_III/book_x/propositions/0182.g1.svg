<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 65" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="390" height="65" />
  <g class="el" data-name="A">
    <line class="line" x1="29.0" y1="17.5" x2="139.0" y2="17.5" />
    <text class="lbl" x="18.0" y="17.5">A</text>
  </g>
  <g class="el" data-name="BG">
    <line class="line" x1="211.0" y1="17.5" x2="372.0" y2="17.5" />
    <text class="lbl" x="214.0" y="7.0">B</text>
    <line class="tick" x1="244.0" y1="14.0" x2="244.0" y2="21.0" />
    <text class="lbl" x="244.0" y="7.0">C</text>
    <text class="lbl" x="369.0" y="7.0">G</text>
  </g>
  <g class="el" data-name="H">
    <line class="line" x1="25.0" y1="44.5" x2="124.0" y2="44.5" />
    <text class="lbl" x="14.0" y="44.5">H</text>
  </g>
  <g class="el" data-name="ED">
    <line class="line" x1="238.0" y1="44.5" x2="363.0" y2="44.5" />
    <text class="lbl" x="241.0" y="55.5">E</text>
    <line class="tick" x1="286.0" y1="41.0" x2="286.0" y2="48.0" />
    <text class="lbl" x="286.0" y="55.5">F</text>
    <text class="lbl" x="360.0" y="55.5">D</text>
  </g>
</svg>
