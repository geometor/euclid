<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255 130" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="255" height="130" />
  <g class="el" data-name="A">
    <line class="line" x1="63.0" y1="18.0" x2="194.0" y2="18.0" />
    <text class="lbl" x="128.5" y="7.0">A</text>
  </g>
  <g class="el" data-name="BG">
    <line class="line" x1="24.0" y1="50.5" x2="242.0" y2="50.5" />
    <text class="lbl" x="27.0" y="40.0">B</text>
    <line class="tick" x1="68.0" y1="47.0" x2="68.0" y2="54.0" />
    <text class="lbl" x="68.0" y="40.0">C</text>
    <text class="lbl" x="239.0" y="40.0">G</text>
  </g>
  <g class="el" data-name="H">
    <line class="line" x1="38.0" y1="83.5" x2="168.0" y2="83.5" />
    <text class="lbl" x="103.0" y="72.5">H</text>
  </g>
  <g class="el" data-name="ED">
    <line class="line" x1="54.0" y1="111.5" x2="196.0" y2="111.5" />
    <text class="lbl" x="57.0" y="122.5">E</text>
    <line class="tick" x1="105.0" y1="108.0" x2="105.0" y2="115.0" />
    <text class="lbl" x="105.0" y="122.5">F</text>
    <text class="lbl" x="193.0" y="122.5">D</text>
  </g>
</svg>
