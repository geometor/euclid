<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 155" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="260" height="155" />
  <g class="el" data-name="A">
    <line class="line" x1="31.0" y1="16.5" x2="200.0" y2="16.5" />
    <text class="lbl" x="115.5" y="5.5">A</text>
  </g>
  <g class="el" data-name="FG">
    <line class="line" x1="22.0" y1="44.0" x2="245.0" y2="44.0" />
    <text class="lbl" x="25.0" y="33.5">F</text>
    <line class="tick" x1="61.0" y1="40.5" x2="61.0" y2="47.5" />
    <text class="lbl" x="61.0" y="33.5">H</text>
    <text class="lbl" x="242.0" y="33.5">G</text>
  </g>
  <g class="el" data-name="K">
    <line class="line" x1="64.0" y1="80.5" x2="197.0" y2="80.5" />
    <text class="lbl" x="130.5" y="69.5">K</text>
  </g>
  <g class="el" data-name="E">
    <line class="line" x1="106.0" y1="110.5" x2="192.0" y2="110.5" />
    <text class="lbl" x="201.0" y="110.5">E</text>
  </g>
  <g class="el" data-name="BC">
    <line class="line" x1="79.0" y1="137.0" x2="228.0" y2="137.0" />
    <text class="lbl" x="82.0" y="148.0">B</text>
    <line class="tick" x1="132.0" y1="133.5" x2="132.0" y2="140.5" />
    <text class="lbl" x="132.0" y="148.0">D</text>
    <text class="lbl" x="225.0" y="148.0">C</text>
  </g>
</svg>
