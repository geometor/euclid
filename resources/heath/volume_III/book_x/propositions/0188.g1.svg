<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 75" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="430" height="75" />
  <g class="el" data-name="A">
    <line class="line" x1="28.0" y1="20.5" x2="126.0" y2="20.5" />
    <text class="lbl" x="17.0" y="20.5">A</text>
  </g>
  <g class="el" data-name="BG">
    <line class="line" x1="259.0" y1="20.5" x2="387.0" y2="20.5" />
    <text class="lbl" x="262.0" y="10.0">B</text>
    <line class="tick" x1="312.0" y1="17.0" x2="312.0" y2="24.0" />
    <text class="lbl" x="312.0" y="10.0">C</text>
    <text class="lbl" x="384.0" y="10.0">G</text>
  </g>
  <g class="el" data-name="H">
    <line class="line" x1="25.0" y1="54.0" x2="136.0" y2="54.0" />
    <text class="lbl" x="14.0" y="54.0">H</text>
  </g>
  <g class="el" data-name="DE">
    <line class="line" x1="231.0" y1="55.0" x2="412.0" y2="55.0" />
    <text class="lbl" x="234.0" y="66.0">D</text>
    <line class="tick" x1="352.0" y1="51.5" x2="352.0" y2="58.5" />
    <text class="lbl" x="352.0" y="66.0">F</text>
    <text class="lbl" x="409.0" y="66.0">E</text>
  </g>
</svg>
