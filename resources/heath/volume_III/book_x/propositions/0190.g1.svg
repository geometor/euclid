<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 155 215" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="155" height="215" />
  <g class="el" data-name="A">
    <line class="line" x1="27.0" y1="19.0" x2="27.0" y2="154.0" />
    <text class="lbl" x="37.0" y="97.0">A</text>
  </g>
  <g class="el" data-name="H">
    <line class="line" x1="60.0" y1="57.0" x2="60.0" y2="169.0" />
    <text class="lbl" x="70.0" y="125.0">H</text>
  </g>
  <g class="el" data-name="BG">
    <line class="line" x1="104.0" y1="20.0" x2="104.0" y2="147.0" />
    <text class="lbl" x="93.0" y="24.0">B</text>
    <line class="tick" x1="100.5" y1="88.0" x2="107.5" y2="88.0" />
    <text class="lbl" x="93.0" y="88.0">C</text>
    <text class="lbl" x="93.0" y="157.0">G</text>
  </g>
  <g class="el" data-name="DE">
    <line class="line" x1="130.0" y1="14.0" x2="130.0" y2="199.0" />
    <text class="lbl" x="141.0" y="20.0">D</text>
    <line class="tick" x1="126.5" y1="146.0" x2="133.5" y2="146.0" />
    <text class="lbl" x="141.0" y="146.0">F</text>
    <text class="lbl" x="135.0" y="207.0">E</text>
  </g>
</svg>
