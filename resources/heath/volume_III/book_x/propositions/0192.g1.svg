<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 265 155" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="265" height="155" />
  <g class="el" data-name="A">
    <line class="line" x1="53.0" y1="18.5" x2="223.0" y2="18.5" />
    <text class="lbl" x="42.0" y="18.5">A</text>
  </g>
  <g class="el" data-name="FG">
    <line class="line" x1="28.0" y1="47.0" x2="247.0" y2="47.0" />
    <text class="lbl" x="31.0" y="58.0">F</text>
    <line class="tick" x1="67.0" y1="43.5" x2="67.0" y2="50.5" />
    <text class="lbl" x="67.0" y="58.0">H</text>
    <text class="lbl" x="244.0" y="58.0">G</text>
  </g>
  <g class="el" data-name="K">
    <line class="line" x1="27.0" y1="78.5" x2="159.0" y2="78.5" />
    <text class="lbl" x="16.0" y="78.5">K</text>
  </g>
  <g class="el" data-name="E">
    <line class="line" x1="27.0" y1="107.5" x2="114.0" y2="107.5" />
    <text class="lbl" x="16.0" y="107.5">E</text>
  </g>
  <g class="el" data-name="BC">
    <line class="line" x1="59.0" y1="137.5" x2="205.0" y2="137.5" />
    <text class="lbl" x="62.0" y="148.0">B</text>
    <line class="tick" x1="111.0" y1="134.0" x2="111.0" y2="141.0" />
    <text class="lbl" x="111.0" y="148.0">D</text>
    <text class="lbl" x="202.0" y="148.0">C</text>
  </g>
</svg>
