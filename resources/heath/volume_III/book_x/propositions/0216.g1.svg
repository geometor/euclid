<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 145" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="375" height="145" />
  <g class="el" data-name="AG">
    <line class="line" x1="123.0" y1="22.0" x2="263.0" y2="22.0" />
    <line class="tick" x1="206.0" y1="18.5" x2="206.0" y2="25.5" />
    <text class="lbl" x="123.0" y="12.0">A</text>
    <text class="lbl" x="206.0" y="12.0">B</text>
    <text class="lbl" x="263.0" y="12.0">G</text>
  </g>
  <g class="el" data-name="CDML">
    <rect class="line" x="17.5" y="57.5" width="337.0" height="64.0" />
    <line class="line" x1="133.5" y1="57.5" x2="133.5" y2="121.5" />
    <line class="line" x1="244.5" y1="57.5" x2="244.5" y2="121.5" />
    <line class="line" x1="314.5" y1="57.5" x2="314.5" y2="121.5" />
    <text class="lbl" x="17.5" y="47.5">C</text>
    <text class="lbl" x="133.5" y="47.5">F</text>
    <text class="lbl" x="244.5" y="47.5">N</text>
    <text class="lbl" x="314.5" y="47.5">K</text>
    <text class="lbl" x="354.5" y="47.5">M</text>
    <text class="lbl" x="17.5" y="131.5">D</text>
    <text class="lbl" x="133.5" y="131.5">E</text>
    <text class="lbl" x="244.5" y="131.5">O</text>
    <text class="lbl" x="314.5" y="131.5">H</text>
    <text class="lbl" x="354.5" y="131.5">L</text>
  </g>
</svg>
