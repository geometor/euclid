<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="380" height="140" />
  <g class="el" data-name="AG">
    <line class="line" x1="124.0" y1="19.5" x2="264.0" y2="19.5" />
    <line class="tick" x1="211.0" y1="16.0" x2="211.0" y2="23.0" />
    <text class="lbl" x="124.0" y="9.5">A</text>
    <text class="lbl" x="211.0" y="9.5">B</text>
    <text class="lbl" x="264.0" y="9.5">G</text>
  </g>
  <g class="el" data-name="CDML">
    <rect class="line" x="18.5" y="55.0" width="339.0" height="64.5" />
    <line class="line" x1="134.5" y1="55.0" x2="134.5" y2="119.5" />
    <line class="line" x1="247.5" y1="55.0" x2="247.5" y2="119.5" />
    <line class="line" x1="317.5" y1="55.0" x2="317.5" y2="119.5" />
    <text class="lbl" x="18.5" y="45.0">C</text>
    <text class="lbl" x="134.5" y="45.0">F</text>
    <text class="lbl" x="247.5" y="45.0">N</text>
    <text class="lbl" x="317.5" y="45.0">K</text>
    <text class="lbl" x="357.5" y="45.0">M</text>
    <text class="lbl" x="18.5" y="129.5">D</text>
    <text class="lbl" x="134.5" y="129.5">E</text>
    <text class="lbl" x="247.5" y="129.5">O</text>
    <text class="lbl" x="317.5" y="129.5">H</text>
    <text class="lbl" x="357.5" y="129.5">L</text>
  </g>
</svg>
