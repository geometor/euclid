<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 145" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="380" height="145" />
  <g class="el" data-name="AG">
    <line class="line" x1="124.0" y1="20.5" x2="260.0" y2="20.5" />
    <line class="tick" x1="209.0" y1="17.0" x2="209.0" y2="24.0" />
    <text class="lbl" x="124.0" y="10.5">A</text>
    <text class="lbl" x="209.0" y="10.5">B</text>
    <text class="lbl" x="260.0" y="10.5">G</text>
  </g>
  <g class="el" data-name="CDML">
    <rect class="line" x="20.5" y="52.0" width="337.0" height="68.0" />
    <line class="line" x1="133.5" y1="52.0" x2="133.5" y2="120.0" />
    <line class="line" x1="246.5" y1="52.0" x2="246.5" y2="120.0" />
    <line class="line" x1="315.5" y1="52.0" x2="315.5" y2="120.0" />
    <text class="lbl" x="20.5" y="42.0">C</text>
    <text class="lbl" x="133.5" y="42.0">F</text>
    <text class="lbl" x="246.5" y="42.0">N</text>
    <text class="lbl" x="315.5" y="42.0">K</text>
    <text class="lbl" x="357.5" y="42.0">M</text>
    <text class="lbl" x="20.5" y="130.0">D</text>
    <text class="lbl" x="133.5" y="130.0">E</text>
    <text class="lbl" x="246.5" y="130.0">O</text>
    <text class="lbl" x="315.5" y="130.0">H</text>
    <text class="lbl" x="357.5" y="130.0">L</text>
  </g>
</svg>
