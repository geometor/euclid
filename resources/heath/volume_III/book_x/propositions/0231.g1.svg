<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 140" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="375" height="140" />
  <g class="el" data-name="AG">
    <line class="line" x1="121.0" y1="18.5" x2="259.0" y2="18.5" />
    <line class="tick" x1="208.0" y1="15.0" x2="208.0" y2="22.0" />
    <text class="lbl" x="121.0" y="8.5">A</text>
    <text class="lbl" x="208.0" y="8.5">B</text>
    <text class="lbl" x="259.0" y="8.5">G</text>
  </g>
  <g class="el" data-name="CDML">
    <rect class="line" x="16.5" y="53.5" width="336.0" height="63.5" />
    <line class="line" x1="131.0" y1="53.5" x2="131.0" y2="117.0" />
    <line class="line" x1="241.5" y1="53.5" x2="241.5" y2="117.0" />
    <line class="line" x1="310.5" y1="53.5" x2="310.5" y2="117.0" />
    <text class="lbl" x="16.5" y="43.5">C</text>
    <text class="lbl" x="131.0" y="43.5">F</text>
    <text class="lbl" x="241.5" y="43.5">N</text>
    <text class="lbl" x="310.5" y="43.5">K</text>
    <text class="lbl" x="352.5" y="43.5">M</text>
    <text class="lbl" x="16.5" y="127.0">D</text>
    <text class="lbl" x="131.0" y="127.0">E</text>
    <text class="lbl" x="241.5" y="127.0">O</text>
    <text class="lbl" x="310.5" y="127.0">H</text>
    <text class="lbl" x="352.5" y="127.0">L</text>
  </g>
</svg>
