<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 70" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="190" height="70" />
  <g class="el" data-name="AE">
    <line class="line" x1="31.0" y1="21.5" x2="149.0" y2="21.5" />
    <text class="lbl" x="34.0" y="11.5">A</text>
    <line class="tick" x1="92.0" y1="18.0" x2="92.0" y2="25.0" />
    <text class="lbl" x="92.0" y="11.5">B</text>
    <text class="lbl" x="146.0" y="11.5">E</text>
  </g>
  <g class="el" data-name="CF">
    <line class="line" x1="15.0" y1="51.0" x2="170.0" y2="51.0" />
    <text class="lbl" x="18.0" y="41.0">C</text>
    <line class="tick" x1="90.0" y1="47.5" x2="90.0" y2="54.5" />
    <text class="lbl" x="90.0" y="41.0">D</text>
    <text class="lbl" x="167.0" y="41.0">F</text>
  </g>
</svg>
