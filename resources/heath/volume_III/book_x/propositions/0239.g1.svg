<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295 210" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="295" height="210" />
  <g class="el" data-name="AEBCD">
    <rect class="line" x="85.5" y="19.0" width="110.0" height="94.5" />
    <line class="line" x1="170.0" y1="19.0" x2="170.0" y2="113.5" />
    <text class="lbl" x="85.5" y="9.5">A</text>
    <text class="lbl" x="170.0" y="9.5">E</text>
    <text class="lbl" x="195.5" y="9.5">B</text>
    <text class="lbl" x="85.5" y="123.5">C</text>
    <text class="lbl" x="170.0" y="123.5">D</text>
  </g>
  <g class="el" data-name="HKFLG">
    <rect class="line" x="18.0" y="143.5" width="257.0" height="47.0" />
    <line class="line" x1="187.5" y1="143.5" x2="187.5" y2="190.5" />
    <text class="lbl" x="187.5" y="134.0">L</text>
    <text class="lbl" x="275.0" y="134.0">G</text>
    <text class="lbl" x="18.0" y="200.5">H</text>
    <text class="lbl" x="187.5" y="200.5">K</text>
    <text class="lbl" x="275.0" y="200.5">F</text>
  </g>
</svg>
