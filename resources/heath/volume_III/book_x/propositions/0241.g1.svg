    <text class="lbl" x="274.0" y="12.0">F</text>
    <text class="lbl" x="312.0" y="12.0">K</text>
    <text class="lbl" x="335.0" y="12.0">H</text>
    <text class="lbl" x="274.0" y="189.5">G</text>
    <text class="lbl" x="312.0" y="189.5">L</text>
  </g>
</svg>
