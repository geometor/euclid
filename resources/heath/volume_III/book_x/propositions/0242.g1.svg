<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 355 200" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="355" height="200" />
  <g class="el" data-name="BEADC">
    <rect class="line" x="22.0" y="48.0" width="112.5" height="82.5" />
    <line class="line" x1="93.5" y1="48.0" x2="93.5" y2="130.5" />
    <text class="lbl" x="22.0" y="38.5">B</text>
    <text class="lbl" x="93.5" y="38.5">E</text>
    <text class="lbl" x="22.0" y="140.5">A</text>
    <text class="lbl" x="93.5" y="140.5">D</text>
    <text class="lbl" x="134.5" y="140.5">C</text>
  </g>
  <g class="el" data-name="FKHGL">
    <rect class="line" x="277.0" y="18.5" width="59.5" height="159.0" />
    <line class="line" x1="315.0" y1="18.5" x2="315.0" y2="177.5" />
    <text class="lbl" x="277.0" y="9.0">F</text>
    <text class="lbl" x="315.0" y="9.0">K</text>
    <text class="lbl" x="336.5" y="9.0">H</text>
    <text class="lbl" x="277.0" y="187.5">G</text>
    <text class="lbl" x="315.0" y="187.5">L</text>
  </g>
</svg>
