<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="200" height="240" />
  <g class="el" data-name="AB">
    <line class="line" x1="30.0" y1="19.5" x2="154.0" y2="19.5" />
    <text class="lbl" x="33.0" y="9.0">A</text>
    <text class="lbl" x="151.0" y="9.0">B</text>
  </g>
  <g class="el" data-name="DGEFC">
    <rect class="line" x="20.5" y="54.0" width="91.0" height="165.5" />
    <line class="line" x1="111.5" y1="54.0" x2="184.0" y2="54.0" />
    <line class="tick" x1="78.0" y1="50.5" x2="78.0" y2="57.5" />
    <text class="lbl" x="20.5" y="44.0">D</text>
    <text class="lbl" x="78.0" y="44.0">G</text>
    <text class="lbl" x="111.5" y="44.0">E</text>
    <text class="lbl" x="181.0" y="44.0">F</text>
    <text class="lbl" x="20.5" y="230.0">C</text>
  </g>
</svg>
