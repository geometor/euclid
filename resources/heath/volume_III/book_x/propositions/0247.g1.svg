<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 105" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="580" height="105" />
  <g class="el" data-name="A">
    <line class="line" x1="18.0" y1="20.5" x2="138.0" y2="20.5" />
    <text class="lbl" x="10.0" y="20.5">A</text>
  </g>
  <g class="el" data-name="BC">
    <line class="line" x1="18.0" y1="50.5" x2="183.0" y2="50.5" />
    <text class="lbl" x="10.0" y="50.5">B</text>
    <line class="tick" x1="72.0" y1="47.0" x2="72.0" y2="54.0" />
    <text class="lbl" x="72.0" y="39.5">D</text>
    <text class="lbl" x="192.0" y="50.5">C</text>
  </g>
  <g class="el" data-name="G">
    <line class="line" x1="247.0" y1="46.5" x2="563.0" y2="46.5" />
    <text class="lbl" x="236.0" y="46.5">G</text>
  </g>
  <g class="el" data-name="KH">
    <line class="line" x1="76.0" y1="85.5" x2="455.0" y2="85.5" />
    <text class="lbl" x="79.0" y="94.5">K</text>
    <line class="tick" x1="142.0" y1="82.0" x2="142.0" y2="89.0" />
    <text class="lbl" x="142.0" y="94.5">E</text>
    <line class="tick" x1="232.0" y1="82.0" x2="232.0" y2="89.0" />
    <text class="lbl" x="232.0" y="94.5">F</text>
    <text class="lbl" x="452.0" y="94.5">H</text>
  </g>
</svg>
