<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 190" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="160" height="190" />
  <g class="el" data-name="A">
    <line class="line" x1="28.0" y1="18.0" x2="28.0" y2="110.0" />
    <text class="lbl" x="17.0" y="64.0">A</text>
  </g>
  <g class="el" data-name="CB">
    <line class="line" x1="63.0" y1="18.0" x2="63.0" y2="171.0" />
    <text class="lbl" x="52.0" y="22.0">C</text>
    <line class="tick" x1="59.5" y1="110.0" x2="66.5" y2="110.0" />
    <text class="lbl" x="52.0" y="110.0">D</text>
    <text class="lbl" x="52.0" y="167.0">B</text>
  </g>
  <g class="el" data-name="KH">
    <line class="line" x1="103.0" y1="18.0" x2="103.0" y2="142.0" />
    <text class="lbl" x="92.0" y="22.0">K</text>
    <line class="tick" x1="99.5" y1="82.0" x2="106.5" y2="82.0" />
    <text class="lbl" x="113.0" y="82.0">E</text>
    <line class="tick" x1="99.5" y1="107.0" x2="106.5" y2="107.0" />
    <text class="lbl" x="113.0" y="107.0">F</text>
    <text class="lbl" x="103.0" y="153.0">H</text>
  </g>
  <g class="el" data-name="G">
    <line class="line" x1="137.5" y1="19.0" x2="137.5" y2="73.0" />
    <text class="lbl" x="148.0" y="46.0">G</text>
  </g>
</svg>
