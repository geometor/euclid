<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 235 165" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="235" height="165" />
  <g class="el" data-name="AF">
    <line class="line" x1="55.0" y1="19.0" x2="168.0" y2="19.0" />
    <text class="lbl" x="58.0" y="8.5">A</text>
    <line class="tick" x1="128.0" y1="15.5" x2="128.0" y2="22.5" />
    <text class="lbl" x="128.0" y="8.5">B</text>
    <text class="lbl" x="165.0" y="8.5">F</text>
  </g>
  <g class="el" data-name="CD">
    <line class="line" x1="17.0" y1="49.5" x2="217.0" y2="49.5" />
    <text class="lbl" x="20.0" y="39.0">C</text>
    <line class="tick" x1="164.0" y1="46.0" x2="164.0" y2="53.0" />
    <text class="lbl" x="164.0" y="39.0">E</text>
    <text class="lbl" x="214.0" y="39.0">D</text>
  </g>
  <g class="el" data-name="G">
    <line class="line" x1="49.0" y1="81.0" x2="171.0" y2="81.0" />
    <text class="lbl" x="110.0" y="70.0">G</text>
  </g>
  <g class="el" data-name="H">
    <line class="line" x1="38.0" y1="111.5" x2="182.0" y2="111.5" />
    <text class="lbl" x="110.0" y="100.5">H</text>
  </g>
  <g class="el" data-name="KM">
    <line class="line" x1="35.0" y1="143.5" x2="185.0" y2="143.5" />
    <text class="lbl" x="38.0" y="133.0">K</text>
    <line class="tick" x1="133.0" y1="140.0" x2="133.0" y2="147.0" />
    <text class="lbl" x="133.0" y="133.0">L</text>
    <text class="lbl" x="182.0" y="133.0">M</text>
  </g>
</svg>
