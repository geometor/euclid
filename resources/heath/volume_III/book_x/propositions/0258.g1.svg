<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 130" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 3,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed, .el:hover .tick { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="280" height="130" />
  <g class="el" data-name="A">
    <line class="line" x1="30.0" y1="19.5" x2="123.0" y2="19.5" />
    <text class="lbl" x="19.0" y="19.5">A</text>
  </g>
  <g class="el" data-name="B">
    <line class="line" x1="30.0" y1="48.5" x2="268.0" y2="48.5" />
    <text class="lbl" x="19.0" y="48.5">B</text>
  </g>
  <g class="el" data-name="C">
    <line class="line" x1="29.0" y1="76.5" x2="214.0" y2="76.5" />
    <text class="lbl" x="18.0" y="76.5">C</text>
  </g>
  <g class="el" data-name="D">
    <line class="line" x1="30.0" y1="109.5" x2="239.0" y2="109.5" />
    <text class="lbl" x="19.0" y="109.5">D</text>
  </g>
</svg>
