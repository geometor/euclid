<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 130" width="100%" height="100%" class="euclid-graphic" data-graphic-id="0258.g1" data-folio="0258" data-graphic="g1" data-proposition="X.115">
  <style>
    .euclid-graphic {
      font-family: "Times New Roman", Times, Georgia, serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s ease, stroke-width 0.15s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.0 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 4.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-A" data-ref="[ A_l A_r ]" data-type="line" x1="30.0" y1="19.5" x2="123.0" y2="19.5" class="geom-line" />
    <line id="el-line-B" data-ref="[ B_l B_r ]" data-type="line" x1="30.0" y1="48.5" x2="268.0" y2="48.5" class="geom-line" />
    <line id="el-line-C" data-ref="[ C_l C_r ]" data-type="line" x1="29.0" y1="76.5" x2="214.0" y2="76.5" class="geom-line" />
    <line id="el-line-D" data-ref="[ D_l D_r ]" data-type="line" x1="30.0" y1="109.5" x2="239.0" y2="109.5" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Segments) -->
  <g id="graphics">
    <line id="el-mag-A" data-ref="A" data-aliases="/ A /" data-type="segment" x1="30.0" y1="19.5" x2="123.0" y2="19.5" class="geom-line" />
    <line id="el-mag-B" data-ref="B" data-aliases="/ B /" data-type="segment" x1="30.0" y1="48.5" x2="268.0" y2="48.5" class="geom-line" />
    <line id="el-mag-C" data-ref="C" data-aliases="/ C /" data-type="segment" x1="29.0" y1="76.5" x2="214.0" y2="76.5" class="geom-line" />
    <line id="el-mag-D" data-ref="D" data-aliases="/ D /" data-type="segment" x1="30.0" y1="109.5" x2="239.0" y2="109.5" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-mag-A" data-ref="A" data-aliases="/ A /" x1="30.0" y1="19.5" x2="123.0" y2="19.5" class="geom-line geom-overlay" />
    <line id="hl-mag-B" data-ref="B" data-aliases="/ B /" x1="30.0" y1="48.5" x2="268.0" y2="48.5" class="geom-line geom-overlay" />
    <line id="hl-mag-C" data-ref="C" data-aliases="/ C /" x1="29.0" y1="76.5" x2="214.0" y2="76.5" class="geom-line geom-overlay" />
    <line id="hl-mag-D" data-ref="D" data-aliases="/ D /" x1="30.0" y1="109.5" x2="239.0" y2="109.5" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points" />

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" data-aliases="/ A /" x="19.0" y="19.5" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" data-aliases="/ B /" x="19.0" y="48.5" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" data-aliases="/ C /" x="18.0" y="76.5" class="geom-label">C</text>
    <text id="lbl-D" data-ref="D" data-aliases="/ D /" x="19.0" y="109.5" class="geom-label">D</text>
  </g>
</svg>
