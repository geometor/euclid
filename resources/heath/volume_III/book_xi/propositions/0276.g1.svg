<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 195" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="156" height="195" />
  <g class="el">
    <line class="line" x1="76.0" y1="34.0" x2="144.0" y2="102.0" />
    <line class="line" x1="144.0" y1="102.0" x2="68.0" y2="178.0" />
    <line class="line" x1="68.0" y1="178.0" x2="12.0" y2="122.0" />
    <line class="line" x1="12.0" y1="122.0" x2="76.0" y2="34.0" />
    <line class="line" x1="76.0" y1="16.0" x2="76.0" y2="115.0" />
    <line class="line" x1="76.0" y1="115.0" x2="102.0" y2="78.0" />
    <line class="line" x1="62.0" y1="135.0" x2="76.0" y2="115.0" />
    <text class="lbl" x="67.0" y="20.0">C</text>
    <text class="lbl" x="110.0" y="76.0">D</text>
    <text class="lbl" x="85.0" y="117.0">B</text>
    <text class="lbl" x="57.0" y="145.0">A</text>
  </g>
</svg>
