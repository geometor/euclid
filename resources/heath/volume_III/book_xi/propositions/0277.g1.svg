<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 193 125" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="193" height="125" />
  <g class="el">
    <line class="line" x1="18.0" y1="24.0" x2="155.0" y2="24.0" />
    <line class="line" x1="155.0" y1="24.0" x2="176.0" y2="97.0" />
    <line class="line" x1="176.0" y1="97.0" x2="39.0" y2="97.0" />
    <line class="line" x1="39.0" y1="97.0" x2="18.0" y2="24.0" />
    <line class="line" x1="63.0" y1="63.0" x2="142.0" y2="49.0" />
    <line class="line" x1="102.0" y1="56.0" x2="138.0" y2="72.0" />
    <line class="line" x1="102.0" y1="56.0" x2="108.0" y2="88.0" />
    <text class="lbl" x="13.0" y="16.0">D</text>
    <text class="lbl" x="138.0" y="40.0">B</text>
    <text class="lbl" x="55.0" y="61.0">A</text>
    <text class="lbl" x="99.0" y="47.0">C</text>
    <text class="lbl" x="146.0" y="72.0">F</text>
    <text class="lbl" x="100.0" y="88.0">G</text>
    <text class="lbl" x="181.0" y="105.0">E</text>
  </g>
</svg>
