    <line id="el-line-AF" data-ref="[ A F ]" data-aliases="[ F A ] | [ A C ] | [ C F ]" data-type="line" x1="53.0" y1="61.0" x2="135.0" y2="63.0" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Polygons, Angles/Wedges & Segments) -->
  <g id="graphics">
    <polygon id="el-pl-DE" data-ref="&lt; D E &gt;" data-aliases="&lt; E D &gt;" data-type="polygon" points="22.0,23.0 133.0,23.0 179.0,105.0 42.0,97.0" class="geom-polygon" />
    <path id="el-ang-ACG" data-ref="&lt; A C G )" data-aliases="&lt; G C A )" data-type="wedge" d="M 93.00 62.00 L 75.01 61.55 A 18.0 18.0 0 0 0 91.84 79.96 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-GCF" data-ref="&lt; G C F )" data-aliases="&lt; F C G )" data-type="wedge" d="M 93.00 62.00 L 91.84 79.96 A 18.0 18.0 0 0 0 110.99 62.43 Z" class="wedge angle geom-overlay" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="53.0" y1="61.0" x2="93.0" y2="62.0" class="geom-line" />
    <line id="el-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" data-type="segment" x1="93.0" y1="62.0" x2="135.0" y2="63.0" class="geom-line" />
    <line id="el-seg-AF" data-ref="/ A F /" data-aliases="/ F A /" data-type="segment" x1="53.0" y1="61.0" x2="135.0" y2="63.0" class="geom-line geom-overlay" />
    <line id="el-seg-CB" data-ref="/ C B /" data-aliases="/ B C /" data-type="segment" x1="93.0" y1="62.0" x2="135.0" y2="48.0" class="geom-line" />
    <line id="el-seg-CG" data-ref="/ C G /" data-aliases="/ G C /" data-type="segment" x1="93.0" y1="62.0" x2="91.0" y2="93.0" class="geom-line" />
    <polyline id="el-sec-ACF" data-ref="/ A C F /" data-aliases="/ F C A / | } A C F { | } F C A {" data-type="section" points="53.0,61.0 93.0,62.0 135.0,63.0" fill="none" class="geom-line geom-overlay" />
    <polyline id="el-sec-ACB" data-ref="/ A C B /" data-aliases="/ B C A / | } A C B { | } B C A {" data-type="section" points="53.0,61.0 93.0,62.0 135.0,48.0" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-pl-DE" data-ref="&lt; D E &gt;" data-aliases="&lt; E D &gt;" points="22.0,23.0 133.0,23.0 179.0,105.0 42.0,97.0" class="geom-polygon geom-overlay" />
    <path id="hl-ang-ACG" data-ref="&lt; A C G )" data-aliases="&lt; G C A )" d="M 93.00 62.00 L 75.01 61.55 A 18.0 18.0 0 0 0 91.84 79.96 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-GCF" data-ref="&lt; G C F )" data-aliases="&lt; F C G )" d="M 93.00 62.00 L 91.84 79.96 A 18.0 18.0 0 0 0 110.99 62.43 Z" class="wedge angle geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="53.0" y1="61.0" x2="93.0" y2="62.0" class="geom-line geom-overlay" />
    <line id="hl-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" x1="93.0" y1="62.0" x2="135.0" y2="63.0" class="geom-line geom-overlay" />
    <line id="hl-seg-AF" data-ref="/ A F /" data-aliases="/ F A /" x1="53.0" y1="61.0" x2="135.0" y2="63.0" class="geom-line geom-overlay" />
    <line id="hl-seg-CB" data-ref="/ C B /" data-aliases="/ B C /" x1="93.0" y1="62.0" x2="135.0" y2="48.0" class="geom-line geom-overlay" />
    <line id="hl-seg-CG" data-ref="/ C G /" data-aliases="/ G C /" x1="93.0" y1="62.0" x2="91.0" y2="93.0" class="geom-line geom-overlay" />
    <polyline id="hl-sec-ACF" data-ref="/ A C F /" data-aliases="/ F C A / | } A C F { | } F C A {" points="53.0,61.0 93.0,62.0 135.0,63.0" fill="none" class="geom-line geom-overlay" />
    <polyline id="hl-sec-ACB" data-ref="/ A C B /" data-aliases="/ B C A / | } A C B { | } B C A {" points="53.0,61.0 93.0,62.0 135.0,48.0" fill="none" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="22.0" cy="23.0" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="179.0" cy="105.0" r="3.2" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="53.0" cy="61.0" r="3.2" class="geom-point" />
