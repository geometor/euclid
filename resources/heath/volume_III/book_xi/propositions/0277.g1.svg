    <circle id="el-pt-B" data-ref="B" data-type="point" cx="135.0" cy="48.0" r="3.2" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="91.0" cy="93.0" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
