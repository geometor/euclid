<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 213 193" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="213" height="193" />
  <g class="el">
    <line class="line" x1="75.0" y1="20.0" x2="190.0" y2="165.0" />
    <line class="line" x1="174.0" y1="25.0" x2="27.0" y2="165.0" />
    <line class="line" x1="75.0" y1="20.0" x2="174.0" y2="25.0" />
    <line class="line" x1="27.0" y1="165.0" x2="190.0" y2="165.0" />
    <line class="line" x1="74.0" y1="120.0" x2="154.0" y2="120.0" />
    <line class="line" x1="74.0" y1="120.0" x2="95.0" y2="165.0" />
    <line class="line" x1="154.0" y1="120.0" x2="155.0" y2="165.0" />
    <text class="lbl" x="67.0" y="18.0">A</text>
    <text class="lbl" x="183.0" y="25.0">D</text>
    <text class="lbl" x="104.0" y="76.0">E</text>
    <text class="lbl" x="65.0" y="116.0">F</text>
    <text class="lbl" x="164.0" y="117.0">G</text>
    <text class="lbl" x="20.0" y="174.0">C</text>
    <text class="lbl" x="95.0" y="175.0">H</text>
    <text class="lbl" x="155.0" y="175.0">K</text>
    <text class="lbl" x="193.0" y="174.0">B</text>
  </g>
</svg>
