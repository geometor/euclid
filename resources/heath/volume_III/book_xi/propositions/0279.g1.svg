    <line id="el-line-RS" data-ref="[ R S ]" data-aliases="[ S R ] | / R S / | / S R /" data-type="line" x1="135.0" y1="22.0" x2="209.0" y2="178.0" class="geom-line" />
    <line id="el-line-XY" data-ref="[ X Y ]" data-aliases="[ Y X ] | / X Y / | / Y X /" data-type="line" x1="24.0" y1="132.0" x2="226.0" y2="132.0" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Polygons & Segments) -->
  <g id="graphics">
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; B C A &gt; | &lt; C A B &gt; | &lt; A C B &gt; | &lt; B A C &gt; | &lt; C B A &gt;" data-type="polygon" points="151.48,56.74 70.2,132.0 187.18,132.0" class="geom-polygon" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="151.48" y1="56.74" x2="70.2" y2="132.0" class="geom-line geom-overlay" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="70.2" y1="132.0" x2="187.18" y2="132.0" class="geom-line geom-overlay" />
    <line id="el-seg-CA" data-ref="/ C A /" data-aliases="/ A C /" data-type="segment" x1="187.18" y1="132.0" x2="151.48" y2="56.74" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-line-PQ" data-ref="[ P Q ]" data-aliases="[ Q P ] | / P Q / | / Q P /" x1="189.0" y1="22.0" x2="27.0" y2="172.0" class="geom-line geom-overlay" />
    <line id="hl-line-RS" data-ref="[ R S ]" data-aliases="[ S R ] | / R S / | / S R /" x1="135.0" y1="22.0" x2="209.0" y2="178.0" class="geom-line geom-overlay" />
    <line id="hl-line-XY" data-ref="[ X Y ]" data-aliases="[ Y X ] | / X Y / | / Y X /" x1="24.0" y1="132.0" x2="226.0" y2="132.0" class="geom-line geom-overlay" />
    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; B C A &gt; | &lt; C A B &gt; | &lt; A C B &gt; | &lt; B A C &gt; | &lt; C B A &gt;" points="151.48,56.74 70.2,132.0 187.18,132.0" class="geom-polygon geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="151.48" y1="56.74" x2="70.2" y2="132.0" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="70.2" y1="132.0" x2="187.18" y2="132.0" class="geom-line geom-overlay" />
    <line id="hl-seg-CA" data-ref="/ C A /" data-aliases="/ A C /" x1="187.18" y1="132.0" x2="151.48" y2="56.74" class="geom-line geom-overlay" />
