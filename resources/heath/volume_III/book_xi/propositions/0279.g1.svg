<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 200" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="247" height="200" />
  <g class="el">
    <line class="line" x1="179.0" y1="22.0" x2="32.0" y2="168.0" />
    <line class="line" x1="131.0" y1="18.0" x2="203.0" y2="176.0" />
    <line class="line" x1="24.0" y1="132.0" x2="218.0" y2="132.0" />
    <text class="lbl" x="125.0" y="18.0">R</text>
    <text class="lbl" x="185.0" y="18.0">P</text>
    <text class="lbl" x="145.0" y="42.0">A</text>
    <text class="lbl" x="15.0" y="132.0">X</text>
    <text class="lbl" x="76.0" y="142.0">B</text>
    <text class="lbl" x="172.0" y="142.0">C</text>
    <text class="lbl" x="226.0" y="132.0">Y</text>
    <text class="lbl" x="26.0" y="175.0">Q</text>
    <text class="lbl" x="209.0" y="180.0">S</text>
  </g>
</svg>
