<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 206 221" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="206" height="221" />
  <g class="el">
    <line class="line" x1="54.0" y1="67.0" x2="168.0" y2="38.0" />
    <line class="line" x1="168.0" y1="38.0" x2="152.0" y2="163.0" />
    <line class="line" x1="152.0" y1="163.0" x2="19.0" y2="163.0" />
    <line class="line" x1="19.0" y1="163.0" x2="54.0" y2="67.0" />
    <line class="line" x1="73.0" y1="47.0" x2="102.0" y2="193.0" />
    <line class="line" x1="102.0" y1="193.0" x2="168.0" y2="38.0" />
    <line class="line" x1="73.0" y1="47.0" x2="168.0" y2="38.0" />
    <line class="line" x1="86.0" y1="113.0" x2="134.0" y2="108.0" />
    <text class="lbl" x="69.0" y="43.0">B</text>
    <text class="lbl" x="171.0" y="30.0">C</text>
    <text class="lbl" x="180.0" y="93.0">D</text>
    <text class="lbl" x="76.0" y="120.0">A</text>
    <text class="lbl" x="143.0" y="108.0">G</text>
    <text class="lbl" x="164.0" y="155.0">E</text>
    <text class="lbl" x="96.0" y="202.0">F</text>
  </g>
</svg>
