    <line id="el-ext-BO" data-ref="[ A B ]" data-aliases="[ B A ]" data-type="line" x1="56.0" y1="18.0" x2="2.0" y2="18.0" class="geom-line geom-dashed" />
    <line id="el-ext-DO" data-ref="[ C D ]" data-aliases="[ D C ]" data-type="line" x1="41.0" y1="58.0" x2="2.0" y2="44.5" class="geom-line geom-dashed" />
    <line id="el-ext-FO" data-ref="[ E F ]" data-aliases="[ F E ]" data-type="line" x1="56.0" y1="99.0" x2="2.0" y2="65.0" class="geom-line geom-dashed" />
