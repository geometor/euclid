  <g id="graphics">
    <polygon id="el-tri-BCD" data-ref="&lt; B C D &gt;" data-aliases="&lt; C D B &gt; | &lt; D B C &gt; | &lt; C B D &gt;" data-type="polygon" points="79.0,32.0 35.0,100.0 179.0,32.0" class="geom-polygon" />
