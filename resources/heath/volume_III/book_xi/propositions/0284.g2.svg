<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 142" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="240" height="142" />
  <g class="el">
    <line class="line" x1="104.0" y1="42.0" x2="198.0" y2="42.0" />
    <line class="line" x1="104.0" y1="42.0" x2="43.0" y2="108.0" />
    <line class="line" x1="82.0" y1="66.0" x2="198.0" y2="42.0" />
    <line class="line" x1="43.0" y1="108.0" x2="198.0" y2="42.0" />
    <text class="lbl" x="99.0" y="33.0">B</text>
    <text class="lbl" x="183.0" y="33.0">D</text>
    <text class="lbl" x="74.0" y="64.0">K</text>
    <text class="lbl" x="116.0" y="80.0">E</text>
    <text class="lbl" x="42.0" y="96.0">C</text>
  </g>
</svg>
