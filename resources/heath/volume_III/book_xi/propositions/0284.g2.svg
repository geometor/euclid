    <line id="el-seg-BK" data-ref="/ B K /" data-aliases="/ K B /" data-type="segment" x1="79.0" y1="32.0" x2="57.0" y2="66.0" class="geom-line geom-overlay" />
    <line id="el-seg-KC" data-ref="/ K C /" data-aliases="/ C K /" data-type="segment" x1="57.0" y1="66.0" x2="35.0" y2="100.0" class="geom-line geom-overlay" />
