<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 145" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="184" height="145" />
  <g class="el">
    <line class="line" x1="45.0" y1="56.0" x2="168.0" y2="56.0" />
    <line class="line" x1="168.0" y1="56.0" x2="146.0" y2="129.0" />
    <line class="line" x1="146.0" y1="129.0" x2="23.0" y2="129.0" />
    <line class="line" x1="23.0" y1="129.0" x2="45.0" y2="56.0" />
    <line class="line" x1="73.0" y1="19.0" x2="73.0" y2="101.0" />
    <line class="line" x1="73.0" y1="101.0" x2="103.0" y2="26.0" />
    <line class="line" x1="73.0" y1="101.0" x2="92.0" y2="70.0" />
    <line class="line" x1="73.0" y1="101.0" x2="127.0" y2="104.0" />
    <line class="line" x1="73.0" y1="101.0" x2="101.0" y2="123.0" />
    <text class="lbl" x="64.0" y="19.0">A</text>
    <text class="lbl" x="111.0" y="26.0">C</text>
    <text class="lbl" x="100.0" y="69.0">F</text>
    <text class="lbl" x="62.0" y="101.0">B</text>
    <text class="lbl" x="135.0" y="104.0">D</text>
    <text class="lbl" x="106.0" y="122.0">E</text>
  </g>
</svg>
