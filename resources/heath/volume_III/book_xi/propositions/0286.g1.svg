<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 207 164" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="207" height="164" />
  <g class="el">
    <line class="line" x1="114.0" y1="26.0" x2="114.0" y2="122.0" />
    <line class="line" x1="114.0" y1="91.0" x2="55.0" y2="112.0" />
    <line class="line" x1="114.0" y1="91.0" x2="162.0" y2="107.0" />
    <line class="line" x1="114.0" y1="91.0" x2="172.0" y2="89.0" />
    <line class="dashed" x1="114.0" y1="26.0" x2="55.0" y2="112.0" />
    <line class="dashed" x1="114.0" y1="26.0" x2="162.0" y2="107.0" />
    <line class="dashed" x1="114.0" y1="26.0" x2="172.0" y2="89.0" />
    <text class="lbl" x="114.0" y="17.0">A</text>
    <text class="lbl" x="106.0" y="99.0">O</text>
    <text class="lbl" x="49.0" y="120.0">B</text>
    <text class="lbl" x="168.0" y="113.0">C</text>
    <text class="lbl" x="182.0" y="86.0">C'</text>
  </g>
</svg>
