<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 159" width="176" height="159" class="euclid-graphic" data-graphic-id="0286.g2" data-folio="0286" data-graphic="g2" data-proposition="XI.5">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-AB" data-ref="[ A B ]" data-type="line" x1="95" y1="21" x2="95" y2="137" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Planes, Segments, Angle Wedges) -->
  <g id="graphics">
    <polygon id="el-plane-PAB" data-ref="&lt; P A B &gt;" data-aliases="&lt; A P B &gt; | &lt; A O P &gt;" data-type="polygon" points="21,91 95,21 95,137" class="geom-polygon" />
    <polygon id="el-plane-OPQ" data-ref="&lt; O P Q &gt;" data-aliases="&lt; P O Q &gt;" data-type="polygon" points="95,76 21,91 152,94" class="geom-polygon" />

    <!-- Collinear Sub-Segments along AB -->
    <line id="el-seg-AO" data-ref="/ A O /" data-aliases="/ O A /" data-type="segment" x1="95" y1="21" x2="95" y2="76" class="geom-line" />
    <line id="el-seg-OB" data-ref="/ O B /" data-aliases="/ B O /" data-type="segment" x1="95" y1="76" x2="95" y2="137" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="95" y1="21" x2="95" y2="137" class="geom-line geom-overlay" />

    <!-- Perpendiculars PO and OQ -->
    <line id="el-seg-PO" data-ref="/ P O /" data-aliases="/ O P /" data-type="segment" x1="21" y1="91" x2="95" y2="76" class="geom-line" />
    <line id="el-seg-OQ" data-ref="/ O Q /" data-aliases="/ Q O /" data-type="segment" x1="95" y1="76" x2="152" y2="94" class="geom-line" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-AOP" data-ref="&lt; A O P )" data-aliases="&lt; P O A )" data-type="wedge" d="M 95.00 76.00 L 95.00 56.00 A 20.0 20.0 0 0 0 75.40 79.97 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-AOQ" data-ref="&lt; A O Q )" data-aliases="&lt; Q O A )" data-type="wedge" d="M 95.00 76.00 L 95.00 56.00 A 20.0 20.0 0 0 1 114.07 82.02 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-plane-PAB" data-ref="&lt; P A B &gt;" data-aliases="&lt; A P B &gt; | &lt; A O P &gt;" points="21,91 95,21 95,137" class="geom-polygon geom-overlay" />
    <polygon id="hl-plane-OPQ" data-ref="&lt; O P Q &gt;" data-aliases="&lt; P O Q &gt;" points="95,76 21,91 152,94" class="geom-polygon geom-overlay" />

    <line id="hl-line-AB" data-ref="[ A B ]" x1="95" y1="21" x2="95" y2="137" class="geom-line geom-overlay" />
    <line id="hl-seg-AO" data-ref="/ A O /" data-aliases="/ O A /" x1="95" y1="21" x2="95" y2="76" class="geom-line geom-overlay" />
    <line id="hl-seg-OB" data-ref="/ O B /" data-aliases="/ B O /" x1="95" y1="76" x2="95" y2="137" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="95" y1="21" x2="95" y2="137" class="geom-line geom-overlay" />
    <line id="hl-seg-PO" data-ref="/ P O /" data-aliases="/ O P /" x1="21" y1="91" x2="95" y2="76" class="geom-line geom-overlay" />
    <line id="hl-seg-OQ" data-ref="/ O Q /" data-aliases="/ Q O /" x1="95" y1="76" x2="152" y2="94" class="geom-line geom-overlay" />

    <path id="hl-ang-AOP" data-ref="&lt; A O P )" data-aliases="&lt; P O A )" d="M 95.00 76.00 L 95.00 56.00 A 20.0 20.0 0 0 0 75.40 79.97 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-AOQ" data-ref="&lt; A O Q )" data-aliases="&lt; Q O A )" d="M 95.00 76.00 L 95.00 56.00 A 20.0 20.0 0 0 1 114.07 82.02 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="95" cy="21" r="3.2" class="geom-point" />
    <circle id="el-pt-O" data-ref="O" data-type="point" cx="95" cy="76" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="95" cy="137" r="3.2" class="geom-point" />
    <circle id="el-pt-P" data-ref="P" data-type="point" cx="21" cy="91" r="3.2" class="geom-point" />
    <circle id="el-pt-Q" data-ref="Q" data-type="point" cx="152" cy="94" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="91" y="28" text-anchor="end" class="geom-label">A</text>
    <text id="lbl-P" data-ref="P" x="23" y="85" text-anchor="middle" class="geom-label">P</text>
    <text id="lbl-O" data-ref="O" x="92" y="90" text-anchor="end" class="geom-label">O</text>
    <text id="lbl-Q" data-ref="Q" x="150" y="109" text-anchor="middle" class="geom-label">Q</text>
    <text id="lbl-B" data-ref="B" x="99" y="142" text-anchor="start" class="geom-label">B</text>
  </g>
</svg>
