<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 202 131" width="202" height="131" class="euclid-graphic" data-graphic-id="0289.g1" data-folio="0289" data-graphic="g1" data-proposition="XI.7">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-AB" data-ref="[ A B ]" data-type="line" x1="30" y1="25" x2="181" y2="25" class="geom-line" />
    <line id="el-line-CD" data-ref="[ C D ]" data-type="line" x1="14" y1="105" x2="190" y2="106" class="geom-line" />
  </g>

  <!-- Constructed Graphics -->
  <g id="graphics">
    <polygon id="el-plane-ABCD" data-ref="&lt; A B C D &gt;" data-aliases="&lt; A B D C &gt;" data-type="polygon" points="30,25 181,25 190,106 14,105" class="geom-polygon" />

    <!-- Sub-Segments along AB -->
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="30" y1="25" x2="97" y2="25" class="geom-line" />
    <line id="el-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" data-type="segment" x1="97" y1="25" x2="181" y2="25" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="30" y1="25" x2="181" y2="25" class="geom-line geom-overlay" />

    <!-- Sub-Segments along CD -->
    <line id="el-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" data-type="segment" x1="14" y1="105" x2="124" y2="105" class="geom-line" />
    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" data-type="segment" x1="124" y1="105" x2="190" y2="106" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="14" y1="105" x2="190" y2="106" class="geom-line geom-overlay" />

    <!-- Transversal EF and elevated line EGF -->
    <line id="el-seg-EF" data-ref="/ E F /" data-aliases="/ E H F / | / F E / | / G K / | / G H K /" data-type="segment" x1="97" y1="25" x2="124" y2="105" class="geom-line" />
    <path id="el-arc-EGF" data-ref="( E G F )" data-aliases="/ E G F / | &lt; E G F &gt;" data-type="arc" d="M 97 25 Q 130 62 124 105" class="geom-arc" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-plane-ABCD" data-ref="&lt; A B C D &gt;" data-aliases="&lt; A B D C &gt;" points="30,25 181,25 190,106 14,105" class="geom-polygon geom-overlay" />

    <line id="hl-line-AB" data-ref="[ A B ]" x1="30" y1="25" x2="181" y2="25" class="geom-line geom-overlay" />
    <line id="hl-line-CD" data-ref="[ C D ]" x1="14" y1="105" x2="190" y2="106" class="geom-line geom-overlay" />

    <line id="hl-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" x1="30" y1="25" x2="97" y2="25" class="geom-line geom-overlay" />
    <line id="hl-seg-EB" data-ref="/ E B /" data-aliases="/ B E /" x1="97" y1="25" x2="181" y2="25" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="30" y1="25" x2="181" y2="25" class="geom-line geom-overlay" />

    <line id="hl-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" x1="14" y1="105" x2="124" y2="105" class="geom-line geom-overlay" />
    <line id="hl-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" x1="124" y1="105" x2="190" y2="106" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="14" y1="105" x2="190" y2="106" class="geom-line geom-overlay" />

    <line id="hl-seg-EF" data-ref="/ E F /" data-aliases="/ E H F / | / F E / | / G K / | / G H K /" x1="97" y1="25" x2="124" y2="105" class="geom-line geom-overlay" />
    <path id="hl-arc-EGF" data-ref="( E G F )" data-aliases="/ E G F / | &lt; E G F &gt;" d="M 97 25 Q 130 62 124 105" class="geom-arc geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="30" cy="25" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="97" cy="25" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="181" cy="25" r="3.2" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="121" cy="65" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="14" cy="105" r="3.2" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="124" cy="105" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="190" cy="106" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="26" y="39" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-E" data-ref="E" x="97" y="19" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-B" data-ref="B" x="181" y="40" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-G" data-ref="G" x="128" y="67" text-anchor="start" class="geom-label">G</text>
    <text id="lbl-C" data-ref="C" x="16" y="119" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-F" data-ref="F" x="124" y="119" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-D" data-ref="D" x="185" y="119" text-anchor="middle" class="geom-label">D</text>
  </g>
</svg>
