<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 202 131" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="202" height="131" />
  <g class="el">
    <line class="line" x1="32.0" y1="33.0" x2="173.0" y2="33.0" />
    <line class="line" x1="16.0" y1="105.0" x2="184.0" y2="105.0" />
    <line class="line" x1="95.0" y1="33.0" x2="117.0" y2="105.0" />
    <path class="line" d="M 95 33 Q 124 66 117 105" />
    <text class="lbl" x="29.0" y="43.0">A</text>
    <text class="lbl" x="93.0" y="23.0">E</text>
    <text class="lbl" x="171.0" y="43.0">B</text>
    <text class="lbl" x="126.0" y="68.0">G</text>
    <text class="lbl" x="27.0" y="114.0">C</text>
    <text class="lbl" x="117.0" y="114.0">F</text>
    <text class="lbl" x="175.0" y="114.0">D</text>
  </g>
</svg>
