<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 209 184" width="209" height="184" class="euclid-graphic" data-graphic-id="0291.g1" data-folio="0291" data-graphic="g1" data-proposition="XI.8">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Plane of Reference Boundary) -->
  <g id="elements">
    <line id="el-plane-top" x1="30" y1="71" x2="198" y2="71" class="geom-line" />
    <line id="el-plane-right" x1="198" y1="71" x2="151" y2="172" class="geom-line" />
    <line id="el-plane-bottom" x1="151" y1="172" x2="11" y2="172" class="geom-line" />
    <line id="el-plane-left" x1="11" y1="172" x2="30" y2="71" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Planes, Triangles, Segments, Angle Wedges) -->
  <g id="graphics">
    <!-- Plane of Reference and Triangles -->
    <polygon id="el-plane-BDE" data-ref="&lt; B D E &gt;" data-aliases="&lt; D E B &gt;" data-type="polygon" points="30,71 198,71 151,172 11,172" class="geom-polygon" />
    <polygon id="el-tri-ABD" data-ref="&lt; A B D &gt;" data-aliases="&lt; B D A &gt;" data-type="polygon" points="50,14 50,116 150,116" class="geom-polygon" />
    <polygon id="el-tri-ABE" data-ref="&lt; A B E &gt;" data-type="polygon" points="50,14 50,116 135,158" class="geom-polygon" />
    <polygon id="el-tri-EDA" data-ref="&lt; E D A &gt;" data-aliases="&lt; A D E &gt;" data-type="polygon" points="135,158 150,116 50,14" class="geom-polygon" />
    <polygon id="el-plane-ABDC" data-ref="&lt; A B D C &gt;" data-aliases="&lt; B D C &gt;" data-type="polygon" points="50,14 50,116 150,116 150,16" class="geom-polygon" />

    <!-- Segments -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="50" y1="14" x2="50" y2="116" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="150" y1="16" x2="150" y2="116" class="geom-line" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="50" y1="116" x2="150" y2="116" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="150" y1="116" x2="135" y2="158" class="geom-line" />
    <line id="el-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" data-type="segment" x1="50" y1="116" x2="135" y2="158" class="geom-line" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="50" y1="14" x2="135" y2="158" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="50" y1="14" x2="150" y2="116" class="geom-line" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-ABD" data-ref="&lt; A B D )" data-aliases="&lt; D B A )" data-type="wedge" d="M 50.00 116.00 L 50.00 96.00 A 20.0 20.0 0 0 1 70.00 116.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ABE" data-ref="&lt; A B E )" data-aliases="&lt; E B A )" data-type="wedge" d="M 50.00 116.00 L 50.00 92.00 A 24.0 24.0 0 0 1 71.52 126.63 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-CDB" data-ref="&lt; C D B )" data-aliases="&lt; B D C )" data-type="wedge" d="M 150.00 116.00 L 150.00 96.00 A 20.0 20.0 0 0 0 130.00 116.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-EDB" data-ref="&lt; E D B )" data-aliases="&lt; B D E )" data-type="wedge" d="M 150.00 116.00 L 143.95 132.95 A 18.0 18.0 0 0 1 132.00 116.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-EDA" data-ref="&lt; E D A )" data-aliases="&lt; A D E )" data-type="wedge" d="M 150.00 116.00 L 142.60 136.72 A 22.0 22.0 0 0 1 134.60 100.29 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-CDE" data-ref="&lt; C D E )" data-aliases="&lt; E D C )" data-type="wedge" d="M 150.00 116.00 L 150.00 96.00 A 20.0 20.0 0 0 0 143.27 134.83 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-plane-BDE" data-ref="&lt; B D E &gt;" data-aliases="&lt; D E B &gt;" points="30,71 198,71 151,172 11,172" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-ABD" data-ref="&lt; A B D &gt;" data-aliases="&lt; B D A &gt;" points="50,14 50,116 150,116" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-ABE" data-ref="&lt; A B E &gt;" points="50,14 50,116 135,158" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-EDA" data-ref="&lt; E D A &gt;" data-aliases="&lt; A D E &gt;" points="135,158 150,116 50,14" class="geom-polygon geom-overlay" />
    <polygon id="hl-plane-ABDC" data-ref="&lt; A B D C &gt;" data-aliases="&lt; B D C &gt;" points="50,14 50,116 150,116 150,16" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="50" y1="14" x2="50" y2="116" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="150" y1="16" x2="150" y2="116" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="50" y1="116" x2="150" y2="116" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="150" y1="116" x2="135" y2="158" class="geom-line geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" x1="50" y1="116" x2="135" y2="158" class="geom-line geom-overlay" />
    <line id="hl-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" x1="50" y1="14" x2="135" y2="158" class="geom-line geom-overlay" />
    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="50" y1="14" x2="150" y2="116" class="geom-line geom-overlay" />

    <path id="hl-ang-ABD" data-ref="&lt; A B D )" data-aliases="&lt; D B A )" d="M 50.00 116.00 L 50.00 96.00 A 20.0 20.0 0 0 1 70.00 116.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ABE" data-ref="&lt; A B E )" data-aliases="&lt; E B A )" d="M 50.00 116.00 L 50.00 92.00 A 24.0 24.0 0 0 1 71.52 126.63 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-CDB" data-ref="&lt; C D B )" data-aliases="&lt; B D C )" d="M 150.00 116.00 L 150.00 96.00 A 20.0 20.0 0 0 0 130.00 116.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-EDB" data-ref="&lt; E D B )" data-aliases="&lt; B D E )" d="M 150.00 116.00 L 143.95 132.95 A 18.0 18.0 0 0 1 132.00 116.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-EDA" data-ref="&lt; E D A )" data-aliases="&lt; A D E )" d="M 150.00 116.00 L 142.60 136.72 A 22.0 22.0 0 0 1 134.60 100.29 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-CDE" data-ref="&lt; C D E )" data-aliases="&lt; E D C )" d="M 150.00 116.00 L 150.00 96.00 A 20.0 20.0 0 0 0 143.27 134.83 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="50" cy="14" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="50" cy="116" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="150" cy="16" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="150" cy="116" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="135" cy="158" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="45" y="21" text-anchor="end" class="geom-label">A</text>
    <text id="lbl-C" data-ref="C" x="155" y="23" text-anchor="start" class="geom-label">C</text>
    <text id="lbl-B" data-ref="B" x="45" y="122" text-anchor="end" class="geom-label">B</text>
    <text id="lbl-D" data-ref="D" x="155" y="122" text-anchor="start" class="geom-label">D</text>
    <text id="lbl-E" data-ref="E" x="128" y="167" text-anchor="end" class="geom-label">E</text>
  </g>
</svg>
