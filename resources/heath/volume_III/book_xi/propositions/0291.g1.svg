    <line class="line" x1="161.0" y1="169.0" x2="3.0" y2="169.0" />
    <line class="line" x1="3.0" y1="169.0" x2="38.0" y2="79.0" />
    <line class="line" x1="48.0" y1="18.0" x2="48.0" y2="123.0" />
    <line class="line" x1="147.0" y1="18.0" x2="147.0" y2="123.0" />
