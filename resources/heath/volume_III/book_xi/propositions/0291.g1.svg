    <line class="line" x1="48.0" y1="123.0" x2="134.0" y2="162.0" />
    <line class="line" x1="147.0" y1="123.0" x2="134.0" y2="162.0" />
    <text class="lbl" x="39.0" y="20.0">A</text>
    <text class="lbl" x="156.0" y="20.0">C</text>
    <text class="lbl" x="39.0" y="125.0">B</text>
    <text class="lbl" x="156.0" y="125.0">D</text>
