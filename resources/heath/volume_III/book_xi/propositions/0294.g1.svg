<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 258 165" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="258" height="165" />
  <g class="el">
    <line class="line" x1="73.0" y1="47.0" x2="233.0" y2="47.0" />
    <line class="line" x1="30.0" y1="97.0" x2="195.0" y2="97.0" />
    <line class="line" x1="67.0" y1="131.0" x2="241.0" y2="131.0" />
    <line class="line" x1="136.0" y1="47.0" x2="95.0" y2="97.0" />
    <line class="line" x1="95.0" y1="97.0" x2="136.0" y2="131.0" />
    <text class="lbl" x="76.0" y="38.0">B</text>
    <text class="lbl" x="140.0" y="38.0">H</text>
    <text class="lbl" x="229.0" y="38.0">A</text>
    <text class="lbl" x="33.0" y="88.0">F</text>
    <text class="lbl" x="87.0" y="88.0">G</text>
    <text class="lbl" x="190.0" y="88.0">E</text>
    <text class="lbl" x="70.0" y="141.0">D</text>
    <text class="lbl" x="140.0" y="141.0">K</text>
    <text class="lbl" x="239.0" y="141.0">C</text>
  </g>
</svg>
