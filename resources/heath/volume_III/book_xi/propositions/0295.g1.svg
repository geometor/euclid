<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 208" width="292" height="208" class="euclid-graphic" data-graphic-id="0295.g1" data-folio="0295" data-graphic="g1" data-proposition="XI.10">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Upper and Lower Plane Boundaries) -->
  <g id="elements">
    <!-- Upper Plane -->
    <line id="el-uplane-top" x1="28" y1="10" x2="170" y2="10" class="geom-line" />
    <line id="el-uplane-right" x1="170" y1="10" x2="126" y2="95" class="geom-line" />
    <line id="el-uplane-bottom" x1="126" y1="95" x2="10" y2="95" class="geom-line" />
    <line id="el-uplane-left" x1="10" y1="95" x2="28" y2="10" class="geom-line" />

    <!-- Lower Plane -->
    <line id="el-lplane-top" x1="83" y1="121" x2="280" y2="121" class="geom-line" />
    <line id="el-lplane-right" x1="280" y1="121" x2="236" y2="196" class="geom-line" />
    <line id="el-lplane-bottom" x1="236" y1="196" x2="57" y2="196" class="geom-line" />
    <line id="el-lplane-left" x1="57" y1="196" x2="83" y2="121" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Triangles, Parallelograms, Segments, Angle Wedges) -->
  <g id="graphics">
    <!-- Triangles ABC, DEF and Parallelograms ABED, BCFE, ACFD -->
    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-type="polygon" points="41,84 58,29 137,34" class="geom-polygon" />
    <polygon id="el-tri-DEF" data-ref="&lt; D E F &gt;" data-type="polygon" points="120,185 136,131 215,135" class="geom-polygon" />
    <polygon id="el-para-ABED" data-ref="&lt; A B E D &gt;" data-type="polygon" points="41,84 58,29 136,131 120,185" class="geom-polygon" />
    <polygon id="el-para-BCFE" data-ref="&lt; B C F E &gt;" data-type="polygon" points="58,29 137,34 215,135 136,131" class="geom-polygon" />
    <polygon id="el-para-ACFD" data-ref="&lt; A C F D &gt;" data-type="polygon" points="41,84 137,34 215,135 120,185" class="geom-polygon" />

    <!-- Upper Triangle Segments -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="41" y1="84" x2="58" y2="29" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="58" y1="29" x2="137" y2="34" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="41" y1="84" x2="137" y2="34" class="geom-line" />

    <!-- Lower Triangle Segments -->
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="120" y1="185" x2="136" y2="131" class="geom-line" />
    <line id="el-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" data-type="segment" x1="136" y1="131" x2="215" y2="135" class="geom-line" />
    <line id="el-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" data-type="segment" x1="120" y1="185" x2="215" y2="135" class="geom-line" />

    <!-- Joining Segments AD, BE, CF -->
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="41" y1="84" x2="120" y2="185" class="geom-line" />
    <line id="el-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" data-type="segment" x1="58" y1="29" x2="136" y2="131" class="geom-line" />
    <line id="el-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" data-type="segment" x1="137" y1="34" x2="215" y2="135" class="geom-line" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A )" data-type="wedge" d="M 58.00 29.00 L 51.50 50.02 A 22.0 22.0 0 0 0 79.96 30.39 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-DEF" data-ref="&lt; D E F )" data-aliases="&lt; F E D )" data-type="wedge" d="M 136.00 131.00 L 129.75 152.09 A 22.0 22.0 0 0 0 157.97 132.11 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-tri-ABC" data-ref="&lt; A B C &gt;" points="41,84 58,29 137,34" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-DEF" data-ref="&lt; D E F &gt;" points="120,185 136,131 215,135" class="geom-polygon geom-overlay" />
    <polygon id="hl-para-ABED" data-ref="&lt; A B E D &gt;" points="41,84 58,29 136,131 120,185" class="geom-polygon geom-overlay" />
    <polygon id="hl-para-BCFE" data-ref="&lt; B C F E &gt;" points="58,29 137,34 215,135 136,131" class="geom-polygon geom-overlay" />
    <polygon id="hl-para-ACFD" data-ref="&lt; A C F D &gt;" points="41,84 137,34 215,135 120,185" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="41" y1="84" x2="58" y2="29" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="58" y1="29" x2="137" y2="34" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="41" y1="84" x2="137" y2="34" class="geom-line geom-overlay" />

    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="120" y1="185" x2="136" y2="131" class="geom-line geom-overlay" />
    <line id="hl-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" x1="136" y1="131" x2="215" y2="135" class="geom-line geom-overlay" />
    <line id="hl-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" x1="120" y1="185" x2="215" y2="135" class="geom-line geom-overlay" />

    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="41" y1="84" x2="120" y2="185" class="geom-line geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" x1="58" y1="29" x2="136" y2="131" class="geom-line geom-overlay" />
    <line id="hl-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" x1="137" y1="34" x2="215" y2="135" class="geom-line geom-overlay" />

    <path id="hl-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A )" d="M 58.00 29.00 L 51.50 50.02 A 22.0 22.0 0 0 0 79.96 30.39 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-DEF" data-ref="&lt; D E F )" data-aliases="&lt; F E D )" d="M 136.00 131.00 L 129.75 152.09 A 22.0 22.0 0 0 0 157.97 132.11 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="41" cy="84" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="58" cy="29" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="137" cy="34" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="120" cy="185" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="136" cy="131" r="3.2" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="215" cy="135" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-B" data-ref="B" x="55" y="25" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="144" y="34" text-anchor="start" class="geom-label">C</text>
    <text id="lbl-A" data-ref="A" x="34" y="90" text-anchor="end" class="geom-label">A</text>
    <text id="lbl-E" data-ref="E" x="141" y="145" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="220" y="141" text-anchor="start" class="geom-label">F</text>
    <text id="lbl-D" data-ref="D" x="113" y="191" text-anchor="end" class="geom-label">D</text>
  </g>
</svg>
