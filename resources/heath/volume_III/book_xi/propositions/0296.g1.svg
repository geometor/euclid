    <text class="lbl" x="63.0" y="18.0">A</text>
    <text class="lbl" x="133.0" y="96.0">H</text>
    <text class="lbl" x="33.0" y="122.0">E</text>
    <text class="lbl" x="56.0" y="116.0">F</text>
