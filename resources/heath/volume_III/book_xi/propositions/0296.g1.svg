<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 194 175" width="194" height="175" class="euclid-graphic" data-graphic-id="0296.g1" data-folio="0296" data-graphic="g1" data-proposition="XI.11">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Plane of Reference Boundary and Lines) -->
  <g id="elements">
    <line id="el-plane-top" x1="23" y1="63" x2="182" y2="63" class="geom-line" />
    <line id="el-plane-right" x1="182" y1="63" x2="166" y2="162" class="geom-line" />
    <line id="el-plane-bottom" x1="166" y1="162" x2="11" y2="162" class="geom-line" />
    <line id="el-plane-left" x1="11" y1="162" x2="23" y2="63" class="geom-line" />

    <line id="el-line-BC" data-ref="[ B C ]" data-type="line" x1="94" y1="148" x2="164" y2="111" class="geom-line" />
    <line id="el-line-DE" data-ref="[ D E ]" data-type="line" x1="33" y1="90" x2="130" y2="129" class="geom-line" />
    <line id="el-line-GH" data-ref="[ G H ]" data-type="line" x1="38" y1="122" x2="129" y2="73" class="geom-line" />
  </g>

  <!-- Constructed Graphics -->
  <g id="graphics">
    <polygon id="el-plane-ref" data-ref="&lt; E D G H &gt;" data-aliases="&lt; B C G H &gt;" data-type="polygon" points="23,63 182,63 166,162 11,162" class="geom-polygon" />
    <polygon id="el-plane-EDA" data-ref="&lt; E D A &gt;" data-aliases="&lt; A D E &gt; | &lt; A F D &gt;" data-type="polygon" points="33,90 130,129 69,13" class="geom-polygon" />

    <!-- Sub-Segments along BC -->
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="94" y1="148" x2="130" y2="129" class="geom-line" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" data-type="segment" x1="130" y1="129" x2="164" y2="111" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="94" y1="148" x2="164" y2="111" class="geom-line geom-overlay" />

    <!-- Sub-Segments along DE -->
    <line id="el-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" data-type="segment" x1="33" y1="90" x2="69" y2="105" class="geom-line" />
    <line id="el-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" data-type="segment" x1="69" y1="105" x2="130" y2="129" class="geom-line" />
    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="33" y1="90" x2="130" y2="129" class="geom-line geom-overlay" />

    <!-- Sub-Segments along GH -->
    <line id="el-seg-GF" data-ref="/ G F /" data-aliases="/ F G /" data-type="segment" x1="38" y1="122" x2="69" y2="105" class="geom-line" />
    <line id="el-seg-FH" data-ref="/ F H /" data-aliases="/ H F /" data-type="segment" x1="69" y1="105" x2="129" y2="73" class="geom-line" />
    <line id="el-seg-GH" data-ref="/ G H /" data-aliases="/ H G /" data-type="segment" x1="38" y1="122" x2="129" y2="73" class="geom-line geom-overlay" />

    <!-- Perpendiculars AD and AF -->
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="69" y1="13" x2="130" y2="129" class="geom-line" />
    <line id="el-seg-AF" data-ref="/ A F /" data-aliases="/ F A /" data-type="segment" x1="69" y1="13" x2="69" y2="105" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-plane-ref" data-ref="&lt; E D G H &gt;" data-aliases="&lt; B C G H &gt;" points="23,63 182,63 166,162 11,162" class="geom-polygon geom-overlay" />
    <polygon id="hl-plane-EDA" data-ref="&lt; E D A &gt;" data-aliases="&lt; A D E &gt; | &lt; A F D &gt;" points="33,90 130,129 69,13" class="geom-polygon geom-overlay" />

    <line id="hl-line-BC" data-ref="[ B C ]" x1="94" y1="148" x2="164" y2="111" class="geom-line geom-overlay" />
    <line id="hl-line-DE" data-ref="[ D E ]" x1="33" y1="90" x2="130" y2="129" class="geom-line geom-overlay" />
    <line id="hl-line-GH" data-ref="[ G H ]" x1="38" y1="122" x2="129" y2="73" class="geom-line geom-overlay" />

    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="94" y1="148" x2="130" y2="129" class="geom-line geom-overlay" />
    <line id="hl-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" x1="130" y1="129" x2="164" y2="111" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="94" y1="148" x2="164" y2="111" class="geom-line geom-overlay" />

    <line id="hl-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" x1="33" y1="90" x2="69" y2="105" class="geom-line geom-overlay" />
    <line id="hl-seg-FD" data-ref="/ F D /" data-aliases="/ D F /" x1="69" y1="105" x2="130" y2="129" class="geom-line geom-overlay" />
    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="33" y1="90" x2="130" y2="129" class="geom-line geom-overlay" />

    <line id="hl-seg-GF" data-ref="/ G F /" data-aliases="/ F G /" x1="38" y1="122" x2="69" y2="105" class="geom-line geom-overlay" />
    <line id="hl-seg-FH" data-ref="/ F H /" data-aliases="/ H F /" x1="69" y1="105" x2="129" y2="73" class="geom-line geom-overlay" />
    <line id="hl-seg-GH" data-ref="/ G H /" data-aliases="/ H G /" x1="38" y1="122" x2="129" y2="73" class="geom-line geom-overlay" />

    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="69" y1="13" x2="130" y2="129" class="geom-line geom-overlay" />
    <line id="hl-seg-AF" data-ref="/ A F /" data-aliases="/ F A /" x1="69" y1="13" x2="69" y2="105" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="69" cy="13" r="3.2" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="69" cy="105" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="130" cy="129" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="33" cy="90" r="3.2" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="38" cy="122" r="3.2" class="geom-point" />
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="129" cy="73" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="94" cy="148" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="164" cy="111" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="65" y="21" text-anchor="end" class="geom-label">A</text>
    <text id="lbl-H" data-ref="H" x="131" y="88" text-anchor="middle" class="geom-label">H</text>
    <text id="lbl-E" data-ref="E" x="32" y="106" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="65" y="101" text-anchor="end" class="geom-label">F</text>
    <text id="lbl-G" data-ref="G" x="38" y="137" text-anchor="middle" class="geom-label">G</text>
    <text id="lbl-D" data-ref="D" x="136" y="143" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-C" data-ref="C" x="167" y="125" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-B" data-ref="B" x="98" y="159" text-anchor="middle" class="geom-label">B</text>
  </g>
</svg>
