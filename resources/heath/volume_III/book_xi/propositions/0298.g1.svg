<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 164" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="176" height="164" />
  <g class="el">
    <line class="line" x1="38.0" y1="76.0" x2="164.0" y2="76.0" />
    <line class="line" x1="164.0" y1="76.0" x2="146.0" y2="149.0" />
    <line class="line" x1="146.0" y1="149.0" x2="20.0" y2="149.0" />
    <line class="line" x1="20.0" y1="149.0" x2="38.0" y2="76.0" />
    <line class="line" x1="75.0" y1="20.0" x2="75.0" y2="134.0" />
    <line class="line" x1="134.0" y1="20.0" x2="134.0" y2="114.0" />
    <text class="lbl" x="66.0" y="22.0">D</text>
    <text class="lbl" x="125.0" y="22.0">B</text>
    <text class="lbl" x="143.0" y="115.0">C</text>
    <text class="lbl" x="75.0" y="143.0">A</text>
  </g>
</svg>
