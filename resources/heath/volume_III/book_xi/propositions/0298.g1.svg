<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 164" width="176" height="164" class="euclid-graphic" data-graphic-id="0298.g1" data-folio="0298" data-graphic="g1" data-proposition="XI.12">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Plane of Reference Boundary) -->
  <g id="elements">
    <line id="el-plane-top" x1="30" y1="69" x2="165" y2="68" class="geom-line" />
    <line id="el-plane-right" x1="165" y1="68" x2="130" y2="151" class="geom-line" />
    <line id="el-plane-bottom" x1="130" y1="151" x2="11" y2="152" class="geom-line" />
    <line id="el-plane-left" x1="11" y1="152" x2="30" y2="69" class="geom-line" />
  </g>

  <!-- Constructed Graphics -->
  <g id="graphics">
    <polygon id="el-plane-ref" data-ref="&lt; A C &gt;" data-type="polygon" points="30,69 165,68 130,151 11,152" class="geom-polygon" />

    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="53" y1="124" x2="52" y2="17" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="128" y1="12" x2="129" y2="96" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-plane-ref" data-ref="&lt; A C &gt;" points="30,69 165,68 130,151 11,152" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="53" y1="124" x2="52" y2="17" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="128" y1="12" x2="129" y2="96" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="52" cy="17" r="3.2" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="53" cy="124" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="128" cy="12" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="129" cy="96" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-D" data-ref="D" x="48" y="24" text-anchor="end" class="geom-label">D</text>
    <text id="lbl-B" data-ref="B" x="123" y="21" text-anchor="end" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="131" y="110" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-A" data-ref="A" x="53" y="139" text-anchor="middle" class="geom-label">A</text>
  </g>
</svg>
