<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 199 157" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="199" height="157" />
  <g class="el">
    <line class="line" x1="48.0" y1="60.0" x2="185.0" y2="60.0" />
    <line class="line" x1="185.0" y1="60.0" x2="161.0" y2="136.0" />
    <line class="line" x1="161.0" y1="136.0" x2="24.0" y2="136.0" />
    <line class="line" x1="24.0" y1="136.0" x2="48.0" y2="60.0" />
    <line class="line" x1="98.0" y1="17.0" x2="98.0" y2="108.0" />
    <line class="line" x1="98.0" y1="108.0" x2="114.0" y2="32.0" />
    <line class="line" x1="36.0" y1="88.0" x2="166.0" y2="129.0" />
    <text class="lbl" x="90.0" y="19.0">B</text>
    <text class="lbl" x="122.0" y="34.0">C</text>
    <text class="lbl" x="27.0" y="86.0">D</text>
    <text class="lbl" x="96.0" y="118.0">A</text>
    <text class="lbl" x="174.0" y="132.0">E</text>
  </g>
</svg>
