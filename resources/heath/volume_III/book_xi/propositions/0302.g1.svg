<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 158" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="240" height="158" />
  <g class="el">
    <line class="line" x1="60.0" y1="40.0" x2="166.0" y2="40.0" />
    <line class="line" x1="166.0" y1="40.0" x2="148.0" y2="96.0" />
    <line class="line" x1="148.0" y1="96.0" x2="42.0" y2="96.0" />
    <line class="line" x1="42.0" y1="96.0" x2="60.0" y2="40.0" />
    <line class="line" x1="42.0" y1="96.0" x2="138.0" y2="134.0" />
    <line class="line" x1="138.0" y1="134.0" x2="208.0" y2="96.0" />
    <line class="line" x1="166.0" y1="40.0" x2="208.0" y2="96.0" />
    <line class="dashed" x1="60.0" y1="40.0" x2="148.0" y2="96.0" />
    <line class="dashed" x1="42.0" y1="96.0" x2="208.0" y2="96.0" />
    <text class="lbl" x="53.0" y="36.0">A</text>
    <text class="lbl" x="173.0" y="38.0">B</text>
    <text class="lbl" x="35.0" y="93.0">C</text>
    <text class="lbl" x="152.0" y="105.0">D</text>
    <text class="lbl" x="35.0" y="107.0">M</text>
    <text class="lbl" x="216.0" y="96.0">N</text>
  </g>
</svg>
