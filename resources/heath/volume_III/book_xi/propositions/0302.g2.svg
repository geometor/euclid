<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 221 171" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="221" height="171" />
  <g class="el">
    <line class="line" x1="78.0" y1="34.0" x2="166.0" y2="77.0" />
    <line class="line" x1="166.0" y1="77.0" x2="144.0" y2="136.0" />
    <line class="line" x1="144.0" y1="136.0" x2="56.0" y2="93.0" />
    <line class="line" x1="56.0" y1="93.0" x2="78.0" y2="34.0" />
    <line class="line" x1="63.0" y1="63.0" x2="198.0" y2="63.0" />
    <line class="line" x1="198.0" y1="63.0" x2="178.0" y2="144.0" />
    <line class="line" x1="178.0" y1="144.0" x2="43.0" y2="144.0" />
    <line class="line" x1="43.0" y1="144.0" x2="63.0" y2="63.0" />
    <text class="lbl" x="70.0" y="32.0">B</text>
    <text class="lbl" x="206.0" y="63.0">N</text>
    <text class="lbl" x="48.0" y="91.0">A</text>
    <text class="lbl" x="174.0" y="80.0">D</text>
    <text class="lbl" x="149.0" y="134.0">C</text>
    <text class="lbl" x="43.0" y="152.0">M</text>
  </g>
</svg>
