<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 221 171" width="221" height="171" class="euclid-graphic" data-graphic-id="0302.g2" data-folio="0302" data-graphic="g2" data-proposition="XI.15">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #000000;
      stroke-width: 1.6;
      stroke-dasharray: 4,3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Plane Boundaries) -->
  <g id="elements">
    <!-- Plane MN boundary -->
    <line id="el-plane-MN-top" x1="52" y1="56" x2="199" y2="56" class="geom-line" />
    <line id="el-plane-MN-right" x1="199" y1="56" x2="175" y2="137" class="geom-line" />
    <line id="el-plane-MN-bottom" x1="175" y1="137" x2="27" y2="137" class="geom-line" />
    <line id="el-plane-MN-left" x1="27" y1="137" x2="52" y2="56" class="geom-line" />
    <!-- Plane ABDC long edges -->
    <line id="el-seg-BD" x1="61" y1="18" x2="168" y2="72" class="geom-line" />
    <line id="el-seg-AC" x1="36" y1="66" x2="143" y2="121" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Planes, Segments) -->
  <g id="graphics">
    <!-- Planes MN and ABDC -->
    <polygon id="el-plane-MN" data-ref="&lt; M N &gt;" data-aliases="&lt; N M &gt;" data-type="polygon" points="52,56 199,56 175,137 27,137" class="geom-polygon" />
    <polygon id="el-plane-ABDC" data-ref="&lt; A B D C &gt;" data-aliases="&lt; A B C D &gt; | &lt; C D B A &gt;" data-type="polygon" points="36,66 61,18 168,72 143,121" class="geom-polygon" />

    <!-- Segments AB and CD -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="36" y1="66" x2="61" y2="18" class="geom-line" />
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="143" y1="121" x2="168" y2="72" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-plane-MN" data-ref="&lt; M N &gt;" data-aliases="&lt; N M &gt;" points="52,56 199,56 175,137 27,137" class="geom-polygon geom-overlay" />
    <polygon id="hl-plane-ABDC" data-ref="&lt; A B D C &gt;" data-aliases="&lt; A B C D &gt; | &lt; C D B A &gt;" points="36,66 61,18 168,72 143,121" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="36" y1="66" x2="61" y2="18" class="geom-line geom-overlay" />
    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="143" y1="121" x2="168" y2="72" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="36" cy="66" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="61" cy="18" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="143" cy="121" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="168" cy="72" r="3.2" class="geom-point" />
    <circle id="el-pt-M" data-ref="M" data-type="point" cx="27" cy="137" r="3.2" class="geom-point" />
    <circle id="el-pt-N" data-ref="N" data-type="point" cx="199" cy="56" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-B" data-ref="B" x="57" y="22" text-anchor="end" class="geom-label">B</text>
    <text id="lbl-N" data-ref="N" x="202" y="64" text-anchor="start" class="geom-label">N</text>
    <text id="lbl-A" data-ref="A" x="33" y="72" text-anchor="end" class="geom-label">A</text>
    <text id="lbl-D" data-ref="D" x="171" y="79" text-anchor="start" class="geom-label">D</text>
    <text id="lbl-C" data-ref="C" x="147" y="133" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-M" data-ref="M" x="26" y="151" text-anchor="middle" class="geom-label">M</text>
  </g>
</svg>
