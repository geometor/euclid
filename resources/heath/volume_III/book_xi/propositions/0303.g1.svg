<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 172" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="240" height="172" />
  <g class="el">
    <line class="line" x1="99.0" y1="59.0" x2="174.0" y2="35.0" />
    <line class="line" x1="99.0" y1="59.0" x2="196.0" y2="69.0" />
    <line class="line" x1="55.0" y1="83.0" x2="205.0" y2="83.0" />
    <line class="line" x1="205.0" y1="83.0" x2="187.0" y2="149.0" />
    <line class="line" x1="187.0" y1="149.0" x2="37.0" y2="149.0" />
    <line class="line" x1="37.0" y1="149.0" x2="55.0" y2="83.0" />
    <text class="lbl" x="181.0" y="34.0">B</text>
    <text class="lbl" x="91.0" y="59.0">A</text>
    <text class="lbl" x="203.0" y="69.0">C</text>
    <text class="lbl" x="213.0" y="83.0">N</text>
    <text class="lbl" x="35.0" y="140.0">M</text>
  </g>
</svg>
