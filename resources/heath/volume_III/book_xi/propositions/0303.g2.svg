<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197 135" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="197" height="135" />
  <g class="el">
    <line class="line" x1="52.0" y1="20.0" x2="148.0" y2="20.0" />
    <line class="line" x1="148.0" y1="20.0" x2="128.0" y2="62.0" />
    <line class="line" x1="128.0" y1="62.0" x2="32.0" y2="62.0" />
    <line class="line" x1="32.0" y1="62.0" x2="52.0" y2="20.0" />
    <line class="line" x1="85.0" y1="80.0" x2="185.0" y2="80.0" />
    <line class="line" x1="185.0" y1="80.0" x2="165.0" y2="122.0" />
    <line class="line" x1="165.0" y1="122.0" x2="65.0" y2="122.0" />
    <line class="line" x1="65.0" y1="122.0" x2="85.0" y2="80.0" />
    <line class="line" x1="122.0" y1="29.0" x2="75.0" y2="49.0" />
    <line class="line" x1="75.0" y1="49.0" x2="104.0" y2="52.0" />
    <line class="line" x1="155.0" y1="91.0" x2="108.0" y2="111.0" />
    <line class="line" x1="108.0" y1="111.0" x2="137.0" y2="114.0" />
    <text class="lbl" x="129.0" y="29.0">A</text>
    <text class="lbl" x="67.0" y="49.0">B</text>
    <text class="lbl" x="111.0" y="52.0">C</text>
    <text class="lbl" x="163.0" y="91.0">D</text>
    <text class="lbl" x="100.0" y="111.0">E</text>
