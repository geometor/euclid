<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 219" width="412" height="219" class="euclid-graphic" data-graphic-id="0304.g1" data-folio="0304" data-graphic="g1" data-proposition="XI.16">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #000000;
      stroke-width: 1.6;
      stroke-dasharray: 4,3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Plane Boundaries) -->
  <g id="elements">
    <!-- Plane AB boundary -->
    <line id="el-plane-AB-top" x1="37" y1="16" x2="138" y2="16" class="geom-line" />
    <line id="el-plane-AB-right" x1="138" y1="16" x2="123" y2="69" class="geom-line" />
    <line id="el-plane-AB-bottom" x1="123" y1="69" x2="24" y2="69" class="geom-line" />
    <line id="el-plane-AB-left" x1="24" y1="69" x2="37" y2="16" class="geom-line" />
    <!-- Plane CD boundary -->
    <line id="el-plane-CD-top" x1="62" y1="130" x2="194" y2="130" class="geom-line" />
    <line id="el-plane-CD-right" x1="194" y1="130" x2="148" y2="194" class="geom-line" />
    <line id="el-plane-CD-bottom" x1="148" y1="194" x2="40" y2="194" class="geom-line" />
    <line id="el-plane-CD-left" x1="40" y1="194" x2="62" y2="130" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Planes, Segments, Sections) -->
  <g id="graphics">
    <!-- Planes AB, CD, and EFGH -->
    <polygon id="el-plane-AB" data-ref="&lt; A B &gt;" data-aliases="&lt; B A &gt;" data-type="polygon" points="37,16 138,16 123,69 24,69" class="geom-polygon" />
    <polygon id="el-plane-CD" data-ref="&lt; C D &gt;" data-aliases="&lt; D C &gt;" data-type="polygon" points="62,130 194,130 148,194 40,194" class="geom-polygon" />
    <polygon id="el-plane-EFGH" data-ref="&lt; E F H G &gt;" data-aliases="&lt; E F G H &gt; | &lt; G H F E &gt;" data-type="polygon" points="28,52 128,52 174,158 53,158" class="geom-polygon" />

    <!-- Segments and Sections -->
    <line id="el-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" data-type="segment" x1="28" y1="52" x2="128" y2="52" class="geom-line" />
    <line id="el-seg-FK" data-ref="/ F K /" data-aliases="/ K F /" data-type="segment" x1="128" y1="52" x2="394" y2="122" class="geom-line" />
    <line id="el-sec-EFK" data-ref="/ E F K /" data-aliases="/ K F E / | / E K / | / K E /" data-type="section" x1="28" y1="52" x2="394" y2="122" class="geom-line" />
    <line id="el-seg-GH" data-ref="/ G H /" data-aliases="/ H G /" data-type="segment" x1="53" y1="158" x2="174" y2="158" class="geom-line" />
    <line id="el-seg-HK" data-ref="/ H K /" data-aliases="/ K H /" data-type="segment" x1="174" y1="158" x2="394" y2="122" class="geom-line" />
    <line id="el-sec-GHK" data-ref="/ G H K /" data-aliases="/ K H G / | / G K / | / K G /" data-type="section" x1="53" y1="158" x2="394" y2="122" class="geom-line" />
    <line id="el-seg-EG" data-ref="/ E G /" data-aliases="/ G E /" data-type="segment" x1="28" y1="52" x2="53" y2="158" class="geom-line" />
    <line id="el-seg-FH" data-ref="/ F H /" data-aliases="/ H F /" data-type="segment" x1="128" y1="52" x2="174" y2="158" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-plane-AB" data-ref="&lt; A B &gt;" data-aliases="&lt; B A &gt;" points="37,16 138,16 123,69 24,69" class="geom-polygon geom-overlay" />
    <polygon id="hl-plane-CD" data-ref="&lt; C D &gt;" data-aliases="&lt; D C &gt;" points="62,130 194,130 148,194 40,194" class="geom-polygon geom-overlay" />
    <polygon id="hl-plane-EFGH" data-ref="&lt; E F H G &gt;" data-aliases="&lt; E F G H &gt; | &lt; G H F E &gt;" points="28,52 128,52 174,158 53,158" class="geom-polygon geom-overlay" />

    <line id="hl-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" x1="28" y1="52" x2="128" y2="52" class="geom-line geom-overlay" />
    <line id="hl-seg-FK" data-ref="/ F K /" data-aliases="/ K F /" x1="128" y1="52" x2="394" y2="122" class="geom-line geom-overlay" />
    <line id="hl-sec-EFK" data-ref="/ E F K /" data-aliases="/ K F E / | / E K / | / K E /" x1="28" y1="52" x2="394" y2="122" class="geom-line geom-overlay" />
    <line id="hl-seg-GH" data-ref="/ G H /" data-aliases="/ H G /" x1="53" y1="158" x2="174" y2="158" class="geom-line geom-overlay" />
    <line id="hl-seg-HK" data-ref="/ H K /" data-aliases="/ K H /" x1="174" y1="158" x2="394" y2="122" class="geom-line geom-overlay" />
    <line id="hl-sec-GHK" data-ref="/ G H K /" data-aliases="/ K H G / | / G K / | / K G /" x1="53" y1="158" x2="394" y2="122" class="geom-line geom-overlay" />
    <line id="hl-seg-EG" data-ref="/ E G /" data-aliases="/ G E /" x1="28" y1="52" x2="53" y2="158" class="geom-line geom-overlay" />
    <line id="hl-seg-FH" data-ref="/ F H /" data-aliases="/ H F /" x1="128" y1="52" x2="174" y2="158" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="24" cy="69" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="138" cy="16" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="40" cy="194" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="194" cy="130" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="28" cy="52" r="3.2" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="128" cy="52" r="3.2" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="53" cy="158" r="3.2" class="geom-point" />
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="174" cy="158" r="3.2" class="geom-point" />
    <circle id="el-pt-K" data-ref="K" data-type="point" cx="394" cy="122" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-B" data-ref="B" x="142" y="21" text-anchor="start" class="geom-label">B</text>
    <text id="lbl-E" data-ref="E" x="24" y="54" text-anchor="end" class="geom-label">E</text>
    <text id="lbl-F" data-ref="F" x="132" y="50" text-anchor="start" class="geom-label">F</text>
    <text id="lbl-A" data-ref="A" x="20" y="75" text-anchor="end" class="geom-label">A</text>
    <text id="lbl-D" data-ref="D" x="197" y="136" text-anchor="start" class="geom-label">D</text>
    <text id="lbl-K" data-ref="K" x="394" y="136" text-anchor="middle" class="geom-label">K</text>
    <text id="lbl-G" data-ref="G" x="49" y="164" text-anchor="end" class="geom-label">G</text>
    <text id="lbl-H" data-ref="H" x="176" y="172" text-anchor="start" class="geom-label">H</text>
    <text id="lbl-C" data-ref="C" x="39" y="208" text-anchor="middle" class="geom-label">C</text>
  </g>
</svg>
