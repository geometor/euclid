    <line id="el-seg-AO" data-ref="/ A O /" data-aliases="/ O A /" data-type="segment" x1="110" y1="35" x2="134" y2="137" class="geom-line" />
    <line id="el-seg-OD" data-ref="/ O D /" data-aliases="/ D O /" data-type="segment" x1="134" y1="137" x2="154" y2="224" class="geom-line" />

