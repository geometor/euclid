    <polygon id="el-poly-AOFC" data-ref="&lt; A O F C &gt;" data-aliases="&lt; C F O A &gt;" data-type="polygon" points="110,35 134,137 115,151 63,58" class="geom-polygon" />
    <polygon id="el-poly-ABD" data-ref="&lt; A B D &gt;" data-aliases="&lt; B D A &gt; | &lt; D A B &gt; | &lt; A D B &gt; | &lt; B A D &gt; | &lt; D B A &gt;" data-type="polygon" points="110,35 252,214 154,224" class="geom-polygon" />
    <polygon id="el-poly-ADC" data-ref="&lt; A D C &gt;" data-aliases="&lt; D C A &gt; | &lt; C A D &gt; | &lt; A C D &gt; | &lt; D A C &gt; | &lt; C D A &gt;" data-type="polygon" points="110,35 154,224 63,58" class="geom-polygon" />

    <!-- Segments and Sections -->
    <line id="el-sec-AB" data-ref="/ A B /" data-aliases="/ B A / | / A E B / | / B E A /" data-type="section" x1="110" y1="35" x2="252" y2="214" class="geom-line" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="110" y1="35" x2="185" y2="130" class="geom-line" />
