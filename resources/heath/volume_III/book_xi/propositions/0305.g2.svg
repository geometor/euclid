    <!-- Parallel Planes GH, KL, MN -->
    <polygon id="el-plane-GH" data-ref="&lt; G H &gt;" data-aliases="&lt; H G &gt;" data-type="polygon" points="36,21 135,21 120,70 24,70" class="geom-polygon" />
    <polygon id="el-plane-KL" data-ref="&lt; K L &gt;" data-aliases="&lt; L K &gt;" data-type="polygon" points="114,112 235,112 218,162 99,162" class="geom-polygon" />
