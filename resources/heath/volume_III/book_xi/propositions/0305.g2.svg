<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 298 271" width="298" height="271" class="euclid-graphic" data-graphic-id="0305.g2" data-folio="0305" data-graphic="g2" data-proposition="XI.17">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #000000;
      stroke-width: 1.6;
      stroke-dasharray: 4,3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Plane Boundaries) -->
  <g id="elements">
    <!-- Plane GH boundary -->
    <line id="el-plane-GH-top" x1="36" y1="21" x2="135" y2="21" class="geom-line" />
    <line id="el-plane-GH-right" x1="135" y1="21" x2="120" y2="70" class="geom-line" />
    <line id="el-plane-GH-bottom" x1="120" y1="70" x2="24" y2="70" class="geom-line" />
    <line id="el-plane-GH-left" x1="24" y1="70" x2="36" y2="21" class="geom-line" />
    <!-- Plane KL boundary -->
    <line id="el-plane-KL-top" x1="114" y1="112" x2="235" y2="112" class="geom-line" />
    <line id="el-plane-KL-right" x1="235" y1="112" x2="218" y2="162" class="geom-line" />
    <line id="el-plane-KL-bottom" x1="218" y1="162" x2="99" y2="162" class="geom-line" />
    <line id="el-plane-KL-left" x1="99" y1="162" x2="114" y2="112" class="geom-line" />
    <!-- Plane MN boundary -->
    <line id="el-plane-MN-top" x1="141" y1="183" x2="276" y2="183" class="geom-line" />
    <line id="el-plane-MN-right" x1="276" y1="183" x2="253" y2="249" class="geom-line" />
    <line id="el-plane-MN-bottom" x1="253" y1="249" x2="111" y2="249" class="geom-line" />
    <line id="el-plane-MN-left" x1="111" y1="249" x2="141" y2="183" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Planes, Polygons, Segments, Sections) -->
