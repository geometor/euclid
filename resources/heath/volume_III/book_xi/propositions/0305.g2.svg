    <polygon id="hl-poly-AOFC" data-ref="&lt; A O F C &gt;" data-aliases="&lt; C F O A &gt;" points="110,35 134,137 115,151 63,58" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-ABD" data-ref="&lt; A B D &gt;" data-aliases="&lt; B D A &gt; | &lt; D A B &gt; | &lt; A D B &gt; | &lt; B A D &gt; | &lt; D B A &gt;" points="110,35 252,214 154,224" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-ADC" data-ref="&lt; A D C &gt;" data-aliases="&lt; D C A &gt; | &lt; C A D &gt; | &lt; A C D &gt; | &lt; D A C &gt; | &lt; C D A &gt;" points="110,35 154,224 63,58" class="geom-polygon geom-overlay" />

