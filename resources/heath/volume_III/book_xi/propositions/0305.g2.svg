    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="252" y1="214" x2="154" y2="224" class="geom-line" />
    <line id="el-seg-EO" data-ref="/ E O /" data-aliases="/ O E /" data-type="segment" x1="185" y1="130" x2="134" y2="137" class="geom-line" />
    <line id="el-seg-OF" data-ref="/ O F /" data-aliases="/ F O /" data-type="segment" x1="134" y1="137" x2="115" y2="151" class="geom-line" />
  </g>

