    <line id="hl-seg-AO" data-ref="/ A O /" data-aliases="/ O A /" x1="110" y1="35" x2="134" y2="137" class="geom-line geom-overlay" />
    <line id="hl-seg-OD" data-ref="/ O D /" data-aliases="/ D O /" x1="134" y1="137" x2="154" y2="224" class="geom-line geom-overlay" />

