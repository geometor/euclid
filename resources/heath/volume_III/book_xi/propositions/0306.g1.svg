<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 231 144" width="231" height="144" class="euclid-graphic" data-graphic-id="0306.g1" data-folio="0306" data-graphic="g1" data-proposition="XI.18">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #000000;
      stroke-width: 1.6;
      stroke-dasharray: 4,3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Plane Boundaries) -->
  <g id="elements">
    <!-- Plane of reference boundary -->
    <line id="el-plane-ref-top" x1="61" y1="62" x2="220" y2="62" class="geom-line" />
    <line id="el-plane-ref-right" x1="220" y1="62" x2="154" y2="131" class="geom-line" />
    <line id="el-plane-ref-bottom" x1="154" y1="131" x2="11" y2="131" class="geom-line" />
    <line id="el-plane-ref-left" x1="11" y1="131" x2="61" y2="62" class="geom-line" />
    <!-- Plane DE top and side boundary -->
    <line id="el-plane-DE-top" x1="33" y1="24" x2="182" y2="24" class="geom-line" />
    <line id="el-plane-DE-right" x1="182" y1="24" x2="182" y2="102" class="geom-line" />
    <line id="el-plane-DE-left" x1="33" y1="24" x2="33" y2="102" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Planes, Segments, Sections, Angle Wedges) -->
  <g id="graphics">
    <!-- Plane DE and Plane of Reference -->
    <polygon id="el-plane-DE" data-ref="&lt; D E &gt;" data-aliases="&lt; E D &gt; | &lt; C D E &gt;" data-type="polygon" points="33,24 182,24 182,102 33,102" class="geom-polygon" />
    <polygon id="el-plane-ref" data-ref="&lt; C F E &gt;" data-type="polygon" points="61,62 220,62 154,131 11,131" class="geom-polygon" />

    <!-- Segments and Sections -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="126" y1="24" x2="126" y2="102" class="geom-line" />
    <line id="el-seg-FG" data-ref="/ F G /" data-aliases="/ G F /" data-type="segment" x1="83" y1="24" x2="83" y2="102" class="geom-line" />
    <line id="el-sec-CE" data-ref="/ C E /" data-aliases="/ E C / | / C F B E /" data-type="section" x1="33" y1="102" x2="182" y2="102" class="geom-line" />
    <line id="el-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" data-type="segment" x1="33" y1="102" x2="83" y2="102" class="geom-line" />
    <line id="el-seg-FB" data-ref="/ F B /" data-aliases="/ B F /" data-type="segment" x1="83" y1="102" x2="126" y2="102" class="geom-line" />
    <line id="el-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" data-type="segment" x1="126" y1="102" x2="182" y2="102" class="geom-line" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-ABF" data-ref="&lt; A B F )" data-aliases="&lt; F B A )" data-type="wedge" d="M 126.00 102.00 L 108.00 102.00 A 18.0 18.0 0 0 1 126.00 84.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-GFB" data-ref="&lt; G F B )" data-aliases="&lt; B F G )" data-type="wedge" d="M 83.00 102.00 L 83.00 84.00 A 18.0 18.0 0 0 1 101.00 102.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-plane-DE" data-ref="&lt; D E &gt;" data-aliases="&lt; E D &gt; | &lt; C D E &gt;" points="33,24 182,24 182,102 33,102" class="geom-polygon geom-overlay" />
    <polygon id="hl-plane-ref" data-ref="&lt; C F E &gt;" points="61,62 220,62 154,131 11,131" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="126" y1="24" x2="126" y2="102" class="geom-line geom-overlay" />
    <line id="hl-seg-FG" data-ref="/ F G /" data-aliases="/ G F /" x1="83" y1="24" x2="83" y2="102" class="geom-line geom-overlay" />
    <line id="hl-sec-CE" data-ref="/ C E /" data-aliases="/ E C / | / C F B E /" x1="33" y1="102" x2="182" y2="102" class="geom-line geom-overlay" />
    <line id="hl-seg-CF" data-ref="/ C F /" data-aliases="/ F C /" x1="33" y1="102" x2="83" y2="102" class="geom-line geom-overlay" />
    <line id="hl-seg-FB" data-ref="/ F B /" data-aliases="/ B F /" x1="83" y1="102" x2="126" y2="102" class="geom-line geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" x1="126" y1="102" x2="182" y2="102" class="geom-line geom-overlay" />

    <path id="hl-ang-ABF" data-ref="&lt; A B F )" data-aliases="&lt; F B A )" d="M 126.00 102.00 L 108.00 102.00 A 18.0 18.0 0 0 1 126.00 84.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-GFB" data-ref="&lt; G F B )" data-aliases="&lt; B F G )" d="M 83.00 102.00 L 83.00 84.00 A 18.0 18.0 0 0 1 101.00 102.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="126" cy="24" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="126" cy="102" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="33" cy="102" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="33" cy="24" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="182" cy="102" r="3.2" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="83" cy="102" r="3.2" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="83" cy="24" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-D" data-ref="D" x="34" y="20" text-anchor="middle" class="geom-label">D</text>
    <text id="lbl-G" data-ref="G" x="85" y="21" text-anchor="middle" class="geom-label">G</text>
    <text id="lbl-A" data-ref="A" x="128" y="21" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-C" data-ref="C" x="30" y="106" text-anchor="end" class="geom-label">C</text>
    <text id="lbl-F" data-ref="F" x="84" y="116" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-B" data-ref="B" x="127" y="116" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-E" data-ref="E" x="184" y="113" text-anchor="start" class="geom-label">E</text>
  </g>
</svg>
