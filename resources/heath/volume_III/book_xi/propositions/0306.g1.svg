<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 231 144" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="231" height="144" />
  <g class="el">
    <line class="line" x1="48.0" y1="22.0" x2="176.0" y2="22.0" />
    <line class="line" x1="176.0" y1="22.0" x2="176.0" y2="97.0" />
    <line class="line" x1="48.0" y1="22.0" x2="48.0" y2="97.0" />
    <line class="line" x1="48.0" y1="68.0" x2="218.0" y2="68.0" />
    <line class="line" x1="218.0" y1="68.0" x2="188.0" y2="125.0" />
    <line class="line" x1="188.0" y1="125.0" x2="18.0" y2="125.0" />
    <line class="line" x1="18.0" y1="125.0" x2="48.0" y2="68.0" />
    <line class="line" x1="48.0" y1="97.0" x2="176.0" y2="97.0" />
    <line class="line" x1="93.0" y1="22.0" x2="93.0" y2="97.0" />
    <line class="line" x1="136.0" y1="22.0" x2="136.0" y2="97.0" />
    <text class="lbl" x="48.0" y="13.0">D</text>
    <text class="lbl" x="93.0" y="13.0">G</text>
    <text class="lbl" x="136.0" y="13.0">A</text>
    <text class="lbl" x="41.0" y="97.0">C</text>
    <text class="lbl" x="93.0" y="106.0">F</text>
    <text class="lbl" x="136.0" y="106.0">B</text>
    <text class="lbl" x="188.0" y="97.0">E</text>
  </g>
</svg>
