<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 311 270" width="311" height="270" class="euclid-graphic" data-graphic-id="0308.g1" data-folio="0308" data-graphic="g1" data-proposition="XI.18">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #000000;
      stroke-width: 1.6;
      stroke-dasharray: 4,3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Planes MN and CE Boundaries) -->
  <g id="elements">
    <!-- Plane MN Boundary -->
    <line id="el-mn-top-left" x1="91" y1="92" x2="128" y2="92" class="geom-line" />
    <line id="el-mn-top-dashed" x1="128" y1="92" x2="191" y2="92" class="geom-dashed" />
    <line id="el-mn-top-right" x1="191" y1="92" x2="290" y2="92" class="geom-line" />
    <line id="el-mn-right" x1="290" y1="92" x2="219" y2="175" class="geom-line" />
    <line id="el-mn-bottom" x1="219" y1="175" x2="20" y2="175" class="geom-line" />
    <line id="el-mn-left" x1="20" y1="175" x2="91" y2="92" class="geom-line" />

    <!-- Plane CE Boundary -->
    <line id="el-ce-top" x1="119" y1="102" x2="191" y2="21" class="geom-line" />
    <line id="el-ce-right-top" x1="191" y1="21" x2="191" y2="92" class="geom-line" />
    <line id="el-ce-right-dashed" x1="191" y1="92" x2="191" y2="168" class="geom-dashed" />
    <line id="el-ce-bottom" x1="191" y1="168" x2="119" y2="248" class="geom-line" />
    <line id="el-ce-left" x1="119" y1="248" x2="119" y2="102" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Planes, Segments, Angle Wedges) -->
  <g id="graphics">
    <!-- Planes MN and CE -->
    <polygon id="el-plane-MN" data-ref="&lt; M N &gt;" data-aliases="&lt; C D F &gt;" data-type="polygon" points="91,92 290,92 219,175 20,175" class="geom-polygon" />
    <polygon id="el-plane-CE" data-ref="&lt; C E &gt;" data-aliases="&lt; C D E &gt;" data-type="polygon" points="119,102 191,21 191,168 119,248" class="geom-polygon" />

    <!-- Segments -->
    <line id="el-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" data-type="segment" x1="119" y1="175" x2="191" y2="92" class="geom-line" />
    <line id="el-seg-CB" data-ref="/ C B /" data-aliases="/ B C /" data-type="segment" x1="119" y1="175" x2="154" y2="135" class="geom-line" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="154" y1="135" x2="191" y2="92" class="geom-line" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="154" y1="83" x2="154" y2="135" class="geom-line" />
    <line id="el-seg-BF" data-ref="/ B F /" data-aliases="/ F B /" data-type="segment" x1="154" y1="135" x2="218" y2="135" class="geom-line" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-ABF" data-ref="&lt; A B F )" data-aliases="&lt; F B A )" data-type="wedge" d="M 154.00 135.00 L 154.00 113.00 A 22.0 22.0 0 0 1 176.00 135.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ABD" data-ref="&lt; A B D )" data-aliases="&lt; D B A )" data-type="wedge" d="M 154.00 135.00 L 154.00 115.00 A 20.0 20.0 0 0 1 167.07 119.81 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-DBF" data-ref="&lt; D B F )" data-aliases="&lt; F B D )" data-type="wedge" d="M 154.00 135.00 L 167.07 119.81 A 20.0 20.0 0 0 1 174.00 135.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-plane-MN" data-ref="&lt; M N &gt;" data-aliases="&lt; C D F &gt;" points="91,92 290,92 219,175 20,175" class="geom-polygon geom-overlay" />
    <polygon id="hl-plane-CE" data-ref="&lt; C E &gt;" data-aliases="&lt; C D E &gt;" points="119,102 191,21 191,168 119,248" class="geom-polygon geom-overlay" />

    <line id="hl-seg-CD" data-ref="/ C D /" data-aliases="/ D C /" x1="119" y1="175" x2="191" y2="92" class="geom-line geom-overlay" />
    <line id="hl-seg-CB" data-ref="/ C B /" data-aliases="/ B C /" x1="119" y1="175" x2="154" y2="135" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="154" y1="135" x2="191" y2="92" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="154" y1="83" x2="154" y2="135" class="geom-line geom-overlay" />
    <line id="hl-seg-BF" data-ref="/ B F /" data-aliases="/ F B /" x1="154" y1="135" x2="218" y2="135" class="geom-line geom-overlay" />

    <path id="hl-ang-ABF" data-ref="&lt; A B F )" data-aliases="&lt; F B A )" d="M 154.00 135.00 L 154.00 113.00 A 22.0 22.0 0 0 1 176.00 135.00 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ABD" data-ref="&lt; A B D )" data-aliases="&lt; D B A )" d="M 154.00 135.00 L 154.00 115.00 A 20.0 20.0 0 0 1 167.07 119.81 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-DBF" data-ref="&lt; D B F )" data-aliases="&lt; F B D )" d="M 154.00 135.00 L 167.07 119.81 A 20.0 20.0 0 0 1 174.00 135.00 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="154" cy="83" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="154" cy="135" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="119" cy="175" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="191" cy="92" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="191" cy="21" r="3.2" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="218" cy="135" r="3.2" class="geom-point" />
    <circle id="el-pt-M" data-ref="M" data-type="point" cx="20" cy="175" r="3.2" class="geom-point" />
    <circle id="el-pt-N" data-ref="N" data-type="point" cx="290" cy="92" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-E" data-ref="E" x="195" y="29" text-anchor="start" class="geom-label">E</text>
    <text id="lbl-A" data-ref="A" x="157" y="81" text-anchor="start" class="geom-label">A</text>
    <text id="lbl-D" data-ref="D" x="195" y="88" text-anchor="start" class="geom-label">D</text>
    <text id="lbl-N" data-ref="N" x="294" y="99" text-anchor="start" class="geom-label">N</text>
    <text id="lbl-B" data-ref="B" x="152" y="150" text-anchor="start" class="geom-label">B</text>
    <text id="lbl-F" data-ref="F" x="221" y="140" text-anchor="start" class="geom-label">F</text>
    <text id="lbl-M" data-ref="M" x="18" y="191" text-anchor="middle" class="geom-label">M</text>
    <text id="lbl-C" data-ref="C" x="114" y="191" text-anchor="end" class="geom-label">C</text>
  </g>
</svg>
