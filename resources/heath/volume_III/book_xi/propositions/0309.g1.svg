<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 258 188" width="258" height="188" class="euclid-graphic" data-graphic-id="0309.g1" data-folio="0309" data-graphic="g1" data-proposition="XI.19">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #000000;
      stroke-width: 1.6;
      stroke-dasharray: 4,3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Plane Boundaries) -->
  <g id="elements">
    <!-- Plane MN Boundary -->
    <line id="el-mn-top-left" x1="38" y1="69" x2="82" y2="69" class="geom-line" />
    <line id="el-mn-top-dashed" x1="82" y1="69" x2="177" y2="69" class="geom-dashed" />
    <line id="el-mn-top-right" x1="177" y1="69" x2="235" y2="69" class="geom-line" />
    <line id="el-mn-right" x1="235" y1="69" x2="210" y2="158" class="geom-line" />
    <line id="el-mn-bottom" x1="210" y1="158" x2="13" y2="158" class="geom-line" />
    <line id="el-mn-left" x1="13" y1="158" x2="38" y2="69" class="geom-line" />

    <!-- Plane AC and AD Outer Edges -->
    <line id="el-ac-left" x1="82" y1="129" x2="82" y2="50" class="geom-line" />
    <line id="el-ac-top" x1="82" y1="50" x2="138" y2="24" class="geom-line" />
    <line id="el-ad-top" x1="138" y1="24" x2="177" y2="33" class="geom-line" />
    <line id="el-ad-right" x1="177" y1="33" x2="177" y2="111" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Planes, Segments, Angle Wedges) -->
  <g id="graphics">
    <!-- Planes -->
    <polygon id="el-plane-MN" data-ref="&lt; M N &gt;" data-aliases="&lt; B E F &gt;" data-type="polygon" points="38,69 235,69 210,158 13,158" class="geom-polygon" />
    <polygon id="el-plane-AC" data-ref="&lt; A C &gt;" data-aliases="&lt; C A &gt; | &lt; A B C &gt;" data-type="polygon" points="82,129 82,50 138,24 138,103" class="geom-polygon" />
    <polygon id="el-plane-AD" data-ref="&lt; A D &gt;" data-aliases="&lt; D A &gt; | &lt; A B D &gt;" data-type="polygon" points="138,103 138,24 177,33 177,111" class="geom-polygon" />

    <!-- Segments -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="138" y1="24" x2="138" y2="103" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="138" y1="103" x2="82" y2="129" class="geom-line" />
    <line id="el-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" data-type="segment" x1="138" y1="103" x2="177" y2="111" class="geom-line" />
    <line id="el-seg-BF" data-ref="/ B F /" data-aliases="/ F B /" data-type="segment" x1="138" y1="103" x2="124" y2="136" class="geom-line" />
    <line id="el-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" data-type="segment" x1="138" y1="103" x2="158" y2="135" class="geom-line" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-CBE" data-ref="&lt; C B E )" data-aliases="&lt; E B C )" data-type="wedge" d="M 138.00 103.00 L 121.68 110.58 A 18.0 18.0 0 0 0 147.54 118.26 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-DBF" data-ref="&lt; D B F )" data-aliases="&lt; F B D )" data-type="wedge" d="M 138.00 103.00 L 130.96 119.56 A 18.0 18.0 0 0 0 155.63 106.62 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ABE" data-ref="&lt; A B E )" data-aliases="&lt; E B A )" data-type="wedge" d="M 138.00 103.00 L 138.00 85.00 A 18.0 18.0 0 0 1 147.54 118.26 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ABF" data-ref="&lt; A B F )" data-aliases="&lt; F B A )" data-type="wedge" d="M 138.00 103.00 L 138.00 85.00 A 18.0 18.0 0 0 0 130.96 119.56 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-plane-MN" data-ref="&lt; M N &gt;" data-aliases="&lt; B E F &gt;" points="38,69 235,69 210,158 13,158" class="geom-polygon geom-overlay" />
    <polygon id="hl-plane-AC" data-ref="&lt; A C &gt;" data-aliases="&lt; C A &gt; | &lt; A B C &gt;" points="82,129 82,50 138,24 138,103" class="geom-polygon geom-overlay" />
    <polygon id="hl-plane-AD" data-ref="&lt; A D &gt;" data-aliases="&lt; D A &gt; | &lt; A B D &gt;" points="138,103 138,24 177,33 177,111" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="138" y1="24" x2="138" y2="103" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="138" y1="103" x2="82" y2="129" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="138" y1="103" x2="177" y2="111" class="geom-line geom-overlay" />
    <line id="hl-seg-BF" data-ref="/ B F /" data-aliases="/ F B /" x1="138" y1="103" x2="124" y2="136" class="geom-line geom-overlay" />
    <line id="hl-seg-BE" data-ref="/ B E /" data-aliases="/ E B /" x1="138" y1="103" x2="158" y2="135" class="geom-line geom-overlay" />

    <path id="hl-ang-CBE" data-ref="&lt; C B E )" data-aliases="&lt; E B C )" d="M 138.00 103.00 L 121.68 110.58 A 18.0 18.0 0 0 0 147.54 118.26 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-DBF" data-ref="&lt; D B F )" data-aliases="&lt; F B D )" d="M 138.00 103.00 L 130.96 119.56 A 18.0 18.0 0 0 0 155.63 106.62 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ABE" data-ref="&lt; A B E )" data-aliases="&lt; E B A )" d="M 138.00 103.00 L 138.00 85.00 A 18.0 18.0 0 0 1 147.54 118.26 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ABF" data-ref="&lt; A B F )" data-aliases="&lt; F B A )" d="M 138.00 103.00 L 138.00 85.00 A 18.0 18.0 0 0 0 130.96 119.56 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="138" cy="24" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="138" cy="103" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="82" cy="129" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="177" cy="111" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="158" cy="135" r="3.2" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="124" cy="136" r="3.2" class="geom-point" />
    <circle id="el-pt-M" data-ref="M" data-type="point" cx="13" cy="158" r="3.2" class="geom-point" />
    <circle id="el-pt-N" data-ref="N" data-type="point" cx="235" cy="69" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="138" y="19" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-N" data-ref="N" x="239" y="75" text-anchor="start" class="geom-label">N</text>
    <text id="lbl-B" data-ref="B" x="141" y="101" text-anchor="start" class="geom-label">B</text>
    <text id="lbl-D" data-ref="D" x="179" y="121" text-anchor="start" class="geom-label">D</text>
    <text id="lbl-C" data-ref="C" x="79" y="138" text-anchor="end" class="geom-label">C</text>
    <text id="lbl-F" data-ref="F" x="122" y="151" text-anchor="middle" class="geom-label">F</text>
    <text id="lbl-E" data-ref="E" x="167" y="146" text-anchor="middle" class="geom-label">E</text>
    <text id="lbl-M" data-ref="M" x="16" y="172" text-anchor="middle" class="geom-label">M</text>
  </g>
</svg>
