<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 218 222" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="218" height="222" />
  <g class="el">
    <line class="line" x1="52.0" y1="92.0" x2="196.0" y2="92.0" />
    <line class="line" x1="196.0" y1="92.0" x2="178.0" y2="172.0" />
    <line class="line" x1="178.0" y1="172.0" x2="34.0" y2="172.0" />
    <line class="line" x1="34.0" y1="172.0" x2="52.0" y2="92.0" />
    <line class="line" x1="78.0" y1="34.0" x2="176.0" y2="74.0" />
    <line class="line" x1="176.0" y1="74.0" x2="176.0" y2="198.0" />
    <line class="line" x1="176.0" y1="198.0" x2="78.0" y2="158.0" />
    <line class="line" x1="78.0" y1="158.0" x2="78.0" y2="34.0" />
    <line class="line" x1="127.0" y1="54.0" x2="127.0" y2="178.0" />
    <line class="line" x1="78.0" y1="92.0" x2="176.0" y2="132.0" />
    <text class="lbl" x="76.0" y="25.0">A</text>
    <text class="lbl" x="127.0" y="45.0">C</text>
    <text class="lbl" x="184.0" y="74.0">B</text>
    <text class="lbl" x="204.0" y="92.0">N</text>
    <text class="lbl" x="127.0" y="140.0">D</text>
    <text class="lbl" x="43.0" y="181.0">M</text>
    <text class="lbl" x="184.0" y="198.0">E</text>
  </g>
</svg>
