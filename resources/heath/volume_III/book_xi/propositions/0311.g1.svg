    <line class="line" x1="53.0" y1="52.0" x2="182.0" y2="52.0" />
    <line class="line" x1="53.0" y1="136.0" x2="182.0" y2="136.0" />
    <text class="lbl" x="43.0" y="60.0">A</text>
    <text class="lbl" x="168.0" y="52.0">B</text>
