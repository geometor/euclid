    <line class="line" x1="160.0" y1="68.0" x2="31.0" y2="68.0" />
    <line class="line" x1="31.0" y1="68.0" x2="53.0" y2="36.0" />
    <line class="line" x1="53.0" y1="120.0" x2="182.0" y2="120.0" />
    <line class="line" x1="182.0" y1="120.0" x2="160.0" y2="174.0" />
