<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 287 188" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="287" height="188" />
  <g class="el">
    <line class="line" x1="225.0" y1="22.0" x2="58.0" y2="113.0" />
    <line class="line" x1="58.0" y1="154.0" x2="258.0" y2="154.0" />
    <line class="line" x1="95.0" y1="93.0" x2="95.0" y2="154.0" />
    <line class="line" x1="95.0" y1="93.0" x2="262.0" y2="99.0" />
    <line class="line" x1="148.0" y1="64.0" x2="148.0" y2="154.0" />
    <text class="lbl" x="220.0" y="14.0">B</text>
    <text class="lbl" x="148.0" y="54.0">G</text>
    <text class="lbl" x="87.0" y="88.0">L</text>
    <text class="lbl" x="50.0" y="113.0">A</text>
    <text class="lbl" x="268.0" y="99.0">F</text>
    <text class="lbl" x="156.0" y="128.0">H</text>
    <text class="lbl" x="41.0" y="163.0">C</text>
    <text class="lbl" x="95.0" y="163.0">K</text>
    <text class="lbl" x="171.0" y="163.0">E</text>
    <text class="lbl" x="244.0" y="163.0">D</text>
  </g>
</svg>
