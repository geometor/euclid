<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 271 161" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="271" height="161" />
  <g class="el">
    <line class="line" x1="188.0" y1="24.0" x2="32.0" y2="125.0" />
    <line class="line" x1="188.0" y1="24.0" x2="249.0" y2="125.0" />
    <line class="line" x1="188.0" y1="24.0" x2="224.0" y2="125.0" />
    <line class="line" x1="32.0" y1="125.0" x2="249.0" y2="125.0" />
    <line class="line" x1="167.0" y1="83.0" x2="32.0" y2="125.0" />
    <line class="line" x1="167.0" y1="83.0" x2="249.0" y2="125.0" />
    <line class="line" x1="167.0" y1="83.0" x2="224.0" y2="125.0" />
    <text class="lbl" x="188.0" y="14.0">D</text>
    <text class="lbl" x="162.0" y="73.0">A</text>
    <text class="lbl" x="27.0" y="133.0">B</text>
    <text class="lbl" x="216.0" y="133.0">E</text>
    <text class="lbl" x="252.0" y="133.0">C</text>
  </g>
</svg>
