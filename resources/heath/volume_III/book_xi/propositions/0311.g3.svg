<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 271 161" width="271" height="161" class="euclid-graphic" data-graphic-id="0311.g3" data-folio="0311" data-graphic="g3" data-proposition="XI.20">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements"></g>

  <!-- Constructed Graphics (Planes/Triangles, Segments, Angle Wedges) -->
  <g id="graphics">
    <!-- Planes and Triangles -->
    <polygon id="el-tri-BAC" data-ref="&lt; B A C &gt;" data-aliases="&lt; C A B &gt;" data-type="polygon" points="27,126 168,79 245,126" class="geom-polygon" />
    <polygon id="el-tri-BAE" data-ref="&lt; B A E &gt;" data-aliases="&lt; E A B &gt;" data-type="polygon" points="27,126 168,79 206,126" class="geom-polygon" />
    <polygon id="el-tri-EAC" data-ref="&lt; E A C &gt;" data-aliases="&lt; C A E &gt;" data-type="polygon" points="206,126 168,79 245,126" class="geom-polygon" />
    <polygon id="el-tri-DAB" data-ref="&lt; D A B &gt;" data-aliases="&lt; B A D &gt;" data-type="polygon" points="183,20 168,79 27,126" class="geom-polygon" />
    <polygon id="el-tri-DAC" data-ref="&lt; D A C &gt;" data-aliases="&lt; C A D &gt;" data-type="polygon" points="183,20 168,79 245,126" class="geom-polygon" />
    <polygon id="el-tri-BDC" data-ref="&lt; B D C &gt;" data-aliases="&lt; C D B &gt;" data-type="polygon" points="27,126 183,20 245,126" class="geom-polygon" />

    <!-- Segments -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="168" y1="79" x2="27" y2="126" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="168" y1="79" x2="245" y2="126" class="geom-line" />
    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="168" y1="79" x2="183" y2="20" class="geom-line" />
    <line id="el-seg-AE" data-ref="/ A E /" data-aliases="/ E A /" data-type="segment" x1="168" y1="79" x2="206" y2="126" class="geom-line" />
