    <line id="hl-seg-EC" data-ref="/ E C /" data-aliases="/ C E /" x1="206" y1="126" x2="245" y2="126" class="geom-line geom-overlay" />
    <line id="hl-seg-BD" data-ref="/ B D /" data-aliases="/ D B /" x1="27" y1="126" x2="183" y2="20" class="geom-line geom-overlay" />
    <line id="hl-seg-DC" data-ref="/ D C /" data-aliases="/ C D /" x1="183" y1="20" x2="245" y2="126" class="geom-line geom-overlay" />

    <path id="hl-ang-BAC" data-ref="&lt; B A C )" data-aliases="&lt; C A B )" d="M 168.00 79.00 L 147.13 85.96 A 22.0 22.0 0 0 0 186.80 90.47 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-BAE" data-ref="&lt; B A E )" data-aliases="&lt; E A B )" d="M 168.00 79.00 L 149.03 85.32 A 20.0 20.0 0 0 0 180.58 94.56 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-EAC" data-ref="&lt; E A C )" data-aliases="&lt; C A E )" d="M 168.00 79.00 L 180.58 94.56 A 20.0 20.0 0 0 0 185.09 89.43 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-DAB" data-ref="&lt; D A B )" data-aliases="&lt; B A D )" d="M 168.00 79.00 L 172.94 59.58 A 20.0 20.0 0 0 0 149.03 85.32 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-CAD" data-ref="&lt; C A D )" data-aliases="&lt; D A C )" d="M 168.00 79.00 L 185.09 89.43 A 20.0 20.0 0 0 0 172.94 59.58 Z" class="wedge angle geom-overlay" />
