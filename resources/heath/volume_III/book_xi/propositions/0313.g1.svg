<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226 161" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="226" height="161" />
  <g class="el">
    <line class="line" x1="68.0" y1="26.0" x2="23.0" y2="138.0" />
    <line class="line" x1="68.0" y1="26.0" x2="196.0" y2="95.0" />
    <line class="line" x1="23.0" y1="138.0" x2="196.0" y2="95.0" />
    <line class="line" x1="95.0" y1="82.0" x2="68.0" y2="26.0" />
    <line class="line" x1="95.0" y1="82.0" x2="23.0" y2="138.0" />
    <line class="line" x1="95.0" y1="82.0" x2="196.0" y2="95.0" />
    <text class="lbl" x="68.0" y="16.0">C</text>
    <text class="lbl" x="96.0" y="72.0">A</text>
    <text class="lbl" x="205.0" y="95.0">D</text>
    <text class="lbl" x="17.0" y="145.0">B</text>
  </g>
</svg>
