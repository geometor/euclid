    <circle id="el-pt-B" data-ref="B" data-type="point" cx="93" cy="31" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="156" cy="139" r="3.2" class="geom-point" />

    <circle id="el-pt-D" data-ref="D" data-type="point" cx="196" cy="140" r="3.2" class="geom-point" />
