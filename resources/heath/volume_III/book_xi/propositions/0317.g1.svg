    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="93" y1="31" x2="156" y2="139" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="26" y1="138" x2="156" y2="139" class="geom-line geom-overlay" />

    <line id="hl-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" x1="196" y1="140" x2="281" y2="46" class="geom-line geom-overlay" />
