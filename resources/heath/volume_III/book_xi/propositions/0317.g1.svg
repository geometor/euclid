    <line id="el-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" data-type="segment" x1="196" y1="140" x2="363" y2="140" class="geom-line" />

    <line id="el-seg-GH" data-ref="/ G H /" data-aliases="/ H G /" data-type="segment" x1="404" y1="139" x2="440" y2="23" class="geom-line" />
    <line id="el-seg-HK" data-ref="/ H K /" data-aliases="/ K H /" data-type="segment" x1="440" y1="23" x2="479" y2="139" class="geom-line" />
    <line id="el-seg-GK" data-ref="/ G K /" data-aliases="/ K G /" data-type="segment" x1="404" y1="139" x2="479" y2="139" class="geom-line" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A )" data-type="wedge" d="M 93.00 31.00 L 81.39 49.55 A 22.0 22.0 0 0 0 104.09 50.00 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-DEF" data-ref="&lt; D E F )" data-aliases="&lt; F E D )" data-type="wedge" d="M 281.00 46.00 L 266.24 62.32 A 22.0 22.0 0 0 0 295.46 62.58 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-GHK" data-ref="&lt; G H K )" data-aliases="&lt; K H G )" data-type="wedge" d="M 440.00 23.00 L 433.48 44.01 A 22.0 22.0 0 0 0 447.01 43.85 Z" class="wedge angle geom-overlay" />
  </g>

