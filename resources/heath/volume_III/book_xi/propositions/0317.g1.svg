    <circle id="el-pt-F" data-ref="F" data-type="point" cx="363" cy="140" r="3.2" class="geom-point" />

    <circle id="el-pt-G" data-ref="G" data-type="point" cx="404" cy="139" r="3.2" class="geom-point" />
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="440" cy="23" r="3.2" class="geom-point" />
    <circle id="el-pt-K" data-ref="K" data-type="point" cx="479" cy="139" r="3.2" class="geom-point" />
