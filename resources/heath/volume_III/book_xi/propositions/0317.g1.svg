    <polygon id="el-tri-ABC" data-ref="&lt; A B C &gt;" data-aliases="&lt; B A C &gt;" data-type="polygon" points="26,138 93,31 156,139" class="geom-polygon" />
    <polygon id="el-tri-DEF" data-ref="&lt; D E F &gt;" data-aliases="&lt; E D F &gt;" data-type="polygon" points="196,140 281,46 363,140" class="geom-polygon" />
    <polygon id="el-tri-GHK" data-ref="&lt; G H K &gt;" data-aliases="&lt; H G K &gt;" data-type="polygon" points="404,139 440,23 479,139" class="geom-polygon" />

    <!-- Segments -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="26" y1="138" x2="93" y2="31" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="93" y1="31" x2="156" y2="139" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="26" y1="138" x2="156" y2="139" class="geom-line" />

    <line id="el-seg-DE" data-ref="/ D E /" data-aliases="/ E D /" data-type="segment" x1="196" y1="140" x2="281" y2="46" class="geom-line" />
