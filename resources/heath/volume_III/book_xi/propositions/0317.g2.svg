<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 193 178" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="193" height="178" />
  <g class="el">
    <line class="line" x1="62.0" y1="36.0" x2="28.0" y2="148.0" />
    <line class="line" x1="62.0" y1="36.0" x2="98.0" y2="148.0" />
    <line class="line" x1="62.0" y1="36.0" x2="164.0" y2="69.0" />
    <line class="line" x1="28.0" y1="148.0" x2="98.0" y2="148.0" />
    <line class="line" x1="28.0" y1="148.0" x2="164.0" y2="69.0" />
    <line class="line" x1="98.0" y1="148.0" x2="164.0" y2="69.0" />
    <text class="lbl" x="53.0" y="32.0">H</text>
    <text class="lbl" x="173.0" y="69.0">L</text>
    <text class="lbl" x="20.0" y="152.0">G</text>
    <text class="lbl" x="98.0" y="157.0">K</text>
  </g>
</svg>
