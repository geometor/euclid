<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 158 112" width="158" height="112" class="euclid-graphic" data-graphic-id="0322.g1" data-folio="0322" data-graphic="g1" data-proposition="XI.23">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line, .geom-circle {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Semicircle ABC) -->
  <g id="elements">
    <path id="el-cir-ABC" data-ref="( A B C )" data-aliases="( A C B ) | ( C B A )" data-type="circle" d="M 14 91 A 65 65 0 0 1 144 91" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Right Triangle ACB, Segments, Right Angle) -->
  <g id="graphics">
    <polygon id="el-tri-ACB" data-ref="&lt; A C B &gt;" data-aliases="&lt; A B C &gt; | &lt; B C A &gt; | &lt; C B A &gt;" data-type="polygon" points="14,91 79,26 144,91" class="geom-polygon" />

    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="14" y1="91" x2="144" y2="91" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="14" y1="91" x2="79" y2="26" class="geom-line" />
    <line id="el-seg-CB" data-ref="/ C B /" data-aliases="/ B C /" data-type="segment" x1="79" y1="26" x2="144" y2="91" class="geom-line" />

    <path id="el-ang-ACB" data-ref="&lt; A C B )" data-aliases="&lt; B C A )" data-type="wedge" d="M 79.00 26.00 L 91.73 38.73 A 18.0 18.0 0 0 1 66.27 38.73 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <path id="hl-cir-ABC" data-ref="( A B C )" data-aliases="( A C B ) | ( C B A )" d="M 14 91 A 65 65 0 0 1 144 91" class="geom-circle geom-overlay" />
    <polygon id="hl-tri-ACB" data-ref="&lt; A C B &gt;" data-aliases="&lt; A B C &gt; | &lt; B C A &gt; | &lt; C B A &gt;" points="14,91 79,26 144,91" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" x1="14" y1="91" x2="144" y2="91" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="14" y1="91" x2="79" y2="26" class="geom-line geom-overlay" />
    <line id="hl-seg-CB" data-ref="/ C B /" data-aliases="/ B C /" x1="79" y1="26" x2="144" y2="91" class="geom-line geom-overlay" />

    <path id="hl-ang-ACB" data-ref="&lt; A C B )" data-aliases="&lt; B C A )" d="M 79.00 26.00 L 91.73 38.73 A 18.0 18.0 0 0 1 66.27 38.73 Z" class="wedge angle geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="14" cy="91" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="144" cy="91" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="79" cy="26" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-C" data-ref="C" x="79" y="18" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-A" data-ref="A" x="14" y="106" text-anchor="middle" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="144" y="106" text-anchor="middle" class="geom-label">B</text>
  </g>
</svg>
