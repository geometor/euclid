    <line id="el-seg-ApBp" data-ref="/ A' B' /" data-aliases="/ B' A' /" data-type="segment" x1="45" y1="139" x2="83" y2="141" class="geom-line" />
    <line id="el-seg-BpCp" data-ref="/ B' C' /" data-aliases="/ C' B' /" data-type="segment" x1="83" y1="141" x2="143" y2="132" class="geom-line" />
    <line id="el-seg-CpDp" data-ref="/ C' D' /" data-aliases="/ D' C' /" data-type="segment" x1="143" y1="132" x2="176" y2="108" class="geom-line" />
    <line id="el-seg-DpEp" data-ref="/ D' E' /" data-aliases="/ E' D' /" data-type="segment" x1="176" y1="108" x2="94" y2="92" class="geom-dashed" />
    <line id="el-seg-EpAp" data-ref="/ E' A' /" data-aliases="/ A' E' /" data-type="segment" x1="94" y1="92" x2="45" y2="139" class="geom-dashed" />

    <!-- Lower Section ABCDE Segments -->
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A /" data-type="segment" x1="52" y1="169" x2="89" y2="171" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="89" y1="171" x2="149" y2="162" class="geom-line" />
