    <line id="hl-seg-DDp" data-ref="/ D D' /" data-aliases="/ D' D /" x1="183" y1="139" x2="176" y2="108" class="geom-line geom-overlay" />
    <line id="hl-seg-EEp" data-ref="/ E E' /" data-aliases="/ E' E /" x1="101" y1="123" x2="94" y2="92" class="geom-line geom-overlay" />

