    <!--Lateral Sub-Segments -->
    <line id="el-seg-AAp" data-ref="/ A A' /" data-aliases="/ A' A /" data-type="segment" x1="52" y1="169" x2="45" y2="139" class="geom-line" />
    <line id="el-seg-BBp" data-ref="/ B B' /" data-aliases="/ B' B /" data-type="segment" x1="89" y1="171" x2="83" y2="141" class="geom-line" />
    <line id="el-seg-CCp" data-ref="/ C C' /" data-aliases="/ C' C /" data-type="segment" x1="149" y1="162" x2="143" y2="132" class="geom-line" />
    <line id="el-seg-DDp" data-ref="/ D D' /" data-aliases="/ D' D /" data-type="segment" x1="183" y1="139" x2="176" y2="108" class="geom-line" />
    <line id="el-seg-EEp" data-ref="/ E E' /" data-aliases="/ E' E /" data-type="segment" x1="101" y1="123" x2="94" y2="92" class="geom-dashed" />

    <!-- Toggleable Angle Wedges -->
    <path id="el-ang-ABC" data-ref="&lt; A B C )" data-aliases="&lt; C B A )" data-type="wedge" d="M 89.00 171.00 L 73.02 170.14 A 16.0 16.0 0 0 1 104.82 168.63 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BCD" data-ref="&lt; B C D )" data-aliases="&lt; D C B )" data-type="wedge" d="M 149.00 162.00 L 133.18 164.37 A 16.0 16.0 0 0 1 162.25 153.04 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-ApBpCp" data-ref="&lt; A' B' C' )" data-aliases="&lt; C' B' A' )" data-type="wedge" d="M 83.00 141.00 L 67.02 140.16 A 16.0 16.0 0 0 1 98.82 138.63 Z" class="wedge angle geom-overlay" />
    <path id="el-ang-BpCpDp" data-ref="&lt; B' C' D' )" data-aliases="&lt; D' C' B' )" data-type="wedge" d="M 143.00 132.00 L 127.18 134.37 A 16.0 16.0 0 0 1 155.94 122.59 Z" class="wedge angle geom-overlay" />
  </g>

