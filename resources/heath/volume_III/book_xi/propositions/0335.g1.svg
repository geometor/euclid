<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 246" width="220" height="246" class="euclid-graphic" data-graphic-id="0335.g1" data-folio="0335" data-graphic="g1" data-proposition="XI.28">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #000000;
      stroke-width: 1.6;
      stroke-dasharray: 4,3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Prism Lateral Edges and Top/Bottom Faces) -->
  <g id="elements">
    <!-- Top Pentagon of Prism MN -->
    <line id="el-top-1" x1="25" y1="50" x2="66" y2="68" class="geom-line" />
    <line id="el-top-2" x1="66" y1="68" x2="128" y2="69" class="geom-line" />
    <line id="el-top-3" x1="128" y1="69" x2="162" y2="47" class="geom-line" />
    <line id="el-top-4" x1="162" y1="47" x2="76" y2="12" class="geom-line" />
    <line id="el-top-5" x1="76" y1="12" x2="25" y2="50" class="geom-line" />

    <!-- Bottom Pentagon of Prism MN -->
    <line id="el-bot-1" x1="62" y1="217" x2="103" y2="236" class="geom-line" />
    <line id="el-bot-2" x1="103" y1="236" x2="165" y2="236" class="geom-line" />
    <line id="el-bot-3" x1="165" y1="236" x2="199" y2="212" class="geom-line" />
    <line id="el-bot-4" x1="199" y1="212" x2="113" y2="178" class="geom-dashed" />
    <line id="el-bot-5" x1="113" y1="178" x2="62" y2="217" class="geom-dashed" />

