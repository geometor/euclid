    <path id="hl-ang-BCD" data-ref="&lt; B C D )" data-aliases="&lt; D C B )" d="M 149.00 162.00 L 133.18 164.37 A 16.0 16.0 0 0 1 162.25 153.04 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-ApBpCp" data-ref="&lt; A' B' C' )" data-aliases="&lt; C' B' A' )" d="M 83.00 141.00 L 67.02 140.16 A 16.0 16.0 0 0 1 98.82 138.63 Z" class="wedge angle geom-overlay" />
    <path id="hl-ang-BpCpDp" data-ref="&lt; B' C' D' )" data-aliases="&lt; D' C' B' )" d="M 143.00 132.00 L 127.18 134.37 A 16.0 16.0 0 0 1 155.94 122.59 Z" class="wedge angle geom-overlay" />
