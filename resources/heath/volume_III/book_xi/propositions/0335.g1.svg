    <polygon id="el-prism-MN" data-ref="&lt; M N &gt;" data-aliases="&lt; N M &gt;" data-type="polygon" points="25,50 76,12 162,47 199,212 165,236 103,236 62,217" class="geom-polygon" />
    <polygon id="el-poly-ApBpCpDpEp" data-ref="&lt; A' B' C' D' E' &gt;" data-type="polygon" points="45,139 83,141 143,132 176,108 94,92" class="geom-polygon" />
    <polygon id="el-poly-ABCDE" data-ref="&lt; A B C D E &gt;" data-type="polygon" points="52,169 89,171 149,162 183,139 101,123" class="geom-polygon" />

