    <line id="el-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" data-type="segment" x1="30" y1="18" x2="68" y2="136" class="geom-line" />
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="16" y1="39" x2="54" y2="157" class="geom-line" />
    <line id="el-seg-GF" data-ref="/ G F /" data-aliases="/ F G /" data-type="segment" x1="89" y1="39" x2="127" y2="157" class="geom-line" />
    <line id="el-seg-HE" data-ref="/ H E /" data-aliases="/ E H /" data-type="segment" x1="103" y1="18" x2="141" y2="136" class="geom-line" />

    <line id="el-seg-AG" data-ref="/ A G /" data-aliases="/ G A /" data-type="segment" x1="30" y1="18" x2="89" y2="39" class="geom-line" />
    <line id="el-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" data-type="segment" x1="68" y1="136" x2="127" y2="157" class="geom-line" />
    <line id="el-seg-KM" data-ref="/ K M /" data-aliases="/ M K /" data-type="segment" x1="52" y1="86" x2="106" y2="92" class="geom-line" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-KLMN" data-ref="&lt; K L M N &gt;" points="52,86 37,105 106,92 121,73" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-KLM" data-ref="&lt; K L M &gt;" points="52,86 37,105 106,92" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-MNK" data-ref="&lt; M N K &gt;" data-aliases="&lt; K M N &gt;" points="106,92 121,73 52,86" class="geom-polygon geom-overlay" />

