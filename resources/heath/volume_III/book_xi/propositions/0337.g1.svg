    <polygon id="hl-tri-DCF" data-ref="&lt; D C F &gt;" points="68,136 54,157 127,157" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-AGH" data-ref="&lt; A G H &gt;" points="30,18 89,39 103,18" class="geom-polygon geom-overlay" />
    <polygon id="hl-tri-DFE" data-ref="&lt; D F E &gt;" points="68,136 127,157 141,136" class="geom-polygon geom-overlay" />

    <line id="hl-seg-AD" data-ref="/ A D /" data-aliases="/ D A /" x1="30" y1="18" x2="68" y2="136" class="geom-line geom-overlay" />
    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="16" y1="39" x2="54" y2="157" class="geom-line geom-overlay" />
    <line id="hl-seg-GF" data-ref="/ G F /" data-aliases="/ F G /" x1="89" y1="39" x2="127" y2="157" class="geom-line geom-overlay" />
    <line id="hl-seg-HE" data-ref="/ H E /" data-aliases="/ E H /" x1="103" y1="18" x2="141" y2="136" class="geom-line geom-overlay" />

    <line id="hl-seg-AG" data-ref="/ A G /" data-aliases="/ G A /" x1="30" y1="18" x2="89" y2="39" class="geom-line geom-overlay" />
    <line id="hl-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" x1="68" y1="136" x2="127" y2="157" class="geom-line geom-overlay" />
    <line id="hl-seg-KM" data-ref="/ K M /" data-aliases="/ M K /" x1="52" y1="86" x2="106" y2="92" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
