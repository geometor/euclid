    <circle id="el-pt-H" data-ref="H" data-type="point" cx="103" cy="18" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="16" cy="39" r="3.2" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="89" cy="39" r="3.2" class="geom-point" />

    <circle id="el-pt-K" data-ref="K" data-type="point" cx="52" cy="86" r="3.2" class="geom-point" />
    <circle id="el-pt-L" data-ref="L" data-type="point" cx="37" cy="105" r="3.2" class="geom-point" />
    <circle id="el-pt-M" data-ref="M" data-type="point" cx="106" cy="92" r="3.2" class="geom-point" />
    <circle id="el-pt-N" data-ref="N" data-type="point" cx="121" cy="73" r="3.2" class="geom-point" />

    <circle id="el-pt-D" data-ref="D" data-type="point" cx="68" cy="136" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="141" cy="136" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="54" cy="157" r="3.2" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="127" cy="157" r="3.2" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
