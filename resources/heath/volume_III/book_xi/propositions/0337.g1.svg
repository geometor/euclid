<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 155 170" width="155" height="170" class="euclid-graphic" data-graphic-id="0337.g1" data-folio="0337" data-graphic="g1" data-proposition="XI.28">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Parallelepiped and Right Section) -->
  <g id="elements">
    <!-- Top Parallelogram ABGH -->
    <line id="el-A-H" x1="30" y1="18" x2="103" y2="18" class="geom-line" />
    <line id="el-H-G" x1="103" y1="18" x2="89" y2="39" class="geom-line" />
    <line id="el-G-B" x1="89" y1="39" x2="16" y2="39" class="geom-line" />
    <line id="el-B-A" x1="16" y1="39" x2="30" y2="18" class="geom-line" />

    <!-- Bottom Parallelogram DCFE -->
    <line id="el-D-E" x1="68" y1="136" x2="141" y2="136" class="geom-line" />
    <line id="el-E-F" x1="141" y1="136" x2="127" y2="157" class="geom-line" />
    <line id="el-F-C" x1="127" y1="157" x2="54" y2="157" class="geom-line" />
    <line id="el-C-D" x1="54" y1="157" x2="68" y2="136" class="geom-line" />

    <!-- Right Section Parallelogram KLMN -->
    <line id="el-K-N" x1="52" y1="86" x2="121" y2="73" class="geom-line" />
    <line id="el-N-M" x1="121" y1="73" x2="106" y2="92" class="geom-line" />
    <line id="el-M-L" x1="106" y1="92" x2="37" y2="105" class="geom-line" />
    <line id="el-L-K" x1="37" y1="105" x2="52" y2="86" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Right Section, Triangles, Lateral Edges, Diagonals) -->
  <g id="graphics">
    <!-- Right Section KLMN and Triangles -->
    <polygon id="el-poly-KLMN" data-ref="&lt; K L M N &gt;" data-type="polygon" points="52,86 37,105 106,92 121,73" class="geom-polygon" />
    <polygon id="el-tri-KLM" data-ref="&lt; K L M &gt;" data-type="polygon" points="52,86 37,105 106,92" class="geom-polygon" />
    <polygon id="el-tri-MNK" data-ref="&lt; M N K &gt;" data-aliases="&lt; K M N &gt;" data-type="polygon" points="106,92 121,73 52,86" class="geom-polygon" />

    <!-- Base and Top Triangles -->
    <polygon id="el-tri-ABG" data-ref="&lt; A B G &gt;" data-type="polygon" points="30,18 16,39 89,39" class="geom-polygon" />
    <polygon id="el-tri-DCF" data-ref="&lt; D C F &gt;" data-type="polygon" points="68,136 54,157 127,157" class="geom-polygon" />
    <polygon id="el-tri-AGH" data-ref="&lt; A G H &gt;" data-type="polygon" points="30,18 89,39 103,18" class="geom-polygon" />
    <polygon id="el-tri-DFE" data-ref="&lt; D F E &gt;" data-type="polygon" points="68,136 127,157 141,136" class="geom-polygon" />

