<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226 103" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .el { cursor: pointer; transition: stroke 0.15s ease; }
    .el:hover .line, .el:hover .dashed { stroke: #0284c7; stroke-width: 2.5; }
    .el:hover .lbl { fill: #0284c7; }
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
  </style>
  <rect class="bg" width="226" height="103" />
  <g class="el">
    <line class="line" x1="22.0" y1="20.0" x2="148.0" y2="20.0" />
    <line class="line" x1="148.0" y1="20.0" x2="148.0" y2="68.0" />
    <line class="line" x1="148.0" y1="68.0" x2="22.0" y2="68.0" />
    <line class="line" x1="22.0" y1="68.0" x2="22.0" y2="20.0" />
    <line class="line" x1="22.0" y1="68.0" x2="74.0" y2="88.0" />
    <line class="line" x1="74.0" y1="88.0" x2="204.0" y2="88.0" />
    <line class="line" x1="204.0" y1="88.0" x2="148.0" y2="68.0" />
    <line class="line" x1="95.0" y1="38.0" x2="95.0" y2="82.0" />
