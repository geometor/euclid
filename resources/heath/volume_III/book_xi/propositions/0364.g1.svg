    <line class="line" x1="95.0" y1="38.0" x2="78.0" y2="68.0" />
    <text class="lbl" x="14.0" y="20.0">C</text>
    <text class="lbl" x="86.0" y="38.0">E</text>
    <text class="lbl" x="156.0" y="60.0">D</text>
    <text class="lbl" x="14.0" y="68.0">A</text>
    <text class="lbl" x="74.0" y="78.0">G</text>
    <text class="lbl" x="103.0" y="82.0">F</text>
