<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 431 209" width="431" height="209" class="euclid-graphic" data-graphic-id="0381.g2" data-folio="0381" data-graphic="g2" data-proposition="XII.2">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line, .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: #000000;
      stroke-width: 1.6;
      stroke-linejoin: round;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <circle id="el-cir-CA" data-ref="( C A )" data-aliases="( A C )" data-type="circle" cx="78.0" cy="108.0" r="68.0" class="geom-circle" />
    <circle id="el-cir-OB" data-ref="( O B )" data-aliases="( B O )" data-type="circle" cx="336.0" cy="110.0" r="90.0" class="geom-circle" />
    <circle id="el-cir-OD" data-ref="( O D )" data-aliases="( D O )" data-type="circle" cx="336.0" cy="110.0" r="74.0" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Polygons & Segments) -->
  <g id="graphics">
    <polygon id="el-poly-CA" data-ref="&lt; C A &gt;" data-type="polygon" points="51.98,45.18 104.02,45.18 140.82,81.98 140.82,134.02 104.02,170.82 51.98,170.82 15.18,134.02 15.18,81.98" class="geom-polygon" />
    <polygon id="el-poly-OB" data-ref="&lt; O B &gt;" data-type="polygon" points="301.56,26.85 370.44,26.85 419.15,75.56 419.15,144.44 370.44,193.15 301.56,193.15 252.85,144.44 252.85,75.56" class="geom-polygon" />

    <line id="el-seg-CA" data-ref="/ C A /" data-aliases="/ A C /" data-type="segment" x1="78.0" y1="108.0" x2="78.0" y2="40.0" class="geom-line" />
    <line id="el-seg-OB" data-ref="/ O B /" data-aliases="/ B O / | / O D B /" data-type="segment" x1="336.0" y1="110.0" x2="336.0" y2="20.0" class="geom-line" />
    <line id="el-seg-OD" data-ref="/ O D /" data-aliases="/ D O /" data-type="segment" x1="336.0" y1="110.0" x2="336.0" y2="36.0" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-cir-CA" data-ref="( C A )" data-aliases="( A C )" cx="78.0" cy="108.0" r="68.0" class="geom-circle geom-overlay" />
    <circle id="hl-cir-OB" data-ref="( O B )" data-aliases="( B O )" cx="336.0" cy="110.0" r="90.0" class="geom-circle geom-overlay" />
    <circle id="hl-cir-OD" data-ref="( O D )" data-aliases="( D O )" cx="336.0" cy="110.0" r="74.0" class="geom-circle geom-overlay" />

    <polygon id="hl-poly-CA" data-ref="&lt; C A &gt;" points="51.98,45.18 104.02,45.18 140.82,81.98 140.82,134.02 104.02,170.82 51.98,170.82 15.18,134.02 15.18,81.98" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-OB" data-ref="&lt; O B &gt;" points="301.56,26.85 370.44,26.85 419.15,75.56 419.15,144.44 370.44,193.15 301.56,193.15 252.85,144.44 252.85,75.56" class="geom-polygon geom-overlay" />

    <line id="hl-seg-CA" data-ref="/ C A /" data-aliases="/ A C /" x1="78.0" y1="108.0" x2="78.0" y2="40.0" class="geom-line geom-overlay" />
    <line id="hl-seg-OB" data-ref="/ O B /" data-aliases="/ B O / | / O D B /" x1="336.0" y1="110.0" x2="336.0" y2="20.0" class="geom-line geom-overlay" />
    <line id="hl-seg-OD" data-ref="/ O D /" data-aliases="/ D O /" x1="336.0" y1="110.0" x2="336.0" y2="36.0" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="78.0" cy="40.0" r="3.0" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="78.0" cy="108.0" r="3.0" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="336.0" cy="20.0" r="3.0" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="336.0" cy="36.0" r="3.0" class="geom-point" />
    <circle id="el-pt-O" data-ref="O" data-type="point" cx="336.0" cy="110.0" r="3.0" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="78.0" y="28.0" class="geom-label">A</text>
    <text id="lbl-C" data-ref="C" x="78.0" y="121.0" class="geom-label">C</text>
    <text id="lbl-B" data-ref="B" x="336.0" y="9.0" class="geom-label">B</text>
    <text id="lbl-D" data-ref="D" x="344.0" y="46.0" class="geom-label">D</text>
    <text id="lbl-O" data-ref="O" x="336.0" y="123.0" class="geom-label">O</text>
  </g>
</svg>
