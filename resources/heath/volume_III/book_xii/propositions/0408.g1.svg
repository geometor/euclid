    .label { font-family: "Times New Roman", Times, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label:hover { fill: #0284c7; font-weight: bold; cursor: pointer; }
  </style>
