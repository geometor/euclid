<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 466 395" width="466" height="395" class="euclid-graphic" data-graphic-id="0439.g1" data-folio="0439" data-graphic="g1" data-proposition="XII.18">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line, .geom-circle {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .wedge, .angle {
      fill: #ef4444;
      fill-opacity: 0.24;
      stroke: #ef4444;
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 14px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active,
    path.wedge.geom-highlight-active, path.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 4.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements (Spheres) -->
  <g id="elements">
    <circle id="el-cir-ABC" data-ref="( A B C )" data-aliases="&lt; A B C &gt; | ( B C )" data-type="circle" cx="90.2" cy="92.0" r="69.2" class="geom-circle" />
    <circle id="el-cir-DEF" data-ref="( D E F )" data-aliases="&lt; D E F &gt; | ( E F )" data-type="circle" cx="360.8" cy="105.0" r="83.8" class="geom-circle" />
    <circle id="el-cir-GHK" data-ref="( G H K )" data-aliases="&lt; G H K &gt; | ( H K )" data-type="circle" cx="360.8" cy="105.0" r="73.8" class="geom-circle" />
    <circle id="el-cir-LMN" data-ref="( L M N )" data-aliases="&lt; L M N &gt; | ( M N )" data-type="circle" cx="228.8" cy="286.8" r="96.8" class="geom-circle" />
  </g>

  <!-- Constructed Graphics (Diameters & Sub-Segments) -->
  <g id="graphics">
    <line id="el-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" data-type="segment" x1="21.0" y1="92.0" x2="159.4" y2="92.0" class="geom-line" />

    <line id="el-seg-EH" data-ref="/ E H /" data-aliases="/ H E /" data-type="segment" x1="277.0" y1="105.0" x2="287.0" y2="105.0" class="geom-line" />
    <line id="el-seg-HK" data-ref="/ H K /" data-aliases="/ K H /" data-type="segment" x1="287.0" y1="105.0" x2="434.6" y2="105.0" class="geom-line" />
    <line id="el-seg-KF" data-ref="/ K F /" data-aliases="/ F K /" data-type="segment" x1="434.6" y1="105.0" x2="444.6" y2="105.0" class="geom-line" />
    <line id="el-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" data-type="segment" x1="277.0" y1="105.0" x2="444.6" y2="105.0" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-cir-ABC" data-ref="( A B C )" data-aliases="&lt; A B C &gt; | ( B C )" cx="90.2" cy="92.0" r="69.2" class="geom-circle geom-overlay" />
    <circle id="hl-cir-DEF" data-ref="( D E F )" data-aliases="&lt; D E F &gt; | ( E F )" cx="360.8" cy="105.0" r="83.8" class="geom-circle geom-overlay" />
    <circle id="hl-cir-GHK" data-ref="( G H K )" data-aliases="&lt; G H K &gt; | ( H K )" cx="360.8" cy="105.0" r="73.8" class="geom-circle geom-overlay" />
    <circle id="hl-cir-LMN" data-ref="( L M N )" data-aliases="&lt; L M N &gt; | ( M N )" cx="228.8" cy="286.8" r="96.8" class="geom-circle geom-overlay" />

    <line id="hl-seg-BC" data-ref="/ B C /" data-aliases="/ C B /" x1="21.0" y1="92.0" x2="159.4" y2="92.0" class="geom-line geom-overlay" />
    <line id="hl-seg-HK" data-ref="/ H K /" data-aliases="/ K H /" x1="287.0" y1="105.0" x2="434.6" y2="105.0" class="geom-line geom-overlay" />
    <line id="hl-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" x1="277.0" y1="105.0" x2="444.6" y2="105.0" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="90.2" cy="22.8" r="2.8" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="21.0" cy="92.0" r="2.8" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="159.4" cy="92.0" r="2.8" class="geom-point" />

    <circle id="el-pt-D" data-ref="D" data-type="point" cx="392.0" cy="27.2" r="2.8" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="382.0" cy="34.3" r="2.8" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="277.0" cy="105.0" r="2.8" class="geom-point" />
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="287.0" cy="105.0" r="2.8" class="geom-point" />
    <circle id="el-pt-K" data-ref="K" data-type="point" cx="434.6" cy="105.0" r="2.8" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="444.6" cy="105.0" r="2.8" class="geom-point" />

    <circle id="el-pt-L" data-ref="L" data-type="point" cx="228.8" cy="190.0" r="2.8" class="geom-point" />
    <circle id="el-pt-M" data-ref="M" data-type="point" cx="132.0" cy="286.8" r="2.8" class="geom-point" />
    <circle id="el-pt-N" data-ref="N" data-type="point" cx="325.6" cy="286.8" r="2.8" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="90.2" y="12.0" class="geom-label">A</text>
    <text id="lbl-B" data-ref="B" x="11.0" y="92.0" class="geom-label">B</text>
    <text id="lbl-C" data-ref="C" x="169.0" y="92.0" class="geom-label">C</text>

    <text id="lbl-D" data-ref="D" x="401.0" y="18.0" class="geom-label">D</text>
    <text id="lbl-G" data-ref="G" x="382.0" y="46.0" class="geom-label">G</text>
    <text id="lbl-E" data-ref="E" x="267.0" y="105.0" class="geom-label">E</text>
    <text id="lbl-H" data-ref="H" x="296.0" y="97.0" class="geom-label" style="font-size: 13px;">H</text>
    <text id="lbl-K" data-ref="K" x="425.0" y="97.0" class="geom-label" style="font-size: 13px;">K</text>
    <text id="lbl-F" data-ref="F" x="454.0" y="105.0" class="geom-label">F</text>

    <text id="lbl-L" data-ref="L" x="228.8" y="178.0" class="geom-label">L</text>
    <text id="lbl-M" data-ref="M" x="120.0" y="286.8" class="geom-label">M</text>
    <text id="lbl-N" data-ref="N" x="336.0" y="286.8" class="geom-label">N</text>
  </g>
</svg>
