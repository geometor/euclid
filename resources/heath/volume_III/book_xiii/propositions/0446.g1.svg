<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 36" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.3; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .geom:hover { stroke: #0284c7; stroke-width: 2.5; cursor: pointer; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label:hover { fill: #0284c7; font-weight: bold; cursor: pointer; }
  </style>
  <rect class="bg" width="230" height="36" />
  <line class="line geom" x1="23" y1="25" x2="215" y2="25" />
  <line class="line geom" x1="23" y1="21" x2="23" y2="29" />
  <line class="line geom" x1="86" y1="21" x2="86" y2="29" />
  <line class="line geom" x1="166" y1="21" x2="166" y2="29" />
  <line class="line geom" x1="215" y1="21" x2="215" y2="29" />
  <text class="label" x="23" y="12">D</text>
  <text class="label" x="86" y="12">A</text>
  <text class="label" x="166" y="12">C</text>
  <text class="label" x="215" y="12">B</text>
</svg>
