<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 36" width="230" height="36" class="euclid-graphic" data-graphic-id="0446.g1" data-folio="0446" data-graphic="g1" data-proposition="XIII.1">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 4.5 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-DB" data-ref="[ D B ]" data-type="line" x1="23" y1="25" x2="215" y2="25" class="geom-line" />
    <line id="el-tick-D" x1="23" y1="21" x2="23" y2="29" class="geom-line" />
    <line id="el-tick-A" x1="86" y1="21" x2="86" y2="29" class="geom-line" />
    <line id="el-tick-C" x1="166" y1="21" x2="166" y2="29" class="geom-line" />
    <line id="el-tick-B" x1="215" y1="21" x2="215" y2="29" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Segments) -->
  <g id="graphics">
    <line id="el-seg-DA" data-ref="/ D A /" data-aliases="/ A D /" data-type="segment" x1="23" y1="25" x2="86" y2="25" class="geom-line" />
    <line id="el-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" data-type="segment" x1="86" y1="25" x2="166" y2="25" class="geom-line" />
    <line id="el-seg-CB" data-ref="/ C B /" data-aliases="/ B C /" data-type="segment" x1="166" y1="25" x2="215" y2="25" class="geom-line" />
    <line id="el-seg-DC" data-ref="/ D C /" data-aliases="/ C D / | / D A C /" data-type="segment" x1="23" y1="25" x2="166" y2="25" class="geom-line geom-overlay" />
    <line id="el-seg-AB" data-ref="/ A B /" data-aliases="/ B A / | / A C B /" data-type="segment" x1="86" y1="25" x2="215" y2="25" class="geom-line geom-overlay" />
    <line id="el-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" data-type="segment" x1="23" y1="25" x2="215" y2="25" class="geom-line geom-overlay" />
  </g>

  <!-- Dedicated Highlight Overlays -->
  <g id="highlights" style="pointer-events: none;">
    <line id="hl-seg-DA" data-ref="/ D A /" data-aliases="/ A D /" x1="23" y1="25" x2="86" y2="25" class="geom-line geom-overlay" />
    <line id="hl-seg-AC" data-ref="/ A C /" data-aliases="/ C A /" x1="86" y1="25" x2="166" y2="25" class="geom-line geom-overlay" />
    <line id="hl-seg-CB" data-ref="/ C B /" data-aliases="/ B C /" x1="166" y1="25" x2="215" y2="25" class="geom-line geom-overlay" />
    <line id="hl-seg-DC" data-ref="/ D C /" data-aliases="/ C D / | / D A C /" x1="23" y1="25" x2="166" y2="25" class="geom-line geom-overlay" />
    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A / | / A C B /" x1="86" y1="25" x2="215" y2="25" class="geom-line geom-overlay" />
    <line id="hl-seg-DB" data-ref="/ D B /" data-aliases="/ B D /" x1="23" y1="25" x2="215" y2="25" class="geom-line geom-overlay" />
  </g>

  <!-- Points -->
  <g id="points">
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="23" cy="25" r="2.8" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="86" cy="25" r="2.8" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="166" cy="25" r="2.8" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="215" cy="25" r="2.8" class="geom-point" />
  </g>

  <!-- Labels -->
  <g id="labels">
    <text id="lbl-D" data-ref="D" x="23" y="11" class="geom-label">D</text>
    <text id="lbl-A" data-ref="A" x="86" y="11" class="geom-label">A</text>
    <text id="lbl-C" data-ref="C" x="166" y="11" class="geom-label">C</text>
    <text id="lbl-B" data-ref="B" x="215" y="11" class="geom-label">B</text>
  </g>
</svg>
