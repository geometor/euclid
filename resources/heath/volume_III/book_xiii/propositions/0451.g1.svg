    <line id="el-seg-FG" data-ref="/ F G /" data-aliases="/ G F /" data-type="segment" x1="158" y1="120" x2="158" y2="248" class="geom-line" />
    <line id="el-seg-AG" data-ref="/ A G /" data-aliases="/ G A /" data-type="segment" x1="22" y1="248" x2="158" y2="248" class="geom-line" />
  </g>

