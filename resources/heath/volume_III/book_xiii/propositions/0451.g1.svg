    <line id="hl-seg-AB" data-ref="/ A B /" data-aliases="/ B A / | / A C B /" x1="22" y1="248" x2="22" y2="25" class="geom-line geom-overlay" />
    <line id="hl-seg-CE" data-ref="/ C E /" data-aliases="/ E C /" x1="22" y1="120" x2="110" y2="120" class="geom-line geom-overlay" />
    <line id="hl-seg-EF" data-ref="/ E F /" data-aliases="/ F E /" x1="110" y1="120" x2="158" y2="120" class="geom-line geom-overlay" />
    <line id="hl-seg-CF" data-ref="/ C F /" data-aliases="/ F C / | / C E F /" x1="22" y1="120" x2="158" y2="120" class="geom-line geom-overlay" />
    <line id="hl-seg-DF" data-ref="/ D F /" data-aliases="/ F D /" x1="22" y1="184" x2="158" y2="120" class="geom-line geom-overlay" />
