<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 173 265" width="173" height="265" class="euclid-graphic" data-graphic-id="0451.g1" data-folio="0451" data-graphic="g1" data-proposition="XIII.3">
  <style>
    .euclid-graphic {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-style: italic;
      background-color: #ffffff;
    }
    .geom-line {
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: #000000;
      fill-opacity: 0.03;
      stroke: none;
      transition: fill-opacity 0.15s;
    }
    .geom-point {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 1;
    }
    .geom-label {
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: #ef4444 !important;
      stroke-width: 3.5 !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      fill: #ef4444 !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: #ef4444 !important;
      stroke: #ef4444 !important;
      stroke-width: 2.5 !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      r: 5.0 !important;
      fill: #ef4444 !important;
      stroke: #ffffff !important;
      stroke-width: 1.5 !important;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Base Construction Elements -->
  <g id="elements">
    <line id="el-line-BA" x1="22" y1="25" x2="22" y2="248" class="geom-line" />
    <line id="el-line-BT" x1="22" y1="25" x2="110" y2="25" class="geom-line" />
    <line id="el-line-TH" x1="110" y1="25" x2="110" y2="248" class="geom-line" />
    <line id="el-line-CF" x1="22" y1="120" x2="158" y2="120" class="geom-line" />
    <line id="el-line-FG" x1="158" y1="120" x2="158" y2="248" class="geom-line" />
    <line id="el-line-AG" x1="22" y1="248" x2="158" y2="248" class="geom-line" />
    <line id="el-line-DF" x1="22" y1="184" x2="158" y2="120" class="geom-line" />
  </g>

  <!-- Constructed Graphics (Polygons & Segments) -->
  <g id="graphics">
    <polygon id="el-poly-BTEC" data-ref="&lt; B E &gt;" data-aliases="&lt; E B &gt; | &lt; B T E C &gt;" data-type="polygon" points="22,25 110,25 110,120 22,120" class="geom-polygon" />
    <polygon id="el-poly-CFGA" data-ref="&lt; C G &gt;" data-aliases="&lt; G C &gt; | &lt; C F G A &gt;" data-type="polygon" points="22,120 158,120 158,248 22,248" class="geom-polygon" />
