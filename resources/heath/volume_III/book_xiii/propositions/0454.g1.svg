<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 219 36" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.3; stroke-dasharray: 4,3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .geom:hover { stroke: #0284c7; stroke-width: 2.5; cursor: pointer; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 15px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; user-select: none; }
    .label:hover { fill: #0284c7; font-weight: bold; cursor: pointer; }
  </style>
  <rect class="bg" width="219" height="36" />
  <line class="line geom" x1="12" y1="26" x2="211" y2="26" />
  <line class="line geom" x1="12" y1="22" x2="12" y2="30" />
  <line class="line geom" x1="78" y1="22" x2="78" y2="30" />
  <line class="line geom" x1="156" y1="22" x2="156" y2="30" />
  <line class="line geom" x1="211" y1="22" x2="211" y2="30" />
  <text class="label" x="12" y="13">D</text>
  <text class="label" x="78" y="13">A</text>
  <text class="label" x="156" y="13">C</text>
  <text class="label" x="211" y="13">B</text>
</svg>
